const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<tr><td>Prompt dài, nhiều khối tĩnh, chi phí token quan trọng</td><td>Quy tắc có khái niệm khó dịch (xưng hô "anh/chị/em", "dạ", mức độ lịch sự)</td></tr></table></div>
<p>Thường chạy tốt: chỉ dẫn cấu trúc bằng tiếng Anh; ví dụ, quy tắc xưng hô và giọng văn bằng tiếng Việt. Quyết định dựa trên eval cho cả hai phiên bản.</p>
<h4>Chi tiết riêng của tiếng Việt</h4>
<ul><li>Xưng hô là một phần của prompt; khi không biết giới tính, quy định cách xưng hô trung tính.</li><li>Định dạng số và ngày (<code>1.000.000 đ</code> hay <code>1,000,000 VND</code>; <code>06/11/2026</code> hay <code>2026-11-06</code>): quy định trong prompt, kiểm tra bằng code.</li><li>Viết tắt, teencode ("ko", "đc", "sp", "ib") có trong bộ test.</li></ul>
<div class="verdict"><b>Bảng lỗi §3.7 và checklist §3.8</b> có đầy đủ trong phần tương tác phía trên: tra theo triệu chứng, tick theo ba giai đoạn viết, đưa vào production, thay đổi.</div>`,
    why: {
      c: 'Chuẩn hoá NFC ở mọi ranh giới; đo token bằng tokenizer của đúng provider trên dữ liệu thật; quy tắc ngôn ngữ cụ thể kèm ví dụ tiếng Việt; ca test ngôn ngữ output có loại riêng output chỉ gồm số và mã.',
      s: 'Viết không dấu để tiết kiệm: không rẻ hơn với o200k_base (chỉ rẻ hơn với tokenizer cũ cl100k_base), lại mất nghĩa. Tin con số "tiếng Việt tốn gấp đôi" trên mạng: thường từ tokenizer cũ. "Trả lời bằng ngôn ngữ của khách": vô dụng khi chính ngôn ngữ của khách bị đoán sai. Pass/fail theo tỷ lệ ký tự có dấu: đánh trượt câu trả lời chỉ có số tiền.',
      p: 'Phải duy trì hai bản prompt để eval khi cân nhắc đổi ngôn ngữ chỉ dẫn. Ca test ngôn ngữ cần grader đã kiểm tra trên output thật. Prompt tiếng Việt vẫn tốn hơn tiếng Anh khoảng 1,28× với o200k_base.'
    },
    deep: [
      {
        q: 'Cùng một ý, sao tiếng Việt lại tốn nhiều token hơn tiếng Anh?',
        a: `<p>Vì tokenizer được <b>học từ dữ liệu</b>. Thuật toán gộp dần những chuỗi ký tự hay đi cùng nhau thành một token. Dữ liệu học có nhiều tiếng Anh thì "warranty", "delivery" đủ phổ biến để thành một token. Tiếng Việt ít hơn trong dữ liệu, nên nhiều âm tiết bị cắt thành vài mẩu.</p>
<p>Mức chênh có thể rất lớn: Petrov và cộng sự (NeurIPS 2023) thấy cùng nội dung dịch sang các ngôn ngữ khác nhau chênh tới khoảng 15 lần số token, tuỳ tokenizer. Với tiếng Việt và tokenizer hiện tại, README ghi rằng chưa có nghiên cứu có phản biện nào đưa ra con số cụ thể, nên bảng 1,28× ở trên là một lần đo trên một đoạn prompt khoảng 80 từ, không phải hằng số.</p>
<p>Hệ quả: đừng dùng tỷ lệ chung. Đo trên chính prompt của bạn, bằng tokenizer của đúng provider.</p>`,
        take: 'Số token phụ thuộc tokenizer và dữ liệu nó đã học. Tỷ lệ của người khác không phải tỷ lệ của bạn.'
      },
      {
        q: 'Vậy sao tokenizer mới lại thu hẹp khoảng cách nhiều thế?',
        a: `<p>Tokenizer mới học thêm nhiều âm tiết tiếng Việt có dấu thành token riêng. So cùng đoạn prompt ở hai tokenizer của OpenAI (số từ README):</p>`,
        viz(box) {
          const rows = [];
          SAMPLES.forEach(([k, name, , n]) => { rows.push([name + ' · cl100k', n.cl100k / 98, false]); rows.push([name + ' · o200k', n.o200k / 96, true]); });
          box.append(bar(rows, 4.5, (v) => r2(v) + '×'), el('div', { class: 'cap', text: 'Tỷ lệ so với bản tiếng Anh của cùng tokenizer. Thanh đậm: o200k_base (GPT-4o trở đi). Tiếng Việt NFC từ 2,13× xuống 1,28×; NFD vẫn trên 3×.' }));
        },
        take: 'Con số "tiếng Việt tốn gấp đôi" lan truyền trên mạng thường đến từ tokenizer cũ. Với Claude và Gemini, đo bằng API đếm token của provider.'
      },
      {
        q: 'Nếu bỏ dấu thì chữ toàn ASCII, chắc phải rẻ hơn chứ?',
        a: `<p>Không, ít nhất với <code>o200k_base</code>: bản không dấu tốn 137 token so với 123 của bản có dấu. Lý do: tokenizer đã học âm tiết có dấu phổ biến như "hàng", "được" thành một token; còn "hang", "duoc" không dấu là chuỗi ít gặp hơn trong dữ liệu tiếng Việt nên bị cắt vụn.</p>
<p>Nhưng kết luận này <b>đảo chiều với tokenizer cũ</b> <code>cl100k_base</code>: không dấu 160 token, có dấu 209. Chuyện gì xảy ra: cùng hai đoạn văn, tokenizer này cho kết quả ngược với o200k. Vì sao: cl100k chưa học nhiều âm tiết có dấu (cùng bản có dấu, nó tốn 209 token so với 123 của o200k), nên chữ có dấu bị cắt vụn còn tệ hơn chữ không dấu. Không có nghĩa là: không có nghĩa nên bỏ dấu khi dùng model đời cũ, vì nghĩa vẫn mất như dưới đây. Trong hệ thống thật: đo trên đúng tokenizer của model đang dùng, đừng mang kết luận của tokenizer này sang tokenizer khác.</p>
<p>Và bỏ dấu làm mất nghĩa. Gõ một câu vào ô dưới, trình duyệt bỏ dấu từng từ và tìm những từ khác nhau bị gộp thành một.</p>`,
        viz(box) {
          const inp = el('input', { type: 'text', value: 'Bạn muốn bán bàn này à? Đơn đã được giao, đổi trả trong 30 ngày, bảo hành ở mọi chi nhánh.', style: 'width:100%;font:13px var(--mono);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)' });
          const out = el('div'), cap = el('div', { class: 'cap' });
          const EXTRA = ['bàn', 'bán', 'bạn', 'ban', 'đơn', 'dơn', 'hàng', 'háng', 'hạng', 'giao', 'giáo', 'đổi', 'đội', 'bảo', 'báo', 'bão'];
          function draw() {
            const words = [...new Set((inp.value.match(/\p{L}+/gu) || []).map((w) => w.toLowerCase()))];
            const groups = {};
            words.concat(EXTRA).forEach((w) => { const k = strip(w).toLowerCase(); (groups[k] = groups[k] || new Set()).add(w); });
            const hits = words.map((w) => strip(w).toLowerCase()).filter((k, i, a) => a.indexOf(k) === i && groups[k].size > 1);
            out.innerHTML = hits.length ? '<div class="tbl"><table><tr><th>Không dấu</th><th>Có thể là</th></tr>' + hits.map((k) => '<tr><td class="mono">' + k + '</td><td>' + [...groups[k]].join(', ') + '</td></tr>').join('') + '</table></div>' : '<p class="hint">Không có từ nào trong câu bị trùng sau khi bỏ dấu.</p>';
            cap.innerHTML = 'Câu không dấu: <span class="mono">' + esc(strip(inp.value)) + '</span><br>' + hits.length + ' từ trong câu trùng với từ khác sau khi bỏ dấu (so với câu của bạn và một danh sách nhỏ từ hay gặp).';
          }
          inp.addEventListener('input', draw);
          box.append(inp, out, cap);
          draw();
        },
        take: 'Viết không dấu không rẻ hơn với tokenizer mới (chỉ rẻ hơn với cl100k cũ), và luôn làm model phải đoán nghĩa. Giữ tiếng Việt có dấu.'
      },
      {
        q: 'NFD là gì mà làm số token tăng gần gấp ba?',
        a: `<p>Unicode cho phép viết một chữ có dấu theo hai cách. NFC dùng một code point đã ghép sẵn. NFD tách thành chữ gốc cộng các dấu kết hợp. Gõ một chữ hoặc một từ dưới đây để xem mã từng code point và số byte UTF-8, tính chính xác trong trình duyệt:</p>`,
        viz(box) {
          const inp = el('input', { type: 'text', value: 'ệ', style: 'width:200px;font:15px var(--mono);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)' });
          const out = el('div'), cap = el('div', { class: 'cap' });
          const row = (label, s) => '<tr><td>' + label + '</td><td class="mono" style="font-size:12px">' + [...s].map((c) => 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0') + (/\p{M}/u.test(c) ? '<span style="color:var(--warn)">*</span>' : '')).join(' ') + '</td><td class="mono">' + cps(s) + '</td><td class="mono">' + bytes(s) + '</td></tr>';
          function draw() {
            const s = inp.value.slice(0, 40), a = s.normalize('NFC'), b = s.normalize('NFD');
            out.innerHTML = '<div class="tbl"><table><tr><th>Dạng</th><th>Code point (* là dấu kết hợp)</th><th>Số code point</th><th>Byte UTF-8</th></tr>' + row('NFC', a) + row('NFD', b) + '</table></div>';
            cap.innerHTML = a === b ? 'Chuỗi này không có chữ ghép được, hai dạng giống nhau. Thử "ệ", "Nguyễn", "đường".' : 'Cùng hiển thị "' + esc(a) + '", NFD dài hơn <b>' + (cps(b) - cps(a)) + '</b> code point và <b>' + (bytes(b) - bytes(a)) + '</b> byte. Mỗi dấu kết hợp là một ký tự hiếm gặp đứng riêng, tokenizer thường phải cắt nó thành token riêng. Chữ "đ" không phân rã trong NFD.';
          }
          inp.addEventListener('input', draw);
          box.append(inp, out, cap);
          draw();
        },
        take: 'NFD trông giống hệt NFC nhưng dài hơn về code point, byte và token. Tên file trên macOS, copy từ một số PDF và bộ gõ cũ hay sinh ra NFD.'
      },
      {
        q: 'Ngoài tiền token, NFD còn làm hỏng gì?',
        a: `<p>Ba thứ, đều âm thầm: prompt cache (khác byte nên khác prefix), so khớp chuỗi trong eval, và có thể cả chất lượng vì model ít thấy dạng này lúc huấn luyện. Ví dụ ca test kiểm tra "output có chứa cụm <code>bảo hành 12 tháng</code>". Output của model là NFC, nhưng chuỗi mong đợi trong file test được gõ trên máy lưu NFD:</p>`,
        viz(box) {
          const output = 'Dạ, tai nghe Pro X được bảo hành 12 tháng ạ.';
          const expNFD = 'bảo hành 12 tháng'.normalize('NFD');
          const out = el('div');
          const fix = el('button', { text: 'Chuẩn hoá NFC cả hai phía', onclick: () => { st = !st; draw(); } });
          let st = false;
          function draw() {
            const e = st ? expNFD.normalize('NFC') : expNFD, o = st ? output.normalize('NFC') : output;
            const ok = o.includes(e);
            fix.classList.toggle('on', st);
            out.innerHTML = '<div class="tbl"><table><tr><td>Output</td><td>' + esc(o) + '</td><td class="mono">' + bytes(o) + ' byte</td></tr><tr><td>Chuỗi mong đợi</td><td>' + esc(e) + '</td><td class="mono">' + bytes(e) + ' byte</td></tr><tr><td>output.includes(mong đợi)</td><td colspan="2"><b class="' + (ok ? 'ok' : 'bad') + '">' + ok + '</b>' + (ok ? '' : ' <span class="bad">Ca test trượt dù câu trả lời đúng.</span>') + '</td></tr></table></div>';
          }
          box.append(fix, out, el('div', { class: 'cap', text: 'Cùng cơ chế: một system prompt lưu NFD và một bản lưu NFC là hai prefix khác nhau với prompt cache, dù diff bằng mắt không thấy gì (xem bài 7).' }));
          draw();
        },
        take: 'Chuẩn hoá NFC ở ranh giới hệ thống (s.normalize("NFC")): input người dùng, tài liệu ingest, file template, và cả file test.'
      },
      {
        q: 'Prompt đã dặn "trả lời bằng ngôn ngữ của khách". Sao bot vẫn trả lời tiếng Anh?',
        a: `<p>Marchisio và cộng sự (EMNLP 2024) gọi hiện tượng này là <i>language confusion</i> và đo trên 15 ngôn ngữ: ngay cả model mạnh nhất cũng không ổn định hoàn toàn; prompt phức tạp và temperature cao làm tệ hơn; few-shot đúng ngôn ngữ đích giúp giảm một phần.</p>
<p>Câu "ngôn ngữ của khách" có một lỗ hổng: nó giả định model nhận ra ngôn ngữ của khách. Với "don cua em toi dau roi a", tín hiệu tiếng Việt rất yếu. Trong production tiếng Việt, ba dạng hay gặp:</p>
<ol><li>System prompt tiếng Anh, khách viết không dấu → trả lời tiếng Anh.</li><li>Tài liệu retrieve bằng tiếng Anh → trộn câu hoặc thuật ngữ tiếng Anh.</li><li>Hội thoại dài → lượt đầu đúng, lượt sau trôi dần sang tiếng Anh.</li></ol>
<p>Quy tắc hiệu quả nói rõ trường hợp khó: "${LANG_RULE}"</p>`,
        take: 'Viết quy tắc ngôn ngữ cho đúng trường hợp khó (không dấu, tài liệu tiếng Anh), thêm ví dụ tiếng Việt, và test ngôn ngữ output.'
      },
      {
        q: 'Kiểm tra ngôn ngữ output bằng code: đếm ký tự có dấu là xong?',
        a: `<p>Đếm tỷ lệ ký tự có dấu rất rẻ, nhưng nó không phân biệt được "không phải tiếng Việt" với "không có chữ". Bảng dưới chấm 5 output của bot bằng hai luật: luật ngây thơ (tỷ lệ bằng 0 là trượt) và luật của README (loại riêng output chỉ có số, mã; tỷ lệ thấp chỉ là tín hiệu để xem lại).</p>`,
        viz(box) {
          const OUTS = ['Dạ, đơn SV-4821 đang được giao ạ.', 'Here is the status of your order SV-4821.', '1,000,000 VND', 'SV-4821', 'Dạ, theo return policy thì unopened được refund trong 30 days ạ.'];
          const rows = OUTS.map((o) => { const c = langCheck(o); return '<tr><td>' + esc(o) + '</td><td class="mono">' + Math.round(c.ratio * 100) + '%</td><td class="' + (c.naive === 'fail' ? 'bad' : 'ok') + '">' + c.naive + '</td><td>' + c.better + '</td></tr>'; });
          box.innerHTML = '<div class="tbl"><table><tr><th>Output</th><th>Ký tự có dấu / chữ cái</th><th>Luật ngây thơ</th><th>Luật README</th></tr>' + rows.join('') + '</table></div><div class="cap"><span class="bad">Luật ngây thơ đánh trượt "1,000,000 VND" và "SV-4821" giống hệt "Here is the status...", dù chỉ ca thứ hai là lỗi.</span> Câu trộn tiếng Anh ở dòng cuối lại qua được cả hai luật vì vẫn có chữ có dấu: cần grader ngôn ngữ đã được kiểm tra trên chính output của bạn.</div>';
        },
        take: 'Tỷ lệ ký tự có dấu chỉ để lọc ca cần xem lại. Pass/fail cần bộ phát hiện ngôn ngữ hoặc grader đã kiểm tra trên dữ liệu thật, và loại riêng output chỉ gồm số, mã.'
      },
      {
        q: 'Rốt cuộc nên viết chỉ dẫn bằng tiếng Anh hay tiếng Việt?',
        a: `<p>Không có câu trả lời chung. Nghiên cứu cho thấy model suy luận tốt hơn khi tự dịch input sang tiếng Anh rồi giải, và một nghiên cứu năm 2025 xác nhận model thường suy luận tốt nhất bằng tiếng Anh, nhưng bước dịch cũng có thể gây lỗi. Đó là kết quả về <i>suy luận trên input</i>, không trả lời trực tiếp chuyện chỉ dẫn viết bằng gì.</p>
<p>Với bot ShopViet: output là văn bản tiếng Việt cho khách, giọng văn quan trọng ("dạ", "anh/chị"), người sửa prompt là đội nghiệp vụ Việt Nam. Ba tiêu chí nghiêng về tiếng Việt, chỉ có chi phí token nghiêng về tiếng Anh (1,28× với o200k_base). Cách kết hợp thường chạy tốt: khung cấu trúc bằng tiếng Anh, còn ví dụ, quy tắc xưng hô và giọng văn bằng tiếng Việt. Ví dụ tiếng Việt kéo output về tiếng Việt mạnh hơn bất kỳ câu chỉ dẫn nào.</p>`,
        take: 'Quyết định bằng eval trên cả hai phiên bản, không bằng cảm nhận. Chênh 1,28× token thường nhỏ hơn cái giá của một câu trả lời sai giọng.'
      },
      {
        q: 'Còn những chi tiết tiếng Việt nào hay làm hỏng output?',
        a: `<p>Xưng hô, định dạng số và ngày, viết tắt. Xưng hô là một phần của prompt: "anh/chị", "bạn", "quý khách" cho ra giọng văn rất khác nhau; khi không biết giới tính, quy định cách trung tính, đừng để model đoán từ tên. Số và ngày phải quy định trong prompt <b>và</b> kiểm tra bằng code, nhất là khi output được parse lại. Chọn quy ước của ShopViet và xem output nào trượt:</p>`,
        viz(box) {
          const OUT = ['Tổng tiền 1.250.000 đ, giao ngày 29/11/2026.', 'Total 1,250,000 VND, delivery 2026-11-29.', 'Tổng tiền 1.250.000đ, giao ngày 29/11.', 'Tổng tiền 1250000 đồng, giao 29-11-2026.'];
          const RULES = { vn: { money: /\d{1,3}(\.\d{3})+ đ(?!\p{L})/u, date: /\b\d{2}\/\d{2}\/\d{4}\b/, label: '1.000.000 đ và dd/mm/yyyy' }, iso: { money: /\d{1,3}(,\d{3})+ VND/, date: /\b\d{4}-\d{2}-\d{2}\b/, label: '1,000,000 VND và yyyy-mm-dd' } };
          const out = el('div');
          const s = select('Quy ước trong prompt', [['vn', RULES.vn.label], ['iso', RULES.iso.label]], 'vn', draw);
          function draw() {

          }
          box.append(s.node, out, el('div', { class: 'cap', text: 'Dòng 3 và 4 trông "gần đúng" với người đọc nhưng làm hỏng code parse lại số tiền hay ngày. Regex ở đây là ví dụ đơn giản cho quy ước đã chọn.' }));

}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
