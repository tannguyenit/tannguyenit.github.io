const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

            el('span', { class: 'mono', style: 'color:var(--mute);font-size:11px', text: String(i + 1) }), el('span', { style: 'flex:1;min-width:160px', text: e.text }), el('span', { html: tag(e.label) }),
            el('button', { text: 'Lên', onclick: () => move(i, -1) }), el('button', { text: 'Xuống', onclick: () => move(i, 1) }), el('button', { text: 'Bỏ', onclick: () => { st.ids.splice(i, 1); draw(); } })]))
            : [el('p', { class: 'hint', text: 'Chưa có ví dụ nào: đây là zero-shot.' })]));

        const flags = [];
        if (a.majority && a.imbalance >= 0.5 && a.n >= 3) flags.push(pill(`đa số: ${a.majority} ${a.maxN}/${a.n}`, 'var(--bad)'));
        if (a.n && a.missing.length) flags.push(pill('thiếu nhãn: ' + a.missing.join(', '), 'var(--bad)'));
        if (a.tail >= 2) flags.push(pill(`${a.tail} ví dụ cuối cùng nhãn ${a.last}`, 'var(--warn)'));
        a.spur.forEach((s) => flags.push(pill(`${s.name} → luôn ${s.lab}`, s.sev === 'bad' ? 'var(--bad)' : 'var(--warn)')));
        distBox.replaceChildren(el('h4', { style: 'margin:14px 0 4px;font-size:13px', text: 'Phân phối nhãn trong ví dụ' }),
          hbars(LABELS.map((l) => [`${l} (${LNAME[l]})`, a.dist[l], l === test.label]), { max: Math.max(1, a.maxN), fmt: (v) => v + (a.n ? ' (' + Math.round((v / a.n) * 100) + '%)' : '') }),
          el('div', { style: 'margin-top:4px', html: flags.length ? flags.join('') : pill('không phát hiện lệch về nhãn', 'var(--ok)') }));

        const sorted = a.sims.slice().sort((x, y) => y.sim - x.sim);
        surfBox.innerHTML = a.n ? `<h4 style="margin:14px 0 4px;font-size:13px">Độ giống bề mặt với "${esc(test.text)}" (công thức minh hoạ)</h4><div class="tbl"><table><tr><th>Ví dụ</th><th>Nhãn</th><th>Điểm</th><th>Đặc điểm chung</th></tr>` +
          sorted.map((x, k) => `<tr class="${k === 0 ? 'cur' : ''}"><td>${esc(x.e.text)}</td><td>${tag(x.e.label)}</td><td class="mono">${x.sim.toFixed(2)}</td><td>${esc(x.shared.join(', ') || '—')}</td></tr>`).join('') + '</table></div><div class="hint">Điểm = 0,35 × cùng có mã đơn + 0,25 × cùng kiểu dấu + 0,15 × cùng nhóm độ dài (≤ 6 từ) + 0,25 × tỷ lệ từ chung. Trọng số tự đặt để minh hoạ.</div>' : '';

        const H = a.n ? [
          ['nhãn đa số', a.majority, a.majority !== null && a.imbalance >= 0.5, a.majority === null ? 'không có: các nhãn nhiều nhất bằng nhau' : a.imbalance >= 0.5 ? '' : 'đa số mỏng, lực kéo yếu'],
          ['nhãn ví dụ cuối', a.last, a.tail >= 2, a.tail >= 2 ? '' : 'chỉ 1 ví dụ cuối mang nhãn này, lực kéo yếu'],
          ['nhãn ví dụ giống bề mặt nhất', a.near.e.label, true, '']] : [];
        lazy.innerHTML = a.n ? `<h4 style="margin:14px 0 4px;font-size:13px">Nếu model chỉ chép...</h4><div class="tbl"><table>${H.map(([n, l, strong, note]) => `<tr><td>${n}</td><td>${l ? tag(l) : '—'}</td><td class="${!l ? '' : l === test.label ? 'ok' : strong ? 'bad' : ''}" style="${l && l !== test.label && !strong ? 'color:var(--warn)' : ''}">${!l ? note : l === test.label ? 'trùng nhãn đúng' : strong ? 'sai' : 'khác nhãn đúng; ' + note}</td></tr>`).join('')}</table></div>` : '';

        const parts = [];
        const wrongH = H.filter((h) => h[1] && h[2] && h[1] !== test.label);
        const sp = a.spur.find((s) => s.sev === 'bad');
        if (sp) parts.push(box('var(--bad)', `<b>Tương quan giả: cả ${sp.n} ví dụ ${sp.name} đều là ${sp.lab}.</b> Tin test cũng ${sp.name} nhưng nhãn đúng là ${test.label}. Vì sao: trong bộ ví dụ này, "${sp.name}" đi cùng duy nhất một nhãn, nên nó trông như một quy tắc; model lấy hình dạng từ ví dụ nhiều hơn ánh xạ (README §1.4). Không có nghĩa model chắc chắn sai: chỉ dẫn và nghĩa của câu vẫn kéo về nhãn đúng, nhưng bộ ví dụ đang kéo ngược lại. Trong hệ thống thật: thêm ví dụ ${sp.name} ở các nhãn khác (ví dụ "SV-4790 sạc không vào điện, mình muốn trả lại" cho return).`));
        if (a.missing.includes(test.label)) parts.push(box('var(--bad)', `<b>Nhãn đúng ${test.label} không có trong ví dụ nào.</b> Vì sao: không gian nhãn model thấy qua ví dụ chỉ gồm ${LABELS.filter((l) => a.dist[l]).join(', ')}; README §1.4 xếp không gian nhãn vào nhóm thứ quan trọng nhất ví dụ dạy. Không có nghĩa model không thể trả ${test.label}: chỉ dẫn có liệt kê nó. Trong hệ thống thật: phủ mọi nhãn (README Tra cứu nhanh).`));
        if (!sp && !a.missing.includes(test.label) && wrongH.length >= 2) parts.push(box('var(--warn)', `<b>${wrongH.length} lối tắt mạnh dẫn tới nhãn sai</b> (${wrongH.map((h) => h[0]).join(', ')}). Bộ ví dụ đang đẩy về ${wrongH[0][1]}, ngược với nhãn đúng. Trong hệ thống thật: cân bằng nhãn, xáo thứ tự, và so phân phối nhãn output với phân phối thật trên bộ test có nhãn.`));
        if (!sp && !a.missing.includes(test.label) && wrongH.length === 1 && wrongH[0][0].includes('bề mặt')) parts.push(box('var(--warn)', `<b>Ví dụ giống tin test nhất mang nhãn khác:</b> "${esc(a.near.e.text)}" (${a.near.e.label}), chung ${esc(a.near.shared.join(', '))}. Một ví dụ lẻ chưa thành quy tắc như tương quan giả, nhưng nếu model bám bề mặt thì đây là chỗ nó trượt. Trong hệ thống thật: đưa đúng cặp này vào bộ test có nhãn để đo, đừng đoán.`));
        if (a.n && !wrongH.length && !flags.length) parts.push(box('var(--ok)', 'Không lối tắt mạnh nào dẫn tới nhãn sai và không phát hiện lệch. Không có nghĩa model chắc chắn đúng: lab chỉ kiểm tra bộ ví dụ có đẩy sai hay không. Đổi tin nhắn test để kiểm tra bộ ví dụ trên ca khác.'));
        if (a.n && !wrongH.length && flags.length) parts.push(box('var(--warn)', 'Với tin nhắn này, các lối tắt mạnh tình cờ trùng nhãn đúng, nên trên tin này bộ ví dụ trông "chạy tốt". Lệch vẫn còn (xem viên màu ở trên); đổi tin nhắn test để thấy nó lộ ra.'));
        if (!a.n) parts.push(box('var(--line)', 'Zero-shot: không có ví dụ, nên không có thiên lệch từ ví dụ. Với nhãn tự giải thích được, thử zero-shot trước; thêm ví dụ khi eval cho thấy có ích.'));
        cap.innerHTML = parts.join('');

        const rq = reqDay.get(), staticTok = a.tokBase + a.tokEx;
        cost.innerHTML = `<h4 style="margin:14px 0 4px;font-size:13px">Chi phí token (ước lượng = số ký tự ÷ 3,3, chỉnh theo o200k_base; với prompt phân loại này ước thấp hơn số thật khoảng 8%)</h4><div class="stat"><span>Ví dụ: <b>~${a.tokEx}</b> tok</span><span>Cả prompt + tin nhắn: <b>~${a.tokAll}</b> tok / request</span><span>Gấp zero-shot: <b>${(a.tokAll / (a.tokBase + a.tokMsg)).toFixed(1)}×</b></span><span>Mỗi ngày: <b>~${(a.tokAll * rq).toLocaleString('vi-VN')}</b> tok</span><span>Nếu phần tĩnh được cache (~1/10, README §1.4): <b>~${Math.round((staticTok * 0.1 + a.tokMsg) * rq).toLocaleString('vi-VN')}</b> tok tương đương</span></div>`;
      }

      stage.append(presetRow, el('div', { class: 'row' }, [testSel.node, testLab]), pool, list, distBox, surfBox, lazy, cap, el('div', { class: 'row', style: 'margin-top:12px' }, [reqDay.node]), cost,
        el('p', { class: 'hint', text: 'Lab không gọi model. Nó đo bộ ví dụ (đếm nhãn, so đặc điểm bề mặt, đếm token) và chỉ ra nhãn mà từng lối tắt sẽ chọn; README §1.4 mô tả các lối tắt đó. 12 ví dụ và 4 tin test là dữ liệu dựng sẵn; số request mỗi ngày là giả định.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
