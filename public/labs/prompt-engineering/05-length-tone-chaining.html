const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

const ABBREVIATION_END = /(?:^|[\s(])(?:TP|Tp|Q|P|TS|ThS|PGS|GS|BS|Mr|Mrs|Dr|St|vs|[A-ZĐ])\.$/;
const countSentences = (s) => s.trim().split(/(?<=[.!?…])\s+/)

  .filter((x) => /[\p{L}\p{N}]/u.test(x)).length;

        const R = { c: 'Dạ em xin lỗi vì đơn SV-4907 giao trễ hẹn. Đơn trễ quá 3 ngày được tặng voucher 100.000 đ, em đã ghi nhận cho anh. Với hộp móp, anh chụp ảnh gửi em trong 48 giờ kể từ lúc nhận để em xử lý ạ.', a: 'Dạ, tai nghe đã mở hộp chỉ được đổi khi có lỗi nhà sản xuất, trong vòng 7 ngày kể từ ngày nhận hàng. Đơn của anh đã nhận 20 ngày nên em chuyển anh sang bảo hành 12 tháng của hãng. Em gửi hướng dẫn bảo hành ngay sau tin nhắn này ạ.', b: 'Dạ, sản phẩm của anh vẫn còn bảo hành chính hãng. Anh mang máy và hoá đơn tới trung tâm bảo hành gần nhất giúp em ạ.' };
        const DICT = ['tai nghe', 'mở hộp', 'nhà sản xuất', 'trong vòng', 'kể từ', 'nhận hàng', 'bảo hành', 'tin nhắn', 'hướng dẫn', 'sản phẩm', 'chính hãng', 'hoá đơn', 'trung tâm', 'gần nhất'];
        const out = el('div', { class: 'stat' }), txt = el('p', { style: 'font-size:13px;margin:6px 0' });
        function draw(k) {
          const s = R[k], syl = s.split(/\s+/).filter(Boolean).length;
          let words = syl; DICT.forEach((d) => { const n = s.toLowerCase().split(d).length - 1; words -= n * (d.split(' ').length - 1); });
          const sent = countSentences(s), naive = s.split(/[.!?]+/).filter((x) => x.trim()).length;
          txt.textContent = s;
          out.innerHTML = '<span>Âm tiết (đếm theo dấu cách): <b>' + syl + '</b></span><span>Từ (gộp từ ghép): <b>' + words + '</b></span><span>Câu: <b>' + sent + '</b></span><span>Câu nếu tách ở mọi dấu chấm: <b class="' + (naive !== sent ? 'bad' : '') + '">' + naive + '</b></span><span>Token ước lượng: <b>' + Math.ceil(s.length / 3.8) + '</b></span>';
        }
        box.append(el('div', { class: 'row' }, [select('Câu trả lời', [['a', 'Câu trả lời đổi trả'], ['b', 'Câu trả lời bảo hành'], ['c', 'Câu trả lời giao trễ (có 100.000 đ)']], 'a', draw).node]), txt, out,
          el('div', { class: 'cap', text: 'Cùng một văn bản cho nhiều con số "độ dài" khác nhau. "Khoảng 80 từ" không nói rõ đếm cách nào; "tối đa 3 câu" thì code kiểm tra được, miễn là code tách câu đúng. Với câu trả lời "giao trễ", tách ở mọi dấu chấm ra 4 câu và báo lỗi oan một câu trả lời đúng 3 câu.' }));
        draw('a');
      },
      take: 'Chỉ định độ dài bằng đơn vị code đếm được và model nhận biết được: câu, đoạn.'

    {
      q: 'Đổi sang model mới, câu trả lời dài hẳn ra. Chỉnh núm nào?',
      a: `<p>Mỗi provider một núm khác nhau (README §2.3):</p>
<div class="tbl"><table><tr><th>Model</th><th>Núm điều khiển độ dài</th></tr>

<tr><td>Claude Opus 5</td><td><code>effort</code> không đổi độ dài phần hiển thị một cách tin cậy; phải yêu cầu ngắn gọn ngay trong prompt</td></tr>
<tr><td>Gemini 3</td><td>Mặc định ngắn; muốn dài hơn phải yêu cầu rõ</td></tr></table></div>
<p>Với chuỗi của ShopViet, độ dài chỉ cần quy định ở bước soạn trả lời, và bước kiểm tra bằng code đếm số câu. Ở bảng chính, cài lỗi "Trả lời quá dài, có markdown" để thấy bước kiểm tra bắt nó.</p>`,
      take: 'Độ dài là hành vi mặc định của từng model. Quy định trong prompt, đo bằng code, kiểm tra lại mỗi lần đổi model.'

    {
      q: 'Đầu hội thoại bot viết văn xuôi, tới lượt 15 lại đầy gạch đầu dòng. Vì sao, và nhắc lại thế nào cho không vỡ cache?',
      a: `<p>Hướng dẫn GPT-5 ghi nhận chỉ dẫn về markdown có thể mất tác dụng sau nhiều lượt, và đề xuất nhắc lại mỗi 3–5 tin nhắn của user. Chỉ dẫn nằm ở đầu, càng nhiều lượt chen vào thì nó càng xa chỗ model đang viết.</p>
<p>Cách nhắc quan trọng không kém. Nếu sửa nội dung system prompt ở đầu, mọi byte phía sau đổi theo và cache vỡ. Trên Claude, cách tương đương mà không vỡ cache là chèn system message vào giữa hội thoại, tức nối thêm vào cuối. Kéo thanh trượt để xem cả hai cách qua 20 lượt.</p>`,
      viz(box) {
        const N = 20; let every = 4, how = 'append';

        function draw() {
          let rem = 0, breaks = 0;
          grid.replaceChildren(...Array.from({ length: N }, (_, i) => { const r = (i + 1) % every === 0; if (r) { rem++; if (how === 'edit') breaks++; } return el('span', { title: 'lượt ' + (i + 1) + (r ? ': nhắc lại' : ''), style: 'height:26px;border-radius:3px;background:' + (r ? (how === 'edit' ? 'var(--bad)' : 'var(--ok)') : 'var(--line)') }); }));
          stat.innerHTML = '<span>Số lần nhắc: <b>' + rem + '</b></span><span>Số lần prefix cache bị đổi: <b class="' + (breaks ? 'bad' : 'ok') + '">' + breaks + '</b></span><span>' + (how === 'edit' ? 'Mỗi lần nhắc viết lại đầu system prompt' : 'Mỗi lần nhắc chèn message mới ở cuối') + '</span>';

        box.append(el('div', { class: 'row' }, [slider('Nhắc mỗi', 3, 5, 1, every, (v) => { every = v; draw(); }, (v) => v + ' lượt').node, select('Cách nhắc', [['append', 'Chèn system message vào giữa hội thoại'], ['edit', 'Sửa system prompt ở đầu']], how, (v) => { how = v; draw(); }).node]), grid, stat,
          el('div', { class: 'cap', text: 'Mỗi ô là một lượt user. Ô màu là lượt có nhắc lại chỉ dẫn format. Chi tiết cơ chế cache ở tài liệu Multi-turn §2.2.' }));
        draw();

    {

        const R = [['conf', 'Các bước cần chỉ dẫn mâu thuẫn nhau'], ['model', 'Một bước cần model khác (rẻ hơn hoặc mạnh hơn)'], ['code', 'Cần kiểm tra bằng code giữa hai bước'], ['eval', 'Muốn eval riêng từng bước để biết lỗi ở đâu']];

      take: 'Tách ở chỗ cần kiểm tra, cần model khác, cần chỉ dẫn khác hoặc cần đo riêng. Không tách vì "trông gọn".'

    {
      q: '"Let\'s think step by step" còn đáng dùng không? Bước soạn trả lời có nên viết sẵn quy trình 5 bước?',
      a: `<p>Prompting Science Report 2 (Wharton, 06/2025) đo lại trên model hiện tại: với model không có reasoning, CoT chỉ cải thiện trung bình một chút, vì nhiều model đã tự suy luận từng bước. Với reasoning model, yêu cầu CoT gần như không đổi độ chính xác nhưng tốn thêm token và thời gian.</p>
<p>CoT còn có thể gây hại. "Mind Your Step (by Step)" (ICML 2025) tìm ra các nhóm tác vụ mà CoT làm hiệu năng giảm rõ, chẳng hạn học quy luật ngầm từ ví dụ, những tác vụ mà con người cũng làm kém đi khi phải nghĩ thành lời.</p>
<p>Với reasoning model, Anthropic viết: "A prompt such as 'think thoroughly' often produces better reasoning than a hand-written step-by-step plan". OpenAI viết yêu cầu reasoning model "think step by step" là không cần thiết và có thể làm kết quả kém đi. Một quy trình nghiệp vụ năm bước viết sẵn có thể <b>giới hạn</b> model vào lối giải bạn nghĩ ra. Với bước soạn trả lời của ShopViet: mô tả mục tiêu (khách hiểu được đổi hay không, vì sao, bước tiếp theo) và tiêu chí đúng (dựa trên điều khoản được trích, tối đa 3 câu), để model tự lập kế hoạch.</p>
<p>Ở bảng chính, bật "Thêm 'hãy suy nghĩ từng bước'" để thấy token và độ trễ tăng thêm bao nhiêu.</p>`,

<p>Nếu ShopViet cần lý do có thể kiểm tra, hãy yêu cầu bằng chứng cụ thể: đoạn trích điều khoản, mã đơn, ngày nhận hàng, rồi xác minh bằng code. Ví dụ lý do từ chối nên là: "Điều khoản mục 3: 'Sản phẩm đã mở hộp chỉ được đổi khi có lỗi nhà sản xuất, trong vòng 7 ngày kể từ ngày nhận hàng.' Đơn SV-4821 nhận ngày 05/11, hôm nay đã quá 7 ngày." Code kiểm tra được đoạn trích có trong chính sách (Lab 4) và phép tính ngày.</p>`,

i giả định trên (bước phân loại dùng model nhỏ),\nnhưng tổng token vào lại ít hơn vì bước soạn chỉ đọc điều khoản liên quan thay vì cả 8 điều khoản. Đổi lại, lỗi\nmã đơn bị code chặn trước bước soạn. Nếu bước phân loại cũng dùng model lớn, chuỗi chậm thêm cỡ một TTFT. Kiểm tra cũng cần test:\nquy tắc 'tối đa 3 câu' đếm sai với số tiền kiểu Việt Nam và báo lỗi oan một câu trả lời đúng.",

        select('Cài lỗi', [['none', 'Không có lỗi'], ['cls', 'Phân loại sai nhãn'], ['ret', 'Lấy sai điều khoản'], ['draft', 'Bản nháp hứa ngày giao'], ['long', 'Trả lời quá dài, có markdown'], ['order', 'Mã đơn không tồn tại']], S.fault, (v) => { S.fault = v; render(); }).node]),
      el('div', { class: 'row' }, Object.values(btn)),
      caseEl, svgBox, stat, flags,
      el('h4', { text: 'Tổng chi phí của hai phương án', style: 'margin:16px 0 4px' }), sumBox,
      el('div', { class: 'row', style: 'margin-top:10px' }, [
        slider('TTFT model chính', 200, 2000, 100, S.ttft, (v) => { S.ttft = v; render(); }, (v) => v + ' ms').node,
        slider('Tốc độ ra', 20, 200, 10, S.tps, (v) => { S.tps = v; render(); }, (v) => v + ' tok/s').node,
        slider('Ngân sách độ trễ', 1000, 8000, 500, S.budget, (v) => { S.budget = v; render(); }, (v) => v + ' ms').node]),
      el('p', { class: 'hint', style: 'margin:0', text: 'Nhãn phân loại, câu trả lời và kết quả judge là văn bản viết tay, không có model nào chạy; token là ước lượng ký tự ÷ 3,2 (hiệu chỉnh trên o200k_base). Mọi số thời gian là giả định: model nhỏ TTFT 300 ms, 150 tok/s; code tra mã đơn 30 ms, tìm chính sách 80 ms, kiểm tra 5 ms; "suy nghĩ từng bước" thêm 250 token ra. Độ trễ một lần gọi = TTFT + token ra ÷ tốc độ. README không đưa con số độ trễ.' }),
      el('h4', { text: 'Bước kiểm tra chạy trên gì', style: 'margin:16px 0 4px' }), checkBox,
      el('h4', { text: 'Test riêng được gì', style: 'margin:16px 0 4px' }), testBox);
    render();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
