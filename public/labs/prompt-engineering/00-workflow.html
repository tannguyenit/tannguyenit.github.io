const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<tr><td>Regression test</td><td>Golden set: ca áp dụng và không áp dụng của mỗi quy tắc, ca production, đối kháng, biến thể cách hỏi; check bằng code trước</td><td>Sửa lỗi này sinh lỗi khác; kết luận sai từ vài câu thử</td><td>§3.4</td></tr>

          res.map((r, k) => { const was = before ? before[k].ok : null; const dl = was === null || was === r.ok ? '' : r.ok ? '<b class="ok">sửa</b>' : '<b class="bad">hỏng</b>'; return `<tr class="${dl ? 'cur' : ''}"><td>${esc(r.c.msg)}${r.c.demo ? ' <b>(demo)</b>' : ''}</td><td>${r.c.kind}</td><td>${r.c.want}</td><td class="${r.ok ? (r.c.warn ? '' : 'ok') : 'bad'}" style="${r.ok && r.c.warn ? 'color:var(--warn)' : ''}">${esc(r.why)}</td><td>${dl}</td></tr>`; }).join('') + '</table></div>';

        const parts = [];
        if (broke.length && s.key === 'examples') parts.push(box('var(--bad)', `<b>Regression: thêm ví dụ làm hỏng ${broke.length} ca từng qua</b> (${broke.map((r) => '"' + esc(r.c.msg) + '"').join(', ')}). Vì sao: ba ví dụ cùng mở đầu "${esc(feat(text).open)}" và cùng kết bằng câu hỏi, model chép hình dạng đó cho mọi câu trả lời. Không có nghĩa few-shot có hại: lỗi nằm ở bộ ví dụ thiếu đa dạng. Hai câu demo vẫn qua nên không ai thấy. Trong hệ thống thật: golden set có ca biên như "cảm ơn em" chạy trên mọi thay đổi; bước 5 bắt được đúng lỗi này.`));
        if (s.key === 'registry') parts.push(box('var(--warn)', `<b>Version hoá xong mà lỗi vẫn còn ${CASES.length - pass} ca.</b> Vì sao: registry lưu đúng câu chữ của bước 3. Không có nghĩa bước này vô ích: từ giờ mọi request mang hash <span class="mono">${fnv(text)}</span>, khi lỗi được phát hiện bạn biết chính xác version nào gây ra và rollback được. Trong hệ thống thật: version hoá đi cùng eval chặn trước khi đổi label production.`));
        if (s.key === 'test' && fixed.length) parts.push(box('var(--ok)', `Golden set bắt được ${fixed.length} ca hỏng từ bước 3. Đội đa dạng hoá ví dụ (độ dài, câu mở đầu, cách kết; thêm một ví dụ rất ngắn) thành v3, chạy lại toàn bộ 9 ca, không chỉ ca vừa sửa.`));
        if (s.key === 'deploy') {
          const sh = share;
          parts.push(st.clockTop
            ? box('var(--bad)', `<b>Prefix dùng chung chỉ còn ${(sh * 100).toFixed(1)}% prompt.</b> Vì sao: dòng giờ đổi mỗi request nằm ở ký tự đầu tiên, nên hai request khác nhau ngay từ giây. Toàn bộ chỉ dẫn, ví dụ, chính sách phía sau dù giống hệt cũng không được tái dùng. Không có nghĩa model cần biết giờ chính xác từng giây: golden set vẫn ${pass}/${CASES.length}, chất lượng không đổi, chỉ chi phí và độ trễ tăng. Trong hệ thống thật: render ngày một lần đầu phiên, đặt sau phần tĩnh (README §3.3).`)
            : box('var(--ok)', `Prefix dùng chung chiếm ${(sh * 100).toFixed(1)}% prompt: phần khác nhau chỉ là tin nhắn khách ở cuối. Khối &lt;session&gt; đứng sau phần tĩnh và chỉ đổi khi sang phiên mới.`));
        }
        if (s.key === 'migrate') {
          if (st.keepTemp) parts.push(box('var(--bad)', `<b>Mọi ca đều trượt, nhưng không phải vì câu chữ.</b> Vì sao: Sonnet 5 trả 400 khi temperature khác mặc định, request không tới được model. Không có nghĩa prompt v4 kém. Trong hệ thống thật: sửa lỗi API trước khi chạy eval (README §3.5 bước 2), nếu không bảng eval chỉ đo lỗi cấu hình.`));
          else if (st.keepPatch) parts.push(box('var(--bad)', `<b>Ca "giờ mở cửa" hỏng trở lại, với đúng triệu chứng của sự cố đầu bài.</b> Vì sao: dòng "Nếu nghi ngờ, cứ gọi lookup_order" từng bù cho model cũ lười gọi tool; model mới phản hồi mạnh hơn với system prompt nên gọi tool cả khi không cần. Không có nghĩa model mới kém: chính miếng vá cũ gây lỗi. Trong hệ thống thật: gỡ ngôn ngữ nhấn mạnh và câu thúc gọi tool khi chuyển model (README §3.5 bước 3).`));
          else parts.push(box('var(--ok)', `Đã gỡ miếng vá và temperature: ${pass}/${CASES.length} ca qua trên model mới. Bỏ dòng "Nếu nghi ngờ..." không làm hỏng ca tra cứu đơn, vì model mới tự gọi tool khi quy tắc có điều kiện khớp.`));
          if (st.keepPrefill && !st.keepTemp) parts.push(box('var(--bad)', '<b>Golden set CSKH qua, nhưng luồng phân loại intent trả 400.</b> Vì sao: prefill nằm trong code gọi API của luồng khác, không nằm trong prompt đang test. Trong hệ thống thật: tìm mọi chỗ prefill trong codebase trước khi đổi model, không chỉ trong file prompt.'));
        }
        if (st.i < 4 && !parts.length && pass < CASES.length) parts.push(box('var(--warn)', `Hai câu demo: ${res.filter((r) => r.c.demo && r.ok).length}/2 qua. Đội chỉ thấy con số này; ${CASES.length - pass} ca trượt còn lại nằm ngoài tầm nhìn cho tới bước 5.`));
        cap.innerHTML = parts.join('');

        stats.innerHTML = `<div class="stat">${STEPS.map((x, k) => { const r = evalAll(textOf(k), x.model, apiOf(k)).filter((y) => y.ok).length; return `<span>${x.name}: <b class="${r === CASES.length ? 'ok' : r < CASES.length / 2 ? 'bad' : ''}">${r}/${CASES.length}</b></span>`; }).join('')}</div>`;
      }

      stage.append(nav, head, toggles, cols, extra, gold, cap,
        el('h4', { style: 'margin:16px 0 4px;font-size:13px', text: 'Số ca qua ở mỗi bước, với các ô bật tắt hiện tại' }), stats,
        el('p', { class: 'hint', text: 'Kết quả golden set do quy tắc mô phỏng: mỗi ca đọc câu chữ prompt (có quy tắc có điều kiện không, có tag không, các ví dụ có cùng câu mở đầu không) và áp hành vi README mô tả. Không gọi model nào. Giờ mở cửa 8:00–21:00, kho Hà Nội, ngày 28/11 là dữ liệu giả định. Model cũ, ngày retire, lỗi 400 lấy từ README.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
