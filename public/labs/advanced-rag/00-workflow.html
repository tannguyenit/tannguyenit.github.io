const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

        const fix = minimalFix(q);
        const single = TOG.filter(([k]) => !cfg[k]).filter(([k]) => run(q, Object.assign({}, cfg, { [k]: true })).ok).map(([, l]) => l);
        ansBox.replaceChildren(el('div', { style: `border:1px solid var(--line);border-left:4px solid var(--${r.ok ? 'ok' : r.refused ? 'warn' : 'bad'});border-radius:6px;padding:10px 12px;background:var(--bg);margin-top:12px`, html:
          `<div style="font-size:12px;color:var(--mute)">Bot trả lời ${r.ok ? '<b class="ok">đúng</b>' : r.refused ? '<b style="color:var(--warn)">từ chối (an toàn nhưng chưa trả lời được)</b>' : '<b class="bad">sai</b>'}</div><div style="margin:4px 0">${esc(r.text)}${r.cites.length ? ' <span class="mono" style="font-size:12px;color:var(--accent)">[' + r.cites.join('] [') + ']</span>' : ''}</div>` +
          (r.fp ? `<div style="font-size:13px"><b class="bad">${esc(r.fp)}</b> ở tầng <b>${STG[r.stage]}</b>. ${esc(r.why)}</div>` : '') +
          `<div style="font-size:13px;margin-top:4px;color:var(--mute)">Tổ hợp nhỏ nhất sửa được câu này (vét cạn 64 cấu hình): <b style="color:var(--ink)">${fix ? esc(cfgLabel(fix)) : 'không có'}</b>${!r.ok && single.length ? '. Từ cấu hình hiện tại, bật thêm một trong: <b style="color:var(--ink)">' + single.map(esc).join('; ') + '</b>' : ''}.</div>` }));

        const f = [];
        if (cfg.rerank && r.fp.startsWith('FP2')) f.push(flag('bad', `<b>Rerank đang bật mà câu vẫn sai ở tầng retrieval.</b> Đoạn đúng không nằm trong ${N_POOL} candidate, nên reranker không bao giờ đọc nó. Không có nghĩa reranker kém: nó chỉ sắp lại những gì được đưa tới.<br>Trong hệ thống thật: đo Recall@N trước; Recall@N thấp thì sửa retrieval (hybrid, chunk), không mua reranker tốt hơn.`));
        if (q.id === 'tbl' && r.ctx.includes('t2') && !r.ok) f.push(flag('warn', `<b>Recall tăng, câu trả lời vẫn sai.</b> Hàng ZenBook Z14 đã vào context nhưng là mảnh bảng không header. Lỗi chuyển từ FP2 sang FP4, không biến mất.<br>Trong hệ thống thật: chia bảng theo dòng và lặp header (README §2.7), hoặc parent–child; đo riêng "đoạn đúng có trong prompt" và "câu trả lời đúng".`));
        if (cfg.ground && !r.ok && r.cites.length) f.push(flag('bad', `<b>Có trích dẫn mà vẫn sai.</b> Bot trích đoạn ${r.cites.join(', ')}, đoạn đó có thật trong context, nhưng không trả lời đúng câu hỏi. Grounding chỉ đảm bảo câu trả lời dựa trên context; context sai thì câu trả lời sai có trích dẫn.<br>Trong hệ thống thật: quote matching bắt trích dẫn bịa, không bắt được trích dẫn đúng nguồn sai ý; faithfulness cần LLM judge hoặc người đọc (README §2.8).`));
        if (q.conflict && cfg.rerank && !cfg.filter && !r.ok) f.push(flag('warn', '<b>Rerank làm bản cũ đứng đầu chắc hơn.</b> Bản 2025 viết "laptop mua online", khớp chữ với câu hỏi hơn bản 2026. Reranker đúng về độ liên quan, sai về thời gian.<br>Trong hệ thống thật: ngày hiệu lực là metadata, gắn lúc index và lọc trong truy vấn (README §2.6).'));
        if (cfg.decomp && q.sub.length === 1) {
          const nd = run(q, Object.assign({}, cfg, { decomp: false }));
          if (nd.ok === r.ok) f.push(flag('warn', `<b>Decomposition không đổi kết quả câu này</b> (${r.ok ? 'đúng' : 'sai'} cả khi tắt), nhưng thêm ${LAT.decomp} ms giả định và một lần gọi LLM trên đường găng.<br>Trong hệ thống thật: routing như Adaptive-RAG (README §1.4), chỉ tách câu cho nhóm câu nhiều phần hoặc nhiều bước.`));
        }
        const broke = QS.filter((x, j) => base[j].ok && !evs[j].ok);
        if (broke.length) f.push(flag('bad', `<b>Hồi quy:</b> ${broke.map((x) => esc(x.name)).join(', ')} đúng ở RAG cơ bản nhưng sai với cấu hình này.<br>Trong hệ thống thật: đo lại trên cả tập câu đang đúng mỗi khi bật kỹ thuật mới (README §3.1, bước 4).`));
        if (r.ok && nOn(cfg) > nOn(fix || cfg) + 2) f.push(flag('ok', `Câu này đúng, nhưng chỉ cần ${fix ? esc(cfgLabel(fix)) : '...'}. ${nOn(cfg)} kỹ thuật đang bật; phần còn lại phục vụ câu khác hoặc không phục vụ câu nào. Xem bảng eval.`));
        flags.replaceChildren(...f);

        const lat = latency(cfg);
        evalBox.innerHTML = '<table><tr><th>Câu</th><th>Kết quả</th><th>Đoạn cần trong context</th><th>Điểm hỏng</th></tr>' + QS.map((x, j) => {
          const e = evs[j], need = x.need.length ? `${x.need.filter((id) => e.ctx.includes(id)).length}/${x.need.length}` : 'không có đáp án';
          return `<tr${j === qi ? ' class="cur"' : ''}><td>${esc(x.name)}</td><td>${e.ok ? '<b class="ok">đúng</b>' : e.refused ? '<b style="color:var(--warn)">từ chối</b>' : '<b class="bad">sai</b>'}${base[j].ok !== e.ok ? ' <small>(' + (e.ok ? 'mới sửa' : 'hồi quy') + ')</small>' : ''}</td><td class="mono">${need}</td><td>${e.fp ? esc(e.fp) + ' · ' + STG[e.stage] : '-'}</td></tr>`;
        }).join('') + '</table>';
        const ans = QS.filter((x) => x.need.length);
        const rec = ans.reduce((s, x) => { const e = evs[QS.indexOf(x)]; return s + x.need.filter((id) => e.ctx.includes(id)).length / x.need.length; }, 0) / ans.length;
        evalStat.innerHTML = `<span>Câu đúng: <b>${ev.acc}/${QS.length}</b> (RAG cơ bản: ${base.filter((x) => x.ok).length}/${QS.length})</span><span>Recall đoạn cần trong context: <b>${(rec * 100).toFixed(0)}%</b></span><span>Gọi LLM thêm mỗi câu: <b>${cfg.decomp ? 1 : 0}</b></span><span>Độ trễ giả định: <b>${(lat / 1000).toFixed(2)} s</b> (cơ bản ${(LAT.base / 1000).toFixed(2)} s)</span>`;
      }

      const qS = select('Câu hỏi', QS.map((x, j) => [j, x.name]), 0, (v) => { qi = +v; render(); });
      const groups = [0, 1, 2, 3, 4].map((s) => el('div', { style: 'display:flex;flex-direction:column;gap:2px;min-width:0' }, [el('b', { text: STG[s], style: 'font-size:12px;color:var(--mute)' }),
        ...TOG.filter((t) => t[2] === s).map(([k, l]) => check(l, cfg[k], (v) => { cfg[k] = v; render(); }).node)]));
      const reset = el('button', { text: 'Về RAG cơ bản', type: 'button', onclick: () => { TOG.forEach(([k]) => { cfg[k] = false; }); stage.querySelectorAll('input[type=checkbox]').forEach((i) => { i.checked = false; }); render(); } });
      stage.append(el('div', { class: 'row' }, [qS.node, reset]), qline, pipe,
        el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0' }, groups),
        el('h4', { text: `Tập lấy về (N = ${N_POOL} candidate, thứ tự sau rerank nếu bật)`, style: 'margin:14px 0 4px' }), poolBox, ansBox, flags,
        el('h4', { text: 'Eval: cả sáu câu với cấu hình hiện tại', style: 'margin:18px 0 4px' }), evalBox, evalStat,
        el('p', { class: 'hint', text: `Corpus đồ chơi 22 chunk, viết tay cho lab; chỉ Bảng 3 bị chunker cắt làm hai mảnh. Dense được giả lập bằng cosine trên tập khái niệm gán tay cho mỗi đoạn và câu hỏi; BM25 tính thật trên chữ (k1 = 1,2, b = 0,75); RRF k = 60 (README §2.1); reranker giả lập bằng công thức nêu ở câu hỏi 3. Quy tắc trả lời: đủ đoạn cần thì đúng, thiếu thì dùng bẫy có trong context, grounded thì từ chối khi không có bẫy hợp lệ. Độ trễ là số giả định.` }));
      render();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
