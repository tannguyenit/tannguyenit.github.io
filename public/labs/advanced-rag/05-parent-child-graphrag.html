const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

        a: `<p>Mảnh to có chứa câu đúng, nhưng cũng chứa nhiều câu khác. Vector của một mảnh là "nghĩa trung bình" của cả mảnh. Thêm câu không liên quan là kéo trung bình đó ra xa câu hỏi. Với từ khoá cũng vậy: điểm được chia cho độ dài.</p>
<p>Hình dưới tính điểm của câu hỏi về pin với bốn mảnh lồng nhau, đều chứa câu "Pin được bảo hành 12 tháng": chính câu đó, đoạn chứa nó, mục chứa nó, cả tài liệu. Cùng một bộ chấm, cùng trọng số IDF tính trên các câu.</p>`,

      {
        q: 'Auto-merging gộp con về cha khi nào? Ngưỡng 0,5 nghĩa là gì?',
        a: `<p>LlamaIndex chia ba tầng: cha 2048 token, con 512, cháu 128. Index các mảnh nhỏ nhất. Sau khi tìm, <code>AutoMergingRetriever</code> đếm: trong các con của một cha, bao nhiêu con được lấy về? Nếu tỉ lệ <b>vượt</b> <code>simple_ratio_thresh</code> (mặc định 0,5) thì thay các con đó bằng cả cha.</p>
<p>Ý tưởng: nhiều mảnh của cùng một đoạn cùng khớp nghĩa là cả đoạn liên quan, gửi nguyên đoạn đọc liền mạch hơn các mảnh rời. Bấm vào các ô con bên dưới để đánh dấu được lấy về.</p>`,
        viz(box) {

          const draw = () => {

        take: 'Auto-merging chỉ gộp khi nhiều con cùng khớp. Một con khớp đơn lẻ vẫn được gửi một mình, thiếu ý thì vẫn thiếu.'
      },
      {
        q: 'Sentence window lấy 3 câu mỗi phía. Sao không lấy luôn cả đoạn?',
        a: `<p>Cửa sổ không cần biết ranh giới đoạn hay mục. Nó lấy N câu trước và sau câu khớp, kể cả khi đoạn rất dài (chỉ lấy phần gần) hoặc đoạn rất ngắn (tràn sang đoạn bên cạnh). Hợp với văn bản dày đặc như hợp đồng, nơi một câu là một điều khoản và điều khoản liên quan thường đứng sát nhau.</p>
<p>LlamaIndex: <code>SentenceWindowNodeParser</code> mặc định <code>window_size=3</code>, lưu cửa sổ trong metadata key <code>window</code>. Lúc index, mỗi câu được embed một mình; cửa sổ chỉ nằm trong metadata. Sau retrieval, <code>MetadataReplacementPostProcessor</code> thay câu bằng cửa sổ trước khi đưa vào prompt.</p>
<p>Kéo cửa sổ cho câu hỏi về pin. Câu khớp là "Pin được bảo hành 12 tháng."</p>`,
        viz(box) {
          const out = el('div', { class: 'stat' }), strip = el('div', { style: 'display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px' }), q = QA[0];
          const draw = (w) => {
            const c = 3, ids = []; for (let x = Math.max(0, c - w); x <= Math.min(SENT.length - 1, c + w); x++) ids.push(x);

            out.innerHTML = `<span>Cửa sổ: <b>${ids.length}</b> câu, <b>${t}</b> token</span><span>Ý cần có: <b class="${got === q.need.length ? 'ok' : 'bad'}">${got}/${q.need.length}</b></span>` + (cross ? '<span class="bad">Cửa sổ tràn sang mục khác</span>' : '');

          box.append(el('div', { class: 'row' }, [slider('window_size', 0, 5, 1, 1, draw).node]), strip, out,
            el('div', { class: 'cap', text: 'Ô viền đậm là câu khớp, viền xanh lá là câu chứa ý cần. Khoảng cách lớn hơn giữa các ô là ranh giới mục. Ở window_size=3, cửa sổ với tới ý "pin phồng" ở mục Trường hợp từ chối, nhưng cũng kéo theo câu về rơi vỡ, vào nước: ở đây có ích là tình cờ, cửa sổ không biết câu nào liên quan.' }));
          draw(1);

        take: 'Cửa sổ là "lấy hàng xóm", không phải "lấy đúng ý". Nó cứu được điều kiện đứng sát câu khớp, không cứu được ý nằm xa.'

      {
        q: 'Có rerank thì rerank trên con hay trên cha?',
        a: `<p>README: rerank trên chunk <b>con</b> (nhỏ, chính xác) rồi mới mở rộng ra chunk cha. Hai lý do. Thứ nhất, reranker cũng bị loãng như embedding: chấm một mảnh 2048 token thì câu đúng chỉ là một phần nhỏ. Thứ hai, tiền reranker tính theo token: với Voyage, token = token query × số tài liệu + tổng token tài liệu.</p>
<p>Hình dưới tính tiền rerank N candidate với <code>rerank-3</code> ($0,05 / triệu token, README §2.2), query 50 token, cho ba cỡ của LlamaIndex.</p>`,

      },
      {
        q: 'Late chunking khác parent–child chỗ nào? "Chunk đã thấy cả tài liệu" nghĩa là gì?',
        a: `<p>Parent–child sửa ở <b>bước trả về</b>: tìm bằng mảnh nhỏ, gửi mảnh to. Vector của mảnh nhỏ vẫn mù về phần còn lại của tài liệu.</p>
<p>Late chunking sửa ở <b>bước embed</b>. Embedding model dạng transformer cho mỗi token một vector, và mỗi vector đó đã "nhìn" các token khác trong cùng lần đưa vào. Cách thường: cắt chunk trước, embed từng chunk, nên token trong chunk chỉ nhìn thấy chunk. Late chunking: đưa cả tài liệu vào một lần, rồi mới cắt ở tầng token và lấy trung bình cho từng chunk. Token "Pin" trong câu thứ tư đã nhìn thấy "Laptop" ở câu đầu.</p>
<p>Số liệu (Günther và cộng sự, 2024): trên 4 dataset BEIR, trung bình 3 model, nDCG@10 tăng khoảng 1,5–1,9 điểm. Không đều: lớn nhất ở NFCorpus với jina-v2-small, gần như không có với nomic trên SciFact và NFCorpus. Điều kiện: model context đủ dài, truy cập được embedding tầng token.</p>
<p>Hình dưới là <b>mô phỏng ý tưởng</b>, không phải model thật: vector chunk "late" = vector của chunk + α × vector của cả tài liệu. Câu hỏi "bảo hành pin laptop" có chữ "laptop" mà câu "Pin được bảo hành 12 tháng." không có.</p>`,
        viz(box) {
          const ix = makeIndex(UTEXT.sent), q = ix.vec('bảo hành pin laptop'), ch = ix.vec(SENT[3].text), dv = ix.vec(textOf(SENT.map((s) => s.i))), other = ix.vec(SENT[0].text), out = el('div');
          const mix = (a, b, al) => { const v = {}; for (const w in a) v[w] = a[w]; for (const w in b) v[w] = (v[w] || 0) + al * b[w]; return v; };
          const draw = (al) => {
            const s1 = ix.cos(q, mix(ch, dv, al)), s2 = ix.cos(q, mix(other, dv, al));
            out.replaceChildren(hbars([['"Pin được bảo hành 12 tháng."', s1, true], ['"Laptop mua tại ShopViet ... 24 tháng."', s2, false]], { max: 1, fmt: (v) => v.toFixed(3) }),

          };
          box.append(el('div', { class: 'row' }, [slider('α (mức trộn ngữ cảnh, mô phỏng)', 0, 1.5, 0.1, 0, draw, (v) => v.toFixed(1)).node]), out,
            el('div', { class: 'cap', text: 'Late chunking thật không có α: mức ngữ cảnh do attention của model quyết định. Và giống contextualized chunk embedding, nó không thêm chữ nào vào chunk, nên BM25 không được lợi.' }));
          draw(0);
        },
        take: 'Late chunking làm vector của chunk mang ngữ cảnh mà không tốn LLM lúc index. Mức lợi nhỏ và không đều, phải đo.'
      },
      {
        q: 'Vector search trả lời "không chắc" cho câu Air 13 và Care+. Graph làm khác gì?',
        a: `<p>Vector search hỏi: <b>đoạn nào giống câu hỏi nhất?</b> Câu hỏi có "Air 13" và "Care+". Đoạn quy tắc Care+ khớp chữ "Care+". Đoạn mô tả Air 13 ("laptop mỏng nhẹ, pin 15 giờ") khớp chữ "Air 13" nhưng không nói Air 13 thuộc danh mục nào. Mắt xích ở giữa ("Laptop văn phòng gồm Air 13...") cũng chỉ khớp chữ "Air 13", ngang điểm với đoạn mô tả, nên top-2 có thể lấy nhầm đoạn mô tả. Thiếu mắt xích, model không nối được Air 13 với Laptop văn phòng và trả lời "không chắc".</p>
<p>Graph hỏi: <b>từ Air 13, đi theo cạnh nào tới Care+?</b> Air 13 —thuộc→ Laptop văn phòng —bán kèm→ Care+. Nối được vì có cạnh "thuộc", không cần đoạn văn nào giống câu hỏi.</p>
<p>Graph không phải lúc nào cũng thắng. Câu "Tai nghe Z đổi trả trong bao nhiêu ngày?" (chọn câu thứ ba ở Phần B): đoạn chính sách đã có sẵn chữ "tai nghe", nên vector search cũng lấy đủ hai mảnh. Ở loại câu này graph chỉ thêm chi phí.</p>
<p>Nhưng cạnh đó từ đâu ra? Ai đó (người hoặc LLM) phải đọc mô tả sản phẩm và chính sách để trích ra. GraphRAG của Microsoft (Edge và cộng sự, 2024) dùng LLM trích entity và quan hệ từ toàn bộ corpus, gom thành cộng đồng và viết báo cáo cho từng cộng đồng. Tài liệu của Microsoft ước tính bước trích graph chiếm khoảng 75% chi phí index. Dữ liệu đổi thì index lại cũng tốn tương ứng.</p>
<p>Với dữ liệu ShopViet, nhiều cạnh như "sản phẩm thuộc danh mục" đã có sẵn trong database sản phẩm. Không cần LLM trích. Đó là structured retrieval (README §2.6), thường rẻ và chắc hơn trích từ văn bản.</p>`,
        take: 'Graph nối bằng quan hệ, vector nối bằng độ giống. Câu hỏi multi-hop mà mắt xích giữa không giống câu hỏi thì cần quan hệ. Quan hệ có sẵn trong database thì dùng database, đừng trích lại từ văn bản.'
      },
      {
        q: 'GraphRAG global search tốn bao nhiêu token mỗi câu hỏi?',
        a: `<p>GraphRAG-Bench (Xiang và cộng sự, 2025), hình 8 của paper, chi phí token mỗi câu hỏi: vector RAG khoảng 879, HippoRAG2 khoảng 1.008, MS-GraphRAG local khoảng 38.707, MS-GraphRAG global khoảng 331.375. Phần văn bản của paper có chỗ ghi prompt global search "tới 4×10⁴ token", không khớp với hình; dù theo số nào, global search cũng đắt hơn vector RAG nhiều bậc.</p>
<p>Hình dưới vẽ trên thang log (mỗi vạch dọc gấp 10 lần) và đổi ra tiền input cho 1.000 câu hỏi với Sonnet 5.5 ($2 / triệu token input, Cost optimization §2.1).</p>
<p>LazyGraphRAG (Microsoft Research, 11/2024) hoãn phần đắt sang lúc truy vấn: index chỉ dùng NLP trích cụm danh từ. Microsoft báo cáo chi phí index bằng vector RAG và bằng 0,1% GraphRAG đầy đủ, chất lượng câu hỏi tổng hợp tương đương global search với chi phí truy vấn thấp hơn hơn 700 lần. Bằng chứng giới hạn: một bộ dữ liệu (5.590 bài báo AP), 100 câu hỏi, chấm bằng LLM so cặp.</p>`,

          box.append(hbars(R.map(([n, v], i) => [n, Math.log10(v), i === 3]), { max: 6, fmt: (v) => { const t = 10 ** v; return nf(t) + ' tok · ' + usd((t / 1e6) * 2 * 1000) + ' / 1.000 câu'; } }),

        take: 'Global search là công cụ cho câu hỏi tổng hợp hiếm gặp, không phải đường mặc định cho mọi câu hỏi.'

      {
        q: 'Vậy graph có thắng vector RAG không? Paper nào cũng nói graph tốt hơn mà.',
        a: `<p>README dẫn ba nghiên cứu độc lập. Kết quả phụ thuộc loại câu hỏi:</p>
<div class="tbl"><table><tr><th>Nghiên cứu</th><th>Loại câu hỏi</th><th>RAG</th><th>Graph</th></tr>
<tr><td>Han và cộng sự (2025), Llama-3.1-8B</td><td>NQ (một bước), F1</td><td><b>64,78</b></td><td>63,01 (graph tốt nhất)</td></tr>

<p>Han và cộng sự còn thấy GraphRAG global search yếu trên tác vụ hỏi đáp, và kết hợp cả hai thắng từng cái riêng ở phần lớn trường hợp.</p>
<p>Còn "paper nào cũng nói graph tốt hơn"? Zeng và cộng sự (2025) chỉ ra các đánh giá trước đó có câu hỏi không liên quan và thiên lệch khi dùng LLM chấm. Sau khi khử thiên lệch, tỉ lệ thắng của LightRAG trước NaiveRAG trên bộ Agriculture giảm từ 66,70% (theo paper LightRAG) xuống 39,06%, tức NaiveRAG thắng.</p>`,

        el('div', { class: 'row' }, [slider('Cửa sổ w', 1, 3, 1, S.w, (v) => { S.w = v; renderA(); }).node, slider('top-k', 1, 3, 1, S.k, (v) => { S.k = v; renderA(); }).node]),
        tree, statA, capA,
        el('h4', { text: 'B. Câu hỏi nhiều bước: graph và vector search', style: 'margin:22px 0 8px' }),
        el('div', { class: 'row' }, [gqSel.node,
          el('button', { class: 'primary', text: 'Đi thêm 1 bước', onclick: () => { S.step++; renderB(); } }),
          el('button', { text: 'Làm lại', onclick: () => { S.step = 0; renderB(); } }),
          slider('Vector top-k', 1, 4, 1, S.gk, (v) => { S.gk = v; renderB(); }).node]),
        svg,
        el('div', { class: 'legend', html: '<span><i style="background:var(--g1)"></i>Sản phẩm</span><span><i style="background:var(--g4)"></i>Danh mục</span><span><i style="background:var(--g2)"></i>Chính sách đổi trả</span><span><i style="background:var(--g3)"></i>Gói dịch vụ</span><span>Nét đứt: quan hệ phủ định</span>' }),
        statB, el('h4', { text: 'Vector search trên cùng nội dung viết thành đoạn văn', style: 'margin:14px 0 6px' }), vecBox, capB,
        el('p', { class: 'hint', text: 'Graph và các đoạn văn là dữ liệu dựng sẵn. Duyệt graph là BFS thật trong trình duyệt: bắt đầu từ sản phẩm có tên trong câu hỏi, mở rộng từng lớp tới khi gặp nút chính sách hoặc gói cần tìm. Token ước lượng theo 49 từ tiếng Việt ≈ 56 token (o200k, Cost optimization §2.1).' }));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
