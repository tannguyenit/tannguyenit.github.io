const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

      s: 'Bật HyDE một mình cho mọi câu: đoạn văn giả bịa số liệu sẽ kéo tài liệu sai lên đầu, và còn kéo lên với điểm cao hơn. Bật mọi kỹ thuật cho mọi câu: trả thêm một lần gọi LLM trên đường găng cho cả những câu đã tìm đúng. Tăng top-k thay vì biến đổi query: thêm nhiễu vào context, và với câu "trả tiền dần" thì tài liệu đúng vẫn không có điểm.',
      p: 'Một lần gọi LLM trước mỗi lần tìm: thêm độ trễ người dùng chờ, thêm tiền (nhỏ với model rẻ). Multi-query và decomposition còn nhân số lần retrieval. Thêm một chỗ có thể sai mà phải log: query trung gian sai thì mọi bước sau sai theo.'
    },
    deep: [
      {
        q: 'Vì sao câu hỏi của khách lại là "query tệ"? Nó rõ nghĩa với người đọc mà.',
        a: `<p>Rõ nghĩa với người, nhưng retriever không đọc nghĩa như người. Nó so <b>hình dạng</b> câu hỏi với hình dạng từng đoạn tài liệu: có chung từ nào, từ đó hiếm cỡ nào. Embedding thật thì mềm hơn (biết "rè" gần "lỗi" ở mức nào đó), nhưng vẫn là so hai đoạn văn với nhau.</p>
<p>Câu hỏi và tài liệu khác hình dạng theo ba cách:</p>
<ul><li><b>Ngắn và viết tắt.</b> "tai nghe rè đổi được ko" chỉ có vài từ có nghĩa. Mỗi từ trùng hay không trùng tạo ra chênh lệch lớn.</li>
<li><b>Từ khác nhau.</b> Khách nói "đổi", tài liệu viết "đổi trả", "đổi mới". Khách nói "trả tiền dần", tài liệu viết "trả góp".</li>
<li><b>Gộp nhiều ý.</b> "So sánh 2025 và 2026" cần hai đoạn khác nhau, nhưng chỉ có một vector câu hỏi.</li></ul>
<p>Bảng dưới đếm từ chung (sau khi bộ chấm đồ chơi gom vài từ đồng nghĩa) giữa câu "tai nghe rè đổi được ko" và ba đoạn tài liệu. Đoạn đúng là d1.</p>`,
        viz(box) {
          const q = QS[0].text, qt = new Set(terms(q)), rank = search(q);
          const rows = ['d8', 'd4', 'd1'].map((id) => {
            const dt = new Set(terms(BY[id].text)), common = [...qt].filter((w) => dt.has(w));
            const r = rank.findIndex((x) => x.id === id) + 1;
            return `<tr${id === 'd1' ? ' class="cur"' : ''}><td><b>${id}</b> ${BY[id].title}</td><td class="mono">${common.map(pretty).join(', ') || '(không có)'}</td><td class="mono">${r}</td></tr>`;
          }).join('');
          box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Đoạn</th><th>Từ chung với câu hỏi</th><th>Hạng</th></tr>' + rows })]),
            el('div', { class: 'cap', html: `Từ có nghĩa trong câu hỏi sau khi bỏ từ chức năng: <span class="mono">${[...qt].map(pretty).join(', ')}</span>. Đoạn d1 chung "tai nghe" và "lỗi" (bộ chấm gom "rè" về "lỗi"), giống hệt d4, nhưng d1 dài hơn nhiều nên điểm bị chia nhỏ: cosine chia cho độ dài, chữ thừa làm loãng điểm. Chữ "đổi" của khách không khớp "đổi mới" của d1, vì bộ chấm coi "đổi mới" là cụm "đổi trả", khác chữ "đổi" đứng một mình. Chỉ d8 ("đổi laptop mới") có đúng chữ "đổi".` }));
        },
        take: 'Câu hỏi đúng ý nhưng sai từ. Retriever chấm theo từ (hoặc theo vector của từ), nên câu hỏi phải "nói giống tài liệu" thì mới được điểm.'
      },
      {
        q: 'Viết lại query cụ thể là gửi gì cho LLM, nhận lại gì, tốn bao nhiêu?',
        a: `<p>Một request bình thường. Messages gửi đi trông như sau (prompt hướng dẫn rút gọn):</p>
<div class="tbl"><table><tr><td class="mono" style="white-space:pre-wrap">[{"role": "system", "content": "Viết lại câu hỏi của khách thành một câu tìm kiếm đầy đủ, dùng thuật ngữ trong chính sách ShopViet. Hôm nay là 27/11/2026. Chỉ trả về câu đã viết lại."},
 {"role": "user", "content": "tai nghe rè đổi được ko"}]</td></tr></table></div>
<p>Model trả về một dòng: "Tai nghe bị lỗi rè có được đổi trả không, điều kiện đổi trả sản phẩm lỗi". Dòng này đi vào retriever thay cho câu gốc.</p>
<p>Chú ý dòng "Hôm nay là 27/11/2026". Không có nó, model không biết "năm nay" là năm nào, và câu q3 sẽ không sửa được.</p>
<p>Chi phí nhỏ vì input và output đều ngắn. Hình dưới tính theo giá niêm yết trong Cost optimization §2.1 (ngày 06/11/2026). Prompt hướng dẫn ${PROMPT_TOK} token là con số giả định. Token của câu hỏi và câu viết lại ước lượng từ chuỗi thật: 49 từ tiếng Việt khoảng 56 token với tokenizer o200k (số đo trong Cost optimization §2.1).</p>`,
        viz(box) {
          const MODELS = [['haiku', 'Claude Haiku 5.5 ($0,10 / $0,50)', 0.10, 0.50], ['luna', 'gpt-6-luna ($0,10 / $0,50)', 0.10, 0.50], ['sonnet', 'Claude Sonnet 5.5 ($2 / $10)', 2, 10]];
          const S = { m: 'haiku', day: 4 }, out = el('div');
          const draw = () => {
            const [, name, pi, po] = MODELS.find((m) => m[0] === S.m), perDay = Math.round(10 ** S.day);
            const rows = QS.map((q) => {
              const i = PROMPT_TOK + tok(q.text), o = tok(q.rewrite), c = (i * pi + o * po) / 1e6;
              return `<tr><td>${q.text}</td><td class="mono">${i}</td><td class="mono">${o}</td><td class="mono">${usd(c)}</td><td class="mono">${usd(c * perDay * 30)}</td></tr>`;
            }).join('');
            out.innerHTML = `<div class="tbl"><table><tr><th>Câu hỏi</th><th>Input</th><th>Output</th><th>Mỗi câu</th><th>30 ngày, ${perDay.toLocaleString('vi-VN')} câu/ngày</th></tr>${rows}</table></div><div class="cap">Model: ${name}, USD / 1 triệu token input / output. Số câu mỗi ngày là giả định để bạn kéo.</div>`;
          };
          box.append(el('div', { class: 'row' }, [select('Model viết lại', MODELS.map((m) => [m[0], m[1]]), S.m, (v) => { S.m = v; draw(); }).node,
            slider('Câu hỏi / ngày', 2, 6, 0.5, S.day, (v) => { S.day = v; draw(); }, (v) => Math.round(10 ** v).toLocaleString('vi-VN'))]), out);
          draw();
        },
        take: 'Tiền của bước viết lại thường nhỏ với model rẻ. Cái đắt hơn là thời gian chờ: thêm một lần gọi LLM trước khi retrieval bắt đầu.'
      },
      {
        q: 'HyDE nghe lạ: dùng một câu trả lời bịa để tìm câu trả lời thật. Sao lại hiệu quả?',
        a: `<p>Vì <b>câu trả lời giống tài liệu hơn câu hỏi giống tài liệu</b>. Câu hỏi có dạng "X có được Y không?". Tài liệu có dạng "X được Y trong Z ngày, điều kiện W". Đoạn văn giả do LLM viết có đúng dạng của tài liệu: cùng kiểu từ, cùng độ dài, cùng cách nói.</p>
<p>Gao và cộng sự (2022) báo cáo HyDE vượt hẳn retriever không giám sát Contriever và ngang retriever đã fine-tune trên nhiều tác vụ. Điểm hay: không cần dữ liệu huấn luyện nào.</p>
<p>Nhưng nội dung của đoạn văn giả có thể sai. Retriever không biết đúng sai, nó chỉ thấy hình dạng. Bảng dưới tính điểm cosine (bộ chấm đồ chơi) của câu gốc và của đoạn HyDE với tài liệu đúng, cùng tài liệu đứng đầu khi tìm bằng HyDE.</p>`,
        viz(box) {
          const rows = QS.map((q) => {
            const b = search(q.text), h = search(q.hyde), g = q.gold[0];
            const sb = b.find((x) => x.id === g).s, sh = h.find((x) => x.id === g).s, top = h[0], ok = q.gold.includes(top.id);
            return `<tr><td>${q.text}</td><td class="mono">${sb.toFixed(3)}</td><td class="mono">${sh.toFixed(3)}</td><td class="${ok ? 'ok' : 'bad'}"><b>${top.id}</b> ${BY[top.id].title} (${top.s.toFixed(3)})</td></tr>`;
          }).join('');
          box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Câu hỏi</th><th>cos(gốc, đoạn đúng)</th><th>cos(HyDE, đoạn đúng)</th><th>Top-1 khi tìm bằng HyDE</th></tr>' + rows })]),
            el('div', { class: 'cap', text: 'Đoạn đúng lấy là tài liệu đúng đầu tiên của mỗi câu. Đỏ: HyDE kéo một tài liệu sai lên đầu. Đoạn HyDE nói về bảo hành, nên với câu "tai nghe rè" nó kéo đoạn bảo hành tai nghe thay vì đoạn đổi trả.' }));
        },
        take: 'HyDE đổi câu hỏi thành một đoạn văn cùng hình dạng với tài liệu. Hình dạng đúng giúp tìm, nhưng nội dung sai thì tìm sai theo.'
      },
      {
        q: 'Câu q3: HyDE viết "pin bảo hành 6 tháng". Con số đó ở đâu ra, và nó làm hỏng gì?',
        a: `<p>Model không biết chính sách của ShopViet. Nó viết một con số <b>nghe hợp lý</b> từ những gì nó từng đọc. "6 tháng" lại trùng đúng con số của chính sách cũ năm 2025 (d5). Đoạn văn giả vì vậy giống d5 hơn hẳn d6, và d5 lên đầu với điểm còn cao hơn lúc tìm bằng câu gốc.</p>
<p>Đây là kiểu hỏng nguy hiểm: kết quả sai nhưng <b>tự tin</b>. Nhìn điểm số không phát hiện được.</p>
<p><b>Nhưng đừng đổ hết cho HyDE.</b> Chọn q3 ở bảng phía trên với "Query gốc": d5 (bản 2025) <b>đã đứng hạng 1</b> trước khi có HyDE. POC chạy embedding thật còn rõ hơn: bản 2025 đứng đầu ở <b>cả sáu cách</b>, kể cả query gốc và câu viết lại có chữ "2026". Vì sao: "năm nay" không mang con số năm nào, embedding không biết hôm nay là ngày nào, và đoạn 2025 có đủ "pin", "bảo hành" như đoạn 2026. HyDE chỉ làm d5 thắng đậm hơn. Điều này không có nghĩa HyDE an toàn: nó vẫn bịa con số, và con số bịa vẫn kéo về tài liệu sai. <b>Trong hệ thống thật:</b> lỗi chọn nhầm phiên bản chính sách sửa bằng filter theo ngày hiệu lực (README §2.6, Lab 6), không sửa được bằng cách chọn kiểu viết lại query.</p>
<p>README đề xuất giữ nhánh query gốc chạy song song và trộn bằng RRF, với nhánh HyDE nhẹ ký hơn (ví dụ trọng số 0,5). Kéo trọng số bên dưới: ba nhánh là query gốc, câu viết lại, và HyDE. Bảng tính RRF thật.</p>`,
        viz(box) {
          const q = QBY.q3;
          const L = [ids(q.text), ids(q.rewrite), ids(q.hyde)], out = el('div'), cap = el('div', { class: 'cap' });
          const draw = (w) => {
            const f = rrf(L, [1, 1, w]).slice(0, 4);
            out.replaceChildren(hbars(f.map((x) => [`${x.id} ${BY[x.id].title}`, x.s, q.gold.includes(x.id)]), { fmt: (v) => v.toFixed(4) }));
            const top = f[0].id;
            cap.innerHTML = top === 'd6' ? `Trọng số HyDE ${w.toFixed(2)}: d6 (đúng) đứng đầu nhờ nhánh câu viết lại. Nhánh HyDE vẫn cộng điểm cho d5 nhưng không đủ lật.` : `<span class="bad">Trọng số HyDE ${w.toFixed(2)}: ${top} ${BY[top].title} đứng đầu.</span> Nhánh HyDE xếp d5 hạng 1, và câu gốc cũng xếp d5 hạng 1 (vì "pin" và "bảo hành" khớp cả hai bản). Hai phiếu thắng một phiếu.`;
          };
          const sl = slider('Trọng số nhánh HyDE', 0, 2, 0.1, 0.5, draw, (v) => v.toFixed(1));
          box.append(el('div', { class: 'row' }, [sl.node]), out, cap,
            el('div', { class: 'cap', text: 'Thanh màu đậm là tài liệu đúng (d6). Trong hệ thống thật, cách chắc hơn với chính sách có phiên bản là lọc theo metadata ngày hiệu lực (README §2.6), không trông vào việc trộn điểm.' }));
          draw(0.5);
        },
        take: 'Trộn với nhánh gốc giảm thiệt hại của HyDE nhưng không đảm bảo. Khi query gốc cũng nghiêng về bản cũ, thứ sửa được là câu viết lại có ngày, hoặc filter metadata.'
      },
      {
        q: 'Multi-query trộn bằng RRF. Sao không cộng thẳng điểm cosine của các lần tìm?',
        a: `<p>Vì điểm của các lần tìm không cùng thang. Câu ngắn "trả góp" cho cosine 0,6 với đoạn đúng, câu dài cho 0,2 với cùng đoạn đó. Cộng thẳng thì câu nào cho điểm cao hơn sẽ áp đảo, dù không đúng hơn. Trộn BM25 với cosine còn tệ hơn: một bên có thể ra 12,7, bên kia 0,83.</p>
<p>RRF bỏ điểm, chỉ dùng <b>hạng</b>. Mỗi tài liệu được cộng 1/(k + hạng) ở mỗi danh sách. Hạng thì luôn cùng thang. Cormack và cộng sự cố định k = 60 sau một thử nghiệm sơ bộ và viết rằng giá trị này gần tối ưu, nhưng lựa chọn không quan trọng lắm.</p>
<p>k làm gì? k nhỏ thì hạng 1 được thưởng rất đậm so với hạng 5 (1/2 so với 1/6). k lớn thì khoảng cách giữa các hạng nhỏ lại, tài liệu xuất hiện ở <b>nhiều</b> danh sách thắng tài liệu đứng đầu <b>một</b> danh sách. Kéo k và nhìn câu "trả tiền dần" với ba biến thể.</p>`,
        viz(box) {
          const q = QBY.q4, lists = q.multi.map(ids), out = el('div');
          const draw = (k) => {
            const f = rrf(lists, null, k).slice(0, 5);
            const head = '<tr><th>Tài liệu</th>' + q.multi.map((s, i) => `<th>${i ? 'Biến thể ' + i : 'Gốc'}</th>`).join('') + '<th>Tổng RRF</th></tr>';
            const rows = f.map((x) => `<tr${q.gold.includes(x.id) ? ' class="cur"' : ''}><td><b>${x.id}</b> ${BY[x.id].title}</td>` + lists.map((l) => { const r = l.indexOf(x.id) + 1; return r ? `<td class="mono">hạng ${r}: ${(1 / (k + r)).toFixed(4)}</td>` : '<td class="mono">không có (điểm 0)</td>'; }).join('') + `<td class="mono"><b>${x.s.toFixed(4)}</b></td></tr>`).join('');
            out.innerHTML = `<div class="tbl"><table>${head}${rows}</table></div>`;
          };
          box.append(el('div', { class: 'row' }, [slider('k', 1, 100, 1, 60, draw).node]), out,
            el('div', { class: 'cap', text: 'Hàng tô màu là tài liệu đúng (d9 Trả góp). Câu gốc không có từ chung nào với d9 nên d9 không có mặt trong danh sách đó. Hai biến thể xếp nó hạng 1, đủ để tổng RRF đưa nó lên đầu.' }));
          draw(60);
        },
        take: 'RRF trộn theo hạng nên không cần chuẩn hoá điểm giữa các retriever. Một tài liệu được nhiều danh sách cùng xếp cao sẽ thắng.'
      },
      {
        q: 'Code RRF trong README có dòng dict.fromkeys để bỏ id trùng. Không bỏ thì sao?',
        a: `<p>Retriever thật trả về <b>chunk</b>, không phải tài liệu. Một tài liệu dài bị chia thành nhiều chunk. Nếu bạn map chunk về id tài liệu để trộn, một danh sách có thể chứa cùng id nhiều lần: d6, d6, d6, d5...</p>
<p>Không bỏ trùng thì d6 được cộng điểm ba lần trong cùng một danh sách, chỉ vì nó dài và bị cắt thành nhiều mảnh. README ghi rõ: không loại thì một tài liệu được cộng điểm nhiều lần chỉ vì nó dài.</p>`,
        viz(box) {
          const A = ['d6', 'd6', 'd6', 'd8', 'd5'], B = ['d5', 'd6', 'd12'];
          const naive = {}, dedup = {};
          [A, B].forEach((l) => { l.forEach((id, r) => { naive[id] = (naive[id] || 0) + 1 / (61 + r); }); [...new Set(l)].forEach((id, r) => { dedup[id] = (dedup[id] || 0) + 1 / (61 + r); }); });
          const row = (m) => Object.entries(m).sort((a, b) => b[1] - a[1]).map(([id, s]) => `${id}: ${s.toFixed(4)}`).join(' · ');
          box.append(el('div', { class: 'tbl' }, [el('table', { html: `<tr><th>Danh sách</th><th>Id theo hạng</th></tr><tr><td>Dense (chunk đã map về tài liệu)</td><td class="mono">${A.join(', ')}</td></tr><tr><td>BM25</td><td class="mono">${B.join(', ')}</td></tr><tr><td>RRF không bỏ trùng</td><td class="mono bad">${row(naive)}</td></tr><tr><td>RRF có bỏ trùng</td><td class="mono ok">${row(dedup)}</td></tr>` })]),
            el('div', { class: 'cap', text: 'Không bỏ trùng, d6 cộng ba lần trong danh sách dense và bỏ xa d5 dù BM25 xếp d5 hạng 1. Có bỏ trùng, khoảng cách giữa hai tài liệu thu lại đúng như thứ hạng thật.' }));
        },
        take: 'Trộn ở mức tài liệu thì bỏ id trùng trong từng danh sách trước, giữ hạng đầu tiên.'
      },
      {
        q: 'Decomposition tách "so sánh 2025 và 2026" thành hai câu. Còn câu mà bước sau phụ thuộc bước trước thì sao?',
        a: `<p>Câu so sánh thì hai phần độc lập: tìm "bảo hành 2025" không cần biết kết quả của "bảo hành 2026". Tách một lần là đủ.</p>
<p>Câu nhiều bước thì khác. Ví dụ "Laptop tôi mua kèm gói Care+ bị rơi vỡ, mang đi đâu sửa?". Bước 1 phải tìm Care+ có đổi máy khi rơi vỡ không. Chỉ khi biết câu trả lời mới biết bước 2 tìm gì: nơi đổi máy, hay nơi sửa có phí. Query của bước 2 không viết trước được.</p>
<p>IRCoT (Trivedi và cộng sự, 2022) xen kẽ: mỗi bước suy luận sinh một query mới, tìm, suy luận tiếp. Trên HotpotQA, 2WikiMultihopQA, MuSiQue và IIRC, IRCoT với GPT-3 tăng tới 21 điểm recall và tới 15 điểm QA so với retrieve một lần.</p>
<p>Cái giá: mỗi bước là một lần gọi LLM và một lần retrieval, độ trễ cộng dồn. Và <b>bước đầu sai thì các bước sau sai theo</b>. README khuyên log từng query trung gian, vì khi câu trả lời cuối sai, bạn cần biết nó đi lạc từ bước nào. Kiểu câu này thuộc agentic RAG (README §1.4).</p>`,

      {

<p>Lợi: lấy về bức tranh chung, giúp model suy luận. Hại: câu tổng quát <b>mất chi tiết cụ thể</b>. Câu gốc có "năm nay" và "thay pin"; câu step-back có thể kéo về cả bản 2025 lẫn 2026 và các đoạn về màn hình, bàn phím, nhưng không ưu tiên đoạn có con số của pin.</p>
<p>Lưu ý bằng chứng: số liệu của paper đo trên tác vụ suy luận (MMLU, TimeQA, MuSiQue), không phải đo retrieval riêng. Nó chưa chứng minh step-back giúp tìm đúng đoạn hơn.</p>`,

<p>Với câu đã tìm đúng bằng query gốc, bạn trả tiền và thời gian mà không được gì, còn có thể bị hỏng (HyDE bịa, biến thể lạc đề). Hình dưới đếm số lần gọi LLM và số lần retrieval của từng cách cho câu q2, và đếm qua bốn câu hỏi xem cách nào vừa đạt Recall@3 đầy đủ vừa có tài liệu đúng ở hạng 1.</p>
<p>Bạn sẽ thấy "Viết lại" thắng cả bốn câu. Đừng vội kết luận. Câu viết lại ở đây là chuỗi viết sẵn, tốt nhất có thể, có cả ngày hôm nay. LLM thật có lúc viết lại sai ý, bỏ mất chi tiết, hoặc thêm điều kiện khách không hỏi. Và với những câu query gốc đã tìm đúng, bước viết lại chỉ cộng thêm thời gian chờ.</p>
<p>POC chạy embedding thật cho kết quả gần như ngược lại: "Viết lại" có Recall@3 trung bình 0,62, <b>thấp nhất</b> trong sáu cách, và làm câu pin tệ hơn query gốc; HyDE và multi-query đạt 1,00. Cùng bốn câu, cùng chuỗi viết lại, chỉ đổi bộ chấm điểm mà thứ hạng các cách đổi hẳn. Đó là lý do phải đo trên retriever thật của bạn.</p>
<p>README khuyên: dùng model nhỏ và nhanh cho bước viết lại, và chỉ bật cho nhóm câu hỏi cần, qua routing (§1.4). Routing có thể là một bộ phân loại rẻ: câu có "so sánh", "và", hai mốc thời gian thì decomposition; câu ngắn dưới vài từ thì viết lại.</p>`,

        },

      file: "docs/advanced-rag/pocs/03_query_rewriting.py",

      output: "Retriever: paraphrase-multilingual-MiniLM-L12-v2 (thật, CPU), 32 đoạn. Câu viết lại, đoạn HyDE, biến thể multi-query, câu con: VIẾT TAY, giả làm output LLM.\nPhần thật: embedding và xếp hạng, RRF (hàm của README §2.1), token đếm bằng tiktoken o200k, giá Haiku 5.5 (Cost opt §2.1).\n\n== \"tai nghe rè đổi được ko\"  (cần rhp) ==\nCách                        hạng đoạn cần  top-3  top-3                tiền LLM (Haiku)\n--------------------------  -------------  -----  -------------------  ----------------\nQuery gốc                   2              1/1    fix_re, rhp, o4128   -\nViết lại                    2              1/1    fix_re, rhp, r26fee  $0.00002\nHyDE                        2              1/1    wgen, rhp, w25       $0.00003\nHyDE + gốc (RRF, HyDE 0,5)  1              1/1    rhp, fix_re, o4128   $0.00003\nMulti-query + RRF           1              1/1    rhp, fix_re, care1   $0.00002\nTách câu                    2              1/1    fix_re, rhp, r26fee  $0.00002\n\n== \"So sánh bảo hành laptop 2025 và 2026\"  (cần w25, w26) ==\nCách                        hạng đoạn cần  top-3  top-3              tiền LLM (Haiku)\n--------------------------  -------------  -----  -----------------  ----------------\nQuery gốc                   1 3            2/2    w25, w26send, w26  -\nViết lại                    1 3            2/2    w25, w26send, w26  $0.00002\nHyDE                        2 1            2/2    w26, w25, w26send  $0.00003\nHyDE + gốc (RRF, HyDE 0,5)  1 2            2/2    w25, w26, w26send  $0.00003\nMulti-query + RRF           1 3            2/2    w25, r27, w26      $0.00003\nTách câu                    1 3            2/2    w25, w26send, w26  $0.00003\n\n== \"Laptop mua đầu năm nay thay pin miễn phí được không?\"  (cần w26, w26b) ==\nCách                        hạng đoạn cần  top-3  top-3           tiền LLM (Haiku)\n--------------------------  -------------  -----  --------------  ----------------\nQuery gốc                   3 2            2/2    w25, w26b, w26  -\nViết lại                    2 5            1/2    w25, w26, r27   $0.00003\nHyDE                        2 3            2/2    w25, w26, w26b  $0.00003\nHyDE + gốc (RRF, HyDE 0,5)  3 2            2/2    w25, w26b, w26  $0.00003\nMulti-query + RRF           2 3            2/2    w25, w26, w26b  $0.00002\nTách câu                    2 3            2/2    w25, w26, w26b  $0.00003\n\n== \"ShopViet có cho trả tiền dần không?\"  (cần inst1) ==\nCách                        hạng đoạn cần  top-3  top-3                  tiền LLM (Haiku)\n--------------------------  -------------  -----  ---------------------  ----------------\nQuery gốc                   7              0/1    refund, w26send, r24   -\nViết lại                    6              0/1    gift, refund, w26send  $0.00002\nHyDE                        1              1/1    inst1, refund, r26fee  $0.00003\nHyDE + gốc (RRF, HyDE 0,5)  4              0/1    refund, w26send, r24   $0.00003\nMulti-query + RRF           2              1/1    refund, inst1, care3   $0.00003\nTách câu                    6              0/1    gift, refund, w26send  $0.00002\n\n== Recall@3 trung bình 4 câu ==\nCách                        Recall@3\n--------------------------  --------\nQuery gốc                   0.75\nViết lại                    0.62\nHyDE                        1.00\nHyDE + gốc (RRF, HyDE 0,5)  0.75\nMulti-query + RRF           1.00\nTách câu                    0.75\n\nHyDE câu 'tai nghe rè' tự bịa 'bảo hành miễn phí 12 tháng' → top-1 là wgen: 'Mọi sản phẩm được bảo hành 12 tháng tại trung tâm bảo hành ShopViet, trừ khi bảng bảo hành theo model ghi khác.' (bảo hành, không phải đổi trả).\nHyDE câu 'trả tiền dần' viết đúng chữ 'trả góp' → inst1 lên hạng 1; trộn RRF với nhánh gốc (HyDE 0,5) → rơi về hạng 4.\n\nRút ra: không cách nào thắng mọi câu; cao nhất trên 4 câu này: HyDE, Multi-query + RRF. 'Viết lại' còn làm câu pin tệ hơn query gốc.\nHyDE cứu câu lệch từ vựng nhưng kéo về thực thể nó bịa; hạ trọng số HyDE thì an toàn hơn nhưng mất luôn phần nó cứu được.\nCâu pin: cả 6 cách đều để bản 2025 đứng đầu, vì embedding không biết 'năm nay' là 2026: việc của metadata filter (Lab 06), không phải viết lại query.\nMỗi cách tốn thêm một lần gọi LLM (~$0,00002–0,00003 với Haiku 5.5) nằm trên đường găng.",
      measured: true,
      read: ["Mỗi bảng: hạng của đoạn cần theo từng cách. Câu 'trả tiền dần' chỉ được cứu bởi HyDE (hạng 1) và multi-query (hạng 2).", "HyDE câu 'tai nghe rè' bịa 'bảo hành 12 tháng' → top-1 là đoạn bảo hành chung, không phải đổi trả.", "Trộn HyDE trọng số 0,5 với nhánh gốc an toàn hơn nhưng làm rơi đoạn trả góp từ hạng 1 xuống 4.", "Câu pin 'năm nay': cả 6 cách đều để bản 2025 đứng đầu: viết lại query không sửa được lỗi phiên bản, cần metadata filter (Lab 06)."]
    },
    mount(stage) {
      const S = { q: 'q1', m: 'base', k: 3 };
      const sentBox = el('div', { class: 'chunks' }), list = rankList(32), stat = el('div', { class: 'stat' });
      const cap = el('div', { class: 'sum', style: 'margin-top:12px;padding-top:0;border:0' }), table = el('div', { class: 'sum', style: 'margin-top:6px;padding-top:0;border:0' });
      const whyBox = el('p', { class: 'hint', style: 'margin:0 0 10px' });
      function caption(q, r, base) {
        const rk = recall(r.rank, q.gold, S.k), rb = recall(base.rank, q.gold, S.k), top = r.rank[0].id, need = q.gold.length;
        const msgs = [];
        if ((S.m === 'hyde' || S.m === 'hydemix') && !q.gold.includes(search(q.hyde)[0].id)) {
          const hydeTop = search(q.hyde)[0].id, goldT = new Set(q.gold.flatMap((g) => terms(BY[g].text))), wrongT = new Set(terms(BY[hydeTop].text));
          const pull = [...new Set(terms(q.hyde))].filter((w) => !goldT.has(w) && wrongT.has(w));
          msgs.push(`<p class="bad"><b>Đoạn HyDE kéo tài liệu sai: ${hydeTop} ${BY[hydeTop].title} đứng đầu nhánh HyDE.</b></p><p>Chuyện gì xảy ra: những từ có trong đoạn văn giả, không có trong tài liệu đúng, nhưng có trong ${hydeTop}: <span class="mono">${pull.map(pretty).join(', ') || '(trùng chủ đề, không trùng từ riêng)'}</span>. Vì sao: LLM không biết chính sách của ShopViet, nó viết điều nghe hợp lý. Retriever chỉ so hình dạng, không kiểm đúng sai. Điều này không có nghĩa HyDE vô dụng: với q4 nó vẫn tìm đúng vì đoạn giả viết đúng thuật ngữ "trả góp", dù chính đoạn đó bịa kênh thanh toán ("qua ví điện tử"; chính sách thật là thẻ tín dụng). Retriever chỉ cần hình dạng đúng, nên chi tiết bịa không hại bước tìm, và đoạn HyDE chỉ dùng để tìm, không đưa vào prompt trả lời.</p>${search(q.text)[0].id === hydeTop ? `<p>Lưu ý: query gốc cũng xếp ${hydeTop} hạng 1. HyDE không tạo ra lỗi này, nó chỉ làm lỗi chắc hơn.</p>` : ''}<p><b>Trong hệ thống thật:</b> luôn giữ nhánh query gốc song song, trộn bằng RRF với HyDE nhẹ ký hơn, và với chính sách có phiên bản thì lọc theo ngày hiệu lực.</p>`);
        }
        if (rk < need && rk > 0) msgs.push(`<p class="bad"><b>Chỉ lấy được ${rk}/${need} tài liệu cần.</b> Câu hỏi so sánh hai phần, top-${S.k} toàn là đoạn của một phía. Model sẽ trả lời một nửa, hoặc tự đoán nửa còn lại. Đây là điểm hỏng FP7 (Incomplete) trong README §1.1.</p>`);
        if (rk === 0) msgs.push(`<p class="bad"><b>Không tài liệu đúng nào trong top-${S.k}.</b> Đứng đầu là ${top} ${BY[top].title}. Model sẽ trả lời dựa trên đoạn sai, hoặc nói không biết nếu prompt cho phép.</p>`);
        if (rk === need && rb < need && S.m !== 'base') msgs.push(`<p class="ok"><b>Cách này cứu được câu hỏi:</b> query gốc lấy ${rb}/${need}, cách này lấy ${rk}/${need} trong top-${S.k}.</p>`);
        if (rk === need && !q.gold.includes(top)) msgs.push(`<p class="bad"><b>Đủ tài liệu nhưng tài liệu sai đứng đầu: ${top} ${BY[top].title}.</b> Model nhận cả đoạn đúng lẫn đoạn sai trong context, và đoạn sai nằm trên. Với chính sách có hai phiên bản, model có thể lấy con số của bản cũ. Đây là điểm hỏng FP4 (Not Extracted): đáp án có trong context nhưng model không lấy ra. Recall@k đầy đủ không có nghĩa câu trả lời đúng.</p>`);

        if (rk === need && S.m === 'base') msgs.push(`<p class="ok">Query gốc đã lấy đủ ${need}/${need} với top-${S.k}. Biến đổi query ở đây chỉ tốn thêm thời gian.</p>`);
        if (!msgs.length) msgs.push(`<p>Lấy được ${rk}/${need} tài liệu cần, giống query gốc.</p>`);

      function render() {

        const mx = Math.max(...r.rank.map((x) => x.s)) || 1;

        list.update(full.map((x, i) => {

          const rr = run(q, m), k2 = recall(rr.rank, q.gold, S.k), t = rr.rank[0].id;
          return `<tr${m === S.m ? ' class="cur"' : ''}><td>${name}</td><td class="mono ${k2 === q.gold.length ? 'ok' : 'bad'}"><b>${k2}/${q.gold.length}</b></td><td class="${q.gold.includes(t) ? 'ok' : 'bad'}">${t} ${BY[t].title}</td><td class="mono">${rr.calls}</td><td class="mono">${rr.sent.length}</td></tr>`;
        }).join('') + '</table></div>';
      }
      const own = el('input', { type: 'text', placeholder: 'Gõ câu hỏi của bạn, ví dụ: giao hàng mất bao lâu', style: 'flex:1;min-width:200px;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)' });

      });

          select('Cách biến đổi', MODES, S.m, (v) => { S.m = v; render(); }).node,
          slider('top-k', 1, 5, 1, S.k, (v) => { S.k = v; render(); }).node]),
        whyBox, sentBox, el('div', { style: 'height:8px' }), list.node, stat, cap, table,

        el('p', { class: 'hint', text: 'Bộ chấm đồ chơi: bỏ từ chức năng, gom vài cụm đồng nghĩa (rè, hỏng, mất tiếng thành "lỗi"; đổi mới thành "đổi trả"), trọng số IDF, cosine. Nó không biết "trả tiền dần" là "trả góp", giống một retriever thật thiếu dữ liệu về cách khách nói. Token ước lượng theo 49 từ ≈ 56 token (o200k, Cost optimization §2.1); prompt hướng dẫn 150 token là giả định; giá Haiku 5.5 $0,10 / $0,50 mỗi triệu token input / output lấy từ Cost optimization §2.1.' }));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
