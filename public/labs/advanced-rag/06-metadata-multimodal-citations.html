const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {

<div class="verdict"><b>Hai câu cần nhớ:</b> độ giống không biết ngày và quốc gia, nên điều kiện cứng phải nằm trong filter chứ không nằm trong embedding; trích dẫn chỉ có giá trị khi code kiểm được nó, và kiểm được "có trong nguồn" vẫn chưa phải "ủng hộ khẳng định".</div>`,
    why: {

      s: 'Thêm "ưu tiên chính sách mới nhất" vào prompt: model vẫn chỉ thấy những gì top-3 đưa vào, và bản 2026 có thể không có trong đó. Lọc "version mới nhất": lấy phải bản dự thảo chưa có hiệu lực. Để model tự đoán quốc gia: đoán sai là mất tài liệu đúng. Embed từng dòng đơn hàng để đếm: số đếm phụ thuộc k. Để model tự viết [Nguồn N]: không kiểm được.',
      p: 'Phải có quy trình gắn metadata lúc index và giữ nó đúng khi chính sách đổi (ai nhập effective_to?). Text-to-SQL cần role database riêng, view có mô tả, bước parse SQL và eval theo kết quả chạy. Quote matching chỉ bắt trích dẫn bịa; phần "có ủng hộ không" vẫn cần LLM judge hoặc người đọc.'
    },
    deep: [
      {
        q: 'Embedding đã hiểu nghĩa câu, sao không tự phân biệt 2025 với 2026, Việt Nam với Thái Lan?',
        a: `<p>Vì embedding đo <b>độ giống về nội dung tổng thể</b>. Hai chính sách đổi trả laptop chỉ khác nhau ở năm và vài con số: 95% câu chữ giống nhau, nên vector của chúng nằm sát nhau. Điều phân biệt chúng (năm, quốc gia) lại là phần rất nhỏ của văn bản.</p>
<p>Embedding cũng không có phép so sánh. Nó không biết "27/11/2026 nằm trong khoảng 01/01/2026 tới 31/12/2026". Nó chỉ biết chuỗi "2026" hơi giống chuỗi "2025".</p>
<p>Hình dưới đo độ giống giữa câu mẫu và vài biến thể bằng cosine trên trigram ký tự (đếm cụm 3 ký tự liên tiếp). Đây không phải embedding thật, chỉ là phép đo đơn giản chạy được trong trình duyệt, nhưng cho thấy cùng hiện tượng: đổi năm hoặc đổi nước, độ giống gần như không giảm.</p>`,

      {
        q: 'Vậy giá trị filter lấy từ đâu? Để model đọc câu hỏi rồi đoán được không?',
        a: `<p>README xếp ba nguồn theo độ tin cậy: <b>ngữ cảnh ứng dụng</b> (tài khoản thuộc VN, đang ở trang sản phẩm X), <b>giao diện</b> (bộ lọc người dùng chọn), rồi mới tới <b>model trích từ câu hỏi</b>.</p>
<p>Khi để model trích, dùng structured output với schema có enum, ví dụ <code>{"region": {"enum": ["VN", "TH"]}}</code>, và cho phép để trống. Lý do để trống an toàn hơn đoán: <b>filter sai loại mất tài liệu đúng</b> (không có cách nào lấy lại ở bước sau), còn <b>thiếu filter chỉ làm kết quả nhiễu hơn</b> (tài liệu đúng vẫn có cơ hội lọt top-k).</p>
<p>Bảng dưới chạy cùng hàm lọc của hình chính cho câu "Tôi đang ở Bangkok, laptop mua ở ShopViet đổi mấy ngày?" của khách có tài khoản VN, ngày 27/11/2026, filter ngày hiệu lực luôn bật.</p>`,
        viz(box) {
          const cases = [['Ngữ cảnh ứng dụng: tài khoản VN', 'VN'], ['Model đoán từ chữ "Bangkok"', 'TH'], ['Model không chắc, để trống', '']];

      {
        q: 'Filter chặt quá, trả về 0 kết quả. Nới filter ra cho có câu trả lời được không?',

<ul><li><b>Điều kiện người dùng hoặc ứng dụng đặt</b> (quốc gia tài khoản, bộ lọc trên giao diện, "hết hạn trong tháng 12"): giữ nguyên, trả lời "không tìm thấy" kèm điều kiện đã dùng. Nới nó là trả lời một câu hỏi khác. Với filter theo quyền, nới là lộ dữ liệu.</li>
<li><b>Điều kiện hệ thống tự thêm hoặc model tự đoán</b> khi câu hỏi không nói (ví dụ mặc định "phiên bản đang hiệu lực"): được nới, theo thứ tự định trước, và cho người dùng thấy điều kiện nào đã bị bỏ.</li></ul>
<p>Ví dụ: khách chọn trên giao diện "Thái Lan", hỏi về ngày 15/06/2024. Kho không có chính sách TH năm 2024.</p>`,
        viz(box) {

      {
        q: 'Câu "tuần này có bao nhiêu yêu cầu đổi trả laptop?" thì embed từng đơn hàng rồi RAG không được sao?',
        a: `<p>Không, vì RAG chỉ đưa <b>k</b> đoạn vào context. Model đếm được những gì nó thấy, không đếm được những gì nằm ngoài top-k. Câu trả lời sẽ phụ thuộc k, không phụ thuộc dữ liệu.</p>
<p>Đáp án đếm, cộng, lọc ngày nằm trong bảng. Text-to-SQL cho model viết một câu <code>SELECT COUNT(*) ...</code>, database đếm chính xác trên mọi dòng. Kéo k để xem RAG "đếm" ra bao nhiêu so với SQL trên 14 yêu cầu mẫu (tuần 23–29/11/2026).</p>`,
        viz(box) {
          const out = el('div');

      {
        q: 'Cho model viết SQL rồi chạy thẳng, có nguy hiểm không?',
        a: `<p>Có. Model có thể viết <code>DELETE</code>, đọc bảng khách hàng, hoặc bị prompt injection dẫn tới một câu lệnh lạ. README liệt kê các lớp tối thiểu, và lớp quan trọng nhất nằm <b>ở database</b>, không nằm trong prompt:</p>
<ul><li>Role chỉ có <code>SELECT</code> trên các view được duyệt; row-level security nếu người dùng chỉ được thấy dữ liệu của họ.</li>
<li>Schema đưa cho model là schema đã chọn lọc: view có tên cột dễ hiểu, mô tả cột, vài dòng mẫu.</li>
<li>Parse câu SQL trước khi chạy (ví dụ thư viện <code>sqlglot</code>): đúng một câu SELECT, chỉ trên bảng/view được phép.</li>
<li>Timeout và giới hạn số dòng; trả cả câu SQL cho người dùng xem.</li></ul>
<p>Bảng dưới là một bộ kiểm tra đơn giản bằng regex, chỉ để minh hoạ các luật. Regex không thay được parser thật: comment, chuỗi chứa dấu chấm phẩy hay tên bảng có ngoặc kép đều lừa được nó.</p>`,
        viz(box) {
          const ALLOW = new Set(['v_return_requests', 'v_products']);
          const SQLS = [
            "SELECT COUNT(*) FROM v_return_requests WHERE product_group = 'Laptop' LIMIT 1000",
            "SELECT * FROM v_return_requests; DROP TABLE orders",
            "SELECT full_name, phone FROM customers WHERE city = 'Hà Nội'",
            "DELETE FROM v_return_requests WHERE created_date < '2026-01-01'",
            "SELECT r.order_id FROM v_return_requests r JOIN v_products p ON p.sku = r.sku"
          ];
          function check(sql) {
            const stmts = sql.split(';').map((s) => s.trim()).filter(Boolean), why = [];
            if (stmts.length !== 1) why.push('nhiều hơn một câu lệnh');
            if (!/^select\b/i.test(stmts[0] || '')) why.push('không bắt đầu bằng SELECT');
            if (/\b(insert|update|delete|drop|alter|grant|truncate)\b/i.test(sql)) why.push('có từ khoá ghi hoặc đổi schema');
            const tables = [...sql.matchAll(/\b(?:from|join)\s+([a-z_][a-z0-9_.]*)/gi)].map((m) => m[1].toLowerCase());
            const bad = tables.filter((t) => !ALLOW.has(t));
            if (bad.length) why.push('bảng không được phép: ' + [...new Set(bad)].join(', '));
            const limit = /\blimit\s+\d+/i.test(sql);
            return { ok: !why.length, why, limit };
          }
          let h = '<tr><th>SQL model sinh ra</th><th>Kết quả</th></tr>';
          SQLS.forEach((s) => { const r = check(s); h += `<tr><td class="mono" style="font-size:12px">${esc(s)}</td><td class="${r.ok ? 'ok' : 'bad'}"><b>${r.ok ? 'chạy' : 'chặn'}</b>${r.ok ? (r.limit ? '' : ' (thêm LIMIT ở tầng chạy)') : ': ' + r.why.join('; ')}</td></tr>`; });
          box.append(tbl(h), flag('warn', '<b>Dòng cuối không có LIMIT mà vẫn được chạy.</b> Kiểm tra cú pháp không giới hạn được số dòng hay thời gian: một JOIN hợp lệ vẫn có thể trả cả triệu dòng. Không có nghĩa bộ kiểm tra hỏng; giới hạn đó thuộc tầng chạy. Trong hệ thống thật: statement timeout và giới hạn số dòng đặt ở connection hoặc role database, không tin vào câu SQL.'));

<p>README chia theo <b>dòng</b>, lặp lại header và caption trong mọi chunk (hàm <code>split_table</code>). Hình dưới chạy bản JavaScript của hàm đó trên bảng 10 dòng, so với cách cắt theo ký tự.</p>`,

<p>Giá phải trả là <b>lưu trữ</b>: mỗi trang khoảng 1.030 vector 128 chiều, 257,5 KB ở float16, so với 8,6 KB của BGE-M3 cho cùng trang. Kéo số trang để xem.</p>`,

<p>Với hệ RAG đã có retrieval riêng, Claude nhận kết quả search dạng block <code>search_result</code> trong <code>tool_result</code>. <code>source</code> là id ổn định do hệ thống của bạn cấp (URL hoặc <code>kb://...</code>), nên trích dẫn map ngược về tài liệu gốc mà model không cần chép tên. Citation trả về loại <code>search_result_location</code> với <code>source</code>, <code>title</code>, <code>search_result_index</code> và khoảng block.</p>

        q: 'Trình kiểm tra quote báo "đạt" rồi, vậy câu trả lời chắc đúng chưa? Và sao không bật citations cùng JSON output cho gọn?',
        a: `<p>Chưa. Quote matching chỉ trả lời câu "chuỗi này có nằm trong nguồn không". Nó <b>bắt được trích dẫn bịa</b>, nhưng <b>không bắt được trích dẫn có thật mà không ủng hộ khẳng định</b>. Khẳng định số 4 ở hình chính là ví dụ: quote "7 ngày" có thật trong FAQ điện thoại, nhưng khẳng định nói về laptop. Chuỗi càng ngắn càng dễ khớp tình cờ, nên README khuyên highlight vị trí khớp cho người đọc tự đối chiếu, và để phần "có ủng hộ không" cho LLM judge hoặc người đọc (faithfulness, §3.5).</p>
<p>Về JSON: trên Claude, bật citations cùng <code>output_config.format</code> thì API trả <b>400</b>. Tài liệu citations gợi ý thay bằng: yêu cầu model trả mỗi trường một dòng <code>tên: giá trị</code>, tự parse rồi gắn citation của từng text block vào dòng tương ứng. Prompt đòi "chỉ trả JSON" thì request vẫn thành công nhưng có thể có rất ít hoặc không có citation nào. Gemini File Search thì dùng được cùng structured output từ Gemini 3.</p>
<p>Trích dẫn không đạt thì bỏ khẳng định, hiện cảnh báo, hoặc sinh lại, tuỳ sản phẩm. Ghi tỉ lệ không đạt thành metric: nó tăng là dấu hiệu sớm của prompt hoặc model mới bịa nhiều hơn.</p>`,
        take: 'Kiểm quote là tầng một (có trong nguồn). Tầng hai (có ủng hộ khẳng định) cần judge hoặc người.'
      }

    poc: {
      goal: "Bốn cơ chế chạy thật: metadata filter theo ngày hiệu lực trên độ giống của embedding thật; <code>split_table</code> của README so với cắt ký tự; <code>check_citations</code> của README (chép nguyên) trên 5 trích dẫn, có và không có NFC; đếm bằng SQLite mở read-only. <b>Câu SQL là viết tay</b>, giả làm output model.",
      file: "docs/advanced-rag/pocs/06_metadata_multimodal_citations.py",
      run: "uv run docs/advanced-rag/pocs/06_metadata_multimodal_citations.py",
      needs: "chỉ <code>uv</code> và CPU, miễn phí, không gọi LLM. Embedding <code>paraphrase-multilingual-MiniLM-L12-v2</code> và cross-encoder <code>mmarco-mMiniLMv2</code> chỉ nạp từ cache Hugging Face có sẵn (không tải); thiếu cache thì dense rơi về char-trigram đồ chơi, output ghi rõ.",
      output: "Độ giống tính bằng paraphrase-multilingual-MiniLM-L12-v2 (thật, CPU) cho câu: 'Laptop đổi trả trong mấy ngày?'\n\n== 1. Metadata filter: cùng câu hỏi, ngày hỏi khác nhau, khách tài khoản VN ==\nTài liệu          cosine\n----------------  ------\nreturn-2027-vn    0.844\nreturn-2026-vn    0.788\nreturn-2025-vn    0.759\nreturn-2024-vn    0.716\nreturn-2025-th    0.707\nreturn-2026-th    0.674\nwarranty-2026-vn  0.597\nNgày hỏi    đúng     không lọc    region=VN    VN + bản mới nhất  VN + đang hiệu lực\n----------  -------  -----------  -----------  -----------------  ------------------\n15/06/2025  15 ngày  14 ngày SAI  14 ngày SAI  14 ngày SAI        15 ngày OK\n27/11/2026  7 ngày   14 ngày SAI  14 ngày SAI  14 ngày SAI        7 ngày OK\n01/02/2027  14 ngày  14 ngày OK   14 ngày OK   14 ngày OK         14 ngày OK\n\n== 2. Bảng PDF dài: split_table của README §2.8 so với cắt theo ký tự ==\nCách chia           số chunk  chunk có header  chunk BM25 top-1  header trong top-1\n------------------  --------  ---------------  ----------------  ------------------\ncắt 120 ký tự       3         1                có dòng Tai nghe  KHÔNG\nsplit_table 3 dòng  3         3                có dòng Tai nghe  có\nChunk cắt ký tự chứa 'Tai nghe': 'nh bảng | 7 ngày | 5% |\\n| Tai nghe | 15 ngày | 0% |\\n| Loa | 15 ngày | 0% |\\n| Màn hình | 10 ngày | 3% |\\n| Bàn phím, chuột'\n\n== 3. check_citations của README §2.8 (chép nguyên), chạy trên 5 trích dẫn ==\nKhẳng định                         độ dài quote  README (có NFC)                   bỏ NFC\n---------------------------------  ------------  --------------------------------  --------------------------------\nLaptop đổi trong 7 ngày            53            ĐẠT                               ĐẠT\nLỗi NSX không mất phí (quote NFD)  60            ĐẠT                               quote không có trong nguồn\nTrường hợp khác thu 3%             38            quote không có trong nguồn        quote không có trong nguồn\nĐơn SV-4821 (laptop) còn hạn đổi   6             ĐẠT                               ĐẠT\nNăm 2025 đổi trong 15 ngày         21            source_id không có trong context  source_id không có trong context\n\n== 4. Đếm trên bảng: SQL (câu SQL VIẾT TAY, giả làm output model), DB mở read-only ==\nSELECT COUNT(*) FROM return_requests WHERE category='Laptop' AND kind='đổi trả' AND day BETWEEN 20261123 AND 20261129\n  → 5 yêu cầu đổi trả laptop tuần 23–29/11\n'DELETE FROM return_requests'                 → bị chặn: attempt to write a readonly database\n'SELECT 1; DROP TABLE return_requests'        → bị chặn: You can only execute one statement at a time.\n\nRút ra: embedding thật xếp return-2027-vn cao nhất (0.844), nên không lọc hay chỉ lọc VN đều trả '14 ngày';\n'bản mới nhất' cũng chọn dự thảo 2027 chưa có hiệu lực. Chỉ lọc VN + đang hiệu lực vào ngày hỏi đúng ở cả 3 ngày.\nBảng: cắt ký tự để dòng Tai nghe ở chunk không có header; split_table lặp header trong mọi chunk.\ncheck_citations bắt quote bịa (3%) và nguồn không có trong context; không có NFC thì quote NFD đúng bị báo sai;\nquote '7 ngày' của FAQ điện thoại vẫn ĐẠT dù không ủng hộ khẳng định về laptop: phần đó cần judge hoặc người đọc.",
      measured: true,
      read: ["Bảng cosine: embedding thật xếp <b>dự thảo 2027</b> cao nhất (0,844), không phải bản 2025 như ví dụ của lab. Không lọc, lọc VN, hay 'bản mới nhất' đều trả '14 ngày'.", "Chỉ lọc VN + đang hiệu lực vào ngày hỏi đúng ở cả 15/06/2025, 27/11/2026 và 01/02/2027.", "Trích dẫn: bỏ NFC thì quote NFD đúng bị báo 'không có trong nguồn'; quote '7 ngày' của FAQ điện thoại vẫn ĐẠT cho khẳng định về laptop.", "SQLite read-only chặn DELETE; driver chặn chuỗi nhiều câu lệnh."]

    mount(stage) {
      const F = { region: '', ver: '', date: 20261127 };
      const jsonBox = el('div'), tableBox = el('div'), stat = el('div', { class: 'stat' }), flags = el('div');
      function render() {
        const r = runFilter(F), topIds = new Set(r.top.map((d) => d.id)), poolIds = new Set(r.pool.map((d) => d.id));
        jsonBox.replaceChildren(pre(filterJson(F)));
        let h = '<tr><th>Tài liệu</th><th>Nước</th><th>Bản</th><th>Hiệu lực</th><th>Độ giống</th><th>Trạng thái</th></tr>';
        DOCS.slice().sort((a, b) => b.sim - a.sim).forEach((d) => {
          const inPool = poolIds.has(d.id), inTop = topIds.has(d.id), isTruth = r.truth && d.id === r.truth.id;
          const st = !inPool ? '<span class="mute">bị filter loại</span>' : inTop ? '<b style="color:var(--accent)">top-3</b>' : '<span class="mute">qua filter, ngoài top-3</span>';
          h += `<tr style="${inPool ? '' : 'opacity:.45'}"><td>${d.title}${isTruth ? ' <b class="ok">(đáp án đúng)</b>' : ''}</td><td class="mono">${d.region}</td><td class="mono">${d.ver}</td><td class="mono">${fmtD(d.from)}–${fmtD(d.to)}</td><td><div style="display:flex;align-items:center;gap:6px"><div style="width:70px;height:8px;background:var(--line);border-radius:4px"><div style="width:${d.sim * 100}%;height:8px;background:${inTop ? 'var(--accent)' : 'var(--dim)'};border-radius:4px"></div></div><span class="mono">${d.sim.toFixed(2)}</span></div></td><td>${st}</td></tr>`;
        });
        tableBox.replaceChildren(tbl(h));
        const ok = r.ans && r.truth && r.ans.days === r.truth.days;
        stat.innerHTML = `<span>Qua filter: <b>${r.pool.length}/${DOCS.length}</b></span><span>Trợ lý trả lời: <b class="${ok ? 'ok' : 'bad'}">${r.ans ? r.ans.days + ' ngày' : 'không tìm thấy'}</b>${r.ans ? ' (từ ' + r.ans.title + ')' : ''}</span><span>Đáp án đúng ngày ${fmtD(F.date)}: <b>${r.truth ? r.truth.days + ' ngày' : 'không có chính sách VN hiệu lực'}</b></span>`;
        const fl = [];
        if (!r.pool.length) fl.push(flag('warn', '<b>Filter trả 0 tài liệu.</b> Không nới các điều kiện người dùng hoặc ứng dụng đặt; trả lời "không tìm thấy" kèm điều kiện đã dùng (câu hỏi 3).'));
        else if (r.ans && r.ans.from > F.date) fl.push(flag('bad', `<b>${F.ver === 'max' ? 'Lấy "phiên bản mới nhất" ra ' : 'Top-1 là '}${r.ans.title}, chưa có hiệu lực vào ${fmtD(F.date)}: trả lời ${r.ans.days} ngày${r.truth ? ' thay vì ' + r.truth.days : ''}.</b> ${F.ver === 'max' ? 'Version lớn nhất không có nghĩa là đang áp dụng. Không có nghĩa lọc theo version là sai; nghĩa là "mới nhất" phải tính tại ngày hỏi.' : 'Embedding không biết bản nào đã có hiệu lực. Không có nghĩa retrieval hỏng: nó xếp đúng theo độ giống.'} Trong hệ thống thật: lọc effective_from ≤ ngày hỏi ≤ effective_to; bản nháp gắn trạng thái riêng hoặc không đưa vào index của trợ lý khách hàng.`));
        else if (r.ans && r.truth && r.ans.region === r.truth.region && !ok) fl.push(flag('bad', `<b>Chính sách cũ thắng: ${r.ans.title} (độ giống ${r.ans.sim.toFixed(2)}) đứng trên bản đang hiệu lực (${r.truth.sim.toFixed(2)}), trợ lý trả lời ${r.ans.days} ngày thay vì ${r.truth.days}.</b> Bản cũ chỉ tình cờ có câu chữ gần câu hỏi hơn; embedding không biết ngày nào đang áp dụng. Không có nghĩa retrieval hỏng: nó làm đúng việc xếp theo độ giống. Trong hệ thống thật: gắn ngày hiệu lực vào metadata và lọc theo ngày hỏi (README §3.6: "Chính sách cũ cạnh tranh với chính sách mới").`));
        else if (r.ans && !r.truth) fl.push(flag('warn', `<b>Không có chính sách VN nào hiệu lực vào ${fmtD(F.date)}, nhưng trợ lý vẫn trả lời ${r.ans.days} ngày.</b> Đây là FP1 (Missing Content): đáp án không có, hệ thống vẫn trả lời. Trong hệ thống thật: bật filter ngày hiệu lực để retrieval trả 0, và cho phép model nói "không có trong tài liệu".`));
        else if (r.ans && r.ans.region !== 'VN') fl.push(flag('bad', `<b>Trả lời theo chính sách ${r.ans.region}: ${r.ans.days} ngày.</b> Khách có tài khoản VN, nhưng chính sách Thái Lan giống câu hỏi không kém. Trong hệ thống thật: quốc gia lấy từ tài khoản, lọc cứng.`));
        else if (ok) fl.push(flag('ok', `Đúng: ${r.ans.days} ngày theo ${r.ans.title}.`));
        if (r.pool.length && !F.region && r.top.some((d) => d.region !== 'VN')) fl.push(flag('warn', `<b>Top-3 có ${r.top.filter((d) => d.region !== 'VN').length} tài liệu của ShopViet Thái Lan.</b> "Việt Nam" và "Thái Lan" nằm khá gần nhau trong không gian vector (README §2.6). Kể cả khi câu trả lời đúng, các đoạn này là nhiễu trong context.`));
        if (r.contradict) fl.push(flag('warn', `<b>Context có ${new Set(r.top.filter((d) => d.days != null).map((d) => d.days)).size} con số khác nhau cho cùng câu hỏi (${[...new Set(r.top.filter((d) => d.days != null).map((d) => d.days))].join(', ')} ngày).</b> Các đoạn mâu thuẫn là nguyên nhân hay gặp của FP4 (đáp án nằm trong context mà model không lấy đúng). Model ở đây giả định chọn đoạn đứng đầu; model thật có thể chọn bất kỳ đoạn nào.`));
        flags.replaceChildren(...fl);
      }
      stage.append(el('div', { class: 'row' }, [
        select('Quốc gia', [['', 'Không lọc'], ['VN', 'region = VN (từ tài khoản)'], ['TH', 'region = TH']], F.region, (v) => { F.region = v; render(); }).node,
        select('Phiên bản', [['', 'Không lọc'], ['max', 'version mới nhất'], ['eff', 'Đang hiệu lực tại ngày hỏi']], F.ver, (v) => { F.ver = v; render(); }).node,
        select('Ngày hỏi', DATES.map(([v, t]) => [String(v), t]), String(F.date), (v) => { F.date = +v; render(); }).node]),
      el('p', { class: 'hint', html: 'Câu hỏi: <b>"Laptop đổi trả trong mấy ngày?"</b>, khách tài khoản VN. Top-k = 3 (chỉ 3 tài liệu giống nhất được đưa cho model). Độ giống là số dựng sẵn cho ví dụ, không phải đo bằng model.' }),
      flag('warn', '<b>Embedding thật xếp khác lab này.</b> Ở đây bản 2025 đứng đầu khi không lọc (0,91, số dựng sẵn). POC chạy embedding thật <code>paraphrase-multilingual-MiniLM-L12-v2</code> trên cùng câu hỏi thì xếp <b>dự thảo 2027</b> đầu (0,844), rồi 2026 (0,788), rồi 2025 (0,759), nên không lọc sẽ trả "14 ngày". Vì sao: thứ tự do câu chữ của từng tài liệu quyết định, không do năm; đổi model hay đổi cách viết là đổi thứ tự. Không có nghĩa lab sai bài học: bản nào thắng thì cũng là may rủi, và cả hai cách đều ra sai phiên bản. Trong hệ thống thật: không có filter "đang hiệu lực" thì bạn nhận nhầm phiên bản; chỉ VN + đang hiệu lực đúng ở cả ba ngày hỏi trong POC.'),
      jsonBox, tableBox, stat, flags);
      render();

      stage.append(el('h4', { text: 'Kiểm tra trích dẫn: quote có nguyên văn trong nguồn không?', style: 'margin:24px 0 4px' }));
      const C = { nfc: true, quote: '0 đồng nếu lỗi do nhà sản xuất', sid: 'kb://policy/return-2026-vn#sec-2' };
      const srcBox = el('div'), resBox = el('div'), cflags = el('div'), custom = el('div');
      srcBox.append(tbl('<tr><th>source_id (đã đưa vào prompt)</th><th>Nội dung</th></tr>' + Object.entries(SRC).map(([k, v]) => `<tr><td class="mono" style="font-size:12px">${k}</td><td>${esc(v)}</td></tr>`).join('')));
      const qInput = el('input', { type: 'text', value: C.quote, style: 'flex:1;min-width:200px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)', oninput: (e) => { C.quote = e.target.value; renderC(); } });
      function row(c, i, r) {
        const where = r.ok ? highlight(SRC[c.source_id], r.at, r.len) : (SRC[c.source_id] ? esc(SRC[c.source_id]) : '<span class="mute">(không có trong context)</span>');
        const cls = !r.ok ? 'bad' : r.short ? 'warn' : 'ok', st = !r.ok ? 'không đạt: ' + r.why : r.short ? 'đạt, nhưng quote ngắn' : 'đạt';
        return `<tr><td class="mono">${i}</td><td>${esc(c.claim)}</td><td class="mono" style="font-size:12px">${esc(c.source_id)}<br>"${esc(c.quote)}"${c.nfd ? ' <span class="mute">(lưu dạng NFD)</span>' : ''}</td><td style="color:var(--${cls})"><b>${st}</b></td><td style="font-size:12.5px">${where}</td></tr>`;
      }
      function renderC() {
        const res = CLAIMS.map((c) => checkCitation(c, C.nfc));
        resBox.replaceChildren(tbl('<tr><th>#</th><th>Khẳng định</th><th>Trích dẫn model trả</th><th>Kết quả</th><th>Vị trí khớp trong nguồn</th></tr>' + CLAIMS.map((c, i) => row(c, i + 1, res[i])).join('')));
        const cc = { claim: '(quote bạn tự nhập)', source_id: C.sid, quote: C.quote }, cr = checkCitation(cc, C.nfc);
        custom.replaceChildren(tbl(row(cc, '+', cr)));
        const fails = res.filter((r) => !r.ok).length, fl = [];
        fl.push(el('div', { class: 'stat', html: `<span>Trích dẫn không đạt: <b class="${fails ? 'bad' : 'ok'}">${fails}/${CLAIMS.length}</b></span><span>Đạt nhưng quote ngắn: <b>${res.filter((r) => r.ok && r.short).length}</b></span>` }));
        if (!C.nfc && !res[1].ok) fl.push(flag('bad', '<b>Khẳng định 2 bị đánh trượt dù quote đúng từng chữ.</b> Quote được lưu ở dạng NFD (chữ "ổ" là "o" + 2 dấu tổ hợp), nguồn ở dạng NFC. Nhìn giống hệt, so chuỗi khác. Không có nghĩa model bịa. Trong hệ thống thật: <code>unicodedata.normalize("NFC", s)</code> cả quote lẫn nguồn trước khi so, như hàm <code>_norm</code> của README.'));
        if (res[2] && !res[2].ok) fl.push(flag('bad', '<b>Khẳng định 3 bịa con số: nguồn ghi 5%, quote ghi 3%.</b> Đây đúng là loại lỗi quote matching được thiết kế để bắt. Trong hệ thống thật: bỏ khẳng định, hiện cảnh báo, hoặc sinh lại; ghi tỉ lệ không đạt thành metric.'));
        if (res[3] && res[3].ok) fl.push(flag('warn', '<b>Khẳng định 4 đạt, nhưng quote "7 ngày" nằm trong FAQ điện thoại, không phải chính sách laptop, và không nói gì về đơn SV-4821.</b> Chuỗi ngắn dễ khớp tình cờ. Không có nghĩa trình kiểm tra lỗi: nó chỉ hứa kiểm "có trong nguồn". Trong hệ thống thật: highlight chỗ khớp cho người đọc đối chiếu, và đo "có ủng hộ khẳng định không" bằng LLM judge hoặc người (faithfulness).'));
        if (res[4] && !res[4].ok) fl.push(flag('bad', '<b>Khẳng định 5 trích một nguồn không hề có trong context.</b> Model biết (từ dữ liệu huấn luyện hoặc lượt trước) rằng có chính sách 2025 và tự tạo id. Chỉ id do hệ thống gán khi ghép context mới được chấp nhận.'));
        if (!cr.ok && cr.why === 'quote không có trong nguồn' && C.quote.trim()) fl.push(flag('warn', 'Quote bạn nhập không có nguyên văn trong nguồn đã chọn. Thử bỏ bớt một chữ, đổi chữ hoa, thêm khoảng trắng thừa: chữ hoa và khoảng trắng được chuẩn hoá, còn chữ thì phải khớp.'));
        cflags.replaceChildren(...fl);
      }
      const nfcSel = select('Chuẩn hoá trước khi so', [['1', 'NFC + chữ thường + gộp khoảng trắng'], ['0', 'Chỉ chữ thường + gộp khoảng trắng (không NFC)']], '1', (v) => { C.nfc = v === '1'; renderC(); });
      const sidSel = select('Nguồn', Object.keys(SRC).map((k) => [k, k.replace('kb://', '')]), C.sid, (v) => { C.sid = v; renderC(); });
      stage.append(el('p', { class: 'hint', html: 'Câu hỏi của khách: "Laptop đơn SV-4821 nhận ngày 22/11, đổi được không, có mất phí không?". Model trả lời kèm 5 cặp (source_id, quote). Câu trả lời và trích dẫn là dữ liệu dựng sẵn để minh hoạ, không phải output của model thật.' }),
        srcBox, el('div', { class: 'row' }, [nfcSel.node]), resBox, cflags,
        el('h4', { text: 'Tự thử một quote', style: 'margin:16px 0 4px' }),
        el('div', { class: 'row' }, [sidSel.node, el('label', { class: 'ctl', style: 'display:flex;gap:6px;align-items:center;flex:1' }, ['Quote', qInput])]), custom,
        el('p', { class: 'hint', text: 'Kiểm tra là bản JavaScript của check_citations trong README §2.8: NFC, casefold (ở đây là toLowerCase), thay ngoặc kép cong bằng ngoặc thẳng, gộp khoảng trắng, rồi tìm chuỗi con. Quote dưới 15 ký tự được đánh dấu "ngắn" theo ngưỡng giả định của lab này.' }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
