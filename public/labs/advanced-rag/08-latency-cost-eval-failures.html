const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

<p>Giá model (Cost optimization §2.1, 06/11/2026, USD / 1M token input / output): Haiku 5.5 0,10 / 0,50 (gấp 5 khi prompt vượt 100.000 token), Sonnet 5.5 2 / 10, Opus 5.5 4 / 20, gpt-6-luna 0,10 / 0,50, gpt-6.1-terra 1 / 5, Gemini 3.5 Flash-Lite 0,30 / 2,50, Gemini 3.8 Flash 0,75 → 1,50 / 3,75 → 7,50 (tăng từ 01/01/2027). Mỗi tầng một span trong trace.</p>
<h4>Eval cho RAG nâng cao (§3.5)</h4>
<ul><li>Chia tập theo nhóm: tra cứu, nhiều phần, nhiều bước, tổng hợp, không có đáp án, quyền (tỉ lệ không rò rỉ phải là 100%).</li>

<li>RAGAS: tên metric đổi qua phiên bản; đọc định nghĩa trước khi đặt ngưỡng. LLM chấm so cặp thiên lệch: ưu tiên câu hỏi có đáp án kiểm tra được; với câu tổng hợp, rubric, đổi vị trí và chấm hai lần, người kiểm một mẫu.</li></ul>

        el('p', { class: 'hint', text: 'Giá model: Cost optimization §2.1 (06/11/2026). Giá Voyage, Cohere trên Bedrock, OpenAI file_search, Bedrock Retrieve: README §2.2, §3.4. Embed query coi như $0 ("rất nhỏ"). Giả định: system prompt generation 600 token, viết lại query 250 in / 40 out; TTFT 300/450/700 ms và tốc độ 150/100/60 token/s cho model nhỏ/vừa/lớn, cộng 1 ms mỗi 50 token input; rerank 40 ms + 0,6 ms mỗi candidate; tìm kiếm managed 250 ms. Cohere trên Bedrock tính phẳng mỗi query, chưa tính cách tách tài liệu trên 500 token. Generation chưa tính lịch sử hội thoại.' }));
      render();

      stage.append(el('h4', { text: 'Eval trên 14 câu hỏi có nhãn: tách retrieval khỏi generation', style: 'margin:24px 0 4px' }));
      const E = { p: 'B', cmp: 'A' }, eOut = el('div');
      function cell(b, k, g) { return g === 'none' || g === 'perm' ? '<td class="mono mute">-</td>' : `<td class="mono">${b.ans ? pct(b[k] / b.ans) : '-'}</td>`; }
      function renderE() {
        const P = evalPipe(E.p), Q = evalPipe(E.cmp);
        const row = (g, name) => { const b = P[g], c = Q[g], d = b.ok / b.n - c.ok / c.n; return `<tr${g === 'all' ? ' style="font-weight:600"' : ''}><td>${name}</td><td class="mono">${b.n}</td>${cell(b, 'rec', g)}${cell(b, 'ctx', g)}<td class="mono"><b>${b.ok}/${b.n}</b> <span class="${d > 0 ? 'ok' : d < 0 ? 'bad' : 'mute'}">(${d > 0 ? '+' : ''}${(d * b.n).toFixed(0)} so với ${E.cmp})</span></td><td class="mono">${b.fp2}</td><td class="mono">${b.fp3}</td><td class="mono">${b.fp4}</td><td class="mono">${b.fp1}</td><td class="mono ${b.leak ? 'bad' : ''}"><b>${b.leak}</b></td></tr>`; };
        const head = '<tr><th>Nhóm</th><th>n</th><th>Recall@50</th><th>Đáp án trong context</th><th>Đúng</th><th>FP2 retrieval</th><th>FP3 rơi khỏi context</th><th>FP4 generation</th><th>FP1</th><th>Rò rỉ</th></tr>';
        const detail = '<tr><th>Câu hỏi</th><th>Nhóm</th><th>' + E.p + '</th><th>' + E.cmp + '</th></tr>' + QS.map((q) => { const a = classify(q, E.p), c = classify(q, E.cmp); return `<tr><td>${q.q}</td><td>${GROUPS[q.g]}</td><td style="color:var(--${CLS[a][1]})">${CLS[a][0]}</td><td style="color:var(--${CLS[c][1]})">${CLS[c][0]}</td></tr>`; }).join('');
        const retr = P.all.fp2 + P.all.fp3, genF = P.all.fp4 + P.all.fp1, fl = [];
        if (P.all.ok === Q.all.ok && E.p !== E.cmp) { const diff = Object.keys(GROUPS).filter((g) => P[g].ok !== Q[g].ok).map((g) => `${GROUPS[g]} ${P[g].ok}/${P[g].n} so với ${Q[g].ok}/${Q[g].n}`); fl.push(flag('warn', `<b>${E.p} và ${E.cmp} cùng ${P.all.ok}/${P.all.n} câu đúng, nhưng khác nhau ở ${diff.length} nhóm: ${diff.join('; ')}.</b> Con số tổng bằng nhau vì thắng ở nhóm này bù thua ở nhóm kia. Không có nghĩa hai pipeline tương đương. Trong hệ thống thật: báo cáo eval theo nhóm, quyết định theo nhóm quan trọng với sản phẩm.`)); }
        if (P.all.leak) fl.push(flag('bad', `<b>${E.p} rò rỉ quyền ở ${P.all.leak}/${P.perm.n} câu nhóm quyền.</b> ${E.p === 'B' ? 'Nhánh BM25 mới thêm không được gắn filter nhóm; chỉ nhánh dense có.' : 'Nhánh BM25 thiếu filter nhóm, và 12 đoạn vào prompt kéo thêm biên bản kỷ luật vào context.'} README: tỉ lệ không rò rỉ phải là 100%; ứng dụng phải gắn filter vào mọi truy vấn. Trong hệ thống thật: nhóm quyền trong CI, fail là chặn deploy, bất kể điểm các nhóm khác.`));
        if (P.all.fp4 > Q.all.fp4) fl.push(flag('warn', `<b>${E.p} có ${P.all.fp4} lỗi FP4 (đáp án trong context mà trả lời sai), ${E.cmp} có ${Q.all.fp4}.</b> ${E.p === 'C' ? '12 đoạn vào prompt kéo theo chính sách phí 2025 cạnh bản 2026; model chọn nhầm. ' : ''}Thêm đoạn tăng khả năng có đáp án trong context, nhưng mỗi đoạn thêm là thêm nhiễu (README §1.2).`));
        if (P.all.fp1 > Q.all.fp1) fl.push(flag('warn', `<b>${E.p} trả lời ${P.all.fp1}/${P.none.n} câu không có đáp án, ${E.cmp} chỉ ${Q.all.fp1}.</b> Retrieval mạnh hơn luôn tìm được "thứ gì đó" để model bám vào. Nhóm không có đáp án là cách duy nhất thấy lỗi này.`));
        const q6 = QS[5];
        if (['A', 'B', 'C'].every((p) => classify(q6, p) === 'fp2')) fl.push(flag('warn', '<b>"Gói ShopCare Pro có hoàn tiền không?" sai ở cả ba pipeline, đều là FP2.</b> Chunk chứa điều khoản hoàn tiền không có chữ "ShopCare Pro" nào. Hybrid hay rerank không cứu được; sửa ở chunk: contextual retrieval hoặc parent–child (README §2.3, §2.4).'));
        eOut.replaceChildren(el('div', { class: 'stat', html: `<span>${E.p} đúng: <b>${P.all.ok}/${P.all.n}</b> (${pct(P.all.ok / P.all.n)})</span><span>Lỗi retrieval (FP2 + FP3): <b>${retr}</b></span><span>Lỗi generation (FP4 + FP1): <b>${genF}</b></span><span>Rò rỉ: <b class="${P.all.leak ? 'bad' : 'ok'}">${P.all.leak}</b></span>` }),
          tbl(head + Object.entries(GROUPS).map(([g, n]) => row(g, n)).join('') + row('all', 'Tổng')), ...fl,
          el('details', { style: 'margin-top:10px' }, [el('summary', { text: 'Chi tiết từng câu' }), tbl(detail)]));
      }
      stage.append(el('div', { class: 'row' }, [select('Pipeline', Object.entries(PIPES), E.p, (v) => { E.p = v; renderE(); }).node, select('So với', Object.entries(PIPES), E.cmp, (v) => { E.cmp = v; renderE(); }).node]), eOut,
        el('p', { class: 'hint', text: 'Phân loại: nhóm tra cứu và nhiều phần, câu sai mà tài liệu đúng không có (đủ) trong top-50 là FP2; có trong top-50 nhưng không (đủ) vào context là FP3; có trong context mà vẫn sai là FP4. Nhóm không có đáp án: trả lời thay vì từ chối là FP1. Nhóm quyền: trả nội dung tài liệu không được phép là rò rỉ. Kết quả từng câu là dữ liệu dựng sẵn.' }));
      renderE();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
