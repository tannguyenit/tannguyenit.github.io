const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

        a: `<p><b>Chuyện gì xảy ra:</b> cùng kịch bản 40 bước, cùng ngưỡng mặc định 150.000. Hình chính: context lớn nhất khoảng 160.000 token, compaction chạy một lần. POC: request cuối chỉ 107.032 token, compaction không chạy lần nào, nên hàng "tóm tắt @ 150.000" trong POC giống hệt hàng "không dọn".</p>
<p><b>Vì sao:</b> hai bên dựng tool result khác nhau và đếm khác nhau. Hình chính tự sinh tool result và ước lượng thô (số ký tự / 3,5). POC dùng văn bản độn riêng, đếm bằng tiktoken (tokenizer của OpenAI; Claude dùng tokenizer khác nên số thật lại khác nữa). Chênh khoảng 50.000 token là đủ để nằm trên hoặc dưới ngưỡng. Ngưỡng là con số cứng: lệch một token cũng quyết định có tóm tắt hay không.</p>
<p><b>Không có nghĩa là:</b> phiên 40 bước an toàn khỏi compaction, hay compaction vô hại. Chỉ cần phiên dài hơn, tool result lớn hơn, hoặc ngưỡng thấp hơn là nó chạy: POC hạ ngưỡng xuống 60.000 thì tóm tắt một lần và mất ràng buộc voucher.</p>
<p><b>Trong hệ thống thật:</b> đọc số token API trả về trong trường <code>usage</code> của mỗi response (với Claude, cộng cả phần đọc và ghi cache, vì <code>input_tokens</code> chỉ là phần không qua cache), không ước lượng bằng số ký tự. Vẽ phân phối độ dài phiên thật rồi mới quyết định ngưỡng, và ghi ràng buộc ra NOTES.md để không phụ thuộc chuyện compaction có chạy hay không.</p>`,
        take: 'Compaction có chạy hay không phụ thuộc cách đếm token và độ dài phiên. Đừng thiết kế sao cho đúng sai của câu trả lời dựa vào chuyện đó.'

<p>Hai lựa chọn khác từ README:</p>

<p>Cách họ xử lý dùng hai vai. <b>Initializer agent</b> chạy một lần: dựng <code>init.sh</code>, file <code>claude-progress.txt</code>, commit git đầu tiên, và một file JSON hơn 200 feature, mỗi feature có <code>passes</code> bắt đầu bằng false. <b>Coding agent</b> mỗi phiên đọc file tiến độ và git log, chọn một feature chưa pass, làm, kiểm tra end-to-end, rồi mới đổi <code>passes</code> thành true và commit.</p>

    mount(stage) {
      const st = { strat: 'none', T: DEF_T.none, K: 3, notes: false, N: 40 };
      const chart = el('div'), stat = el('div', { class: 'stat' }), facts = el('div'), cmp = el('div'), cap = el('div', { class: 'qa-viz' }), ans = el('div');
      function drawChart(R) {

          let acc = 0;

        facts.innerHTML = '<h4 style="margin:16px 0 6px">Dữ kiện nào còn tới câu trả lời cuối?</h4><div class="tbl"><table><tr><th>Bước</th><th>Dữ kiện</th><th>Loại</th><th>Cần để trả lời</th><th>Cuối phiên</th></tr>' +
          FACTS.map((f) => { const [t, c] = ST[R.status[f.id]]; return '<tr><td>' + (f.step || 'tin nhắn đầu') + '</td><td>' + f.text + '</td><td>' + KIND[f.kind] + '</td><td>' + (f.need ? 'có' : '') + '</td><td><b class="' + (f.need || c === 'ok' ? c : '') + '">' + t + '</b></td></tr>'; }).join('') + '</table></div>';
        ans.innerHTML = '<p style="margin:10px 0 0"><b>Câu trả lời cuối (mô phỏng):</b> <span class="' + (A.ok ? 'ok' : 'bad') + '">' + A.text + '</span></p>';
        cmp.replaceChildren(el('h4', { text: 'Chi phí cả phiên, cùng thông số (ngưỡng mặc định README cho chiến lược không chọn)', style: 'margin:16px 0 6px' }),
          hbars(STRATS.map(([s, nm]) => [nm, all[s].cost, s === st.strat]), { max: Math.max(...STRATS.map(([s]) => all[s].cost)), fmt: usd }));
        const c = caption(R, all, A);
        cap.style.borderLeft = '3px solid var(--' + c.lvl + ')';
        cap.innerHTML = '<div style="font-size:13.5px"><p style="margin:0 0 4px"><b>Chuyện gì xảy ra:</b> ' + c.what + '</p><p style="margin:0 0 4px"><b>Vì sao:</b> ' + c.why + '</p><p style="margin:0 0 4px"><b>Không có nghĩa là:</b> ' + c.not + '</p><p style="margin:0"><b>Trong hệ thống thật:</b> ' + c.real + '</p></div>';
      }
      function caption(R, all, A) {
        if (st.strat === 'none') return { lvl: R.distract > 0.9 ? 'warn' : 'accent', what: 'Context tăng đều tới ' + fmtT(R.peak) + ' token; ' + Math.round(R.distract * 100) + '% trong đó không chứa dữ kiện cần cho câu trả lời. Câu trả lời đúng vì mọi thứ còn nguyên.', why: 'Mỗi tool result ở lại và được gửi lại ở mọi request sau. Cache giữ giá thấp (' + usd(R.cost) + '), nhưng model vẫn phải đọc đủ ' + fmtT(R.peak) + ' token ở bước cuối.', not: 'Không có nghĩa là rẻ thì ổn: cache giảm giá, không giảm độ dài model phải đọc. Context rot (Chroma) đến từ độ dài và distractor.', real: 'Agent đọc nhiều (tìm kiếm, log) nên bật context editing; giới hạn kích thước tool result ngay ở tool.' };

        if (!R.sumCalls) return { lvl: 'warn', what: 'Ngưỡng ' + fmtT(R.T) + (R.clamp ? ' (đã kẹp lên mức tối thiểu 50.000 của API)' : '') + ' chưa bị chạm trong ' + st.N + ' bước, compaction không chạy. Context vẫn phình như không quản lý.', why: 'Context lớn nhất chỉ ' + fmtT(R.peak) + '. Ngưỡng mặc định 150.000 dành cho phiên rất dài.', not: 'Không có nghĩa là compaction vô dụng ở đây; thử kéo số bước lên hoặc hạ ngưỡng.', real: 'Đặt ngưỡng theo phân bố độ dài phiên đo được, không theo mặc định.' };
        const lostC = R.lostNeed.some((f) => f.id === 'constraint');

      }
      const tSl = slider('Ngưỡng kích hoạt', 30000, 160000, 5000, st.T, (v) => { st.T = v; render(); }, fmtT);
      const sSel = select('Chiến lược', STRATS, st.strat, (v) => { st.strat = v; st.T = DEF_T[v]; tSl.input.value = st.T; tSl.node.querySelector('output').textContent = fmtT(st.T); render(); });
      const nSl = slider('Số bước', 34, 60, 1, st.N, (v) => { st.N = v; render(); });
      const kSl = slider('Giữ N kết quả gần nhất', 1, 10, 1, st.K, (v) => { st.K = v; render(); });
      const nb = el('button', { text: 'Ghi ràng buộc ra NOTES.md', onclick: () => { st.notes = !st.notes; nb.classList.toggle('on', st.notes); render(); } });
      stage.append(el('div', { class: 'row' }, [sSel.node, nb]), el('div', { class: 'row' }, [nSl.node, tSl.node, kSl.node]), chart, stat, ans, cap, facts, cmp,
        el('p', { class: 'hint', text: 'Bản tóm tắt là mô phỏng: giả định 3.000 token, giữ dữ kiện chính và quyết định, bỏ chi tiết và câu nói kèm. Mỗi bước output khoảng 90 token cộng lời gọi tool. Ngưỡng mặc định lấy từ README: 100.000 cho clear_tool_uses, 150.000 cho compaction (tối thiểu 50.000).' }),

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])

      pocBlock(l.poc)

    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
