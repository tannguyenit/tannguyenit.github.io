const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

    summary: `<h3>Tóm tắt bài</h3>
<p>Ranh giới giữa workflow và agent là <b>ai quyết định bước kế tiếp</b> (README §1.1). Agent cho phép xử lý tin nhắn không khớp nhánh nào, đổi lại mỗi bước là một lượt model gửi lại toàn bộ lịch sử, số bước không biết trước, và một quyết định sai có thể thành hành động thật.</p>

<div class="tbl"><table>

<tr><td><code>max_tokens</code></td><td>Hết trần output</td><td>Không thực thi tool call dở; tăng trần hoặc dừng</td></tr>
<tr><td><code>refusal</code>, <code>model_context_window_exceeded</code></td><td>Model từ chối; hết context</td><td>Dừng, báo lỗi rõ</td></tr>

<p>Hai điều kiện dừng còn lại do bạn đặt: giới hạn (số bước, tiền, thời gian) và người can thiệp.</p>
<h4>Giới hạn mặc định của framework (README, Tra cứu nhanh)</h4>
<div class="tbl"><table>
<tr><th>Framework</th><th>Giới hạn mặc định</th><th>Vượt thì</th></tr>

<tr><td>LangGraph</td><td><code>recursion_limit</code> 10.007 super-step</td><td><code>GraphRecursionError</code></td></tr>
<tr><td>Claude Agent SDK</td><td><code>max_turns=None</code>, <code>max_budget_usd=None</code></td><td><code>error_max_turns</code> / <code>error_max_budget_usd</code></td></tr>

<div class="verdict"><b>Không dựa vào mặc định.</b> Đặt MAX_STEPS, ngân sách tiền và thời gian theo phân phối của các run thành công trong bộ eval (README §3.2).</div>

          const P = { ok: ['Hoàn 2.490.000đ cho SV-4821 vì tai nghe rè trong 7 ngày.', { order_id: 'SV-4821', amount_vnd: 2490000 }], zero: ['Hoàn 2.490.000đ cho SV-4821 vì tai nghe rè trong 7 ngày.', { order_id: 'SV-4821', amount_vnd: 24900000 }], order: ['Hoàn tiền tai nghe rè cho khách, 2.490.000đ.', { order_id: 'SV-4907', amount_vnd: 2490000 }] };

            cap.innerHTML = bad1 || bad2 ? `<b class="bad">${bad1 ? 'Câu và tham số lệch nhau' : 'Câu khớp tham số nhưng tham số sai đơn'}.</b> ${bad2 ? `Số tiền vượt giá đơn ${fT(inp.amount_vnd - price)}đ. ` : ''}Người chỉ đọc câu văn sẽ duyệt. Không có nghĩa model "nói dối": câu và tham số là hai phần sinh riêng, có thể lệch. Trong hệ thống thật: màn hình duyệt hiện tham số và đối chiếu bằng code (số tiền ≤ giá đơn, đơn thuộc khách đang chat), tool tự từ chối khi vượt.` : '<b class="ok">Câu, tham số và giá đơn khớp nhau.</b> Màn hình duyệt vẫn nên hiện tham số, vì lần sau chúng có thể lệch.';

          vb.append(el('div', { class: 'row' }, [s.node]), out, cap);

        take: 'Duyệt cái sẽ chạy (tham số), không duyệt cái model kể. Đối chiếu nào làm được bằng code thì để code làm trước người.'
      },
      {

        a: `<p>Chưa chắc. README §1.2: <code>end_turn</code> chỉ có nghĩa là model <i>muốn</i> dừng. Agent trong sự cố Replit báo hệ thống "gần như mọi thứ đều chạy" trong khi thực tế không phải vậy. Điều kiện "xong" phải là trạng thái kiểm tra được, Anthropic gọi là <b>outcome</b>.</p>
<p>Hàng cuối của hình chính chạy ba kiểm tra bằng code trên bảng refunds và bảng gửi bù, không đọc câu trả lời của model. Ở kịch bản "Chọn nhầm tool" + "Bấm duyệt hết", model kết thúc bằng một câu trả lời lịch sự, đúng sự thật về những gì đã làm, và <b>outcome vẫn sai</b>: tiền đã hoàn cho một đơn chỉ thiếu cáp. Ở kịch bản vòng lặp, run dừng vì MAX_STEPS nhưng model vẫn viết được câu tóm tắt nghe hợp lý.</p>
<p>Đây cũng là cách chấm eval cho agent (README §3.6): chấm outcome, không chấm lời tự khai; chấm kết quả, không bắt buộc đúng chuỗi tool.</p>`,

      {

<p>Ba lớp chặn, đều nằm trong code: đếm lặp theo tool + tham số + kết quả (bật "Phát hiện gọi trùng" ở hình chính: lần thứ 3 thành <code>REPEATED_CALL</code>, <code>retryable: false</code>, model chuyển SV-4907 cho nhân viên và vẫn hoàn tiền SV-4821), lỗi có hướng dẫn bước tiếp, và MAX_STEPS. Bảng dưới chạy kịch bản vòng lặp không phát hiện trùng với các MAX_STEPS khác nhau.</p>`,

      {
        q: 'Vậy đặt MAX_STEPS và ngân sách bao nhiêu là đúng?',
        a: `<p>README §3.2 không cho con số mặc định, vì không có con số đúng chung. Cách làm: chạy bộ eval, lấy phân phối số bước của các run <b>thành công</b>, đặt giới hạn trên mức cao nhất thấy được, chạy lại và đếm số run thành công bị cắt. Quá chặt thì cắt ngang run đúng; quá lỏng thì một run kẹt tiêu nhiều tiền trước khi bị dừng.</p>
<p>Hình dưới dùng dữ liệu <b>giả định</b> (sinh ngẫu nhiên có seed): 200 run thành công có số bước từ 3 đến khoảng 12, cộng 20 run kẹt lặp tới khi chạm giới hạn. Chi phí mỗi bước của run kẹt lấy từ chính kịch bản vòng lặp ở hình chính.</p>`,

      {
        q: 'Workflow cố định rẻ hơn nhiều. Vì sao không dùng workflow cho tin nhắn này?',
        a: `<p>Workflow trong bảng so sánh ở hình chính là cách thường gặp: model phân loại tin nhắn vào <b>một</b> nhãn, code chạy nhánh tương ứng. Tin nhắn có hai đơn, hai vấn đề; nhãn <code>loi_ky_thuat</code> thắng, SV-4907 biến mất khỏi luồng. Rẻ hơn nhiều lần nhưng khách phải nhắn lại.</p>
<p>Không có nghĩa phải chuyển sang agent. Cho bước phân loại trả về <b>danh sách</b> (nhãn, mã đơn) và lặp qua từng nhánh thì vẫn là workflow, vẫn dự đoán được. README §3.1 có một dấu hiệu thực tế: nếu vẽ được sơ đồ luồng trên một trang giấy và sơ đồ đó đúng với phần lớn ca thật, viết workflow theo sơ đồ đó, để agent (hoặc người) xử lý phần còn lại. "Phần lớn" là bao nhiêu thì đo trên mẫu ca thật. Lab 01 đi sâu vào câu hỏi này.</p>`,
        take: 'Agent là lựa chọn khi sơ đồ không vẽ được, không phải khi sơ đồ chưa được vẽ. Sửa workflow thường rẻ hơn thay nó bằng agent.'
      }

    poc: {

      file: "docs/agents/pocs/00_workflow.py",
      run: "uv run docs/agents/pocs/00_workflow.py",
      needs: "chỉ <code>uv</code> và CPU, miễn phí, không gọi model. Phần tuỳ chọn gọi <code>claude-haiku-5-5</code> một lần (&lt; 0,001 USD) nếu có <code>ANTHROPIC_API_KEY</code> trong <code>docs/agents/pocs/.env</code>; không có key thì bỏ qua.",
      output: "Model là KỊCH BẢN viết tay (hàm Python đọc tool result rồi chọn tool), không gọi API. Phần thật: vòng lặp,\nghép cặp tool_use/tool_result, cổng duyệt, bộ đếm gọi lặp, token đếm bằng tiktoken o200k_base, giá Sonnet 5.5 (Cost Optimization §2.1).\n\n== Một run đầy đủ: kịch bản đúng, người duyệt đọc tham số ==\nSự kiện  Chi tiết                                                                                  Token vào  Tiền lượt\n-------  ----------------------------------------------------------------------------------------  ---------  ----------\nmodel    lượt 1: tra_don_hang, tra_don_hang [tool_use]                                             517        0,0023 USD\ntool     tra_don_hang({\"order_id\": \"SV-4821\"}) -> {\"order_id\": \"SV-4821\", \"sku\": \"PROX-DEN\", \"nam\ntool     tra_don_hang({\"order_id\": \"SV-4907\"}) -> {\"order_id\": \"SV-4907\", \"sku\": \"PB-20K\", \"name\"\nmodel    lượt 2: doc_chinh_sach [tool_use]                                                         849        0,0013 USD\ntool     doc_chinh_sach({\"chu_de\": \"doi_tra\"}) -> {\"chu_de\": \"doi_tra\", \"tom_tat\": [\"Lỗi kỹ thuật\nmodel    lượt 3: hoan_tien, gui_bu_phu_kien [tool_use]                                             1.006      0,0016 USD\nduyệt    chờ duyệt toolu_04\ntool     hoan_tien({\"order_id\": \"SV-4821\", \"amount_vnd\": 2490000, \"ly_do\": \"Lỗi kỹ thuật trong 7\ntool     gui_bu_phu_kien({\"order_id\": \"SV-4907\", \"item\": \"cap_usb_c\"}) -> {\"shipment_id\": \"GB-311\nmodel    lượt 4: text [end_turn]                                                                   1.228      0,0009 USD\nstatus=done  lượt model=4  tổng tiền=0,0061 USD  message cuối=8\nKiểm outcome bằng code (đọc DB giả lập, không tin câu 'Đã xử lý xong'):\n  OK  Hoàn đúng 2.490.000đ cho SV-4821\n  OK  Không hoàn tiền SV-4907\n  OK  SV-4907 được gửi bù cáp hoặc chuyển người\n\n== Đổi kịch bản và người duyệt (cùng vòng lặp, cùng cổng duyệt) ==\nKịch bản                                status   lý do dừng           lượt  tiền        đã hoàn     outcome\n--------------------------------------  -------  -------------------  ----  ----------  ----------  -------\nđúng / duyệt kỹ                         done                          4     0,0061 USD  2.490.000đ  3/3\nchọn nhầm hoàn tiền SV-4907 / duyệt kỹ  done                          5     0,0071 USD  2.490.000đ  3/3\nchọn nhầm / bấm duyệt hết               done                          4     0,0062 USD  3.380.000đ  1/3\nchọn nhầm / không ai duyệt              done                          5     0,0071 USD  0đ          2/3\nSV-4907 timeout mãi / có đếm lặp        done                          7     0,0084 USD  2.490.000đ  3/3\nSV-4907 timeout mãi / không đếm lặp     stopped  đã dùng hết 10 lượt  10    0,0121 USD  0đ          1/3\n\n== Workflow cố định trên cùng tin nhắn: phân loại → regex lấy MỘT mã đơn → tra → trả lời ==\nregex lấy được: SV-4821 (bỏ qua SV-4907)\n2 lượt model, 0,0032 USD (không gửi định nghĩa tool). SV-4907 thiếu cáp: không ai xử lý.\n\n== Ghép cặp tool_use / tool_result: lịch sử thiếu một tool_result ==\nstatus=stopped  lý do: 400 tool_use ids were found without tool_result blocks immediately after: toolu_y01\n\n== Tuỳ chọn: lượt đầu trên model thật ==\nBỏ qua: không có ANTHROPIC_API_KEY trong docs/agents/pocs/.env (chép .env.example rồi điền key để chạy, < 0,001 USD).\n\nRút ra: agent cần 4 lượt model và xử lý cả hai đơn; workflow cố định 2 lượt nhưng regex chỉ lấy SV-4821.\nLệnh hoàn tiền sai chỉ bị chặn khi người duyệt đọc tham số; 'bấm duyệt hết' cho 890.000đ đi ra. Thiếu quyết định = từ chối.\nTool timeout mãi: bộ đếm lặp cắt ở lần gọi thứ 3, chuyển người và vẫn xong SV-4821; không có nó thì MAX_STEPS=10 dừng run\nmà chưa hoàn tiền SV-4821 (outcome 1/3). Mọi run đều 'done' hoặc 'stopped' — chỉ phép kiểm outcome cho biết run nào đúng.",

    mount(stage) {
      const st = Object.assign({}, DEF, { sel: 1 });
      let R = null;
      const sSc = select('Kịch bản', SCEN, st.sc, (v) => { st.sc = v; recompute(); });
      const sAp = select('Người duyệt', APPR, st.appr, (v) => { st.appr = v; recompute(); });
      const sMo = select('Model', [['sonnet', 'Sonnet 5.5'], ['opus', 'Opus 5.5'], ['haiku', 'Haiku 5.5']], st.model, (v) => { st.model = v; recompute(); });
      const sMax = slider('MAX_STEPS', 2, 12, 1, st.max, (v) => { st.max = v; recompute(); });
      const sBud = slider('Ngân sách', 0.002, 0.1, 0.002, st.budget, (v) => { st.budget = v; recompute(); }, (v) => fU(v));
      const tog = (key, label) => { const b = el('button', { onclick: () => { st[key] = !st[key]; recompute(); } }); b._k = key; b._l = label; return b; };
      const toggles = [tog('detect', 'Phát hiện gọi trùng'), tog('fat', 'Chính sách trả cả văn bản (~6.000 token, giả định)'), tog('cache', 'Prompt caching')];
      const sSel = slider('Bước', 1, 30, 1, 1, (v) => setSel(v));
      const setSel = (v) => { st.sel = Math.max(1, Math.min(R.rows.length, Math.round(v))); sSel.input.value = st.sel; draw(); };
      const seq = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Trace các bước của agent loop' });
      const detail = el('div'), cap = el('div', { style: 'margin-top:8px;font-size:13.5px' });
      const chart = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Token input và tiền cộng dồn mỗi lượt model' });
      const budgetBox = el('div'), stat = el('div', { class: 'stat' }), cmp = el('div'), cmpCap = el('div', { style: 'font-size:13.5px' });
      const W = 680, X = { loop: 85, model: 255, tool: 425, human: 595 }, ROW = 26, TOP = 40;
      const LANE = { loop: 'Vòng lặp (code)', model: 'Model', tool: 'Tool', human: 'Người duyệt' };

      function recompute() {
        R = run(st);
        sSel.input.setAttribute('max', R.rows.length);
        toggles.forEach((b) => { b.className = st[b._k] ? 'on' : ''; b.textContent = b._l + ': ' + (st[b._k] ? 'bật' : 'tắt'); });
        setSel(Math.min(st.sel, R.rows.length));
      }

      function rowInfo(r) {
        if (r.kind === 'model') {
          const uses = r.content.filter((b) => b.type === 'tool_use');
          return { a: 'loop', b: 'model', color: r.cleanup ? 'var(--warn)' : uses.length ? 'var(--g4)' : 'var(--ok)', label: `lượt ${r.n}: ` + (r.cleanup ? 'tóm tắt, tool_choice none' : uses.length ? uses.map((u) => u.name).join(' + ') : 'end_turn, trả lời khách') + ` · ~${fT(r.inT)} tok` };
        }

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
