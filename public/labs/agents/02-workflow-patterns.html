const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<ul><li><b>Workflow:</b> regex lấy mã đơn, gọi API tra cứu, model viết trả lời. Ba bước cố định.</li><li><b>Routing:</b> model phân loại (tra đơn, đổi trả, khiếu nại), mỗi loại một workflow riêng.</li><li><b>Agent:</b> model có tool tra đơn, trạng thái giao, mở ticket, chuyển người, tự quyết gọi gì. Cần khi khách hỏi lòng vòng, nhiều đơn trong một câu, hoặc vấn đề không khớp loại nào.</li></ul>
<p>Bắt đầu từ nấc thấp nhất đáp ứng được dữ liệu thật. Lên nấc trên khi log cho thấy nấc dưới thất bại ở những ca cụ thể.</p>
<h4>Đa agent theo OpenAI (README §1.3)</h4>
<p><b>Manager</b> (agent làm tool): một agent trung tâm gọi agent chuyên biệt qua tool call và là agent duy nhất nói chuyện với người dùng. <b>Decentralized</b> (handoff): agent ngang hàng chuyển hẳn quyền điều khiển cho nhau, ví dụ agent tiếp nhận chuyển sang agent xử lý đơn hàng.</p>`,
    why: {
      c: 'Routing ở cửa vào (Haiku 5.5 phân loại, câu dễ sang model nhỏ), chaining có gate bằng code cho nhánh khiếu nại, sectioning song song cho các việc phụ (kiểm nội dung, gắn nhãn CRM), evaluator–optimizer chỉ khi có rubric rõ và giới hạn 2–3 vòng.',
      s: 'Một prompt lớn làm mọi việc: ít lần gọi, nhưng không kiểm được giữa chừng và mọi tin nhắn đều trả giá model lớn. Voting cho mọi quyết định: tốn gấp N lần, và các phiếu từ cùng model không độc lập như toán giả định. Evaluator–optimizer không giới hạn vòng: lợi suất giảm dần, ngưỡng đặt cao quá thì không bao giờ qua.',
      p: 'Nhiều lần gọi hơn, nhiều prompt phải bảo trì và eval riêng. Routing thêm một tầng lỗi (phân loại sai). Chain chậm hơn một prompt lớn. Song song rút thời gian nhưng không rút tiền.'
    },
    deep: [
      {
        q: 'Bốn pattern này có phải là agent không?',
        a: `<p>Không. Cả bốn có đường đi viết sẵn bằng code: code quyết định gọi gì sau cái gì. README §1.3 xếp prompt chaining, routing, parallelization và orchestrator–workers là workflow; evaluator–optimizer nằm giữa workflow và agent, vì số vòng phụ thuộc vào điểm chấm lúc chạy.</p>
<p>Ngay cả trong routing, model chỉ chọn <i>nhãn</i> trong một danh sách cố định; code mới là bên quyết định nhãn đó dẫn tới bước nào. Đó là khác biệt với agent, nơi model chọn cả tool lẫn tham số ở mỗi bước (lab 01).</p>`,
        take: 'Pattern workflow giữ quyền điều khiển trong code. Dùng chúng trước khi giao quyền đó cho model.'
      },
      {
        q: 'Chain ba bước chậm hơn và nhiều lần gọi hơn một prompt lớn. Vì sao vẫn dùng?',
        a: `<p>README §1.3: chaining dùng khi bước cố định và <b>chấp nhận chậm hơn để chính xác hơn</b>. Mỗi bước là một tác vụ hẹp hơn, prompt ngắn hơn, dễ viết và dễ eval riêng. Lợi ích lớn nhất là chỗ chen được kiểm tra bằng code giữa các bước.</p>
<p>Chọn "Prompt chaining" ở hình chính rồi bật "Bước 1 trích sai mã đơn". Gate bật: chain dừng ngay sau bước 1, chỉ tốn tiền bước 1. Gate tắt: dàn ý và câu trả lời được viết trên mã đơn sai, và lỗi đi tới khách. Một prompt lớn không có chỗ nào để chen gate.</p>
<p>Chain cũng cho phép chọn model theo bước. README §3.7: bước phân loại, trích xuất, tóm tắt thường chạy tốt trên model nhỏ; bước lập kế hoạch và quyết định thường không.</p>`,
        take: 'Mỗi ranh giới giữa hai bước là một chỗ kiểm tra bằng code. Đó là thứ một prompt lớn không có.'
      },
      {
        q: 'Gate giữa các bước nên kiểm cái gì? Có cần LLM kiểm không?',
        a: `<p>Kiểm những gì code kiểm được chắc chắn: định dạng, giá trị nằm trong miền hợp lệ, dữ liệu có tồn tại không. Chọn output của bước trích xuất bên dưới, trình duyệt chạy ba kiểm tra.</p>`,
        viz(vb) {
          const OPTS = { ok: EX_OK, short: EX_BAD, other: J({ ma_don: 'SV-5100', van_de: 'tai nghe rè bên trái', mong_muon: 'hoan_tien' }), noisy: '{"ma_don": "SV-4821", "van_de": "rè"' };
          const owned = ['SV-4821', 'SV-4907'];
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw(v) {
            let obj = null;
            try { obj = JSON.parse(OPTS[v]); } catch (e) { obj = null; }
            const checks = [['JSON parse được', !!obj], ['ma_don khớp ^SV-\\d{4}$', !!obj && /^SV-\d{4}$/.test(obj.ma_don || '')], ['Đơn thuộc khách đang chat (tra theo session)', !!obj && owned.includes(obj.ma_don)]];
            const fail = checks.find((c) => !c[1]);
            out.replaceChildren(tbl(`<tr><th ${td}>Output bước 1</th><td ${td} class="mono">${OPTS[v].replace(/</g, '&lt;')}</td></tr>` + checks.map((c) => `<tr><td ${td}>${c[0]}</td><td ${td} class="${c[1] ? 'ok' : 'bad'}">${c[1] ? 'đạt' : 'không đạt'}</td></tr>`).join('')));
            cap.innerHTML = fail ? `<b class="bad">Gate dừng chain ở "${fail[0]}".</b> Bước 2 và 3 không chạy, không tốn tiền, không có câu trả lời sai đi tới khách. ` + (v === 'other' ? 'Ca này đặc biệt: định dạng đúng, chỉ kiểm quyền sở hữu mới bắt được. Không có nghĩa model bịa: có thể khách gõ nhầm. Trong hệ thống thật: phạm vi lấy từ session đã xác thực, không lấy từ tham số model sinh ra (README §3.8).' : 'Trong hệ thống thật: gate thất bại thì thử lại bước 1 một lần hoặc hỏi lại khách.') : '<b class="ok">Qua cả ba kiểm tra.</b> Chain chạy tiếp.';
          }
          const s = select('Output bước 1', [['ok', 'Đúng'], ['short', 'Thiếu một số'], ['other', 'Đúng định dạng, đơn của người khác'], ['noisy', 'JSON bị cắt']], 'ok', draw);
          vb.append(el('div', { class: 'row' }, [s.node]), out, cap);
          draw('ok');
        },
        take: 'Gate rẻ nhất là code: parse, regex, tra quyền. Chỉ dùng LLM để kiểm khi tiêu chí không viết được thành code.'
      },
      {
        q: 'Routing thêm một lần gọi phân loại cho mọi tin nhắn. Sao lại rẻ hơn?',
        a: `<p>Vì lần phân loại chạy trên model nhỏ với prompt ngắn, còn phần lớn tin nhắn (FAQ, tra đơn) được trả lời bằng model nhỏ thay vì model lớn với prompt chứa mọi quy trình. README §1.3: câu dễ sang model nhỏ, câu khó sang model lớn.</p>
<p>Nhưng phần tiết kiệm phụ thuộc vào tỉ lệ câu dễ. Kéo tỉ lệ khiếu nại bên dưới (tỉ lệ FAQ và tra đơn chia đều phần còn lại, giả định). Trình duyệt tính chi phí trung bình mỗi tin với các prompt thật của hình chính.</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw(kn) {
            const r = route({ faq: (1 - kn) / 2, tra: (1 - kn) / 2, mis: 0, vol: 1, sample: 'khieu_nai' });
            out.replaceChildren(hbars([['Một prompt lớn, Sonnet 5.5 cho mọi tin', r.base, false], ['Routing: Haiku phân loại, nhánh theo loại', r.routed, true]], { max: Math.max(r.base, r.routed), fmt: fU }));
            cap.innerHTML = r.routed < r.base ? `Routing rẻ hơn <b>${f1(r.base / r.routed)} lần</b> mỗi tin khi khiếu nại chiếm ${Math.round(kn * 100)}%. ` + (kn > 0.8 ? 'Khoảng cách đã hẹp: gần như mọi tin vẫn đi tới Sonnet. ' : '') + 'Trong hệ thống thật: đo tỉ lệ loại tin trên log trước khi tính tiết kiệm.' : `<b class="bad">Routing đắt hơn khi khiếu nại chiếm ${Math.round(kn * 100)}%.</b> Vì sao: hầu hết tin đi tới nhánh Sonnet với prompt khiếu nại đầy đủ, cộng thêm lần phân loại. Không có nghĩa routing sai: nó vẫn cho prompt chuyên biệt. Trong hệ thống thật: routing để tiết kiệm chỉ đáng khi phần lớn lưu lượng là câu dễ.`;
          }
          const s = slider('Tỉ lệ khiếu nại', 0, 1, 0.05, 0.15, draw, (v) => Math.round(v * 100) + '%');
          vb.append(el('div', { class: 'row' }, [s.node]), out, cap);
          draw(0.15);
        },
        take: 'Routing tiết kiệm bằng cách gửi câu dễ tới chỗ rẻ. Không có câu dễ thì không có gì để tiết kiệm.'
      },
      {
        q: 'Chạy ba lần gọi song song thì tiết kiệm được gì?',
        a: `<p>Thời gian, không phải tiền. Ba lần gọi song song vẫn là ba lần gọi, mỗi lần tính đủ token. Chọn "Parallelization" ở hình chính, chế độ Sectioning, và bật tắt "Chạy song song": makespan giảm còn bằng lần gọi chậm nhất, tổng tiền giữ nguyên.</p>
<p>Song song chỉ áp được cho phần việc <b>độc lập</b>. Ba bước của chain phụ thuộc nhau (dàn ý cần JSON trích xuất, bài viết cần dàn ý), nên dù hạ tầng cho chạy song song, chúng vẫn phải chờ nhau. Ví dụ README cho sectioning: một model trả lời, một model khác kiểm tra nội dung không phù hợp.</p>`,
        take: 'Song song đổi máy chạy đồng thời lấy thời gian chờ. Hoá đơn token không đổi.'
      },
      {
        q: 'Parallelization và orchestrator–workers đều chạy nhiều worker. Khác gì nhau về tiền?',
        a: `<p>README §1.3: parallelization có số phần việc cố định khi viết code; orchestrator quyết định số phần việc lúc chạy. Cái đầu dự toán được chi phí, cái sau không. Bên dưới, orchestrator chia một khiếu nại tổng hợp (nhiều đơn) thành k phần việc, với k là <b>giả định</b> ngẫu nhiên có seed từ 1 đến 8; mỗi worker tốn bằng một lần gọi "Trả lời khách" của hình chính.</p>`,
        viz(vb) {
          const unit = parallel({ mode: 'section', par: true }).calls[0].cost;
          const rnd = seeded(4907), ks = [];
          for (let i = 0; i < 300; i++) { let k = 1; while (rnd() < 0.55 && k < 8) k++; ks.push(k); }
          const sorted = ks.slice().sort((a, b) => a - b), p50 = sorted[150], p95 = sorted[284];
          const hist = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => [`${k} worker`, ks.filter((x) => x === k).length, k === p95]);
          vb.append(hbars(hist, { fmt: (v) => v + ' run' }),
            el('div', { class: 'cap', html: `Parallelization 3 phần cố định (mỗi phần bằng một lần gọi Trả lời khách): luôn ${fU(3 * unit)}. Orchestrator: p50 ${p50} worker (${fU((p50 + 1) * unit)} kể cả lượt chia việc), p95 ${p95} worker (<b class="bad">${fU((p95 + 1) * unit)}</b>), gấp ${f1((p95 + 1) / (p50 + 1))} lần p50. Không có nghĩa orchestrator lãng phí: số phần việc thật sự thay đổi theo đầu vào. Trong hệ thống thật: đặt trần số worker và ngân sách bằng code, dự toán theo p95 chứ không theo trung bình.` }));
        },
        take: 'Số worker quyết định lúc chạy thì chi phí cũng quyết định lúc chạy. Trần số worker là điều kiện dừng của orchestrator.'
      },
      {
        q: 'Voting 5 phiếu, mỗi phiếu đúng 80%, toán ra đa số đúng hơn 94%. Thực tế có vậy không?',
        a: `<p>Con số đó giả định các phiếu <b>độc lập</b>: phiếu này sai không làm phiếu kia dễ sai hơn. Năm lần gọi cùng model, cùng prompt, cùng tin nhắn thì không độc lập: chỗ model hiểu sai ở lần 1 thường cũng hiểu sai ở lần 2. Bên dưới dùng một xấp xỉ đơn giản (<b>giả định của lab</b>, không phải số đo): với tương quan ρ giữa các phiếu, số phiếu hiệu dụng là n / (1 + (n − 1)ρ), làm tròn tới số lẻ gần nhất.</p>
<p>ρ đọc như sau: ρ = 0 là các phiếu sai độc lập, như 5 người chấm khác nhau. ρ = 1 là 5 phiếu luôn sai cùng lúc, tức chỉ bằng 1 phiếu. Ví dụ 5 phiếu, ρ = 0,3: 5 / (1 + 4 × 0,3) ≈ 2,3, làm tròn thành 3 phiếu hiệu dụng.</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { n: 5, rho: 0.3, p: 0.8 };
          function draw() {
            const neff = st.n / (1 + (st.n - 1) * st.rho), nOdd = Math.max(1, 2 * Math.round((neff - 1) / 2) + 1);
            const ind = majority(st.n, st.p), cor = majority(nOdd, st.p);
            out.replaceChildren(hbars([['1 phiếu', st.p, false], [`${st.n} phiếu độc lập (toán)`, ind, false], [`${st.n} phiếu tương quan ρ = ${f1(st.rho)} (≈ ${nOdd} phiếu hiệu dụng)`, cor, true]], { max: 1, fmt: pc }));
            cap.innerHTML = `Tốn gấp ${st.n} lần một phiếu. ` + (cor - st.p < (ind - st.p) / 2 ? `<b class="bad">Phần lớn lợi ích trên giấy biến mất</b>: thêm ${pc(cor - st.p)} thay vì ${pc(ind - st.p)}. Không có nghĩa voting vô ích: phiếu đa dạng hơn (prompt khác, model khác) thì tương quan thấp hơn. Trong hệ thống thật: đo độ chính xác đa số trên bộ eval, đừng dùng công thức nhị thức.` : `Voting còn giữ hơn nửa lợi ích (thêm ${pc(cor - st.p)} so với ${pc(ind - st.p)} trên giấy). Kéo ρ lên để thấy phần còn lại mất dần.`);
          }
          vb.append(el('div', { class: 'row' }, [slider('Số phiếu', 1, 9, 2, 5, (v) => { st.n = v; draw(); }).node, slider('Tương quan ρ (giả định)', 0, 1, 0.05, 0.3, (v) => { st.rho = v; draw(); }, f1).node, slider('Đúng mỗi phiếu (giả định)', 0.55, 0.95, 0.05, 0.8, (v) => { st.p = v; draw(); }, pc).node]), out, cap);
          draw();
        },
        take: 'Voting mua độ tin cậy bằng sự đa dạng của phiếu, không bằng số phiếu. Năm bản sao của cùng một lỗi vẫn là một lỗi.'
      },
      {
        q: 'Evaluator–optimizer nên dừng ở vòng mấy?',
        a: `<p>Khi một trong ba điều xảy ra: đạt ngưỡng, chạm giới hạn vòng, hoặc vòng thêm không còn đáng tiền. Chất lượng thường tăng theo lợi suất giảm dần, còn chi phí mỗi vòng lại <b>tăng</b> vì generator phải đọc thêm bản nháp cũ và góp ý.</p>
<p>Chọn "Evaluator–optimizer" ở hình chính. Điểm theo vòng là đường cong <b>giả định</b>: bắt đầu 5,5, trần 8,6, mỗi vòng thu hẹp một nửa khoảng cách tới trần. Đặt ngưỡng 9: không vòng nào qua, vòng lặp chạy tới giới hạn mỗi lần. README §1.3 nêu điều kiện dùng pattern này: có tiêu chí chấm rõ, và góp ý thực sự làm output tốt hơn. Khi góp ý không còn làm tốt hơn, vòng lặp chỉ còn tiêu tiền.</p>
<p>Một lưu ý nữa: evaluator cũng là model. Nếu dùng cùng model với generator, chúng có thể có cùng điểm mù. Điểm của evaluator cần được đối chiếu với người chấm trên một mẫu (Evaluation, phần LLM judge).</p>`,
        take: 'Giới hạn vòng là điều kiện dừng bắt buộc. Ngưỡng đặt cao hơn trần thật của hệ thống biến vòng sửa thành vòng đốt tiền.'
      },
      {
        q: 'Vậy nên bắt đầu với pattern nào cho ShopViet?',
        a: `<p>README §1.3: bắt đầu từ nấc thấp nhất đáp ứng được dữ liệu thật, lên nấc trên khi log cho thấy nấc dưới thất bại ở ca cụ thể. Các pattern ghép được với nhau: routing ở cửa vào; nhánh khiếu nại là một chain có gate; trong chain, bước viết trả lời song song với kiểm nội dung; evaluator–optimizer chỉ thêm khi eval cho thấy câu trả lời khiếu nại hay thiếu ý theo rubric.</p>
<p>Khi một nhánh bắt đầu cần "tuỳ dữ liệu mà gọi tool khác nhau" (khách không nhớ mã đơn, nhiều đơn trong một câu), đó là lúc nhánh đó lên nấc agent, như lab 01 và lab 00. Phần còn lại vẫn là workflow.</p>`,
        take: 'Pattern là khối lắp ghép, không phải lựa chọn loại trừ nhau. Agent chỉ thay thế nhánh mà workflow không vẽ được.'
      }
    ],
    poc: {
      goal: "<b>Không gọi model thật</b>: mọi output model là chuỗi viết tay sẵn. Bốn pattern workflow trên khiếu nại SV-4821: cổng code giữa hai bước chaining, router từ khoá, sectioning bằng <b>asyncio với đồng hồ thật</b>, voting tính bằng nhị thức, evaluator–optimizer có cap. Output model là chuỗi viết tay; nhãn routing, độ chính xác mỗi phiếu, điểm mỗi vòng là giả định có ghi nhãn.",
      file: "docs/agents/pocs/02_workflow_patterns.py",
      run: "uv run docs/agents/pocs/02_workflow_patterns.py",
      needs: "chỉ <code>uv</code> và CPU, ~15 giây (asyncio ngủ theo độ trễ giả định), miễn phí.",

}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
