const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

<ol><li>Các bước biết trước và số nhánh đếm được → <b>workflow</b> (một lần gọi đủ thì dừng ở đó).</li><li>Không biết trước nhưng không kiểm tra được kết quả → chưa nên làm agent, thiết kế lại để kiểm được.</li><li>Giá trị tác vụ không bù được chi phí (agent ≈ 4× token so với chat, số đo của Anthropic trên hệ thống research của họ) → quay lại workflow.</li><li>Còn lại → <b>một agent</b>, một luồng, tool ở mức tác vụ, giới hạn bằng code.</li></ol>
<h4>Vòng lặp dừng khi nào (README §1.2)</h4>
<p>OpenAI liệt kê: model gọi tool đánh dấu output cuối, model trả lời không gọi tool, gặp lỗi, chạm số lượt tối đa. Với Claude: <code>tool_use</code> → chạy tool và lặp; <code>end_turn</code> → dừng rồi kiểm tra kết quả thật; <code>pause_turn</code> → gửi lại response nguyên văn; <code>max_tokens</code> → không thực thi tool call dở. Hai điều kiện còn lại do bạn đặt: giới hạn (bước, tiền, thời gian) và người can thiệp.</p>
<div class="verdict"><b>Một dấu hiệu thực tế (README §3.1):</b> vẽ được sơ đồ luồng trên một trang giấy và sơ đồ đúng với phần lớn ca thật thì viết workflow theo sơ đồ, để agent hoặc người xử lý phần còn lại. "Phần lớn" là bao nhiêu thì đo trên mẫu ca thật.</div>`,

      {

<p>Ở hình chính, workflow tra đơn có 3 bước, đúng ví dụ README §1.3: regex lấy mã đơn, code gọi <code>tra_don_hang</code>, model viết câu trả lời. Model làm một bước nhưng không chọn bước nào. Ở agent, model chọn cả tool lẫn tham số: <code>tra_don_hang({"order_id": "SV-4821"})</code> là do model sinh ra.</p>`,

      {
        q: 'Vậy vì sao không viết workflow cho cả khiếu nại mơ hồ?',
        a: `<p>Vì các bước phụ thuộc dữ liệu. Khách không nhớ mã đơn thì phải tìm theo số điện thoại; tìm ra mấy đơn thì tra mấy đơn; đơn nào đã giao, đơn nào đang giao quyết định bước sau. Viết hết thành nhánh thì bộ luật phình to, đúng dấu hiệu "luật khó bảo trì" của OpenAI (README §1.1).</p>

      {

      {
        q: 'Agent đúng 75% mỗi lần nghe cũng ổn. Vì sao README vẫn lo?',

        a: `<p><b>Chuyện gì xảy ra:</b> cùng câu FAQ, cùng hai thiết kế, hai hệ số khác nhau. POC (token đếm bằng tiktoken, có cache) ra ×2,0, không cache ×2,3. Hình chính (token ước lượng thô, không cache) ra khoảng ×4,7. Với khiếu nại mơ hồ, POC ra ×5,1 có cache và ×9,0 không cache.</p>

      {
        q: 'Workflow chuyển khiếu nại mơ hồ cho người, agent thì tự xử lý. Tính chung cả ngày thì cách nào rẻ hơn?',
        a: `<p>README §3.1 khuyên: đo trên mẫu ca thật bao nhiêu ca đi trọn theo sơ đồ, rồi so chi phí xử lý phần còn lại bằng agent với chi phí khác. Bảng dưới so ba chiến lược trên 5.000 tin nhắn mỗi ngày (giả định), với tỉ lệ mỗi loại và chi phí một ca người xử lý là <b>giả định</b> bạn kéo được. Chi phí model mỗi ca lấy từ hình chính (Sonnet 5.5).</p>`,
        viz(vb) {
          const st = { amb: 0.15, human: 0.5 }, out = el('div'), cap = el('div', { class: 'cap' }), N = 5000;

                         1\nWorkflow (có mã / FAQ / chuyển người)                          3\nAgent: mỗi lượt chọn 1 trong 5 tool hoặc dừng, tối đa 10 lượt  12.207.031\n\nRút ra: với FAQ và tra đơn có mã, agent chạy 2–3 lượt, tốn hơn một lần gọi/workflow mà câu trả lời không khác.\nChỉ khiếu nại mơ hồ (không mã đơn, hai việc) mới cần agent: workflow rơi vào nhánh chuyển người. Đổi lại số đường đi\nnhảy từ 3 lên hơn 12 triệu, nên agent không test từng nhánh được — phải chấm outcome qua nhiều run.",

    mount(stage) {

      function drawFlow(r) {

        const p = [];

        if (r.handles === 'no') p.push(box('var(--bad)', `<b>${st.d === 'single' ? 'Một lần gọi' : 'Thiết kế này'} không có dữ liệu để trả lời.</b> Vì sao: không bước nào tra đơn; model chỉ có đoạn chính sách. Không có nghĩa model kém: thông tin không có trong prompt. Trong hệ thống thật: thêm bước tra cứu bằng code (lên nấc workflow) trước khi nghĩ tới agent.`));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));

        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])

    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
