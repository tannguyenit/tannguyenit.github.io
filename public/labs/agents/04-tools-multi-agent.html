const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const MODELS = { opus: { n: 'Opus 5.5', in: 4, out: 20 }, sonnet: { n: 'Sonnet 5.5', in: 2, out: 10 } };
  const P_LEAD = 4000, P_WORK = 2500, OUT_STEP = 150, SUMMARY = 1500, FINAL = 800, T_CALL = 4.5, T_SUM = 6, T_PLAN = 8, T_SYN = 10;
  const usd = (v) => '$' + (v < 1 ? v.toFixed(3) : v.toFixed(2));
  const fmtT = (n) => (n >= 1e6 ? (Math.round(n / 1e4) / 100).toString().replace('.', ',') + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(Math.round(n)));
  const secs = (s) => (s >= 60 ? Math.floor(s / 60) + 'p' + String(Math.round(s % 60)).padStart(2, '0') + 's' : Math.round(s) + 's');
  const DIRS = [
    { n: 'Ticket CSKH', tool: 'search_tickets', w: 0.3, find: '64% ticket đổi trả SoundMax X2 tháng 11 là "rè bên trái"' },
    { n: 'Đánh giá sản phẩm', tool: 'search_reviews', w: 0.3, find: 'Đánh giá 1 sao tăng từ tuần 2 tháng 11' },
    { n: 'Log vận chuyển', tool: 'get_shipments', w: 0.1, find: 'Không có bất thường về thời gian giao' },
    { n: 'Lô hàng nhà cung cấp', tool: 'get_supplier_report', w: 0.05, find: 'Lô L-2611 lỗi driver trái, nhà cung cấp đã xác nhận', root: true },
    { n: 'Chính sách đối thủ', tool: 'web_search', w: 0.15, find: 'Hai sàn lớn vẫn giữ đổi trả 15 ngày' },
    { n: 'Diễn đàn kỹ thuật', tool: 'web_search', w: 0.1, find: 'Firmware 2.1 không sửa được lỗi rè' }
  ];
  const PARTS = ['Chính sách đổi trả mới', 'Email gửi khách', 'FAQ trên web'];
  const DECS = [['Thời hạn đổi trả', ['15 ngày', '30 ngày']], ['Ai trả phí ship trả hàng', ['ShopViet', 'khách']], ['Áp dụng từ', ['01/12/2026', '01/01/2027']], ['Giọng văn', ['trang trọng', 'thân mật']]];
  const PINNED = 2;

  function agentRun(prefix, calls, r, model) {
    let input = 0;
    for (let k = 0; k <= calls; k++) input += prefix + k * (r + OUT_STEP);
    const output = calls * OUT_STEP;
    return { input, output, peak: prefix + calls * (r + OUT_STEP), cost: (input * model.in + output * model.out) / 1e6 };
  }
  function assign(S) {
    const D = S.type === 'read' ? DIRS.length : PARTS.length, ws = Array.from({ length: S.n }, () => []);
    if (S.type === 'read' && S.brief === 'vague') {
      for (let i = 0; i < S.n; i++) { const rnd = seeded(19 + i * 7); let x = rnd(), d = 0; while (d < DIRS.length - 1 && x > DIRS[d].w) { x -= DIRS[d].w; d++; } ws[i].push(d); }
    } else for (let d = 0; d < D; d++) ws[d % S.n].push(d);
    return ws;
  }
  function simulate(S) {
    const lead = MODELS[S.lead], work = MODELS.sonnet;
    const D = S.type === 'read' ? DIRS.length : PARTS.length;
    if (S.arch === 'single') {
      const calls = S.type === 'read' ? S.budget : D * S.w;
      const a = agentRun(P_LEAD, calls, S.r, lead);
      const covered = []; for (let d = 0; d < D; d++) if (calls >= (d + 1) * S.w) covered.push(d);
      const partial = S.type === 'read' && calls % S.w && covered.length < D ? covered.length : -1;
      return { arch: 'single', tokens: a.input + a.output + FINAL, cost: a.cost + FINAL * lead.out / 1e6, peak: a.peak, time: calls * T_CALL + T_SYN, covered, partial, dup: 0, wasted: 0, workers: [], conflicts: [], calls, choices: null };
    }
    const ws = assign(S), seen = new Set(), workers = [];
    let tokens = 0, cost = 0, dupTok = 0, peak = 0;
    ws.forEach((dirs, i) => {
      const calls = dirs.length * S.w, briefTok = S.brief === 'good' ? 250 : 30;
      const a = calls ? agentRun(P_WORK + briefTok, calls, S.r, work) : { input: P_WORK + briefTok, output: 0, peak: P_WORK + briefTok, cost: (P_WORK + briefTok) * work.in / 1e6 };
      const out = calls ? SUMMARY : 40, t = a.input + a.output + out, c = a.cost + out * work.out / 1e6;
      const dup = dirs.filter((d) => seen.has(d)); dirs.forEach((d) => seen.add(d));
      if (dup.length) dupTok += t;
      tokens += t; cost += c; peak = Math.max(peak, a.peak);
      workers.push({ i, dirs, calls, tokens: t, time: calls ? calls * T_CALL + T_SUM : 2, dup: dup.length > 0, idle: !calls });
    });
    const planIn = P_LEAD + 300, planOut = 200 + S.n * (S.brief === 'good' ? 250 : 30);
    const synIn = P_LEAD + planOut + workers.filter((w) => !w.idle).length * SUMMARY + workers.filter((w) => w.idle).length * 40;
    tokens += planIn + planOut + synIn + FINAL;
    cost += ((planIn + synIn) * lead.in + (planOut + FINAL) * lead.out) / 1e6;
    const longest = Math.max(...workers.map((w) => w.time)), sum = workers.reduce((a, w) => a + w.time, 0);
    const time = T_PLAN + (S.run === 'par' ? longest : sum) + T_SYN;
    let conflicts = [], choices = null;
    if (S.type === 'write') {
      const pinned = S.brief === 'good' ? PINNED : 0;
      choices = workers.filter((w) => !w.idle).map((w) => DECS.map((d, j) => (j < pinned ? 0 : Math.floor(seeded(53 + w.i * 11 + j * 3)() * 2))));
      conflicts = DECS.map((d, j) => new Set(choices.map((c) => c[j])).size > 1);
    }
    return { arch: 'multi', tokens, cost, peak: Math.max(peak, synIn), time, timePar: T_PLAN + longest + T_SYN, timeSer: T_PLAN + sum + T_SYN, covered: [...seen].sort(), partial: -1, dup: workers.filter((w) => w.dup).length, wasted: dupTok, workers, conflicts, choices };
  }

  function briefChecker(box) {
    const PARTS_B = [['goal', 'Mục tiêu', 'Tìm lý do tỷ lệ đổi trả SoundMax X2 tháng 11/2026 tăng.'], ['scope', 'Phạm vi', 'Chỉ báo cáo nhà cung cấp và hệ thống QC nội bộ.'], ['not', 'Không làm', 'Không đọc ticket CSKH (worker 1 làm), không đề xuất chính sách.'], ['budget', 'Định mức', 'Tối đa 8 tool call. Dừng khi có xác nhận từ nhà cung cấp.'], ['out', 'Output', 'JSON {"nguyen_nhan": str, "bang_chung": str, "nguon": str}[]; thiếu nguồn ghi "khong_tim_thay".']];
    const FAIL = { goal: 'Worker không biết đang trả lời câu hỏi nào: đào sai chủ đề (MAST FM-2.3 lạc khỏi tác vụ).', scope: 'Worker đi tìm ở diễn đàn, nguồn không tin cậy, và trùng hướng với worker khác.', not: 'Hai worker cùng đọc ticket CSKH: làm trùng việc, như ví dụ chip bán dẫn của Anthropic.', budget: 'Worker không biết khi nào dừng: tiêu ngân sách vô hạn (MAST FM-1.5 không nhận biết điều kiện dừng).', out: 'Worker trả văn xuôi; lead phải đọc và đoán, không gộp được bằng code.' };
    const on = { goal: true, scope: true, not: true, budget: true, out: true }, pre = el('div', { class: 'mono', style: 'font-size:12px;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px' }), list = el('div');
    const draw = () => {
      pre.textContent = PARTS_B.filter(([k]) => on[k]).map(([, l, t]) => l + ': ' + t).join('\n') || '(brief trống: "tìm hiểu vì sao đổi trả tăng")';
      const miss = PARTS_B.filter(([k]) => !on[k]);
      list.innerHTML = miss.length ? '<ul style="margin:6px 0;padding-left:18px">' + miss.map(([k, l]) => '<li><b class="bad">Thiếu ' + l + ':</b> ' + FAIL[k] + '</li>').join('') + '</ul>' : '<p class="ok" style="margin:6px 0"><b>Đủ 5 phần.</b> Brief khoảng ' + Math.ceil(pre.textContent.length / 3.5) + ' token (ước lượng ký tự / 3,5), rẻ hơn nhiều so với một worker làm trùng việc.</p>';
    };
    box.append(el('div', { class: 'row' }, PARTS_B.map(([k, l]) => { const b = el('button', { class: 'on', text: l, onclick: () => { on[k] = !on[k]; b.classList.toggle('on', on[k]); draw(); } }); return b; })), pre, list,
      el('div', { class: 'cap', text: 'Bấm để bỏ từng phần khỏi brief của worker "Lô hàng nhà cung cấp". Hậu quả lấy từ README §2.2 và bảng MAST.' }));
    draw();
  }

  return {
    id: 'tools-multi-agent', nav: '4. Nhiều tool hay nhiều agent', ref: '§2.1–2.2',
    title: 'Chia cho 4 sub-agent thì nhanh gấp mấy lần, tốn gấp mấy lần, và hỏng ở đâu',
    hook: 'Đổi số worker, chất lượng brief, loại tác vụ. Hình tính token, thời gian chạy song song và tuần tự, hướng bị trùng hoặc bỏ sót.',
    terms: [
      ['Orchestrator–worker', 'Một lead agent lập kế hoạch, sinh các worker (sub-agent) chạy song song, rồi tổng hợp. Ví dụ lead chia 6 hướng điều tra cho 4 worker.'],
      ['Sub-agent', 'Agent con có context riêng, nhận brief, chạy vòng lặp tool riêng, trả bản tóm tắt thường 1.000–2.000 token cho lead.'],
      ['Brief', 'Đoạn giao việc lead viết cho sub-agent: mục tiêu, phạm vi, phần không làm, định mức, định dạng output. Sub-agent chỉ biết những gì có trong brief.'],
      ['Cô lập context', 'Worker đọc 40 file log trong context của nó; lead chỉ nhận bản tóm tắt. Context của lead không phình theo dữ liệu thô.'],
      ['Quyết định ngầm', 'Lựa chọn một worker tự đặt ra mà không ai nói, ví dụ "đổi trả 30 ngày" hay "giọng thân mật". Hai worker chọn khác nhau thì kết quả ghép lại mâu thuẫn.'],
      ['Wall time', 'Thời gian người dùng phải chờ, tính từ lúc gửi tới lúc có kết quả. Chạy song song giảm wall time, không giảm tổng token.'],
      ['MAST', 'Bảng 14 failure mode của hệ multi-agent, rút từ hơn 1.600 trace của 7 framework (Cemri và cộng sự). Ví dụ FM-3.2: kiểm tra không có hoặc kiểm tra thiếu.']
    ],
    problem: {
      example: '<b>ShopViet</b> thấy tỷ lệ đổi trả tai nghe SoundMax X2 tháng 11/2026 tăng gấp đôi. Quản lý hỏi trợ lý nội bộ: "vì sao?". Câu trả lời nằm rải rác ở 6 nơi: ticket CSKH, đánh giá sản phẩm, log vận chuyển, báo cáo lô hàng nhà cung cấp, chính sách đối thủ, diễn đàn kỹ thuật. Nguyên nhân gốc (giả định trong lab) nằm ở báo cáo lô hàng.',
      scenario: 'Một agent đi lần lượt từng nguồn thì chậm và context phình. Chia cho nhiều sub-agent chạy song song thì nhanh hơn, nhưng tốn token hơn, và brief mơ hồ làm các worker đào trùng chỗ.',
      ask: 'Bao nhiêu worker là đủ, tốn gấp mấy lần một agent, và khi nào chia agent làm hỏng kết quả?',
      solves: 'Mô phỏng cả hai kiến trúc với cùng tham số. Token tính từ công thức: mỗi lượt gửi lại toàn bộ context của agent đó. Thời gian tính từ số lượt. Hướng bị trùng, bỏ sót và quyết định mâu thuẫn được phát hiện từ phân công.',
      read: ['Sơ đồ: lead ở trên, worker ở dưới. Viền cam là worker làm trùng hướng; xám là worker không có việc; ô hướng màu đỏ nhạt là bị bỏ sót.', 'Timeline: thanh ngang là thời gian của lead và từng worker. Chạy tuần tự thì các thanh nối đuôi nhau.', 'Số giả định (ghi rõ trong ghi chú cuối): mỗi tool call 4,5 giây, tool result 1.500 token, prompt worker 2.500 token. Giá Opus 5.5 và Sonnet 5.5 từ cost-optimization README §2.1 (06/11/2026), không tính cache.', 'Đổi "Loại tác vụ" sang "Ghi phụ thuộc" để thấy lỗi Cognition mô tả: mỗi worker tự chọn quyết định ngầm.']
    },
    summary: `<h3>Tóm tắt bài</h3>
<p>Mặc định là <b>một agent, một luồng</b>, bộ tool được thiết kế kỹ. Anthropic, OpenAI và Cognition đều khuyên bắt đầu như vậy. Số tool không phải vấn đề chính: có hệ thống quản lý tốt hơn 15 tool rõ ràng, có hệ thống gặp khó với chưa tới 10 tool chồng chéo. Sửa tên, tham số, mô tả tool trước khi tách agent.</p>

<tr><td>Quyền hạn khác nhau</td><td>Sub-agent đọc web không có quyền ghi database</td><td>Mọi phần cùng quyền</td></tr></table></div>
<h4>Hệ thống research của Anthropic: được và mất</h4>

<li>Agent khoảng <b>4×</b> token so với chat; multi-agent khoảng <b>15×</b>. Trên BrowseComp, lượng token giải thích 80% phương sai kết quả; token, số tool call, lựa chọn model giải thích 95%.</li>
<li>Định mức trong prompt: tra cứu đơn giản 1 agent 3–10 tool call; so sánh trực tiếp 2–4 sub-agent, 10–15 call mỗi sub-agent; research phức tạp hơn 10 sub-agent.</li></ul>
<h4>Cognition: "Don't Build Multi-Agents"</h4>

<tr><td>Lệch nhau giữa các agent</td><td>2.1 Hội thoại bị reset; 2.2 Không hỏi lại; 2.3 Lạc tác vụ; 2.4 Giấu thông tin; 2.5 Bỏ qua input agent khác; 2.6 Suy luận và hành động không khớp</td></tr>
<tr><td>Kiểm tra kết quả</td><td>3.1 Dừng sớm; 3.2 Không kiểm tra hoặc kiểm tra thiếu; 3.3 Kiểm tra sai</td></tr></table></div>
<div class="verdict"><b>Brief tối thiểu:</b> mục tiêu, phạm vi, phần không làm, định mức, output có schema. "Không làm" chống trùng việc, "định mức" chống tiêu vô hạn, "output" cho lead gộp bằng code.</div>`,
    why: {

    deep: [
      {
        q: 'Một agent với nhiều tool: bao nhiêu tool thì nên tách?',
        a: `<p>README trả lời: số tool không phải vấn đề chính. OpenAI ghi nhận hệ thống quản lý tốt hơn 15 tool rõ ràng, khác biệt nhau, trong khi hệ thống khác gặp khó với chưa tới 10 tool <b>chồng chéo</b>. Tách agent khi prompt có quá nhiều nhánh điều kiện, hoặc model liên tục chọn sai tool, và chỉ sau khi đã sửa tên, tham số, mô tả.</p>
<p>"Chồng chéo" đo được. Bên dưới là mô tả 6 tool của trợ lý ShopViet. Trình duyệt tính độ trùng từ (Jaccard) giữa mọi cặp mô tả và đánh dấu cặp dễ nhầm. Bấm "Viết lại mô tả" để xem bản đã tách rõ mục đích.</p>`,
        viz(box) {
          const V1 = [['search_orders', 'tìm đơn hàng của khách theo thông tin đơn hàng'], ['lookup_order', 'tra thông tin đơn hàng của khách theo mã đơn hàng'], ['get_order_status', 'lấy trạng thái đơn hàng của khách'], ['search_kb', 'tìm bài hướng dẫn trong kho kiến thức'], ['get_policy', 'lấy chính sách đổi trả bảo hành'], ['create_ticket', 'tạo ticket hỗ trợ cho khách']];
          const V2 = [['search_orders', 'liệt kê đơn của khách đang chat trong 90 ngày, dùng khi khách không nhớ mã đơn'], ['lookup_order', 'chi tiết một đơn theo mã SV-xxxx: sản phẩm, giá, thanh toán, lịch sử'], ['get_order_status', 'chỉ trạng thái giao vận hiện tại theo mã SV-xxxx, rẻ hơn lookup_order'], ['search_kb', 'tìm bài hướng dẫn sử dụng, sửa lỗi thiết bị'], ['get_policy', 'văn bản chính sách hiện hành theo chủ đề: doi-tra, bao-hanh'], ['create_ticket', 'tạo ticket chuyển người thật, chỉ khi agent không tự xử lý được']];
          const words = (s) => new Set(s.toLowerCase().split(/[^\p{L}\p{N}-]+/u).filter((w) => w.length > 1));
          const jac = (a, b) => { const A = words(a), B = words(b); let n = 0; A.forEach((w) => B.has(w) && n++); return n / (A.size + B.size - n); };
          let v2 = false; const out = el('div');
          const draw = () => {
            const T = v2 ? V2 : V1, pairs = [];
            for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++) pairs.push([T[i][0], T[j][0], jac(T[i][1], T[j][1])]);
            pairs.sort((a, b) => b[2] - a[2]);
            const risky = pairs.filter((p) => p[2] >= 0.3).length;
            out.innerHTML = '<div class="tbl"><table><tr><th>Cặp tool</th><th>Độ trùng từ</th></tr>' + pairs.slice(0, 5).map(([a, b, s]) => '<tr><td class="mono">' + a + ' / ' + b + '</td><td><b class="' + (s >= 0.3 ? 'bad' : 'ok') + '">' + s.toFixed(2) + '</b></td></tr>').join('') + '</table></div><p style="margin:6px 0 0">' + (risky ? '<b class="bad">' + risky + ' cặp trùng từ 0,30 trở lên</b>: model khó phân biệt khi nào dùng tool nào.' : '<b class="ok">Không cặp nào trùng từ 0,30.</b> Mỗi mô tả nói rõ khi nào dùng.') + '</p>';

        take: 'Trước khi tách agent, sửa bộ tool: tên khác nhau, mô tả nói khi nào dùng và khi nào không.'
      },
      {
        q: 'Lab chính cho thấy multi-agent tốn gấp khoảng 4 lần một agent. README nói 15× so với 4×. Vậy chia việc cho nhiều agent làm tốn token hơn?',
        a: `<p>Hai con số của README đều so với chat: agent khoảng 4×, multi-agent khoảng 15×, tức multi-agent khoảng 15 / 4 ≈ 3,75 lần một agent. Lab chính với tham số mặc định ra cùng cỡ đó. Nhưng nhìn kỹ tham số: một agent có ngân sách <b>12</b> tool call, còn multi-agent đi đủ 6 hướng × 8 call = <b>48</b> call. Hai bên không làm cùng lượng việc.</p>
<p>POC lab này tách hai yếu tố ra. <b>Cùng 18 tool call</b>: một agent tốn 338.675 token, lead + 6 worker chỉ 142.450 token, chưa tới một nửa. Chia việc làm <i>giảm</i> token, vì mỗi context ngắn hơn (câu hỏi tiếp theo giải thích). Khi giao <b>4 worker × 12 call</b> theo định mức README, tổng là 687.050 token, gấp đôi một agent. Hệ số lớn đến từ <b>làm nhiều việc hơn</b>, không phải từ việc chia.</p>
<p>Đổi lại, Anthropic đo hệ thống Opus 4 làm lead, Sonnet 4 làm sub-agent tốt hơn một agent Opus 4 đơn lẻ 90,2% trên eval research nội bộ. Họ viết thẳng lý do: trên BrowseComp, riêng <b>lượng token</b> đã giải thích 80% phương sai kết quả; ba yếu tố token, số tool call, lựa chọn model giải thích 95%. Multi-agent hiệu quả chủ yếu vì nó giúp tiêu đủ token cho bài toán, trên nhiều context window chạy song song.</p>
<p>Trong lab, một agent với 12 call chỉ đi được 1 hướng rưỡi và không chạm tới báo cáo lô hàng, nơi có nguyên nhân gốc. Nó rẻ vì nó làm ít.</p>
<p><b>Không có nghĩa là</b> cứ tách agent là tiết kiệm: hệ thống thật được tách ra chính để đi rộng hơn, nên hoá đơn thật thường tăng. <b>Trong hệ thống thật:</b> khi so hai kiến trúc, ghi cả số tool call bên cạnh số token, và so chi phí trên mỗi tác vụ thành công.</p>`,
        take: 'So chi phí theo tác vụ thành công, không theo request. Agent rẻ mà bỏ sót nguyên nhân thì không rẻ.'
      },
      {
        q: 'Lạ: kéo ngân sách một agent lên 48 call để đi đủ 6 hướng thì nó tốn hơn cả multi-agent. Sao vậy?',
        a: `<p>Vì context của một agent phình theo mọi thứ nó đã đọc. Ở call thứ k, agent gửi lại k tool result trước đó. Tổng input của một agent làm c call là khoảng P·c + r·c²/2: tăng theo <b>bình phương</b> số call.</p>
<p>Multi-agent chia 48 call thành 6 context riêng, mỗi context 8 call. Bình phương của 8 nhân 6 nhỏ hơn nhiều so với bình phương của 48. Lead chỉ nhận 6 bản tóm tắt 1.500 token, không nhận dữ liệu thô. Đây là lý do thứ hai trong bảng "khi nào tách" của README: <b>cô lập context</b>.</p>
<p>Điều này không mâu thuẫn với 15× của README. Con số đó so hai hệ <i>làm khác lượng việc</i>: agent đơn lẻ thật thường dừng sớm, multi-agent đi rộng hơn. Khi bắt một agent làm cùng lượng việc, nó trả giá bình phương, và còn phải đọc context 80k token đầy distractor ở bước cuối.</p>`,

          box.append(el('div', { class: 'row' }, [slider('Tổng tool call', 6, 90, 6, S.c, (v) => { S.c = v; draw(); }).node, slider('Chia cho số worker', 1, 10, 1, S.k, (v) => { S.k = v; draw(); }).node]), out,
            el('div', { class: 'cap', text: 'Chỉ tính input token. Tool result 1.500 token, prompt lead 4.000, worker 2.500 (giả định).' }));

      },
      {
        q: 'Vậy chia càng nhiều worker càng tốt?',
        a: `<p>Không. Kéo "Số worker" ở lab chính lên 8 với 6 hướng: wall time không giảm thêm, vì thời gian song song bằng worker <b>chậm nhất</b>, và mỗi hướng vẫn cần 8 call tuần tự. Hai worker thừa không có hướng riêng.</p>
<p>Với brief một dòng thì tệ hơn: worker tự chọn hướng, và hướng "dễ nghĩ tới" (ticket, đánh giá) bị nhiều worker cùng đào, còn báo cáo lô hàng thì không ai đụng. Anthropic gặp đúng chuyện này: lead giao "tìm hiểu về thiếu hụt chip bán dẫn", một sub-agent đi tìm khủng hoảng chip ô tô năm 2021, hai sub-agent khác cùng tìm chuỗi cung ứng năm 2025.</p>
<p>Anthropic ghi định mức vào prompt của lead: tra cứu đơn giản 1 agent 3–10 call; so sánh trực tiếp 2–4 sub-agent với 10–15 call mỗi sub-agent; research phức tạp mới hơn 10 sub-agent.</p>`,

      {
        q: 'Song song khi nào thì hỏng dù brief đã tốt?',
        a: `<p>Khi các phần phải <b>khớp quyết định</b> với nhau. Cognition (công ty làm Devin) kể ví dụ: chia làm game Flappy Bird cho hai sub-agent, một làm nền có ống nước, một làm con chim. Sub-agent đầu làm nền phong cách Super Mario; sub-agent sau làm con chim không khớp cả phong cách lẫn cách chuyển động. Mỗi bên đều hợp lý với phần mình.</p>
<p>Đổi lab chính sang "Ghi phụ thuộc": 3 worker soạn chính sách đổi trả mới, email gửi khách, FAQ. Có 4 quyết định ngầm (thời hạn, ai trả phí ship, ngày áp dụng, giọng văn). Brief tốt chốt được 2 quyết định lead nghĩ tới; 2 quyết định còn lại mỗi worker tự chọn. Kết quả: email nói "áp dụng từ 01/12", FAQ nói "từ 01/01". Một agent viết cả ba thì không có mâu thuẫn, vì nó thấy chính quyết định của mình.</p>
<p>README tổng hợp: Anthropic tách agent cho các nhánh <i>đọc</i> độc lập; Cognition cảnh báo tách cho các phần <i>ghi</i> phụ thuộc. Với tác vụ rất dài, Cognition khuyên thêm một model nén lịch sử thành sự kiện và quyết định chính, thay vì tách agent.</p>`,

<p>Nhóm thứ ba, kiểm tra kết quả, đáng chú ý nhất: nhiều hệ có agent "verifier", nhưng verifier kiểm tra hời hợt (FM-3.2) hoặc kiểm tra sai thứ (FM-3.3): code biên dịch được thay vì game chạy đúng luật. Trong ví dụ ShopViet, verifier đọc báo cáo tổng hợp và thấy "trôi chảy, có số liệu" là cho qua, dù báo cáo không nhắc tới lô hàng. Verifier đúng phải chạy kiểm tra thật: mọi hướng trong kế hoạch đều có output, mọi kết luận đều có trường nguồn.</p>

<ul><li><b>Lỗi phải resume được.</b> Agent chạy lâu mà khởi động lại từ đầu mỗi khi lỗi thì vừa tốn vừa làm người dùng bực. Họ kết hợp checkpoint và retry với việc báo cho agent biết tool đang lỗi để nó tự thích ứng.</li>

<p>Thêm vào đó là trace: một câu hỏi giờ là 1 lead và N context worker, mỗi context có vòng lặp riêng. Đọc trace lỗi của multi-agent tốn công hơn nhiều so với một luồng.</p>`,

function terms(list) {

function problem(p) {

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {

}
