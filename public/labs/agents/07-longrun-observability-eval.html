const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

<li>Multi-agent: chấm thêm tổng chi phí, số sub-agent, mức trùng lặp. Benchmark công khai (SWE-bench Verified, τ²-bench, OSWorld, Terminal-Bench) để chọn ứng viên, không để kết luận về agent của bạn.</li></ul>
<div class="verdict"><b>Điểm cần nhớ:</b> resume an toàn cần ba thứ cùng lúc: lưu trước khi chạy tool, khoá cố định theo run id + tool call id, và phía nhận khử trùng theo khoá. Chấm agent bằng trạng thái thật, đo pass^k chứ không chỉ pass@k.</div>`,
    why: {
      c: 'Checkpoint ở store bền vững sau response và sau tool; idempotency key = run_id:tool_use_id; cổng thanh toán khử trùng theo khoá, email executor tự ghi khoá. Trace có status, lý do dừng, ngân sách, kết quả outcome, phiên bản. Eval chấm outcome bằng code đọc trạng thái, báo pass^k.',
      s: 'Checkpoint chỉ sau tool: resume gọi lại model, id mới, khoá mới. Khoá uuid4 hay timestamp: mỗi lần chạy lại là một khoá mới. Chạy lại từ đầu khi lỗi: đắt và lặp mọi tác dụng phụ. Grader so chuỗi tool đúng thứ tự: phạt đường đi hợp lệ khác, cho qua đường đúng mà kết quả sai. Chỉ báo pass@k: đẹp hơn trải nghiệm thật.',

    deep: [
      {
        q: 'Agent đổi trả của ShopViet chạy chưa tới 30 giây. Cần checkpoint làm gì?',
        a: `<p>Vì run không chỉ chạy trong 30 giây đó. README §3.4: agent chạy vài phút tới vài giờ sẽ gặp process bị kill, deploy mới, mất mạng, rate limit. Run của ShopViet có thể ngắn, nhưng nó có thể <b>dừng chờ duyệt</b> hoàn tiền trong 3 giờ (bài 6). Trong 3 giờ đó process không thể ngồi giữ biến trong RAM: run phải được lưu, process giải phóng, và khi người duyệt bấm nút, một process khác (có thể chạy bản code mới sau deploy) đọc lại và chạy tiếp.</p>
<p>Vậy checkpoint là điều kiện để có human-in-the-loop, không chỉ để chống crash. Thiết kế phải giả định run sẽ bị ngắt và chạy tiếp được.</p>
<p>Còn deploy: run đang chờ dùng prompt và code phiên bản cũ. Hoặc giữ phiên bản cũ chạy tới khi run cũ xong (Anthropic dùng rainbow deployment), hoặc đảm bảo trạng thái lưu tương thích với phiên bản mới và ghi phiên bản prompt vào trạng thái run.</p>`,
        take: 'Checkpoint là thứ cho phép run dừng chờ người, sống qua deploy, và chạy tiếp ở process khác.'

      {
        q: 'Đã lưu sau mỗi bước rồi, sao khách vẫn bị hoàn tiền hai lần?',
        a: `<p>Vì "sau mỗi bước" có hai nghĩa, và chỉ một nghĩa an toàn. Nếu chỉ lưu <b>sau khi chạy tool</b>, process chết giữa lúc cổng thanh toán đã hoàn tiền mà chưa kịp lưu: checkpoint cuối là bước trước. Resume gọi lại model, model sinh lại <code>refund_order</code> nhưng với id mới <code>toolu_03b</code>, nên khoá mới, cổng thanh toán thấy một khoản hoàn thứ hai.</p>
<p>Code README §3.2 lưu thêm <b>sau khi nhận tool call, trước khi chạy tool</b>. Crash lúc đó thì resume thấy message cuối là <code>tool_use</code> chưa có kết quả, chạy lại đúng <code>toolu_03</code> với cùng khoá, phía nhận trả kết quả cũ. Bảng dưới chạy cả hai với crash ngay sau "Chạy refund_order", khoá run_id + tool_use_id, cổng thanh toán có khử trùng:</p>`,
        viz(box) {
          const at = EVENTS.findIndex((e) => e.t === 'tool' && e.i === 2);

          box.innerHTML = '<table><tr><th>Cách lưu</th><th>Lệnh tới cổng thanh toán</th><th>Hoàn tiền thật</th></tr>' + rows + '</table><div class="cap">Cùng khoá theo công thức, cùng cổng có khử trùng, khác nhau chỉ ở thời điểm lưu. Lưu sau tool thì resume đi qua model, model cấp id mới, khoá mới.</div>';

      {
        q: 'Sinh idempotency key bằng uuid4 cho mỗi lệnh hoàn tiền thì sai ở đâu?',
        a: `<p>uuid4 khác nhau mỗi lần sinh. Lần chạy đầu và lần chạy lại sau resume sinh hai khoá khác nhau, nên với phía nhận đó là hai lệnh khác nhau. Timestamp cũng vậy: lần chạy lại xảy ra ở thời điểm khác. README §3.4: khoá lấy từ thứ <b>cố định khi chạy lại</b>, tức run id cộng tool call id.</p>
<p>Hình dưới sinh khoá thật cho hai lần thực thi cùng tool call <code>toolu_03</code> (lần đầu, và lần resume 50 giây sau):</p>`,
        viz(box) {

      {
        q: 'Khoá đã cố định, checkpoint đã đúng. Sao email "đã hoàn tiền" vẫn tới khách hai lần?',
        a: `<p>Vì khoá cố định chỉ đảm bảo lần chạy lại <b>gửi cùng khoá</b>. Tác dụng phụ không lặp chỉ khi hệ thống nhận <b>khử trùng theo khoá</b>: API thanh toán có idempotency key, bảng ghi có ràng buộc unique trên khoá. Dịch vụ email của ShopViet không có cơ chế đó, nên nhận khoá cũ vẫn gửi lần nữa.</p>
<p>README §3.2 nêu ba lựa chọn cho hệ thống nhận không có dedupe:</p>
<ol><li>Executor tự ghi khoá và kết quả vào store bền vững <b>trong cùng giao dịch</b> với thao tác ghi.</li>

<p>Trong hình chính, đặt crash ngay sau "Chạy send_email" với cấu hình README rồi tắt "Email executor tự ghi khoá" để thấy.</p>`,
        take: 'Idempotency là việc của cả hai phía: người gửi giữ khoá cố định, người nhận nhớ khoá đã thấy.'
      },
      {
        q: 'Khách đóng tab lúc agent đang xử lý khiếu nại dài. Run có chết theo không?',
        a: `<p>Không nên. Tác vụ dài nên tách khỏi kết nối của khách: chạy nền, báo khi xong. README §3.4 nêu hai cách.</p>
<p><b>Background mode của OpenAI Responses API:</b> gửi với <code>background: true</code>, nhận response id ngay, rồi poll <code>GET /v1/responses/{id}</code> tới khi trạng thái không còn <code>queued</code> hay <code>in_progress</code>. Huỷ bằng <code>POST /v1/responses/{id}/cancel</code>, gọi lặp không sao. Tạo với <code>stream: true</code> thì mất kết nối có thể stream lại từ <code>sequence_number</code> cuối. Hai lưu ý: time-to-first-token cao hơn; với <code>store=false</code> (ví dụ zero data retention) response chỉ được giữ khoảng 10 phút để poll.</p>
<p><b>Durable execution</b> (Temporal) khi agent là một phần quy trình nhiều ngày: mỗi lượt model là một activity, mỗi tool call là một activity có idempotency key, trạng thái agent là trạng thái workflow. Engine lo chạy lại; bạn lo việc mỗi activity chạy lại an toàn, tức đúng bài toán ở phần A.</p>`,
        take: 'Run dài sống tách khỏi kết nối của khách; engine chạy lại được thì activity phải chạy lại an toàn.'
      },
      {
        q: 'Đã có trace từng lượt model. Trace của agent cần thêm gì?',
        a: `<p>Span <code>invoke_agent</code>, <code>chat</code>, <code>execute_tool</code> đã có ở LLM Observability §3.2. Với agent, README §3.5 thêm lên span của run: trạng thái kết thúc và lý do dừng, ngân sách đã dùng, kết quả kiểm tra outcome, số lần duyệt/từ chối/hết hạn, phiên bản prompt, tool, model. Bước chờ duyệt cũng là một span (README §3.3).</p>
<p>Hình dưới vẽ trace của run khiếu nại có một lần chờ duyệt 2 giờ (thời lượng giả định). Thanh dưới cùng tính tỉ lệ thời gian hoạt động trên tổng thời gian.</p>`,
        viz(box) {
          const spans = [['chat', 'Lượt 1 → get_order', 2.6], ['execute_tool', 'get_order', 0.6], ['chat', 'Lượt 2 → check_policy', 2.8], ['execute_tool', 'check_policy', 0.5], ['chat', 'Lượt 3 → refund_order', 3.1], ['approval', 'Chờ duyệt refund_order 4.500.000 đ → từ chối', 7200], ['chat', 'Lượt 4 → refund_order 450.000 đ', 3.2], ['execute_tool', 'refund_order', 0.9], ['chat', 'Lượt 5 → end_turn', 2.4]];
          const total = spans.reduce((s, x) => s + x[2], 0), active = spans.filter((x) => x[0] !== 'approval').reduce((s, x) => s + x[2], 0);
          let t = 0;

          const kids = [el('rect', { x: 150, y: 2, width: W - 160, height: rowH - 6, fill: 'var(--accent-soft)' }), el('text', { x: 2, y: rowH - 6, text: 'invoke_agent (run)' })];
          spans.forEach(([k, lab, d], i) => { const y = (i + 1) * rowH + 2; kids.push(el('text', { x: 2, y: y + 11, class: 'mute', text: k }), el('rect', { x: sx(t), y, width: Math.max(2, sx(t + d) - sx(t)), height: rowH - 6, fill: k === 'approval' ? 'var(--warn)' : k === 'chat' ? 'var(--g1)' : 'var(--g3)' }, [el('title', { text: lab + ': ' + dec(d, 1) + ' giây' })])); t += d; });
          box.append(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H }, kids), el('div', { class: 'cap', html: 'Trục thời gian co giãn theo căn bậc hai để thấy được span ngắn. Tổng ' + dec(total / 3600, 2) + ' giờ, thời gian hoạt động ' + dec(active, 1) + ' giây (' + pct(active / total, 2) + '). <span style="color:var(--warn)">Dashboard tính "độ trễ run" bằng tổng thời gian sẽ thấy run này chậm 2 giờ và báo động nhầm.</span> Không có nghĩa agent chậm: span duyệt phải tách riêng, độ trễ agent tính trên thời gian hoạt động, thời gian chờ duyệt theo dõi như một metric riêng.' }));

      {
        q: 'Chấm agent bằng cách so chuỗi tool với đường đi mẫu cho chắc, sao lại không nên?',
        a: `<p>Vì nó sai theo hai chiều. Chiều thứ nhất: agent hay tìm được cách hợp lệ mà người viết eval không nghĩ tới (README §3.6). Đọc chính sách trước khi tra đơn, tra theo số điện thoại rồi mới tra mã đơn, chuyển nhân viên khi khách đòi thêm: đều đúng nhưng bị chấm trượt.</p>
<p>Chiều thứ hai, nguy hiểm hơn: đường đi đúng mà kết quả sai. Agent gọi đủ bốn tool theo đúng thứ tự, nhưng <code>refund_order</code> trả lỗi <code>PAYMENT_DOWN</code> và agent vẫn báo "đã hoàn tiền"; hoặc hoàn 129.000 đ thay vì 1.290.000 đ. Grader đường đi cho qua cả hai. Phần B của hình chính đếm cụ thể.</p>

        take: 'Chấm outcome bằng code đọc trạng thái. Ràng buộc về hành động viết thành điều kiện trên trạng thái, không phải chuỗi tool.'

      {

<p>pass@k hợp với tác vụ mà bạn được thử nhiều lần và chọn cái đúng (sinh code rồi chạy test). Chăm sóc khách hàng thì mỗi khách chỉ có một lần; agent phải đúng mọi lần, nên pass^k gần với trải nghiệm thật hơn.</p>`,

            cap.innerHTML = 'Với p = ' + pct(st.p) + ': pass@' + st.k + ' = 1 − (1 − p)^k = ' + pct(at, 1) + ', pass^' + st.k + ' = p^k = ' + pct(hat, 1) + '. ' + (at - hat > 0.4 ? '<span class="bad">Chênh ' + dec((at - hat) * 100, 0) + ' điểm: báo pass@k cho tác vụ phục vụ khách là báo con số đẹp hơn trải nghiệm.</span>' : '');

    poc: {

        if (ev.mode === 'set') fl.push(['warn', 'Chấm theo tập tool bắt buộc bớt đánh trượt nhầm, nhưng run #6 (hoàn hai lần) cũng qua: có đủ tool, thừa một lần.']);
        evFlags.replaceChildren(...fl.map(([l, t]) => flagBox(l, t)));
        evCap.innerHTML = capHtml({ what: 'Báo cáo theo đường đi nói ' + pct(tj.pass / res.length) + ' run đạt, theo tự khai ' + pct(cl.pass / res.length) + ', theo outcome ' + pct(stats[2].pass / res.length) + '. Nhãn người: ' + pct(human) + '.', why: 'Đường đi và lời tự khai đều không nhìn vào trạng thái: không biết refund_order có thật sự ghi bản ghi không, số tiền bao nhiêu, có ghi hai lần không. Outcome đọc bảng hoàn tiền nên khớp nhãn người ở cả 13 run.', not: 'Không có nghĩa đường đi vô ích: nó giúp đọc lỗi (agent kẹt ở get_shipment). Nó là dữ liệu để chẩn đoán, không phải tiêu chí đạt.', real: 'grader outcome bằng code (README §3.6); đọc transcript của ca đổi trạng thái đạt/trượt; ràng buộc như "trên 2.000.000 đ phải có duyệt" viết thành điều kiện trên trạng thái.' });

      const pk = { k: 3, seed: 4821 };

        pkTable.innerHTML = '<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12.5px;width:100%;min-width:480px;margin-top:8px"><tr style="background:var(--bg)"><th>Task</th><th>Đạt / 8</th><th>pass@' + pk.k + '</th><th>pass^' + pk.k + '</th></tr>' + rows.map((r) => '<tr><td>' + r.name + '</td><td class="mono">' + r.c + '</td><td class="mono">' + pct(r.at) + '</td><td class="mono ' + (r.hat < 0.5 ? 'bad' : '') + '">' + pct(r.hat) + '</td></tr>').join('') + '<tr><td><b>Trung bình</b></td><td class="mono">' + pct(P) + '</td><td class="mono"><b>' + pct(A) + '</b></td><td class="mono"><b>' + pct(H) + '</b></td></tr></table></div>';
        const fl = [];

      );

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {

(function build() {
