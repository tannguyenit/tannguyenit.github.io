const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

      else add('ok', 'resultType = "complete"', '');
      if ('content' in r || 'isError' in r || 'structuredContent' in r) {
        Array.isArray(r.content) ? add('ok', `content: ${r.content.length} block`, '') : add('bad', 'content phải là mảng', '');
        if (r.isError === true) add('ok', 'isError: true', 'Lỗi thực thi tool: client đưa nội dung cho model để nó tự sửa hoặc hỏi lại người dùng.');

      }
      set({ s: 'client', b: r.isError ? 'Model thấy thông báo lỗi và tự xử lý' : 'Kết quả tới model', n: '' });
    }
    return { R, out };
  }

      {
        q: 'Inspector và curl khác nhau thế nào? Lệnh cụ thể trông ra sao?',
        a: `<p><b>MCP Inspector</b> là công cụ chính thức, một gói ba giao diện: web (mặc định), CLI, TUI. Cần Node 22.19.0 trở lên. CLI gọi một method rồi thoát; khi tool trả <code>isError: true</code>, CLI in thêm dòng <code>{"error":{"code":"tool_is_error",...}}</code> và thoát với mã lỗi, nên đặt được vào CI. Inspector tự thương lượng giữa thời kỳ cũ và mới. Web UI in một URL có API token riêng cho mỗi lần chạy: đừng chia sẻ, vì Inspector khởi chạy được lệnh trên máy bạn.</p>
<p><b>curl</b> soi được từng byte của một request HTTP, nhưng bạn phải tự gửi đúng bốn header và <code>_meta</code>. Bộ dựng lệnh bên dưới sinh header từ body, nên <code>Mcp-Name</code> luôn khớp <code>name</code>.</p>`,

      {
        q: 'Server stdio chạy tay thì in ra đúng JSON, sao client lại ngắt ngay?',
        a: `<p>Trên stdio, client đọc stdout của server từng dòng và parse mỗi dòng thành một message. Không có độ dài, không có header, không có ký tự phân cách nào khác. Một dòng <code>print("debug")</code> hay banner "server starting" là một message hỏng, client báo lỗi parse và ngắt.</p>
<p>Vì sao chạy tay không thấy? Vì bạn đọc stdout bằng mắt, mắt bỏ qua dòng log. Client thì không. Thư viện bên thứ ba in ra stdout cũng gây đúng lỗi này. Đặt log đi đâu và xem client nhận gì:</p>`,
        viz(box) {

      {
        q: 'Client đời 2026 nối vào server đời 2025 thì chuyện gì xảy ra?',
        a: `<p>Hai thời kỳ không nói chuyện trực tiếp được với nhau. Đặc tả mô tả cách client mới phát hiện: trên <b>stdio</b>, gửi <code>server/discover</code> trước, nếu lỗi không phải lỗi kiểu mới thì quay về <code>initialize</code>; trên <b>HTTP</b>, thử request kiểu mới, nếu nhận <code>400</code> mà body không phải lỗi kiểu mới thì quay về cách cũ. Kết quả cache theo process (stdio) hoặc origin (HTTP).</p>
<p>Python SDK 2.3.0 làm cả hai phía: <code>Client</code> mặc định probe <code>server/discover</code> rồi fallback, server HTTP vẫn nhận <code>initialize</code> và cấp <code>mcp-session-id</code>.</p>`,

                else { steps.push([S.t === 'http' ? 'Nhận 400, body không phải lỗi kiểu mới, quay về initialize' : 'Lỗi không phải kiểu mới, quay về initialize', 'warn']); steps.push(['Chạy kiểu 2025; cache kết quả theo ' + (S.t === 'http' ? 'origin' : 'process'), 'ok']); }

            el('div', { class: 'cap', text: 'Luồng theo §1.3 của README. "Server cả hai" ở hàng client 2025 đi nhánh legacy có session; ở hàng client 2026 trả lời kiểu mới.' }));

        },
        take: 'Trong giai đoạn chuyển tiếp, test cả bốn tổ hợp client và server. Inspector tự thương lượng nên dễ che mất lỗi của client tự viết.'
      },
      {
        q: 'Stream đứt giữa chừng thì client gửi lại. Gửi lại refund_order thì sao?',
        a: `<p>Bản 2026 bỏ resume stream (<code>Last-Event-ID</code>). Stream đứt thì request đang chạy mất, client MUST gửi lại với <b>id mới</b>. Server không biết đây là lần thử lại hay một yêu cầu mới. Đóng response stream cũng là cancellation: server nên dừng sớm nhất có thể, nhưng nếu nó đã ghi xong thì việc đã xảy ra.</p>
<p>Với tool chỉ đọc thì không sao. Với <code>refund_order</code> thì mỗi lần gửi lại có thể hoàn tiền thêm một lần, trừ khi tool idempotent: README ví dụ <code>refund_order</code> khai <code>idempotentHint=True</code> và code thật sự kiểm "đã hoàn chưa". Số tiền đơn và số lần đứt bên dưới là giả định.</p>`,
        viz(box) {

      {
        q: 'Prompt không đổi mà cache hit thấp. Server MCP liên quan gì?',
        a: `<p>Client đưa tool definition từ <code>tools/list</code> vào đầu prompt. Prompt cache của provider chỉ dùng lại được <b>phần đầu giống hệt nhau từng ký tự</b>. Nếu server trả tool theo thứ tự khác ở mỗi lần gọi (duyệt dict không thứ tự, gom từ nhiều nguồn song song), phần tool của prompt đổi, và mọi thứ sau đó mất cache. Đặc tả 2026-07-28 khuyên server trả tool theo thứ tự xác định.</p>
<p>Bấm "Gọi tools/list lần nữa" và xem bao nhiêu ký tự đầu còn giống lần trước. Trình duyệt so từng ký tự.</p>`,
        viz(box) {
          const tools = ['get_order', 'refund_order', 'check_stock', 'get_policy', 'list_orders'].map((n) => `{"name":"${n}","description":"…","inputSchema":{…}}`);
          const out = el('div'); let prev = tools.join(','), seed = 4;
          const f = select('Server', [['fixed', 'thứ tự cố định'], ['rand', 'thứ tự tuỳ lần']], 'rand', () => { prev = tools.join(','); draw(false); });

      },
      {
        q: 'Unit test xanh hết, sao model vẫn gọi nhầm tool?',
        a: `<p>Unit test kiểm server đúng; nó không kiểm model chọn tool nào. Model chọn dựa trên tên và description. Thêm một tool mô tả chồng lấn có thể làm model chọn nhầm tool cũ <b>vốn đang chạy tốt</b>. Vì vậy README khuyên chạy lại eval mỗi khi đổi description hay thêm tool: lấy câu hỏi thật, chạy qua host với server của bạn, chấm cả kết quả lẫn chuỗi tool call.</p>
<p>Một tín hiệu rẻ trước khi chạy eval: hai description dùng nhiều chữ giống nhau. Bên dưới đo độ trùng từ (Jaccard) giữa <code>get_order</code> và một tool mới. Đây là heuristic minh hoạ, không thay eval.</p>`,
        viz(box) {
          const A = 'Lấy trạng thái và tổng tiền của một đơn hàng theo mã đơn.';

          const out = el('div');

      {
        q: 'Gõ sai tên tool trong allowlist của Claude connector thì báo lỗi gì?',
        a: `<p>Không lỗi gì cả. Với MCP connector của Claude API, tên tool trong <code>configs</code> không tồn tại trên server chỉ sinh cảnh báo phía backend. Mẫu allowlist tắt mọi tool (<code>default_config: {"enabled": false}</code>) rồi bật riêng từng cái; gõ sai một tên thì tool đó im lặng không xuất hiện, và trợ lý trả lời "tôi không tra được đơn".</p>
<p>Cách README đề xuất: trong test, so <code>configs</code> với <code>tools/list</code>. Sửa allowlist bên dưới:</p>`,
        viz(box) {

          const ta = el('textarea', { rows: 2, spellcheck: 'false', style: VAL_INP }); ta.value = 'get_order, check_stok, get_policy';
          const out = el('div');
          function draw() {

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
