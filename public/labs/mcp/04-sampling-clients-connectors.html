const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<p>POC đo trên SDK <code>mcp</code> 2.3.0 (xem cuối bài): SDK tự niêm phong <code>requestState</code> bằng AES-GCM. Sửa 4 ký tự, tự viết JSON mới, hay giữ state mà đổi <code>order_id</code> đều bị <code>-32602 Invalid or expired requestState</code>. Tốt. Nhưng có hai chỗ bất ngờ:</p>
<ul><li><b>Replay vẫn chạy:</b> gửi lại đúng chuỗi cũ lần nữa thì tool chạy lần nữa. Niêm phong chống <i>sửa</i>, không chống <i>gửi lại</i>. Vì sao: server không nhớ gì nên không biết chuỗi đã dùng. Trong hệ thống thật: <code>refund_order</code> phải idempotent theo mã đơn.</li>
<li><b>Khoá mặc định là của từng process:</b> lượt 1 ở instance A, lượt gửi lại ở instance B thì B không mở được chuỗi A niêm phong → <code>-32602</code>. Vì sao: mỗi process tự sinh khoá riêng khi khởi động. Không có nghĩa là MRTR không stateless được. Trong hệ thống thật: cấu hình một khoá chung cho mọi instance (<code>RequestStateSecurity(keys=[...])</code>), nếu không câu "mọi instance phục vụ được mọi request" ở README §3.3 sai với đúng loại request này.</li></ul>`,
        take: 'Niêm phong chặn sửa, không chặn gửi lại. Chạy nhiều instance thì khoá niêm phong phải dùng chung.'
      },

        q: 'Server ShopViet muốn tóm tắt 200 đánh giá sản phẩm bằng LLM. Sampling sinh ra cho việc đó mà, sao lại bỏ?',
        a: `<p>Sampling cho server mượn model của client: server gửi <code>sampling/createMessage</code>, client sinh text bằng model và key của người dùng. Bản 2026-07-28 bỏ hẳn hướng server gửi request ngược cho client: mọi luồng do client khởi đầu để server chạy stateless sau load balancer bình thường. Sampling deprecated, cùng với <code>includeContext</code>.</p>
<p>Thay thế theo README: server gọi thẳng API của LLM provider, tự quản lý key và chi phí. Với ShopViet: tóm tắt 200 đánh giá là chi phí của ShopViet, không phải của người dùng đang chat. Cái được: chọn model, cache kết quả theo sản phẩm, không phụ thuộc client có hỗ trợ sampling hay không.</p>
<p><b>Không có nghĩa là</b> code sampling cũ ngừng chạy ngay: deprecated còn ít nhất 12 tháng. Nhưng server mới không nên bắt đầu bằng nó.</p>`,
        take: 'Server cần LLM thì tự gọi LLM. Một tính năng phụ thuộc vào việc client cho mượn model là tính năng có thể biến mất theo client.'

function terms(list) {

}

function problem(p) {

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {

  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}
