const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

<p><b>Lưu ý về số trong hình chính:</b> lab cho <code>tools/list</code> trả <code>ttlMs: 600000</code> (10 phút), <code>cacheScope: "public"</code> để minh hoạ. Đó là giá trị server tự chọn khai. Server Python SDK 2.3.0 không khai gì thì trả mặc định <code>ttlMs: 0</code>, <code>cacheScope: "private"</code>: nghĩa là client không được dùng lại kết quả, mỗi lần cần là gọi lại. Muốn host cache thì server phải tự đặt hai field này.</p>
<p>Thứ tự thì quan trọng vì một lý do khác: prompt cache của provider khớp theo <b>tiền tố</b> (phần đầu prompt giống hệt request trước). Tool definition nằm đầu prompt. Đặc tả 2026-07-28 khuyên server trả tool theo thứ tự cố định (README §3.1). Chọn thứ tự của lần gọi thứ hai, trình duyệt so hai chuỗi tool từng ký tự:</p>`,

    poc: {

      output: "Model KHÔNG được gọi: host là kịch bản viết tay. Phần thật: SDK mcp 2.3.0 (client + server), process con / HTTP 127.0.0.1, JSON-RPC trên dây, token đếm bằng tiktoken o200k_base (tokenizer khác Claude, chỉ so tương đối).\n\nSDK: mcp 2.3.0 (Python). Không gọi model nào. Host là kịch bản viết tay (chọn tool cố định); phần thật: SDK mcp, process/HTTP thật, JSON-RPC thật, token đếm bằng tiktoken o200k_base.\n\n== Dây stdio thật, Client(mode='auto'), version thương lượng được: 2026-07-28 ==\nChiều  id  Message                                   Byte  Token-tương-đương\n-----  --  ----------------------------------------  ----  -----------------\n->     1   server/discover                           245   69\n<-     1   result: complete                          441   112\n->     2   tools/list                                240   68\n<-     2   result: 4 tool                            3134  780\n->     3   resources/list                            244   68\n<-     3   result: complete                          475   129\n->     4   resources/read policy://shopviet/doi-tra  278   78\n<-     4   result: complete                          810   198\n->     5   prompts/list                              242   69\n<-     5   result: complete                          439   122\n->     6   prompts/get tom_tat_khieu_nai             303   91\n<-     6   result: complete                          535   133\n->     7   tools/call get_order                      294   85\n<-     7   result: complete                          675   228\n->     8   tools/call get_order                      295   85\n<-     8   result: isError=true                      299   83\n\nMột request trên dây (nguyên văn):\n  {\"jsonrpc\":\"2.0\",\"id\":7,\"method\":\"tools/call\",\"params\":{\"name\":\"get_order\",\"arguments\":{\"order_id\":\"sv-4821\"},\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-07-28\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"mcp\",\"version\":\"0.1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}\n\n== Cùng các lệnh với Client(mode='legacy'), version: 2025-11-25 ==\nChiều  id  Message                                   Byte  Token-tương-đương\n-----  --  ----------------------------------------  ----  -----------------\n->     1   initialize                                152   50\n<-     1   result: ok                                350   89\n->     -   notifications/initialized (notification)  54    14\n->     2   tools/list                                46    17\n  … (17 dòng trên dây, bản 2026: 16 dòng)\n  Tổng byte trên dây: 2026-07-28 = 8.949 | 2025-11-25 = 6.645 (bản 2026 lặp _meta ở mọi request, bỏ initialize)\n\n== Hai lỗi, hai hình dạng (tool execution error đi vào context, model đọc được) ==\n  get_order SV-4821  -> isError=False, structuredContent.status=delivered\n  get_order SV-48211 -> isError=True, text: Error executing tool get_order: Không có đơn SV-48211. Mã đơn ShopViet có dạng SV + 4 chữ số.\n\n== Cái gì thật sự vào context của model (host kịch bản: đưa cả 4 tool, model 'chọn' get_order) ==\nRequest tới API model               Token tool def  Tổng token  Phần còn lại\n----------------------------------  --------------  ----------  ------------\nrequest 1 (câu của khách)           354             401         47\nrequest 2 (+tool_use +tool_result)  354             555         201\n  Resource chính sách nếu host đính kèm: +122 token; prompt /tom_tat_khieu_nai: +57 token\n  Toàn bộ JSON-RPC trên dây ~2398 token-tương-đương; model không đọc trực tiếp phần nào trong đó.\n\nRút ra: SDK 2.3.0 tự thương lượng 2026-07-28 (server/discover rồi gọi thẳng, không initialize, không session); mode legacy vẫn chạy 2025-11-25. Tool definition chiếm 88% request đầu tới model trước khi khách được trả lời; lỗi mã đơn đi về dưới dạng isError=true kèm câu model đọc được.",
      measured: true,
      read: ["Bảng dây stdio: <code>Client(mode='auto')</code> của SDK 2.3.0 gửi <code>server/discover</code> rồi gọi thẳng, không <code>initialize</code>, không session; version thương lượng là <b>2026-07-28</b>. Mỗi request mang <code>_meta</code> nên tổng byte trên dây (8.949) lớn hơn mode legacy 2025-11-25 (6.645).", "Lỗi mã đơn SV-48211 đi về là <code>isError: true</code> kèm câu model đọc được, có tiền tố SDK tự thêm <code>Error executing tool get_order:</code>.", "Bảng context: 4 tool definition = 354/401 token (88%) của request đầu tới model; toàn bộ ~2.398 token-tương-đương JSON-RPC trên dây không vào context. Resource chính sách chỉ vào khi host đính (+122 token)."]
    },
    mount(stage) {
      const st = { scen: 'tool', ver: V26, discover: true, extra: 0, sel: 1 };
      let steps = [];
      const sScen = select('Kịch bản', Object.entries(SCEN).map(([k, v]) => [k, v.label]), 'tool', (v) => { st.scen = v; recompute(true); });
      const sVer = select('Đặc tả', [[V26, V26 + ' (hiện hành)'], [V25, V25 + ' (có session)']], V26, (v) => { st.ver = v; recompute(true); });
      const bDisc = el('button', { onclick: () => { st.discover = !st.discover; recompute(true); } });
      const sExtra = slider('Tool của server khác', 0, 80, 1, 0, (v) => { st.extra = v; recompute(false); });
      const sSel = slider('Bước', 1, 30, 1, 1, (v) => { st.sel = v; draw(); });
      const setSel = (v) => { st.sel = Math.max(1, Math.min(steps.length, v)); sSel.input.value = st.sel; sSel.node.querySelector('output').textContent = st.sel; draw(); };
      const prev = el('button', { text: '◀', 'aria-label': 'Bước trước', onclick: () => setSel(st.sel - 1) });
      const next = el('button', { text: '▶', 'aria-label': 'Bước sau', onclick: () => setSel(st.sel + 1) });
      const seq = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Các message giữa model, host, client và server' });
      const who = el('div', { class: 'stat' }), json = el('div'), cap = el('div', { style: 'margin-top:8px;font-size:13.5px' });
      const chart = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Token input của từng request tới model' }), stat = el('div', { class: 'stat' });
      const W = 660, X = { model: 80, host: 250, client: 420, server: 590 }, ROW = 24, TOP = 42;

      function recompute(jump) {
        steps = build(st);
        sSel.input.setAttribute('max', steps.length);
        bDisc.className = st.discover ? 'on' : '';
        bDisc.textContent = 'Gọi server/discover trước: ' + (st.discover ? 'có' : 'không');
        bDisc.style.display = st.ver === V26 ? '' : 'none';
        setSel(jump ? 1 : Math.min(st.sel, steps.length));
      }
      const color = (s) => s.kind === 'llm' ? 'var(--g1)' : s.kind === 'llmres' ? (s.final ? 'var(--ok)' : 'var(--g4)') : s.kind === 'user' || s.kind === 'decide' ? 'var(--mute)'
        : s.kind === 'rpcres' && s.toolCall && st.scen === 'protoerr' ? 'var(--bad)' : s.kind === 'rpcres' && s.toolCall && st.scen === 'bizerr' ? 'var(--warn)' : 'var(--g3)';
      const ctxAdd = (s) => {
        if (s.kind === 'llm') return s.n === 1 ? s.tk.total : s.tk.total - steps.find((x) => x.kind === 'llm').tk.total;

      function drawSeq() {

        Object.entries(X).forEach(([k, x]) => kids.push(

          el('line', { x1: x, x2: x, y1: 30, y2: H, stroke: 'var(--line)', 'stroke-dasharray': '4 4' })));
        steps.forEach((s, i) => {
          const y = TOP + i * ROW + ROW / 2, cur = i + 1 === st.sel, c = color(s);
          if (cur) kids.push(el('rect', { x: 0, y: y - ROW / 2 + 1, width: W, height: ROW - 2, fill: 'var(--accent-soft)', rx: 4 }));
          if (s.from === s.to) {
            const x = X[s.from];
            kids.push(el('path', { d: `M${x} ${y - 2} h 18 v 8 h -18`, fill: 'none', stroke: c, 'stroke-width': cur ? 2.4 : 1.6 }),

          } else {
            const x1 = X[s.from], x2 = X[s.to], dir = x2 > x1 ? 1 : -1;
            kids.push(el('line', { x1, x2: x2 - dir * 6, y1: y + 4, y2: y + 4, stroke: c, 'stroke-width': cur ? 2.6 : 1.8 }),
              el('polygon', { points: `${x2},${y + 4} ${x2 - dir * 8},${y} ${x2 - dir * 8},${y + 8}`, fill: c }),
              el('text', { x: (x1 + x2) / 2, y: y - 1, 'text-anchor': 'middle', style: 'font-size:11px', fill: c, text: s.title }));
          }
          kids.push(el('text', { x: 2, y: y + 4, class: 'mute', style: 'font-size:10px', text: String(i + 1) }));
          kids.push(el('rect', { x: 0, y: y - ROW / 2, width: W, height: ROW, fill: 'transparent', style: 'cursor:pointer', onclick: () => setSel(i + 1) }, [el('title', { text: 'Bước ' + (i + 1) })]));
        });
        seq.replaceChildren(...kids);
      }

      function drawChart() {
        const reqs = steps.filter((s) => s.kind === 'llm'), H = 150, PAD = 44, bw = 120, kids = [];
        const max = Math.max(...reqs.map((r) => r.tk.total)), cur = steps[st.sel - 1];
        chart.setAttribute('viewBox', `0 0 ${W} ${H + 34}`);
        const y = (v) => H - (v / max) * (H - 18);
        reqs.forEach((r, i) => {
          const x = PAD + i * (bw + 40) + 3, w = bw;
          let acc = 0;
          [['var(--g1)', r.tk.tools, 'tool ShopViet'], ['var(--g2)', r.tk.extra, 'tool server khác'], ['var(--g4)', r.tk.sys, 'system'], ['var(--accent)', r.tk.att, 'resource / prompt'], ['var(--dim)', r.tk.msg, 'messages']].forEach(([c, v, t]) => {
            if (!v) return;
            kids.push(el('rect', { x, y: y(acc + v), width: w, height: Math.max(0.5, y(acc) - y(acc + v)), fill: c }, [el('title', { text: `${t}: ${fT(v)} token` })]));
            acc += v;

          const isCur = cur === r;
          kids.push(el('text', { x: x + w / 2, y: y(acc) - 4, 'text-anchor': 'middle', style: 'font-size:11px', text: '~' + fT(r.tk.total) }),

        kids.push(el('line', { x1: PAD, x2: W, y1: H, y2: H, stroke: 'var(--line)' }), el('text', { x: 0, y: H, class: 'mute', text: '0' }), el('text', { x: 0, y: 14, class: 'mute', text: fT(max) }),

          el('text', { x: PAD, y: H + 30, class: 'mute', text: 'token input ước lượng mỗi request tới model' }));

      function caption(s) {

          if (s.method === 'server/discover' && s.kind === 'rpc') p.push(box('var(--g3)', '<b>Không có bắt tay bắt buộc.</b> <code>server/discover</code> là tuỳ chọn (MAY); request này đã tự mang version và capability trong <code>_meta</code>. Tắt nút "Gọi server/discover" để thấy luồng vẫn chạy.'));
          if (s.method === 'initialize' && s.session) p.push(box('var(--warn)', '<b>Server cấp <code>Mcp-Session-Id</code>.</b> Từ giờ mọi request phải mang header này, và server phải nhớ session. Chạy nhiều instance thì load balancer cần sticky session hoặc session store chung (README §1.3). Bản 2026-07-28 bỏ hẳn bước này; lab 02 cho thấy chuyện gì xảy ra khi instance restart.'));
          if (s.method === 'notifications/initialized' && s.kind === 'rpc') p.push(box('var(--g3)', 'Notification không có <code>id</code>, nên không có response JSON-RPC; server trả <code>202 Accepted</code> không body.'));
          if (s.toolsList && s.kind === 'rpcres') p.push(box('var(--g3)', `<b>Danh sách tool về tới client, chưa vào context.</b> Host sẽ chuyển mỗi tool sang <code>{name, description, input_schema}</code>: ~${fT(TOOLS_T)} token vào context ở <i>mọi</i> request tới model. <code>title</code>, <code>annotations</code> ở lại host.` + (st.ver === V26 ? ' <code>ttlMs: 600000</code> (giá trị lab chọn) cho host dùng lại danh sách 10 phút.' : '')));
          if (s.resRead) p.push(box('var(--accent)', `<b>App quyết định đọc chính sách</b>, vì code của app thấy chữ "đổi" trong câu khách. Model chưa chạy, không thể tự gọi resource. ~${fT(est(POLICY))} token chính sách sẽ vào context ngay request 1, gấp ${(est(POLICY) / est(SCEN.resource.q)).toFixed(1).replace('.', ',')} lần câu hỏi. <span style="color:var(--warn)">Chỉ chạy được vì chính app ShopViet là client.</span> Qua MCP connector của Claude API hay remote MCP của OpenAI, Gemini, Grok, resource không được nhập (README §1.2, §2.6).`));
          if (s.promptGet) p.push(box('var(--accent)', '<b>Người dùng chọn prompt</b> từ menu slash command. Server trả <code>messages</code> đã điền <code>SV-4821</code>; host dùng nó làm tin nhắn đầu. Prompt không tự chạy và model không gọi được nó.'));
          if (s.toolCall && s.kind === 'rpc') p.push(box('var(--g3)', '<b>Client gửi <code>tools/call</code></b> với tham số chính là <code>input</code> model sinh ra. ' + (st.ver === V26 ? 'Header <code>Mcp-Method</code>, <code>Mcp-Name</code> phải khớp body, lệch thì <code>400</code> mã <code>-32020</code> (README §1.4).' : 'Request phải mang <code>Mcp-Session-Id</code>; instance không biết session này thì từ chối.')));
          if (s.toolCall && s.kind === 'rpcres') {

            else if (st.scen === 'bizerr') p.push(box('var(--warn)', '<b>Tool execution error</b>: result bình thường, <code>isError: true</code>, text nói rõ mã đơn có dạng gì. Tiền tố "Error executing tool" do Python SDK tự thêm (README §1.2).'));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
