const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

        a: `<p>Trong <b>handle</b>: <code>create_basket</code> trả về <code>basket_id</code>, model truyền lại mã đó ở <code>add_to_basket</code>, <code>get_basket</code>. Server lưu giỏ trong store chung, khoá bằng handle (README §1.3, §3.3). Đặc tả có bốn hướng dẫn: handle là <b>tên</b>, không phải <b>quyền</b> (mỗi lần gọi phải kiểm người gọi có quyền); không mang cấu trúc đoán được; ghi thời hạn trong description của tool tạo ra nó; hết hạn hoặc không tồn tại thì trả tool execution error để model tạo cái mới.</p>
<p>Với server nhiều tenant, lưu <code>&lt;user_id&gt;:&lt;handle&gt;</code> và kiểm ở mỗi lần gọi. Thử: khách B có được <code>basket_id</code> của khách A (qua một đoạn chat bị lộ, hoặc model nhầm).</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          const s = select('Store khoá theo', [['handle', 'chỉ handle'], ['user', '<user_id>:<handle>']], 'handle', (v) => draw(v));
          function draw(v) {
            const store = { 'u_A:bk_7f3a9c2e': { owner: 'u_A', items: ['PROX-DEN'] } };
            const key = v === 'user' ? 'u_B:bk_7f3a9c2e' : 'bk_7f3a9c2e';
            const hit = v === 'user' ? store[key] : Object.entries(store).find(([k]) => k.endsWith(':' + key));
            const res = hit ? { content: [{ type: 'text', text: '{"basket_id": "bk_7f3a9c2e", "items": ["PROX-DEN"], "owner": "u_A"}' }], isError: false } : { content: [{ type: 'text', text: 'Không có giỏ bk_7f3a9c2e cho tài khoản này. Tạo giỏ mới bằng create_basket.' }], isError: true };
            out.replaceChildren(pre('token của: u_B\ntools/call get_basket {"basket_id": "bk_7f3a9c2e"}\nstore tra khoá: "' + key + '"\n→ ' + J(res)));
            cap.innerHTML = hit ? '<b class="bad">Khách B đọc được giỏ của khách A.</b> Vì sao: store chỉ tra theo handle, coi handle là quyền. Không có nghĩa handle phải bí mật tuyệt đối: với server có xác thực, handle chỉ là tên. Trong hệ thống thật: khoá theo người dùng lấy từ token; hướng dẫn bảo mật gọi lỗi này là chiếm handle trạng thái (README §3.3).'
              : '<b class="ok">Từ chối bằng tool execution error.</b> Khách B nhận thông báo model đọc được, không biết giỏ đó có tồn tại hay không.';
          }
          vb.append(el('div', { class: 'row' }, [s.node]), out, cap); draw('handle');
        },
        take: 'Bỏ session không bỏ trạng thái. Trạng thái chuyển vào handle, và quyền vẫn kiểm theo người dùng ở mỗi lần gọi.'
      },
      {
        q: 'refund_order muốn hỏi khách lý do trước khi hoàn. Server không gửi request ngược được nữa thì hỏi bằng cách nào?',
        a: `<p>Bằng MRTR (README §1.3). Server trả result <code>resultType: "input_required"</code>, trong đó <code>inputRequests</code> chứa một <code>elicitation/create</code> (form hỏi lý do) và <code>requestState</code> (trạng thái server cần để làm tiếp). Client hỏi người dùng rồi gửi lại <b>cùng tool call với id mới</b> (MUST khác id cũ), kèm <code>inputResponses</code> và <code>requestState</code> nguyên văn. Server không nhớ gì giữa hai lượt.</p>
<p>Vì <code>requestState</code> đi qua client, server phải coi nó là input không tin cậy: ký hoặc mã hoá nếu nó chứa thứ client không được sửa. Chọn cách client gửi lượt hai:</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { mode: 'ok', sign: true };
          const s1 = select('Lượt 2 client', [['ok', 'gửi đúng: id mới, requestState nguyên văn'], ['sameid', 'dùng lại id 2'], ['tamper', 'sửa requestState (amount 2.490.000 → 24.900.000)']], 'ok', (v) => { st.mode = v; draw(); });
          const b = el('button', { onclick: () => { st.sign = !st.sign; draw(); } });
          function draw() {
            b.className = st.sign ? 'on' : ''; b.textContent = 'Server ký requestState: ' + (st.sign ? 'có' : 'không');
            const stateObj = { order_id: 'SV-4821', amount_vnd: 2490000 }, enc = btoa(J(stateObj)).slice(0, 28) + '…';
            const r1 = { jsonrpc: '2.0', id: 2, result: { resultType: 'input_required', inputRequests: { reason: { method: 'elicitation/create', params: { mode: 'form', message: 'Lý do hoàn tiền đơn SV-4821?', requestedSchema: { type: 'object', properties: { reason: { type: 'string' } }, required: ['reason'] } } } }, requestState: enc + (st.sign ? '.sig' : '') } };
            const id2 = st.mode === 'sameid' ? 2 : 3;
            const used = st.mode === 'tamper' ? { order_id: 'SV-4821', amount_vnd: 24900000 } : stateObj;
            const r2 = { jsonrpc: '2.0', id: id2, method: 'tools/call', params: { name: 'refund_order', arguments: { order_id: 'SV-4821' }, inputResponses: { reason: { action: 'accept', content: { reason: 'Tai nghe rè một bên' } } }, requestState: st.mode === 'tamper' ? btoa(J(used)).slice(0, 28) + '…' + (st.sign ? '.sig' : '') : r1.result.requestState } };
            let res, html;
            if (st.mode === 'sameid') { res = 'id 2 đã dùng cho lượt 1 → vi phạm đặc tả (MUST khác id cũ)'; html = '<b class="bad">Trùng id.</b> Vì sao sai: lượt 2 là một request mới; id trùng làm client không phân biệt được response nào của lượt nào. Không có nghĩa phải mở kết nối mới. Trong hệ thống thật: mỗi lần gửi lại (MRTR hay sau khi stream đứt) đều lấy id mới.'; }
            else if (st.mode === 'tamper' && st.sign) { res = '{"resultType": "complete", "isError": true, "content": [{"type": "text", "text": "requestState không hợp lệ, hãy gọi lại refund_order từ đầu."}]}'; html = '<b class="ok">Chữ ký không khớp, server từ chối.</b> Số tiền vẫn do server quyết định.'; }
            else if (st.mode === 'tamper') { res = '{"resultType": "complete", "content": [{"type": "text", "text": "Đã hoàn 24.900.000 đồng cho đơn SV-4821."}]}'; html = '<b class="bad">Hoàn gấp 10 lần giá đơn.</b> Vì sao: server tin requestState đi vòng qua client như dữ liệu của chính nó. Không có nghĩa MRTR không an toàn: stateless không có nghĩa là tin client. Trong hệ thống thật: ký hoặc mã hoá requestState, và luật nghiệp vụ (số tiền bằng tổng đơn) vẫn kiểm lại trong code (README §1.3).'; }
            else { res = '{"resultType": "complete", "content": [{"type": "text", "text": "Đã hoàn 2.490.000 đồng cho đơn SV-4821."}]}'; html = '<b class="ok">Hai lượt, server không nhớ gì ở giữa.</b> Mọi thứ cần thiết nằm trong requestState và inputResponses của lượt 2.'; }
            out.replaceChildren(pre('server → client (lượt 1):\n' + JSON.stringify(r1, null, 2) + '\n\nclient → server (lượt 2):\n' + JSON.stringify(r2, null, 2) + '\n\nserver: ' + res));
            cap.innerHTML = html;
          }
          vb.append(el('div', { class: 'row' }, [s1.node, b]), out, cap); draw();
        },
        take: 'MRTR thay kênh ngược bằng hai request do client khởi đầu. Trạng thái đi vòng qua client nên phải được ký.'
      },
      {
        q: 'Stream đứt giữa refund_order. Bản 2025 còn resume được, sao bản 2026 bỏ?',
        a: `<p>Resume cần server lưu các event đã gửi theo stream để client nối lại bằng <code>Last-Event-ID</code>; đó lại là trạng thái gắn với một instance. Bản 2026-07-28 bỏ <code>Last-Event-ID</code>: stream đứt thì request đang chạy mất, client MUST gửi lại với id mới. Đóng response stream cũng là cancellation: server không được gửi thêm gì cho request đó (README §1.4).</p>
<p>Hệ quả: tool có tác dụng phụ càng phải idempotent. Trong hình chính, chọn transport 2026, sự cố "Mạng đứt giữa request 6", rồi tắt "refund_order idempotent": hoàn tiền chạy hai lần. Trường hợp ngược cũng có: tool bị huỷ nhưng vẫn ghi dữ liệu vì server không dừng khi stream đóng (README §3.6). Việc chạy lâu (vài phút) nên chuyển sang extension Tasks thay vì giữ một request mở (README §2.4).</p>`,
        take: 'Không có resume nghĩa là mọi tool ghi phải chịu được việc bị gọi lại. Idempotency key là yêu cầu, không phải tối ưu.'
      },
      {
        q: 'Server stdio của công cụ kiểm kê chạy được trên máy dev, lên máy nhân viên thì client ngắt ngay. Vì sao?',
        a: `<p>stdio dùng stdout làm kênh giao thức: mỗi dòng là một JSON-RPC message. README §1.4, §3.6 cảnh báo: một dòng <code>print("debug ...")</code> chen vào là client đọc phải một dòng không phải JSON và ngắt kết nối với lỗi khó hiểu. Log phải ra stderr. Hình dưới là một client đọc <b>nghiêm</b> (dòng nào không parse được là ngắt) đúng như README mô tả. Bật dòng debug:</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          const b = el('button', { onclick: () => draw(!on) });
          let on = false;
          function draw(v) {
            on = v; b.className = on ? 'on' : ''; b.textContent = 'Server in "loaded 1200 SKUs" ra stdout: ' + (on ? 'có' : 'không');
            const lines = [J({ jsonrpc: '2.0', id: 1, result: { resultType: 'complete', tools: [{ name: 'check_stock' }, { name: 'doc_file_kiem_ke' }] } })];
            if (on) lines.push('loaded 1200 SKUs from kiem-ke-2026-11.csv');
            lines.push(J({ jsonrpc: '2.0', id: 2, result: { resultType: 'complete', content: [{ type: 'text', text: 'PROX-DEN: sổ 14, thực tế 12' }], isError: false } }));
            const rows = []; let broke = -1;
            lines.forEach((l, i) => { if (broke >= 0) { rows.push([String(i + 1), '<span class="mute">không đọc tới</span>']); return; } try { const m = JSON.parse(l); rows.push([String(i + 1), `<span class="ok">JSON-RPC id ${m.id}</span>`]); } catch (e) { broke = i; rows.push([String(i + 1), `<b class="bad">parse lỗi: "${l.slice(0, 30)}…"</b>`]); } });
            out.replaceChildren(pre(lines.join('\n')), tbl(['Dòng stdout', 'Client đọc'], rows));
            cap.innerHTML = broke >= 0 ? '<b class="bad">Client nghiêm ngắt ở dòng ' + (broke + 1) + '</b>, kết quả kiểm kê phía sau không bao giờ tới. Không có nghĩa logic server sai: dev chạy server tay trong terminal thì dòng log trông vô hại. Trong hệ thống thật: mọi log ra stderr; thư viện in banner ra stdout cũng gây lỗi này.' : '<b class="ok">Mọi dòng là JSON-RPC.</b> Log đi stderr, client không thấy.';
          }
          const sdkNote = el('div', { class: 'cap', style: 'border-left:3px solid var(--warn)', html: '<p style="margin:0 0 4px"><b>Đo thật với SDK mcp 2.3.0 thì khác (POC lab 7):</b> server SDK có <code>print()</code> và cả <code>os.write(1, …)</code> trong tool: host vẫn nhận đủ kết quả trong 0,4 s. Server tự viết in một dòng <code>debug</code> riêng: cũng không sao.</p><p style="margin:0 0 4px"><b>Vì sao:</b> server SDK chuyển fd 1 (stdout) sang stderr ngay khi <code>mcp.run()</code> khởi động, nên chữ in ra không lên dây. Client SDK bỏ qua dòng không phải JSON thay vì ngắt.</p><p style="margin:0 0 4px"><b>Không có nghĩa là:</b> stdout an toàn. Vẫn hỏng thật ở ba chỗ: banner <code>print(..., end=\'\')</code> không xuống dòng <i>trước</i> <code>mcp.run()</code> dính vào response đầu, kết nối mất 10 s; server tự viết in <code>end=\'\'</code> dính vào response thì request timeout; log in ra một chuỗi trông như JSON-RPC cùng id thì <b>đè</b> kết quả thật.</p><p style="margin:0"><b>Trong hệ thống thật:</b> vẫn log ra stderr; client khác (không phải Python SDK) có thể đọc nghiêm như hình trên.</p>' });
          vb.append(el('div', { class: 'row' }, [b]), out, cap, sdkNote); draw(false);
        },
        take: 'Với stdio, stdout là dây giao thức. Không được có chữ nào khác trên đó.'
      },
      {
        q: 'Streamable HTTP bắt gửi header Mcp-Method, Mcp-Name trùng với body. Thừa vậy để làm gì?',
        a: `<p>Để gateway, load balancer, rate limiter định tuyến mà không phải parse body JSON (README §1.4). ShopViet có thể đặt rate limit riêng cho <code>refund_order</code> ở gateway chỉ bằng header. Cái giá: header phải khớp body, lệch thì server trả <code>400</code> mã <code>-32020</code> (HeaderMismatch). Thử:</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          const s = select('Header Mcp-Name', [['refund_order', 'refund_order (khớp body)'], ['get_order', 'get_order (lệch)'], ['', '(bỏ header)']], 'refund_order', (v) => draw(v));
          function draw(v) {
            const ok = v === 'refund_order';
            out.replaceChildren(pre('POST /mcp\nMcp-Method: tools/call\n' + (v ? 'Mcp-Name: ' + v + '\n' : '') + 'body: {"method": "tools/call", "params": {"name": "refund_order", ...}}\n\n→ ' + (ok ? '200, server xử lý' : '400 ' + J({ jsonrpc: '2.0', id: 3, error: { code: -32020, message: "mcp-name header does not match the request body's 'name' parameter" } }))));
            cap.innerHTML = ok ? 'Gateway thấy <code>refund_order</code> ngay ở header và áp rate limit riêng.' : '<b class="bad">400, -32020.</b> Vì sao server chặn: nếu chấp nhận header lệch, gateway có thể cho qua "get_order" trong khi body là refund_order, rate limit thành vô nghĩa. Không có nghĩa phải tự ghép header: SDK client làm việc này. Trong hệ thống thật: lỗi này hay gặp khi tự viết client bằng curl hoặc proxy sửa body (README §3.6).';
          }
          vb.append(el('div', { class: 'row' }, [s.node]), out, cap); draw('refund_order');
        },
        take: 'Header là bản sao của body cho hạ tầng đọc. Hai bản phải khớp, nếu không thì kiểm soát ở gateway bị vượt qua.'
      },
      {
        q: 'Nhân viên kho muốn server kiểm kê chạy HTTP trên laptop cho tiện. Có gì nguy hiểm?',
        a: `<p>Server HTTP local nghe trên một cổng. Một trang web độc hại mở trong trình duyệt của nhân viên có thể gửi request tới cổng đó (DNS rebinding). Vì vậy đặc tả: server MUST kiểm <code>Origin</code>, sai trả <code>403</code>; server local SHOULD chỉ bind <code>127.0.0.1</code>. Python SDK khi không cấu hình còn tự chỉ nhận host <code>127.0.0.1</code>, <code>localhost</code>, <code>[::1]</code>; host khác trả <code>421 Misdirected Request</code> (README §1.4).</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { o: 'none', h: 'local' };
          const s1 = select('Origin', [['none', '(không có, client CLI)'], ['evil', 'https://evil.example']], 'none', (v) => { st.o = v; draw(); });

            cap.innerHTML = code === 403 ? '<b class="ok">403: trang lạ không gọi được server trên máy.</b> Đây là MUST của đặc tả.' : code === 421 ? '<b style="color:var(--warn)">421 dù request hợp lệ.</b> Vì sao: SDK mặc định chỉ nhận host localhost. Không có nghĩa nên tắt chống DNS rebinding cho "chạy được". Trong hệ thống thật: deploy sau domain thật thì khai <code>allowed_hosts</code>, <code>allowed_origins</code> (README §3.3).' : '<b class="ok">200.</b> Client CLI trên chính máy, host localhost.';

      },
      {
        q: 'Vậy ShopViet nên dùng MCP ở đâu, function calling ở đâu? Còn A2A là gì?',
        a: `<p>MCP không thay function calling. Host lấy tool từ MCP server rồi đưa vào model bằng chính function calling; mọi vấn đề của tool use vẫn còn, cộng thêm một vấn đề: tool definition do bên khác viết (README §1.5). Có ba cách dùng MCP:</p>
<ol><li><b>Host là client</b>: Claude Code, Claude Desktop, IDE. Người dùng cấu hình server, host lo vòng lặp. Công cụ kiểm kê dùng cách này.</li>
<li><b>App của bạn là client</b>: dùng MCP SDK, tự chuyển tool sang định dạng model, tự chạy vòng lặp, toàn quyền lọc, duyệt, log. Trợ lý web của ShopViet.</li>
<li><b>Provider là client</b>: khai URL server trong request API, provider gọi server từ hạ tầng của họ. Ít code nhất, nhưng server phải public và dữ liệu đi qua provider. Đối tác dùng cách này.</li></ol>
<p>Tra cứu nhanh của README: một app, vài tool gọi hệ thống của chính mình thì function calling trực tiếp (ít lớp, ít bề mặt tấn công, debug trong một process). Nhiều app hoặc nhiều đội cần cùng hệ thống, hoặc muốn người dùng gọi từ Claude, ChatGPT, IDE của họ thì MCP. <b>A2A</b> là giao thức khác, cho agent nói chuyện với agent (gửi task, nhận artifact); agent nhận task qua A2A có thể dùng MCP bên trong.</p>`,
        take: 'MCP đáng tiền khi có người dùng lại. Một app gọi hệ thống của chính mình thì nó chỉ thêm một lớp.'
      }
    ],
    poc: {
      goal: "Hai instance Streamable HTTP thật (A, B trên 127.0.0.1) để so session kiểu 2025 với request stateless kiểu 2026, thử từng quy tắc header bằng httpx, rồi gửi lại <code>refund_order</code> sau khi 'stream đứt' xem khách được hoàn mấy lần. Cuối cùng đo cùng một <code>get_order</code> gọi trực tiếp, qua stdio và qua HTTP. <b>Không gọi model</b>: host là kịch bản viết tay; server, HTTP và các lần chi tiền ghi sổ là thật.",

        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
