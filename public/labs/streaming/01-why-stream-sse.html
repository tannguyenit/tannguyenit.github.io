const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  function specParse(chunks) {
    const dec = new TextDecoder('utf-8');
    let buf = '', data = '', type = '', lastId = '', retry = null, ci = 0;
    const out = [], comments = [];
    const line = (l) => {
      if (l === '') {
        if (data === '') { type = ''; return; }
        out.push({ type: type || 'message', data: data.endsWith('\n') ? data.slice(0, -1) : data, id: lastId, chunk: ci });
        data = ''; type = '';
        return;
      }
      if (l[0] === ':') { comments.push({ text: l.slice(1), chunk: ci }); return; }
      const p = l.indexOf(':');
      let f = l, v = '';
      if (p >= 0) { f = l.slice(0, p); v = l.slice(p + 1); if (v[0] === ' ') v = v.slice(1); }
      if (f === 'event') type = v;
      else if (f === 'data') data += v + '\n';
      else if (f === 'id') { if (!v.includes('\0')) lastId = v; }
      else if (f === 'retry') { if (/^\d+$/.test(v)) retry = +v; }
    };
    const feed = (s, final) => {
      buf += s;
      let i = 0, start = 0;
      while (i < buf.length) {
        const c = buf[i];
        if (c === '\n') { line(buf.slice(start, i)); start = i + 1; }
        else if (c === '\r') {
          if (i + 1 === buf.length && !final) break;
          line(buf.slice(start, i));
          if (buf[i + 1] === '\n') i++;
          start = i + 1;
        }
        i++;
      }
      buf = buf.slice(start);
    };
    chunks.forEach((c, k) => { ci = k; feed(dec.decode(c, { stream: true }), false); });
    ci = Math.max(0, chunks.length - 1);
    feed(dec.decode(), true);
    return { out, comments, retry, lastId, pending: data };
  }

  function naiveParse(chunks) {
    let buf = '';
    const out = [];
    const take = (part, k) => {
      let type = 'message';
      part.split('\n').forEach((l) => { if (l.startsWith('event: ')) type = l.slice(7); });
      part.split('\n').filter((l) => l.startsWith('data: ')).forEach((l) => out.push({ type, data: l.slice(6), chunk: k }));
    };
    chunks.forEach((c, k) => {
      buf += new TextDecoder().decode(c);
      const parts = buf.split('\n\n');
      buf = parts.pop();
      parts.forEach((p) => take(p, k));
    });
    if (buf.trim()) take(buf, Math.max(0, chunks.length - 1));
    return out;
  }

  function cutPoints(bytes, mode, n, seed) {
    const cuts = [];
    if (mode === 'fixed') for (let i = n; i < bytes.length; i += n) cuts.push(i);
    else if (mode === 'rand') { const rnd = seeded(seed); for (let i = 1 + Math.floor(rnd() * n); i < bytes.length; i += 1 + Math.floor(rnd() * n)) cuts.push(i); }
    else {
      const s = new TextDecoder().decode(bytes);

      cuts.push(at('Dạ có', 2), at('Tai nghe', 0), at('giờ.', 3));

      if (cr > 0) cuts.push(cr + 1);
    }
    return [...new Set(cuts)].filter((c) => c > 0 && c < bytes.length).sort((a, b) => a - b);
  }

  function splitAt(bytes, cuts) {
    const ch = [];
    let s = 0;
    cuts.concat(bytes.length).forEach((c) => { ch.push(bytes.slice(s, c)); s = c; });
    return ch;
  }

    const n = Math.max(spec.length, naive.length);
    let mismatch = 0;
    for (let i = 0; i < n; i++) { const a = spec[i], b = naive[i]; if (!a || !b || a.type !== b.type || a.data !== b.data) mismatch++; }

    mount(stage) {
      const st = { eol: 'lf', mode: 'utf8', n: 16, seed: 7, trunc: false };

      const stats = el('div', { class: 'stat' }), tables = el('div', { class: 'cols', style: 'margin-top:10px' }), flags = el('div', { style: 'margin-top:10px;font-size:13.5px' });
      const nSl = slider('Kích thước tối đa', 1, 64, 1, st.n, (v) => { st.n = v; draw(); }, (v) => v + ' byte');

      const eolSel = select('Xuống dòng', [['lf', 'LF (\\n)'], ['crlf', 'CRLF (\\r\\n)'], ['cr', 'CR (\\r)']], st.eol, (v) => { st.eol = v; draw(); });

      const reseed = el('button', { text: 'Cắt lại', onclick: () => { st.seed++; draw(); } });

      const evTable = (title, evs, ref) => {

          const o = ref && ref[i], bad = ref && (!o || o.type !== e.type || o.data !== e.data);
          const j = isJSONish(e.data) ? (jsonOk(e.data) ? '<span class="ok">JSON ok</span>' : '<b class="bad">JSON lỗi</b>') : '';
          return `<tr style="${bad ? 'background:color-mix(in srgb, var(--bad) 14%, transparent)' : ''}"><td class="mono">${i + 1}</td><td class="mono">${show(e.type)}</td><td class="mono" style="word-break:break-all">${show(e.data)} ${j}</td><td class="mono">#${e.chunk + 1}</td></tr>`;
        }).join('');
        return el('div', {}, [el('h4', { html: title }), el('div', { class: 'tbl', style: 'overflow-x:auto' }, [el('table', { style: 'border-collapse:collapse;font-size:12px;width:100%', html: '<tr><th>#</th><th>event</th><th>data</th><th>chunk</th></tr>' + (rows || '<tr><td colspan="4" class="hint">(không có event)</td></tr>') })])]);
      };

      function draw() {
        nSl.node.style.display = st.mode === 'fixed' || st.mode === 'rand' ? '' : 'none';

        const text = buildText(EOL[st.eol], st.trunc), bytes = enc.encode(text);

        const chunks = splitAt(bytes, cuts);
        const midChar = cuts.filter((c) => (bytes[c] & 0xc0) === 0x80).length;
        const midLine = cuts.filter((c) => bytes[c - 1] !== 10 && !(bytes[c - 1] === 13 && st.eol === 'cr')).length;
        const midCRLF = cuts.filter((c) => bytes[c - 1] === 13 && bytes[c] === 10).length;

        const MAXC = 48;
        chunkBox.replaceChildren(...chunks.slice(0, MAXC).map((c, i) => {
          const parts = [];
          let j = 0;
          while (j < c.length) {
            const b = c[j];
            const len = b < 0x80 ? 1 : b >= 0xf0 ? 4 : b >= 0xe0 ? 3 : b >= 0xc0 ? 2 : 0;
            if (len === 0 || j + len > c.length) { parts.push(`<span style="color:var(--warn);font-weight:700">${b.toString(16).toUpperCase()}</span>`); j++; continue; }

        }), ...(chunks.length > MAXC ? [el('div', { class: 'hint', text: `... và ${chunks.length - MAXC} chunk nữa` })] : []));

        const fffd = naive.filter((e) => e.data.includes('�') || e.type.includes('�')).length;
        const jbad = naive.filter((e) => isJSONish(e.data) && !jsonOk(e.data)).length;

        stats.innerHTML = `<span>Byte: <b>${bytes.length}</b></span><span>Chunk: <b>${chunks.length}</b></span><span>Cắt giữa chữ nhiều byte: <b class="${midChar ? 'bad' : ''}">${midChar}</b></span><span>Cắt giữa dòng: <b>${midLine}</b></span><span>Cắt giữa CR và LF: <b>${midCRLF}</b></span><span>Event (đặc tả / hướng dẫn): <b>${spec.out.length} / ${naive.length}</b></span><span>Event khác nhau: <b class="${mism ? 'bad' : 'ok'}">${mism}</b></span>`;
        tables.replaceChildren(evTable(`Parser theo đặc tả <small>retry = ${spec.retry ?? '—'}, last id = ${esc(spec.lastId || '—')}, comment: ${spec.comments.length}</small>`, spec.out),

        const P = [], box = (c, h) => `<div style="border-left:3px solid ${c};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${h}</div>`;
        if (fffd) P.push(box('var(--bad)', `<b>${fffd} event của parser kiểu hướng dẫn chứa ký tự lỗi �.</b> Vì sao: ${midChar} điểm cắt rơi giữa các byte của một chữ có dấu; mỗi chunk được giải mã bằng một TextDecoder mới nên byte dở dang bị thay bằng U+FFFD. Không có nghĩa server gửi sai: parser bên trái nhận đúng cùng chuỗi byte. Trong hệ thống thật: một TextDecoder cho cả stream, gọi <code>decode(chunk, {stream: true})</code>.`));
        if (jbad) P.push(box('var(--bad)', `<b>${jbad} event có data bắt đầu bằng { nhưng JSON.parse lỗi.</b> Vì sao: ${st.eol !== 'lf' ? 'không tách được event theo "\\n\\n" nên data bị gộp hoặc dính ký tự xuống dòng khác' : fffd ? 'ký tự lỗi hoặc dòng bị cắt' : 'event dở dang bị phát ra khi stream đóng'}. Trong hệ thống thật: frontend sẽ ném exception giữa câu trả lời, hoặc tệ hơn, bỏ qua lặng lẽ một mảnh chữ.`));
        if (st.eol !== 'lf' && naiveAtEnd) P.push(box('var(--warn)', `<b>Parser kiểu hướng dẫn không phát event nào cho tới chunk cuối.</b> Vì sao: với ${st.eol === 'crlf' ? 'CRLF, dòng trống là \\r\\n\\r\\n' : 'CR, dòng trống là \\r\\r'}, không bao giờ chứa "\\n\\n". Mọi thứ nằm trong buffer tới khi stream đóng. Không có nghĩa mạng chậm: chữ đã tới trình duyệt, chỉ parser chưa nhận ra. Trong hệ thống thật: khách thấy y như bị nginx buffer (Lab 00), và debug ở tầng mạng sẽ không tìm ra.`));
        if (st.eol === 'cr' && !naive.length) P.push(box('var(--bad)', '<b>Parser kiểu hướng dẫn không ra event nào.</b> Vì sao: nó tách dòng bằng "\\n", nên với CR cả stream là một dòng duy nhất bắt đầu bằng ": ShopViet", không phải "data: ". Đặc tả chấp nhận CR đơn làm ký tự xuống dòng.'));
        if (st.trunc) {
          const sd = spec.out.some((e) => e.type === 'done'), nd = naive.some((e) => e.type === 'done');
          P.push(box(nd && !sd ? 'var(--bad)' : 'var(--warn)', `<b>Stream đóng khi event done chưa có dòng trống kết thúc.</b> Parser theo đặc tả ${sd ? 'vẫn phát done' : 'bỏ event dở dang, không phát done'}${spec.pending ? ' (data còn treo: ' + show(JSON.stringify(spec.pending.replace(/\n$/, ''))) + ')' : ''}; parser kiểu hướng dẫn ${nd ? '<b>phát done</b> nhờ "tiện tay" xử lý phần còn lại' : 'không phát done'}. Vì sao: đặc tả chỉ dispatch khi gặp dòng trống. Không có nghĩa server đã gửi xong: kết nối có thể bị proxy cắt đúng lúc đó. Trong hệ thống thật: không có event kết thúc thì báo "bị gián đoạn", không lưu như câu trả lời hoàn chỉnh.`));
        }
        if (!st.trunc && spec.out.some((e) => e.data.includes('pin khoảng')) && !naive.some((e) => e.data.includes('pin khoảng'))) P.push(box('var(--bad)', '<b>Mảnh "pin khoảng 30 giờ." biến mất ở bảng phải.</b> Vì sao: server gửi <code>data:{...}</code> không có dấu cách sau dấu hai chấm; parser kiểu hướng dẫn chỉ nhận dòng bắt đầu bằng "data: ". Đặc tả bỏ một dấu cách nếu có, nên <code>data:abc</code> và <code>data: abc</code> như nhau. Không có nghĩa server sai chuẩn. Trong hệ thống thật: khách thấy câu trả lời thiếu một đoạn ở giữa, không có lỗi nào được báo.'));
        if (!mism && !st.trunc) P.push(box('var(--ok)', `Hai parser cho cùng ${spec.out.length} event. ${st.mode === 'none' ? 'Một chunk, LF: đúng kiểu dữ liệu trên localhost. Chọn cách cắt "chỗ hiểm" để xem chuyện gì xảy ra trên mạng thật.' : 'Lần cắt này không trúng chỗ hiểm. Thử "Cắt lại", giảm kích thước, hoặc đổi kiểu xuống dòng.'} Lưu ý event "note": parser bên trái gộp hai dòng data thành một event có ↵ ở giữa.`));
        else if (!st.trunc && naive.filter((e) => e.type === 'note').length > 1) P.push(box('var(--warn)', '<b>Event "note" thành hai event ở bảng phải.</b> Vì sao: đặc tả nối các dòng data liên tiếp bằng LF thành một data; parser kiểu hướng dẫn coi mỗi dòng là một event. Trong hệ thống thật: provider ít khi gửi nhiều dòng data, nhưng proxy hoặc backend tự viết thì có thể.'));
        flags.innerHTML = P.join('');
      }

      const wait = { ttft: 0.8, tps: 50, n: 1500 };
      const W = 860, H = 230, L = 52, R = 16, T = 14, B = 34;
      const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Số token khách thấy theo thời gian khi stream và khi không stream' });
      const wStat = el('div', { class: 'stat' }), wFlag = el('div', { style: 'margin-top:8px;font-size:13.5px' });
      const sT = slider('TTFT', 0.1, 30, 0.1, wait.ttft, (v) => { wait.ttft = v; drawWait(); }, (v) => f1(v) + ' s');
      const sR = slider('Tốc độ sinh', 5, 200, 1, wait.tps, (v) => { wait.tps = v; drawWait(); }, (v) => v + ' tok/s');
      const sN = slider('Output', 20, 2000, 10, wait.n, (v) => { wait.n = v; drawWait(); }, (v) => v + ' tok');
      const preset = (t, r, n) => { wait.ttft = t; wait.tps = r; wait.n = n; sT.input.value = t; sR.input.value = r; sN.input.value = n;
        sT.node.querySelector('output').textContent = f1(t) + ' s'; sR.node.querySelector('output').textContent = r + ' tok/s'; sN.node.querySelector('output').textContent = n + ' tok'; drawWait(); };

      function drawWait() {
        const itl = 1 / wait.tps, e2e = wait.ttft + (wait.n - 1) * itl, tm = e2e * 1.08;
        const X = (t) => L + (t / tm) * (W - L - R), Y = (k) => T + (1 - k / wait.n) * (H - T - B);
        const kids = [el('line', { x1: L, x2: W - R, y1: Y(0), y2: Y(0), stroke: 'var(--line)' }), el('line', { x1: L, x2: L, y1: T, y2: Y(0), stroke: 'var(--line)' })];
        const step = tm > 60 ? 10 : tm > 20 ? 5 : tm > 6 ? 1 : 0.5;
        for (let t = 0; t <= tm; t += step) kids.push(el('text', { x: X(t), y: H - 14, 'text-anchor': 'middle', class: 'mute', style: 'font-size:10px', text: f1(t) + 's' }));
        kids.push(el('text', { x: 4, y: Y(wait.n) + 4, class: 'mute', style: 'font-size:10px', text: wait.n + ' tok' }), el('text', { x: 4, y: Y(0), class: 'mute', style: 'font-size:10px', text: '0' }));
        kids.push(el('rect', { x: L, y: T, width: X(wait.ttft) - L, height: Y(0) - T, fill: 'var(--warn)', opacity: 0.1 }),
          el('text', { x: L + 4, y: T + 12, style: 'font-size:11px;fill:var(--warn)', text: 'TTFT' }));
        kids.push(el('path', { d: `M${X(0)},${Y(0)} L${X(e2e)},${Y(0)} L${X(e2e)},${Y(wait.n)} L${X(tm)},${Y(wait.n)}`, fill: 'none', stroke: 'var(--g2)', 'stroke-width': 2.5 }),
          el('path', { d: `M${X(0)},${Y(0)} L${X(wait.ttft)},${Y(0)} L${X(wait.ttft)},${Y(1)} L${X(e2e)},${Y(wait.n)} L${X(tm)},${Y(wait.n)}`, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.5 }),
          el('line', { x1: X(e2e), x2: X(e2e), y1: T, y2: Y(0), stroke: 'var(--ink)', 'stroke-dasharray': '3 3' }),
          el('text', { x: Math.min(X(e2e) - 4, W - 80), y: T + 12, 'text-anchor': 'end', style: 'font-size:11px', text: 'e2e ' + f1(e2e) + ' s (cả hai xong)' }));
        svg.replaceChildren(...kids);
        const saved = e2e - wait.ttft, pct = Math.round((saved / e2e) * 100);
        wStat.innerHTML = `<span>ITL: <b>${f1(itl * 1000)} ms</b></span><span>Chờ chữ đầu khi stream: <b>${f1(wait.ttft)} s</b></span><span>Khi không stream: <b>${f1(e2e)} s</b></span><span>Stream bớt chờ: <b class="${pct < 30 ? 'bad' : 'ok'}">${f1(saved)} s (${pct}%)</b></span>`;
        const P = [], box = (c, h) => `<div style="border-left:3px solid ${c};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${h}</div>`;
        if (pct < 30) P.push(box('var(--warn)', `<b>Stream chỉ bớt được ${pct}% thời gian chờ.</b> Vì sao: TTFT ${f1(wait.ttft)} s chiếm phần lớn e2e, mà stream không rút ngắn TTFT. Không có nghĩa stream vô ích: khách vẫn thấy chữ sớm hơn ${f1(saved)} s và kết nối không im lặng tới cuối. Trong hệ thống thật: giảm TTFT bằng prompt ngắn hơn, prompt caching, model khác hoặc mức reasoning thấp hơn; hiển thị trạng thái "đang suy nghĩ".`));
        if (e2e > 60) P.push(box('var(--bad)', `<b>Không stream thì kết nối im lặng ${f1(e2e)} s.</b> Vì sao: không có byte nào đi qua cho tới token cuối, vượt idle timeout mặc định 60 s của nginx và ALB (README §3.2). Không có nghĩa stream tự tránh được: stream cũng có khoảng im lặng TTFT ${f1(wait.ttft)} s. Trong hệ thống thật: với request dài, stream (kể cả khi chỉ gom lại bằng helper của SDK) để tránh HTTP timeout, như README khuyên.`));
        if (!P.length) P.push(box('var(--ok)', `Khách thấy chữ từ giây ${f1(wait.ttft)} thay vì ${f1(e2e)}. Phần lớn thời gian chờ nằm ở pha sinh, đúng chỗ stream giúp được.`));
        wFlag.innerHTML = P.join('');
      }

      stage.append(
        el('h4', { style: 'margin:0 0 6px;font-size:14px', text: 'A. Parser SSE chạy thật trên chuỗi byte bị cắt' }),
        el('div', { class: 'row' }, [modeSel.node, nSl.node, reseed]),
        el('div', { class: 'row' }, [eolSel.node, el('label', { class: 'ctl' }, [tr, 'Stream đóng trước dòng trống cuối'])]),
        el('div', { class: 'hint', style: 'margin:0', text: 'Chunk mà reader.read() trả về:' }), chunkBox, stats, tables, flags,
        el('h4', { style: 'margin:22px 0 6px;font-size:14px', text: 'B. Thời gian chờ cảm nhận: stream và không stream' }),
        el('div', { class: 'row' }, [sT.node, sR.node, sN.node]),
        el('div', { class: 'row' }, [el('button', { text: 'Ví dụ README (0,8 s, 50 tok/s, 1.500 tok)', onclick: () => preset(0.8, 50, 1500) }), el('button', { text: 'Reasoning lâu, trả lời ngắn (giả định)', onclick: () => preset(25, 50, 150) }), el('button', { text: 'Câu trả lời chat ShopViet (giả định)', onclick: () => preset(0.8, 50, 150) })]),
        svg, el('div', { class: 'legend', html: '<span><i style="background:var(--accent)"></i>Stream</span><span><i style="background:var(--g2)"></i>Không stream</span>' }), wStat, wFlag,
        el('p', { class: 'hint', text: 'Hình A: chuỗi SSE là mẫu dựng tay theo định dạng trong README §1.2; hai parser là code thật chạy trong trình duyệt (TextDecoder, JSON.parse thật). Hình B: công thức e2e của README §1.1; nút README dùng ví dụ minh hoạ của README, hai nút còn lại là số giả định.' }));
      draw();
      drawWait();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
