const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const Q = 'Tai nghe Pro X có chống ồn không, pin dùng được bao lâu?';
  const ANSWER = 'Dạ có bạn nhé. Tai nghe Pro X có chống ồn chủ động với ba mức, bật trong ứng dụng hoặc chạm hai lần vào tai phải. Pin dùng khoảng 30 giờ khi tắt chống ồn và khoảng 24 giờ khi bật; sạc 10 phút dùng thêm được 3 giờ. ShopViet còn màu đen và trắng, giao nhanh 2 giờ trong nội thành. Bạn muốn mình kiểm tra tồn kho ở cửa hàng gần bạn không?';
  const PIECES = ANSWER.match(/\s*\S{1,4}/g);
  const N = PIECES.length;
  const IN_TOK = 1200;
  const TTFT = 0.8, ITL = 0.02, D = 0.01, START = 0.3, HDR = 0.05;
  const SILENCE = 75, PING = 15, NGINX_READ = 60;
  const fT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const fs = (t) => (t === Infinity ? '—' : t.toFixed(t < 10 ? 2 : 1).replace('.', ',') + ' s');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const HOPS = [['provider', 'Provider sinh'], ['backend', 'Backend gửi'], ['nginx', 'nginx gửi'], ['cdn', 'CDN gửi'], ['browser', 'Trình duyệt nhận']];

  function simulate(c) {
    const S = c.think ? SILENCE : 0;
    const first = TTFT + S;
    const gen = PIECES.map((_, i) => first + i * ITL);
    const pEnd = gen[N - 1] + ITL;
    const be = [{ t: HDR, k: 'hdr' }, { t: START + D, k: 'status' }];
    if (c.ping) for (let t = PING; t < pEnd; t += PING) be.push({ t, k: 'ping' });
    gen.forEach((t, i) => be.push({ t: t + D, k: 'text', i }));
    be.push({ t: pEnd + D, k: 'done' });
    be.sort((a, b) => a.t - b.t);
    let tn = Infinity;
    for (let j = 1; j < be.length; j++) if (be[j].t - be[j - 1].t > NGINX_READ) { tn = be[j - 1].t + NGINX_READ; break; }
    const td = c.disc ? c.discAt : Infinity;
    const tCut = Math.min(tn, td);
    const cutBy = tCut === Infinity ? null : tn <= td ? 'nginx' : 'client';
    const pStop = cutBy && c.abort ? Math.min(pEnd, tCut + 2 * D) : pEnd;
    const completed = pStop >= pEnd;
    const prov = [{ t: START, k: 'start' }, ...gen.filter((t) => t < pStop).map((t, i) => ({ t, k: 'text', i }))];
    if (completed) prov.push({ t: pEnd, k: 'usage' });
    const beSent = be.filter((e) => e.t < tCut);
    const beLate = cutBy && !c.abort ? prov.filter((e) => e.t >= tCut).map((e) => ({ t: e.t + D, k: e.k, late: true })) : [];
    const pass = (evs, buf) => {
      const end = evs.find((e) => e.k === 'done');
      return evs.map((e) => Object.assign({}, e, { t: buf && e.k !== 'hdr' ? (end ? end.t + D : Infinity) : e.t + D })).filter((e) => e.t < tCut);
    };
    const ngx = pass(beSent, c.nginxBuf);
    const cdn = pass(ngx, c.cdnBuf);
    const brw = cdn.map((e) => Object.assign({}, e, { t: e.t + D })).filter((e) => e.t < tCut);
    const seenT = brw.filter((e) => e.k === 'text').map((e) => e.t);
    const genOut = prov.filter((e) => e.k === 'text').length;
    const reason = c.think ? Math.round(Math.min(S, Math.max(0, pStop - TTFT)) / ITL) : 0;
    const usageKnown = completed && (!cutBy || !c.abort || tCut >= pEnd);
    return {
      gen, pEnd, tCut, cutBy, pStop, completed, rows: { provider: prov, backend: beSent.concat(beLate), nginx: ngx, cdn, browser: brw },
      seenT, seen: seenT.length, done: brw.some((e) => e.k === 'done'), genOut, reason, billed: IN_TOK + genOut + reason, usageKnown,
      srvTTFT: first, cliTTFT: seenT.length ? seenT[0] : Infinity, think: c.think
    };
  }

  return {

        k2.push(el('line', { x1: L, x2: W - R, y1: Y(0), y2: Y(0), stroke: 'var(--line)' }), el('text', { x: 4, y: Y(N) + 4, text: N + ' mảnh', class: 'mute', style: 'font-size:11px' }), el('text', { x: 4, y: Y(0), text: '0', class: 'mute', style: 'font-size:11px' }));
        if (r.think) k2.push(el('rect', { x: X(TTFT), y: 10, width: Math.max(0, X(Math.min(r.pStop, TTFT + SILENCE)) - X(TTFT)), height: CH, fill: 'var(--warn)', opacity: 0.12 }),
          el('text', { x: X(TTFT) + 6, y: 26, text: `đang suy luận: ${fT(r.reason)} token tính tiền, không hiển thị`, style: 'font-size:11px;fill:var(--warn)' }));
        const stepLine = (times, color, w) => {
          let d = `M${X(0)},${Y(0)}`;
          times.forEach((t, i) => { d += ` L${X(t)},${Y(i)} L${X(t)},${Y(i + 1)}`; });
          d += ` L${X(tMaxOf())},${Y(times.length)}`;
          return el('path', { d, fill: 'none', stroke: color, 'stroke-width': w });
        };
        k2.push(stepLine(r.rows.provider.filter((e) => e.k === 'text').map((e) => e.t), 'var(--g2)', 2.5), stepLine(r.seenT, 'var(--accent)', 2.5));
        svg2.replaceChildren(...k2, play2);
        const leg = el('div', { class: 'legend', html: '<span><i style="background:var(--g2)"></i>Token provider đã sinh (bị tính)</span><span><i style="background:var(--accent)"></i>Token khách đã thấy</span>' });
        legendBox.replaceChildren(leg);

        const gap = r.cliTTFT - r.srvTTFT;
        result.innerHTML = `<span>Chữ đầu ở backend: <b>${fs(r.srvTTFT)}</b></span><span>Chữ đầu ở trình duyệt: <b class="${gap > 0.5 ? 'bad' : ''}">${fs(r.cliTTFT)}</b></span><span>Khách thấy: <b>${r.seen}/${N}</b> mảnh</span><span>Nhận done: <b class="${r.done ? 'ok' : 'bad'}">${r.done ? 'có' : 'không'}</b></span><span>Usage trong log backend: <b class="${r.usageKnown ? 'ok' : 'bad'}">${r.usageKnown ? 'có' : 'missing'}</b></span><span>Provider tính: <b>${fT(r.billed)}</b> token (${fT(IN_TOK)} input + ${fT(r.genOut + r.reason)} output)</span>`;
        drawFlags(gap);
      }

      function drawFlags(gap) {
        const P = [], box = (c, h) => `<div style="border-left:3px solid ${c};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${h}</div>`;
        const lost = r.genOut + r.reason - r.seen;
        if ((st.nginxBuf || st.cdnBuf) && r.done) P.push(box('var(--warn)', `<b>Chữ hiện một cục ở giây ${fs(r.cliTTFT)}, trong khi backend đã gửi chữ đầu ở giây ${fs(r.srvTTFT + D)}.</b> Vì sao: ${st.nginxBuf ? 'nginx' : 'tầng nén ở CDN'} giữ mọi event trong buffer tới khi upstream kết thúc. Không có nghĩa stream ở backend hỏng: log backend vẫn đẹp, chỉ khách không thấy. Trong hệ thống thật: <code>proxy_buffering off</code> hoặc header <code>X-Accel-Buffering: no</code>, loại <code>text/event-stream</code> khỏi gzip, kiểm tra bằng <code>curl -N</code> qua từng tầng.`));
        if (r.cutBy === 'nginx') P.push(box('var(--bad)', `<b>Kết nối bị cắt ở giây ${fs(r.tCut)}.</b> Vì sao: event cuối backend gửi là status ở giây ${fs(START + D)}, sau đó model im lặng ${SILENCE} s, quá <code>proxy_read_timeout</code> mặc định ${NGINX_READ} s tính giữa hai lần đọc. Không có nghĩa câu trả lời quá dài: stream dài vài phút vẫn ổn nếu không có khoảng im lặng nào quá ${NGINX_READ} s. Trong hệ thống thật: bật heartbeat <code>: ping</code> 15–30 giây (thử tích ô "Heartbeat") và tăng timeout cho route stream.`));
        if (r.cutBy && r.seen === 0 && r.genOut + r.reason > 0) P.push(box('var(--bad)', `<b>Khách không thấy chữ nào, provider vẫn sinh ${fT(r.genOut + r.reason)} token output.</b> Vì sao: ${st.nginxBuf || st.cdnBuf ? 'phần đã sinh nằm kẹt trong buffer và bị bỏ khi kết nối đóng' : 'mọi token sinh ra trong lúc suy luận đều không hiển thị'}. Không có nghĩa provider tính sai: token đã sinh là token đã tốn GPU. Trong hệ thống thật: Claude ghi rằng request bị ngắt giữa chừng vẫn bị tính tiền (README §3.7).`));
        if (r.cutBy && !st.abort) P.push(box('var(--bad)', `<b>Backend đọc tiếp ${fT(r.rows.backend.filter((e) => e.late && e.k === 'text').length)} mảnh sau khi kết nối với khách đã đóng.</b> Vì sao: mắt xích [4] bị đứt, backend không truyền abort xuống request gọi provider, nên provider sinh tới hết. Không có nghĩa có ai đọc phần đó: dải vạch mờ ở hàng Backend không đi xuống tầng nào. Trong hệ thống thật: truyền <code>req.signal</code> vào SDK (AI SDK: <code>abortSignal: req.signal</code>), hoặc thoát khối <code>with ... stream</code>; rồi test bằng cách huỷ thật và so usage.`));
        if (r.cutBy && st.abort && !r.usageKnown) P.push(box('var(--warn)', `<b>Log backend thiếu usage cho request này</b>, dù provider vẫn tính khoảng ${fT(r.billed)} token. Vì sao: usage output của Claude đến ở <code>message_delta</code> gần cuối; backend đã đóng request trước đó. Không có nghĩa request miễn phí. Trong hệ thống thật: ghi <code>usage_status = "missing"</code>, input ${fT(IN_TOK)} token đã biết từ <code>message_start</code>, ước lượng output từ ${r.seen} mảnh đã gửi, đối soát định kỳ với billing.`));
        if (r.cutBy === 'client' && st.abort && lost > 0 && r.seen > 0) P.push(box('var(--warn)', `Provider dừng ở giây ${fs(r.pStop)}, sinh ${fT(r.genOut + r.reason)} token output, khách thấy ${r.seen}. Phần chênh ${fT(lost)} là token sinh ra nhưng chưa kịp tới trình duyệt (hoặc kẹt trong buffer, hoặc là token suy luận).`));
        if (!P.length && st.think) P.push(box('var(--ok)', `Heartbeat giữ kết nối qua ${SILENCE} s im lặng: khoảng im lặng dài nhất nginx thấy chỉ còn ${PING} s. Chữ đầu vẫn tới ở giây ${fs(r.cliTTFT)} vì model suy luận, không phải vì hạ tầng; ${fT(r.reason)} token suy luận được tính tiền mà khách không thấy. Trong hệ thống thật: hiển thị trạng thái "đang suy nghĩ" từ event status để khách không bấm tải lại.`));
        if (!P.length) P.push(box('var(--ok)', `Đường đi sạch: mỗi event tới trình duyệt khoảng ${Math.round(4 * D * 1000)} ms sau khi provider sinh, khách nhận <code>done</code>, backend có usage. Đây là thứ máy dev cho thấy. Bật từng ô phía trên để xem production có thể khác thế nào.`));
        flags.innerHTML = P.join('');
      }

      function drawTime() {
        const t = st.t, x = X(t);
        [play1, play2].forEach((p) => { p.setAttribute('x1', x); p.setAttribute('x2', x); });
        tSl.input.value = Math.round((t / tMaxOf()) * 1000);
        tSl.node.querySelector('output').textContent = fs(t);
        const seen = r.seenT.filter((s) => s <= t).length;
        const gen = r.rows.provider.filter((e) => e.k === 'text' && e.t <= t).length;
        const rs = r.think ? Math.round(Math.min(SILENCE, Math.max(0, Math.min(t, r.pStop) - TTFT)) / ITL) : 0;
        const doneNow = r.rows.browser.some((e) => e.k === 'done' && e.t <= t);
        const cut = r.tCut <= t;
        const state = doneNow ? 'Xong' : cut ? 'Bị gián đoạn' : seen ? 'Đang viết' : 'Đang chờ';
        view.innerHTML = `<div style="font-family:var(--font);font-size:12px;color:var(--mute);margin-bottom:4px">Khách: ${esc(Q)}</div>` + esc(PIECES.slice(0, seen).join('')) +
          (state === 'Đang viết' ? '<span style="color:var(--accent)">▍</span>' : '') + (seen === 0 && !cut ? '<span class="hint">(spinner)</span>' : '');
        nowStat.innerHTML = `<span>Trạng thái UI: <b class="${state === 'Bị gián đoạn' ? 'bad' : state === 'Xong' ? 'ok' : ''}">${state}</b></span><span>Khách đã thấy: <b>${seen}</b> mảnh</span><span>Provider đã sinh: <b>${gen}</b> mảnh${r.think ? ` + <b>${fT(rs)}</b> token suy luận` : ''}</span>`;
      }

      const legendBox = el('div');
      function rerun() {
        syncDisc();
        r = simulate(st);
        if (!st.playing) st.t = tMaxOf();
        drawStatic();
        drawTime();
      }

      stage.append(
        el('div', { class: 'row' }, [cb('nginx proxy_buffering on', 'nginxBuf').node, cb('CDN / nén buffer', 'cdnBuf').node, cb('Khách đóng tab', 'disc').node, discSl.node]),
        el('div', { class: 'row' }, [cb('Backend truyền abort tới provider', 'abort').node, cb('Model suy luận im lặng 75 s', 'think').node, cb('Heartbeat ": ping" mỗi 15 s', 'ping').node]),
        el('div', { class: 'row' }, [bPlay, bEnd, tSl.node]),
        svg1, svg2, legendBox, nowStat, view,
        el('h4', { style: 'margin:16px 0 4px;font-size:13px', text: 'Kết quả của cả request' }), result, flags,
        el('p', { class: 'hint', text: `Số liệu giả định: TTFT 0,8 s và ITL 20 ms (ví dụ minh hoạ trong README §1.1), im lặng 75 s và nginx timeout 60 s (hình idle-heartbeat và §3.2 của README), mỗi tầng trễ 10 ms, ${fT(IN_TOK)} token input. Câu trả lời được chia thành ${N} mảnh 1–4 ký tự để mô phỏng token, không phải tokenizer thật. Buffer được mô phỏng giản lược như hình trong README: giữ hết tới khi upstream kết thúc. Token suy luận ước tính bằng thời gian im lặng / ITL.` }));
      rerun();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
