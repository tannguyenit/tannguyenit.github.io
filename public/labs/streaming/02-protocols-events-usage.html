const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const ANSWER = 'Dạ có bạn nhé. Tai nghe Pro X chống ồn chủ động, pin khoảng 30 giờ khi tắt chống ồn. Bạn muốn mình kiểm tra tồn kho không?';
  const words = ANSWER.split(' ');
  const DELTAS = [];
  for (let i = 0; i < words.length; i += 3) DELTAS.push((i ? ' ' : '') + words.slice(i, i + 3).join(' '));
  const IN = 1200;
  const est = (s) => { let t = 0; for (const ch of s) t += ch.charCodeAt(0) < 128 ? 0.27 : 0.7; return Math.max(1, Math.round(t)); };
  const OUT = est(ANSWER);
  const J = (o) => JSON.stringify(o);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const enc = new TextEncoder();
  const sse = (name, obj) => (name ? 'event: ' + name + '\n' : '') + 'data: ' + (typeof obj === 'string' ? obj : J(obj)) + '\n\n';

  const PROVIDERS = [
    ['claude', 'Claude'], ['responses', 'OpenAI Responses'], ['chat', 'OpenAI Chat Completions'], ['vllm', 'vLLM, continuous_usage_stats'], ['gemini', 'Gemini streamGenerateContent (alt=sse)'], ['ollama', 'Ollama /api/chat (NDJSON)']
  ];

  function build(p, includeUsage) {
    const ev = [];
    const add = (raw, o) => ev.push(Object.assign({ raw, norm: [] }, o));
    let cum = 0, sofar = '';
    if (p === 'claude') {
      add(sse('message_start', { type: 'message_start', message: { id: 'msg_01', role: 'assistant', content: [], usage: { input_tokens: IN } } }), { u: { in: IN } });
      add(sse('content_block_start', { type: 'content_block_start', index: 0, content_block: { type: 'text', text: '' } }), { norm: [['block_start', 'text #0']] });
      DELTAS.forEach((d, i) => {
        add(sse('content_block_delta', { type: 'content_block_delta', index: 0, delta: { type: 'text_delta', text: d } }), { norm: [['block_delta', d]], text: d });
        if (i === 2) add(sse('ping', { type: 'ping' }), {});
      });
      add(sse('content_block_stop', { type: 'content_block_stop', index: 0 }), { norm: [['block_stop', 'text #0']] });
      add(sse('message_delta', { type: 'message_delta', delta: { stop_reason: null }, usage: { output_tokens: OUT } }), { u: { out: OUT } });
      add(sse('message_delta', { type: 'message_delta', delta: { stop_reason: 'end_turn' }, usage: { output_tokens: OUT } }), { u: { out: OUT } });
      add(sse('message_stop', { type: 'message_stop' }), { norm: [['response_end', 'end_turn']], end: true });
    } else if (p === 'responses') {
      let sq = 0;
      const r = (type, o) => add(sse(type, Object.assign({ type, sequence_number: sq++ }, o.body)), o);
      r('response.created', { body: { response: { id: 'resp_1', status: 'in_progress' } } });
      r('response.output_item.added', { body: { output_index: 0, item: { id: 'msg_1', type: 'message' } }, norm: [['block_start', 'message msg_1']] });
      r('response.content_part.added', { body: { item_id: 'msg_1', output_index: 0, content_index: 0 } });
      DELTAS.forEach((d) => r('response.output_text.delta', { body: { item_id: 'msg_1', output_index: 0, content_index: 0, delta: d }, norm: [['block_delta', d]], text: d }));
      r('response.output_text.done', { body: { item_id: 'msg_1', text: ANSWER } });
      r('response.content_part.done', { body: { item_id: 'msg_1', content_index: 0 } });
      r('response.output_item.done', { body: { output_index: 0, item: { id: 'msg_1', type: 'message', status: 'completed' } }, norm: [['block_stop', 'message msg_1']] });
      r('response.completed', { body: { response: { id: 'resp_1', status: 'completed', usage: { input_tokens: IN, output_tokens: OUT, total_tokens: IN + OUT } } }, u: { in: IN, out: OUT }, norm: [['response_end', 'completed']], end: true });
    } else if (p === 'chat' || p === 'vllm') {
      const cont = p === 'vllm', iu = includeUsage || cont;
      const ch = (delta, fin, extra) => {
        const o = { object: 'chat.completion.chunk', choices: [{ index: 0, delta, finish_reason: fin }] };
        if (cont) o.usage = { prompt_tokens: IN, completion_tokens: cum, total_tokens: IN + cum };
        else if (iu) o.usage = null;
        return add(sse(null, o), Object.assign(cont ? { u: { in: IN, out: cum } } : {}, extra));
      };
      ch({ role: 'assistant', content: '' }, null, { norm: [['block_start', 'choice 0']] });
      DELTAS.forEach((d) => { sofar += d; cum = est(sofar); ch({ content: d }, null, { norm: [['block_delta', d]], text: d }); });
      ch({}, 'stop', { norm: [['block_stop', 'choice 0 (finish_reason stop)']] });
      if (iu) add(sse(null, { object: 'chat.completion.chunk', choices: [], usage: { prompt_tokens: IN, completion_tokens: OUT, total_tokens: IN + OUT } }), { u: { in: IN, out: OUT } });
      add('data: [DONE]\n\n', { norm: [['response_end', 'stop']], end: true });
    } else if (p === 'gemini') {
      DELTAS.forEach((d, i) => {
        const last = i === DELTAS.length - 1, c = { content: { role: 'model', parts: [{ text: d }] } };
        if (last) c.finishReason = 'STOP';
        const o = { candidates: [c] };
        if (last) o.usageMetadata = { promptTokenCount: IN, candidatesTokenCount: OUT, totalTokenCount: IN + OUT };
        add(sse(null, o), { norm: (i ? [] : [['block_start', 'part 0 (adapter tự sinh)']]).concat([['block_delta', d]]).concat(last ? [['block_stop', 'part 0 (adapter tự sinh)'], ['response_end', 'STOP']] : []), text: d, u: last ? { in: IN, out: OUT } : null, end: last });
      });
    } else {
      DELTAS.forEach((d, i) => add(J({ message: { role: 'assistant', content: d }, done: false }) + '\n', { norm: (i ? [] : [['block_start', 'message (adapter tự sinh)']]).concat([['block_delta', d]]), text: d }));
      add(J({ message: { role: 'assistant', content: '' }, done: true, prompt_eval_count: IN, eval_count: OUT }) + '\n', { norm: [['block_stop', 'message (adapter tự sinh)'], ['response_end', 'done: true']], u: { in: IN, out: OUT }, end: true });
    }
    return ev;
  }

  function accumulate(ev, k) {
    const got = ev.slice(0, k);
    let inT = null, outT = null, sumIn = 0, sumOut = 0, text = '', ended = false, nUsage = 0;
    const norm = [];
    got.forEach((e) => {
      if (e.u) {
        nUsage++;
        if (e.u.in != null) { inT = e.u.in; sumIn += e.u.in; }
        if (e.u.out != null) { outT = e.u.out; sumOut += e.u.out; }
      }
      if (e.text) text += e.text;
      if (e.end) ended = true;
      e.norm.forEach((n) => norm.push(n));
    });
    const status = ended && outT != null ? 'ok' : outT != null ? 'partial' : 'missing';
    return { got, inT, outT, sumIn, sumOut, text, ended, status, norm, nUsage, estOut: text ? est(text) : 0 };
  }

  const lastTextIdx = (ev) => { let j = -1; ev.forEach((e, i) => { if (e.text) j = i; }); return j + 1; };

  return {

    mount(stage) {

      const pSel = select('Provider', PROVIDERS, st.p, (v) => { st.p = v; reset(); });
      const iuCb = el('input', { type: 'checkbox' });
      iuCb.addEventListener('change', () => { st.iu = iuCb.checked; reset(); });
      const iuLab = el('label', { class: 'ctl' }, [iuCb, 'stream_options.include_usage']);

        if (st.naive && a.outT != null && a.sumOut > a.outT) P.push(box('var(--bad)', `<b>Output bị đếm ${fT(a.sumOut)} token, thật ra là ${fT(a.outT)} (gấp ${(a.sumOut / a.outT).toFixed(1).replace('.', ',')} lần).</b> Vì sao: ${st.p === 'claude' ? 'hai message_delta cùng mang output_tokens cộng dồn' : st.p === 'vllm' ? 'continuous_usage_stats gửi usage tính tới thời điểm đó ở mọi chunk, cộng lại thành 1 + 2 + ... + n' : 'nhiều event cùng mang tổng'}. Không có nghĩa provider tính gấp: hoá đơn vẫn là ${fT(a.outT)}. Trong hệ thống thật: ghi đè giá trị usage mới nhất, không cộng (README §3.11).`));
        if (st.naive && a.inT != null && a.sumIn > a.inT) P.push(box('var(--bad)', `<b>Input bị đếm ${fT(a.sumIn)} thay vì ${fT(a.inT)}.</b> Vì sao: prompt_tokens / input_tokens xuất hiện ở nhiều event, cùng một giá trị. Trong hệ thống thật: một request chỉ có một số input.`));
        if (a.text === ANSWER && !a.ended) P.push(box('var(--bad)', `<b>Khách đã thấy đủ câu trả lời, nhưng stream không có event kết thúc${a.status === 'missing' ? ' và không có usage' : ''}.</b> Vì sao: ${name} gửi ${st.p === 'claude' ? 'output_tokens trong message_delta và message_stop' : st.p === 'chat' ? (st.iu ? 'chunk usage và [DONE]' : '[DONE]') : 'event kết thúc'} sau delta văn bản cuối; kết nối đóng trước đó. Không có nghĩa request rẻ hơn: provider đã sinh xong ${fT(OUT)} token. Trong hệ thống thật: raise StreamTruncated, ghi usage_status = "missing", đừng lưu như câu trả lời hoàn chỉnh.`));
        if (st.p === 'chat' && !st.iu && a.ended) P.push(box('var(--warn)', '<b>Stream kết thúc hợp lệ bằng [DONE] mà không có usage nào.</b> Vì sao: Chat Completions chỉ gửi usage khi đặt <code>stream_options: {"include_usage": true}</code>. Không có nghĩa request miễn phí. Trong hệ thống thật: bật include_usage cho mọi request stream; tích ô phía trên để thấy chunk usage có choices rỗng xuất hiện trước [DONE].'));
        if (st.p === 'gemini' && a.ended) P.push(box('var(--warn)', 'Gemini <code>streamGenerateContent</code> không có event riêng cho mở / đóng khối; adapter tự sinh block_stop và response_end khi gặp finishReason khác rỗng. README: đừng dựa vào <code>data: [DONE]</code> với Gemini. Lab đặt usageMetadata ở chunk cuối; README chỉ ghi nó nằm trong GenerateContentResponse.'));
        if (!P.length && a.status === 'ok') P.push(box('var(--ok)', `Stream đủ: có event kết thúc, usage ${fT(a.inT ?? 0)} input + ${fT(a.outT)} output. Kéo slider sang trái để cắt stream, hoặc đổi bộ đếm sang "cộng mọi giá trị".`));
        flags.innerHTML = P.join('');

        const rows = PROVIDERS.map(([id, n]) => {
          const e2 = build(id, st.iu), b = accumulate(e2, lastTextIdx(e2));
          return `<tr class="${id === st.p ? 'cur' : ''}"><td>${n}${id === 'chat' ? (st.iu ? ' (include_usage)' : ' (không include_usage)') : ''}</td><td class="${b.text === ANSWER ? 'ok' : 'bad'}">${b.text === ANSWER ? 'đủ' : 'thiếu'}</td><td class="${b.ended ? 'ok' : 'bad'}">${b.ended ? 'có (nằm cùng chunk cuối)' : 'không'}</td><td class="${b.inT != null ? 'ok' : 'bad'}">${b.inT != null ? fT(b.inT) : 'không biết'}</td><td class="${b.outT != null ? 'ok' : 'bad'}">${b.outT != null ? fT(b.outT) + (id === 'vllm' ? ' (tới chunk đó)' : '') : 'không biết'}</td><td class="mono">~${b.estOut}</td></tr>`;
        }).join('');
        cmp.innerHTML = '<div class="tbl" style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12.5px;width:100%"><tr><th>Provider</th><th>Văn bản</th><th>Event kết thúc</th><th>Input biết được</th><th>Output biết được</th><th>Ước lượng output từ ký tự</th></tr>' + rows + '</table></div>';
      }

      stage.append(
        el('div', { class: 'row' }, [pSel.node, iuLab, mSel.node]),
        el('div', { class: 'row' }, [kSl.node, el('button', { text: 'Cắt ngay sau delta cuối', onclick: () => setK(lastTextIdx(ev)) }), el('button', { text: 'Stream đủ', onclick: () => setK(ev.length) })]),
        el('div', { class: 'cols' }, [
          el('div', {}, [el('h4', { html: 'Trên dây <small>viền tím: có usage, viền xanh: event kết thúc</small>' }), wire]),
          el('div', {}, [el('h4', { text: 'Sau adapter (khuôn nội bộ)' }), normBox, el('h4', { style: 'margin-top:10px', text: 'Khách thấy' }), textBox, el('h4', { text: 'Bộ đếm usage' }), acc])
        ]),
        flags,
        el('h4', { style: 'margin:16px 0 4px;font-size:13px', text: 'Cùng tình huống ở mọi provider: kết nối đóng ngay sau delta văn bản cuối' }), cmp,
        el('div', { class: 'cap', html: 'Vì sao chỉ Gemini vẫn có event kết thúc: Gemini nhét <code>finishReason</code> và <code>usageMetadata</code> vào <b>cùng chunk</b> với mảnh chữ cuối, các provider khác gửi chúng ở event riêng phía sau. Không có nghĩa Gemini an toàn hơn: cắt sớm hơn một chunk là cũng mất cả hai. vLLM "biết" output vì mỗi chunk mang tổng tới lúc đó, nhưng đó là số tới chunk cuối nhận được, chưa chắc là số cuối cùng. Trong hệ thống thật: vẫn chỉ tin event kết thúc, không tin "văn bản trông đủ".' }),
        el('p', { class: 'hint', text: `Event dựng tay theo bảng event model và usage trong README (Tra cứu nhanh, §1.5, §2.2–2.4), lược field id, model, created. Token ước lượng thô theo ký tự (ASCII 0,27, ký tự khác 0,7 token/ký tự), không phải tokenizer thật; ${fT(IN)} token input là giả định. Claude được dựng với hai message_delta (README: một hoặc nhiều).` }));
      reset();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
