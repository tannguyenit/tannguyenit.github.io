const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<p>Khi thêm model vào chuỗi: chạy request thật với từng model trong CI; lọc chuỗi theo forced tool use hoặc dùng <code>auto</code> cộng <code>strict: true</code>; dùng <code>adaptive</code> khi có thể; đếm lại token và <code>max_tokens</code>; đo cache hit theo model; giữ lịch sử append-only; chạy eval trên model fallback; kiểm subset JSON Schema và tool format theo provider.</p>
<h4>Circuit breaker: các lựa chọn</h4>
<ul><li>Chỉ đếm lỗi <code>RETRY</code>. <code>retry-after</code> đặt cooldown tối thiểu.</li><li>Đếm liên tiếp (đơn giản, nhanh khi sập hẳn) hay tỷ lệ trong cửa sổ trượt (ổn định khi lỗi lác đác; LiteLLM dùng 50% trong phút).</li><li>Tối thiểu theo (provider, model); với 429 của Claude, theo bucket họ model đúng hơn.</li><li>Trạng thái trong process: mỗi worker tự học lại; hàng trăm worker thì dùng Redis hoặc gateway có cooldown chung.</li></ul>
<div class="verdict"><b>Health check chủ động</b> tốn tiền và đo sai thứ: trả lời được "ping" không có nghĩa trả lời được request 100.000 token có tool. Tín hiệu đáng tin nhất là traffic thật qua breaker thụ động, cộng tỷ lệ lỗi theo model trên dashboard.</div>`,
  why: {

  deep: [
    {
      q: 'Vì sao phải phân loại lỗi trước khi nghĩ tới chuỗi fallback?',

<p>Hàm <code>classify</code> ở README chuyển exception thành một trong ba hành động. Thứ tự kiểm tra quan trọng: spend cap trước, rồi <code>x-should-retry</code>, rồi <code>404</code>, rồi quy tắc theo status. Chọn một lỗi bên dưới; hình chạy đúng logic đó (viết lại bằng JavaScript).</p>`,
      viz(box) {

        function classify(st, code, sr) {
          if (st === 'conn') return ['RETRY', 'APIConnectionError (gồm timeout): retry.'];
          const s = +st;
          if (s === 429 && code === 'enforced_spend_limit_reached') return ['FATAL', 'Hết spend cap của tổ chức: model nào cũng bị chặn, kể cả khi x-should-retry là true.'];

          if (s === 404) return ['NEXT', 'Model ID sai hoặc đã retire: sang model kế, không tính vào breaker.'];
          if (sr !== 'false' && ([408, 409, 429].includes(s) || s >= 500)) return ['RETRY', 'Cùng quy tắc SDK: 408, 409, 429, mọi 5xx.'];

    {

<p>Còn một biến thể nữa: spend limit bạn tự đặt (thấp hơn trần) trả <code>400 invalid_request_error</code>, message bắt đầu bằng <code>You have reached your specified API usage limits</code>. Cùng là "hết tiền", một cái 429, một cái 400.</p>

<p>Code ở README đặt <code>deadline_s</code> cho cả chuỗi và <code>max_wait_s</code>. Nếu <code>retry-after</code> lớn hơn <code>max_wait_s</code> hoặc lớn hơn phần deadline còn lại, nó không chờ, không retry sớm hơn server yêu cầu, mà sang model ở bucket khác. Hình so sánh hai cách xử lý cùng một <code>429</code>.</p>`,

      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
