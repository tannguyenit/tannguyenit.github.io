const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  function classify(status, opt = {}) {
    if (status === 'conn') return ['RETRY', null];

  function attemptResult(mode, nth) {

          final = { tg, cost, warm, quality: tg.q[q.level] };
          break outer;
        }
        if (r.kind === 'refusal') {

          t += remaining;
          log.push([tg, 'retry: APITimeoutError']);
          if (ti === 0) breaker.failures++;
          continue;
        }
        const [action, wait0] = classify(r.status, { spend: r.spend, retryAfter: r.retryAfter });

        if (ti === 0) { breaker.failures++; if (breaker.failures >= breaker.threshold) breaker.openUntil = t + Math.max(o.cooldown, wait0 || 0); }

    why: {
      c: 'Một vòng retry duy nhất ở ứng dụng (SDK <code>max_retries=0</code>), phân loại lỗi thành RETRY / NEXT / FATAL trước khi quyết định, trần cho cả chuỗi (số lần thử và deadline), chuỗi đi qua bucket rate limit khác (cùng model ở Bedrock, rồi provider khác), breaker theo (provider, model). Lý do: lỗi capacity kéo dài phút đến giờ, retry chỉ cứu được vài giây; còn lỗi của request thì không model nào cứu được.',
      s: 'Để SDK, gateway và ứng dụng cùng retry: nhân lên tới 27 request cho một lần bấm. Fallback với mọi lỗi: 400 và spend cap bị gửi đi khắp chuỗi, che mất bug cấu hình. Chuỗi Sonnet 5.5 → Opus 5.5 cho request ép gọi tool: cả hai đều 400. Không có breaker: mọi khách trong lúc sự cố đều chịu đủ các lần thử thất bại.',

    deep: [
      {
        q: 'SDK của Claude đã tự retry 2 lần rồi. Sao README lại bắt đặt max_retries=0?',
        a: `<p>Vì retry nhân lên theo tầng. SDK <code>anthropic</code> mặc định retry 2 lần (tức 3 lần thử). Nếu gateway cũng thử 3 lần và ứng dụng cũng thử 3 lần, một lần bấm của khách thành 3 × 3 × 3 = 27 request lên một provider đang quá tải. OpenAI viết thẳng: nếu tự retry trong ứng dụng thì tắt retry của SDK (README §1.3).</p><p>Kéo số tầng và số lần thử mỗi tầng để thấy con số.</p>`,

      {
        q: 'Lỗi nào thì thử lại, lỗi nào thì sang model khác, lỗi nào thì dừng?',

        viz(box) {
          const out = el('div');

          box.append(el('div', { class: 'row' }, [

          draw();

        take: 'Phân loại lỗi trước, chuỗi sau. 400 để FATAL có chủ ý: nếu nó chỉ xảy ra ở một model thì đó là bug của chuỗi, phải sửa chứ không che.'
      },
      {
        q: 'Spend cap và rate limit đều là 429. Code phân biệt bằng gì?',
        a: `<p>Không bằng status code. README §1.2: hết spend cap của tháng, Claude trả <code>429 rate_limit_error</code> y như rate limit thường, nhưng <code>error.details.error_code = "enforced_spend_limit_reached"</code> và <b>không có</b> <code>retry-after</code>. Mọi retry, kể cả retry tự động của SDK, đều lỗi cho tới 00:00 UTC ngày đầu tháng sau. Spend limit tự đặt thấp hơn trần lại trả <code>400</code>. OpenAI cũng dùng 429 cho cả rate limit lẫn hết credit.</p><p>Trong hình chính, đặt model chính thành "429 enforced_spend_limit_reached": chuỗi dừng sau đúng một request, không chờ, không fallback. Fallback sang model khác trong cùng tổ chức không giúp được, vì hạn mức áp cho cả tổ chức.</p>`,
        take: 'Đọc error_code và header, không chỉ status. Hết tiền là chuyện báo động, không phải chuyện retry.'
      },
      {
        q: 'Server bảo chờ 30 giây. Sao code không chờ cho đúng luật?',
        a: `<p>README Tra cứu nhanh: không bao giờ retry <i>sớm hơn</i> thời gian server yêu cầu, nhưng cũng không bắt buộc phải chờ. Nếu thời gian đó dài hơn ngưỡng bạn chịu được (ví dụ 10 s) hoặc dài hơn phần deadline còn lại, sang model ở bucket rate limit khác. SDK thì khác: có <code>retry-after</code> là chờ đúng giá trị đó, không có trần riêng; đo với <code>retry-after: 3</code> thì SDK chờ 3,02 s, và <code>retry-after: 120</code> sẽ giữ khách thêm hai phút.</p><p>Thử trong hình chính: model chính "429 kèm retry-after: 30" thì log ghi "không chờ" và nhảy sang Bedrock ngay; "429 kèm retry-after: 2" thì chờ đúng 2 s rồi thành công trên cùng model, không mất cache.</p>`,
        take: 'retry-after là mức sàn của thời gian chờ, không phải lời hứa sẽ ổn. Quá ngưỡng thì đi chỗ khác.'
      },
      {
        q: 'Mỗi request đều tự sang được fallback rồi. Circuit breaker thêm được gì?',
        a: `<p>Thời gian của khách. Không có breaker, mỗi request trong lúc model chính sập vẫn thử model chính trước, chờ hết các lần retry, rồi mới sang fallback. README §3.3 tính một kịch bản: model chính lỗi 35 s, mỗi 3 s một request, 2 lần thử mỗi model, breaker ngưỡng 5, cooldown 30 s. Mô phỏng dưới chạy đúng kịch bản đó với lớp Breaker của README (backoff tính theo trung bình để dễ đọc).</p>`,
        viz(box) {
          const out = el('div');
          const st = { outage: 35, gap: 3, thr: 5, cd: 30 };
          const draw = () => {
            const sim = (useBreaker) => {
              let failures = 0, openUntil = 0, probe = null, failedAttempts = 0, waitSum = 0, direct = 0;
              const reqs = [];
              for (let t = 0; t < st.outage + 15; t += st.gap) reqs.push(t);
              reqs.forEach((t0) => {
                let t = t0;
                let allowed = true;
                if (useBreaker && failures >= st.thr) {
                  if (t < openUntil) allowed = false;
                  else if (probe !== null && t - probe < st.cd) allowed = false;
                  else probe = t;
                }
                if (!allowed) { direct++; return; }
                for (let i = 0; i < 2; i++) {
                  if (t < st.outage) {
                    failedAttempts++; failures++; probe = null;
                    if (useBreaker && failures >= st.thr) openUntil = t + st.cd;
                    if (i === 0) { const w = 0.25; waitSum += w + 0.4; t += 0.4 + w; } else waitSum += 0.4;
                    if (useBreaker && failures >= st.thr && t < openUntil) break;
                  } else { failures = 0; probe = null; break; }
                }
              });
              return { failedAttempts, waitSum, direct, n: reqs.length };

            const a = sim(false), b = sim(true);

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
