const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  summary: `<h3>Tóm tắt bài</h3>

<p><b>RouteLLM</b>: chọn cặp model mạnh, yếu, một loại router (matrix factorization, Elo, BERT, causal LLM) và một ngưỡng; ngưỡng quyết định tỷ lệ đi tới model mạnh, hiệu chỉnh trên dữ liệu. Router học từ Arena ngang ngẫu nhiên trên MMLU. <b>RouterBench</b>: hơn 405.000 kết quả suy luận tính sẵn, model năm 2024: hợp để so phương pháp, không hợp để chọn model năm 2026.</p>
<h4>Ba điều kiện để router tự dựng đáng làm</h4>

<tr><td>OpenAI Scale Tier, Reserved Tier</td><td>Capacity dễ dự đoán hơn (Reserved cho GPT-5.6 trở lên)</td><td>Không đổi cách xử lý <code>slow_down</code>: vẫn theo <code>Retry-After</code>, tăng traffic từ từ</td></tr>

<tr><td>Batch</td><td>Rẻ hơn 50%, chạy ngoài capacity thường</td><td>Không phải đích fallback cho request tương tác; <code>fallbacks</code> trong batch cho kết quả errored; refusal trong batch không có fallback credit</td></tr>

<div class="verdict"><b>Thứ tự nên thử:</b> bảng tĩnh theo loại tác vụ, và một model mạnh với effort thấp, trước khi dựng router học được. Dời việc không gấp sang batch trước khi mua capacity.</div>`,
  why: {
    c: 'Bắt đầu bằng bảng tĩnh theo loại tác vụ, vì ứng dụng thường đã biết loại tác vụ từ endpoint. Chỉ dựng classifier khi bảng tĩnh để lại một khoảng rõ ràng và có dữ liệu có nhãn để hiệu chỉnh ngưỡng. Về capacity, dời job không gấp sang batch trước: rẻ hơn 50% và rút tải khỏi giờ cao điểm.',
    s: 'Router mua sẵn hoặc học từ dữ liệu công khai mà không đo trên traffic ShopViet: RouteLLM học từ Arena ngang ngẫu nhiên trên MMLU. LLM làm router cho mọi request: thêm một lời gọi model, dễ ăn hết phần tiết kiệm. Mua Priority Tier cho Sonnet 5.5: không được hỗ trợ, và Anthropic không bán cam kết mới.',

  deep: [
    {
      q: 'Router có mấy dạng, và dạng nào đắt nhất?',
      a: `<p>README liệt kê ba dạng, theo chi phí tăng dần: bảng tĩnh (miễn phí, không độ trễ), classifier nhẹ (thêm vài chục mili giây), và LLM làm router (thêm một lời gọi model cho mỗi request).</p>

      viz(box) {
        const S = { rin: 400, easy: 60 }, out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });

      take: 'Với chênh giá 20 lần giữa Sonnet 5.5 và Haiku 5.5, router bằng Haiku vẫn rẻ so với phần tiết kiệm. Nhưng bảng tĩnh cho cùng lợi ích ở những endpoint đã biết loại tác vụ, với giá bằng không.'

    {
      q: 'Vì sao bảng tĩnh theo loại tác vụ lại mạnh đến vậy?',
      a: `<p>Paper của Lee (arXiv 2608.23023, tháng 8/2026) cho 14 model trả lời 294 câu thuộc 7 loại tác vụ, rồi chạy lại y hệt. 5,37% trong 4.116 cặp model-câu hỏi đổi kết quả giữa hai lần. Chỉ tính câu đúng ở cả hai lần thì chỉ <b>29 câu</b> có thể cải thiện bằng routing. Một bảng cố định gán mỗi loại tác vụ một model cải thiện 21 trong 29 câu đó.</p>
<p>Ý chính: phần lớn khác biệt giữa các model nằm ở <b>loại tác vụ</b>, không ở từng câu. Mà loại tác vụ thì ứng dụng thường đã biết từ endpoint, không cần đoán từ prompt. Tác giả tự ghi rằng mọi thứ được khớp và chấm trên cùng 294 câu, không có holdout, nên đây là gợi ý, chưa phải kết luận chung.</p>`,
      viz(box) {
        box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Cấu hình</th><th>Câu đúng / 294</th><th>Chi phí mỗi lượt chạy</th></tr><tr><td>Model đơn lẻ tốt nhất</td><td class="mono">245</td><td class="mono">7,69 USD</td></tr><tr><td><b>Bảng tĩnh theo loại tác vụ</b></td><td class="mono ok">262</td><td class="mono ok">3,33 USD</td></tr>' })]),
          hbars([['Model đơn lẻ: câu đúng', 245], ['Bảng tĩnh: câu đúng', 262, true]], { max: 294, fmt: (v) => v + '/294' }),

          el('div', { class: 'cap', text: 'Số từ README §1.4, trích Lee 2026. Không có holdout: cùng 294 câu vừa dùng để chọn bảng vừa dùng để chấm.' }));
      },
      take: 'Thử bảng tĩnh trước. Nếu bảng tĩnh đã nằm trên đường đánh đổi của router (hình chính), router học được không có chỗ để thắng.'
    },
    {
      q: 'Ngưỡng của router chọn thế nào? Chọn trên tập nào?',
      a: `<p>Trong RouteLLM, ngưỡng quyết định tỷ lệ request đi tới model mạnh, và được hiệu chỉnh trên dữ liệu có sẵn. Cách làm phổ biến: muốn khoảng 40% traffic đi Sonnet 5.5 thì lấy phân vị 60% của điểm classifier làm ngưỡng. Ví dụ: xếp điểm của 100 câu từ thấp tới cao, lấy điểm của câu thứ 60 làm ngưỡng; 40 câu điểm cao hơn sẽ đi Sonnet.</p>
<p>Bẫy ở chỗ hiệu chỉnh trên tập nào. Hình dưới chia 40 câu của ShopViet thành nửa dev (20 câu đầu) và nửa test (20 câu sau). Ngưỡng được chọn trên dev để đạt tỷ lệ mục tiêu, rồi áp lên test. Hai nửa có phân phối hơi khác nhau, nên tỷ lệ thực trên test lệch khỏi mục tiêu. Với traffic thật, độ lệch đến từ ngày khác, nhóm khách khác.</p>
<p>POC của lab đo điều này bằng classifier thật (TF-IDF + logistic regression học trên 20 câu dev): ngưỡng 0,45 chọn trên dev gửi <b>35%</b> câu sang Sonnet, áp lên 20 câu test thì thành <b>55%</b>, và chi phí tăng từ <b>2,03 lên 3,40 USD</b> mỗi 1.000 request. Tức là khoản tiết kiệm bạn báo cáo từ dev có thể chỉ còn khoảng một nửa khi chạy thật. Lưu ý: 20 câu là rất ít (mỗi câu 5 điểm), nên đây là minh hoạ chiều lệch, không phải con số dự báo.</p>`,
      viz(box) {
        const S = { tgt: 40 }, out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
        function draw() {
          const D = box._data, dev = D.slice(0, 20).map((x) => x.score).sort((a, b) => a - b);
          const k = Math.min(19, Math.max(0, Math.round(dev.length * (1 - S.tgt / 100))));
          const th = S.tgt >= 100 ? -Infinity : S.tgt <= 0 ? Infinity : dev[k];
          const share = (arr) => (arr.filter((x) => x.score >= th).length / arr.length) * 100;
          const sd = share(D.slice(0, 20)), st = share(D.slice(20));
          out.innerHTML = `<span>Ngưỡng chọn trên dev: <b>${isFinite(th) ? th.toFixed(2) : (th > 0 ? 'không câu nào' : 'mọi câu')}</b></span><span>Dev gửi Sonnet: <b>${sd.toFixed(0)}%</b></span><span>Test gửi Sonnet: <b class="${Math.abs(st - S.tgt) >= 15 ? 'bad' : ''}">${st.toFixed(0)}%</b></span>`;
          cap.textContent = Math.abs(st - S.tgt) >= 15 ? 'Tỷ lệ trên test lệch từ 15 điểm trở lên so với mục tiêu: ngưỡng chỉ đúng trên phân phối nó được hiệu chỉnh. Trong hệ thống thật: theo dõi phân bố trường model theo ngày và hiệu chỉnh lại khi lệch.' : 'Với 20 câu mỗi nửa, mỗi câu là 5 điểm phần trăm. Tập thật cần lớn hơn nhiều.';
        }
        box._data = routerData(0.2, 0);
        box.append(el('div', { class: 'row' }, [slider('Mục tiêu gửi Sonnet 5.5', 10, 90, 5, S.tgt, (v) => { S.tgt = v; draw(); }, (v) => v + '%').node]), out, cap);
        draw();
      },
      take: 'Ngưỡng là con số gắn với một phân phối. Hiệu chỉnh trên dev, đo trên test tách riêng, và đo lại khi traffic đổi.'
    },
    {
      q: 'Mua router đã huấn luyện sẵn trên dữ liệu công khai, dùng ngay cho ShopViet được không?',
      a: `<p>README dẫn kết quả RouteLLM: router chỉ huấn luyện bằng dữ liệu Chatbot Arena <b>tệ ngang router ngẫu nhiên</b> trên MMLU và GSM8K, vì câu hỏi nằm ngoài phân phối huấn luyện. Thêm khoảng 1.500 mẫu có nhãn từ tập validation của MMLU (dưới 2% dữ liệu huấn luyện) thì router mới vượt ngẫu nhiên.</p>
<p>Traffic tiếng Việt về đơn hàng và laptop của ShopViet khác Arena nhiều. Hình dưới mô phỏng điều đó: kéo "độ lệch phân phối" thì điểm classifier dần thành nhiễu. Router ngẫu nhiên là router gửi đúng cùng tỷ lệ câu sang Sonnet nhưng chọn câu bằng tung đồng xu.</p>`,
      viz(box) {
        const S = { sh: 0 }, out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
        function draw() {
          const D = routerData(0.15, S.sh / 100), th = 0.5;
          const sent = D.filter((x) => x.score >= th), share = sent.length / D.length;
          const acc = D.reduce((s, x) => s + (x.score >= th ? x.strongOk : x.weakOk), 0) / D.length;
          const rnd = D.reduce((s, x) => s + share * x.strongOk + (1 - share) * x.weakOk, 0) / D.length;

  mount(stage) {
    const PRICE = { haiku: [0.10, 0.50, 0.01], sonnet: [2, 10, 0.10] };
    const S = { kind: 'clf', noise: 0.2, th: 0.5 };
    const tbl = el('div', { class: 'tbl sum', style: 'border:0;margin:0;padding:0;max-height:320px;overflow-y:auto' }), svg = el('svg', { class: 'canvas', viewBox: '0 0 560 250', role: 'img', 'aria-label': 'Đường đánh đổi chi phí và câu đúng' });
    const stat = el('div', { class: 'stat' }), flag = el('div', { class: 'hint' });
    const STATIC = { don: 'haiku', chinhsach: 'haiku', sosanh: 'sonnet', kythuat: 'sonnet', khieunai: 'sonnet' };
    const tok = (x) => 1200 + Math.ceil(x.text.length / 3);
    const callCost = (x, m) => (tok(x) * PRICE[m][0] + x.out * PRICE[m][1]) / 1e6;
    const routerCost = (x) => ((300 + Math.ceil(x.text.length / 3)) * PRICE.haiku[0] + 5 * PRICE.haiku[1]) / 1e6;
    function evalCfg(D, pick, extra) {
      let ok = 0, cost = 0, strong = 0, hardWeak = 0, hardWeakWrong = 0, right = 0;
      D.forEach((x) => {
        const m = pick(x); cost += callCost(x, m) + (extra ? extra(x) : 0);
        const good = m === 'sonnet' ? x.strongOk : x.weakOk; ok += good;
        if (m === 'sonnet') strong++;
        if (x.hard && m === 'haiku') { hardWeak++; if (!good) hardWeakWrong++; }
        if ((m === 'sonnet') === x.hard) right++;
      });
      return { acc: (ok / D.length) * 100, cost: (cost / D.length) * 1000, strong: strong / D.length, hardWeak, hardWeakWrong, route: (right / D.length) * 100 };
    }
    function render() {
      const noise = S.kind === 'llm' ? 0.08 : S.noise, D = routerData(noise, 0);
      const pick = S.kind === 'static' ? (x) => STATIC[x.type] : (x) => (x.score >= S.th ? 'sonnet' : 'haiku');
      const cur = evalCfg(D, pick, S.kind === 'llm' ? routerCost : null);
      const weak = evalCfg(D, () => 'haiku'), strong = evalCfg(D, () => 'sonnet'), stat0 = evalCfg(D, (x) => STATIC[x.type]);
      const curve = [];
      for (let t = 0; t <= 1.0001; t += 0.02) curve.push(evalCfg(D, (x) => (x.score >= t ? 'sonnet' : 'haiku'), S.kind === 'llm' ? routerCost : null));
      const W = 560, H = 250, P = 40, maxC = strong.cost * 1.15 + (S.kind === 'llm' ? 0.2 : 0), minA = Math.min(weak.acc, ...curve.map((c) => c.acc)) - 5;
      const X = (c) => P + (c / maxC) * (W - P - 10), Y = (a) => H - 30 - ((a - minA) / (100 - minA)) * (H - 50);
      const pt = (c, col, lab, r, dy) => [el('circle', { cx: X(c.cost), cy: Y(c.acc), r, fill: col }), el('text', { x: Math.min(W - 120, X(c.cost) + 7), y: Y(c.acc) + (dy || -6), text: lab })];
      svg.replaceChildren(
        el('line', { x1: P, x2: W - 10, y1: H - 30, y2: H - 30, stroke: 'var(--line)' }), el('line', { x1: P, x2: P, y1: 10, y2: H - 30, stroke: 'var(--line)' }),
        el('text', { x: P, y: H - 8, class: 'mute', text: 'Chi phí / 1.000 request (USD) →' }), el('text', { x: 4, y: 16, class: 'mute', text: '% đúng' }),
        ...[minA, (minA + 100) / 2, 100].map((a) => el('text', { x: 4, y: Y(a) + 4, class: 'mute', text: a.toFixed(0) })),
        ...[0, maxC / 2, maxC].map((c) => el('text', { x: X(c) - 8, y: H - 16, class: 'mute', text: c.toFixed(2) })),
        el('path', { d: curve.map((c, i) => (i ? 'L' : 'M') + X(c.cost).toFixed(1) + ' ' + Y(c.acc).toFixed(1)).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, opacity: S.kind === 'static' ? 0.35 : 1 }),

}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
