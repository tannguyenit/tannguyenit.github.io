const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<tr><td>a. Request body</td><td>Opus 5.5, Sonnet 5.5 từ chối forced <code>tool_choice</code>; <code>between_tools</code> chỉ Sonnet 5.5 nhận; <code>temperature</code> 400 trên mọi model từ API <code>2026-10-21</code>; prefill 400 từ Claude 4.6</td></tr>
<tr><td>b. Tokenizer, độ dài</td><td>Haiku 5.5 tốn khoảng 30% token hơn Haiku 4.5; thinking tính vào <code>max_tokens</code></td></tr>
<tr><td>c. Prompt cache</td><td>Tách theo model; ghi 1,25 lần input, đọc khoảng 0,1 lần; ngưỡng tối thiểu 512 đến 4.096 token tuỳ model</td></tr>
<tr><td>d. Thinking block</td><td>Model đích không đọc được thì bị bỏ lặng lẽ; Opus 5.5 sang Opus 4.8 là chiều mất reasoning</td></tr>
<tr><td>e. Refusal, stop_reason</td><td>Refusal là HTTP 200; <code>max_tokens</code>, <code>pause_turn</code> cần nhánh riêng</td></tr>
<tr><td>f. Giọng</td><td>Model mới ngắn gọn, trực tiếp hơn; chất lượng đổi theo cách khó thấy trên dashboard lỗi</td></tr>
<tr><td>g. Tool calling</td><td>Khác provider: format, ép gọi tool, strict schema đều khác</td></tr></table></div>
<div class="verdict"><b>Điểm cần nhớ:</b> thử bảng tĩnh trước khi huấn luyện router. Request template dựng theo model đích, không dùng chung một body cho cả chuỗi. Model dự phòng là model production, chỉ ít traffic hơn: chạy eval trên nó.</div>`,
    why: {
      c: 'Bảng tĩnh theo loại tác vụ làm baseline, vì ứng dụng thường đã biết loại tác vụ từ endpoint. Chuỗi fallback lọc theo bảng capability trong code, request dựng theo model đích, lịch sử append-only, ghim hội thoại vào model đang phục vụ.',
      s: 'Router học từ dữ liệu công khai rồi dùng ngay trên traffic tiếng Việt: có thể ngang ngẫu nhiên ngoài phân phối. Cascade khi phần lớn traffic là câu khó: trả tiền hai lần. Một body cho cả chuỗi: 400 ở model dự phòng đúng lúc sự cố. Đổi system prompt theo model giữa hội thoại: làm hỏng thinking block.',
      p: 'Bảng tĩnh không tận dụng được chênh lệch độ khó trong cùng một loại tác vụ. Duy trì bảng capability theo từng đợt phát hành model và test request thật trong CI. Chạy eval định kỳ cho từng model trong router và trong chuỗi.'
    },
    deep: [
      {
        q: 'Muốn gửi câu dễ cho model rẻ, bắt đầu từ đâu?',
        a: `<p>Từ cách rẻ nhất. README §2.3 xếp ba dạng router theo chi phí tăng dần: <b>bảng tĩnh theo loại tác vụ</b> (không thêm request, không thêm độ trễ, dễ debug), <b>classifier nhẹ</b> (thêm vài chục mili giây), <b>LLM làm router</b> (đắt và chậm nhất). ShopViet đã biết loại tác vụ từ nút khách bấm hoặc endpoint được gọi; không cần đoán từ prompt.</p><p>Ba điều kiện để router tự dựng đáng làm: traffic đa dạng thật mà ứng dụng không biết trước câu nào khó; chênh giá đủ lớn để bù chi phí router cộng chất lượng mất khi đoán sai; có dữ liệu có nhãn từ traffic thật. Trong hình chính, bật "LLM nhỏ làm router" và so dòng classifier với bảng tĩnh.</p>`,
        take: 'Bảng tĩnh là baseline. Router chỉ đáng giữ khi thắng baseline đó trên traffic thật.'
      },
      {
        q: 'RouteLLM nói giảm chi phí hơn 2 lần mà không mất chất lượng. Sao không dùng luôn?',
        a: `<p>Vì con số đó đo trên phân phối router đã thấy. RouteLLM học từ khoảng 65.000 cặp so sánh của Chatbot Arena, chọn giữa GPT-4 và Mixtral 8x7B (README §1.4). Trên MMLU, mọi router chỉ học từ Arena tệ ngang router ngẫu nhiên; phải thêm khoảng 1.500 mẫu có nhãn từ MMLU (dưới 2% dữ liệu huấn luyện) mới vượt ngẫu nhiên. GSM8K cũng vậy.</p><p>Traffic tiếng Việt của ShopViet về đơn hàng, đổi trả, laptop, tai nghe gần như chắc chắn khác Chatbot Arena. Bedrock Intelligent Prompt Routing còn ghi rõ chỉ tối ưu cho prompt tiếng Anh (README §2.2). Trong hình chính, kéo "Độ chính xác classifier" về 50% để thấy router ngẫu nhiên trông thế nào.</p>`,
        take: 'Router học được chỉ tốt trên phân phối nó đã thấy. Đo trên traffic của bạn trước khi tin.'
      },
      {
        q: 'Cascade thử Haiku trước, có vẻ luôn rẻ hơn. Có khi nào đắt hơn không?',
        a: `<p>Có. Câu nào leo thang thì trả tiền Haiku cộng Sonnet, và chờ cả hai (README §1.4). FrugalGPT báo tới 98% giảm chi phí trên benchmark của paper, nơi phần lớn câu dễ. Kéo tỉ lệ leo thang để thấy điểm hoà vốn với "luôn Sonnet 5.5" cho một request tư vấn (4.000 token vào, 500 ra, giả định).</p>`,
        viz(box) {
          const out = el('div');
          const t = TASKS[2];
          const draw = (e) => {
            const cas = reqCost('haiku', t) + e * reqCost('sonnet', t), son = reqCost('sonnet', t);
            const lat = M.haiku.lat + e * M.sonnet.lat;
            out.replaceChildren(hbars([['Cascade, leo thang ' + vn(e * 100) + '%', cas * 1000, true], ['Luôn Sonnet 5.5', son * 1000, false]], { max: Math.max(cas, son) * 1000, fmt: (v) => usd(v, 3) + ' / 1.000 req' }),
              el('div', { class: 'cap', html: `${cas > son ? '<b style="color:var(--bad)">Cascade đắt hơn luôn Sonnet.</b> ' : ''}Hoà vốn khi tỉ lệ leo thang bằng ${pc(1 - reqCost('haiku', t) / son)}. Độ trễ trung bình cascade ${vn(lat, 2)} s so với ${vn(M.sonnet.lat, 1)} s (giả định); câu leo thang chờ ${vn(M.haiku.lat + M.sonnet.lat, 1)} s. Haiku 5.5 rẻ hơn Sonnet 5.5 20 lần nên cascade hiếm khi đắt hơn về tiền; cái giá chính là độ trễ của câu khó.` }));
          };
          box.append(el('div', { class: 'row' }, [slider('Tỉ lệ leo thang', 0, 1, 0.01, 0.4, draw, (v) => vn(v * 100) + '%').node]), out);
          draw(0.4);
        },
        take: 'Cascade rẻ khi phần lớn câu dừng ở tầng đầu. Câu khó trả giá bằng độ trễ cộng dồn.'
      },
      {
        q: 'Paper của Lee nói "phần lớn khoảng cách routing là loại tác vụ". Con số cụ thể là gì?',
        a: `<p>README §1.4: 14 model, 294 câu thuộc 7 loại tác vụ, ba ngôn ngữ, chạy hai lần không đổi gì. 5,37% trong 4.116 cặp model-câu hỏi đổi kết quả giữa hai lần chạy. Chỉ tính câu đúng ở cả hai lần thì chỉ 29 câu có thể cải thiện bằng routing; một bảng cố định gán mỗi loại tác vụ một model cải thiện 21 trong 29 câu. Tác giả tự ghi không có holdout.</p>`,
        viz(box) {
          const flips = Math.round(4116 * 0.0537);
          box.append(hbars([['Cặp đổi kết quả khi chạy lại y hệt', flips, false], ['Câu có thể cải thiện bằng routing', 29, false], ['Bảng tĩnh cải thiện được', 21, true]], { max: flips, fmt: vn }),
            hbars([['Bảng tĩnh: đúng 262/294', 3.33, true], ['Model đơn lẻ tốt nhất: đúng 245/294', 7.69, false]], { max: 7.69, fmt: (v) => usd(v) + ' / lượt chạy' }),
            el('div', { class: 'cap', text: `Số cặp đổi kết quả (${flips}) lớn gấp ${vn(flips / 29, 1)} lần số câu routing có thể cải thiện. Nhiễu giữa các lần chạy có thể lớn hơn phần router mang lại: so router với baseline phải chạy lặp (README §3.5).` }));
        },
        take: 'Nhiễu có thể lớn hơn hiệu ứng. Bảng tĩnh lấy phần lớn lợi ích với rủi ro thấp nhất.'
      },
      {
        q: 'Có cách nào đơn giản hơn cả router không?',
        a: `<p>README §1.4: model mới có nút <code>effort</code> (Claude: <code>output_config.effort</code> từ <code>low</code> đến <code>max</code>). Trước khi dựng router giữa model rẻ và đắt, đo một model mạnh với effort thấp cho tác vụ dễ. Một model nghĩa là một namespace cache, một bộ tham số, một bộ prompt; cascade qua nhiều model mất cache ở mỗi lần đổi và mỗi model thêm vào là một tổ hợp tham số phải giữ tương thích.</p><p>Và tính chi phí theo tác vụ hoàn thành, không theo request. Hình dưới: nếu model rẻ cần thêm lượt mới xong việc (khách hỏi lại, agent gọi lại), chi phí mỗi tác vụ tăng theo số lượt.</p>`,
        viz(box) {
          const out = el('div');
          const t = TASKS[1];
          const draw = (turns) => {
            const cheap = reqCost('haiku', t) * turns, strong = reqCost('sonnet', t);
            out.replaceChildren(hbars([['Haiku 5.5, ' + vn(turns, 1) + ' lượt mỗi tác vụ', cheap * 1000, true], ['Sonnet 5.5, 1 lượt', strong * 1000, false]], { max: Math.max(cheap, strong) * 1000, fmt: (v) => usd(v, 3) + ' / 1.000 tác vụ' }),
              el('div', { class: 'cap', text: `Với giá §2.1, Haiku 5.5 vẫn rẻ hơn tới khi cần khoảng ${vn(strong / reqCost('haiku', t), 0)} lượt mỗi tác vụ. Về tiền, model rẻ thắng xa; cái giá thật là trải nghiệm của khách phải hỏi lại, thứ chỉ eval mới thấy.` }));
          };
          box.append(el('div', { class: 'row' }, [slider('Số lượt model rẻ cần để xong', 1, 5, 0.1, 1.5, draw, (v) => vn(v, 1)).node]), out);
          draw(1.5);
        },
        take: 'So theo tác vụ hoàn thành, và tính cả cái giá không nằm trên hoá đơn.'
      },
      {
        q: 'Prompt cache tách theo model. Router gửi 35% traffic sang Haiku thì cache có sao không?',
        a: `<p>Mỗi model trong router có namespace cache riêng (README §1.5c). Prefix của ShopViet được cache ở Sonnet 5.5 không giúp gì cho Haiku 5.5; mỗi model phải tự làm ấm cache của mình, và traffic chia nhỏ thì mỗi namespace nhận ít request hơn để giữ cache ấm. Ngưỡng tối thiểu để được cache cũng khác: 512 token cho các model 5.x hiện tại, 1.024 cho Opus 4.8 và Sonnet 5, 2.048 cho Opus 4.7, 4.096 cho Haiku 4.5, Opus 4.6 và 4.5; prompt ngắn hơn ngưỡng không được cache và <b>không báo lỗi</b>. Kéo độ dài prefix để xem model nào âm thầm không cache.</p>`,
        viz(box) {
          const out = el('div');
          const ms = [['Model 5.x hiện tại', 512], ['Opus 4.8, Sonnet 5', 1024], ['Opus 4.7', 2048], ['Haiku 4.5, Opus 4.6, 4.5', 4096]];
          const draw = (len) => {
            out.innerHTML = table(['Model', 'Ngưỡng', 'Prefix ' + vn(len) + ' token'], ms.map(([n, th]) => [n, vn(th), len >= th ? '<span class="ok">được cache</span>' : '<span class="bad">không cache, không báo lỗi</span>'])) +
              (len < 4096 && len >= 512 ? '<div class="cap"><b style="color:var(--warn)">Cùng prompt, model này cache còn model kia không.</b> Fallback sang model cũ hơn có thể vừa mất cache vừa không bao giờ cache lại được. Trong hệ thống thật: đo cache hit rate theo model (README §3.2, mục 5).</div>' : '');
          };
          box.append(el('div', { class: 'row' }, [slider('Độ dài prefix (token)', 200, 6000, 100, 1500, draw, vn).node]), out);
          draw(1500);
        },
        take: 'Mỗi model thêm vào router là một cache phải tự làm ấm, với ngưỡng riêng.'
      },
      {
        q: 'Hội thoại đang chạy trên Opus 5.5 thì fallback sang Opus 4.8. Model mới có biết các lượt trước đã nghĩ gì không?',
        a: `<p>Không. README §1.5d: Opus 4.8 không đọc được thinking block của Opus 5.5; API bỏ block đó cho request ấy mà không báo lỗi, không tính tiền, request vẫn thành công. Chiều ngược lại hẹp: ngoài Fable 5.2, Mythos 5.2, Fable 5.1, Mythos 5.1 trên Claude API, không model nào đọc block của Opus 5.5. Fallback thường đi từ model mới xuống cũ, đúng chiều mất reasoning.</p><p>API không sửa mảng <code>messages</code>, nên block vẫn trong lịch sử và dùng lại được khi hội thoại quay về Opus 5.5. Vì vậy đừng xoá thinking khỏi lịch sử khi đổi model. Và đừng đổi <code>system</code> hay <code>tools</code> theo model đích giữa hội thoại: trên model có preserved thinking, block cũ có thể không qua prefix check. Trong bảng fallback ở hình chính, bật "Giữa hội thoại" và "Đổi system theo model đích" để thấy dòng d.</p>`,
        take: 'Fallback giữa hội thoại là đổi người trả lời giữa chừng mà không bàn giao. Ghim hội thoại vào model đang phục vụ khi có thể.'
      },
      {
        q: 'Request hợp lệ, model dự phòng trả lời, dashboard xanh. Còn gì có thể sai?',
        a: `<p>Ba thứ không hiện trên dashboard lỗi. <b>Refusal</b> là HTTP 200 với <code>stop_details.category</code>; với nhóm <code>reasoning_extraction</code>, tài liệu nói không có model fallback khuyến nghị, nên sửa prompt thay vì retry (README §1.5e). <b>stop_reason</b> khác: <code>max_tokens</code> và <code>model_context_window_exceeded</code> là output bị cắt, <code>pause_turn</code> là server tool chưa xong; gộp tất cả vào "lỗi" hay "thành công" đều sai. <b>Giọng</b>: "Claude 4 and later models have a more concise, direct communication style and need explicit direction" (§1.5f).</p><p>Sang provider khác thì thêm <b>tool calling</b>: format, cách ép gọi tool, strict schema, trạng thái reasoning đi kèm tool call đều khác; gateway dịch format giúp request chạy được, nhưng không dịch được hành vi (§1.5g).</p>`,

      }
    ],
    poc: {
      goal: "Chi phí năm chính sách routing tính bằng giá thật ở <code>docs/cost-optimization/README.md</code> §2.1; nhiễu so với hiệu ứng router theo số của Lee 2026; chi phí ghi lại cache khi fallback; token đếm thật bằng hai tokenizer; và cùng một body gửi qua SDK tới bốn model. <b>Tỉ trọng tác vụ, token trung bình, chất lượng mỗi model là giả định như lab; các ô 400 ở bảng 5 là quy tắc README mà server giả áp, không phải API thật.</b>",
      file: "docs/model-routing/pocs/03_routing_fallback_behavior.py",
      run: "uv run docs/model-routing/pocs/03_routing_fallback_behavior.py",
      needs: "chỉ <code>uv</code> và CPU, miễn phí.",
      output: "Giá thật từ docs/cost-optimization/README.md §2.1. GIẢ ĐỊNH (như lab 03): tỉ trọng loại tác vụ, token trung bình,\ntỉ lệ câu khó, chất lượng mỗi model trên câu dễ/khó, độ chính xác router 85%. Phần 4 đếm token thật bằng tiktoken;\nphần 5 gửi request thật qua SDK anthropic 2.6.0 tới server giả áp quy tắc §1.5a / §3.2 của README.\n\n== 1. Năm chính sách routing, 40.000 request/ngày, 30 ngày ==\nChính sách                  Chi phí/tháng  so Sonnet  Chất lượng TB (giả định)  Nhóm tệ nhất\n--------------------------  -------------  ---------  ------------------------  ----------------------------\nLuôn Opus 5.5               20.474,40 USD  200%       95,4%                     91,8% (Khiếu nại nhiều bước)\nLuôn Sonnet 5.5             10.237,20 USD  100%       93,7%                     88,5% (Khiếu nại nhiều bước)\nBảng tĩnh theo loại tác vụ  5.938,26 USD   58%        90,6%                     88,3% (Chính sách đổi trả)\nClassifier độ khó 85%       4.406,36 USD   43%        91,0%                     85,2% (Khiếu nại nhiều bước)\nCascade Haiku → Sonnet      3.343,87 USD   33%        92,6%                     85,7% (Khiếu nại nhiều bước)\n\n== 2. Lee 2026 (README §1.4): hiệu ứng router so với nhiễu chạy lại ==\nBảng tĩnh 262/294 đúng, 3,33 USD; model đơn tốt nhất 245/294, 7,69 USD → rẻ hơn 2,31 lần, hơn 17 câu (5,8 điểm).\nNhưng chạy lại y hệt: 5,37% × 4.116 cặp = 221 cặp đổi kết quả, gấp 7,6 lần 29 câu routing có thể cải thiện.\n\n== 3. Fallback làm mất prompt cache: prefix 5.800 token (giả định), traffic 25 request/phút trong 30 phút sự cố ==\nĐích                                       Request đầu (ghi cache)  Request sau (đọc)  Prefix cho 750 request\n-----------------------------------------  -----------------------  -----------------  ----------------------\nclaude-sonnet-5-5 (model chính, cache ấm)  —                        0,00058 USD        0,4350 USD\nclaude-opus-5-5                            0,0290 USD               0,00116 USD        0,8978 USD\nclaude-haiku-5-5                           0,00072 USD              0,00006 USD        0,0442 USD\ngpt-6.1-sol                                0,0116 USD               0,00058 USD        0,4460 USD\nOpenAI không tính phí ghi cache: request đầu trả giá input đầy đủ. TTL 5 phút: traffic thưa hơn TTL thì mỗi request lại là lần ghi.\n\n== 4. Tokenizer khác nhau: cùng câu trả lời tiếng Việt, đếm bằng hai tokenizer thật ==\nTokenizer    NFC  NFD\n-----------  ---  ---\ncl100k_base  95   184\no200k_base   64   144\nClaude không dùng hai tokenizer này; con số chỉ cho thấy cùng văn bản đổi số token theo tokenizer → đếm lại với model đích.\n\n== 5. Cùng một request body cho cả chuỗi, hay body dựng theo model đích ==\nTính năng trong body    sonnet-5-5  opus-5-5  haiku-5-5  sonnet-5\n----------------------  ----------  --------  ---------  --------\nforced tool_choice      400         400       200        200\nthinking between_tools  200         400       400        400\nthinking disabled       400         400       200        200\ntemperature 0.2         400         400       400        400\nprefill assistant       400         400       400        400\nServer nhận 20 request thật; các ô 400 là quy tắc README §1.5a mà server giả áp, không phải API thật.\nServer giả đã dừng.\n\nRút ra: bảng tĩnh theo loại tác vụ lấy phần lớn khoản tiết kiệm mà không thêm request; router 85% và cascade rẻ hơn nữa\nnhưng kéo nhóm khiếu nại xuống (cascade còn bắt câu khó chờ hai model). Hiệu ứng của router nhỏ hơn nhiễu chạy lại. Mỗi lần đổi model: cache phải ghi lại (một lần mỗi TTL, rồi đọc),\nsố token đổi theo tokenizer, và một body dùng chung vỡ 400 ở ít nhất một model trong chuỗi với mọi tính năng trên.",
      measured: true,

function terms(list) {

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}
