const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  const DT = 0.1, HORIZON = 60;
  const STRATS = [
    ['immediate', 'Retry ngay, không chờ'],
    ['nojitter', 'Exponential backoff, không jitter'],

    ['decor', 'Decorrelated jitter'],
    ['ra', 'Chờ đúng retry-after'],
    ['rajit', 'retry-after + jitter phía sau']
  ];

  function simulate(o) {
    const rnd = seeded(o.seed);
    const nb = Math.round(HORIZON / DT);
    const bins = Array.from({ length: nb }, () => []);
    const cl = [];
    for (let i = 0; i < o.n; i++) {
      const s = rnd() * o.spread;
      cl.push({ s, a: 0, prev: o.base, done: -1, gave: false });
      bins[Math.floor(s / DT)].push(i);
    }
    const sent = new Array(nb).fill(0), ok = new Array(nb).fill(0), capB = new Array(nb).fill(0);
    let credit = 0, retries = 0, total = 0, gaveUp = 0, budgetCut = 0;
    const budget = o.budget >= 5 ? Infinity : o.budget * o.n;
    const wait = (c, ra) => {
      const i = c.a - 1;
      if (o.strat === 'immediate') return 0;
      if (o.strat === 'nojitter') return Math.min(o.cap, o.base * 2 ** i);
      if (o.strat === 'full') return rnd() * Math.min(o.cap, o.base * 2 ** i);
      if (o.strat === 'decor') { c.prev = Math.min(o.cap, o.base + rnd() * (c.prev * 3 - o.base)); return c.prev; }

      const capRate = t < o.outage ? 0 : o.capacity * Math.min(1, (t - o.outage + DT) / o.ramp);
      capB[k] = capRate * DT;
      credit = Math.min(credit, 1) + capRate * DT;
      const list = bins[k];
      for (let j = 0; j < list.length; j++) {
        const c = cl[list[j]];
        c.a++; total++; sent[k]++;
        if (credit >= 1) { credit -= 1; ok[k]++; c.done = t + DT / 2; continue; }
        if (c.a >= o.maxAtt) { c.gave = true; gaveUp++; continue; }
        if (retries >= budget) { c.gave = true; gaveUp++; budgetCut++; continue; }
        retries++;
        const ra = t < o.outage ? o.ra : 1;
        const w = wait(c, ra);
        const nk = Math.max(k + 1, Math.floor((t + Math.max(w, DT)) / DT));
        if (nk < nb) bins[nk].push(list[j]);
      }

    const lat = cl.filter((c) => c.done >= 0).map((c) => c.done - c.s).sort((a, b) => a - b);
    const q = (p) => (lat.length ? lat[Math.min(lat.length - 1, Math.floor(p * lat.length))] : NaN);
    const pending = o.n - lat.length - gaveUp;

        a: `<p>Đúng luật, nhưng có một hệ quả README không nói thẳng: nếu 500 client cùng nhận <code>retry-after: 5</code> trong cùng một giây, chúng sẽ cùng quay lại trong cùng một giây. Chọn "Chờ đúng retry-after" ở hình chính để thấy cột đỏ dựng đứng. retry-after là mức <i>tối thiểu</i> (README §1.3), nên cộng thêm jitter <i>sau</i> mức đó vẫn tôn trọng server. Chọn "retry-after + jitter phía sau" để so: trong POC bài này, cách đó phục vụ đủ 500/500 khách với ít request nhất, vì không lần thử nào rơi vào lúc provider còn sập.</p><p>SDK Python của Claude chờ đúng giá trị retry-after, không có trần riêng; đo với <code>retry-after: 3</code> thì SDK chờ 3,02 s. Với <code>retry-after: 120</code>, khách chờ thêm hai phút. README Tra cứu nhanh: quá ngưỡng bạn chịu được (ví dụ 10 s) hoặc quá phần deadline còn lại thì không chờ, sang model ở bucket khác.</p>`,

      {

        a: `<p>Vì các tầng nhân với nhau. Ứng dụng gọi gateway, gateway gọi SDK, SDK gọi provider; mỗi tầng 3 lần thử thì một lần bấm thành 27 request (README §1.3). Nhân với 500 khách đang bấm "thử lại" trong flash sale là 13.500 request lên provider vừa hồi phục. Trong hình chính, kéo "Số lần thử tối đa" lên 10 với "Retry ngay" để thấy mỗi tầng thêm vào làm cột đỏ dày thế nào.</p><p>LiteLLM issue #19985 (tháng 1/2026): router có cả <code>num_retries</code> lẫn <code>fallbacks</code>, model fallback hết lượt retry thì logic fallback chạy lại, lặp không dừng. Issue đã đóng ngày 2/2/2026, bài học còn nguyên: trần cho cả chuỗi, và test với mock lỗi để đếm tổng request thực gửi đi.</p>`,

    poc: {
      goal: "Phần A, B: SDK <code>anthropic</code> 2.6.0 thật đo retry mặc định và retry chồng retry (có một gateway giả tự retry 3 lần ở giữa). Phần C: 500 client asyncio thật × 6 chiến lược retry, mỗi chiến lược một server asyncio riêng từ chối 4 s rồi hồi phục dần lên 100 req/s; server đếm request thật mỗi 100 ms. <b>Sức chứa và đường hồi phục là giả định như lab</b>; số đo có dao động nhỏ giữa các lần chạy vì dùng đồng hồ thật.",
      file: "docs/model-routing/pocs/02_retry_backoff_jitter.py",
      run: "uv run docs/model-routing/pocs/02_retry_backoff_jitter.py",
      needs: "chỉ <code>uv</code> và CPU, miễn phí, khoảng 55 s (phần A chờ thật retry-after 3 s và 12 s).",
      output: "Phần A, B: SDK anthropic 2.6.0 thật gửi HTTP thật tới server giả trên 127.0.0.1, đo bằng đồng hồ thật.\nPhần C: 500 client asyncio thật × 6 chiến lược, mỗi chiến lược một server asyncio riêng; server từ chối (529) trong 4 s,\nrồi sức chứa tăng dần lên 100 req/s trong 2 s (giả định, như lab). Đếm request thật server nhận mỗi 100 ms.\n\n== A. Retry mặc định của SDK anthropic 2.6.0 (max_retries=2), đo thật ==\nServer trả                                           max_retries  Request gửi  Khoảng cách giữa các lần  Tổng     Exception\n---------------------------------------------------  -----------  -----------  ------------------------  -------  ------------------------------\n529 liên tục                                         2            3            0,46 s, 0,96 s            1,46 s   OverloadedError\n429 retry-after: 3                                   2            3            3,01 s, 3,01 s            6,03 s   RateLimitError\n429 retry-after: 12 (> trần backoff 8 s)             1            2            12,00 s                   12,01 s  RateLimitError\n429 enforced_spend_limit_reached, không retry-after  2            3            0,42 s, 0,90 s            1,32 s   EnforcedSpendLimitReachedError\ntreo, timeout=1 s mỗi lần thử                        2            3            1,48 s, 1,90 s            4,39 s   APITimeoutError\nBackoff không có retry-after: 0,5 s × 2^n nhân (1 − 0,25·random) — jitter chỉ CẮT BỚT tối đa 25%, không trải đều.\n\n== B. Retry chồng retry: ứng dụng 3 lần × gateway 3 lần × SDK 3 lần, provider 529 liên tục ==\nCấu hình                           Request tới provider cho 1 lần bấm  Khách chờ\n---------------------------------  ----------------------------------  ---------\nchỉ ứng dụng (SDK max_retries=0)   3                                   0,01 s\nứng dụng + SDK mặc định            9                                   4,21 s\nứng dụng + gateway + SDK mặc định  27                                  3,79 s\nGateway giả gửi x-should-retry: true để SDK cũng retry, như một gateway trả lại 529 của upstream.\n\n== C. Bão retry: 500 client, provider sập 4 s, sức chứa sau hồi phục 10 req / 100 ms ==\nChiến lược                 Tổng request  Đỉnh/100 ms sau hồi phục  so sức chứa  Bị từ chối sau hồi phục  Phục vụ  Bỏ cuộc  p50     p95\n-------------------------  ------------  ------------------------  -----------  -----------------------  -------  -------  ------  -------\nRetry ngay                 3.000         0                         ×0,0         0                        0/500    500      —       —\nExponential, không jitter  2.876         76                        ×7,6         933                      216/500  284      7,65 s  15,63 s\nFull jitter (README)       2.893         24                        ×2,4         243                      418/500  82       6,94 s  11,53 s\nDecorrelated jitter        2.342         30                        ×3,0         349                      468/500  32       6,92 s  11,92 s\nChờ đúng retry-after       2.075         66                        ×6,6         1.113                    462/500  38       7,01 s  9,02 s\nretry-after + jitter       1.601         53                        ×5,3         601                      500/500  0        7,07 s  9,65 s\n\nRequest server nhận mỗi 0,5 s trong 20 s đầu (mỗi dòng tự co theo đỉnh của nó; provider sập ở 8 ô đầu):\n  Retry ngay                 |█▆▂                                     |\n  Exponential, không jitter  |▄█▄▄▄  ▄▄      ▄▄▁             ▃▃▁      |\n  Full jitter (README)       |▅█▆▃▂▂▂▁▁▁▁▁▁▁                          |\n  Decorrelated jitter        |██▇▇▅▄▄▄▄▃▃▂▂▂▁▁▁▁▁▁                    |\n  Chờ đúng retry-after       |██        ███▆▆▄▄▃▃▁▁                   |\n  retry-after + jitter       |██▁       ▄▇▅▃▅▄▂▁▂▂▁                   |\nMọi server đã dừng.\n\nRút ra: SDK chờ đúng retry-after kể cả 12 s (không trần), còn spend cap vẫn bị SDK retry vô ích; timeout áp cho TỪNG lần thử.\nBa tầng retry biến một lần bấm thành 27 request lên provider đang sập. Ở bão retry, retry ngay và chờ đúng retry-after\ndồn client về cùng thời điểm (đỉnh nhiều lần sức chứa); jitter trải tải ra nên ít request bị từ chối hơn hẳn.",
      measured: true,
      read: ["<b>Cái gì do script đặt, cái gì đo thật.</b> Script đặt: server giả trả lỗi gì, sập bao lâu (4 s), sức chứa sau hồi phục (100 req/s) và gateway giả retry 3 lần. Đo thật: SDK <code>anthropic</code> thật chờ bao lâu và gửi bao nhiêu request (phần A, B), và số request server thật sự nhận mỗi 100 ms từ 500 client asyncio thật (phần C). Chạy lại sẽ lệch vài phần trăm vì đồng hồ thật.", "Phần A, dòng retry-after 12 s: <b>SDK chờ đủ 12,00 s, dù trần backoff là 8 s.</b> Vì sao: trần 8 s chỉ áp cho thời gian chờ SDK tự tính; có <code>retry-after</code> thì SDK chép nguyên giá trị đó, không giới hạn. Dòng này chạy <code>max_retries=1</code> cho POC đỡ tốn thời gian; mặc định 2 thì là 24 s. Trong hệ thống thật: <code>max_retries=0</code> và để vòng của bạn quyết: quá ngưỡng (ví dụ 10 s) thì sang model khác.", "Phần A, dòng spend cap: <b>SDK gửi 3 request cho một lỗi không bao giờ tự hết.</b> Vì sao: SDK retry mọi 429 theo status, không đọc <code>error_code = enforced_spend_limit_reached</code>. Hai lần retry đó chắc chắn thất bại tới đầu tháng sau. Trong hệ thống thật: <code>classify</code> của README đọc error_code và xếp FATAL.", "Phần A, dòng cuối: jitter của SDK chỉ <i>cắt bớt</i> tối đa 25% thời gian chờ (0,5 s thành 0,375–0,5 s), không trải đều như full jitter. 500 client dùng SDK mặc định vẫn quay lại gần như cùng lúc.", "Phần B: ứng dụng 3 × gateway 3 × SDK 3 = 27 request thật lên provider đang sập cho một lần bấm; <code>max_retries=0</code> ở SDK và chỉ ứng dụng retry thì còn 3.", "Phần C: không jitter đỉnh ×7,6 sức chứa, full jitter ×2,4; chờ đúng retry-after dồn mọi client về cùng giây (đỉnh ×6,6, 1.113 request bị từ chối sau hồi phục).", "Phần C, điều bất ngờ: <b>full jitter có đỉnh thấp nhất nhưng 82 khách bỏ cuộc; retry-after + jitter đỉnh cao hơn (×5,3) mà không mất khách nào, lại gửi ít request nhất (1.601).</b> Vì sao: full jitter có thể rút chờ gần 0 s, nên vài lần thử đầu rơi vào 4 s provider còn sập và bị đốt phí; 6 lần thử hết trước khi tới lượt. retry-after 5 s đẩy mọi lần thử thứ hai ra sau 4 s sập, nên không lần nào phí; jitter phía sau trải chúng ra. Không có nghĩa full jitter sai: nó tối ưu đỉnh tải khi server không nói gì. Trong hệ thống thật: server có gửi retry-after thì dùng nó làm mức sàn rồi cộng jitter; không có thì full jitter, và khách hết lượt sang model dự phòng (README §3.1) chứ không nhận lỗi."]

    mount(stage) {
      const st = { strat: 'nojitter', n: 500, outage: 4, capacity: 100, ramp: 2, maxAtt: 6, base: 0.5, cap: 8, ra: 5, spread: 1, seed: 3, budget: 5 };
      const ctl = el('div', { class: 'row' });
      const view = el('div'), stats = el('div'), cap = el('div'), tbl = el('div');
      let timer = null;
      const later = () => { if (timer) clearTimeout(timer); timer = setTimeout(draw, 80); };
      const set = (k) => (v) => { st[k] = v; later(); };
      ctl.append(
        select('Chiến lược', STRATS, st.strat, (v) => { st.strat = v; draw(); }).node,
        slider('Số client', 10, 3000, 10, st.n, set('n'), vn).node,
        slider('Provider sập (s)', 1, 30, 1, st.outage, set('outage'), (v) => v + ' s').node,
        slider('Sức chứa sau hồi phục (req/s, giả định)', 20, 500, 10, st.capacity, set('capacity'), vn).node,
        slider('Thời gian tăng lại sức chứa (s, giả định)', 0.1, 10, 0.1, st.ramp, set('ramp'), (v) => vn(v, 1) + ' s').node,
        slider('Số lần thử tối đa', 2, 10, 1, st.maxAtt, set('maxAtt')).node,
        slider('retry-after server gửi khi sập (s)', 1, 30, 1, st.ra, set('ra'), (v) => v + ' s').node,
        slider('Ngân sách retry (so với request gốc)', 0.1, 5, 0.1, st.budget, set('budget'), (v) => (v >= 5 ? 'không giới hạn' : vn(v * 100) + '%')).node,
        el('button', { text: 'Seed khác', onclick: () => { st.seed++; draw(); } }));
      function draw() {
        timer = null;
        const all = STRATS.map(([k]) => simulate(Object.assign({}, st, { strat: k })));
        const idx = STRATS.findIndex(([k]) => k === st.strat);
        const R = all[idx];
        view.replaceChildren(chart(R, st), el('div', { class: 'legend', html: '<span><i style="background:var(--ok)"></i>được phục vụ</span><span><i style="background:var(--bad)"></i>bị từ chối</span><span>đường đứt nét: sức chứa mỗi 100 ms</span><span>dải nền: provider sập</span>' }));
        const capBin = st.capacity * DT;
        const sec = (v) => (isFinite(v) ? vn(v, 1) + ' s' : '—');
        stats.innerHTML = `<div class="stat"><span>Tổng request gửi: <b>${vn(R.total)}</b> (×${vn(R.amp, 1)})</span><span>Đỉnh sau hồi phục: <b class="${R.peakAfter > 4 * capBin ? 'bad' : ''}">${vn(R.peakAfter)}</b> / 100 ms (sức chứa ${vn(capBin, 0)})</span><span>Được phục vụ: <b>${vn(R.served)}</b> / ${vn(st.n)}</span><span>Bỏ cuộc: <b class="${R.gaveUp ? 'bad' : ''}">${vn(R.gaveUp)}</b></span><span>p50 / p95 chờ: <b>${sec(R.p50)} / ${sec(R.p95)}</b></span></div>`;
        tbl.innerHTML = table(['Chiến lược', 'Tổng request', 'Đỉnh sau hồi phục / 100 ms', 'Bị từ chối sau hồi phục', 'Được phục vụ', 'Bỏ cuộc', 'p50 / p95'], all.map((r, i) => [STRATS[i][1], vn(r.total), vn(r.peakAfter), vn(r.wasteAfter), vn(r.served), vn(r.gaveUp), sec(r.p50) + ' / ' + sec(r.p95)]), idx);
        const parts = [];
        const full = all[2];
        if ((st.strat === 'nojitter' || st.strat === 'ra') && R.peakAfter > 4 * capBin && R.peakAfter > 2 * full.peakAfter) {
          parts.push(note('var(--bad)', st.strat === 'ra'
            ? `<b>Retry storm do retry-after: ${vn(R.peakAfter)} request trong một khoảng 100 ms, gấp ${vn(R.peakAfter / capBin, 0)} lần sức chứa.</b> Vì sao: mọi client nhận cùng retry-after: ${st.ra} trong cùng giây đầu, chờ đúng ${st.ra} s, nên quay lại cùng lúc. Không có nghĩa nên bỏ qua retry-after: retry sớm hơn chắc chắn thất bại. Trong hệ thống thật: coi retry-after là mức sàn, cộng jitter phía sau; quá ngưỡng thì sang model khác (README §1.3, Tra cứu nhanh).`
            : `<b>Retry storm: ${vn(R.peakAfter)} request trong một khoảng 100 ms ngay sau khi provider hồi phục, gấp ${vn(R.peakAfter / capBin, 0)} lần sức chứa.</b> Vì sao: không jitter thì mọi client lỗi cùng giây đầu sẽ thử lại ở cùng các mốc 0,5, 1,5, 3,5, 7,5 s... Provider vừa mở cửa đã phải từ chối phần lớn đợt đó. Full jitter cùng kịch bản: đỉnh ${vn(full.peakAfter)}. Không có nghĩa backoff vô dụng: nó vẫn giãn các đợt ra. Trong hệ thống thật: full jitter như README.`));
        }
        if (st.strat === 'immediate' && R.gaveUp > st.n * 0.3) parts.push(note('var(--bad)', `<b>${vn(R.gaveUp)} khách bỏ cuộc vì hết ${st.maxAtt} lần thử trong chưa tới 1 s</b>, lúc provider còn sập. Retry không chờ chỉ đổi lỗi chậm thành lỗi nhanh, và thêm ×${vn(R.amp, 1)} tải.`));
        if (R.budgetCut > 0) parts.push(note('var(--warn)', `<b>Ngân sách retry cắt ${vn(R.budgetCut)} lần retry.</b> Tổng request ×${vn(R.amp, 1)} thay vì để mọi client thử tới ${st.maxAtt} lần. Những khách này, trong chuỗi fallback thật, sang model dự phòng ngay thay vì tiếp tục đấm vào provider đang hồi phục.`));
        if (st.strat === 'full' && R.gaveUp > 0) { let mw = 0; for (let i = 0; i < st.maxAtt - 1; i++) mw += Math.min(st.cap, st.base * 2 ** i) / 2; parts.push(note('var(--warn)', `<b>Full jitter giữ đỉnh thấp nhưng vẫn có ${vn(R.gaveUp)} khách bỏ cuộc.</b> Vì sao: với ${st.maxAtt} lần thử, tổng thời gian chờ trung bình của một khách khoảng ${vn(mw, 1)} s; còn provider cần ${st.outage} s để sống lại, ${vn(st.ramp, 1)} s để đủ sức chứa, rồi ít nhất ${vn(st.n / st.capacity, 1)} s nữa để phục vụ hết ${vn(st.n)} khách ở ${vn(st.capacity)} req/s. Khách nào rút "chờ ngắn" nhiều lần hoặc xếp sau trong hàng sẽ hết lượt trước. Không có nghĩa nên tăng số lần thử mãi: README chọn 2 lần mỗi model rồi sang model khác, nên trong chuỗi thật những khách này được model dự phòng phục vụ.`)); }
        if (!parts.length) parts.push(note('var(--ok)', `Đỉnh sau hồi phục ${vn(R.peakAfter)} / 100 ms so với sức chứa ${vn(capBin, 0)}. ${R.pending > 0 ? vn(R.pending) + ' khách vẫn đang chờ ở cuối 60 s.' : ''}`));
        cap.innerHTML = parts.join('');
      }
      stage.append(ctl, view, stats, cap, tbl, el('p', { class: 'hint', text: 'Base 0,5 s và trần 8 s theo README. Client gửi request đầu trong 1 s đầu tiên. Khi sập, server trả retry-after như thanh trượt; sau hồi phục, request bị từ chối vì quá sức chứa nhận retry-after: 1 (giả định). Decorrelated: chờ ngẫu nhiên trong [base, 3 × lần chờ trước], trần 8 s.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
