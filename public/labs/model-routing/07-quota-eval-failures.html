const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

    read: ['Hình một: mỗi hàng là một tenant, mỗi cột là một giây. Xanh lá: phục vụ. Xanh dương: phục vụ qua model fallback. Đỏ: 429 từ provider. Xám: bị quota của chính ShopViet từ chối, có thông báo rõ.', 'Đường dưới cùng là mức token còn trong bucket của tổ chức.', 'Hình hai: bảng chấm từng câu; chọn một câu để xem hai output và từng tiêu chí.', 'Dòng cảnh báo đỏ xuất hiện khi một nhóm tác vụ tụt mạnh ở nhánh fallback dù tổng nhìn ổn, hoặc khi bạn chỉ đếm HTTP 200.', 'Output của hai model là ví dụ dựng sẵn, không phải output thật. Grader thì chạy thật trong trình duyệt.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<h4>Quota theo tenant (§3.4)</h4>
<ul><li>Phía provider: Claude workspaces (RPM, ITPM, OTPM và chi tiêu riêng; giới hạn tổ chức luôn áp dụng; không đặt spend limit cho workspace mặc định; header <code>anthropic-workspace-id</code>), OpenAI projects (hard spend limit theo project trả 429), Cloudflare dynamic routes (budget, rate limit theo user, project, team).</li>
<li>Phía ứng dụng: token bucket theo tenant trước khi gọi provider; ước lượng input token trước khi gửi, trừ vào bucket, hoàn phần chênh khi có <code>usage</code>. Tenant hết quota nhận lỗi của bạn, rõ ràng, không làm hỏng người khác.</li>
<li>LiteLLM <code>max_parallel_requests</code> đếm trong từng process, trả 429 ngay khi hết slot: tổng song song thực bằng giới hạn nhân số worker.</li></ul>
<h4>Eval khi route sang model khác (§3.5)</h4>
<ol><li>Lấy mẫu prompt từ traffic thật, giữ phân phối theo tác vụ.</li><li>Chạy qua ba cấu hình: router, luôn model mạnh nhất, bảng tĩnh.</li><li>Chấm bằng grader hoặc LLM judge đã hiệu chỉnh, so theo cặp.</li><li>Giữ router khi rẻ hơn rõ rệt mà chất lượng không giảm quá ngưỡng. Mỗi lần chỉ đổi một đòn bẩy.</li></ol>
<p>Ba bẫy: nhiễu lớn hơn hiệu ứng (5,37% cặp model-câu hỏi đổi kết quả khi chạy lại); baseline chọn trên chính dữ liệu kiểm tra (False Floors); router huấn luyện trên phân phối khác. Nhánh fallback đo riêng: tỷ lệ request do fallback phục vụ, chất lượng, chi phí thật (cộng <code>usage.iterations</code>), p95 và p99, refusal tách khỏi lỗi.</p>
<p><b>Log mỗi request:</b> model được yêu cầu, model thực trả lời, <code>stop_reason</code>, số lần thử và lý do, <code>request-id</code>, header rate limit còn lại, thời gian chờ backoff. Không log <code>fallback_credit_token</code> cùng nội dung nhạy cảm ở nơi nhiều người đọc.</p>
<h4>Failure modes hay gặp nhất (§3.6, chọn lọc)</h4>
<div class="tbl"><table>
<tr><th>Triệu chứng</th><th>Nguyên nhân</th><th>Xử lý</th></tr>
<tr><td>Vẫn 429 dù đã fallback</td><td>Hai model chung bucket (Opus 4.8 và 4.7)</td><td>Fallback sang bucket khác</td></tr>
<tr><td>Retry kéo dài, mọi lần 429, không có <code>retry-after</code></td><td>Hết spend cap</td><td><code>FATAL</code>, báo động</td></tr>
<tr><td>Một request thành 20–30 request</td><td>Retry ở SDK, gateway, ứng dụng nhân nhau</td><td>Một tầng retry; trần cho cả chuỗi</td></tr>
<tr><td>Refusal không được fallback</td><td>Refusal là HTTP 200</td><td>Kiểm <code>stop_reason</code> ở mọi response</td></tr>
<tr><td>Chi phí báo cáo thấp hơn hoá đơn</td><td>Bỏ sót <code>usage.iterations</code></td><td>Cộng <code>usage.iterations</code></td></tr>
<tr><td>Chất lượng giảm ở một nhóm khách</td><td>Router không thấy nhóm đó khi huấn luyện; Bedrock routing chỉ tối ưu tiếng Anh</td><td>Eval theo nhóm; giữ baseline</td></tr>
<tr><td>Chuỗi trỏ tới model đã retire</td><td>Model fallback ít được gọi</td><td>Test chuỗi trong CI; alert khi có 404</td></tr>
<tr><td>Breaker mở vì người dùng gửi request sai</td><td>Đếm 400 là lỗi của model</td><td>Chỉ đếm lỗi <code>RETRY</code></td></tr>
<tr><td>Tool call hoặc text bị lặp sau khi stream lỗi</td><td>Fallback sau khi đã gửi token</td><td>Chỉ fallback khi chưa gửi gì</td></tr>
</table></div>
<div class="verdict"><b>Checklist (§3.7)</b> có năm nhóm: phân loại lỗi, retry, chuỗi fallback, vận hành, router. Bản tương tác ở câu hỏi cuối.</div>`,
  why: {
    c: 'Cô lập tenant bằng workspace hoặc project ở provider cộng token bucket theo tenant ở ứng dụng, để tenant hết quota nhận lỗi rõ ràng của ShopViet thay vì làm cả tổ chức nhận 429. Eval nhánh fallback như eval model chính, tách theo nhóm tác vụ, và log model thực trả lời cho mọi request.',
    s: 'Dựa vào fallback để chống noisy neighbor: model fallback cùng bucket thì cũng cạn; khác bucket thì cứu được một đợt burst ngắn, nhưng tenant ồn ào cũng fallback và rút tiếp xô thứ hai, nên burst dài hơn là cạn nốt. Đo nhánh fallback bằng tỷ lệ HTTP 200: refusal, JSON sai và câu trả lời thiếu ý đều là 200. So router với baseline sau một lần chạy: nhiễu giữa hai lần chạy có thể lớn hơn hiệu ứng.',
    p: 'Phải ước lượng token trước khi gửi và hoàn lại sau, phải chọn cách chia quota (và tranh luận về nó). Một bộ eval nữa phải chạy định kỳ trên model ít được gọi. Log và dashboard thêm trường: model thực trả lời, stop_reason, số lần thử, usage.iterations.'
  },
  deep: [
    {
      q: 'Đã có workspace riêng cho mỗi tenant. Sao khách lẻ vẫn có thể nhận 429?',
      a: `<p>Vì <b>giới hạn tổ chức luôn áp dụng</b>, kể cả khi tổng giới hạn các workspace lớn hơn (README §3.4). Workspace chỉ đặt trần thấp hơn cho từng phần; nó không đặt trước capacity cho ai. Nếu ba workspace được đặt 1,2M + 1,2M + 1,2M ITPM trong tổ chức 2M ITPM, hai workspace chạy hết công suất là đủ làm cạn tổ chức.</p>
<p>Muốn workspace thật sự cô lập thì tổng giới hạn các workspace không vượt giới hạn tổ chức. Kéo các thanh trượt bên dưới.</p>`,
      viz(box) {
        const S = { a: 1000, b: 500, c: 500 }, out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
        function draw() {
          const sum = S.a + S.b + S.c, over = sum > 2000;

          cap.innerHTML = over ? `<b class="bad">Không cô lập:</b> khi B2B và CSKH dùng hết giới hạn của mình (${((S.b + S.c) / 1000).toFixed(2).replace('.', ',')}M), khách lẻ chỉ còn ${Math.max(0, (2000 - S.b - S.c) / 1000).toFixed(2).replace('.', ',')}M chứ không phải ${(S.a / 1000).toFixed(2).replace('.', ',')}M như đã đặt.` : 'Tổng không vượt giới hạn tổ chức: mỗi workspace chạy hết công suất vẫn không lấn phần của workspace khác.';
        }
        const sl = (l, k) => slider(l, 0, 2000, 100, S[k], (v) => { S[k] = v; draw(); }, (v) => (v / 1000).toFixed(1).replace('.', ',') + 'M').node;
        box.append(el('div', { class: 'row' }, [sl('Khách lẻ', 'a'), sl('CSKH', 'b'), sl('B2B', 'c')]), out, cap,
          el('div', { class: 'hint', text: 'Giới hạn tổ chức 2.000.000 ITPM là mức Start của Sonnet 5.5 (README §1.2). Workspace mặc định không đặt spend limit được.' }));
        draw();
      },
      take: 'Workspace là trần, không phải phần đặt trước. Cô lập thật cần tổng các trần không vượt giới hạn tổ chức, hoặc quota ở ứng dụng.'
    },
    {
      q: 'Trung bình mỗi phút còn dưới giới hạn. Sao vẫn bị 429?',
      a: `<p>Vì Claude tính bằng token bucket, nạp lại liên tục, không reset theo phút tròn (README §1.2). Một đợt burst ngắn lấy token nhanh hơn tốc độ nạp; nếu xô cạn trước khi kịp nạp lại, request bị từ chối, dù cả phút cộng lại vẫn dưới giới hạn.</p>
<p>Hình dưới gửi 60 giây traffic: nền đều, cộng một đợt burst do job B2B khởi động. Dung lượng xô ở đây là giả định (README không công bố), chọn bằng thanh trượt theo "số giây nạp".</p>`,
      viz(box) {
        const S = { burst: 8, cap: 10 }, svg = el('svg', { class: 'canvas', viewBox: '0 0 560 140', role: 'img', 'aria-label': 'Mức token trong bucket theo giây' }), out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
        function draw() {
          const lim = 2e6, rate = lim / 60, capT = rate * S.cap; let lvl = capT, used = 0, rej = 0; const L = [];
          for (let s = 0; s < 60; s++) {
            lvl = Math.min(capT, lvl + rate);
            const want = 15000 + (s >= 20 && s < 20 + S.burst ? 120000 : 0);
            if (lvl >= want) { lvl -= want; used += want; } else { const take = Math.max(0, lvl); used += take; rej += want - take; lvl = 0; }
            L.push(lvl);
          }
          const X = (s) => 20 + s * 9, Y = (v) => 120 - (v / capT) * 100;
          svg.replaceChildren(el('line', { x1: 20, x2: 560, y1: 120, y2: 120, stroke: 'var(--line)' }),
            el('path', { d: L.map((v, s) => (s ? 'L' : 'M') + X(s) + ' ' + Y(v).toFixed(1)).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }),
            el('rect', { x: X(20), y: 10, width: S.burst * 9, height: 110, fill: 'var(--warn)', opacity: 0.12 }),
            el('text', { x: X(20) + 2, y: 22, fill: 'var(--warn)', text: 'burst' }), el('text', { x: 22, y: 136, class: 'mute', text: '0 s' }), el('text', { x: 520, y: 136, class: 'mute', text: '60 s' }));
          const avg = used + rej;
          out.innerHTML = `<span>Tổng muốn gửi trong phút: <b>${fmtNum(Math.round(avg / 1000) * 1000)}</b> / 2M</span><span>Token bị từ chối: <b class="${rej ? 'bad' : 'ok'}">${fmtNum(Math.round(rej / 1000) * 1000)}</b></span>`;
          cap.innerHTML = rej > 0 && avg <= lim ? '<b class="bad">Bất thường:</b> cả phút chưa dùng tới giới hạn mà vẫn có 429. Vì sao: xô cạn trong đợt burst, nạp lại không kịp. Không có nghĩa là giới hạn bị tính sai. Trong hệ thống thật: dàn đều job lớn (hoặc đưa vào batch), và quota ở ứng dụng nên cũng là token bucket chứ không phải bộ đếm theo phút.' : 'Đường xanh là token còn trong xô; xô nạp 33.333 token mỗi giây (2M ITPM chia 60).';
        }
        box.append(el('div', { class: 'row' }, [slider('Burst B2B kéo dài', 0, 20, 1, S.burst, (v) => { S.burst = v; draw(); }, (v) => v + ' s').node, slider('Dung lượng xô (giả định)', 2, 60, 1, S.cap, (v) => { S.cap = v; draw(); }, (v) => v + ' s nạp').node]), svg, out, cap);
        draw();
      },
      take: 'Rate limit đo theo nhịp, không chỉ theo tổng. Burst ngắn đủ làm cạn xô; dàn đều tải là cách rẻ nhất để tránh.'
    },
    {
      q: 'Quota tính bằng token, mà phải trừ trước khi gửi. Làm sao biết trước request tốn bao nhiêu token?',
      a: `<p>Ước lượng. README §3.4: ước lượng input token trước khi gửi (bằng endpoint đếm token, hoặc theo số ký tự), trừ vào bucket của tenant, rồi hoàn lại phần chênh khi có <code>usage</code> thực. Endpoint <code>count_tokens</code> của Claude miễn phí nhưng có rate limit riêng; ước lượng theo ký tự thì nhanh nhưng thô.</p>
<p>Một bẫy riêng của tiếng Việt (Cost Optimization §2.1): cùng đoạn văn ở dạng Unicode NFD (dấu tách thành ký tự riêng, hay gặp khi copy từ macOS hoặc PDF) tốn gần gấp ba token so với NFC. Hình dưới đếm số ký tự thật của chuỗi ở hai dạng bằng <code>String.normalize</code> trong trình duyệt.</p>`,
      viz(box) {
        const T = ['Tai nghe của tôi bị rè ở tai trái, đổi trả được không?', 'Đơn SV-4821 của tôi tới đâu rồi?', 'Máy lỗi đã bảo hành hai lần trong ba mươi ngày, lần thứ ba có được đổi mới không?'];
        const S = { i: 0, form: 'NFC' }, out = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
        function draw() {
          const s = T[S.i].normalize(S.form), nfc = T[S.i].normalize('NFC').length, nfd = T[S.i].normalize('NFD').length;
          const est = Math.ceil(s.length / 3), real = Math.ceil(nfc / 3.2) * (S.form === 'NFD' ? 3 : 1);
          out.innerHTML = `<span>Ký tự NFC: <b>${nfc}</b></span><span>Ký tự NFD: <b>${nfd}</b></span><span>Trừ trước (ký tự ÷ 3): <b>${est}</b></span><span>usage thực (giả định): <b>${real}</b></span><span>Hoàn lại: <b class="${est - real < 0 ? 'bad' : 'ok'}">${est - real}</b></span>`;
          cap.innerHTML = est - real < 0 ? '<b class="bad">Thiếu:</b> ước lượng thấp hơn usage thực, bucket của tenant bị trừ âm sau khi có usage. Vì sao: chuỗi NFD tốn token hơn hẳn mà ước lượng theo ký tự không thấy hết. Trong hệ thống thật: chuẩn hoá NFC mọi văn bản trước khi đưa vào prompt, và cho phép bucket âm tạm thời rồi trừ vào lần sau.' : 'Ước lượng dư một chút thì không sao: phần dư được hoàn lại khi có usage.';
        }
        box.append(el('div', { class: 'row' }, [select('Câu', T.map((t, i) => [i, t.slice(0, 40) + '…']), S.i, (v) => { S.i = +v; draw(); }).node, select('Dạng Unicode', [['NFC', 'NFC'], ['NFD', 'NFD (copy từ PDF)']], S.form, (v) => { S.form = v; draw(); }).node]), out, cap,
          el('div', { class: 'hint', text: 'Số ký tự là số thật tính trong trình duyệt. Quy tắc ký tự ÷ 3 và usage thực là giả định; hệ số gần gấp ba của NFD lấy từ số đo tiktoken ở Cost Optimization §2.1.' }));
        draw();
      },
      take: 'Trừ trước bằng ước lượng, hoàn lại bằng usage thật. Chuẩn hoá NFC trước khi ước lượng, nếu không ước lượng sẽ hụt.'
    },
    {
      q: 'LiteLLM có max_parallel_requests. Đặt nó là đủ quota rồi?',
      a: `<p>Chưa. README §2.1 và §3.4: giới hạn này đếm <b>trong từng process</b>, không chia sẻ giữa worker hay pod, và request đến khi hết slot bị <code>429</code> ngay, không có hàng đợi. Với nhiều worker, tổng song song thực bằng giới hạn nhân số worker. Nếu không đặt mà có <code>rpm</code> hay <code>tpm</code>, LiteLLM tự suy ra giới hạn theo từng process; một deployment chỉ đặt <code>rpm: 2</code> chỉ chạy song song được 2 request mỗi worker.</p>`,
      viz(box) {
        const S = { lim: 20, w: 8 }, out = el('div', { class: 'stat' });
        function draw() {
          const tot = S.lim * S.w;
          out.innerHTML = `<span>Bạn nghĩ: <b>${S.lim}</b> request song song</span><span>Thực tế: <b class="${S.w > 1 ? 'bad' : 'ok'}">${tot}</b> (${S.lim} × ${S.w} worker)</span><span>Request thứ ${S.lim + 1} trong một worker: <b class="bad">429 ngay</b></span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('max_parallel_requests', 1, 50, 1, S.lim, (v) => { S.lim = v; draw(); }).node, slider('Số worker', 1, 32, 1, S.w, (v) => { S.w = v; draw(); }).node]), out);
        draw();
      },
      take: 'Giới hạn trong process vừa quá lỏng ở tổng (nhân số worker) vừa quá chặt ở từng worker (429 không xếp hàng). Quota theo tenant cần một store dùng chung.'
    },
    {
      q: 'Router phân loại đúng 90%. Vậy chất lượng giảm tối đa 10%?',
      a: `<p>Không. README §3.5: "Router có độ chính xác phân loại 90% vẫn có thể làm hỏng sản phẩm nếu 10% sai đều rơi vào ca khó nhất". Câu dễ bị gửi nhầm sang model mạnh chỉ tốn thêm tiền. Câu khó bị gửi nhầm sang model yếu thì sai. Cùng 90%, phân bố của 10% sai quyết định chất lượng.</p>
<p>Hình dưới lấy 100 câu, 30 câu khó (giả định). Model yếu đúng 40% câu khó, model mạnh đúng 90% (giả định, cùng bộ số với Lab 5).</p>`,
      viz(box) {
        const S = { acc: 90, hardShare: 80 }, out = el('div', { class: 'stat' });
        function draw() {
          const wrong = 100 - S.acc, toHard = Math.min(30, Math.round((wrong * S.hardShare) / 100)), toEasy = wrong - toHard;
          const hardStrong = 30 - toHard;
          const q = (70 - toEasy) * 0.95 + toEasy * 0.97 + hardStrong * 0.90 + toHard * 0.40;
          const best = 70 * 0.97 + 30 * 0.90;
          out.innerHTML = `<span>Câu khó gửi nhầm model yếu: <b>${toHard}</b></span><span>Câu dễ gửi nhầm model mạnh: <b>${toEasy}</b></span><span>Câu đúng: <b>${q.toFixed(1)}</b> / 100</span><span>Luôn model mạnh: <b>${best.toFixed(1)}</b></span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('Router phân loại đúng', 50, 100, 1, S.acc, (v) => { S.acc = v; draw(); }, (v) => v + '%').node, slider('Phần sai rơi vào câu khó', 0, 100, 10, S.hardShare, (v) => { S.hardShare = v; draw(); }, (v) => v + '%').node]), out);
        draw();
      },
      take: 'Độ chính xác phân loại không phải chất lượng. Đo thứ người dùng nhận: câu trả lời cuối, chi phí, độ trễ.'
    },
    {
      q: 'Router thắng baseline 2 điểm. Đủ để bật router chưa?',
      a: `<p>Chưa chắc. Trong paper của Lee, 5,37% cặp model-câu hỏi đổi kết quả khi chạy lại y hệt. Chênh một hai điểm sau một lần chạy chưa chứng minh được gì: hãy chạy lặp và báo khoảng tin cậy.</p>
<p>Bẫy thứ hai: baseline chọn trên chính dữ liệu kiểm tra. False Floors (Bhatti và Vaddina, tháng 10/2026) chỉ ra sai lệch do cách chọn này là 0,003–0,030 harm trên HELM Safety với split ngẫu nhiên và 0,045–0,113 với category giữ lại, tương đương toàn bộ phần thua kém được quy cho routing; trên AgentDojo, sai lệch tăng 7–9 lần khi giữ lại suite. Kết luận của tác giả: "Scored honestly under shift, routing buys little on these benchmarks". Chọn baseline trên dev, đo trên test tách riêng, và có một tập test từ thời điểm khác hoặc nhóm khách khác.</p>
<p>Hình dưới chạy hai lần <b>cùng một hệ thống</b> 300 lần, mỗi câu có 5,37% khả năng đổi kết quả giữa hai lần chạy, và đo chênh lệch điểm.</p>`,
      viz(box) {
        const S = { n: 294 }, out = el('div', { class: 'stat' }), hist = el('div', { style: 'display:flex;align-items:flex-end;gap:2px;height:80px' });
        function draw() {
          const rnd = seeded(537), diffs = [];
          for (let k = 0; k < 300; k++) { let d = 0; for (let i = 0; i < S.n; i++) if (rnd() < 0.0537) d += rnd() < 0.5 ? 1 : -1; diffs.push((d / S.n) * 100); }
          diffs.sort((a, b) => a - b);
          const lo = diffs[7], hi = diffs[292], B = 21, mx = Math.max(4, Math.ceil(Math.max(Math.abs(diffs[0]), Math.abs(diffs[299])))), bins = new Array(B).fill(0);
          diffs.forEach((d) => bins[Math.min(B - 1, Math.max(0, Math.floor(((d + mx) / (2 * mx)) * B)))]++);
          const top = Math.max(...bins);
          hist.replaceChildren(...bins.map((b, i) => el('span', { style: `flex:1;height:${(b / top) * 80}px;border-radius:2px;background:${Math.abs((i + 0.5) / B * 2 * mx - mx) >= 2 ? 'var(--warn)' : 'var(--accent)'}` })));
          const big = diffs.filter((d) => Math.abs(d) >= 2).length;
          out.innerHTML = `<span>95% lần chạy lại chênh trong <b>${lo.toFixed(1)} … +${hi.toFixed(1)}</b> điểm</span><span>Chênh từ 2 điểm trở lên: <b class="${big ? 'bad' : 'ok'}">${((big / 300) * 100).toFixed(0)}%</b> số lần</span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('Số câu trong tập', 40, 2000, 20, S.n, (v) => { S.n = v; draw(); }).node]), hist, out,
          el('div', { class: 'cap', text: 'Không có router nào ở đây: hai lần chạy y hệt nhau. Cột cam là các lần chênh từ 2 điểm trở lên, hoàn toàn do nhiễu. Tỷ lệ 5,37% lấy từ README §3.5; giả định câu đổi kết quả đổi theo hai chiều như nhau.' }));
        draw();
      },
      take: 'Với vài trăm câu, chênh 2 điểm có thể là nhiễu thuần. Chạy lặp, báo khoảng tin cậy, và tách dev với test.'
    },
    {
      q: 'Dashboard báo 0% lỗi 5xx. Vậy nhánh fallback ổn?',
      a: `<p>Không nói được. README §3.5 liệt kê những gì phải đo riêng cho nhánh fallback: tỷ lệ request do model fallback phục vụ (đọc trường <code>model</code> và <code>log</code> của vòng fallback; với Claude, đếm mục <code>fallback_message</code> trong <code>usage.iterations</code>), chất lượng trên nhánh fallback, chi phí thật (cộng <code>usage.iterations</code>), p95 và p99, và refusal như một tín hiệu riêng.</p>
<p>Refusal là HTTP 200, nên dashboard dựng trên tỷ lệ lỗi không bao giờ thấy nó. Anthropic khuyên phát một event cho mỗi refusal và một event cho mỗi response do fallback phục vụ, rồi cảnh báo khi chênh lệch giữa hai số tăng. Hình dưới là 20 dòng log của ShopViet (dữ liệu dựng sẵn); dashboard được tính từ log.</p>`,
      viz(box) {
        const LOG = [];
        const r = seeded(4821);
        for (let i = 0; i < 20; i++) {
          const u = r(); let row;
          if (u < 0.6) row = { m: 'claude-sonnet-5-5', st: 'end_turn', it: 1, http: 200 };
          else if (u < 0.75) row = { m: 'claude-sonnet-5', st: 'end_turn', it: 2, http: 200, fb: true };
          else if (u < 0.85) row = { m: 'claude-sonnet-5-5', st: 'refusal', it: 1, http: 200 };
          else if (u < 0.93) row = { m: 'claude-sonnet-5', st: 'max_tokens', it: 2, http: 200, fb: true };
          else row = { m: 'claude-sonnet-5-5', st: 'end_turn', it: 1, http: 200 };
          LOG.push({ id: 'SV-' + (4821 + i), ...row });
        }
        const err = LOG.filter((x) => x.http >= 500).length, ref = LOG.filter((x) => x.st === 'refusal').length, fb = LOG.filter((x) => x.fb).length, cut = LOG.filter((x) => x.st === 'max_tokens').length;
        const att = LOG.reduce((s, x) => s + x.it, 0);
        box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>ID</th><th>model thực trả lời</th><th>stop_reason</th><th>số lần thử</th><th>HTTP</th></tr>' + LOG.map((x) => `<tr><td class="mono">${x.id}</td><td class="mono">${x.m}</td><td class="${x.st === 'end_turn' ? '' : 'bad'}">${x.st}</td><td class="mono">${x.it}</td><td class="mono">${x.http}</td></tr>`).join('') })]),
          el('div', { class: 'stat', html: `<span>Lỗi 5xx: <b class="ok">${err}</b></span><span>Refusal: <b class="bad">${ref}</b></span><span>Do fallback phục vụ: <b>${fb}</b> (${((fb / 20) * 100).toFixed(0)}%)</span><span>Bị cắt (max_tokens): <b class="bad">${cut}</b></span><span>Tổng lần thử: <b>${att}</b> cho 20 request</span>` }),
          el('div', { class: 'cap', html: `<b class="bad">Bất thường:</b> dashboard lỗi báo 0, nhưng ${ref} khách nhận refusal và ${cut} khách nhận câu trả lời bị cắt sau fallback (tokenizer khác, thinking tính vào max_tokens; failure mode 15). Vì sao: cả hai đều là HTTP 200. Trong hệ thống thật: kiểm stop_reason ở mọi response, dashboard tách refusal khỏi lỗi, và chi phí cộng cả ${att - 20} lần thử thêm.` }));
      },
      take: 'Tỷ lệ request thành công không nói được fallback có ổn hay không. Log model thực trả lời và stop_reason cho mọi request, và dựng dashboard từ đó.'
    },
    {
      q: 'Gặp triệu chứng lạ lúc sự cố. Tra nguyên nhân ở đâu?',
      a: `<p>README §3.6 gom 25 failure mode thường gặp, mỗi dòng có triệu chứng, nguyên nhân và cách xử lý. Phần lớn chung một gốc: đổi model là đổi tham số hợp lệ, bucket rate limit, cache, thinking block và ngữ nghĩa lỗi, mà code không biết. Chọn một triệu chứng để xem.</p>`,
      viz(box) {

          ['Model fallback nhận 400 về thinking', 'between_tools, disabled hay budget_tokens không hợp lệ ở model đích', 'Ghi đè thinking theo model; dùng adaptive'],

          ['Vẫn 429 liên tục dù đã fallback', 'Hai model chung bucket, ví dụ Opus 4.8 và 4.7', 'Fallback sang bucket khác'],

          ['"Hết hạn mức" nhưng lỗi là 400', 'Spend limit tự đặt thấp hơn trần', 'Nhận diện riêng theo message; báo động'],
          ['Một request thành 20–30 request', 'Retry ở SDK, gateway và ứng dụng nhân nhau', 'Một tầng retry; max_retries=0 ở SDK; trần cho cả chuỗi'],
          ['Người dùng chờ hai phút rồi mới nhận lỗi', 'SDK chờ retry-after dài, timeout 10 phút mỗi lần thử', 'Deadline cho cả chuỗi; không chờ khi retry-after vượt ngưỡng'],
          ['Refusal không được fallback', 'Code chỉ bắt exception; refusal là HTTP 200', 'Kiểm stop_reason; bật fallbacks phía server'],

          ['Chi phí tăng mạnh trong giờ có sự cố', 'Cache tách theo model; fallback ghi lại prefix vào cache mới', 'Chấp nhận và theo dõi; refusal dùng fallback credit'],

          ['Mất reasoning khi chuyển sang key tài khoản khác dù cùng model', 'Block của Fable 5.2, Mythos 5.2, Sonnet 5.5, Haiku 5.5 ràng buộc theo tài khoản', 'Replay qua đúng tài khoản đã tạo ra nó'],

          ['Router gửi gần hết traffic sang model mạnh', 'Ngưỡng quá thấp, hoặc chế độ Quality', 'Đo phân bố trường model; chỉnh ngưỡng trên dữ liệu thật'],
          ['Chất lượng giảm ở một nhóm khách sau khi bật router', 'Router không thấy nhóm đó khi huấn luyện; Bedrock routing chỉ tối ưu tiếng Anh', 'Eval theo nhóm; giữ baseline ngoài router'],
          ['Model đổi giữa các lượt của cùng hội thoại', 'Router stateless chọn lại mỗi request', 'Session affinity hoặc ghim model trong state hội thoại'],

    {
      q: 'Trước khi bật chuỗi fallback cho production, kiểm những gì?',

      viz(box) {

        q.forEach((i) => {

function terms(list) {

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {

  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
