const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {

  const BAD_ENUM = ['delivery', 'defect', 'billing'];
  const GOOD_ENUM = ['delivery', 'defect', 'billing', 'warranty', 'other'];
  const TOGGLES = [
    ['nul', 'Dữ liệu thiếu: order_id cho phép null'],

  function values(msg, c) {
    const T = msg.truth, flags = {}, notes = [];

      read: ['Chọn <b>tin nhắn</b> và <b>provider</b>. Bảy nút là bảy quyết định thiết kế, sáng là đang dùng cách tốt.', 'Cột trái là JSON Schema thật được dựng từ các nút. Cột phải là output minh hoạ theo đúng thứ tự key provider sẽ sinh. Giá trị do lab dựng sẵn theo quy tắc, không phải gọi model.', 'Dòng đỏ: giá trị sai mà parser và schema đều chấp nhận. Dòng cam: giá trị mơ hồ. Bên dưới là giải thích từng cờ.', 'Phần format: kéo số dòng, đổi dữ liệu phẳng / lồng, đổi chiều đọc / sinh. Token là ước lượng có ghi cách tính.', 'Thử: tin nhắn 2 + Schema tệ (mã đơn bịa), tin nhắn 3 + tắt "items là danh sách", Schema tốt + Gemini (evidence bị đẩy xuống).']
    },
    summary: `<h3>Tóm tắt bài</h3>
<p>Tên field, <code>description</code> và giá trị enum cũng là chỉ dẫn cho model. Viết sao cho người đọc và model hiểu cùng một nghĩa.</p>
<div class="tbl"><table>
<tr><th>Quyết định</th><th>Tránh</th><th>Nên</th><th>Vì sao</th></tr>
<tr><td>Tên field</td><td><code>price</code>, <code>refund</code>, <code>anger</code></td><td><code>price_vnd</code>, <code>is_refund_requested</code>, <code>duration_minutes</code></td><td>Đơn vị và nghĩa nằm ngay ở tên. Boolean dùng <code>is_</code> / <code>has_</code> để thành câu hỏi đúng/sai</td></tr>
<tr><td>description</td><td>Bỏ trống</td><td>Thang đo, format, trường hợp biên: "1 = bình thường, 5 = doạ huỷ đơn / bóc phốt"</td><td>Những điều tên không nói hết</td></tr>
<tr><td>Dữ liệu thiếu</td><td><code>order_id: str</code> bắt buộc</td><td><code>str | None</code> + "null nếu không có"</td><td>Không có đường lui thì model điền một giá trị trông hợp lý</td></tr>
<tr><td>Enum</td><td>Danh sách đóng</td><td>Thêm <code>other</code> + <code>category_other</code></td><td>Gom <code>category_other</code> định kỳ để biết khi nào thêm nhãn</td></tr>
<tr><td>Mức chắc chắn</td><td><code>confidence: 0.73</code></td><td><code>high / medium / low</code> có định nghĩa</td><td>Số dễ bị hiểu là xác suất đã hiệu chỉnh</td></tr>
<tr><td>Thứ tự</td><td>Điểm / nhãn trước</td><td><code>evidence</code> (bắt buộc) trước kết luận</td><td>Kiểm tra thứ tự thật: Claude đưa required lên trước, Gemini có thể theo alphabet</td></tr>
<tr><td>Hình dạng</td><td><code>item_1</code>, <code>item_2</code>; lồng sâu</td><td><code>items: list[Item]</code>; 3–4 cấp</td><td>OpenAI tối đa 10 cấp; mỗi cấp thêm trạng thái cho bộ giải mã</td></tr>
<tr><td>ID nội bộ</td><td>Bắt model điền SKU</td><td>Trích tên, tra SKU bằng code</td><td>Tin nhắn không chứa SKU, model sẽ đoán</td></tr>
<tr><td>Ổn định</td><td>Sinh schema động</td><td>Schema cố định, ghi <code>schema_version</code></td><td>Schema mới phải compile lại; Claude mất prompt cache</td></tr>
</table></div>
<h4>Chọn format (§3.8)</h4>
<div class="tbl"><table>
<tr><th>Format</th><th>Dùng khi</th><th>Lưu ý từ README</th></tr>
<tr class="cur"><td>JSON</td><td>Output nạp vào code</td><td>Được constrained decoding hỗ trợ rộng nhất; khi model phải sinh dữ liệu, JSON thuần cho độ chính xác tốt nhất [81]</td></tr>
<tr><td>TOON / CSV</td><td>Bảng lớn, đồng nhất, đưa vào context nhiều lần</td><td>Ít hơn khoảng 40% token khi đọc [79]; benchmark độc lập: TOON 47,5% so với JSON 52,3%, Markdown key-value 60,7% [80]; agent loop giảm 2–18% token nhưng có thể giảm độ chính xác [82]</td></tr>
<tr><td>XML tag</td><td>Phân chia prompt, khối text dài (nhất là Claude)</td><td>Vai trò đánh dấu nội dung trong prompt</td></tr>
<tr><td>YAML</td><td>Ít khi</td><td>Gọn hơn JSON nhưng nhạy thụt lề, thiếu constrained decoding từ provider</td></tr>
</table></div>
<div class="verdict"><b>Điều cần nhớ:</b> schema đúng chưa có nghĩa dữ liệu đúng. Mọi field bắt buộc mà input có thể không có là một chỗ model sẽ phải bịa.</div>`,
    why: {
      c: 'Một schema phẳng, mọi field bắt buộc nhưng nullable, enum có other, tên field mang đơn vị, description ghi thang đo và cách xử lý dữ liệu thiếu, evidence bắt buộc đứng đầu. Output là JSON vì đi thẳng vào code và được strict mode bảo đảm.',
      s: 'Schema tối giản kiểu product: str, order_id: str: ngắn nhưng buộc model bịa khi thiếu dữ liệu và làm mất sản phẩm thứ hai. Bắt model điền SKU: biến trích xuất thành đoán catalog. TOON / YAML cho output: tiết kiệm token nhưng mất constrained decoding và phải tốn prompt giải thích format.',
      p: 'Schema dài hơn và nhiều token output hơn (key dài, field evidence). Code phải xử lý null, other và tra SKU. Mỗi lần đổi schema phải compile lại grammar và kiểm tra thứ tự key trên đúng provider đang dùng.'
    },
    deep: [
      {
        q: 'Tên field chỉ để code đọc thôi mà, sao model lại quan tâm?',
        a: `<p>Với constrained decoding, model không đọc schema như một tài liệu riêng. Provider chèn schema vào ngữ cảnh, và khi sinh <code>"price": </code> thì chính chữ <code>price</code> vừa viết là gợi ý gần nhất cho token tiếp theo. Tên mơ hồ thì model đoán, và code ở backend cũng phải đoán y như vậy.</p>
<p>Chọn tên field bên dưới. Model viết số 1290 cho tai nghe Pro X giá 1.290.000đ. Backend đọc theo quy ước của nó (đồng) và tính ra giá trên hoá đơn.</p>`,
        viz(box) {
          const opts = [['price', 1290, 'Không rõ đơn vị. Model viết 1290 (nghìn đồng, kiểu viết tắt trong tin nhắn).'], ['price_vnd', 1290000, 'Đơn vị nằm ở tên: model viết 1290000.'], ['price_thousand_vnd', 1290, 'Tên nói rõ nghìn đồng: backend nhân 1.000.']];
          let i = 0;
          const out = el('div');
          function draw() {
            const [name, v] = opts[i], shown = name === 'price_thousand_vnd' ? v * 1000 : v, wrong = shown !== 1290000;
            out.replaceChildren(preBox(esc(`{"product_name": "Tai nghe Pro X", "${name}": ${v}}`)),
              el('div', { class: 'stat', html: `<span>Backend hiển thị <b class="${wrong ? 'bad' : 'ok'}">${shown.toLocaleString('vi-VN')}đ</b></span><span>Giá thật <b>1.290.000đ</b></span>${wrong ? `<span class="bad">Sai ${Math.round(1290000 / shown)} lần</span>` : ''}` }),
              el('div', { class: 'cap', text: opts[i][2] + (wrong ? ' Parser và schema (type: integer) đều chấp nhận 1290. Không có lỗi nào được báo.' : '') }));
          }
          box.append(el('div', { class: 'row' }, opts.map((o, k) => el('button', { text: o[0], class: k === 0 ? 'on' : '', onclick: (e) => { i = k; box.querySelectorAll('.row button').forEach((b) => b.classList.remove('on')); e.target.classList.add('on'); draw(); } }))), out);
          draw();
        },
        take: 'Đơn vị và nghĩa nên nằm trong tên (price_vnd, is_cancel_requested). Thứ tên không nói hết thì ghi vào description.'
      },
      {
        q: 'Nếu tin nhắn không có mã đơn, sao model không để trống mà lại bịa?',
        a: `<p>Vì nó không được phép. Constrained decoding che token ở từng bước. Ngay sau <code>"order_id": </code>, schema <code>{"type": "string"}</code> chỉ cho phép một token bắt đầu bằng dấu <code>"</code>. Token <code>null</code> có thể là lựa chọn model thích nhất, nhưng bị che. Phần xác suất còn lại được chia lại cho các token hợp lệ, và token đứng đầu trong số đó là phần đầu của một mã đơn.</p>
<p>Xác suất bên dưới là số giả định để minh hoạ. Trình duyệt che token không hợp lệ rồi chuẩn hoá lại.</p>`,
        viz(box) {
          const cands = [['null', 0.82], ['"DH', 0.1], ['"Kh', 0.05], ['""', 0.03]];
          let nullable = false;
          const out = el('div'), cap = el('div', { class: 'cap' });
          const b = el('button', { text: 'Type: "string"', onclick: () => { nullable = !nullable; b.textContent = nullable ? 'Type: ["string", "null"]' : 'Type: "string"'; b.classList.toggle('on', nullable); draw(); } });
          function draw() {
            const ok = (t) => (t === 'null' ? nullable : true);
            const sum = cands.filter(([t]) => ok(t)).reduce((s, [, p]) => s + p, 0);
            const rows = cands.map(([t, p]) => [t + (ok(t) ? '' : ' (bị che)'), ok(t) ? p / sum : 0, false]);
            const best = rows.reduce((a, r) => (r[1] > a[1] ? r : a));
            best[2] = true;
            out.replaceChildren(hbars(rows, { max: 1, fmt: (v) => (v * 100).toFixed(1) + '%' }));
            cap.innerHTML = nullable ? 'null được phép: model chọn null với 82%. Code biết chắc tin nhắn không có mã đơn.'
              : `<span class="bad">null bị che. "DH chiếm ${(0.1 / 0.18 * 100).toFixed(0)}% sau chuẩn hoá</span>: model tiếp tục viết một mã trông hợp lý, ví dụ "DH-482100". Không có nghĩa là model "nói dối": schema không chừa đường lui. Trong hệ thống thật: dùng ["string", "null"] kèm "null nếu không có", rồi kiểm tra mã đơn có tồn tại (business rule, lab 7).`;
          }
          box.append(el('div', { class: 'row' }, [b]), out, cap);
          draw();
        },
        take: 'Field bắt buộc mà input có thể thiếu = chỗ model buộc phải bịa. Cho null, và đo riêng tỉ lệ model điền giá trị khi đáp án đúng là null.'
      },
      {
        q: 'Thêm "other" vào enum thì làm sao biết khi nào cần thêm nhãn mới?',
        a: `<p>Enum đóng làm mất thông tin một cách im lặng: câu hỏi về bảo hành bị gán "defect" và trông chắc chắn như mọi ticket khác. Có <code>other</code> và <code>category_other</code> (mô tả ngắn), những thứ chưa có tên vẫn được giữ lại. Định kỳ gom <code>category_other</code> theo nhóm: nhóm nào đủ lớn là ứng viên cho nhãn mới.</p>
<p>Dưới đây là 14 giá trị <code>category_other</code> giả định của một tuần. Trình duyệt chuẩn hoá theo từ khoá và đếm.</p>`,
        viz(box) {
          const vals = ['hỏi trả góp 0%', 'Trả góp qua thẻ tín dụng', 'xuất hoá đơn VAT', 'hỏi trả góp 6 tháng', 'đổi địa chỉ nhận', 'góp ý giao diện app', 'Xuất hoá đơn công ty', 'trả góp không cần thẻ', 'hỏi giờ mở cửa', 'trả góp qua ví', 'đổi địa chỉ giao hàng', 'hỏi trả góp', 'xin hoá đơn đỏ', 'hỏi giờ mở cửa'];
          const KW = [['trả góp', 'installment'], ['hoá đơn', 'invoice'], ['địa chỉ', 'address_change']];
          let th = 3;
          const out = el('div');
          function draw() {
            const g = {};
            vals.forEach((v) => { const k = (KW.find(([w]) => v.toLowerCase().includes(w)) || [v.toLowerCase()])[0]; g[k] = (g[k] || 0) + 1; });
            const rows = Object.entries(g).sort((a, b) => b[1] - a[1]);
            out.replaceChildren(hbars(rows.map(([k, n]) => [k, n, n >= th]), { max: vals.length / 2, fmt: (n) => n + ' ticket' }),
              el('div', { class: 'cap', html: rows.filter(([, n]) => n >= th).map(([k]) => `Nhóm "${esc(k)}" vượt ngưỡng: cân nhắc thêm nhãn <code>${(KW.find(([w]) => w === k) || [0, 'mới'])[1]}</code>.`).join(' ') || 'Chưa nhóm nào vượt ngưỡng.' }));
          }
          box.append(el('div', { class: 'row' }, [slider('Ngưỡng thêm nhãn', 2, 6, 1, th, (v) => { th = v; draw(); }, (v) => v + ' ticket').node]), out);
          draw();
        },
        take: 'other không phải thùng rác. Nó là cảm biến cho biết input đã đổi và enum cần lớn thêm.'
      },
      {
        q: 'Sao không cho model trả confidence: 0.73 cho chính xác?',
        a: `<p>Con số 0.73 trông như xác suất đã được hiệu chỉnh: "73% trường hợp như vậy là đúng". Model không bảo đảm điều đó. Nó chỉ sinh ra các token "0", ".", "73" như mọi token khác. Code đặt ngưỡng <code>if confidence &lt; 0.7</code> sẽ hành xử như thể con số đó có nghĩa thống kê.</p>
<p>README khuyên dùng mức có định nghĩa: <code>high</code>, <code>medium</code>, <code>low</code> với "low nếu tin nhắn mơ hồ hoặc phải đoán". Mục đích là định tuyến: ticket <code>low</code> đi sang người duyệt. Kể cả vậy, vẫn phải đối chiếu các mức này với dữ liệu đã gán nhãn để biết "low" thật sự sai nhiều hơn "high" bao nhiêu.</p>`,
        take: 'Mức chắc chắn là nhãn để định tuyến, không phải xác suất. Đo nó trên dữ liệu có nhãn trước khi tin.'
      },
      {
        q: 'Đã khai báo evidence đầu tiên rồi, sao Gemini vẫn sinh category trước?',
        a: `<p>Mỗi provider có quy tắc thứ tự key riêng (README §2.1, §2.4):</p>
<ul><li><b>OpenAI</b>, vLLM / SGLang: theo thứ tự khai báo trong schema.</li><li><b>Claude</b>: field bắt buộc trước, optional sau, trong mỗi nhóm theo thứ tự khai báo.</li><li><b>Gemini</b> <code>responseSchema</code> không có <code>propertyOrdering</code>: bắt buộc trước, theo alphabet (Python SDK giữ thứ tự khai báo). <code>responseJsonSchema</code> và Interactions không ghi rõ.</li></ul>
<p>Chọn provider và cách đặt tên. Trình duyệt sắp xếp ba field theo đúng quy tắc trên.</p>`,
        viz(box) {
          let prov = 'gemini', naming = 'plain', opt = false;
          const out = el('div');
          function draw() {
            const nm = (b, i) => (naming === 'prefix' ? 'abc'[i] + '_' + b : b);
            let props = [['evidence', 0, !opt], ['category', 1, true], ['anger_1_to_5', 2, true]].map(([b, i, req]) => ({ name: nm(b, i), base: b, req }));
            const usePO = naming === 'po' && prov === 'gemini';
            props = usePO ? props : orderProps(props, prov);
            const iE = props.findIndex((p) => p.base === 'evidence'), iC = props.findIndex((p) => p.base === 'category'), bad = iC < iE;
            out.replaceChildren(el('ol', { style: 'margin:4px 0' }, props.map((p) => el('li', { class: 'mono', html: esc(p.name) + (p.req ? '' : ' <span class="hint">(optional)</span>') }))),
              el('div', { class: 'cap', html: bad ? `<span class="bad">category sinh trước evidence.</span> ${prov === 'claude' ? 'evidence là optional nên bị xếp sau mọi field bắt buộc.' : 'Thứ tự alphabet: "anger" &lt; "category" &lt; "evidence".'} Trong hệ thống thật: ${prov === 'claude' ? 'đưa evidence vào required.' : 'thêm propertyOrdering, đặt tên a_evidence, b_category, hoặc bật thinking.'}`
                : '<span class="ok">evidence sinh trước category.</span> Vẫn nên chạy thử một request thật để xem thứ tự key trong output.' }));
          }
          box.append(el('div', { class: 'row' }, [
            select('Provider', [['openai', 'OpenAI'], ['claude', 'Claude'], ['gemini', 'Gemini (responseSchema)']], prov, (v) => { prov = v; draw(); }).node,
            select('Tên', [['plain', 'evidence, category, anger_1_to_5'], ['prefix', 'a_evidence, b_category, c_anger_1_to_5'], ['po', 'propertyOrdering (Gemini)']], naming, (v) => { naming = v; draw(); }).node,
            el('label', { class: 'ctl' }, [el('input', { type: 'checkbox', onchange: (e) => { opt = e.target.checked; draw(); } }), 'evidence là optional'])]), out);
          draw();
        },
        take: 'Thứ tự trong schema chỉ là mong muốn. Thứ tự trong output mới quyết định model có bằng chứng trước khi kết luận hay không.'
      },
      {
        q: 'Lồng object cho gọn theo nhóm thì có sao?',
        a: `<p>Mỗi cấp lồng thêm một key bọc, một cặp ngoặc và thụt lề, tất cả đều là output token. Nó cũng thêm trạng thái cho bộ giải mã (engine phải nhớ đang ở cấp nào) và code đọc phải đi qua đường dài hơn. README: OpenAI cho tối đa 10 cấp, 3–4 cấp thường dễ quản lý.</p>
<p>Kéo số cấp bọc quanh cùng một ticket. Trình duyệt dựng JSON thật và ước lượng token.</p>`,
        viz(box) {
          const base = { order_id: 'DH-482113', category: 'delivery', anger_1_to_5: 4 };
          const names = ['data', 'ticket', 'detail', 'order', 'info', 'payload', 'body', 'content', 'record', 'entry', 'node', 'value'];
          const out = el('div');
          function draw(k) {
            let o = base;
            for (let i = k - 1; i >= 1; i--) o = { [names[(i - 1) % names.length]]: o };
            const txt = JSON.stringify(o, null, 2), t = estTok(txt), t0 = estTok(JSON.stringify(base, null, 2));
            out.replaceChildren(preBox(esc(txt.split('\n').slice(0, 16).join('\n') + (txt.split('\n').length > 16 ? '\n...' : ''))),
              el('div', { class: 'stat', html: `<span>Độ sâu <b>${k}</b> cấp</span><span>Token ước lượng <b>${t}</b> (phẳng: ${t0}, +${Math.round((t / t0 - 1) * 100)}%)</span>` }),
              el('div', { class: 'cap', html: k > 10 ? '<span class="bad">Vượt 10 cấp: OpenAI strict trả 400 (README §2.2).</span>' : k > 4 ? `<span style="color:var(--warn)">Trên 4 cấp.</span> Hợp lệ, nhưng code phải đọc ${Object.keys(o)[0]}...order_id và mỗi ticket trả thêm token chỉ cho ngoặc.` : '<span class="ok">Trong vùng dễ quản lý.</span>' }));
          }
          box.append(el('div', { class: 'row' }, [slider('Số cấp object', 1, 12, 1, 1, draw, (v) => v + ' cấp').node]), out, el('div', { class: 'cap', text: EST_NOTE }));
          draw(1);
        },
        take: 'Gom nhóm cho đẹp có giá: token output, trạng thái decoder và code đọc dài hơn. Chỉ lồng khi dữ liệu thật sự có cấu trúc đó (items là danh sách object).'
      },

function randn(rnd) {

        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
