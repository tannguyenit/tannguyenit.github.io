const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

    summary: `<h3>Tóm tắt bài</h3>
<p>Hầu như mọi API nhận schema dưới dạng JSON Schema hoặc một biến thể, nhưng mỗi provider chỉ hỗ trợ một tập con. Một schema hợp lệ theo chuẩn chưa chắc được API chấp nhận, và một request được chấp nhận chưa chắc đã được áp đủ ràng buộc.</p>
<h4>Bức tranh chung (README §2.1)</h4>

<tr><td><code>minItems</code> / <code>maxItems</code></td><td>Ép</td><td>Chỉ minItems 0 hoặc 1</td><td>Ép</td><td>Ép tới 256</td></tr>
<tr><td>Thứ tự key</td><td>Theo schema</td><td>Bắt buộc trước, optional sau</td><td>propertyOrdering; không có thì xem §2.4</td><td>Không ghi</td></tr>

    why: {
      c: 'Một model gốc (Pydantic / Zod) chứa mọi ràng buộc; schema gửi đi là bản rút gọn theo mẫu số chung của §3.2; response luôn được validate lại bằng model gốc. Lý do: ba provider xử lý cùng một keyword theo ba cách (ép, 400, bỏ lặng lẽ), nên chỉ có kiểm tra phía client là giống nhau ở mọi nơi.',
      s: 'Gửi nguyên schema Pydantic sinh ra: hỏng với OpenAI strict và Claude, chạy "êm" trên Gemini nhưng mất ràng buộc. Viết riêng một schema tay cho mỗi provider: các bản lệch nhau dần, code downstream không biết đang nhận theo bản nào. Tin rằng request 200 nghĩa là schema đã được áp: sai với Gemini (bỏ lặng lẽ), DeepSeek gọi nhầm /v1, Kimi (README §2.6).',

    deep: [
      {
        q: 'Mình viết Pydantic chứ đâu viết JSON Schema. Mỗi dòng Python biến thành keyword gì?',

<p>Chú ý field có giá trị mặc định (<code>= None</code>): Pydantic <b>không</b> đưa nó vào <code>required</code>. Với OpenAI strict, chỉ riêng điều đó đã đủ để request bị từ chối.</p>`,
        viz(box) {

            optdef: ['note: str | None = None', { anyOf: [{ type: 'string' }, { type: 'null' }], default: null }, false],

        take: 'Cùng một dòng Pydantic có thể thành keyword mà provider ép, bỏ qua hay từ chối. Đọc schema SDK thật sự gửi đi, đừng đọc model Python.'

      {
        q: 'Sao provider không nhận hết JSON Schema cho xong? Thiếu keyword thì có gì khó?',
        a: `<p>Vì schema phải được <b>compile thành automaton</b> để che token (bài 2). Có keyword biến thành automaton dễ (<code>enum</code>, <code>type</code>), có keyword làm automaton phình to, có keyword gần như không biểu diễn được bằng việc che từng token (<code>uniqueItems</code>: phải nhớ mọi phần tử đã sinh).</p>
<p>README §2.4: Gemini compile schema thành state machine có giới hạn số trạng thái. Tên property dài tốn trạng thái theo từng ký tự; <code>minItems</code> / <code>maxItems</code> làm schema của item bị <b>nhân bản cho từng vị trí được đếm</b>. Ví dụ <code>maxItems: 3</code>: automaton phải nhớ "đang viết Item thứ 1, thứ 2 hay thứ 3", nên phần mô tả một Item có 3 bản, mỗi bản ứng với một vị trí. <code>maxItems: 100</code> là 100 bản.</p>
<p>Kéo các thanh để thấy độ lớn tăng theo kiểu nhân.</p>`,

          const st = el('div');

            const claude = [...req, ...opt], rows = [

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

  if (!list || !list.length) return null;

    ...list.map((d, i) => {
