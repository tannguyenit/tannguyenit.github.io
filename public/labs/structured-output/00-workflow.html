const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const MSG = 'Cho mình đặt 2 tai nghe Pro X màu đen, giao Q.7 trước 18h, mã đơn cũ SV-4821';
  const CUSTOMER = 'KH-1029';
  const CATALOG = [{ name: 'Tai nghe Pro X', colors: ['đen', 'trắng'], stock: 5 }];
  const ORDERS = { 'SV-4821': 'KH-1029', 'SV-4812': 'KH-5550' };
  const INTENTS = ['new_order', 'complaint', 'order_status', 'other'];
  const FIELDS = ['intent', 'items', 'district', 'deliver_before', 'ref_order_id'];
  const LEVELS = [['prompt', 'Chỉ prompt'], ['json', 'JSON mode'], ['strict', 'Strict schema (mẫu số chung)'], ['cd', 'Constrained decoding đủ ràng buộc']];
  const README_LV = ['README mức 0', 'README mức 2', 'README mức 4, schema gửi đi đã bỏ pattern / min / max theo §3.2', 'README mức 4–5, pattern / min / max cũng được ép khi giải mã'];
  const J = (o) => JSON.stringify(o);
  const GOOD = { intent: 'new_order', items: [{ product: 'Tai nghe Pro X', color: 'đen', qty: 2 }], district: 'Quận 7', deliver_before: '18:00', ref_order_id: 'SV-4821' };
  const withF = (patch) => J(Object.assign({}, GOOD, patch));
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const SCEN = [
    { id: 'ok', name: 'Output đúng', raw: J(GOOD), fin: 'stop', at: [0, 1, 2, 3] },
    { id: 'pre', name: 'Câu dẫn + code fence', raw: 'Dạ, em ghi nhận đơn của anh/chị:\n```json\n' + J(GOOD) + '\n```', fin: 'stop', at: [0],
      block: 'JSON mode trở lên: token đầu tiên chỉ được là { hoặc khoảng trắng, token "Dạ" bị che (logit = -inf).' },

      block: 'Từ JSON mode trở lên: sau dấu phẩy, bộ giải mã chỉ cho phép dấu " mở key mới, nên chuỗi ,} không sinh ra được.' },

      block: 'Strict: tên key lấy từ schema. Sau {"product":"...","color":"đen"," chỉ còn token ghép thành qty; kiểu integer chặn dấu " mở chuỗi.' },
    { id: 'blank', name: 'Content toàn khoảng trắng', raw: '   \n\n        \n  ', fin: 'stop', at: [1],

    { id: 'pattern', name: 'Mã đơn, giờ sai format', raw: withF({ deliver_before: '6h chiều', ref_order_id: '4821' }), fin: 'stop', at: [0, 1, 2],
      block: 'Khi pattern ^SV-\\d{4}$ và ^\\d{2}:\\d{2}$ được ép khi giải mã, sau dấu " mở chuỗi chỉ token bắt đầu bằng "SV" hoặc chữ số hợp lệ.' },
    { id: 'trunc', name: 'Bị cắt vì max_tokens', raw: J(GOOD).slice(0, 112), fin: 'length', at: [0, 1, 2, 3] },
    { id: 'ref', name: 'Mã đơn đảo số SV-4812', raw: withF({ ref_order_id: 'SV-4812' }), fin: 'stop', at: [0, 1, 2, 3] },
    { id: 'color', name: 'Màu trắng thay vì đen', raw: withF({ items: [{ product: 'Tai nghe Pro X', color: 'trắng', qty: 2 }] }), fin: 'stop', at: [0, 1, 2, 3] },
    { id: 'intent', name: 'Phân loại nhầm order_status', raw: withF({ intent: 'order_status' }), fin: 'stop', at: [0, 1, 2, 3] }
  ];
  const LAYERS = [['status', '1. Trạng thái'], ['parse', '2. Parse'], ['schema', '3. Schema'], ['business', '4. Business rules'], ['ground', '5. Grounding']];

  function validate(d, full = true) {
    const e = [];
    const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
    const str = (v) => typeof v === 'string';
    if (!isObj(d)) return ['root: phải là object, nhận ' + (Array.isArray(d) ? 'array' : typeof d)];
    FIELDS.forEach((f) => { if (!(f in d)) e.push(f + ': thiếu field bắt buộc'); });
    Object.keys(d).forEach((k) => { if (!FIELDS.includes(k)) e.push(k + ': field lạ (additionalProperties: false)'); });
    if ('intent' in d && !INTENTS.includes(d.intent)) e.push('intent: ' + J(d.intent) + ' không thuộc enum');
    if ('items' in d) {
      if (!Array.isArray(d.items)) e.push('items: phải là array');
      else {
        if (full && !d.items.length) e.push('items: minItems 1');
        d.items.forEach((it, i) => {
          if (!isObj(it)) { e.push(`items.${i}: phải là object`); return; }
          ['product', 'color', 'qty'].forEach((f) => { if (!(f in it)) e.push(`items.${i}.${f}: thiếu field bắt buộc`); });
          Object.keys(it).forEach((k) => { if (!['product', 'color', 'qty'].includes(k)) e.push(`items.${i}.${k}: field lạ`); });
          if ('product' in it && !str(it.product)) e.push(`items.${i}.product: phải là string`);
          if ('color' in it && it.color !== null && !str(it.color)) e.push(`items.${i}.color: phải là string hoặc null`);
          if ('qty' in it) {
            if (!Number.isInteger(it.qty)) e.push(`items.${i}.qty: phải là integer, nhận ${J(it.qty)}`);
            else if (full && (it.qty < 1 || it.qty > 5)) e.push(`items.${i}.qty: ngoài khoảng 1..5`);
          }
        });
      }
    }
    if ('district' in d && d.district !== null && !str(d.district)) e.push('district: phải là string hoặc null');
    [['deliver_before', /^([01]\d|2[0-3]):[0-5]\d$/], ['ref_order_id', /^SV-\d{4}$/]].forEach(([f, re]) => {
      if (!(f in d) || d[f] === null) return;
      if (!str(d[f])) e.push(f + ': phải là string hoặc null');
      else if (full && !re.test(d[f])) e.push(`${f}: ${J(d[f])} không khớp pattern ${re.source}`);
    });
    return e;
  }

  function business(d) {
    const e = [], notes = [];
    const items = d && Array.isArray(d.items) ? d.items : [];
    if (!items.length) e.push('đơn không có món nào');
    items.forEach((it, i) => {
      const p = CATALOG.find((c) => c.name.toLowerCase() === String(it && it.product || '').toLowerCase());
      if (!p) { e.push(`items[${i}]: "${it && it.product}" không có trong danh mục`); return; }
      if (it.color != null && !p.colors.includes(it.color)) e.push(`items[${i}]: ${p.name} không có màu ${it.color}`);
      if (typeof it.qty !== 'number') e.push(`items[${i}].qty ${'qty' in it ? '= ' + J(it.qty) : 'không có trong object'}: không trừ kho được`);
      else if (it.qty > p.stock) e.push(`items[${i}]: cần ${it.qty}, kho còn ${p.stock}`);
    });
    const ref = d && d.ref_order_id != null ? d.ref_order_id : null;
    if (ref !== null) {
      if (!(ref in ORDERS)) e.push(`đơn cũ ${ref} không có trong bảng orders`);
      else if (ORDERS[ref] !== CUSTOMER) e.push(`đơn ${ref} thuộc khách ${ORDERS[ref]}, không phải ${CUSTOMER}`);
    }
    const extra = d && typeof d === 'object' ? Object.keys(d).filter((k) => !FIELDS.includes(k)) : [];
    if (extra.length) notes.push(`code đọc theo tên field chuẩn nên bỏ qua lặng lẽ: ${extra.join(', ')}. ref_order_id thành null, đơn mất liên kết với đơn cũ.`);
    return { e, notes };
  }

  const ALIAS = { 'quận 7': ['q.7', 'q7', 'quận 7'] };
  function ground(d, mode = 'alias') {
    const src = mode === 'raw' ? MSG : MSG.toLowerCase().replace(/\s+/g, ' ');
    const norm = (s) => (mode === 'raw' ? String(s) : String(s).toLowerCase().replace(/\s+/g, ' '));
    const rows = [];
    const check = (field, v, alts) => {
      if (v === null || v === undefined) return;
      if (src.includes(norm(v))) return rows.push([field, v, 'direct']);
      if (mode === 'alias' && alts && alts.some((a) => src.includes(a))) return rows.push([field, v, 'alias']);
      rows.push([field, v, 'miss']);
    };
    const items = d && Array.isArray(d.items) ? d.items : [];
    items.forEach((it, i) => {
      if (!it) return;
      check(`items[${i}].product`, it.product);
      check(`items[${i}].color`, it.color);
      check(`items[${i}].qty`, it.qty);
    });
    if (d) {
      check('district', d.district, ALIAS[String(d.district).toLowerCase()]);
      const t = /^(\d{2}):(\d{2})$/.exec(String(d.deliver_before));
      check('deliver_before', d.deliver_before, t ? [`${+t[1]}h`, `${+t[1]}g`] : null);
      check('ref_order_id', d.ref_order_id);
    }
    return rows;
  }

  function run(sc, skip) {
    const out = [];
    let data, stopped = null;
    const push = (id, state, html) => out.push({ id, state, html });
    for (const [id] of LAYERS) {
      if (stopped) { push(id, 'na', 'Không chạy tới.'); continue; }
      if (skip[id] && id !== 'parse') { push(id, 'skip', 'Đang tắt lớp này.'); continue; }
      if (id === 'status') {
        if (sc.fin === 'length') { push(id, 'fail', 'finish_reason = "length": output bị cắt vì max_tokens. Không parse, không lưu.'); stopped = id; }
        else if (!sc.raw.trim()) { push(id, 'fail', `content chỉ có ${sc.raw.length} ký tự khoảng trắng, dù finish_reason = "stop" và HTTP 200.`); stopped = id; }
        else push(id, 'pass', `finish_reason = "stop", content dài ${sc.raw.length} ký tự.`);
      } else if (id === 'parse') {
        try { data = JSON.parse(sc.raw); push(id, 'pass', 'JSON.parse thành công.'); } catch (err) { push(id, 'fail', 'JSON.parse báo lỗi (lỗi thật từ trình duyệt): <span class="mono">' + esc(err.message) + '</span>'); stopped = id; }
      } else if (id === 'schema') {
        const e = validate(data);
        if (e.length) { push(id, 'fail', e.map(esc).join('<br>')); stopped = id; } else push(id, 'pass', 'Khớp schema đầy đủ (kể cả pattern và khoảng 1..5).');
      } else if (id === 'business') {
        const { e, notes } = business(data);
        const n = notes.length ? '<br><span style="color:var(--warn)">Chú ý: ' + esc(notes[0]) + '</span>' : '';
        if (e.length) { push(id, 'fail', e.map(esc).join('<br>') + n); stopped = id; } else push(id, 'pass', 'Sản phẩm, màu có trong danh mục; kho đủ; đơn cũ thuộc đúng khách.' + n);
      } else if (id === 'ground') {
        const rows = ground(data), miss = rows.filter((r) => r[2] === 'miss');
        const html = rows.map(([f, v, k]) => `<span class="${k === 'miss' ? 'bad' : ''}">${esc(f)} = ${esc(J(v))}: ${k === 'direct' ? 'có trong tin nhắn' : k === 'alias' ? 'khớp qua bảng alias' : '<b>không thấy trong tin nhắn</b>'}</span>`).join('<br>') + '<br><span class="hint">intent là phân loại, không có chuỗi nào để đối chiếu.</span>';
        if (miss.length) { push(id, 'fail', html); stopped = id; } else push(id, 'pass', html);
      }
    }
    const diff = !stopped && data && typeof data === 'object' ? FIELDS.filter((f) => J(data[f]) !== J(GOOD[f])) : [];
    return { out, stopped, data, diff };
  }

  return {

<li><b>Business rules</b>: mã đơn tồn tại? tổng tiền bằng tổng các dòng? ngày không ở tương lai?</li>

<p>Lab tách "parse" và "schema" thành hai ô để thấy rõ lỗi nào dừng ở đâu; README gộp chúng thành một lớp.</p>

      3.Schema:1, 1.Trạng thái:1, 4.Business:1, 5.Grounding:1, eval:1\nCD đủ      4                            1.Trạng thái:1, 4.Business:1, 5.Grounding:1, eval:1\n\nRút ra: mức đảm bảo càng cao, lỗi cú pháp/schema càng ít, nhưng 3 ca sai nghĩa (mã đơn, màu, intent)\nvẫn còn ở mọi mức và chỉ business rules, grounding hoặc eval có nhãn mới bắt được.",
      measured: true,
      read: ["Cột <b>P J S C</b>: x là mức đảm bảo còn có thể sinh ra ca đó. Lỗi cú pháp chỉ còn ở cột P, lỗi schema hết ở cột C.", "Cột <b>Lớp chặn</b>: ba ca sai nghĩa (mã đơn, màu, intent) đi qua parse và schema, chỉ business rules, grounding hoặc eval bắt.", "Bảng cuối: ngay cả mức cao nhất vẫn còn 4 ca lỗi, trong đó ca bị cắt chỉ lớp trạng thái bắt.", "Output là chuỗi viết tay, không phải output model; code kiểm tra là thật."]
    },
    mount(stage) {
      const st = { lv: 3, sc: 'ok', step: 99, skip: { status: false, schema: false, business: false, ground: false } };
      const lvSel = select('Mức đảm bảo', LEVELS.map(([, t], i) => [i, t]), 3, (v) => { st.lv = +v; st.step = 99; draw(); });
      const lvNote = el('div', { class: 'hint', style: 'margin:-6px 0 10px' });
      const chips = el('div', { class: 'row' });
      const skips = el('div', { class: 'row' }, [el('span', { class: 'hint', style: 'margin:0', text: 'Tắt lớp:' }),
        ...LAYERS.filter(([id]) => id !== 'parse').map(([id, n]) => {
          const cb = el('input', { type: 'checkbox' });

        })]);
      const bStep = el('button', { text: 'Từng bước', onclick: () => { st.step = 0; draw(); } });
      const bNext = el('button', { text: 'Bước tiếp', onclick: () => { st.step = Math.min(99, st.step + 1); draw(); } });
      const bAll = el('button', { text: 'Chạy hết', onclick: () => { st.step = 99; draw(); } });
      const msgBox = el('div', { style: 'background:var(--accent-soft);border-radius:6px;padding:8px 12px;font-size:14px;margin-bottom:10px', html: `<b>Tin nhắn khách:</b> ${esc(MSG)}` });
      const lanes = el('div'), cap = el('div', { style: 'margin-top:10px;font-size:13.5px' });
      const table = el('div'), bars = el('div');
      const COL = { pass: 'var(--ok)', fail: 'var(--bad)', skip: 'var(--warn)', na: 'var(--line)', warn: 'var(--warn)' };
      const TAG = { pass: 'qua', fail: 'chặn tại đây', skip: 'đang tắt', na: 'không chạy tới' };
      const lane = (title, state, html, extra) => el('div', { style: `border-left:4px solid ${COL[state]};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:13.5px;${state === 'na' ? 'opacity:.55' : ''}` },
        [el('div', { style: 'display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap' }, [el('b', { text: title }), el('span', { class: 'mono', style: `font-size:12px;color:${COL[state]}`, text: extra || TAG[state] || '' })]), el('div', { html })]);
      const box = (color, html) => `<div style="border-left:3px solid ${color};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${html}</div>`;
      const caughtBy = (sc) => { const r = run(sc, st.skip); return r.stopped ? LAYERS.find(([id]) => id === r.stopped)[1] : r.diff.length ? 'không lớp nào, vào DB sai' : 'vào DB, dữ liệu đúng'; };

      function draw() {
        lvNote.textContent = README_LV[st.lv] + '.';
        const sc = SCEN.find((s) => s.id === st.sc), possible = sc.at.includes(st.lv);

        bNext.disabled = st.step >= LAYERS.length + 1;

          cap.innerHTML = box('var(--ok)', `Loại lỗi này bị loại ngay từ lúc sinh token, code không cần làm gì. Chọn mức thấp hơn (${LEVELS.filter((_, i) => sc.at.includes(i)).map((l) => l[1]).join(', ')}) để xem nó đi qua các lớp.`);
        } else {
          const r = run(sc, st.skip);
          const shown = (i) => st.step >= i;
          const rawHtml = `<div class="mono" style="white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-top:4px">${sc.raw.trim() ? esc(sc.raw) : `<span class="hint">(${sc.raw.length} ký tự khoảng trắng)</span>`}</div><div class="hint" style="margin-top:4px">finish_reason: <b class="mono">${sc.fin}</b> · HTTP 200</div>`;
          kids.push(lane('Raw output', 'pass', rawHtml, 'model trả về'));
          r.out.forEach((o, i) => { if (shown(i + 1)) kids.push(lane(LAYERS[i][1], o.state, o.html)); });
          if (shown(LAYERS.length + 1)) {
            if (r.stopped) kids.push(lane('Database', 'na', 'Không ghi gì. Request vào luồng xử lý lỗi (retry hoặc người duyệt).', 'không ghi'));
            else {
              const d = r.data || {}, route = { new_order: 'tạo đơn mới', complaint: 'hàng đợi khiếu nại', order_status: 'hàng đợi tra cứu đơn', other: 'người duyệt' }[d.intent] || 'không rõ';
              const row = `<div class="mono" style="font-size:12px;white-space:pre-wrap">INSERT orders ${esc(J({ customer: CUSTOMER, items: d.items, district: d.district ?? null, deliver_before: d.deliver_before ?? null, ref_order_id: d.ref_order_id ?? null }))}\nroute → ${route}</div>`;
              kids.push(lane('Database', r.diff.length ? 'fail' : 'pass', row + (r.diff.length ? `<b class="bad">Khác đáp án đúng ở: ${r.diff.join(', ')}</b>` : ''), r.diff.length ? 'đã ghi dữ liệu sai' : 'đã ghi, đúng'));
            }
          } else kids.push(el('div', { class: 'hint', text: 'Bấm "Bước tiếp" để chạy lớp tiếp theo.' }));
          const parts = [];
          const done = st.step >= LAYERS.length + 1;
          if (done && !r.stopped && r.diff.length) {
            const skipped = LAYERS.filter(([id]) => st.skip[id]).map((l) => l[1]);
            parts.push(box('var(--bad)', `<b>Dữ liệu sai đã vào database</b> (${r.diff.join(', ')}). ` + (sc.id === 'intent'
              ? 'Vì sao: order_status là giá trị hợp lệ của enum, mọi chuỗi đều có trong tin nhắn, nên không lớp nào có gì để bắt. Không có nghĩa các lớp kiểm tra vô ích: chúng bắt lỗi có dấu vết, còn đây là lỗi phán đoán. Trong hệ thống thật: thêm confidence và other vào schema, và đo độ chính xác của intent bằng eval có nhãn.'
              : `Vì sao: đang tắt ${skipped.join(', ') || 'một lớp'}, lớp duy nhất bắt được lỗi này. Không có nghĩa lớp còn lại kém: mỗi lớp nhìn một khía cạnh khác nhau. Trong hệ thống thật: không bỏ lớp nào chỉ vì đã bật strict.`)));
          }
          if (done && sc.id === 'trunc') parts.push(box('var(--warn)', `<b>Bị cắt xảy ra ở cả constrained decoding.</b> Vì sao: bộ giải mã chỉ quyết định token nào được chọn, không quyết định khi nào hết max_tokens. ${st.skip.status ? 'Lớp trạng thái đang tắt nên lỗi rơi xuống parse, và thông báo lỗi parse che mất nguyên nhân thật.' : 'Lớp trạng thái bắt được nó với đúng tên nguyên nhân.'} Trong hệ thống thật: retry với max_tokens lớn hơn, không gửi lại y nguyên.`));
          if (done && sc.id === 'keys' && st.skip.schema) parts.push(box('var(--warn)', '<b>Lớp schema đang tắt.</b> Business rules vẫn bắt được qty sai, nhưng orderId thì bị bỏ qua lặng lẽ: code đọc ref_order_id, không thấy, coi là null. Nếu qty đúng, đơn đã được tạo mà mất liên kết với đơn cũ. Trong hệ thống thật: validate bằng schema với additionalProperties: false để key lạ thành lỗi, không thành null.'));
          if (done && sc.id === 'ok') parts.push(box('var(--ok)', st.skip.ground ? 'Output đúng đi hết các lớp.' : 'Output đúng đi hết các lớp. Lưu ý dòng district ở lớp grounding: "Quận 7" không có nguyên văn trong tin nhắn, chỉ khớp qua bảng viết tắt Q.7. So chuỗi thô sẽ báo động giả ở đây (xem câu hỏi 5).'));
          cap.innerHTML = parts.join('');
        }
        lanes.replaceChildren(...kids);

        const rows = SCEN.filter((s) => s.id !== 'ok' && s.at.includes(st.lv));
        table.innerHTML = '<div class="tbl"><table><tr><th>Loại lỗi có thể xảy ra ở mức này</th><th>Bị bắt ở</th></tr>' + rows.map((s) => { const c = caughtBy(s); return `<tr class="${s.id === st.sc ? 'cur' : ''}"><td>${s.name}</td><td class="${c.startsWith('không') ? 'bad' : ''}">${c}</td></tr>`; }).join('') + '</table></div>';
        const counts = LEVELS.map(([, t], i) => { const rs = SCEN.filter((s) => s.id !== 'ok' && s.at.includes(i)); return [t, rs.length, rs.filter((s) => { const r = run(s, st.skip); return !r.stopped && r.diff.length; }).length, i === st.lv]; });
        bars.replaceChildren(hbars(counts.map(([t, n, , c]) => [t, n, c]), { max: SCEN.length - 1, fmt: (v) => v + ' loại' }),
          el('div', { class: 'stat', html: counts.map(([t, , db]) => `<span>${t}: <b class="${db ? 'bad' : 'ok'}">${db}</b> loại lọt vào DB</span>`).join('') }));
      }

      stage.append(el('div', { class: 'row' }, [lvSel.node]), lvNote, chips, skips, el('div', { class: 'row' }, [bStep, bNext, bAll]), msgBox, lanes, cap,
        el('h4', { style: 'margin:16px 0 4px;font-size:13px', text: 'Mức đang chọn: loại lỗi nào còn xảy ra, lớp nào bắt' }), table,
        el('h4', { style: 'margin:16px 0 4px;font-size:13px', text: 'Số loại lỗi (trong 9 loại của lab) còn có thể xảy ra ở mỗi mức' }), bars,
        el('p', { class: 'hint', text: 'Mười output (một đúng, chín lỗi) là chuỗi viết tay để thấy cơ chế, không phải do model sinh ra, không phải tần suất đo được. Các lớp kiểm tra là code thật chạy trong trình duyệt. Danh mục (Tai nghe Pro X, màu đen / trắng, kho 5) và bảng orders là dữ liệu giả định.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
