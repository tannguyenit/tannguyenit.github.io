const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {

  const PRODUCTS = [['Tai nghe Pro X', 'đen'], ['Sạc nhanh 30W', 'trắng'], ['Cáp USB-C 1m', 'đen'], ['Loa Mini Z', 'xanh'], ['Ốp lưng S24', 'trong suốt'], ['Chuột không dây M2', 'xám']];

  const PRE = ['Dạ', ',', ' đơn', ' của', ' anh', ':', '\n'];
  const STRUCT = '{}[]:,"';
  const J = (o) => JSON.stringify(o);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const tokenize = (s) => s.match(/[{}\[\]:,"]| ?[\p{L}\p{N}]+|\s+|[^\s{}\[\]:,"]/gu) || [];

  function order(n) {
    const items = Array.from({ length: n }, (_, i) => ({ product: PRODUCTS[i % PRODUCTS.length][0], color: PRODUCTS[i % PRODUCTS.length][1], qty: i === 0 ? 2 : 1 + (i % 3) }));
    return J({ intent: 'new_order', items, district: 'Quận 7', deliver_before: '18:00', ref_order_id: 'SV-4821' });
  }
  const CACHE = {};
  const target = (n) => CACHE[n] || (CACHE[n] = { s: order(n), t: tokenize(order(n)) });

  function schemaOk(d) {
    const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
    const keys = (o, ks) => Object.keys(o).length === ks.length && ks.every((k) => k in o);
    if (!isObj(d) || !keys(d, ['intent', 'items', 'district', 'deliver_before', 'ref_order_id'])) return false;
    if (!INTENTS.includes(d.intent) || !Array.isArray(d.items)) return false;
    if (!d.items.every((it) => isObj(it) && keys(it, ['product', 'color', 'qty']) && typeof it.product === 'string' && typeof it.color === 'string' && Number.isInteger(it.qty))) return false;
    return ['district', 'deliver_before', 'ref_order_id'].every((k) => d[k] === null || typeof d[k] === 'string');
  }
  const tryParse = (s) => { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false, err: e.message }; } };
  const WORDS = ['Dạ', 'quantity', ' black', 'hai', ' Pro', 'null', 'X'];

  function corrupt(tok, rnd) {
    if (STRUCT.includes(tok)) { const r = rnd(); return r < 0.5 ? '' : r < 0.75 ? tok + tok : STRUCT[Math.floor(rnd() * STRUCT.length)]; }
    if (/^ ?\d+$/.test(tok)) return String((+tok + 1 + Math.floor(rnd() * 8)) % 10);
    if (/^\s+$/.test(tok)) return tok;
    return WORDS[Math.floor(rnd() * WORDS.length)];
  }

  const VERDICT = {};
  function verdict(n, i, c) {
    const k = n + '|' + i + '|' + c;
    if (!(k in VERDICT)) {
      const cand = target(n).t.slice(); cand[i] = c;
      const p = tryParse(cand.join(''));
      VERDICT[k] = !p.ok ? 'parse' : !schemaOk(p.v) ? 'schema' : 'ok';
    }
    return VERDICT[k];
  }

  function sample(n, lv, P, rnd) {
    const { s: tgt, t } = target(n);
    let toks = t.slice(), first = -1;
    if (lv === 0 && rnd() < P.pre) { toks = PRE.concat(toks); first = 0; }
    const gap = () => Math.floor(Math.log(1 - rnd()) / Math.log(1 - P.eps));
    for (let i = (first === 0 ? PRE.length : 0) + gap(); i < toks.length; i += 1 + gap()) {
      const c = corrupt(toks[i], rnd);
      if (c === toks[i]) continue;
      if (lv >= 1) {
        const v = verdict(n, i, c);
        if (v === 'parse' || (lv >= 2 && v === 'schema')) continue;

      toks[i] = c; if (first < 0) first = i;
    }

    const trunc = toks.length > P.max;
    if (trunc) { text = toks.slice(0, P.max).join(''); kind = 'trunc'; }

  }

    const rnd = seeded(seed * 131 + lv * 7 + n);
    return Array.from({ length: N }, () => sample(n, lv, P, rnd));
  }

        cur = [0, 1, 2].map((lv) => batch(st.n, lv, P, N, st.seed));
        const cs = cur.map(countK);
        info.innerHTML = `<span>Output: <b>${target(st.n).s.length}</b> ký tự ≈ <b>${L}</b> token (ước lượng)</span><span>Lỗi trung bình ε × L = <b>${(P.eps * L).toFixed(2)}</b></span><span>(1 − ε)<sup>L</sup> = <b>${(Math.pow(1 - P.eps, L) * 100).toFixed(1)}%</b></span>`;
        grids.replaceChildren(...cur.map((arr, lv) => el('div', { style: 'margin-bottom:10px' }, [
          el('div', { style: 'display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;margin-bottom:3px' }, [el('b', { style: `color:${LVC[lv]}`, text: LV[lv] }),
            el('span', { class: 'mono', style: 'font-size:12px', html: `đúng <b class="ok">${(cs[lv].ok / N * 100).toFixed(0)}%</b> · sai giá trị ${cs[lv].silent} · sai schema ${cs[lv].schema} · hỏng parse ${cs[lv].parse} · bị cắt ${cs[lv].trunc}` })]),
          el('div', { style: 'display:grid;grid-template-columns:repeat(40,1fr);gap:2px' }, arr.map((s) => el('span', { title: KIND[s.kind][0], style: `height:9px;border-radius:2px;background:${KIND[s.kind][1]}` })))])));
        if (!curve) curve = computeCurve();
        else if (recurve) { clearTimeout(timer); timer = setTimeout(() => { curve = computeCurve(); drawCurve(); }, 250); }
        drawCurve(); drawSample();
        const parts = [];
        if (L > P.max) parts.push(box('var(--bad)', `<b>Cả ba mức đều 0% đúng.</b> Output cần ${L} token nhưng max_tokens chỉ ${P.max}. Vì sao: bộ giải mã chặn token sai, không thêm được ngân sách; model dừng giữa chừng và JSON bị cắt dở. Không có nghĩa strict hỏng: lời hứa của strict chỉ áp dụng khi model hoàn thành câu trả lời. Trong hệ thống thật: kiểm tra finish_reason trước khi parse; tăng max_tokens hoặc chia đơn lớn thành nhiều lần gọi.`));
        else {
          const pOk = cs[0].ok / N;
          if (pOk < 0.5) parts.push(box('var(--bad)', `<b>Chỉ prompt: chỉ còn ${(pOk * 100).toFixed(0)}% output đúng.</b> Vì sao: ${L} token × ε ${P.eps} = trung bình ${(P.eps * L).toFixed(1)} lần chọn sai mỗi output, và chỉ cần một lần là đủ hỏng. Không có nghĩa model "kém JSON": mỗi token vẫn đúng ${((1 - P.eps) * 100).toFixed(2)}%. Trong hệ thống thật: đơn dài là nơi lỗi tập trung; chuyển lên JSON mode hoặc strict thay vì dặn thêm trong prompt.`));
          if (cs[1].schema > 0) parts.push(box('var(--warn)', `<b>JSON mode: ${cs[1].parse} lỗi parse, nhưng ${cs[1].schema} output sai schema.</b> Vì sao: token phá cú pháp bị che, còn token đổi "qty" thành "quantity" vẫn là JSON hợp lệ nên lọt qua. Trong hệ thống thật: JSON mode vẫn cần validate schema; nếu provider có strict, dùng strict.`));
          if (cs[2].silent > 0) parts.push(box('var(--warn)', `<b>Strict: ${cs[2].ok + cs[2].silent} / ${N} output parse được và đúng schema, nhưng ${cs[2].silent} trong số đó sai giá trị.</b> Vì sao: bộ giải mã chỉ che token vi phạm schema; qty 7 hay tên sản phẩm cụt vẫn đúng kiểu. Hàng strict thường có nhiều ô cam hơn hàng prompt: ở hàng prompt, một output vừa sai giá trị vừa hỏng parse được đếm là hỏng parse (ô đỏ), còn strict xoá lỗi parse nên lỗi giá trị lộ ra. Không có nghĩa strict vô ích hay làm sai thêm: hàng strict không có ô đỏ hay tím nào. Trong hệ thống thật: business rules và grounding (lab 00) mới bắt được loại này.`));
        }
        cap.innerHTML = parts.join('');
      }

      stage.append(el('div', { class: 'row' }, [sN.node, sM.node, reseed]), el('div', { class: 'row' }, [sE.node, sP.node]), info,
        el('h4', { style: 'margin:12px 0 6px;font-size:13px', text: `${N} lần sinh cho mỗi mức, cùng một đơn hàng` }), grids, legend, cap,
        el('h4', { style: 'margin:16px 0 2px;font-size:13px', text: 'Tỉ lệ output đúng hoàn toàn theo độ dài (mô phỏng ' + NS + ' mẫu mỗi điểm)' }), svg,
        el('div', { class: 'legend' }, [...LV.map((t, i) => el('span', {}, [el('i', { style: `background:${LVC[i]}` }), t])), el('span', {}, [el('i', { style: 'background:var(--mute)' }), 'nét đứt: (1 − ε)^L × (1 − tỉ lệ câu dẫn)'])]),
        el('h4', { style: 'margin:16px 0 6px;font-size:13px', text: 'Một output cụ thể' }), el('div', { class: 'row' }, [vSel.node, nextBad]), sampleBox,
        el('p', { class: 'hint', text: 'Mô phỏng: mỗi token có xác suất ε bị thay bằng token sai (xoá, lặp hoặc đổi dấu câu; đổi chữ số; đổi từ). JSON mode từ chối token sai nếu riêng token đó làm JSON không parse được; strict từ chối thêm nếu nó làm sai schema, và model chọn lại token đúng. Thực tế model sẽ chọn token hợp lệ có xác suất cao kế tiếp, chưa chắc là token đúng. Đếm token bằng tách theo dấu câu và cụm chữ, không phải tokenizer thật.' }));
      draw(true);
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
