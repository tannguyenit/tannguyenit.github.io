const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

            !kept.length ? note('bad', 'Che hết mọi ứng viên: mẫu số bằng 0, không còn gì để chọn. Engine thật không để xảy ra chuyện này vì automaton luôn còn ít nhất một token hợp lệ, kể cả token model chấm rất thấp. Đó chính là lúc model bị "ép" chọn thứ nó không muốn.')
              : masked.has(' "') && masked.has(' "hai') ? note('warn', `Model dồn ${pct(raw.filter(([t]) => t.startsWith(' "')).reduce((a, x) => a + x[1], 0) / Z)} xác suất cho việc mở chuỗi (muốn viết "hai"). Bị che xong, phần đó chuyển hết sang các số. Model không "đổi ý"; engine chỉ bỏ đi các lựa chọn sai kiểu. Kéo temperature: token bị che vẫn là 0% ở mọi mức.`) : '');
          }
          box.append(el('div', { class: 'row' }, [tS.node]), el('div', { class: 'row' }, btns), out, el('div', { class: 'cap', text: 'Logit lấy từ log của xác suất minh hoạ. Tính softmax thật trong trình duyệt.' }));
          draw();
        },
        take: 'Mask không sửa model, nó cắt bớt lựa chọn. Phần xác suất bị cắt được chia lại cho các token còn lại theo tỉ lệ model đã chấm.'
      },
      {
        q: 'Sao phải che từng bước? Sinh xong rồi kiểm tra, sai thì gọi lại, chẳng phải đơn giản hơn?',
        a: `<p>Đơn giản hơn, nhưng chi phí tăng theo độ dài output. README §1.1 nói: mỗi token thêm vào là thêm một cơ hội sai. Nếu mỗi token có xác suất nhỏ <code>p</code> làm hỏng format, cả chuỗi <code>N</code> token đúng với xác suất khoảng <code>(1 − p)^N</code>. Số lần gọi trung bình để có một output đúng là <code>1 / (1 − p)^N</code>.</p>
<p>Che từng bước thì xác suất hỏng cú pháp bằng 0 ngay từ đầu, không cần gọi lại. Kéo hai thanh để thấy khi nào "validate rồi retry" bắt đầu đắt.</p>`,
        viz(box) {
          const st = el('div');
          const pS = slider('Xác suất hỏng mỗi token (giả định)', 0.0001, 0.01, 0.0001, 0.002, draw, (v) => pct(v));
          const nS = slider('Số token output', 20, 3000, 10, 300, draw, (v) => vi(v));
          function draw() {
            const ok = Math.pow(1 - pS.get(), nS.get()), tries = 1 / ok;
            st.replaceChildren(hbars([['Prompt + validate: P(đúng ngay lần đầu)', ok, false], ['Constrained decoding: P(đúng cú pháp)', 1, true]], { max: 1, fmt: pct }),
              el('div', { class: 'stat', html: `<span>Số lần gọi trung bình: <b>${tries.toFixed(2).replace('.', ',')}</b></span><span>Token output trung bình phải trả: <b>${vi(tries * nS.get())}</b></span>` }),
              ok < 0.5 ? note('bad', `Chưa tới một nửa số lần đầu parse được. Output dài làm retry kéo dài và tốn gấp ${tries.toFixed(1).replace('.', ',')} lần. Không có nghĩa model kém: mỗi token vẫn đúng ${pct(1 - pS.get())}. Trong hệ thống thật: output dài và lồng sâu (danh sách nhiều sản phẩm) là nơi strict schema đáng giá nhất.`) : '');
          }
          box.append(el('div', { class: 'row' }, [pS.node, nS.node]), st, el('div', { class: 'cap', text: 'Mô hình giản lược: coi lỗi các token độc lập nhau. Xác suất hỏng mỗi token là số giả định. Constrained decoding chỉ bảo đảm cú pháp và schema, không bảo đảm output không bị cắt.' }));
          draw();
        },
        take: 'Validate rồi retry tốn theo cấp số mũ của độ dài. Che từng bước đưa lỗi cú pháp về 0 với chi phí cố định mỗi token.'
      },
      {
        q: 'Làm sao engine biết token nào hợp lệ ở một trạng thái, trong khi vocabulary có cả trăm nghìn token?',
        a: `<p>Với regex và schema phẳng, ngữ pháp là một FSM. Ý tưởng then chốt của Outlines (Willard &amp; Louf, 2023, README §1.3): <b>tính sẵn một chỉ mục</b>. Với mỗi trạng thái FSM, chạy thử từng token qua automaton, ghi lại token nào đi được. Lúc giải mã, mask chỉ còn là tra bảng.</p>
<p>Bảng dưới làm đúng việc đó cho một mã đơn theo regex <code>DH-\\d{6}</code>: chữ DH, dấu gạch, rồi 6 chữ số (ví dụ <code>DH-123456</code> trong README; khác mã SV-4821 ở lab 00). Trạng thái là số ký tự đã viết. Mỗi ô được tính bằng cách đưa từng ký tự của token qua FSM.</p>`,
        viz(box) {
          const cls = 'DH-######', toks = ['D', 'DH', 'DH-', 'H', '-', '-1', '1', '12', '482', '4821', '123456', '1234567', 'A'];
          const okAt = (s, t) => [...t].every((c, k) => { const pc = cls[s + k]; return pc !== undefined && (pc === '#' ? /\d/.test(c) : pc === c); });
          const out = el('div'), inp = el('input', { value: 'DH-48', style: 'font:13px var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:140px' });
          function draw() {
            const typed = inp.value, valid = okAt(0, typed), cur = valid ? typed.length : -1;
            let h = '<div class="tbl"><table><tr><th>Trạng thái</th>' + toks.map((t) => `<th class="mono">${esc(t)}</th>`).join('') + '<th>Hợp lệ</th></tr>';
            for (let s = 0; s <= cls.length; s++) {
              const row = toks.map((t) => okAt(s, t)), n = row.filter(Boolean).length;
              h += `<tr${s === cur ? ' style="background:var(--accent-soft)"' : ''}><td class="mono">${s} (${esc(cls.slice(0, s).replace(/#/g, 'd')) || 'rỗng'})</td>` + row.map((v) => `<td class="${v ? 'ok' : 'mute'}">${v ? 'có' : '·'}</td>`).join('') + `<td>${n}/${toks.length}</td></tr>`;
            }
            out.innerHTML = h + '</table></div>';
            if (!valid) out.append(note('bad', `"${esc(typed)}" đã ra khỏi ngữ pháp. Constrained decoding không bao giờ để output tới trạng thái này.`));
            else if (cur === cls.length) out.append(note('warn', 'Đã đủ 9 ký tự: không token nào trong bảng hợp lệ nữa, chỉ còn ⟨eos⟩ hoặc ký tự đóng chuỗi. Token "1234567" bị che ở trạng thái 3 dù chữ số nào cũng đúng kiểu: nó dài quá số chỗ còn lại.'));
          }
          inp.addEventListener('input', draw);
          box.append(el('div', { class: 'row' }, [el('label', { class: 'ctl' }, ['Đã sinh', inp])]), out, el('div', { class: 'cap', text: 'Hàng tô màu là trạng thái ứng với chuỗi bạn gõ. Bảng được tính một lần cho mỗi cặp trạng thái, token; giải mã thật chỉ tra hàng hiện tại.' }));
          draw();
        },
        take: 'Mask là một hàng trong bảng (trạng thái × token). Tính bảng tốn công một lần khi compile, sau đó mỗi bước chỉ tra.'
      },
      {
        q: 'JSON có object trong object, mảng trong object. FSM có xử lý được không?',
        a: `<p>Không trọn vẹn. FSM có số trạng thái hữu hạn, nên chỉ nhớ được độ sâu tới một mức cố định. Để biết dấu <code>}</code> tiếp theo đóng cấp nào, engine cần một <b>ngăn xếp</b>: gặp <code>{</code> hoặc <code>[</code> thì đẩy vào, gặp <code>}</code> hoặc <code>]</code> thì lấy ra. Ngữ pháp như vậy là ngữ pháp phi ngữ cảnh (CFG), automaton tương ứng là pushdown automaton.</p>
<p>Với ngăn xếp, số tổ hợp trạng thái không còn hữu hạn nên không tính sẵn mọi mask được (README §1.3). XGrammar chia token thành nhóm <b>độc lập ngữ cảnh</b> (kiểm tra sẵn, cache theo trạng thái) và nhóm <b>phụ thuộc ngữ cảnh</b> (nhỏ, kiểm tra lúc chạy dựa trên ngăn xếp hiện tại; README gọi là persistent stack). Sửa JSON bên dưới và kéo thanh "FSM nhớ được" để thấy khi nào FSM thuần không đủ.</p>`,
        viz(box) {
          const ta = el('textarea', { rows: 3, spellcheck: 'false', style: 'width:100%;font:12px/1.5 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px' });
          ta.value = '{"kind": "order", "items": [{"name": "Pro X", "qty": 2, "tags": ["tai nghe"]}], "ship": {"to": "Cầu Giấy"}}';
          const out = el('div');
          const kS = slider('FSM nhớ được (giả định)', 1, 6, 1, 2, draw, (v) => v + ' cấp');
          function draw() {
            const s = ta.value, stack = [], depth = [];
            let inStr = false, escp = false, max = 0, err = null;
            for (const c of s) {
              if (inStr) { if (escp) escp = false; else if (c === '\\') escp = true; else if (c === '"') inStr = false; }
              else if (c === '"') inStr = true;
              else if (c === '{' || c === '[') stack.push(c);
              else if (c === '}' || c === ']') { const top = stack.pop(); if (!top || (top === '{') !== (c === '}')) { err = err || `"${c}" không khớp với cấp đang mở`; } }
              max = Math.max(max, stack.length); depth.push(stack.length);
            }
            const k = kS.get(), cells = depth.map((d, i) => el('span', { title: `ký tự ${i}: sâu ${d}`, style: `flex:1;min-width:1px;height:${6 + d * 8}px;background:${d > k ? 'var(--bad)' : 'var(--accent)'};align-self:flex-end` }));
            out.replaceChildren(el('div', { style: 'display:flex;gap:1px;height:60px;align-items:flex-end;border-bottom:1px solid var(--line)' }, cells),
              el('div', { class: 'stat', html: `<span>Độ sâu lớn nhất: <b>${max}</b></span><span>Ngăn xếp cuối: <b>${stack.join(' ') || 'rỗng'}</b></span>` }),
              err || stack.length ? note('bad', 'JSON chưa cân: ' + (err || 'còn ' + stack.length + ' cấp chưa đóng') + '. Engine có ngăn xếp sẽ chỉ cho phép đúng ký tự đóng cấp trên cùng.') :
                max > k ? note('warn', `JSON sâu ${max} cấp, FSM chỉ nhớ ${k}. Các cột đỏ là đoạn FSM không còn biết mình đang ở cấp nào, nên không biết "}" hay "]" mới hợp lệ. Không có nghĩa là không ràng buộc được: engine dùng ngăn xếp. Trong hệ thống thật: mỗi cấp lồng làm tăng trạng thái của bộ giải mã; README §3.1 khuyên 3–4 cấp, OpenAI cho tối đa 10.`) : note('ok', 'FSM với số cấp này đủ cho JSON hiện tại.'));
          }
          ta.addEventListener('input', draw);
          box.append(ta, el('div', { class: 'row' }, [kS.node]), out, el('div', { class: 'cap', text: 'Chiều cao cột là độ sâu ngăn xếp tại từng ký tự, tính thật bằng cách quét chuỗi.' }));
          draw();
        },
        take: 'JSON lồng nhau cần ngăn xếp. Đó là lý do engine hiện đại tách token "tra bảng được" và token "phải kiểm tra theo ngăn xếp".'
      },
      {
        q: 'Ngữ pháp định nghĩa trên ký tự, model lại sinh token nhiều ký tự. Hai thứ này khớp nhau thế nào?',
        a: `<p>Engine phải đưa <b>từng ký tự</b> của token qua automaton. Token chỉ hợp lệ nếu mọi ký tự của nó đều đi được. README §1.3 lấy ví dụ: token <code>27</code> hợp lệ khi đang ở đầu một năm <code>YYYY</code>, nhưng không hợp lệ khi chỉ còn thiếu một chữ số.</p>
<p>Thêm một tầng: token có thể là chuỗi byte UTF-8 dang dở. Chữ "ầ" trong "Cầu Giấy" chiếm 3 byte. Tokenizer có thể cắt giữa các byte đó, nên engine phải làm việc ở mức byte, đặc biệt với tiếng Việt.</p>
<p>Ví dụ dưới là ngày giao <code>delivery_date</code> dạng <code>YYYY-MM-DD</code>. Kéo số ký tự đã sinh để xem token nào còn hợp lệ.</p>`,
        viz(box) {
          const pat = '####-##-##', full = '2026-12-05', toks = ['2', '20', '27', '2026', '2026-', '-', '-1', '-12', '12', '1', '05', '5', '-0'];
          const okAt = (s, t) => [...t].every((c, k) => { const pc = pat[s + k]; return pc !== undefined && (pc === '#' ? /\d/.test(c) : pc === c); });
          const out = el('div'), bytes = el('div');
          const sS = slider('Đã sinh', 0, 10, 1, 3, draw, (v) => '"' + full.slice(0, v) + '"');
          const inp = el('input', { value: 'Cầu Giấy', style: 'font:13px var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:160px' });
          function draw() {
            const s = sS.get(), ok = toks.filter((t) => okAt(s, t));
            out.replaceChildren(el('div', {}, toks.map((t) => chip(t, okAt(s, t) ? 'var(--accent-soft)' : 'transparent', okAt(s, t) ? 'var(--ink)' : 'var(--dim)', okAt(s, t) ? '' : 'text-decoration:line-through;border:1px dashed var(--line)'))),
              el('div', { class: 'stat', html: `<span>Còn thiếu: <b>${pat.length - s}</b> ký tự (<span class="mono">${pat.slice(s).replace(/#/g, 'd') || 'không'}</span>)</span><span>Token hợp lệ: <b>${ok.length}</b>/${toks.length}</span>` }),
              s === 3 ? note('warn', 'Đang ở chữ số cuối của năm: "2" hợp lệ, "27" thì không, dù cả hai đều toàn chữ số. Token "27" sẽ đẩy ký tự "7" vào chỗ phải là dấu "-". Không có nghĩa "7" là chữ số xấu; nó chỉ không vừa chỗ còn lại.') : '');
            const enc = new TextEncoder();
            bytes.replaceChildren(el('div', {}, [...inp.value].map((c) => { const b = [...enc.encode(c)]; return el('span', { class: 'mono', style: `display:inline-block;margin:2px;padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid ${b.length > 1 ? 'var(--warn)' : 'var(--line)'}`, text: `${c === ' ' ? '␠' : c} = ${b.map((x) => x.toString(16).toUpperCase().padStart(2, '0')).join(' ')}` }); })),
              el('div', { class: 'stat', html: `<span>Ký tự: <b>${[...inp.value].length}</b></span><span>Byte UTF-8: <b>${enc.encode(inp.value).length}</b></span>` }));
          }
          inp.addEventListener('input', draw);
          box.append(el('div', { class: 'row' }, [sS.node]), out, el('h4', { text: 'Byte UTF-8 của một chuỗi tiếng Việt', style: 'margin:12px 0 4px;font-size:13px' }), el('div', { class: 'row' }, [el('label', { class: 'ctl' }, ['Chuỗi', inp])]), bytes,
            el('div', { class: 'cap', text: 'Ô viền cam là ký tự nhiều byte: một token có thể kết thúc giữa các byte đó. Byte được tính thật bằng TextEncoder.' }));
          draw();
        },
        take: 'Token hợp lệ là token mà mọi ký tự (thậm chí mọi byte) của nó đều đi được qua automaton từ trạng thái hiện tại.'
      },
      {
        q: 'Nếu ngữ pháp đã biết chắc ký tự tiếp theo, có cần hỏi model không?',
        a: `<p>Không cần. Sau <code>{"</code>, schema ShopViet chỉ cho một key là <code>kind</code>, nên engine ghi luôn <code>kind": </code> mà không chạy model qua từng token. SGLang gọi kỹ thuật này là <i>compressed FSM</i>, cộng đồng hay gọi là <i>jump-forward decoding</i> (README §1.3).</p>
<p>Bên dưới, lab chạy bộ giải mã có ràng buộc cho từng tin nhắn rồi đánh dấu từng ký tự của output: ký tự nào là lựa chọn duy nhất ngữ pháp cho phép (ghi thẳng được), ký tự nào có nhiều lựa chọn (cần model).</p>`,
        viz(box) {
          const out = el('div');
          function draw(k) {
            const opts = { max: 5, nullable: false }, r = decode(MSG[k], opts, true), G = r.G;
            let st = { i: 0, b: '' }, forced = 0;
            const spans = [...r.out].map((c) => { const n = nextChars(G, st); const f = n.length === 1; if (f) forced++; st = feed(G, st, c); return el('span', { style: `background:${f ? 'var(--line)' : 'var(--accent)'};color:${f ? 'var(--mute)' : '#fff'};padding:1px 0`, text: c }); });
            const n = r.out.length;
            out.replaceChildren(el('div', { class: 'mono', style: 'font-size:14px;line-height:2' }, spans),
              el('div', { class: 'stat', html: `<span>Ký tự output: <b>${n}</b></span><span>Ghi thẳng được: <b>${forced}</b> (${pct(forced / n)})</span><span>Cần model chọn: <b>${n - forced}</b></span><span>Token model đã sinh: <b>${r.steps.length - 1}</b></span>` }),
              note('ok', `Trong ${n} ký tự, chỉ ${n - forced} ký tự thật sự là lựa chọn. Phần còn lại là khung của schema. Trong hệ thống thật: phần tiết kiệm này giúp bù chi phí tính mask; nó cũng là lý do tên key dài không làm model "nghĩ" lâu hơn, nhưng vẫn tốn trạng thái automaton.`));
          }
          const s = select('Tin nhắn', Object.entries(MSG).map(([k, m]) => [k, m.label]), 'A', draw);
          box.append(el('div', { class: 'row' }, [s.node]), out, el('div', { class: 'legend', html: '<span><i style="background:var(--line)"></i>chỉ một ký tự hợp lệ, ghi thẳng</span><span><i style="background:var(--accent)"></i>nhiều lựa chọn, cần model</span>' }));
          draw('A');
        },
        take: 'Ràng buộc không chỉ chặn. Khi chỉ còn một đường đi, nó còn làm nhanh hơn vì bỏ qua bước gọi model.'
      },
      {
        q: 'Vậy "cái giá" của constrained decoding nằm ở đâu, và khi nào nó đột nhiên đắt?',
        a: `<p>Hai khoản chính (README §1.3): <b>compile grammar</b> lần đầu gặp một schema (vài ms đến vài giây, Claude cache 24 giờ, timeout 180 giây) và <b>tính mask</b> mỗi token (hàng chục µs với XGrammar, llguidance; llguidance khoảng 50 µs với tokenizer 128K).</p>
<p>Compile là khoản dễ thấy nhất: request đầu với schema mới chậm hơn. Nếu code dựng schema mới cho từng request (ví dụ chèn danh sách sản phẩm còn hàng vào <code>enum</code>), mọi request đều là "lần đầu".</p>`,
        viz(box) {
          const st = el('div');
          let dyn = false;
          const cS = slider('Thời gian compile (giả định)', 10, 5000, 10, 800, draw, (v) => vi(v) + ' ms');
          const rS = slider('Request mỗi giờ', 10, 5000, 10, 600, draw, (v) => vi(v));
          const tS = slider('Token output mỗi request', 20, 2000, 10, 40, draw, (v) => vi(v));
          const dB = el('button', { text: 'Schema đổi theo từng request', onclick: () => { dyn = !dyn; dB.classList.toggle('on', dyn); draw(); } });
          function draw() {

    mount(stage) {

      function reset() { R = decode(MSG[S.msg], opts(), S.on); S.k = 0; render(); }

        const G = R.G, labels = ['{"kind": ', '"order" | "ticket"', ', "qty": ', G[3].max ? '1–' + G[3].max : 'số ≥ 1', '}', '⟨eos⟩'];

          else if (c.schema.length) stepBox.append(note('bad', `Parse được nhưng sai schema: ${esc(c.schema.join('; '))}. ${real}validate bằng model gốc trước khi dùng.`));
          else if (!c.meaning) {
            const why = m.truth.qty === null ? `Khách chỉ hỏi tình trạng đơn, không có số lượng. Model chấm " null" cao nhất nhưng schema không cho null, nên engine chọn số hợp lệ có xác suất cao nhất còn lại.` : m.truth.qty > 5 ? `Token " 12" bị che vì vượt maximum 5. " 1" hợp lệ nên được chọn; sau "1", model muốn "2" nhưng "12" vượt 5 nên chỉ còn "}".` : 'Giá trị hợp lệ nhưng khác ý khách.';
            stepBox.append(note('bad', `<b>Đúng cú pháp, đúng schema, sai nghĩa.</b> Backend nhận qty ${esc(JSON.stringify(c.obj.qty))} thay vì ${esc(JSON.stringify(m.truth.qty))}. ${why} Không có nghĩa model đọc sai tin nhắn; đáp án đúng không nằm trong tập hợp lệ. ${real}cho phép null, bỏ giới hạn nghiệp vụ khỏi schema và kiểm tra trong code (thử schema "qty integer hoặc null"). README §1.6.`));
          } else if (c.obj.kind === 'order' && c.obj.qty > 5) stepBox.append(note('warn', `Đúng ý khách: qty ${c.obj.qty}. Giới hạn 5 sản phẩm một đơn chat (quy tắc giả định của ShopViet) giờ được kiểm tra trong code sau khi parse: code thấy ${c.obj.qty} &gt; 5 và chuyển cho nhân viên, thay vì âm thầm tạo đơn 1 cục.`));
          else stepBox.append(note('ok', 'Parse được, đúng schema, đúng ý khách.' + (S.on ? '' : ' Lần này may: không có ràng buộc thì không có gì bảo đảm lần sau cũng vậy.')));
        }
        stat.innerHTML = `<span>Bước <b>${Math.min(S.k, R.steps.length)}</b>/${R.steps.length}</span><span>Ký tự output <b>${outNow.length}</b></span><span>${S.on ? 'Lần token model thích nhất bị che' : 'Lần chọn token vi phạm ngữ pháp'}: <b>${R.steps.slice(0, S.k).filter((s) => s.st && (S.on ? !s.d[0][2] : !tokOk(G, s.st, s.chosen))).length}</b></span>`;
        nextB.disabled = done; backB.disabled = S.k === 0;
      }
      const mS = select('Tin nhắn khách', Object.entries(MSG).map(([k, m]) => [k, m.label]), S.msg, (v) => { S.msg = v; reset(); });
      const vS = select('Schema', [['v1', 'qty: integer 1–5, bắt buộc'], ['v2', 'qty: integer hoặc null, không maximum']], S.v, (v) => { S.v = v; reset(); });
      stage.append(el('div', { class: 'row' }, [mS.node, vS.node, onB]), msgBox, schBox, strip,
        el('h4', { text: 'Output đã sinh', style: 'margin:10px 0 4px;font-size:13px' }), outBox,
        el('div', { class: 'row', style: 'margin-top:8px' }, [zeroB, backB, nextB, allB]), stat, stepBox,
        el('p', { class: 'hint', text: 'Bộ giải mã đồ chơi: 35 token, greedy, automaton viết tay cho đúng schema này với khoảng trắng cố định (", " và ": "). Automaton và mask được tính thật trong trình duyệt; xác suất của model là số dựng sẵn để minh hoạ.' }));
      reset();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
