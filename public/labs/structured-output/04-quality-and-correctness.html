const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

          const c = calc(2), A = `{"total_vnd": ${c.total}, "reasoning": "${c.reasoning}"}`, B = `{"reasoning": "${c.reasoning}", "total_vnd": ${c.total}}`;

        take: 'Field nào đứng trước thì được quyết định trước. Thứ tự key là thứ tự suy nghĩ của model.'

      {
        q: 'Có nghiên cứu nói ép format làm model kém đi. Thật không?',
        a: `<p>Kết quả khác nhau, và README ghi rõ lý do.</p>
<ul><li><b>"Let Me Speak Freely?"</b> (Tam et al., 08/2024) báo cáo suy luận giảm đáng kể khi bị ràng buộc format, format càng chặt giảm càng nhiều trên các bài như GSM8K (bộ bài toán đố cần tính nhiều bước). Với phân loại, ràng buộc lại có thể giúp.</li>
<li><b>"Say What You Mean"</b> (nhóm .txt, tác giả Outlines) chạy lại và thấy ngược lại: trên Llama-3-8B-Instruct, structured bằng hoặc tốt hơn unstructured trên GSM8K, Last Letter, Shuffle Object (ví dụ Last Letter 0,73 so với 0,77). Họ chỉ ra ba vấn đề của thí nghiệm gốc: dùng Claude 3 Haiku làm "AI parser" chấm output tự do, prompt JSON mode không nhắc tới JSON hay schema, và prompt hai điều kiện không tương đương.</li>
<li>Một bản tái lập độc lập xác nhận phần lớn phản biện, nhưng ghi nhận kết quả <b>phụ thuộc model và cách prompt</b>.</li></ul>
<p>Bài học không phải "structured tốt" hay "structured xấu". Bài học là: so sánh hai điều kiện phải công bằng (cùng prompt, cùng cách chấm), và phải phân biệt tác vụ trích xuất với tác vụ suy luận.</p>`,
        take: 'Không có câu trả lời chung. So sánh các cách bố trí trên chính dữ liệu của bạn trước khi chọn.'

      {
        q: 'CRANE nói grammar quá chặt "loại bỏ chỗ suy luận". Chỗ đó ở đâu trong một chuỗi JSON?',
        a: `<p>Hãy đếm xem trong output, ký tự nào do grammar quyết định và ký tự nào model được tự chọn.</p>
<ul><li>Dấu <code>{</code>, tên key, dấu <code>:</code>, dấu phẩy: schema đã cố định, ở mỗi bước chỉ có đúng một lựa chọn hợp lệ. Model không "nghĩ" gì ở đây.</li>
<li>Chữ số của total_vnd: model chọn, nhưng chỉ trong tập chữ số.</li>
<li>Nội dung chuỗi reasoning: gần như tự do. Đây là chỗ duy nhất model có thể viết ra các bước trung gian.</li></ul>
<p>Với schema chỉ có <code>{"total_vnd": integer}</code>, phần tự do chỉ là vài chữ số. CRANE thêm vào grammar một vùng cho phép đoạn suy luận trước phần có cấu trúc, và báo cải thiện tới 10 điểm phần trăm trên GSM-symbolic và FOLIO. Field reasoning đặt trước, hay thinking, là cùng một ý tưởng.</p>`,
        viz(box) {
          const c = calc(2), out = el('div'), stat = el('div', { class: 'stat' });
          const variants = { only: [['f', '{"total_vnd": '], ['d', String(c.total)], ['f', '}']], first: [['f', '{"reasoning": "'], ['r', c.reasoning], ['f', '", "total_vnd": '], ['d', String(c.total)], ['f', '}']] };
          function draw(k) {

          box.append(el('div', { class: 'row' }, [s.node]), out, stat,

        take: 'Muốn model tính trước khi chốt thì phải chừa chỗ cho phép tính: field suy luận đứng trước, hoặc thinking nằm ngoài grammar.'

      {
        q: 'Vậy chỉ cần khai báo reasoning trước total_vnd trong schema là xong?',
        a: `<p>Chưa. Thứ tự <b>khai báo</b> trong schema chưa chắc là thứ tự <b>sinh</b>. README ghi mỗi provider một luật:</p>
<ul><li><b>OpenAI</b>, <b>vLLM / SGLang</b>: theo thứ tự trong schema.</li>
<li><b>Claude</b>: field bắt buộc trước, optional sau, trong mỗi nhóm theo thứ tự khai báo. Nếu reasoning là optional còn total_vnd bắt buộc, total_vnd được sinh trước.</li>
<li><b>Gemini</b> (<code>responseSchema</code>, Vertex): <code>propertyOrdering</code> quy định thứ tự. Không có thì Python SDK giữ thứ tự khai báo; các trường hợp khác theo alphabet, bắt buộc trước. Tài liệu <code>responseJsonSchema</code> và Interactions không ghi rõ.</li></ul>
<p>Ví dụ theo alphabet: "reasoning" bắt đầu bằng r, "total_vnd" bắt đầu bằng t. r đứng trước t, nên reasoning vẫn được sinh trước, may mắn trùng ý bạn. Đổi tên thành "answer" và "reasoning" thì a đứng trước r, answer lên trước và model chốt đáp án trước khi lập luận. Gõ tên field bên dưới để thử.</p>`,
        viz(box) {
          const rows = [['reasoning', true], ['total_vnd', true], ['note', false]].map(([n, r]) => ({ name: el('input', { type: 'text', value: n, style: 'width:140px;font:13px var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)' }), req: el('input', { type: 'checkbox' }), r }));

            out.replaceChildren(flat('<div class="tbl"><table><tr><th>Provider</th><th>Thứ tự sinh</th></tr>' + prov.map(([p, t]) => {

          box.append(el('div', {}, rows.map((x, i) => el('div', { class: 'row', style: 'margin-bottom:4px' }, [el('span', { class: 'mono', text: `field ${i + 1}` }), x.name, el('label', { class: 'ctl' }, [x.req, 'bắt buộc'])]))), out,
            el('div', { class: 'cap', text: 'Dấu ? là field optional. Thử đổi "reasoning" thành "z_reasoning", hoặc bỏ tick bắt buộc ở reasoning, rồi xem cột Claude và Gemini. Mẹo trong README: đặt tên a_reasoning, b_answer để khớp alphabet.' }));

        take: 'Field đứng trước kết luận phải là field bắt buộc, và phải kiểm tra thứ tự key thật trên đúng API đang dùng.'

      {
        q: 'Thế thì cho field reasoning viết thật dài, "lập luận từng bước thật chi tiết", cho chắc?',
        a: `<p>Có hai cái giá.</p>
<ul><li><b>Token.</b> Mỗi ký tự reasoning là output token phải trả tiền và chờ, ở mọi request, kể cả những tin nhắn đơn giản như "đặt 1 tai nghe".</li>
<li><b>Refusal trên Claude.</b> README ghi: yêu cầu chain-of-thought chi tiết trong một property có thể kích hoạt refusal loại <code>reasoning_extraction</code>. Tài liệu khuyên xin "giải thích ngắn"; muốn suy luận kỹ thì bật thinking.</li></ul>
<p>README §3.5 còn gợi ý: nếu mục đích là kiểm tra kết quả, một field <code>evidence</code> ngắn (câu trích từ input) thường hữu ích hơn một đoạn lập luận dài.</p>`,
        viz(box) {
          const S = { len: 200, n: 10000, d: 'short' }, out = el('div');
          function draw() {

              S.d === 'long' ? note('bad', '<b>Description xin "lập luận từng bước thật chi tiết".</b> Trên Claude, README ghi yêu cầu này trong một property có thể kích hoạt refusal <code>reasoning_extraction</code>: <code>stop_reason: "refusal"</code>, HTTP 200, vẫn tính tiền. Không có nghĩa mọi request đều bị từ chối, nhưng bạn đang tự mở một đường lỗi. <br>Trong hệ thống thật: viết "giải thích ngắn, tối đa 2 câu", hoặc bật thinking.') : note('ok', 'Description xin giải thích ngắn: đúng lời khuyên của tài liệu Claude.'));

      {
        q: 'Còn trích đơn hàng ShopViet thì sao, ép format có làm hại không?',
        a: `<p>Thường là không, và thường còn giúp. Với "Cho mình đặt 1 tai nghe với 2 củ sạc", mọi giá trị cần điền đã nằm sẵn trong input: sản phẩm, số lượng, số điện thoại. Model không cần tính nhiều bước, chỉ cần chép và phân loại. Grammar loại bỏ lỗi cú pháp, enum loại bỏ nhãn lạ. "Let Me Speak Freely?" cũng ghi với tác vụ phân loại, ràng buộc có thể giúp.</p>
<p>Nhưng chính vì format luôn đúng, lỗi còn lại trở nên <b>khó thấy hơn</b>. Một JSON parse được, đủ key, đúng kiểu thì đi thẳng vào database. Không có exception nào báo rằng mã đơn là bịa. Đó là phần thứ hai của bài: đúng schema chưa phải là đúng.</p>`,
        take: 'Với trích xuất, format chặt là có lợi. Rủi ro chuyển từ "không parse được" sang "parse được nhưng sai".'

      {
        q: 'Khách không nhắc mã đơn. Vì sao model lại điền "DH-123456" thay vì để trống?',

<p>README §1.6: cho phép <code>null</code> hoặc <code>"unknown"</code> để biểu diễn trường hợp thiếu dữ liệu. Khi đó output hợp lệ có thêm một lựa chọn đúng với thực tế.</p>`,

        viz(box) {

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {

  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}

  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
