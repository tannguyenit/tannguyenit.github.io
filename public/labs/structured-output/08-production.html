const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<p>Với một ticket nhỏ, phần "khung" có thể nhiều hơn phần giá trị. Đổi tên key, kiểu định dạng và thêm field reasoning bên dưới. Trình duyệt dựng JSON thật và đếm ký tự.</p>`,
      viz(box) {
        const S = { keys: 'short', pretty: 0, reason: 0, n: 10000 };
        const vals = { intent: 'delivery', order_id: 'DH-204518', product: null, quantity: null, price_vnd: null };
        const LONG = { intent: 'request_intent_category', order_id: 'customer_order_identifier', product: 'product_display_name', quantity: 'requested_quantity', price_vnd: 'quoted_price_vnd' };
        const REASON = 'Khách nhắc mã đơn DH-204518 và nói giao 3 ngày chưa nhận, nên đây là yêu cầu về giao hàng chứ không phải đổi trả hay bảo hành.';

    {

<p>Trên OpenAI (GPT-6 trở lên, Responses API), có thể nối một item <code>configuration_update</code> vào input trước lượt tiếp theo. Lịch sử phía trước giữ nguyên, nên tiền tố không đổi và cache vẫn dùng được.</p>
<p>Kéo thanh trượt để đổi schema ở một lượt bất kỳ và xem số token phải xử lý lại không có cache.</p>`,
      viz(box) {
        const T = 12, SYS = 3300, PER = 400, UPD = 30, W = 560, H = 150;
        const S = { k: 7, mode: 'claude' };
        const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 24}`, role: 'img', 'aria-label': 'Token có cache và không cache theo lượt' });
        const out = el('div', { class: 'stat' }), note = el('p', { class: 'hint' });
        function turns(k, mode) {
          return Array.from({ length: T }, (_, i) => {
            const t = i + 1, prefix = SYS + PER * (t - 1);
            if (t === 1) return { cached: 0, miss: prefix };
            if (t === k) return mode === 'claude' ? { cached: 0, miss: prefix } : { cached: prefix - PER, miss: PER + UPD };
            return { cached: prefix - PER, miss: PER };
          });
        }
        function draw() {
          const rows = turns(S.k, S.mode), base = turns(0, S.mode), mx = SYS + PER * T, bw = W / T;
          const extra = rows.reduce((a, r) => a + r.miss, 0) - base.reduce((a, r) => a + r.miss, 0);
          svg.replaceChildren(...rows.flatMap((r, i) => {
            const hc = (r.cached / mx) * (H - 10), hm = (r.miss / mx) * (H - 10), x = i * bw + 4;
            return [el('rect', { x, y: H - hc - hm, width: bw - 8, height: hc, rx: 2, fill: 'var(--accent-soft)', stroke: 'var(--accent)' }),
              el('rect', { x, y: H - hm, width: bw - 8, height: Math.max(1, hm), rx: 2, fill: i + 1 === S.k && S.mode === 'claude' ? 'var(--bad)' : 'var(--warn)' }),
              el('text', { x: x + bw / 2 - 10, y: H + 16, class: 'mute', text: 'L' + (i + 1) })];
          }), el('line', { x1: 0, x2: W, y1: H, y2: H, stroke: 'var(--line)' }));
          out.innerHTML = `<span>Token xử lý lại thêm do đổi schema: <b class="${extra > 1000 ? 'bad' : 'ok'}">${extra.toLocaleString('vi-VN')}</b></span><span>Lượt ${S.k} không có cache: <b>${rows[S.k - 1].miss.toLocaleString('vi-VN')}</b> token</span>`;

            : `configuration_update chỉ thêm khoảng ${UPD} token (giả định) ở cuối. Tiền tố giữ nguyên nên lượt ${S.k} vẫn dùng cache. Trong hệ thống thật: kiểm tra model của bạn có hỗ trợ không, README ghi tính năng này cho GPT-6 trở lên ở chế độ single-agent.`;

          select('Cách đổi', [['claude', 'Claude: đổi output_config.format'], ['openai', 'OpenAI: configuration_update']], S.mode, (v) => { S.mode = v; draw(); }).node]),
          svg, out, note,
          el('div', { class: 'legend', html: '<span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>đọc từ cache</span><span><i style="background:var(--warn)"></i>xử lý mới</span><span><i style="background:var(--bad)"></i>xử lý lại do đổi schema</span>' }),
          el('div', { class: 'cap', text: 'Số giả định: system prompt, tools và đoạn giải thích format 3.300 token; mỗi lượt thêm 400 token; mọi lượt nằm trong thời gian sống của cache. Lab không tính tiền vì giá cache khác nhau theo provider.' }));
        draw();

      take: 'Schema là một phần của tiền tố prompt. Đổi schema giữa phiên là đổi đầu prompt.'
    },
    {
      q: 'Vì sao "đúng schema" không đủ? Và so "Tai nghe Sony" với "tai nghe sony" thì tính đúng hay sai?',
      a: `<p>Strict mode chỉ bảo đảm <b>hình dạng</b>: đủ field, đúng kiểu, enum nằm trong tập cho phép. <code>"order_id": "DH-123456"</code> là một chuỗi hợp lệ, dù khách không hề nhắc mã đơn đó. README gọi đây là "đúng schema chưa phải là đúng" (§1.6). Benchmark gần đây như LLMStructBench cũng báo lỗi ngữ nghĩa vẫn còn khi cấu trúc đã đúng.</p>
<p>Còn chuyện so chuỗi: exact match nguyên văn quá khắt khe. Hai chuỗi trông giống hệt nhau trên màn hình vẫn có thể khác nhau ở mức byte. Tiếng Việt có hai cách lưu chữ có dấu: <b>NFC</b> ghép "ạ" thành một ký tự, <b>NFD</b> lưu "a" cộng một dấu nặng riêng. Hai dạng hiển thị giống nhau nhưng <code>===</code> trả false.</p>
<p>Chọn một cặp chuỗi. Trình duyệt so theo ba cách và đếm số code point thật của từng chuỗi.</p>`,
      viz(box) {
        const pairs = [
          ['Sạc dự phòng Anker', 'Sạc dự phòng Anker'.normalize('NFD'), 'NFC và NFD'],
          ['Tai nghe Sony WH-1000XM6', 'tai nghe  sony wh-1000xm6', 'hoa thường, khoảng trắng'],
          ['Chuột Logitech MX Master 4', 'Chuot Logitech MX Master 4', 'mất dấu'],
          ['Cáp USB-C', 'Cáp USB-A', 'khác một ký tự quan trọng'],
          ['DH-204518', 'DH-204581', 'mã đơn đảo hai số']
        ];
        const norm = (s) => s.normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim();
        const strip = (s) => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
        const out = el('div');
        function draw(i) {
          const [a, b] = pairs[i], r = [['Nguyên văn (===)', a === b], ['Chuẩn hoá: NFC, chữ thường, gộp khoảng trắng', norm(a) === norm(b)], ['Chuẩn hoá và bỏ dấu', strip(a) === strip(b)]];
          const looks = a !== b && norm(a) === norm(b) && a.normalize('NFC') === b.normalize('NFC');
          out.innerHTML = `<div class="tbl"><table><tr><th>Chuỗi</th><th>Hiển thị</th><th>Số code point</th></tr><tr><td>Nhãn</td><td>${a}</td><td class="mono">${[...a].length}</td></tr><tr><td>Model</td><td>${b}</td><td class="mono">${[...b].length}</td></tr></table></div>` +
            '<div class="tbl"><table><tr><th>Cách so</th><th>Kết quả</th></tr>' + r.map(([n, v]) => `<tr><td>${n}</td><td><b class="${v ? 'ok' : 'bad'}">${v ? 'khớp' : 'không khớp'}</b></td></tr>`).join('') + '</table></div>' +
            (looks ? '<p class="bad" style="margin:6px 0">Bất thường: hai chuỗi hiển thị giống hệt nhau nhưng so nguyên văn báo sai. Số code point khác nhau vì một bên lưu dấu thành ký tự riêng (NFD). Điều này không có nghĩa model sai. Trong hệ thống thật: luôn normalize("NFC") cả nhãn lẫn output trước khi so và trước khi lưu database.</p>' : '') +
            (i === 2 ? '<p class="hint">Bỏ dấu làm "Chuot" khớp "Chuột". Với tên sản phẩm có thể chấp nhận, nhưng với tiếng Việt, bỏ dấu cũng làm "bảo hành" và "báo hành" trở thành giống nhau. Chọn cách chuẩn hoá theo từng field.</p>' : '') +
            (i >= 3 ? '<p class="hint">Không cách chuẩn hoá nào cứu được lỗi này, và cũng không nên cứu: đây là lỗi giá trị thật. Một mã đơn đảo hai số là mã của khách khác.</p>' : '');
        }
        box.append(el('div', { class: 'row' }, [select('Cặp chuỗi', pairs.map((p, i) => [i, p[2]]), 0, (v) => draw(+v)).node]), out);
        draw(0);
      },
      take: 'Exact match chỉ có nghĩa sau khi chuẩn hoá, và mức chuẩn hoá là quyết định riêng cho từng field: mã đơn so chặt, tên sản phẩm so lỏng hơn.'
    },
    {
      q: 'Field order_id có thể null. Model nên đoán hay nên trả null khi không chắc?',
      a: `<p>Đây là đánh đổi giữa hai loại lỗi mà README yêu cầu theo dõi <b>riêng</b>:</p>
<ul><li><b>Bịa</b>: tin nhắn không có mã đơn, model vẫn điền một mã. Backend gắn ticket vào đơn của người khác.</li>
<li><b>Bỏ sót</b>: tin nhắn có mã, model trả null. Nhân viên phải hỏi lại khách.</li></ul>
<p>Gộp hai lỗi vào một con số accuracy thì không biết nên sửa prompt trích xuất (đang sót) hay sửa cách biểu diễn dữ liệu thiếu (đang bịa). Một cách điều khiển đánh đổi là thêm field <code>confidence</code> với các mức high / medium / low có định nghĩa rõ, rồi để code quyết định khi nào coi giá trị là null. README khuyên dùng mức có tên thay vì số như 0.73, vì số dễ bị hiểu nhầm là xác suất đã hiệu chỉnh.</p>
<p>Bên dưới là 12 dự đoán order_id giả định, mỗi dự đoán có confidence. Đổi ngưỡng để xem bịa và bỏ sót đổi chỗ cho nhau.</p>`,
      viz(box) {
        const L = { low: 0, medium: 1, high: 2 };
        const P = [['có', 'đúng', 'high'], ['có', 'đúng', 'high'], ['có', 'đúng', 'high'], ['có', 'đúng', 'medium'], ['có', 'đúng', 'medium'], ['có', 'đúng', 'low'], ['có', 'sai', 'low'],
          ['không', 'bịa', 'medium'], ['không', 'bịa', 'low'], ['không', 'bịa', 'low'], ['không', 'null', 'high'], ['không', 'null', 'high']];

        function draw(th) {

      take: 'Đo bịa và bỏ sót thành hai số riêng. Bộ eval phải lấy từ production, và chính nhãn cũng phải được kiểm tra lại: Cleanlab báo mọi benchmark structured output công khai họ xem xét đều có ground truth sai.'
    },
    {
      q: 'Lên production rồi thì không có nhãn. Làm sao biết chất lượng đang tụt?',
      a: `<p>Dùng log. README đề xuất mỗi request ghi một bản ghi như sau:</p>
<pre class="mono" style="white-space:pre-wrap;font-size:12px">{"schema_name": "complaint_extraction", "schema_version": "2026-11-01", "schema_hash": "sha256:9f2c…",

<p>Không có nhãn, nhưng có <b>phân phối</b>. Tỉ lệ null của từng field và tỉ lệ enum <code>other</code> thường đổi trước khi có ai báo lỗi, ví dụ khi một nhà cung cấp đổi template email. Bên dưới là 14 ngày log giả lập, 120 request mỗi ngày. Từ ngày 10, ShopViet đổi form liên hệ và mã đơn nằm ở một chỗ khác trong tin nhắn.</p>`,
      viz(box) {

        });
        const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 24}`, role: 'img', 'aria-label': 'Tỉ lệ theo ngày' });

      const vs = [];
      const box = (color, html) => el('div', { style: `border:1px solid var(--${color});border-left-width:4px;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13.5px`, html });
      if (schema === N && exact / N < 0.8) vs.push(box('bad', `<b>Schema-valid 100%, nhưng chỉ ${exact}/${N} bản ghi đúng (${pct(exact)}%).</b> Chuyện gì xảy ra: mọi lỗi ở đây là lỗi giá trị, nằm bên trong một JSON đúng hình dạng. Vì sao strict mode không chặn: constrained decoding chỉ che những token làm hỏng cấu trúc; "DH-123456" và "other" đều là token hợp lệ. Điều này <b>không</b> có nghĩa strict mode vô dụng: nó đã loại hết lỗi parse và lỗi kiểu. <br>Trong hệ thống thật: đừng đặt schema-valid rate làm chỉ số chất lượng. Theo dõi field-level accuracy trên bộ có nhãn, và chạy business rule cùng grounding check trong code: ở đây chúng bắt được ${schema - ground}/${N - exact} bản ghi sai trước khi vào database. Phần còn lại vẫn qua mọi quy tắc (ví dụ sai nhãn intent, bỏ sót mã đơn), chỉ eval có nhãn mới thấy.`));
      if (schema < N) vs.push(box('warn', `<b>${N - schema} bản ghi hỏng cấu trúc.</b> Đây là những lỗi chỉ có khi không dùng strict mode (JSON mode hoặc prompt-only): JSON bị cắt, sai kiểu, thừa field. Strict mode sẽ chặn các lỗi này, nhưng output bị cắt vì max_tokens vẫn có thể xảy ra: kiểm tra stop_reason trước khi parse.`));
      if (looks) vs.push(box('warn', `<b>${looks} giá trị trông giống hệt nhãn nhưng so nguyên văn báo sai.</b> Chuỗi lưu dạng NFD hoặc khác hoa thường. Đây là lỗi của cách đo, không phải của model. Đổi <b>So chuỗi</b> sang "chuẩn hoá" để thấy chỉ số tăng mà output không đổi.`));
      if (S.mode === 'nodiac' && S.pick[3] === 3) vs.push(box('warn', '<b>Bỏ dấu làm "Sac du phong" tính là đúng.</b> Lỏng quá có thể che lỗi thật: trong tiếng Việt, bỏ dấu biến nhiều từ khác nghĩa thành giống nhau. Chọn mức chuẩn hoá theo từng field.'));
      if (fl - exact / N >= 0.25) vs.push(box('accent', `<b>Field-level ${Math.round(fl * 100)}% nhưng exact match chỉ ${pct(exact)}%.</b> Phần lớn bản ghi sai đúng một field. Exact match cho biết bao nhiêu ticket cần người sửa; field-level và thanh theo field cho biết sửa ở đâu.`));
      if (unit) vs.push(box('accent', `<b>${unit} lỗi đơn vị</b> được tách riêng khỏi lỗi giá trị: model trả giá theo nghìn đồng (ví dụ 32990 thay vì 32990000). Cách sửa là đặt đơn vị vào tên field (price_vnd) và description, cộng business rule giá tối thiểu.`));
      if (exact === N) vs.push(box('ok', `<b>Mọi chỉ số 100%.</b> Với 8 tin nhắn, mỗi bản ghi bằng 12,5 điểm phần trăm. Bộ eval thật cần lấy từ production, có cả tin nhắn xấu, và lưu các case từng gây lỗi làm regression test.`));
      verdicts.replaceChildren(...vs);
    }
    const presetBtns = PRESETS.map(([name, arr]) => el('button', { text: name, onclick: () => { S.pick = arr.slice(); sels.forEach((s, i) => { s.value = String(S.pick[i]); }); render(); } }));
    const modeSel = select('So chuỗi product', [['raw', 'nguyên văn'], ['norm', 'chuẩn hoá (NFC, chữ thường, khoảng trắng)'], ['nodiac', 'chuẩn hoá và bỏ dấu']], S.mode, (v) => { S.mode = v; render(); });
    stage.append(el('div', { class: 'row' }, [...presetBtns, modeSel.node]),
      el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px' }, cards),
      el('h4', { text: 'Phễu bốn lớp kiểm tra và độ đúng so với nhãn', style: 'margin:20px 0 6px' }), funnel,
      el('h4', { text: 'Độ đúng theo từng field', style: 'margin:16px 0 6px' }), fields, stat, verdicts,
      el('p', { class: 'hint', text: 'Business rule của lab: order_id phải có trong cơ sở dữ liệu đơn (DH-204518, DH-198877, DH-210034, DH-207712), price_vnd ≥ 10.000, quantity từ 1 đến 20. Grounding: order_id phải xuất hiện trong tin nhắn. Bản ghi hỏng schema tính sai mọi field.' }));
    render();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
