const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

      read: ["Bảng 1: chỉ đặt biến theo spec (<code>OTEL_INSTRUMENTATION_GENAI_CAPTURE_CONTENT</code>) thì thư viện vẫn <code>NO_CONTENT</code>. Spec = NO_CONTENT mà biến thư viện còn sót <code>SPAN_AND_EVENT</code> thì nội dung vào cả span lẫn event, đủ 5 loại PII. <code>true</code> kiểu cũ bị thư viện này coi là NO_CONTENT (dòng cảnh báo là của thư viện).", "Mục 2b: thư viện ghi JSON với <code>\\uXXXX</code> (ví dụ <code>Nguy\\u1ec5n Tr\\u00e3i</code>), nên regex tiếng Việt chạy thẳng trên chuỗi attribute chỉ thấy email, tên, số điện thoại; phải <code>json.loads</code> mới thấy địa chỉ và bệnh. Lớp che ở Collector hay backend gặp đúng chuyện này.", "Mục 3: che số điện thoại và email trong code rồi vẫn còn tên, địa chỉ, bệnh trên span.", "Mục 4: event <code>gen_ai.evaluation.result</code> mang điểm và <code>gen_ai.response.id</code>, không có PII: chất lượng lưu lâu được mà không cần lưu nội dung."]
    },
    mount(stage) {
      const st = { mode: 'NO_CONTENT', env: 'lib', mask: false, upload: false, finish: 'end_turn', judge: true };
      const ctl1 = el('div', { class: 'row' }, [
        select('Chế độ capture bạn muốn', MODES.map((m) => [m, m]), st.mode, (v) => { st.mode = v; draw(); }).node,
        select('Biến môi trường bạn đặt', ENVS, st.env, (v) => { st.env = v; draw(); }).node
      ]);
      const ctl2 = el('div', { class: 'row' });
      const effLine = el('div', { class: 'stat' });
      const body = el('div');
      const cap = el('div', { style: 'margin-top:10px;font-size:13.5px' });
      const foot = el('div', { class: 'stat', style: 'border-top:1px solid var(--line);padding-top:8px;margin-top:12px' });
      const box = (color, html) => `<div style="border-left:3px solid ${color};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${html}</div>`;

      function draw() {
        ctl2.replaceChildren(
          el('button', { class: st.mask ? 'on' : '', text: 'Che PII bằng regex trước khi đặt attribute', onclick: () => { st.mask = !st.mask; draw(); } }),
          el('button', { class: st.upload ? 'on' : '', text: 'Đẩy nội dung ra object storage (*_ref)', onclick: () => { st.upload = !st.upload; draw(); } }),
          el('button', { class: st.judge ? 'on' : '', text: 'Judge online', onclick: () => { st.judge = !st.judge; draw(); } }),
          select('stop_reason của Claude', [['end_turn', 'end_turn'], ['max_tokens', 'max_tokens'], ['refusal', 'refusal']], st.finish, (v) => { st.finish = v; draw(); }).node);
        const B = build(st);
        effLine.innerHTML = `<span>Chế độ thực tế của thư viện: <b class="${B.eff.mode === 'NO_CONTENT' ? 'ok' : 'bad'}">${B.eff.mode}</b></span><span>Usage Claude thô: <b>input ${USAGE.input_tokens} + cache_read ${vn(USAGE.cache_read_input_tokens)} + cache_creation ${USAGE.cache_creation_input_tokens}</b> → <code>gen_ai.usage.input_tokens</code> = <b>${vn(B.n.input)}</b></span>`;
        body.replaceChildren(...B.groups.map(([g, rows]) => attrTable('Span <code>chat claude-sonnet-5-5</code> · ' + g, rows, g.startsWith('Nội dung') ? 'backend trace, thời hạn lưu của trace' : '')),
          ...B.events.map(([g, rows]) => attrTable('Event <code>' + esc(g) + '</code>', rows, g.startsWith('gen_ai.evaluation') ? 'không chứa nội dung, lưu lâu được' : 'backend trace')));

        const inTrace = B.leaks.filter((l) => !l.bucket), inBucket = B.leaks.filter((l) => l.bucket);
        const kinds = [...new Set(inTrace.map((l) => l.p))];
        const parts = [];
        if (B.eff.why) parts.push(box(st.env === 'both' ? 'var(--bad)' : 'var(--warn)', `<b>${st.env === 'both' ? 'Bạn tin đã tắt, thư viện đang ghi nội dung.' : st.env === 'libtrue' ? 'Bạn tin đã bật bằng <code>true</code>, thư viện không ghi gì.' : `Bạn chọn ${st.mode}, thư viện chạy NO_CONTENT.`}</b> ${B.eff.why} Không có nghĩa spec sai hay thư viện sai: hai bên đang lệch tên ở thời điểm README viết. Trong hệ thống thật: đọc README của đúng phiên bản instrumentation, kiểm tra bằng một span thật (README §1.5).`));
        if (inTrace.length) parts.push(box('var(--bad)', `<b>${inTrace.length} chỗ dữ liệu cá nhân nằm trong backend trace: ${kinds.join(', ')}.</b> ${st.mask ? 'Regex đã thay số điện thoại và email, nhưng tên, địa chỉ và thông tin sức khoẻ không có định dạng cố định nên lọt qua.' : 'Tin nhắn của khách và kết quả <code>get_order</code> đều nằm nguyên trong attribute.'} Vì sao: capture nội dung ghi cả system prompt, lịch sử, tool result và output. Không có nghĩa không bao giờ được ghi nội dung: debug và xây eval dataset cần nó. Trong hệ thống thật: nội dung tắt ở production hoặc chỉ trên mẫu nhỏ đã qua bộ phát hiện PII tốt hơn, che trong code trước khi đặt attribute, đẩy ra <code>*_ref</code> (README §3.1).`));
        else if (inBucket.length) parts.push(box('var(--warn)', `Backend trace không còn dữ liệu cá nhân: span và event chỉ giữ URI. ${inBucket.length} chỗ dữ liệu cá nhân nằm trong bucket riêng, nơi đặt được phân quyền, thời hạn lưu ngắn và xoá theo yêu cầu của khách. URI vẫn lộ tên bucket và <code>tenant=shopviet</code> (README §3.1).`));
        else parts.push(box('var(--ok)', 'Không có nội dung nào được ghi: span chỉ có metadata. Đủ để biết request chậm, đắt, bị cắt hay bị từ chối; không đủ để đọc lại câu trả lời. Đây là mặc định của spec.'));
        if (st.finish === 'refusal') parts.push(box('var(--warn)', `<code>finish_reasons = ["refusal"]</code>, có <code>app.llm.keep = true</code>, không có <code>error.type</code>. ${st.judge ? 'Judge không chấm lượt bị từ chối trong lab: không có câu trả lời để chấm, tín hiệu chất lượng ở đây chính là finish reason.' : ''}`));
        if (st.finish === 'max_tokens') parts.push(box('var(--warn)', `Với <code>max_tokens</code> = 40 (ví dụ một lần deploy hạ giới hạn quá tay), câu trả lời dừng ở "tới 12 Nguyễn": <code>finish_reasons = ["max_tokens"]</code> là tín hiệu chất lượng miễn phí, có sẵn trong response, bắt được trước cả judge.${st.judge ? ' Judge cũng chấm fail, và event của nó trỏ về response bằng <code>gen_ai.response.id</code>.' : ''}`));
        cap.innerHTML = parts.join('');
        foot.innerHTML = `<span>Attribute trên span: <b>${B.groups.reduce((s, [, r]) => s + r.length, 0)}</b></span><span>Event: <b>${B.events.length}</b></span><span>Dữ liệu cá nhân trong backend trace: <b class="${inTrace.length ? 'bad' : 'ok'}">${inTrace.length}</b></span><span>Trong bucket riêng: <b>${inBucket.length}</b></span>`;
      }

      stage.append(ctl1, ctl2, effLine, body, cap, foot,
        el('p', { class: 'hint', text: 'Một response Claude cố định do lab dựng (tin nhắn, tool result, usage, id rút gọn, URI bucket là giả định). Tên attribute, giá trị chế độ capture, tên biến môi trường và phiên bản thư viện theo README §1.5 và bảng Field cần có. Regex che PII chạy thật trên nội dung; danh sách loại dữ liệu cá nhân để đếm là của lab, biết trước nội dung mẫu. Bảng hiện nội dung đã giải mã JSON (tiếng Việt đọc được); thư viện thật ghi dạng \\uXXXX, xem câu hỏi về regex ở Collector. Lab không gọi model hay judge thật.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
