const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const vn = (x, d = 0) => Number(x).toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const T0 = (10 * 3600 + 42 * 60 + 7.3) * 1000;
  const USER = 'u_7f3a';
  const USER_REQS = [-137000, 0, 144000];
  const SVC = ['gateway', 'agent', 'retriever', 'llm-client', 'tool-svc'];
  const DOCS = ['giao-hang-noi-thanh@2026-06', 'bao-hanh-laptop@2026-01', 'chinh-sach-hoan-tien@2026-09', 'chinh-sach-hoan-tien@2024-03', 'doi-tra-tai-nghe@2025-11'];
  const MODES = [
    ['none', 'Không có id chung, chỉ gateway ghi user'],

    ['broken', 'Mọi dòng có trace_id, trừ tool-svc (không truyền traceparent)']
  ];
  const clock = (ms) => { const t = Math.max(0, ms); const h = Math.floor(t / 3600000), m = Math.floor(t / 60000) % 60, s = (t / 1000) % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + s.toFixed(3).padStart(6, '0'); };
  const hex = (rnd, n) => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(rnd() * 16)]).join('');

  function makeReq(rnd, start, isUser, idx) {
    const emb = 240, c1 = 900 + rnd() * 700, tool = 120 + rnd() * 140, ttft = 600 + rnd() * 900, gen = 700 + rnd() * 1500;
    const t = { start, r: start + 20, c1s: start + 20 + emb, tls: 0, c2s: 0, end: 0 };
    t.tls = t.c1s + c1; t.c2s = t.tls + tool; t.end = t.c2s + ttft + gen + 25;
    const doc = isUser && idx === 1 ? 'chinh-sach-hoan-tien@2024-03' : DOCS[Math.floor(rnd() * DOCS.length)];
    const order = isUser ? 'SV-4821' : 'SV-' + (4000 + Math.floor(rnd() * 6000));
    const user = isUser ? USER : 'u_' + hex(rnd, 4);
    return { ...t, doc, order, user, trace: hex(rnd, 8), req: 'r-' + hex(rnd, 4), target: isUser && idx === 1, mine: isUser, c1, tool, ttft, gen };
  }

  function linesOf(q) {
    return [
      { t: q.r, s: 2, m: `retrieve top_k=2 docs=[${q.doc}, ...]` },
      { t: q.start + 5, s: 1, m: 'invoke support-bot' },
      { t: q.tls - 5, s: 3, m: `model call ok ${Math.round(q.c1)}ms stop=tool_use` },
      { t: q.tls + q.tool, s: 4, m: `get_order ${q.order} ok ${Math.round(q.tool)}ms` },
      { t: q.end - 25, s: 3, m: `model call ok ${Math.round(q.end - 25 - q.c2s)}ms stop=end_turn` },
      { t: q.end - 10, s: 1, m: 'done steps=4' },
      { t: q.end, s: 0, m: `POST /chat 200 ${Math.round(q.end - q.start)}ms user=${q.user}` }
    ];
  }

  function simulate(rpm, winMin, seed = 11) {
    const rnd = seeded(seed);
    const W = winMin * 60000, n = Math.round(rpm * 2 * winMin);
    const reqs = [];
    for (let i = 0; i < n; i++) reqs.push(makeReq(rnd, T0 - W + rnd() * 2 * W, false, 0));
    USER_REQS.forEach((dt, i) => { if (Math.abs(dt) <= W) reqs.push(makeReq(seeded(100 + i), T0 + dt, true, i)); });
    return { reqs, W, total: reqs.length * 7 };
  }

  function investigate(sim, mode) {
    const mine = sim.reqs.filter((q) => q.mine);
    const overl = (a, b) => b.start < a.end && b.end > a.start;
    let toRead = mine.length;
    let ambiguous = 0, sameDoc = 0, orphanTool = 0;
    mine.forEach((q) => {
      const others = sim.reqs.filter((o) => o !== q && overl(q, o));
      if (mode === 'none' || mode === 'gw') {
        toRead += 6 * (others.length + 1);
        if (q.target) { ambiguous = others.length; sameDoc = others.filter((o) => o.doc === q.doc).length; }
      } else {

  }

  function sample(sim, mode, max = 12) {
    const tgt = sim.reqs.find((q) => q.target);

  function timeline(sim, mode) {
    const tgt = sim.reqs.find((q) => q.target);
    const W = 700, left = 86, right = 10, lane = 22, H = SVC.length * lane + 30;
    const a = tgt.start - 1500, b = tgt.end + 1500;
    const x = (t) => left + ((t - a) / (b - a)) * (W - left - right);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'canvas', role: 'img', 'aria-label': 'Dòng log theo service quanh request bị khiếu nại' });
    SVC.forEach((s, i) => svg.append(el('text', { x: 4, y: 16 + i * lane, 'font-size': 11, fill: 'var(--mute)', text: s }), el('line', { x1: left, x2: W - right, y1: 12 + i * lane, y2: 12 + i * lane, stroke: 'var(--line)' })));
    svg.append(el('rect', { x: x(tgt.start), y: 2, width: x(tgt.end) - x(tgt.start), height: SVC.length * lane, fill: 'var(--accent-soft)', opacity: 0.6 }));
    for (let t = Math.ceil(a / 1000) * 1000; t <= b; t += 1000) svg.append(el('text', { x: x(t), y: H - 6, 'font-size': 10, 'text-anchor': 'middle', fill: 'var(--mute)', text: clock(t).slice(3, 8) }));
    const filtered = mode === 'all' || mode === 'broken';
    sim.reqs.filter((q) => q.end > a && q.start < b).forEach((q) => linesOf(q).forEach((l) => {
      if (l.t < a || l.t > b) return;

  function traceTree(sim, mode) {

      [1, 'invoke_agent support-bot', ms(q.end - q.start - 15), ''],
      [2, 'retrieval policies', ms(q.c1s - q.r), `doc_ids=[${q.doc}, ...]`],
      [2, 'chat claude-sonnet-5-5', ms(q.c1), 'finish_reasons=["tool_use"]'],

  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
