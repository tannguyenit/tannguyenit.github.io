const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

      ask: 'Với mỗi luật, ngưỡng và cửa sổ nào bắt được sự cố mà không gọi dậy vô ích? Luật nào ồn, luật nào mù? Và khi chính pipeline trace hỏng, alert nào còn reo?',
      solves: 'Lab tính metric gộp theo cửa sổ, so với ngưỡng tuyệt đối (lỗi) hoặc baseline theo giờ của tuần trước (TTFT, stream bị cắt, chi phí), gom các lần vượt liên tiếp thành một page, rồi khớp page với sự cố. Ngưỡng mặc định đúng như bảng README §3.7, mà README ghi rõ chỉ để minh hoạ.',
      read: [
        'Đường xanh: metric gộp theo cửa sổ. Đường đỏ đứt: ngưỡng (cố định hoặc baseline × k). Vùng cam: sự cố thật. Vùng tím: Black Friday. Vùng xám: pipeline mất dữ liệu.',
        'Tam giác trên đầu: mỗi page. Xanh là page đúng sự cố, đỏ là page sai. Rê chuột để xem giờ.',
        'Bảng bốn luật: page đúng, page sai, page sai ban đêm (0–6 giờ), sự cố bị lỡ, độ trễ trung bình. "ồn" khi page sai vượt mức đội trực chịu được; "mù" khi lỡ sự cố.',
        'Khung "Phát hiện từ dữ liệu" liệt kê luật ồn, luật mù và chỗ hỏng; khung cuối giải thích chuyện quan trọng nhất.'
      ]
    },
    summary: `<h3>Tóm tắt bài</h3>
<h4>Từ log production về eval dataset (§3.6)</h4>
<ol><li>Chọn trace: feedback tiêu cực, bị cắt, refusal, tool error, retriever không tìm thấy tài liệu, judge online chấm thấp, và một mẫu ngẫu nhiên.</li><li>Người hiểu nghiệp vụ đọc, phân loại lỗi, viết câu trả lời đúng (annotation queue của Langfuse, LangSmith).</li><li>Che, chuyển thành ca eval: input, context, tiêu chí chấm, nguồn (trace id, ngày).</li><li>Thêm vào bộ regression: lỗi đã sửa phải pass mãi.</li></ol>
<p>Trace phải đủ để phát lại: prompt version, tài liệu retriever (hoặc id ở đúng phiên bản index), tham số model.</p>
<h4>Alert (§3.7)</h4>
<div class="tbl"><table><tr><th>Page</th><th>Ví dụ ngưỡng (minh hoạ)</th><th>Hành động</th></tr>
<tr><td>Tỉ lệ lỗi theo provider</td><td>&gt; 5% trong 5 phút</td><td>Chuyển provider dự phòng, xem status page</td></tr>
<tr><td>TTFT p95</td><td>&gt; 3× baseline trong 10 phút</td><td>Kiểm tra provider, prompt có phình không</td></tr>
<tr><td>Stream bị cắt</td><td>&gt; 2× baseline trong 10 phút</td><td>Proxy, deploy, provider quá tải</td></tr>
<tr><td>Chi phí theo giờ</td><td>&gt; 3× cùng giờ tuần trước</td><td>Vòng lặp agent, lạm dụng, cache vỡ</td></tr></table></div>
<p>Ticket (không page): response model mới, tỉ lệ bị cắt hoặc refusal tăng, cache hit giảm sau deploy, tool error hoặc structured output không hợp lệ tăng, p99 inference_calls tăng, canary hoặc judge giảm, stream thiếu usage tăng. Alert cho chính pipeline: số span giảm so với số request HTTP, exporter rớt span, backend từ chối một phần (<code>partial_success</code>), dữ liệu đến trễ. Ngưỡng thật đặt theo baseline vài tuần, theo giờ trong ngày, sao cho page sai mỗi tháng nằm trong mức chịu được.</p>
<h4>Failure modes (§3.8) và checklist (§3.9)</h4>
<p>Mười bảy triệu chứng trong README, từ "có trace nhưng không có nội dung" tới "dashboard xanh nhưng người dùng phàn nàn"; câu hỏi 7 cho tra theo triệu chứng. Checklist bốn nhóm: Instrumentation, Dữ liệu và quyền riêng tư, Chi phí, Chất lượng và drift, Vận hành; câu hỏi 8 cho tick và xem failure mode nào còn hở.</p>
<div class="verdict"><b>Điểm cần nhớ:</b> page chỉ cho thứ ảnh hưởng người dùng ngay và có người xử lý được; ngưỡng là con số của hệ thống bạn, chỉnh sau mỗi page sai và mỗi sự cố bị lỡ. Im lặng của pipeline trace trông giống hệt "mọi thứ ổn".</div>`,
    why: {
      c: 'Bốn luật page cho lỗi, TTFT, stream bị cắt, chi phí, với ngưỡng đặt theo baseline theo giờ, số request tối thiểu trong cửa sổ, và chi phí so cùng giờ tuần trước. Mọi tín hiệu chất lượng đi ticket. Một luật riêng cho chính pipeline: số span so với số request HTTP.',
      s: 'Chép nguyên ngưỡng ví dụ: README ghi rõ chúng không lấy từ nghiên cứu hay chuẩn nào. Ngưỡng cố định cả ngày: ban đêm ít traffic nên nhiễu vượt ngưỡng. Page cho canary giảm lúc 3 giờ sáng: người trực thường không sửa được gì ngay.',
      p: 'Cửa sổ dài hơn và số request tối thiểu làm page đến muộn hơn vài phút. Baseline phải có vài tuần dữ liệu và phải tính lại khi traffic đổi. Ngày bất thường hợp lệ (Black Friday) vẫn có thể làm luật chi phí reo nếu so tổng thay vì so trên mỗi request.'
    },
    deep: [
      {
        q: 'Lấy trace nào từ production để làm eval dataset? Lấy hết trace bị chê là đủ?',
        a: `<p>README §3.6, bước 1: feedback tiêu cực, trace bị cắt, refusal, tool error, câu hỏi mà retriever không tìm thấy tài liệu, trace judge online chấm thấp, <b>và một mẫu ngẫu nhiên</b> để không chỉ có ca khó. Kéo số trace lấy từ mỗi nguồn trong một tuần của ShopViet; tỉ lệ ca có lỗi thật trong từng nguồn là giả định.</p>`,
        viz(box) {
          const SRC = [['Feedback tiêu cực', 40, 0.6], ['Bị cắt / refusal', 20, 0.7], ['Tool error', 15, 0.8], ['Retriever không thấy tài liệu', 15, 0.5], ['Judge online chấm thấp', 30, 0.55], ['Mẫu ngẫu nhiên', 0, 0.08]];
          const st = SRC.map((s) => s[1]);
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const n = st.reduce((a, b) => a + b, 0), fails = SRC.reduce((a, s, i) => a + st[i] * s[2], 0), rnd = st[5];
            out.innerHTML = '<div class="stat"><span>Ca trong dataset <b>' + int(n) + '</b></span><span>Ca có lỗi thật <b>' + pct(n ? fails / n : 0, 0) + '</b></span><span>Từ mẫu ngẫu nhiên <b class="' + (rnd ? 'ok' : 'bad') + '">' + pct(n ? rnd / n : 0, 0) + '</b></span><span>Pass rate "ước" từ dataset <b>' + pct(n ? 1 - fails / n : 0, 0) + '</b> so với thật <b>' + pct(1 - SRC[5][2], 0) + '</b></span></div>';
            cap.innerHTML = !rnd ? '<span class="bad">Không có mẫu ngẫu nhiên: dataset toàn ca khó.</span> Pass rate tính trên dataset này nói về các ca khó, không nói về traffic thật; và một thay đổi làm hỏng câu hỏi thường ngày sẽ không bị bắt vì không có ca thường ngày. Không có nghĩa nên bỏ ca khó: chúng là nơi tìm lỗi. Trong hệ thống thật: hai luồng, có ghi nguồn cho mỗi ca.' : 'Có ' + int(rnd) + ' ca ngẫu nhiên. Báo cáo pass rate theo nguồn, không gộp: nhóm ngẫu nhiên cho con số chung, các nhóm có chủ đích cho danh sách lỗi.';
          }
          box.append(el('div', { class: 'row' }, SRC.map((s, i) => slider(s[0], 0, 100, 5, st[i], (v) => { st[i] = v; draw(); }).node)), out, cap);
          draw();
        },
        take: 'Ca có chủ đích để tìm lỗi, ca ngẫu nhiên để dataset còn giống traffic thật.'
      },
      {
        q: 'Đã chọn được trace sai. Sao vẫn có lúc không biến nó thành ca eval được?',
        a: `<p>Vì trace thiếu thứ để phát lại. README §3.6: trace phải chứa đủ để phát lại: prompt version, tài liệu retriever trả về (hoặc id ở đúng phiên bản index), tham số model. Thiếu một thứ, ca eval không tái hiện được lỗi. Bật tắt những gì trace SV-4821 đang ghi (lỗi "hoàn tiền 3 ngày" ở Lab 5).</p>`,
        viz(box) {
          const F = [['pv', 'gen_ai.prompt.version'], ['doc', 'Id tài liệu + phiên bản index'], ['par', 'Tham số model (max_tokens, temperature)'], ['rm', 'gen_ai.response.model'], ['tool', 'Tool result (đã che)'], ['inp', 'Input của khách (đã che)']];
          const on = new Set(['pv', 'rm', 'inp']);
          const NEED = [['Tái hiện câu trả lời "3 ngày"', ['inp', 'doc', 'pv']], ['Biết lỗi ở retriever hay model', ['doc']], ['Chạy lại với đúng model', ['rm', 'par']], ['Tái hiện bước tra đơn', ['tool', 'inp']]];
          const row = el('div', { class: 'row' }), out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            row.replaceChildren(...F.map(([k, t]) => el('button', { class: on.has(k) ? 'on' : '', text: t, onclick: () => { on.has(k) ? on.delete(k) : on.add(k); draw(); } })));
            const res = NEED.map(([t, req]) => [t, req.filter((k) => !on.has(k))]);
            out.innerHTML = '<div class="tbl"><table><tr><th>Mục tiêu</th><th>Thiếu</th></tr>' + res.map(([t, miss]) => '<tr><td>' + t + '</td><td class="' + (miss.length ? 'bad' : 'ok') + '">' + (miss.length ? miss.map((k) => F.find((f) => f[0] === k)[1]).join(', ') : 'đủ') + '</td></tr>').join('') + '</table></div>';
            const bad = res.filter(([, m]) => m.length).length;
            cap.innerHTML = bad ? '<span class="bad">' + bad + '/4 mục tiêu không làm được.</span> ' + (on.has('doc') ? '' : 'Thiếu phiên bản index: chạy lại hôm nay retriever lấy bản chính sách mới (14 ngày), ca eval pass, và lỗi "biến mất" dù chưa được sửa. ') + 'Trong hệ thống thật: kiểm tra một trace thật xem đủ để dựng ca eval chưa, trước khi cần nó.' : '<span class="ok">Trace đủ để phát lại.</span> Ghi nguồn (trace id, ngày) vào ca eval để truy lại.';
          }
          box.append(row, out, cap);
          draw();
        },
        take: 'Trace tốt là trace phát lại được. Thiếu phiên bản index thì lỗi của hôm qua không tái hiện được hôm nay.'
      },
      {
        q: 'README ghi "> 5% trong 5 phút". Sao ngưỡng đó lại gọi người trực dậy lúc 3 giờ sáng?',
        a: `<p>Vì cùng một tỉ lệ lỗi nền cho ra dao động rất khác nhau tuỳ số request. README §3.7: các con số trong bảng chỉ để minh hoạ dạng của một luật alert; ngưỡng thật đặt theo baseline, xem phân phối theo giờ trong ngày, chọn sao cho số lần page sai mỗi tháng nằm trong mức đội trực chịu được.</p>
<p>Lab tính chính xác xác suất "số lỗi / số request &gt; ngưỡng" trong một cửa sổ khi hệ thống hoàn toàn bình thường (lỗi nền 0,5%; mỗi request độc lập có 0,5% khả năng lỗi, giống tung 30 đồng xu rất lệch: phần lớn lần ra 0 lỗi, thỉnh thoảng ra 2), cho từng giờ theo traffic của ShopViet, rồi nhân ra số page sai kỳ vọng mỗi tuần.</p>`,
        viz(box) {
          const st = { thr: 0.05, win: 5, base: 0.005 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const tail = (n, p, k) => { let pr = Math.pow(1 - p, n), cdf = 0; for (let i = 0; i <= k && i <= n; i++) { cdf += pr; pr *= (n - i) / (i + 1) * p / (1 - p); } return Math.max(0, 1 - cdf); };
          function draw() {
            const rows = [], wb = st.win / 5;
            let week = 0;
            for (let h = 0; h < 24; h++) { const n = Math.round((25 + 375 * diurnal(h)) * wb), k = Math.floor(st.thr * n), p = tail(n, st.base, k), perH = p * 12 / wb; week += perH * 7; rows.push([String(h).padStart(2, '0') + 'h (' + n + ' req)', perH * 7, h < 6]); }
            out.replaceChildren(hbars(rows.filter((_, i) => i % 2 === 0 || i < 6), { fmt: (v) => dec(v, 2) + ' page sai/tuần' }), el('div', { class: 'stat', html: '<span>Page sai kỳ vọng mỗi tuần (chỉ do nhiễu) <b class="' + (week > 1 ? 'bad' : 'ok') + '">' + dec(week, 1) + '</b></span>' }));
            const night = rows.slice(0, 6).reduce((a, r) => a + r[1], 0);
            cap.innerHTML = night > 0.5 ? '<span class="bad">' + dec(night, 1) + ' page sai mỗi tuần rơi vào 0–6 giờ</span>, giờ ít traffic nhất: 2 lỗi trên 30 request đã là 6,7%. Không có nghĩa lỗi ban đêm không quan trọng; là con số 5% trên mẫu nhỏ không đủ phân biệt sự cố với nhiễu. Trong hệ thống thật: thêm điều kiện số request tối thiểu, hoặc cửa sổ dài hơn ban đêm, hoặc ngưỡng theo giờ từ baseline.' : 'Với cấu hình này nhiễu ban đêm hiếm khi vượt ngưỡng. Kéo cửa sổ về 5 phút để thấy điều ngược lại.';
          }
          box.append(el('div', { class: 'row' }, [
            slider('Ngưỡng lỗi', 0.01, 0.2, 0.005, st.thr, (v) => { st.thr = v; draw(); }, (v) => pct(v, 1)).node,
            slider('Cửa sổ (phút)', 5, 60, 5, st.win, (v) => { st.win = v; draw(); }).node,
            slider('Lỗi nền (giả định)', 0.001, 0.02, 0.001, st.base, (v) => { st.base = v; draw(); }, (v) => pct(v, 1)).node]), out, cap);
          draw();
        },
        take: 'Một tỉ lệ trên mẫu nhỏ là một con số rất ồn. Ngưỡng phải biết lúc đó có bao nhiêu request.'
      },
      {
        q: 'Cửa sổ dài thì đỡ ồn. Sao không đặt 60 phút cho chắc?',
        a: `<p>Vì cửa sổ dài làm page đến muộn, và sự cố ngắn bị pha loãng tới mức không vượt ngưỡng. Lab quét cửa sổ của luật lỗi trên đúng dữ liệu tuần của hình chính (ngưỡng 5%, chưa có số request tối thiểu): mỗi dòng là một cấu hình, cột cuối là độ trễ từ lúc sự cố bắt đầu tới page đầu tiên.</p>`,
        viz(box) {
          const st = { thr: 0.05, minReq: 0 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const rows = [5, 10, 15, 30, 45, 60].map((w) => { const r = series('err', { thr: st.thr, win: w, minReq: st.minReq }, false), s = summarize(r, 1); return [w, s]; });
            out.innerHTML = '<div class="tbl"><table><tr><th>Cửa sổ</th><th>Page đúng</th><th>Page sai</th><th>Sai ban đêm</th><th>Sự cố bị lỡ (trên 2)</th><th>Trễ trung bình</th></tr>' + rows.map(([w, s]) => '<tr><td class="mono">' + w + ' phút</td><td class="mono">' + s.tp + '</td><td class="mono ' + (s.fp > 1 ? 'bad' : '') + '">' + s.fp + '</td><td class="mono">' + s.nightFp + '</td><td class="mono ' + (s.missed ? 'bad' : 'ok') + '">' + s.missed + '</td><td class="mono">' + (s.delay === null ? '—' : int(s.delay) + ' phút') + '</td></tr>').join('') + '</table></div>';
            const best = rows.filter(([, s]) => !s.missed && s.fp <= 1);
            cap.innerHTML = best.length ? 'Cửa sổ ' + best.map(([w]) => w).join(', ') + ' phút bắt đủ hai sự cố lỗi với tối đa 1 page sai. Cửa sổ ngắn hơn ồn, dài hơn chậm. Không có nghĩa con số này đúng cho hệ thống khác: nó phụ thuộc traffic và độ dài sự cố của tuần này.' : '<span class="bad">Không cửa sổ nào vừa bắt đủ sự cố vừa ít page sai.</span> Một tham số không đủ: thêm số request tối thiểu (kéo slider), hoặc dùng hai luật (cửa sổ ngắn ngưỡng cao cho sự cố lớn, cửa sổ dài ngưỡng thấp cho sự cố âm ỉ).';
          }
          box.append(el('div', { class: 'row' }, [
            slider('Ngưỡng lỗi', 0.02, 0.15, 0.005, st.thr, (v) => { st.thr = v; draw(); }, (v) => pct(v, 1)).node,
            slider('Request tối thiểu trong cửa sổ', 0, 400, 10, st.minReq, (v) => { st.minReq = v; draw(); }).node]), out, cap);
          draw();
        },
        take: 'Cửa sổ đổi tiếng ồn lấy độ trễ. Chọn bằng dữ liệu của tuần thật, không bằng cảm giác.'
      },
      {
        q: 'Canary tụt lúc 3 giờ sáng. Có nên gọi người trực dậy?',
        a: `<p>Thường là không. README §3.7: alert về chất lượng (canary, judge) hiếm khi đáng page lúc 3 giờ sáng: người trực thường không sửa được gì ngay. Ngoại lệ là khi có hành động khẩn cấp rõ ràng, ví dụ rollback prompt vừa deploy, hoặc pin lại snapshot model cũ.</p>
<p>Câu hỏi để quyết định một tín hiệu là page hay ticket: "người trực làm gì được trong 15 phút tới?". Lỗi provider: chuyển provider dự phòng. TTFT tăng vọt: kiểm tra provider, prompt phình. Chi phí gấp ba: tìm vòng lặp agent, tắt tính năng. Canary giảm 4 điểm: không có nút nào để bấm, trừ khi vừa có deploy. Vì thế danh sách ticket của README dài hơn danh sách page: response model mới, tỉ lệ bị cắt hoặc refusal tăng, cache hit giảm sau deploy, tool error tăng, p99 lượt gọi agent tăng, canary hay judge giảm, stream thiếu usage tăng.</p>`,

    poc: {

      file: "docs/llm-observability/pocs/07_eval_alerts_failures.py",

      needs: "chỉ <code>uv</code>, CPU và thư viện nhẹ (<code>numpy</code>), chạy dưới 3 giây, miễn phí.",
      output: "Hai tuần metric 5 phút một điểm TỔNG HỢP (numpy seed 7001 baseline, 7002 tuần có sự cố), cùng giả định với lab 07:\n25 → 400 request mỗi 5 phút theo giờ, lỗi nền 0,5%, cắt nền 1%, 0,012 USD/request, 5 sự cố cài sẵn, Black Friday ×2,5.\nPhần chạy thật: luật alert, gộp page (cách nhau ≤ 30 phút là một page), khớp page với sự cố.\n\n== 1. Bảng alert ví dụ của README §3.7, chép nguyên ngưỡng ==\nLuật                                        Page đúng  Page sai  Sai 0–6h  Sai lúc Black Friday  Sự cố bị lỡ  Trễ TB\n------------------------------------------  ---------  --------  --------  --------------------  -----------  -------\nLỗi > 5% / 5 phút                           2          7         1         0                     -            0 phút\nTTFT > 3× baseline / 10 phút                1          0         0         0                     -            5 phút\nCắt stream > 2× baseline / 10 phút          1          65        29        0                     -            0 phút\nChi phí > 3× cùng giờ tuần trước / 60 phút  1          0         0         0                     -            35 phút\nVí dụ page sai của luật lỗi: T3 07:45, T4 04:30, T6 14:30, T6 18:20\n\n== 2. Giữ ngưỡng README, thêm điều kiện số request tối thiểu / đổi mẫu số chi phí ==\nLuật                                             Page đúng  Page sai  Sai 0–6h  Sai lúc Black Friday  Sự cố bị lỡ  Trễ TB\n-----------------------------------------------  ---------  --------  --------  --------------------  -----------  -------\nLỗi > 5% / 5 phút, ≥150 request                  2          4         0         0                     -            0 phút\nCắt stream > 2× baseline / 10 phút, ≥150 stream  1          25        0         0                     -            0 phút\nChi phí MỖI REQUEST > 3× / 60 phút               1          0         0         0                     -            35 phút\n\n== 3. Exporter rớt span T4 09:00–15:00: luật nào còn reo? ==\nLuật                                            Page đúng  Page sai  Sai 0–6h  Sai lúc Black Friday  Sự cố bị lỡ           Trễ TB\n----------------------------------------------  ---------  --------  --------  --------------------  --------------------  ------\nLỗi > 5% / 5 phút, ≥150 request, pipeline hỏng  1          4         0         0                     5xx (T4 11:00–11:30)  0 phút\nLuật pipeline 'span nhận / request ở load balancer < 50% trong 10 phút' reo lúc T4 09:00.\n\nRút ra: ngưỡng README chép nguyên cho luật lỗi 7 page sai/tuần (1 lúc 0–6 giờ), phần lớn\nlà đột biến 5 phút; luật cắt stream 65 page sai vì cắt là sự kiện hiếm (vài stream đã vượt 2× nền).\nLuật chi phí tổng bắt được agent chạy vòng, không reo vì Black Friday (×2,5 < ×3). Thêm '≥150 request' hạ page sai còn 4 và 25, không lỡ\nsự cố. Khi exporter rớt span, sự cố 5xx thứ Tư không có page nào: chỉ luật theo dõi chính pipeline (span / request) reo.",

    mount(stage) {
      const cfg = { err: { thr: 0.05, win: 5, minReq: 0 }, ttft: { thr: 3, win: 10, minReq: 0 }, trunc: { thr: 2, win: 10, minReq: 0 }, cost: { thr: 3, win: 60, minReq: 0 } };
      const st = { key: 'err', drop: false, tol: 1 };
      const ctl = el('div'), chartBox = el('div'), pageBox = el('div'), tblBox = el('div'), flags = el('div'), cap = el('div', { class: 'cap' });
      function controls() {
        const R = RULES[st.key], c = cfg[st.key];
        const later = debounce(render, 80);
        const thrFmt = R.absolute ? (v) => pct(v, 1) : (v) => dec(v, 1) + '× baseline';
        ctl.replaceChildren(el('div', { class: 'row' }, [
          slider('Ngưỡng', R.thr[0], R.thr[1], R.thr[2], c.thr, (v) => { c.thr = v; later(); }, thrFmt).node,
          slider('Cửa sổ (phút)', 5, st.key === 'cost' ? 180 : 60, 5, c.win, (v) => { c.win = v; later(); }).node,
          st.key === 'cost' ? slider('Agent chạy vòng CN 02:00 làm chi phí gấp', 1.5, 5, 0.5, INC[4].v, (v) => { INC[4].v = v; DATA = null; later(); }, (v) => dec(v, 1) + '×').node : null,
          st.key === 'err' || st.key === 'trunc' ? slider(st.key === 'trunc' ? 'Stream tối thiểu trong cửa sổ' : 'Request tối thiểu trong cửa sổ', 0, 400, 10, c.minReq, (v) => { c.minReq = v; later(); }).node : null]));
      }
      function render() {
        const res = {};
        Object.keys(RULES).forEach((k) => { res[k] = series(k, cfg[k], st.drop); res[k].sum = summarize(res[k], st.tol); });
        const r = res[st.key];
        chartBox.replaceChildren(chart(st.key, r, cfg[st.key], st.drop));
        const pages = r.pages.slice(0, 12);
        pageBox.innerHTML = '<div class="hint" style="margin:4px 0">Page của luật đang chọn (' + r.pages.length + '): ' + (pages.length ? pages.map((p) => '<span class="mono" style="color:var(--' + (p.inc ? 'ok' : 'bad') + ')">' + clock(p.s) + '</span>').join(' · ') + (r.pages.length > 12 ? ' …' : '') : 'không có') + '</div>';
        tblBox.innerHTML = '<div class="tbl"><table><tr><th>Luật</th><th>Cấu hình</th><th>Page đúng</th><th>Page sai</th><th>Sai 0–6 giờ</th><th>Sự cố bị lỡ</th><th>Trễ TB</th><th>Đánh giá</th></tr>' + Object.keys(RULES).map((k) => { const s = res[k].sum, c = cfg[k], tot = INC.filter((x) => x.type === k).length; return '<tr' + (k === st.key ? ' style="background:var(--accent-soft)"' : '') + '><td>' + RULES[k].name + '</td><td class="mono" style="font-size:12px">' + (RULES[k].absolute ? '&gt; ' + pct(c.thr, 1) : '&gt; ' + dec(c.thr, 1) + '×') + ' / ' + c.win + 'p' + (c.minReq ? ' / ≥' + c.minReq + ' req' : '') + '</td><td class="mono">' + s.tp + '</td><td class="mono ' + (s.fp > st.tol ? 'bad' : '') + '">' + s.fp + '</td><td class="mono ' + (s.nightFp ? 'bad' : '') + '">' + s.nightFp + '</td><td class="mono ' + (s.missed ? 'bad' : 'ok') + '">' + s.missed + '/' + tot + '</td><td class="mono">' + (s.delay === null ? '—' : int(s.delay) + ' phút') + '</td><td class="' + (s.verdict === 'ổn' ? 'ok' : 'bad') + '"><b>' + s.verdict + '</b></td></tr>'; }).join('') + '</table></div>';

        const fl = [];
        Object.keys(RULES).forEach((k) => {
          const s = res[k].sum;
          if (s.fp > st.tol) fl.push(['bad', RULES[k].name + ' ồn: ' + s.fp + ' page sai trong tuần' + (s.nightFp ? ', ' + s.nightFp + ' trong số đó lúc 0–6 giờ' : '') + '.']);
          res[k].found.filter((f) => !f.p).forEach((f) => fl.push(['bad', RULES[k].name + ' lỡ sự cố: ' + f.x.what + '.']));
        });
        const bfPage = res.cost.pages.find((p) => p.bf);
        if (bfPage) fl.push(['warn', 'Luật chi phí reo lúc ' + clock(bfPage.s) + ' vì Black Friday: traffic gấp 2,5 nên chi phí gấp 2,5. Đây là chi phí hợp lệ; so chi phí trên mỗi request sẽ không reo.']);
        if (st.drop) {
          const lost = res.err.found.find((f) => f.x.s === INC[1].s && !f.p);
          fl.push(['bad', 'Exporter rớt span T4 09:00–15:00: mọi metric tính từ span không có dữ liệu' + (lost ? ', sự cố 5xx lúc 11:00 không được alert' : '') + '. Luật "span nhận được / request HTTP < 50% trong 10 phút" (tính từ load balancer) sẽ reo lúc ' + clock(DROP[0] + 2) + '.']);
        }
        flags.replaceChildren(...(fl.length ? fl.map(([l, t]) => flagBox(l, t)) : [noFlag()]));
        const s = r.sum, R = RULES[st.key];
        let c;
        if (st.drop && res.err.found.some((f) => f.x.s === INC[1].s && !f.p)) c = { what: 'Sự cố 5xx thứ Tư 11:00 không có alert nào.', why: 'Luật lỗi đọc từ span; trong 6 tiếng exporter rớt span, tỉ lệ lỗi không có dữ liệu nên không vượt ngưỡng.', not: 'Không có nghĩa luật lỗi sai: với dữ liệu đủ, nó bắt được sự cố này.', real: 'Alert cho chính pipeline observability (README §3.7): số span so với số request HTTP, exporter rớt span, partial_success.' };
        else if (st.key === 'err' && s.nightFp > 0) c = { what: s.nightFp + ' page sai lúc 0–6 giờ, khi chỉ có vài chục request mỗi 5 phút.', why: 'Với 25–40 request, 2 lỗi đã là 5–8%. Ngưỡng 5% trong 5 phút là con số minh hoạ của README, không tính tới traffic ban đêm.', not: 'Không có nghĩa lỗi ban đêm bị bỏ qua: sự cố thật ban đêm vẫn có hàng chục lỗi liên tiếp.', real: 'Thêm số request tối thiểu (kéo lên khoảng 100–150 để thấy: trên tuần này page sai còn 2, không lỡ sự cố), hoặc cửa sổ dài hơn ban đêm; chỉnh lại sau mỗi page sai (README §3.7).' };
        else if (st.key === 'cost' && res.cost.found.some((f) => !f.p)) c = { what: 'Agent chạy vòng 3 tiếng rạng sáng Chủ nhật mà luật chi phí không reo: đúng chuyện "không ai được báo" ở đầu bài.', why: 'Luật so chi phí ' + cfg.cost.win + ' phút gần nhất với cùng giờ tuần trước. Vòng lặp chỉ làm chi phí gấp ' + dec(INC[4].v, 1) + ', chưa tới ngưỡng ' + dec(cfg.cost.thr, 1) + '×. Ngưỡng 3× đủ cao để Black Friday (traffic gấp 2,5, chi phí hợp lệ) không reo, và chính khoảng hở đó để vòng lặp nhẹ lọt qua.', not: 'Không có nghĩa chỉ cần hạ ngưỡng: kéo xuống 2× thì bắt được vòng lặp nhưng Black Friday cũng reo. Cũng không có nghĩa chi phí đó nhỏ: 3 tiếng mỗi đêm là cả một khoản mỗi tháng.', real: 'So chi phí trên mỗi request thay vì tổng (Black Friday không đổi chi phí mỗi request, vòng lặp thì có; POC bảng 2), và kèm alert p99 inference_calls, tỉ lệ run chạm giới hạn (Lab 5): bắt vòng lặp trực tiếp, không cần chờ tiền.' };

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),

      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
