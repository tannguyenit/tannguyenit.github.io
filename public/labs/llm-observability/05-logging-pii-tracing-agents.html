const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

      {
        q: 'Datadog có quét và che dữ liệu nhạy cảm. Sao vẫn phải che trong code?',
        a: `<p>Vì "đã che" ở backend nghĩa là dữ liệu gốc đã đi qua mạng, qua Collector, và tới hệ thống của bên thứ ba rồi mới bị thay (README §3.1, lớp 4). Hình chính ở trên đếm đúng chuyện đó: chỉ bật lớp 4 thì cả ba chặng đều thấy PII gốc.</p>
<p>Lớp 1 (trong code) là chỗ duy nhất bạn chắc dữ liệu chưa đi đâu. Nhưng lớp 1 chỉ chạy trên attribute do code của bạn đặt. Attribute do thư viện instrumentation ghi (ví dụ <code>gen_ai.input.messages</code> khi bật capture) không đi qua hàm của bạn; lớp 2 (lúc export trong SDK) mới bắt được chúng. Vì thế cấu hình hợp lý là lớp 1 + lớp 2, lớp 3 làm lưới thứ hai. Thử trong hình chính: chỉ bật lớp 1 và xem hai attribute "thư viện" vẫn lộ.</p>

      {

        a: `<p>Không. README §3.1: regex bắt được định dạng có cấu trúc (email, số thẻ) nhưng không bắt được "tôi bị tiểu đường, đang dùng thuốc X". Gõ hoặc chọn một câu bên dưới; lab chạy đúng năm regex của hình chính (bản chặt cho điện thoại) ngay trên trình duyệt.</p>
<p>Regex cũng có thể che <b>thừa</b>. Bản đầu của regex địa chỉ trong lab cho phép dấu chấm nằm trong một "từ" của địa chỉ (để bắt <code>TP.HCM</code>). Với câu <code>...Quận 1. Shipper sẽ gọi...</code>, nó đọc <code>1.</code> là một từ, rồi coi <code>Shipper</code> viết hoa là từ tiếp theo của địa chỉ, nên câu trả lời thành <code>[ADDRESS] sẽ gọi</code>. POC phát hiện lỗi này; bản hiện tại chỉ cho dấu chấm nằm <b>giữa</b> hai chữ (TP.HCM), dấu chấm cuối câu thì dừng. Bài học: test hàm che bằng câu thật có dấu câu, không chỉ bằng địa chỉ đứng một mình.</p>`,

      },
      {
        q: 'Tool get_order chỉ trả dữ liệu nội bộ của ShopViet. Ghi result vào span thì có sao?',
        a: `<p>Dữ liệu nội bộ của ShopViet chính là dữ liệu của khách. README §3.1: tool arguments và result cũng là nội dung; spec để chúng opt-in vì có thể chứa thông tin nhạy cảm. Một tool <code>get_customer</code> trả về địa chỉ, số điện thoại; ghi result vào span là ghi những thứ đó.</p>

<p>Khách không hề gõ số CCCD hay số thẻ, nhưng chúng nằm trong trace vì tool trả về. Tên "Nguyễn Thị Lan" không regex nào trong lab bắt được: tên người Việt không có định dạng riêng. Cách bền hơn regex: tool chỉ trả về các trường mà model cần (trạng thái đơn, ngày giao), không trả cả bản ghi khách hàng.</p>

      {
        q: 'Giữ 5% trace là đủ thống kê. Sao lại cần tail sampling phức tạp?',
        a: `<p>Vì 5% ngẫu nhiên giữ được 5% của mọi thứ, kể cả trace lỗi. README §3.1: head sampling quyết định ở đầu trace nên không biết trace nào sẽ lỗi; tail sampling quyết định sau khi thấy các span nên giữ được mọi trace lỗi, chậm, hoặc có cờ. Với LLM nên giữ 100% trace có lỗi, bị cắt, bị từ chối, thiếu usage, và lấy mẫu phần còn lại.</p>
<p>Mô phỏng 20.000 trace một ngày của ShopViet, tỉ lệ từng loại là giả định. Policy tail theo đúng cấu hình README: errors, flagged (<code>app.llm.keep</code>), slow &gt; 30 giây, baseline 5%.</p>`,
        viz(box) {
          const st = { head: 5 };
          const rnd = seeded(5051), N = 20000, TYPES = [['Lỗi (ERROR)', 0.004], ['Bị cắt (max_tokens)', 0.01], ['Refusal', 0.003], ['Thiếu usage', 0.002], ['Chậm > 30 s', 0.005]];
          const rows = [];
          for (let i = 0; i < N; i++) { const r = rnd(); let acc = 0, ty = -1; for (let j = 0; j < TYPES.length; j++) { acc += TYPES[j][1]; if (r < acc) { ty = j; break; } } rows.push({ ty, u: rnd() }); }
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const p = st.head / 100;
            const tb = TYPES.map(([name], j) => { const all = rows.filter((x) => x.ty === j), h = all.filter((x) => x.u < p).length; return '<tr><td>' + name + '</td><td class="mono">' + all.length + '</td><td class="mono ' + (h < all.length * 0.5 ? 'bad' : '') + '">' + h + '</td><td class="mono ok">' + all.length + '</td></tr>'; }).join('');
            const normal = rows.filter((x) => x.ty < 0), hk = rows.filter((x) => x.u < p).length, tk = rows.filter((x) => x.ty >= 0 || x.u < 0.05).length;
            out.innerHTML = '<div class="tbl"><table><tr><th>Loại trace</th><th>Có trong ngày</th><th>Head ' + st.head + '% giữ</th><th>Tail (README) giữ</th></tr>' + tb + '<tr><td>Bình thường</td><td class="mono">' + normal.length + '</td><td class="mono">' + normal.filter((x) => x.u < p).length + '</td><td class="mono">' + normal.filter((x) => x.u < 0.05).length + '</td></tr></table></div><div class="stat"><span>Tổng giữ (head) <b>' + int(hk) + '</b></span><span>Tổng giữ (tail) <b>' + int(tk) + '</b></span></div>';
            const bad = rows.filter((x) => x.ty >= 0), lost = bad.filter((x) => x.u >= p).length;
            cap.innerHTML = '<span class="bad">Head ' + st.head + '% bỏ ' + lost + '/' + bad.length + ' trace có vấn đề</span>, đúng loại đội trực cần đọc. Tail giữ đủ ' + bad.length + ' trace đó với tổng dung lượng gần bằng. Không có nghĩa head sampling sai: nó rẻ, và đủ cho metric (metric tính trên 100% request trước khi lấy mẫu). Trong hệ thống thật: wrapper đặt <code>app.llm.keep</code> trong lúc request chạy để Collector chỉ cần một policy (README §3.1).';
          }
          box.append(slider('Head sampling giữ', 1, 50, 1, st.head, (v) => { st.head = v; draw(); }, (v) => v + '%').node, out, cap);
          draw();
        },
        take: 'Lấy mẫu trace bình thường, giữ trọn trace bất thường. Metric thì tính trên toàn bộ.'
      },
      {
        q: 'Tail sampling chờ 30 giây mới quyết định. Collector phải giữ bao nhiêu thứ trong bộ nhớ?',
        a: `<p>README §3.1: <code>num_traces</code> giới hạn số trace, không giới hạn byte. Bộ nhớ cần ≈ số trace mới mỗi giây × <code>decision_wait</code> × kích thước trung bình một trace. Trace LLM có thể rất lớn khi capture nội dung: vài chục span, mỗi span mang prompt và tool result dài. Kích thước phải đo trên traffic thật; các số dưới là giả định.</p>
<p>Ba tên cấu hình của tail sampling trong Collector, nói thường: <code>decision_wait</code> là số giây Collector chờ gom span của một trace trước khi quyết định giữ hay bỏ; <code>num_traces</code> là số trace tối đa được giữ trong lúc chờ; <code>memory_limiter</code> là bộ phận đứng đầu pipeline, từ chối nhận thêm span khi bộ nhớ gần đầy. Không có nó, hệ điều hành giết process khi hết RAM (OOM kill) và mọi trace đang chờ mất theo. Ví dụ: 40 trace mới mỗi giây × chờ 30 giây = 1.200 trace nằm trong RAM cùng lúc; mỗi trace 60 KB thì cần khoảng 72 MB.</p>`,
        viz(box) {
          const st = { tps: 40, wait: 30, kb: 60, num: 50000, cap: 2 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const inflight = st.tps * st.wait, bytes = inflight * st.kb * 1e3, limit = st.cap * 1e9;
            out.innerHTML = '<div class="stat"><span>Trace đang chờ quyết định <b>' + int(inflight) + '</b></span><span>Bộ nhớ cần <b class="' + (bytes > limit ? 'bad' : 'ok') + '">' + mb(bytes) + '</b></span><span>num_traces <b class="' + (inflight > st.num ? 'bad' : 'ok') + '">' + int(st.num) + '</b></span><span>Giới hạn bộ nhớ Collector (giả định) <b>' + st.cap + ' GB</b></span></div>';
            const fl = [];
            if (inflight > st.num) fl.push('<span class="bad">Số trace đang chờ (' + int(inflight) + ') vượt num_traces</span>: trace cũ bị đẩy ra trước khi kịp quyết định.');
            if (bytes > limit) fl.push('<span class="bad">Cần ' + mb(bytes) + ', vượt ' + st.cap + ' GB</span>: không có memory_limiter thì Collector bị OOM kill và mất mọi trace đang chờ. README khuyên đặt memory_limiter là processor đầu tiên.');
            cap.innerHTML = (fl.length ? fl.join(' ') : '<span class="ok">Vừa bộ nhớ.</span>') + ' Agent chạy lâu cần tăng decision_wait, làm bộ nhớ tăng theo. maximum_trace_size_bytes bỏ trace quá lớn để bảo vệ Collector, nhưng trace bị bỏ thường là agent run dài nhất, đúng loại muốn xem; đẩy nội dung ra <code>*_ref</code> để trace nhỏ lại thay vì mất cả trace.';
          }
          box.append(el('div', { class: 'row' }, [
            slider('Trace mới mỗi giây', 1, 400, 1, st.tps, (v) => { st.tps = v; draw(); }).node,
            slider('decision_wait (giây)', 5, 120, 5, st.wait, (v) => { st.wait = v; draw(); }).node,
            slider('Kích thước trace (KB, giả định)', 2, 500, 2, st.kb, (v) => { st.kb = v; draw(); }).node,
            slider('num_traces', 1000, 100000, 1000, st.num, (v) => { st.num = v; draw(); }, int).node]), out, cap);
          draw();
        },
        take: 'Tính bộ nhớ tail sampling bằng byte, không bằng số trace; capture nội dung nhân kích thước trace lên nhiều lần.'
      },
      {
        q: 'Khách bấm "không hài lòng" ba giờ sau. Trace của câu trả lời đó còn không?',
        a: `<p>Thường là không. Tail sampling quyết định trong vài chục giây; feedback tiêu cực đến sau đó, khi trace bình thường đã rơi ngoài mẫu 5% (README §3.1). Wrapper không biết trước câu trả lời nào sẽ bị chê nên không đặt được <code>app.llm.keep</code>.</p>
<p>Cách README: lưu nội dung ngắn hạn cho 100% request (ví dụ 72 giờ, ở bucket riêng), khi có feedback thì chuyển bản ghi đó sang vùng lưu dài hơn. Phân phối độ trễ của feedback dưới đây là giả định: đa số đến sau vài giờ, một số ít đến sau vài ngày (dạng log-normal; trung vị kéo được, trung vị 3 giờ nghĩa là một nửa số feedback đến trong 3 giờ đầu).</p>`,
        viz(box) {
          const st = { med: 3, buf: 72 };

            cap.innerHTML = 'Trung vị feedback đến sau ' + dec(st.med, 1) + ' giờ; ' + pct(1 - inBuf) + ' đến sau khi bộ đệm ' + st.buf + ' giờ đã xoá. ' + (st.buf < st.med * 3 ? '<span class="bad">Bộ đệm quá ngắn so với độ trễ của feedback.</span> ' : '') + 'Đổi lại: thêm một bucket chứa 100% nội dung trong ' + st.buf + ' giờ, nên che PII và phân quyền ở đó cũng phải chặt như vùng lưu dài.';
          }
          box.append(el('div', { class: 'row' }, [

            slider('Bộ đệm lưu 100% (giờ)', 6, 168, 6, st.buf, (v) => { st.buf = v; draw(); }).node]), out, cap);
          draw();
        },
        take: 'Thứ đến sau quyết định sampling cần một kho ngắn hạn chứa tất cả, không phải một policy sampling.'
      },
      {
        q: 'Câu trả lời nói "hoàn tiền 3 ngày". Đọc trace thế nào để biết lỗi ở retriever hay ở model?',
        a: `<p>README §3.2: khi câu trả lời sai, câu hỏi đầu tiên là retriever có lấy đúng tài liệu không, và id tài liệu trên span trả lời được câu đó mà không cần nội dung. Ở ShopViet, chính sách cũ (bản v3) ghi 3 ngày, bản hiện hành (v4) ghi 14 ngày. Chọn thứ được ghi trên span retrieval để xem đội trực trả lời được tới đâu.</p>`,
        viz(box) {
          const st = { rec: 'ids' };
          const out = el('div'), cap = el('div', { class: 'cap' });

          function draw() {

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;

    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),

(function build() {
