const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

        wf.replaceChildren(waterfall(T, st.sel, (id) => { st.sel = id; draw(); }));
        const s = T.S.find((x) => x.id === st.sel) || T.S[0];
        detail.replaceChildren(el('h4', { style: 'margin:8px 0 4px;font-size:13px', html: `Span <code>${esc(s.name)}</code> · kind ${s.kind} · ${vn(s.e - s.s)} ms · status UNSET` }),
          el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Attribute</th><th>Giá trị</th></tr>' + Object.entries(s.a).map(([k, v]) => `<tr class="${k === 'app.llm.keep' || (k.includes('finish') && !String(v).match(/end_turn|tool_use/)) || (k === 'app.retrieval.doc_valid_until' && st.f.stale) || (k.includes('cache_write') && v > 0) ? 'cur' : ''}"><td class="mono">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join('') })]),
          s.llm ? el('div', { class: 'hint', html: `Chi phí = (${vn(s.u.input - s.u.read - s.u.write)} × 2 + ${vn(s.u.read)} × 0,10 + ${vn(s.u.write)} × 2,5 + ${vn(s.u.output)} × 10) / 10⁶ = <b>${usd(s.cost)}</b> (giá Sonnet 5.5, Cost Optimization §2.1–2.2). Nội dung prompt và output không nằm trong span: capture nội dung là opt-in.` }) : null);

        const { A, rows } = alerts(st.f, st.share);
        alertBox.replaceChildren(el('h4', { style: 'margin:12px 0 4px;font-size:13px', text: `Metric và alert trên ${vn(A.N)} request giả lập, ${pc(st.share, 0)} gặp các sự cố đang bật` }),
          el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Metric</th><th>Luật (ví dụ README §3.7)</th><th>Giá trị</th><th>Kết quả</th></tr>' + rows.map((r) => `<tr><td>${r.m}</td><td>${r.rule}</td><td class="mono">${r.v}</td><td style="font-weight:600;color:${r.fire ? (r.lvl === 'page' ? 'var(--bad)' : 'var(--warn)') : 'var(--ok)'}">${r.fire ? r.lvl : 'im lặng'}</td></tr>`).join('') })]));

        const parts = [];
        const on = Object.keys(st.f).filter((k) => st.f[k]);
        if (!on.length) parts.push(box('var(--ok)', 'Trace bình thường: lượt 1 quyết định gọi <code>get_order</code>, lượt 2 viết câu trả lời 14 ngày. Bật một sự cố để xem nó hiện ra ở đâu.'));
        if (on.length) parts.push(box('var(--bad)', `<b>HTTP vẫn là 200 với ${on.length} sự cố đang bật.</b> Tỉ lệ lỗi theo provider vẫn 0%. Mọi tín hiệu dưới đây đến từ attribute của span LLM và tín hiệu chất lượng, không từ HTTP.`));
        if (st.f.slow) {
          const fire = A.p95 > 3 * A.p95B;
          parts.push(box(fire ? 'var(--ok)' : 'var(--warn)', fire
            ? `<b>Chậm:</b> TTFT p95 ${vn(A.p95)} ms, vượt 3× baseline ${vn(A.p95B)} ms: page. Trên trace, vạch cam của lượt 2 nằm sau ${vn(T.S[7].ttft)} ms; thời gian sinh chữ không đổi, nên chậm nằm ở phía provider trước chunk đầu, không phải output dài ra.`
            : `<b>Chậm mà không ai được báo:</b> ${pc(st.share, 0)} khách đợi chunk đầu ${vn(T.S[7].ttft)} ms, nhưng TTFT p95 ${vn(A.p95)} ms chưa tới 3× baseline; p99 đã là ${vn(A.p99)} ms. Vì sao: phần chậm nằm ngoài 95% đầu. Không có nghĩa nhóm này không quan trọng. Trong hệ thống thật: cắt TTFT theo provider, region, loại phiên để thấy nhóm nhỏ (README §1.4).`));
        }
        if (st.f.refusal) parts.push(box('var(--warn)', `<b>Refusal:</b> span lượt 2 có <code>finish_reasons = ["refusal"]</code>, không có <code>error.type</code>, status không phải ERROR, và có <code>app.llm.keep = true</code> để tail sampling giữ trace. Tỉ lệ refusal ${pc(A.refusal, 2)}: ticket. Không có nghĩa phải đếm refusal là lỗi: đếm vậy sẽ page người trực mỗi khi model từ chối đúng một câu hỏi xấu (README §2.6).`));
        if (st.f.cachemiss) {
          const fire = A.costRatio > 3;
          parts.push(box(fire ? 'var(--bad)' : 'var(--warn)', `<b>Cache miss:</b> lượt 1 ghi ${vn(5800)} token cache thay vì đọc, trace tốn ${usd(T.cost)} thay vì ${usd(buildTrace({}).cost)}. Cache hit rate theo token: ${pc(A.hitRateB)} → ${pc(A.hitRate)}. Chi phí cả cửa sổ ×${A.costRatio.toFixed(2).replace('.', ',')}${fire ? ': page' : ', chưa tới ngưỡng page ×3; chỉ ticket cache hit rate kêu'}. Latency gần như không đổi nên dashboard latency xanh. Trong hệ thống thật: so cache hit rate trước và sau mỗi deploy; deploy <code>web-2026.11.27b</code> trên span HTTP chỉ ra thủ phạm.`));
        }
        if (st.f.stale && !st.f.refusal) parts.push(box('var(--bad)', `<b>Trả lời sai mà mọi metric vận hành đều xanh.</b> Câu trả lời "3 ngày" bám đúng tài liệu <code>${T.doc}</code> mà retriever đưa vào, nên judge "bám tài liệu" chấm 0,92. Chỉ canary <code>refund-days</code> (kiểm "14" bằng code) và attribute <code>app.retrieval.doc_valid_until</code> trên span retrieval lộ ra lỗi. Không có nghĩa judge vô dụng: nó đo một câu hỏi khác. Trong hệ thống thật: ghi id và phiên bản tài liệu trên span retrieval, chạy canary có đáp án cho chính sách quan trọng (README §3.2, §3.5).`));
        if (st.f.stale && st.f.refusal) parts.push(box('var(--warn)', 'Tài liệu cũ vẫn được lấy về, nhưng lượt 2 từ chối nên khách không thấy con số sai. Canary vẫn đỏ vì nó chạy độc lập với traffic.'));
        cap.innerHTML = parts.join('');
        const hr = T.S.filter((x) => x.llm).reduce((a, x) => [a[0] + x.u.read, a[1] + x.u.input], [0, 0]);
        foot.innerHTML = `<span>HTTP: <b>200 ${T.end}ms</b></span><span>Chi phí trace: <b>${usd(T.cost)}</b></span><span>Cache hit trace: <b>${pc(hr[0] / hr[1])}</b></span><span>Khách thấy: <b class="${st.f.refusal || st.f.stale ? 'bad' : 'ok'}">${esc(T.answer)}</b></span>`;
      }

      stage.append(flags, ctl, wf, detail, alertBox, cap, foot,
        el('p', { class: 'hint', text: 'Số token, thời gian từng span, tốc độ sinh 178 token/giây và tỉ lệ refusal nền 0,2% là giả định. Giá từ Cost Optimization §2.1 (06/11/2026) và hệ số ghi cache §2.2. 2.000 request giả lập theo seed, TTFT phân phối log-normal quanh giá trị của trace; p95, p99, cache hit rate và tỉ lệ chi phí tính thật trong trình duyệt. Ngưỡng alert theo ví dụ README §3.7; ngưỡng có ghi "giả định" là của lab.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
