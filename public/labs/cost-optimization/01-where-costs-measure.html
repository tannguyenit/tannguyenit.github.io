const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  const PRICES = {

    const outTok = o.outOverride != null ? o.outOverride : g(u, 'output_tokens');
    const wm5 = o.write1x ? 1 : W5, wm1 = o.write1x ? 1 : W1;
    const lines = [
      ['input_tokens', inp, bi], ['cache write 5 phút', w5, bi * wm5], ['cache write 1 giờ', w1, bi * wm1],

    poc: {

n bao nhiêu ==\nCách tính sai                     Báo cáo    Lệch so với hoá đơn 2.253 USD\n--------------------------------  ---------  -----------------------------\nQuên thinking (đếm chữ hiển thị)  1.315 USD  -41,6%\nGhi cache tính giá input          1.839 USD  -18,4%\nCoi mọi write là TTL 5m           1.953 USD  -13,3%\nQuên giá prompt dài Haiku         2.199 USD  -2,4%\nBỏ iterations                     2.221 USD  -1,4%\nFast tính giá thường              2.204 USD  -2,2%\nQuên batch −50%                   2.317 USD  +2,8%\n\nRút ra: hàm README qua cả 8 test trên object SDK thật. Lỗi lớn nhất là đếm output theo chữ khách thấy (bỏ thinking):\nmột mình nó làm báo cáo thấp hơn hoá đơn nhiều nhất; các lỗi khác nhỏ trên tổng nhưng trên từng request lệch tới −93% (thinking) hoặc +100% (quên batch).",

    mount(stage) {
      const st = { preset: 'chat', model: PRESETS.chat.model, batch: false };
      const ta = el('textarea', { rows: 9, spellcheck: 'false', style: 'width:100%;font:12.5px var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px' });
      const txt = el('textarea', { rows: 2, style: 'width:100%;font:13px var(--font);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px' });
      const modelSel = select('Model của request', Object.keys(PRICES).map((m) => [m, m]), st.model, (v) => { st.model = v; draw(); });
      const out = el('div');
      const load = (k) => { const p = PRESETS[k]; st.preset = k; st.model = p.model; modelSel.sel.value = p.model; ta.value = JSON.stringify(p.usage, null, 2); txt.value = p.text; draw(); };
      const draw = () => {
        let usage;
        try { usage = JSON.parse(ta.value); if (!usage || typeof usage !== 'object' || Array.isArray(usage)) throw new Error('usage phải là một object JSON'); } catch (e) { out.innerHTML = note('var(--bad)', '<b>JSON không đọc được:</b> ' + esc(e.message)); return; }
        let R;
        try { R = requestCost(usage, st.model, { batch: st.batch }); } catch (e) { out.innerHTML = note('var(--bad)', `<b>${esc(e.message)}</b>. README cố ý để hàm ném KeyError với model không có giá: tính sai giá lặng lẽ tệ hơn báo lỗi. Trong hệ thống thật: thêm giá của model vào PRICES trước khi đưa nó lên production.`); return; }
        const vis = visibleTokens(txt.value);
        const lineRows = [];
        R.entries.forEach((e) => e.lines.forEach((l) => { if (l.t) lineRows.push([`<span class="mono">${e.model}</span>`, l.n, vn(l.t), '$' + vn(l.price, 4), `<b>${usd(l.cost)}</b>`]); }));
        if (!lineRows.length) lineRows.push(['—', 'không có token nào', '0', '—', usd(0)]);
        const mRows = MISTAKES.map((m) => {
          let c, err = null;
          if (m.k === 'outOverride' && txt.value.trim() === '' && st.preset !== 'maxcut') return [m.t, '—', '<span style="color:var(--dim)">không có chữ hiển thị để so</span>', m.why];
          try { c = requestCost(usage, st.model, Object.assign({ batch: st.batch }, m.k === 'outOverride' ? { outOverride: vis } : { [m.k]: true })).cost; } catch (e) { err = e.message; }

          const d = R.cost ? (c - R.cost) / R.cost : 0;
          const hit = Math.abs(d) > 0.005;
          return [m.t, usd(c), hit ? `<b class="bad">${d > 0 ? '+' : ''}${pct(d)}</b>` : '<span style="color:var(--dim)">không ảnh hưởng</span>', m.why];
        });
        const e0 = R.entries[0];
        const outTok = R.entries.reduce((s, e) => s + e.lines[4].t, 0);
        const outCost = R.entries.reduce((s, e) => s + e.lines[4].cost, 0);
        const promptTok = R.entries.reduce((s, e) => s + e.lines.slice(0, 4).reduce((a, l) => a + l.t, 0), 0);
        const readTok = R.entries.reduce((s, e) => s + e.lines[3].t, 0);
        const parts = [];
        if (R.entries.some((e) => e.tier !== 'thường')) parts.push(note('var(--bad)', `<b>Prompt ${vn(e0.prompt)} token vượt 100.000: cả request tính giá prompt dài của Haiku 5.5, kể cả output.</b> Vì sao: ngưỡng đếm input + cache read + cache write. Không có nghĩa cache vô ích: phần đọc vẫn rẻ hơn input, chỉ là đơn giá đã gấp 5. Trong hệ thống thật: compact trước 100.000 (README §3.2, failure mode 9).`));
        if (txt.value.trim() === '' && outTok > 0 && !['pricing', 'write1h'].includes(st.preset)) parts.push(note('var(--bad)', `<b>Trả ${usd(outCost)} cho ${vn(outTok)} token output mà khách không thấy chữ nào.</b> Vì sao: toàn bộ output là thinking, và request chạm max_tokens trước khi viết câu trả lời. Không có nghĩa usage sai: thinking tính như output. Trong hệ thống thật: tăng max_tokens hoặc hạ effort (README §3.3, failure mode 10).`));
        else if (vis > 0 && outTok > vis * 5) parts.push(note('var(--warn)', `<b>Khách thấy khoảng ${vn(vis)} token chữ (ước lượng), nhưng output_tokens là ${vn(outTok)}.</b> Phần còn lại là thinking, chiếm ${pct(1 - vis / outTok)} output. Cách tính theo chữ hiển thị báo thiếu gần hết tiền output.`));
        if (usage.iterations && usage.iterations.length) parts.push(note('var(--warn)', `<b>Response có ${usage.iterations.length} mục iterations trên ${[...new Set(R.entries.map((e) => e.model))].length} model.</b> Usage cấp trên cùng chỉ tính lần chạy tạo ra message trả về; cộng từng mục mới ra đúng hoá đơn (README §1.2, failure mode 5).`));
        if (R.fast) parts.push(note('var(--warn)', '<b>speed: "fast": giá input và output thay bằng giá fast mode, hệ số cache áp lên trên.</b> Fast mode mua tốc độ bằng giá gấp đôi, không bao giờ là đòn bẩy giảm chi phí. Không dùng cho batch hay ETL (failure mode 15).'));
        if (usage.cache_creation_input_tokens && !usage.cache_creation) parts.push(note('var(--accent)', 'Không có breakdown cache_creation: hàm coi toàn bộ là TTL 5 phút (× 1,25), giống README test 3. Nếu thật ra là TTL 1 giờ, chi phí bị báo thấp.'));
        if (promptTok > 0 && readTok / promptTok > 0.8) parts.push(note('var(--ok)', `Đọc từ cache ${pct(readTok / promptTok)} prompt. README: agent loop trên traffic thật đọc trung vị 84%, dưới khoảng 80% là có thứ làm vỡ cache.`));
        if (st.preset === 'pricing' && Math.abs(R.cost - 0.348) < 1e-9 && !st.batch) parts.push(note('var(--ok)', 'Khớp ví dụ trong trang giá Claude: đúng 0,348 USD (README §1.2, test 1).'));
        if (st.preset === 'write1h' && Math.abs(R.cost - 0.8) < 1e-9 && !st.batch) parts.push(note('var(--ok)', 'Khớp README §1.2 test 2: ghi 100.000 token TTL 1 giờ trên Opus 5.5 là 0,80 USD.'));
        out.innerHTML = `<div class="stat"><span>Chi phí đúng: <b>${usd(R.cost)}</b></span><span>Output chiếm: <b>${R.cost ? pct(outCost / R.cost) : '0%'}</b></span><span>Tier: <b>${R.entries.map((e) => e.tier).join(' + ')}</b></span><span>Batch: <b>${st.batch ? '× 0,5' : 'không'}</b></span><span>Chữ hiển thị (ước lượng): <b>${vn(vis)}</b> token</span></div>` +
          '<h4 style="margin:12px 0 4px;font-size:13px">Cách tính đúng (request_cost, README §1.2)</h4>' + table(['Model', 'Dòng', 'Token', 'Giá / 1M', 'Tiền'], lineRows) +
          '<h4 style="margin:12px 0 4px;font-size:13px">Bảy cách tính sai trên cùng usage</h4>' + table(['Cách tính', 'Kết quả', 'Lệch', 'Vì sao sai'], mRows) + parts.join('');
      };
      ta.addEventListener('input', draw);
      txt.addEventListener('input', draw);
      stage.append(
        el('div', { class: 'row' }, [select('Usage mẫu', Object.entries(PRESETS).map(([k, v]) => [k, v.label]), st.preset, load).node, modelSel.node, el('label', { class: 'ctl' }, [el('input', { type: 'checkbox', onchange: (e) => { st.batch = e.target.checked; draw(); } }), 'Gửi qua Batch API'])]),
        el('div', { class: 'cols' }, [el('div', {}, [el('h4', { text: 'usage (JSON, sửa được)' }), ta]), el('div', {}, [el('h4', { text: 'Chữ khách thấy trong response' }), txt, el('p', { class: 'hint', text: 'Ước lượng token hiển thị = số từ × 56/49 (tỉ lệ đo bằng o200k_base trên đoạn tiếng Việt NFC, README §2.1). Chỉ dùng cho cách tính sai số 1.' })])]),
        el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Giá README §2.1 / §1.2 (06/11/2026), USD mỗi triệu token. Opus 5.5 4 / 20 / 0,20; Sonnet 5.5 2 / 10 / 0,10; Fable 5.1 10 / 50 / 0,25; Opus 4.8 5 / 25 / 0,50; Haiku 5.5 0,10 / 0,50 / 0,01, prompt > 100.000: 0,50 / 2,50 / 0,05. Fast: Opus 5.5 8 / 40, Opus 4.8 10 / 50.' }),

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));

      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),

    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }

})();
