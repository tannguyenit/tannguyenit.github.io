const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

m rẻ hơn high: Opus SWE 27,6%, Fable DeepResearch 21,3% — README Tra cứu nhanh ghi '30–52%' (nguồn khác, không có trong bảng §3.3).\nlow rẻ hơn high: 62,1% (README: 'khoảng hai phần ba').\n\nRút ra: cùng 200 token, cắt ở output tiết kiệm gấp 5 lần cắt ở input và nhanh hơn ~200 lần về thời gian; trong hội thoại không cache,\nmỗi token trả lời còn bị trả lại ở mọi lượt sau (×4,9 ở 40 lượt). Memo dài và fast mode bị lựa chọn khác vượt; batch vượt hai cấu hình Sonnet không thinking\nvề chi phí nhưng chậm ~1 giờ, nên chỉ dùng được khi không ai chờ. Trên SWE-bench, medium/high đều bị 'low rồi chạy lại lỗi ở high' vượt.",

      const st = { m: 'sonnet', inTok: 8000, cached: 0.95, out: 180, think: 0, cut: 200, ds: 'shop', axis: 'cost', noise: 1, ticket: false, ticketCost: 0.5 };

        const bar = (a, b, la, lb) => `<div style="display:flex;height:16px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:3px 0"><div style="width:${a / (a + b) * 100}%;background:var(--g1)" title="${la}"></div><div style="width:${b / (a + b) * 100}%;background:var(--g2)" title="${lb}"></div></div>`;

        if (m.speed) parts.push(note('var(--warn)', `<b>Fast mode: decode nhanh ${vn(m.speed, 1)} lần (README: tới 2,5 lần), giá input và output gấp đôi Opus 5.5 thường.</b> Rẻ hơn không phải mục tiêu của nó; chỉ dùng cho đường người dùng đang chờ.`));
        if (st.cached < 0.8) parts.push(note('var(--accent)', `Chỉ ${pct(st.cached, 0)} prompt đọc từ cache. Ở mức này cắt input bắt đầu đáng kể; nhưng trước khi cắt chữ, kiểm vì sao cache không khớp (README: dưới khoảng 80% là có thứ làm vỡ cache).`));
        top.innerHTML = `<div class="stat"><span>Chi phí request: <b>${usd(c0)}</b></span><span>Độ trễ ước lượng: <b>${sec(L0.pre + L0.dec)}</b></span><span>Mỗi tháng, 2,4 triệu lượt: <b>${usd(c0 * 2.4e6, 0)}</b></span></div>` +
          `<div style="font-size:12.5px;color:var(--mute);margin-top:6px">Chi phí: <span style="color:var(--g1)">input ${pct(cIn / c0)}</span> · <span style="color:var(--g2)">output + thinking ${pct(cOut / c0)}</span></div>${bar(cIn, cOut, 'input', 'output')}` +
          `<div style="font-size:12.5px;color:var(--mute)">Độ trễ: <span style="color:var(--g1)">prefill ${sec(L0.pre)}</span> · <span style="color:var(--g2)">decode ${sec(L0.dec)}</span></div>${bar(L0.pre, L0.dec, 'prefill', 'decode')}` +
          `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${card('Cắt ' + vn(cutIn) + ' token khỏi prompt', cA, LA, cA < cB)}${card('Cắt ' + vn(cutOut) + ' token khỏi câu trả lời', cB, LB, cB <= cA)}</div>` + parts.join('');
      };
      const drawBot = () => {
        const ds = DATASETS[st.ds];
        const key = st.axis === 'lat' && ds.assumed ? 'lat' : 'cost';
        const P = pareto(points(st.ds, st), key, st.noise);
        const front = P.filter((p) => p[key] != null && !p.dom && !p.skip);
        const flagged = P.filter((p) => p.dom);
        const msgs = flagged.map((p) => {

          return note(within ? 'var(--warn)' : 'var(--bad)', `<b>${p.n}</b> bị <b>${p.dom.n}</b> vượt: ${key === 'cost' ? usd(p.dom.cost) + ' so với ' + usd(p.cost) : sec(p.dom.lat) + ' so với ' + sec(p.lat)}, chất lượng ${vn(p.dom.q, 1)}% so với ${vn(p.q, 1)}%.${within ? ' Chi phí gần bằng và chênh chất lượng trong khoảng nhiễu bạn đặt: chưa đủ bằng chứng để nói cái nào hơn, chạy lặp eval.' : ''}`);
        });
        const extra = [];
        if (st.ds === 'drb') extra.push(note('var(--bad)', '<b>medium đắt hơn low 28% mà cùng 60,5%.</b> Vì sao: trên tác vụ nghiên cứu này, thêm thinking không mua thêm độ chính xác. Không có nghĩa effort vô ích nói chung: trên SWE-bench Pro, high hơn low 7,9 điểm. Trong hệ thống thật: quét effort trên workload của bạn, mỗi mức một phiên riêng (README §3.3).'), note('var(--warn)', '<b>medium chỉ rẻ hơn high 21,3% ở đây</b> ((5,64 − 4,44) / 5,64), thấp hơn khoảng 30–52% của bảng Tra cứu nhanh. Đây là tác vụ nghiên cứu, còn khoảng đó README ghi cho code dài; nhưng ngay cả SWE-bench Pro (code) cũng chỉ cho 27,6%.'));
        if (st.ds === 'swe') extra.push(note('var(--ok)', '"low, chạy lại bài lỗi ở high" nằm trên đường biên: khoảng 97% với khoảng 0,17 USD, rẻ hơn khoảng 40% so với chạy hết ở high (README §3.1, số xấp xỉ). Điều kiện: có tín hiệu lỗi đáng tin.'), note('var(--accent)', 'Điểm Sonnet 5.5 đã quy về <b>mỗi tác vụ</b> (0,11 USD mỗi bài giải được × 87,6% ≈ 0,096 USD) để cùng đơn vị với các điểm Opus lấy từ bảng §3.3. Vẽ 0,11 lên cùng trục là so táo với cam.'), note('var(--warn)', '<b>medium rẻ hơn high 27,6% ở đây, không phải 30–52% như bảng Tra cứu nhanh của README.</b> Vì sao: con số trong Tra cứu nhanh không suy ra được từ bảng §3.3. Không có nghĩa effort không tiết kiệm: low vẫn rẻ hơn high 62%. Trong hệ thống thật: đo mức tiết kiệm trên workload của bạn.'));
        if (st.ds === 'shop' && key === 'lat') extra.push(note('var(--accent)', 'Sonnet 5.5 qua Batch API không có trên trục này: kết quả trong tối đa 24 giờ. Trên trục chi phí nó là điểm rẻ nhất cho chất lượng 91%, nhưng không dùng được cho chat.'));
        if (st.ds === 'shop' && st.ticket) extra.push(note('var(--accent)', `Đã cộng chi phí câu sai (giả định $${st.ticketCost.toFixed(2)} mỗi câu). Haiku 5.5 rẻ nhất theo token nhưng xem nó còn trên đường biên không.`));
        bot.replaceChildren(paretoSvg(P, key),
          el('div', { class: 'legend', html: '<span><i style="background:var(--accent)"></i>trên đường biên Pareto</span><span><i style="background:var(--warn)"></i>gần như hoà, trong nhiễu</span><span><i style="background:var(--bad)"></i>bị vượt</span><span><i style="background:var(--dim)"></i>batch: không so, khách không chờ được</span>' }),
          el('div', { class: 'stat', html: `<span>Đơn vị chi phí: <b>${ds.unit}</b></span><span>Trên đường biên: <b>${front.length}</b> / ${P.length}</span><span>Nguồn chất lượng: <b>${ds.assumed ? 'giả định' : 'README (đo của Anthropic)'}</b></span>` }),
          el('div', { html: msgs.join('') + extra.join('') }));
      };
      const draw = () => { drawTop(); drawBot(); };
      const ctlTop = el('div', { class: 'row' }, [
        select('Model', Object.entries(MODELS).map(([k, v]) => [k, v.name]), st.m, (v) => { st.m = v; drawTop(); }).node,

        slider('Câu trả lời (token)', 20, 2000, 10, st.out, (v) => { st.out = v; drawTop(); }).node,
        slider('Thinking (token)', 0, 8000, 100, st.think, (v) => { st.think = v; drawTop(); }).node,

      stage.append(el('h4', { text: 'Request designer', style: 'margin:0 0 6px' }), ctlTop, top,
        el('h4', { text: 'Chi phí, chất lượng, độ trễ: đường biên Pareto', style: 'margin:18px 0 6px' }), ctlBot, bot,

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
