const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {

        a: `<p>Vì hoá đơn là đơn giá nhân <b>số token</b>, và số token mỗi bài khác nhau theo model và effort. Trên tập con SWE-bench Pro (bộ bài sửa lỗi code thật, chấm bằng test; điểm là % bài giải được), Opus 5.5 ở effort low giải 87,4% với 0,12 USD mỗi bài giải được; Sonnet 5.5 mặc định giải 87,6% với 0,11 USD. Bảng effort trong tóm tắt ghi Opus low là 0,11 USD: đó là tiền mỗi bài <i>đã chạy</i>, còn 0,12 là mỗi bài <i>giải được</i> (0,11 / 0,874 ≈ 0,12). Hai đơn vị, cùng một lần đo. Opus ở low suy nghĩ ít hơn, gọi ít lượt hơn, nên dù mỗi token đắt gấp đôi, tổng tiền mỗi bài gần bằng.</p>
<p>Chiều ngược lại cũng đúng: model rẻ mỗi token có thể cần thêm lượt, thêm retry, hoặc làm sai. Trong bảng A, Haiku 5.5 và gpt-6-luna dùng 1,6 lần số lượt ở tác vụ khó (giả định của lab). Kéo "chi phí xử lý một lần sai" lên để thấy thứ hạng đổi.</p>`,
        take: 'Đơn vị so sánh là tác vụ hoàn thành, không phải token. Giá token chỉ là một thừa số.'
      },
      {
        q: 'Sao phải so trên 10% tác vụ khó nhất? Trung bình không đủ à?',
        a: `<p>Vì phần dễ thì model nào cũng làm được, nên nó không phân biệt được model. Phần khó là chỗ model rẻ trượt, và mỗi lần trượt thành một ticket cho người xử lý, một khách bực, hoặc một lần chạy lại. README: hoá đơn được quyết định bởi các tác vụ model rẻ làm hỏng.</p>
<p>Trong bảng A, gpt-6.1-terra qua 87,5% toàn bộ nhưng chỉ 2/4 tác vụ khiếu nại khó. Hạ cổng phần khó xuống 0 để thấy lab chọn model khác, rồi đọc cột chi phí mỗi tác vụ hoàn thành khi chi phí xử lý lỗi cao.</p>`,
        take: 'Cổng chất lượng phải có hai tầng: toàn bộ và phần khó. Model qua trung vị mà trượt phần khó sẽ trả giá ở ticket.'
      },
      {
        q: 'Phần khó chỉ có 4 tác vụ. Model A đúng 3, model B đúng 4. B tốt hơn thật không?',
        a: `<p>Chưa biết được. Với 4 tác vụ, mỗi tác vụ là 25 điểm phần trăm. README §3.1 bước 5: sai khác một hai tác vụ nằm trong nhiễu một lần chạy, phải chạy lặp và lấy đủ mẫu. Hình dưới tính khoảng tin cậy 95% (khoảng Wilson) cho tỉ lệ đúng quan sát được với n tác vụ. Hai khoảng chồng nhau nhiều thì chưa phân biệt được.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { n: 4, a: 3, b: 4 };
          const wilson = (k, n) => { const p = k / n, z = 1.96, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [Math.max(0, c - h), Math.min(1, c + h)]; };
          function draw() {
            const a = Math.min(st.a, st.n), b = Math.min(st.b, st.n), A = wilson(a, st.n), B = wilson(b, st.n), W = 600, H = 80, x = (v) => 20 + v * (W - 40);
            const bar = (lo, hi, k, yy, col, lab) => el('g', {}, [el('line', { x1: x(lo), x2: x(hi), y1: yy, y2: yy, stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.6 }), el('circle', { cx: x(k / st.n), cy: yy, r: 5, fill: col }), el('text', { x: x(lo), y: yy - 9, text: lab + ': ' + a2(k) + ' [' + pct(lo) + '–' + pct(hi) + ']' })]);
            const a2 = (k) => k + '/' + st.n;
            out.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H }, [el('line', { x1: x(0), x2: x(1), y1: H - 8, y2: H - 8, stroke: 'var(--line)' }), bar(A[0], A[1], a, 28, 'var(--g2)', 'A'), bar(B[0], B[1], b, 60, 'var(--accent)', 'B')]));
            const ov = Math.max(0, Math.min(A[1], B[1]) - Math.max(A[0], B[0]));
            cap.innerHTML = 'Mỗi tác vụ là <b>' + dec(100 / st.n, 1) + ' điểm</b>. ' + (ov > 0 ? '<span class="bad">Hai khoảng chồng nhau ' + pct(ov) + ': chênh lệch quan sát được chưa đủ để nói model nào tốt hơn.</span>' : '<span class="ok">Hai khoảng tách nhau: chênh lệch khó là nhiễu.</span>') + ' Tăng số tác vụ phần khó để thấy khoảng hẹp lại.';
          }
          box.append(el('div', { class: 'row' }, [slider('Số tác vụ phần khó', 4, 200, 1, st.n, (v) => { st.a = Math.round(st.a / st.n * v); st.b = Math.round(st.b / st.n * v); st.n = v; draw(); }).node, slider('Model A đúng (tỉ lệ)', 0, 1, 0.05, 0.75, (v) => { st.a = Math.round(v * st.n); draw(); }, (v) => pct(v)).node, slider('Model B đúng (tỉ lệ)', 0, 1, 0.05, 1, (v) => { st.b = Math.round(v * st.n); draw(); }, (v) => pct(v)).node]), out, cap);
          draw();
        },
        take: 'Với vài tác vụ, một tác vụ đã là chục điểm. Chạy lặp, thêm mẫu, rồi mới kết luận.'
      },
      {
        q: 'Chạy rẻ trước rồi chạy lại phần lỗi: sao rẻ hơn mà còn đúng hơn chạy hết ở mức cao?',
        a: `<p>Số đo của Anthropic trên Opus 5.5: chạy mọi bài ở low (0,11 USD mỗi bài, đúng 87,4%), rồi chạy lại 12,6% bài lỗi ở high, được khoảng 97% với khoảng 0,17 USD mỗi bài. Chạy hết ở high: 95,3% với 0,29 USD. Rẻ hơn khoảng 40%.</p>
<p>Rẻ hơn vì 87,4% bài chỉ trả giá low. Còn phần đúng hơn, README nói rõ: nó đến chủ yếu từ <b>lần thử thứ hai</b>, không phải từ chính sách. Chạy lại các bài lỗi của high ở high cũng đạt 96,9% (0,31 USD). Vậy dùng chính sách này để tiết kiệm, không phải để tăng điểm.</p>
<p>Hình dưới dựng lại phép tính. Tỉ lệ checker bắt được lỗi và hệ số "bài lỗi khó hơn trung bình" là <b>giả định</b>; ở hệ số 1,64 phép tính ra đúng khoảng 0,17 USD của README.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { d: 1, m: 1.64 };
          function draw() {
            const lowC = 0.11, lowA = 0.874, highC = 0.29, highA = 0.953, fail = 1 - lowA, caught = fail * st.d;
            const cost = lowC + caught * highC * st.m, acc = lowA + caught * highA;
            out.replaceChildren(hbars([['Hết ở high (README)', highC, false], ['Low, chạy lại lỗi ở high', cost, cost < highC]], { max: Math.max(highC, cost), fmt: usd }));
            cap.innerHTML = 'Tỉ lệ đúng: chạy lại <b>' + pct(acc, 1) + '</b> so với ' + pct(highA, 1) + '. Chi phí rẻ hơn <b>' + pct(1 - cost / highC) + '</b>. ' + (st.d < 0.8 ? '<span class="bad">Checker bỏ sót ' + pct(1 - st.d) + ' bài sai: chúng lọt ra như bài đúng. Tỉ lệ đúng thật thấp hơn chạy hết ở high, dù dashboard vẫn thấy rẻ.</span>' : 'Điều kiện: checker đáng tin. Checker cho qua bài sai thì lỗi lọt qua luôn.');
          }
          box.append(el('div', { class: 'row' }, [slider('Checker bắt được lỗi (giả định)', 0, 1, 0.05, st.d, (v) => { st.d = v; draw(); }, (v) => pct(v)).node, slider('Bài lỗi tốn gấp trung bình (giả định)', 1, 3, 0.02, st.m, (v) => { st.m = v; draw(); }, (v) => dec(v, 2)).node]), out, cap);
          draw();
        },
        take: 'Chính sách hai mức rẻ hơn khoảng 40% với cùng tỉ lệ pass, khi có tín hiệu lỗi đáng tin. Bài lỗi chậm gấp đôi.'
      },
      {
        q: 'Câu "kiểm tra hai lần, càng kỹ càng tốt" thì có hại gì? Nghe như làm câu trả lời tốt hơn.',
        a: `<p>Với model cũ có thể đúng. Model mới làm theo đúng từng chữ: "kiểm tra hai lần" thành hai lượt tool, "quy trình 7 bước" thành 7 đoạn chữ, "viết vào scratchpad" thành vài trăm token output mỗi câu trả lời, mà không chính xác hơn. Trong đánh giá hỗ trợ khách hàng của Anthropic, rà lại prompt cũ giảm 14% chi phí ở cả hai lần nâng model được đo, và có lần còn tăng độ chính xác.</p>
<p>README tách hai loại: câu dặn quá mức tốn <b>tiền</b>; cấu hình thinking đã bỏ, quy tắc mâu thuẫn, scratchpad tự chế xung đột với thinking của model thì tốn <b>độ chính xác</b>. Khối "Câu chữ viết cho model cũ" trong phần B có giả định thêm 250 token output mỗi câu trả lời; bỏ nó tiết kiệm cả input lẫn output, và output đắt gấp 5.</p>`,
        take: 'Mỗi lần đổi model, đọc lại prompt và xoá câu dặn viết cho model trước.'
      },
      {
        q: 'Bảng giá 1.862 dòng dán vào prompt thì model biết giá. Sao README bảo bỏ?',
        a: `<p>Ba lý do, đều có số đo. <b>Tiền:</b> khoảng 91.000 input token mỗi request. <b>Chất lượng:</b> Sonnet 5 trả lời đúng 7/25 câu hỏi tổng hợp khi bảng dán thẳng; upload qua Files API và để model truy vấn bằng code execution thì đúng 25/25, với khoảng một phần mười hai chi phí. Model đọc 1.862 dòng rồi tự cộng trừ trong đầu thì sai; viết code đọc file thì đúng.</p>
<p><b>Bậc giá:</b> với Haiku 5.5, prompt vượt 100.000 token làm mọi token của request đắt gấp 5, kể cả cache read và output. Trong phần B, giữ bảng giá rồi đổi model sang Haiku 5.5: lab ước lượng prompt và báo khi vượt ngưỡng.</p>
<p>Lab ước lượng token của bảng từ chính 1.862 dòng được sinh ra trong trình duyệt. Con số khác 91.000 của README vì dòng của lab ngắn hơn và tokenizer là ước lượng; điểm cần thấy là cỡ hàng chục nghìn token.</p>`,
        take: 'Dữ liệu dạng bảng đi qua tool hoặc code execution, không dán vào prompt.'
      },
      {
        q: 'Đặt max_tokens 512 thì câu trả lời ngắn lại và rẻ hơn chứ?',
        a: `<p>Không. Model không thấy <code>max_tokens</code>. Nó vẫn viết như bình thường, và khi chạm trần thì bị cắt với <code>stop_reason: "max_tokens"</code>. Phần đã sinh vẫn bị tính tiền. Retry ở cùng mức thường lại bị cắt (cùng câu hỏi, độ dài tương tự); retry ở mức cao hơn thì trả thêm cho lần thử bỏ đi.</p>
<p>Số đo của Anthropic: Opus 5.5 với <code>max_tokens</code> 16.384 có 25% lần thử bị cắt và giải 57,6% số bài; ở 64.000 không lần nào bị cắt, giải 75,6%, cùng chi phí mỗi bài giải được. Phần C của hình chính mô phỏng đúng cơ chế này với câu trả lời của ShopViet.</p>
<p>Muốn câu trả lời ngắn: mô tả format trong prompt kèm ví dụ. Anthropic đo trên agent phân loại bug: một dòng, hai dòng, bản ghi nhớ sáu mục tốn 0,49, 0,57, 1,40 USD mỗi lượt chạy, độ chính xác trong nhiễu của nhau. Tra cứu nhanh của README ghi mức giảm khoảng 13% từ 39% ít output token hơn. Bật "Yêu cầu câu trả lời ngắn" trong phần C để so.</p>`,
        take: 'Giảm độ dài bằng prompt, giảm suy luận bằng effort. max_tokens đặt rộng, chỉ để chặn sự cố như model lặp vô hạn.'
      },
      {
        q: 'Haiku 5.5 trả về response rỗng mà vẫn tính tiền. Chuyện gì xảy ra?',
        a: `<p>Với Haiku 5.5, thinking bật mặc định và <b>tính vào max_tokens</b>. Nếu phần thinking đã dùng hết max_tokens, response kết thúc trước khi có chữ nào: bạn trả tiền input và toàn bộ thinking (tính như output), nhận lại câu trả lời rỗng. OpenAI có hiện tượng tương tự: hết <code>max_output_tokens</code> trước khi có output hiển thị vẫn tính tiền input và reasoning.</p>
<p>Cách xử lý theo README: tăng <code>max_tokens</code> hoặc hạ effort. Trong phần C, chọn Haiku 5.5, effort high, max_tokens 1.024: đếm "không có chữ nào" sẽ đỏ.</p>`,
        take: 'Khi thinking tính vào max_tokens, trần thấp có thể mua toàn bộ suy nghĩ mà không mua được câu trả lời (failure mode 10).'
      },
      {
        q: 'Vậy effort chọn thế nào, và đổi model thì có cần đặt lại effort không?',
        a: `<p>Effort điều khiển lượng thinking, số lượt tool và mức tự kiểm tra. Tiết kiệm và cái giá khác nhau theo tác vụ: trên code dài (Opus 5.5, SWE-bench Pro) effort mua được độ chính xác thật (87,4% → 92,8% → 95,3%); trên nghiên cứu với Fable 5.1, medium không hơn low (60,5% cả hai). Nhưng không tổng quát được: Opus 5.5 ở low thấp hơn medium 13,3 điểm trên DRACO và 34 điểm trên một benchmark tìm lỗi nội bộ. Chỉ quét effort trên workload của bạn mới trả lời được, mỗi mức một phiên riêng (đổi effort giữa phiên làm vỡ cache và làm sai số đo).</p>
<p>Có cần đặt lại khi đổi model: có. Mặc định là high trên phần lớn model Claude, medium trên Opus 5.5 và Haiku 5.5. Nâng model mà không đặt effort tường minh có thể làm chi phí tăng hoặc giảm mà không ai đổi dòng code nào (README §3.6).</p>`,
        take: 'Đặt effort tường minh, quét trên eval của bạn, và quét lại mỗi lần đổi model.'
      }

    mount(stage) {

function randn(rnd) {

  return v.map((x) => x / n);
}
