const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

        a: `<p>Vì "giống hệt" phụ thuộc khoá gồm những gì. Câu hỏi giống hệt, nhưng nếu ShopViet vừa đổi prompt (phiên bản v8 sửa chính sách đổi trả) mà khoá không gồm phiên bản prompt, cache vẫn trả câu trả lời của v7. Ngược lại, khoá không chuẩn hoá thì cùng câu hỏi gõ từ máy Mac (dạng NFD) thành khoá khác, mất hit.</p>
<p>Hình dưới dựng khoá JSON thật và băm bằng FNV-1a 32-bit. Request cũ: câu hỏi NFC, prompt v7, đã có trong cache. Request mới: cùng câu hỏi nhưng gõ ở dạng NFD, prompt đã lên v8.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { ver: false, nfc: false, model: true };
          const fnv = (s) => { let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(s)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
          const q = 'Đổi trả trong bao lâu?';
          function key(text, ver) { const o = {}; if (st.model) o.model = 'claude-sonnet-5-5'; if (st.ver) o.prompt_version = ver; o.temperature = 0; o.question = st.nfc ? text.normalize('NFC') : text; return JSON.stringify(o); }
          function draw() {
            const k1 = key(q.normalize('NFC'), 'v7'), k2 = key(q.normalize('NFD'), 'v8'), h1 = fnv(k1), h2 = fnv(k2), hit = h1 === h2;
            out.innerHTML = '<pre class="mono" style="' + PRE + '">cũ (v7): ' + esc(k1) + '\n  hash ' + h1 + '\nmới (v8): ' + esc(k2) + '\n  hash ' + h2 + '</pre>';
            cap.innerHTML = hit ? (st.ver ? '' : '<span class="bad">Hit, nhưng trả câu trả lời viết theo prompt v7. Khách nhận chính sách đổi trả cũ (failure mode 13).</span>') : (!st.nfc ? '<span style="color:var(--warn)">Miss: hai chuỗi trông giống hệt nhưng một bên là NFD, khác byte nên khác hash. Mất một lần tiết kiệm.</span>' : '<span class="ok">Miss đúng: prompt đã đổi, câu trả lời cũ không còn dùng được.</span>');
          }
          box.append(el('div', { class: 'row' }, [check('Chuẩn hoá NFC trước khi băm', st.nfc, (v) => { st.nfc = v; draw(); }).node, check('Khoá gồm phiên bản prompt', st.ver, (v) => { st.ver = v; draw(); }).node, check('Khoá gồm model ID', st.model, (v) => { st.model = v; draw(); }).node]), out, cap);
          draw();
        },
        take: 'Khoá exact cache gồm model, phiên bản prompt, tham số, tool, dữ liệu chèn vào; chuẩn hoá NFC, khoảng trắng, thứ tự khoá JSON trước khi băm.'
      },
      {
        q: 'Sao "Đơn SV-4812 đang ở đâu?" lại gần "Đơn SV-4821 đang ở đâu?" tới 0,85? Hai đơn khác nhau mà.',
        a: `<p>Vì embedding đo hai câu <b>trông</b> giống nhau tới đâu, không đo chúng cần cùng câu trả lời không. Hai câu có 5 từ giống hệt, chỉ khác thứ tự hai chữ số. Embedding giả lập của lab (bộ ba ký tự và từ, chữ số được trọng số thấp) cho 0,85. Model embedding thật cũng có xu hướng này với mã số, tên model sản phẩm, tên thành phố: phần quyết định câu trả lời lại là phần nhỏ nhất trong câu.</p>
<p>README dẫn Zhu và cộng sự: trên một tập khó dựng từ Natural Questions, embedding có sẵn chỉ đạt AUC 0,51 (thang đo khả năng phân biệt: 0,5 là tung đồng xu, 1 là luôn đúng) khi dự đoán câu trả lời cache có dùng được không, ngang đoán ngẫu nhiên. Fine-tune embedding cho đúng việc này nâng lên 0,81, vẫn chưa gần 1.</p>
<p>Trong bảng A, "Laptop ZenBook 16 có bao nhiêu cổng USB-C?" còn gần câu cache của ZenBook 14 hơn (0,95) cả những câu diễn đạt lại đúng ý như "Đổi trả trong bao lâu vậy?" (0,78). Không có ngưỡng nào tách được hai nhóm này.</p>
<p><b>Model embedding thật còn tệ hơn ở đúng chỗ này.</b> POC chạy model embedding đa ngôn ngữ thật (paraphrase-multilingual-MiniLM-L12-v2): cặp SV-4812/SV-4821 được <b>0,981</b>, cao hơn 0,848 của bộ ba ký tự. Vì sao: model học để câu cùng cấu trúc, cùng chủ đề ra vector gần nhau, và hai câu này giống nhau ở mọi thứ trừ hai chữ số. Không có nghĩa MiniLM là model tồi: nó bắt câu diễn đạt lại tốt hơn ("Đổi trả trong bao lâu vậy?" 0,911). Nhưng không lọc gì thì ở ngưỡng 0,95 đã có 2/8 hit sai (25%). Trong hệ thống thật: không để embedding quyết định chuyện mã đơn, mã sản phẩm; tách chúng ra và lọc bằng code.</p>`,
        take: 'Gần nhau về chữ không phải cùng ý. Phần khác nhau thường là mã đơn, mã sản phẩm, địa điểm: đúng thứ quyết định câu trả lời.'
      },
      {
        q: 'Vậy đặt ngưỡng thật chặt, 0,99, là an toàn?',
        a: `<p>Không. AWS đo semantic cache trên 63.796 câu hỏi chatbot thật và các bản diễn đạt lại (SemBenchmarkLmArena, Claude 3 Haiku, ElastiCache). Ở 0,99, độ chính xác của câu trả lời từ cache là 92,1%: khoảng 8% hit vẫn sai. Từ 0,99 xuống 0,80, độ chính xác chỉ giảm từ 92,1% xuống 91,8%, còn hit rate tăng từ 23,5% lên 87,6%.</p>
<p>README tóm: ngưỡng chặt hơn giảm số hit nhiều hơn là giảm số hit sai. Hình dưới quy bảng AWS ra số hit sai trên mỗi 100 câu hỏi (tỉ lệ hit × (1 − độ chính xác)), để thấy ngưỡng chặt giảm hit sai vì giảm hit, không vì hit chính xác hơn.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          const rows = AWS.map(([t, h, a]) => ['Ngưỡng ' + dec(t, 2) + ': hit ' + pct(h, 1), h * (1 - a) * 100, t === 0.99]);
          out.append(hbars(rows, { max: Math.max(...rows.map((r) => r[1])), fmt: (v) => dec(v, 1) + ' hit sai / 100 câu' }));
          const r99 = AWS[0][1] * (1 - AWS[0][2]), r80 = AWS[3][1] * (1 - AWS[3][2]);
          cap.innerHTML = 'Từ 0,80 lên 0,99: hit sai giảm từ ' + dec(r80 * 100, 1) + ' xuống ' + dec(r99 * 100, 1) + ' mỗi 100 câu (giảm ' + pct(1 - r99 / r80) + '), nhưng hit giảm ' + pct(1 - AWS[0][1] / AWS[3][1]) + '. Tỉ lệ sai trong số hit gần như không đổi: <b>' + pct(1 - AWS[0][2], 1) + '</b> so với ' + pct(1 - AWS[3][2], 1) + '. Số liệu: AWS, README §3.4.';
          box.append(out, cap);
        },
        take: 'Ngưỡng tĩnh không cho đảm bảo nào về tỉ lệ lỗi (vCache). Đo độ chính xác của hit, không chỉ hit rate.'
      },
      {
        q: 'Thế semantic cache dùng ở đâu được?',
        a: `<p>README liệt kê điều kiện:</p>
<ul><li>Câu trả lời <b>ổn định và giống nhau cho mọi người hỏi</b>: FAQ, hướng dẫn sản phẩm. Không phụ thuộc dữ liệu riêng hay thời điểm. "Phí giao nội thành Hà Nội" đạt; "Đơn SV-4821 ở đâu" không đạt cả hai: dữ liệu riêng, và trạng thái đổi theo giờ.</li>
<li>Câu sai có hậu quả nhỏ, hoặc có bước kiểm tra sau.</li>
<li><b>Lọc metadata</b> trước khi so: chỉ so với câu cùng sản phẩm, danh mục, ngôn ngữ. Bật "Lọc metadata" trong phần A: các hit sai SV-4812, ZenBook 16, TP.HCM, Thủ Đức biến mất. Hai hit sai còn lại ("Hoàn tiền được không?", "Trả góp có cần thẻ tín dụng?") khác ý mà không khác metadata, nên bộ lọc không bắt được. Với embedding thật (MiniLM trong POC), lọc thực thể + không cache câu có mã đơn vẫn để lọt một hit sai ở ngưỡng 0,90: "Đổi trả trong bao lâu vậy?" nhận câu trả lời về thời gian <i>hoàn tiền</i> (0,911). Câu này không có mã, tên sản phẩm hay thành phố nào để lọc; chỉ lấy mẫu chấm hit mới phát hiện được.</li>
<li>Hội thoại nhiều lượt: embed câu hỏi hiện tại cộng thông tin chính, không embed nguyên đoạn hội thoại.</li>
<li>Đo độ chính xác của hit trên traffic thật: lấy mẫu hit, chấm bằng người hoặc LLM judge.</li></ul>
<p>Không dùng cho tài khoản, đơn hàng, số dư, trạng thái; pháp lý, y tế, tài chính; bất cứ thứ gì sai thì phải bồi thường. vCache đi xa hơn: học ngưỡng riêng cho từng câu trong cache để giữ tỉ lệ lỗi dưới mức đặt trước.</p>`,
        take: 'Semantic cache cho FAQ, có lọc metadata, có lấy mẫu chấm hit. Đơn hàng và dữ liệu riêng thì không bao giờ.'
      },
      {
        q: 'ShopViet đã có rate limit 60 request mỗi phút mỗi user. Sao README nói chưa đủ?',

      },
      {
        q: 'Sao phải "giữ chỗ" trước khi gọi? Kiểm "đã tiêu" rồi cộng sau là đủ chứ?',
        a: `<p>Không đủ khi có request đồng thời. Chi phí thật chỉ biết sau khi request xong. Trong lúc một request đắt đang chạy, "đã tiêu" chưa tăng, nên request khác của cùng user nhìn thấy số cũ và lọt qua. Script gửi 10 request cùng lúc thì cả 10 đều thấy "đã tiêu 0".</p>
<p>README test 4: hạn mức 1 USD, đã tiêu 0,10 USD, một request đang giữ chỗ 0,80 USD. Request mới cần 0,20 USD. Chỉ đếm "đã tiêu": 0,10 + 0,20 = 0,30, cho qua, tổng có thể tới 1,10 USD. Đếm cả giữ chỗ: 0,10 + 0,80 + 0,20 = 1,10, vượt hạn mức, ném BudgetExceeded.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { lim: 1, spent: 0.1, hold: 0.8, need: 0.2 };
          function draw() {
            const a = st.spent + st.need <= st.lim + 1e-9, b = st.spent + st.hold + st.need <= st.lim + 1e-9;
            out.innerHTML = '<div class="tbl"><table><tr><th>Cách kiểm</th><th>Phép tính</th><th>Kết quả</th></tr><tr><td>Chỉ đếm đã tiêu</td><td class="mono">' + dec(st.spent) + ' + ' + dec(st.need) + ' = ' + dec(st.spent + st.need) + (a ? ' ≤ ' : ' &gt; ') + dec(st.lim) + '</td><td class="' + (a ? 'ok' : 'bad') + '">' + (a ? 'cho qua' : 'chặn') + '</td></tr><tr><td>Đếm cả giữ chỗ</td><td class="mono">' + dec(st.spent) + ' + ' + dec(st.hold) + ' + ' + dec(st.need) + ' = ' + dec(st.spent + st.hold + st.need) + (b ? ' ≤ ' : ' &gt; ') + dec(st.lim) + '</td><td class="' + (b ? 'ok' : 'bad') + '">' + (b ? 'cho qua' : 'BudgetExceeded') + '</td></tr></table></div>';
            cap.innerHTML = a && !b ? '<span class="bad">Hai cách cho kết quả khác nhau. Cách chỉ đếm đã tiêu cho qua, tổng có thể tới ' + usd(st.spent + st.hold + st.need) + ', vượt hạn mức ' + usd(st.lim) + '.</span>' : 'Hai cách cùng kết quả ở cấu hình này. Kéo "đang giữ chỗ" lên để thấy chỗ khác.';

          box.append(el('div', { class: 'row' }, [slider('Hạn mức', 0.5, 5, 0.1, st.lim, (v) => { st.lim = v; draw(); }, (v) => dec(v, 1)).node, slider('Đã tiêu', 0, 2, 0.05, st.spent, (v) => { st.spent = v; draw(); }).node, slider('Đang giữ chỗ', 0, 2, 0.05, st.hold, (v) => { st.hold = v; draw(); }).node, slider('Request mới cần', 0.05, 1, 0.05, st.need, (v) => { st.need = v; draw(); }).node]), out, cap);

        take: 'Giữ chỗ chi phí tối đa trước khi gọi, trong cùng khoá (lock hoặc lệnh nguyên tử) với bước kiểm hạn mức.'

      {
        q: 'Chi phí tối đa của một request chưa gửi tính thế nào? Chưa biết output dài bao nhiêu mà.',

<p>Hai test của README để đối chiếu: Sonnet 5.5, 10.000 input ghi cache 5 phút, max_tokens 4.000 ra 0,065 USD; không cache ra 0,06 USD. Haiku 5.5: prompt 101.000 token dùng giá prompt dài; 99.000 token dùng giá thường dù cộng max_tokens thì vượt 100.000, vì ngưỡng chỉ tính trên prompt.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { m: 'sonnet', inp: 10000, mt: 4000, w: 1.25 };
          const P = { sonnet: { in: 2, out: 10 }, opus: { in: 4, out: 20 }, fable: { in: 10, out: 50 }, haiku: { in: 0.10, out: 0.50, long: { in: 0.50, out: 2.50 } } };

      {
        q: 'Request lỗi giữa chừng thì ghi bao nhiêu vào hạn mức? Và spend limit của workspace để làm gì nữa?',
        a: `<p>Theo code trong README: lỗi <b>4xx</b> nghĩa là request bị từ chối khi kiểm tra, không có usage, ghi 0. Lỗi <b>5xx</b>, timeout phía client sau khi request đã tới provider, hay stream đứt giữa chừng: có thể đã bị tính tiền (stream đứt vẫn tính phần đã sinh), nên giữ nguyên phần giữ chỗ, rồi đối soát với Usage and Cost API. Exception không gán chi phí thì tính đủ phần giữ chỗ.</p>
<p>Spend limit của workspace vẫn cần, nhưng là chốt chặn cuối cho cả nhóm, không phải công cụ theo user. Claude: hạn mức tự đặt trả 400, trần của bậc tài khoản trả 429 không có retry-after. Cả hai nghĩa là mọi request của workspace dừng, như ShopViet chiều hôm đó. Phần B mở đầu đúng ở sự cố đó; bật "Hạn mức đô la theo user" để thấy khác biệt.</p>
<p>Cuối cùng là phát hiện: input dài bất thường, nội dung gần giống nhau gọi liên tục, prompt ép viết dài, tài khoản dùng thử hết hạn mức ngay ngày đầu. Cảnh báo theo chi phí mỗi user mỗi giờ so với phân phối bình thường bắt được phần lớn trước khi hoá đơn tới.</p>`,
        take: 'Không biết chắc đã tính tiền chưa thì giữ phần giữ chỗ. Ba lớp: giới hạn input, hạn mức đô la theo user, spend limit workspace.'

    poc: {

function randn(rnd) {

}
