const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

            const rnd = seeded(7), N = 1000, waves = Math.ceil(N / st.c), cells = [];
            let t = 0, last = -Infinity, hits = 0, done = 0;
            for (let i = 0; i < waves; i++) {
              const size = Math.min(st.c, N - done), alive = i > 0 && t - last <= st.ttl;
              if (alive) hits += size;
              cells.push({ size, alive, first: i === 0 });
              done += size; last = t + 1; t += 1 + (-Math.log(1 - rnd() * 0.999) * st.gap);
            }
            const W = 600, H = 60, bw = W / waves;
            out.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Đợt hit và miss trong batch' }, cells.map((c, i) => el('rect', { x: i * bw + 0.5, y: 6, width: Math.max(1, bw - 1), height: H - 12, rx: 2, fill: c.alive ? 'var(--ok)' : c.first ? 'var(--warn)' : 'var(--bad)', opacity: 0.85 }))));
            const r = hits / N;
            cap.innerHTML = 'Xanh: đợt đọc cache. Vàng: đợt đầu, chưa có cache. Đỏ: cache hết hạn vì nghỉ quá TTL. ' + waves + ' đợt, ' + dec(t, 0) + ' phút. Tỉ lệ hit: <b class="' + (r < 0.6 ? 'bad' : 'ok') + '">' + pct(r) + '</b>' + (r < 0.6 ? '. Với tỉ lệ này, prefix bị ghi lại (1,25 lần giá input) ở phần lớn request, nên batch tiết kiệm ít hơn 50% so với chạy đồng bộ có cache ấm.' : '.') + (st.ttl === 5 && st.gap > 4 ? ' Thử TTL 1 giờ: README khuyên cân nhắc vì batch có thể chạy lâu hơn 5 phút. Nhớ rằng TTL 1 giờ ghi 2 lần giá input (5 phút: 1,25 lần), nên nó chỉ đáng khi biến đợt đỏ thành xanh.' : '');
          }
          box.append(el('div', { class: 'row' }, [slider('Request mỗi đợt (giả định)', 10, 500, 10, st.c, (v) => { st.c = v; draw(); }).node, slider('Nghỉ giữa hai đợt, phút (giả định)', 0, 30, 1, st.gap, (v) => { st.gap = v; draw(); }).node, select('TTL', [['5', '5 phút'], ['60', '1 giờ']], '5', (v) => { st.ttl = +v; draw(); }).node]), out, cap);
          draw();
        },
        take: 'Batch rẻ hơn ít hơn dự tính khi cache không kịp ấm hoặc hết hạn giữa các đợt (failure mode 4). Đặt cache_control giống hệt nhau, đo hit trong usage của kết quả batch, và chỉ giữ TTL 1 giờ (ghi 2 lần) nếu hit tăng đủ bù phần ghi đắt hơn.'

      {
        q: 'Lô hết hạn sau 24 giờ thì sao? Có mất tiền không?',
        a: `<p>Có thể có. OpenAI: request chưa xong bị huỷ và ghi vào error file, request đã xong <b>vẫn tính tiền</b>. Claude: batch không xong trong 24 giờ thì hết hạn. Job tóm tắt của ShopViet phải đọc kết quả theo <code>custom_id</code>, tìm những hội thoại chưa có bản tóm tắt, và gửi lại chúng trong lô sau. Không được gửi lại cả lô: phần đã xong sẽ bị trả tiền hai lần.</p>
<p>Giới hạn kích thước cũng cần tính trước. Job gán nhãn 120.000 đánh giá mỗi tuần vượt 100.000 request của Claude và 50.000 của OpenAI, nên phải chia lô. Hình chính cảnh báo khi một lô vượt giới hạn của provider bạn chọn.</p>

      {
        q: 'Batch rồi. Sao không đổi luôn sang model nhỏ cho job gán nhãn đánh giá?',
        a: `<p>Nên thử, và README xếp nó là cách đầu tiên trong ba cách dùng model nhỏ, vì rẻ công nhất: dùng model nhỏ với prompt tốt. Anthropic khuyên thử Haiku 5.5 trước cho tác vụ khối lượng lớn mà output kiểm tra được. Trên GPQA Diamond (bộ câu hỏi khoa học khó dùng để so model, điểm là % câu đúng), Haiku 5.5 đạt 85% so với 91% của Opus 5.5 và Sonnet 5.5, với chi phí mỗi câu đúng khoảng một phần hai mươi Opus 5.5 và một phần mười Sonnet 5.5.</p>
<p>Gán nhãn đánh giá ("tích cực / tiêu cực / khiếu nại giao hàng") đúng là loại hợp: phân loại, output ngắn, kiểm tra được bằng một tập nhãn tay. Không hợp với agent loop dài như agent đối soát.</p>

      {
        q: 'GPU thuê theo giờ, giá mỗi token ở tải đầy rẻ hơn API. Sao README nói biến quyết định là hệ số sử dụng?',
        a: `<p>Vì GPU tính tiền cả khi rảnh. Traffic chat của ShopViet theo giờ trong ngày: gần 0 lúc 3 giờ sáng, cao nhất lúc 20–21 giờ. Số máy phải đủ cho giờ cao điểm (và ít nhất hai máy để không sập khi một máy lỗi), nên phần lớn thời gian máy chạy dưới sức.</p>

<ul><li><b>Throughput phụ thuộc tải.</b> Con số benchmark đo ở batch lớn; batch lớn làm mỗi request chậm. Phải đo ở độ trễ chấp nhận được, với độ dài prompt và output thật (output tốn GPU hơn input nhiều, README §1.3).</li>

    poc: {

      file: "docs/cost-optimization/pocs/04_batch_small_selfhost.py",
      run: "uv run docs/cost-optimization/pocs/04_batch_small_selfhost.py",
      needs: "chỉ <code>uv</code> và CPU, miễn phí, không gọi model.",
      output: "Thật: phép tính giá README §2.1/§2.3; dải cache hit 30–98% trong batch là số README trích từ Anthropic.\nGIẢ ĐỊNH (lab 04): khối lượng 7 việc, cache hit đồng bộ 80%, giá GPU, throughput, chi phí vận hành, hồ sơ traffic 24 giờ.\n\n== Việc nào chuyển sang Batch API (Sonnet 5.5, cache hit 80% cả hai phía) ==\nViệc                        Đồng bộ/tháng  Batch/tháng\n--------------------------  -------------  ----------------------\nChat hỗ trợ web             2.244 USD      không: khách chờ\nGợi ý cho CSKH              434 USD        không: nhân viên chờ\nTóm tắt cuối ngày           2.661 USD      1.330 USD\nGán nhãn đánh giá           574 USD        287 USD\nEval hằng tuần              69 USD         35 USD\nMô tả 15.000 sản phẩm       109 USD        54 USD\nAgent đối soát (tool loop)  143 USD        không: nhiều lượt tool\nTổng: 6.235 USD → 4.528 USD (−27,4%), không phải −50%: hai việc lớn nhất cần người chờ.\n\n== Cache hit trong batch là best effort: 1.000 lần chạy eval (6.000 prefix), hit ~ đều trong 30–98% (dải README) ==\nCấu hình                 Tiết kiệm p5  p50    p95\n-----------------------  ------------  -----  -----\nSonnet, TTL 5m           12,0%         37,7%  62,5%\nSonnet, TTL 1h (ghi 2×)  -22,2%        19,7%  60,0%\nGemini 3.5 Flash-Lite    26,1%         39,4%  52,2%\nSo với đồng bộ có hit 80%. Gemini: cache hit trong batch tính theo giá cache thường, nên phần giảm 50% chỉ áp lên phần chưa hit.\n\n== Self-host (GIẢ ĐỊNH: GPU 2,50 + vận hành 1,00 USD/giờ; mỗi GPU 20.000 token input/s, 1.500 token output/s ở độ trễ chấp nhận được) ==\nKhối lượng gốc: 4,56 tỉ token/tháng; hồ sơ 24 giờ của lab 04 (giờ cao điểm gấp 2,1 trung bình).\nTraffic  GPU (tối thiểu 2)  Hệ số sử dụng  Self-host/tháng  API Sonnet 5.5  API Sonnet 5.5 + batch  API Haiku 5.5\n-------  -----------------  -------------  ---------------  --------------  ----------------------  -------------\n×1       2                  7%             5.110 USD        6.235 USD ✓     4.528 USD               324 USD\n×3       2                  20%            5.110 USD        18.705 USD ✓    13.585 USD ✓            973 USD\n×10      3                  44%            7.665 USD        62.350 USD ✓    45.282 USD ✓            3.242 USD\n×30      9                  44%            22.995 USD       187.049 USD ✓   135.847 USD ✓           9.726 USD\n×100     28                 47%            71.540 USD       623.498 USD ✓   452.824 USD ✓           32.419 USD\n✓ = self-host rẻ hơn lựa chọn API đó. Chưa tính người trực, nâng cấp, và chất lượng model open-weight (README §2.5).\n\nRút ra: batch chỉ giảm phần việc không ai chờ (ở đây −27%, không phải −50%), và mức giảm dao động theo cache hit của batch;\nTTL 1h chỉ đáng khi nó thật sự nâng hit, ở cùng hit nó đắt hơn vì ghi 2×. GPU tính tiền cả giờ rảnh: hồ sơ 24 giờ lệch nên\nhệ số sử dụng dưới 50% dù đã chia theo giờ cao điểm; self-host không lần nào thắng Haiku 5.5, và thắng Sonnet chỉ khi chất lượng ngang nhau.",
      measured: true,
      read: ["<b>Đo vs giả định:</b> script không gọi model. Phần \"thật\" là phép tính theo bảng giá README và dải hit 30–98%; khối lượng 7 việc, hit đồng bộ 80%, giá GPU, throughput, vận hành và hồ sơ 24 giờ là giả định. Con số 27,4% hay 7% đúng cho giả định này, không phải số đo của một hệ thống thật.", "<b>Tổng chỉ giảm 27,4%, không phải 50%.</b> Vì sao: 50% chỉ áp lên việc chuyển được; chat (2.244 USD) và gợi ý CSKH (434 USD) có người chờ, agent đối soát (143 USD) có tool loop, ba việc này giữ giá đồng bộ. Không có nghĩa batch giảm kém: mỗi việc chuyển được vẫn giảm 50%. Trong hệ thống thật: đếm tiền của việc \"không ai chờ\" trước khi hứa con số tiết kiệm.", "<b>TTL 1h có thể làm batch đắt hơn đồng bộ</b> (p5 −22%, so với TTL 5m p5 +12%). Vì sao: script cho hai cấu hình cùng một dải hit 30–98%; TTL 1h ghi prefix 2 lần giá input thay vì 1,25, nên mỗi lần miss đắt hơn mà không có thêm lần hit nào. Không có nghĩa TTL 1h sai: README khuyên cân nhắc vì batch có thể chạy quá 5 phút, và nếu nó đưa hit từ 40% lên 90% thì đáng. Trong hệ thống thật: chạy thử một lô với mỗi TTL, đọc cache_read_input_tokens trong kết quả, chỉ giữ TTL 1h khi hit tăng thật.", "Self-host: hệ số sử dụng 7% ở traffic gốc, dưới 50% ở mọi mức; không lần nào rẻ hơn Haiku 5.5."]
    },
    mount(stage) {
      const st = { model: 'sonnet', rt: 0.9, bh: 0.6, mode: Object.fromEntries(WL.map((w) => [w.id, false])), G: 2.5, ops: 3, T: 5, scope: 'all' };
      const tblBox = el('div', { style: 'overflow-x:auto' }), barBox = el('div'), statA = el('div', { class: 'stat' }), flagsA = el('div'), capA = el('div', { class: 'qa-viz' });
      const chartB = el('div'), statB = el('div', { class: 'stat' }), tblB = el('div', { style: 'overflow-x:auto' }), flagsB = el('div'), capB = el('div', { class: 'qa-viz' });
      const cells = {};
      const tbl = el('table', { style: 'border-collapse:collapse;font-size:12.5px;width:100%;min-width:640px' });
      tbl.append(el('tr', { style: 'background:var(--bg)' }, ['Việc', 'Ai chờ?', 'Request/tháng', 'Token/request (prefix + riêng + ra)', 'Batch', 'Đồng bộ/tháng', 'Theo lựa chọn'].map((h) => el('th', { text: h, style: 'text-align:left;padding:5px 7px;border:1px solid var(--line)' }))));
      WL.forEach((w) => {
        const cb = check('', false, (v) => { st.mode[w.id] = v; render(); });
        const td = (k, t) => { const c = el('td', { style: 'padding:5px 7px;border:1px solid var(--line)', html: t || '' }); if (k) cells[w.id + k] = c; return c; };
        const r = el('tr', {}, [td('', w.name), td('', w.wait), td('', int(w.n)), td('', '<span class="mono">' + int(w.pre) + ' + ' + int(w.v) + ' + ' + int(w.out) + '</span>'), el('td', { style: 'padding:5px 7px;border:1px solid var(--line)' }, [cb.node]), td('rt'), td('ch')]);
        cells[w.id + 'row'] = r;
        tbl.append(r);
      });
      tblBox.append(tbl);

      function planA() {
        let before = 0, after = 0, moved = 0, tokAll = 0, tokB = 0, costB = 0, tokRt = 0, costRt = 0;
        const rows = WL.map((w) => {
          const rt = w.n * reqCost(w, st.model, false, st.rt), wantB = st.mode[w.id], ok = wantB && !w.waits && !w.loop;
          const ch = ok ? w.n * reqCost(w, st.model, true, st.bh) : rt;
          before += rt; after += ch; tokAll += toks(w);
          if (ok) moved += toks(w);
          if (w.waits) { tokRt += toks(w); costRt += ch; } else { tokB += toks(w); costB += ch; }
          return { w, rt, ch, wantB, ok };
        });
        return { rows, before, after, moved, tokAll, tokB, costB, tokRt, costRt };
      }

      function render() {
        const A = planA(), m = MODELS[st.model];
        A.rows.forEach((r) => {
          cells[r.w.id + 'rt'].textContent = usd(r.rt);
          cells[r.w.id + 'ch'].innerHTML = r.wantB && !r.ok ? '<span class="bad">không batch được</span>' : (r.ok ? '<b>' + usd(r.ch) + '</b> <span class="' + (r.ch / r.rt > 0.65 ? 'bad' : 'ok') + '">(' + pct(r.ch / r.rt) + ')</span>' : usd(r.ch));
          cells[r.w.id + 'row'].style.background = r.wantB && !r.ok ? 'var(--bg)' : r.ok ? 'var(--accent-soft)' : '';
        });
        barBox.replaceChildren(hbars([['Tất cả đồng bộ', A.before, false], ['Theo lựa chọn', A.after, true]], { max: A.before, fmt: usd }));
        statA.innerHTML = '<span>Model: <b>' + m.name + '</b></span><span>Tiết kiệm <b class="' + (A.before - A.after > 0 ? 'ok' : '') + '">' + usd(A.before - A.after) + '</b>/tháng (' + pct((A.before - A.after) / A.before) + ')</span><span>Token chuyển sang batch <b>' + pct(A.moved / A.tokAll) + '</b></span><span>Tổng token <b>' + int(A.tokAll / 1e6) + 'M</b>/tháng</span>';

        const fl = []; let c = null;
        A.rows.forEach((r) => {
          if (r.wantB && r.w.waits) { fl.push(['bad', r.w.name + ': có người chờ. Batch phần lớn xong dưới 1 giờ, hạn chót 24 giờ; lab không tính phần tiết kiệm này.']); c = c || { what: r.w.name + ' được đánh dấu batch nhưng lab giữ giá đồng bộ.', why: 'Batch không trả kết quả ngay: Claude phần lớn xong dưới 1 giờ, hết hạn sau 24 giờ; OpenAI completion_window chỉ nhận 24h.', not: 'Không có nghĩa việc này không tối ưu được: cache prefix, rút ngắn prompt và câu trả lời vẫn áp dụng.', real: 'phân loại việc theo "có ai chờ không" trước khi chọn cách gọi API.' }; }
          if (r.wantB && r.w.loop) { fl.push(['bad', r.w.name + ': batch là một lượt, không có tool loop giữa chừng. Muốn batch phải lấy trước dữ liệu tool và nén thành một request, tức đổi kiến trúc và phải eval lại.']); c = c || { what: 'Agent đối soát không ai chờ, nhưng vẫn không batch được.', why: 'Mỗi lượt của agent cần kết quả tool của lượt trước. Một request trong batch chỉ có một lượt model.', not: 'Không có nghĩa agent buộc phải trả giá đồng bộ mãi: nếu dữ liệu tool lấy trước được thì gộp thành một request rồi batch.', real: 'thiết kế lại thành "lấy dữ liệu trước, gọi model một lần"; đo lại chất lượng vì model suy luận khác đi.' }; }
          if (r.ok && r.ch > r.rt) fl.push(['bad', r.w.name + ': batch <b>đắt hơn</b> chạy đồng bộ (' + pct(r.ch / r.rt) + '). Prefix ' + int(r.w.pre) + ' token: đồng bộ đọc cache ' + pct(st.rt) + ' số lần, batch chỉ ' + pct(st.bh) + ', nên phần lớn request trong batch trả 1,25 lần giá input cho prefix.']);
          if (r.ok && r.ch / r.rt > 0.65) { fl.push(['warn', r.w.name + ': batch chỉ còn ' + pct(r.ch / r.rt) + ' giá đồng bộ, không phải 50%. Cache hit trong batch ' + pct(st.bh) + ' so với ' + pct(st.rt) + ' khi chạy đồng bộ, nên prefix ' + int(r.w.pre) + ' token bị ghi lại ở nhiều request hơn.']); c = c || { what: r.w.name + ': batch rẻ hơn ít hơn dự tính (' + pct(1 - r.ch / r.rt) + ' thay vì 50%).', why: 'Đồng bộ đọc prefix từ cache ' + pct(st.rt) + ' số lần với giá đọc ' + dec(m.cr, 2) + ' USD/1M. Batch chỉ hit ' + pct(st.bh) + ', phần còn lại ghi cache với ' + dec(m.in * m.w, 2) + ' USD/1M. Nửa giá của một số lớn hơn có thể gần bằng giá đủ của một số nhỏ.', not: 'Không có nghĩa batch vô ích: tăng hit trong batch thì mức giảm về gần 50%.', real: 'cache_control giống hệt nhau ở mọi request, TTL 1 giờ, đọc cache_read_input_tokens trong kết quả batch (failure mode 4).' }; }
          if (r.ok && m.lim && r.w.job > m.lim) fl.push(['warn', r.w.name + ': một lần chạy ' + int(r.w.job) + ' request vượt giới hạn ' + int(m.lim) + ' request mỗi batch của ' + (m.lim === 50000 ? 'OpenAI' : 'Claude') + '. Chia thành ' + Math.ceil(r.w.job / m.lim) + ' lô.']);
          if (r.ok && m.gem) fl.push(['ok', r.w.name + ' (Gemini): batch giảm 50% phần không cache; cache hit tính theo giá context caching thường.' + (r.w.pre < 4096 ? ' Prefix ' + int(r.w.pre) + ' token dưới ngưỡng implicit cache 4.096 nên không có cache hit.' : '')]);
        });
        if (!A.rows.some((r) => r.ok)) fl.push(['ok', 'Chưa có việc nào chạy batch. Đánh dấu cột Batch cho các việc "không ai chờ".']);
        flagsA.replaceChildren(...fl.map(([l, t]) => flagBox(l, t)));
        if (!c) c = A.after < A.before ? { what: 'Hoá đơn giảm ' + usd(A.before - A.after) + ' mỗi tháng (' + pct((A.before - A.after) / A.before) + ').', why: 'Mỗi việc chuyển sang batch trả 50% mọi token (Claude, OpenAI cộng dồn với cache).', not: 'Không có nghĩa tổng hoá đơn giảm một nửa: chat có người chờ vẫn ở giá đồng bộ, và nó thường là phần lớn nhất.', real: 'đòn bẩy tiếp theo cho chat là cache, rút prompt, rút câu trả lời (Lab 05).' } : { what: 'Hoá đơn ' + usd(A.before) + ' mỗi tháng, chưa batch gì.', why: 'Mọi việc đang trả giá đồng bộ, kể cả việc không ai chờ.', not: 'Số request và token là giả định; thay bằng số đo từ usage của bạn.', real: 'liệt kê việc không ai chờ: eval, gán nhãn, tóm tắt đêm, backfill (README §2.3).' };
        capA.innerHTML = capHtml(c);
        renderB(A);
      }

      function renderB(A) {
        const scopeTok = st.scope === 'all' ? A.tokAll : A.tokB, scopeCost = st.scope === 'all' ? A.after : A.costB;
        const rtTok = st.scope === 'all' ? A.tokRt : 0, bTok = scopeTok - rtTok;
        const pAvg = PROFILE.reduce((s, v) => s + v, 0) / 24, pk = Math.max(...PROFILE) / pAvg;
        const rtAvgH = rtTok / 1e6 / HOURS, bAvgH = bTok / 1e6 / HOURS, need = Math.max(rtAvgH * pk * 1.2, rtAvgH + bAvgH);
        const N = Math.max(2, Math.ceil(need / st.T)), capH = N * st.T, u = (rtAvgH + bAvgH) / capH, hourly = N * st.G + st.ops;
        const self = (x) => hourly / (capH * x);
        const inShare = st.scope === 'all' ? WL.reduce((s, w) => s + w.n * (w.pre + w.v), 0) / A.tokAll : WL.filter((w) => !w.waits).reduce((s, w) => s + w.n * (w.pre + w.v), 0) / A.tokB;
        const blend = (k, b) => (inShare * MODELS[k].in + (1 - inShare) * MODELS[k].out) * (b ? 0.5 : 1);
        const opts = [['Kế hoạch phần A (' + MODELS[st.model].name + ', có cache)', scopeCost / (scopeTok / 1e6), 'var(--accent)'], ['Claude Haiku 5.5, không cache', blend('haiku'), 'var(--g2)'], ['Claude Haiku 5.5, batch', blend('haiku', true), 'var(--g3)'], ['gpt-6-luna, không cache', blend('luna'), 'var(--g4)'], ['Gemini 3.5 Flash-Lite, không cache', blend('lite'), 'var(--g1)']];
        const W = 640, H = 220, L = 54, R = 10, T = 10, B = 26, lo = 0.01, hi = 100;
        const x = (v) => L + (v - 0.05) / 0.95 * (W - L - R), y = (v) => T + (1 - (Math.log10(Math.min(hi, Math.max(lo, v))) + 2) / 4) * (H - T - B);
        const pts = []; for (let i = 0; i <= 60; i++) { const uu = 0.05 + 0.95 * i / 60; pts.push((i ? 'L' : 'M') + x(uu).toFixed(1) + ' ' + y(self(uu)).toFixed(1)); }
        const ux = Math.min(1, Math.max(0.05, u));
        chartB.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Hoà vốn self-host theo hệ số sử dụng' }, [
          ...[0.01, 0.1, 1, 10, 100].map((v) => el('g', {}, [el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--line)' }), el('text', { x: 2, y: y(v) + 4, class: 'mute', text: dec(v, v < 1 ? 2 : 0) })])),
          ...opts.map(([, p, col]) => el('line', { x1: L, x2: W - R, y1: y(p), y2: y(p), stroke: col, 'stroke-width': 1.5, 'stroke-dasharray': '5 3' })),
          el('path', { d: pts.join(' '), fill: 'none', stroke: 'var(--bad)', 'stroke-width': 2.2 }),
          el('line', { x1: x(ux), x2: x(ux), y1: T, y2: H - B, stroke: 'var(--ink)', 'stroke-width': 1.2 }),
          el('text', { x: Math.min(x(ux) + 4, W - 150), y: T + 12, text: 'ShopViet: ' + pct(u) }),
          ...[0.05, 0.25, 0.5, 0.75, 1].map((v) => el('text', { x: x(v) - 10, y: H - 8, class: 'mute', text: pct(v) })),
          el('text', { x: W - R - 170, y: y(self(1)) - 6, fill: 'var(--bad)', text: 'self-host: ' + usd(self(1)) + ' ở 100%' })]));
        const rows = opts.map(([name, p, col]) => { const be = hourly / (capH * p); return '<tr><td><span style="display:inline-block;width:12px;height:3px;background:' + col + ';vertical-align:middle;margin-right:6px"></span>' + name + '</td><td class="mono">' + usd(p) + '</td><td class="mono ' + (be > 1 ? 'bad' : be > u ? '' : 'ok') + '">' + (be > 1 ? 'trên 100% (' + pct(be) + ')' : pct(be)) + '</td></tr>'; }).join('');
        tblB.innerHTML = '<table style="border-collapse:collapse;font-size:12.5px;width:100%;min-width:480px"><tr style="background:var(--bg)"><th>So với</th><th>USD / 1M token</th><th>Self-host cần bận</th></tr>' + rows + '</table>';
        statB.innerHTML = '<span>Máy cần <b>' + N + '</b>' + (Math.ceil(need / st.T) < 2 ? ' (tối thiểu 2 để dự phòng)' : '') + '</span><span>Năng lực <b>' + dec(capH, 1) + 'M</b> token/giờ</span><span>Trung bình cần <b>' + dec(rtAvgH + bAvgH, 1) + 'M</b>/giờ</span><span>Self-host <b>' + usd(hourly * HOURS) + '</b>/tháng</span><span>API (phần A) <b>' + usd(scopeCost) + '</b>/tháng</span>';
        const plan = opts[0][1], beP = hourly / (capH * plan), cheapest = opts.reduce((a, b) => (b[1] < a[1] ? b : a));
        const fl = []; let c;
        if (beP > 1) { fl.push(['bad', 'So với kế hoạch phần A, self-host cần bận ' + pct(beP) + ': không bao giờ hoà vốn, kể cả khi GPU chạy liên tục ở tải đầy.']); c = { what: 'Ngay ở 100% thời gian bận, self-host vẫn đắt hơn API (' + usd(self(1)) + ' so với ' + usd(plan) + ' mỗi 1M token).', why: 'Giá API hiệu quả đã thấp nhờ cache đọc prefix với ' + dec(MODELS[st.model].cr, 2) + ' USD/1M' + (A.moved ? ' và batch giảm nửa giá' : '') + '. Self-host trả (giá GPU × ' + N + ' máy + vận hành) mỗi giờ dù có request hay không.', not: 'Không có nghĩa self-host luôn đắt: throughput cao hơn hoặc GPU rẻ hơn sẽ đổi kết quả. Số GPU, throughput, vận hành là giả định.', real: 'đo throughput ở độ trễ chấp nhận được, với prompt và output thật, rồi so với giá API sau cache và batch, không với giá niêm yết.' }; }
        else if (u < beP) { fl.push(['warn', 'Hoà vốn cần ' + pct(beP) + ' nhưng traffic ShopViet chỉ cho ' + pct(u) + '. Self-host đắt hơn ' + dec(beP / u, 1) + ' lần.']); c = { what: 'Self-host rẻ hơn API ở tải đầy, nhưng đắt hơn ở hệ số sử dụng thật (' + pct(u) + ').', why: 'Số máy phải đủ cho giờ cao điểm (gấp ' + dec(pk, 1) + ' lần trung bình theo hồ sơ giả định) cộng 20% dư, và tối thiểu hai máy. Ngoài giờ cao điểm máy rảnh nhưng vẫn tính tiền.', not: 'Không có nghĩa con số benchmark sai: nó đúng ở tải đầy, chỉ là traffic thật không đầy.', real: 'chọn phạm vi "chỉ việc không ai chờ": job xếp lịch đều được nên hệ số sử dụng cao hơn; hoặc ở lại API.' }; }
        else { fl.push(['ok', 'Hệ số sử dụng ' + pct(u) + ' vượt điểm hoà vốn ' + pct(beP) + ' so với kế hoạch phần A.']); c = { what: 'Self-host rẻ hơn kế hoạch API ở cấu hình này.', why: 'Traffic đủ lớn và đều để ' + N + ' máy bận ' + pct(u) + ' thời gian.', not: 'Không có nghĩa nên chuyển ngay: lab chưa tính chất lượng model open-weight (có thể cần prompt dài hơn, nhiều lượt hơn, sai nhiều hơn).', real: 'so theo chi phí mỗi tác vụ hoàn thành trên eval; cộng chi phí nâng cấp model, driver, trực sự cố.' }; }
        if (cheapest[1] < plan && hourly / (capH * cheapest[1]) > Math.max(u, beP)) fl.push(['warn', 'API cũng có tier rẻ: ' + cheapest[0] + ' chỉ ' + usd(cheapest[1]) + ' mỗi 1M token, self-host cần bận ' + pct(hourly / (capH * cheapest[1])) + ' để thắng. Đổi model API (sau eval) có thể rẻ hơn mọi phương án GPU.']);
        if (Math.ceil(need / st.T) < 2) fl.push(['warn', 'Nhu cầu vừa một máy, nhưng dự phòng cần hai: một nửa năng lực trả tiền chỉ để không sập.']);

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
