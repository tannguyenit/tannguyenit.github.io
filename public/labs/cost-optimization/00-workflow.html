const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const vn = (x, d = 0) => Number(x).toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const usd = (x, d) => '$' + vn(x, d ?? (Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 1 ? 2 : 4));
  const pct = (x, d = 1) => vn(x * 100, d) + '%';
  const note = (color, html) => `<div style="border-left:3px solid ${color};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px;font-size:13.5px">${html}</div>`;
  const TH = 'style="text-align:left;padding:6px 9px;border:1px solid var(--line);background:var(--bg)"';
  const TD = 'style="text-align:left;padding:6px 9px;border:1px solid var(--line);vertical-align:top"';
  const table = (head, rows) => `<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%;min-width:520px"><tr>${head.map((h) => `<th ${TH}>${h}</th>`).join('')}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td ${TD}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

  const PRICE = {
    sonnet: { name: 'Sonnet 5.5', in: 2, out: 10, read: 0.10 },
    haiku: { name: 'Haiku 5.5', in: 0.10, out: 0.50, read: 0.01 }
  };
  const W5 = 1.25;
  const SEM = [
    ['0.99', 0.235, 0.921, 0.158], ['0.95', 0.560, 0.926, 0.519], ['0.90', 0.745, 0.923, 0.725],
    ['0.80', 0.876, 0.918, 0.846], ['0.75', 0.903, 0.912, 0.863], ['0.50', 0.943, 0.875, 0.880]
  ];
  const A = {
    convs: 300000, turns: 8, prefix: 6000, trimPrefix: 4000, user: 100, ans: 300, shortAns: 183,
    abuseSessions: 3000, abuseTurns: 40,
    sumJobs: 600000, sumIn: 6000, sumOut: 400,
    intentCalls: 2400000, intentIn: 1500, intentOut: 15,
    faq: 900000, faqPrefix: 2800, faqDyn: 200, faqOut: 250, faqShortOut: 153,
    q: { chatSonnet: 0.92, chatHaiku: 0.78, intentSonnet: 0.97, intentHaiku: 0.95, sum: 0.90, faq: 0.95 },
    maxTok: 200
  };

  function turnParts(p, turns, prefix, user, ans, cache, outPerTurn) {
    const res = [];
    let prev = 0;
    for (let k = 1; k <= turns; k++) {
      const prompt = prefix + k * user + (k - 1) * ans;
      const part = { in: 0, write: 0, read: 0, out: outPerTurn * p.out / 1e6 };
      if (cache) { const read = k === 1 ? 0 : prev; part.read = read * p.read / 1e6; part.write = (prompt - read) * p.in * W5 / 1e6; } else part.in = prompt * p.in / 1e6;
      part.total = part.in + part.write + part.read + part.out;
      res.push(part);
      prev = prompt;
    }
    return res;
  }
  const sum = (arr, f = (x) => x.total) => arr.reduce((s, x) => s + f(x), 0);
  function allowedTurns(parts, cap) {
    if (cap == null) return parts.length;
    let c = 0, n = 0;
    for (const p of parts) { if (c + p.total > cap) break; c += p.total; n++; }
    return n;
  }

  function compute(L, o) {
    const p = L.haikuChat ? PRICE.haiku : PRICE.sonnet;
    const prefix = L.trim ? A.trimPrefix : A.prefix;
    let ans = L.short ? A.shortAns : A.ans;
    let outTok = ans, trunc = 0;
    if (L.maxtok) { trunc = ans >= 250 ? 0.40 : 0.10; outTok = ans - trunc * (ans >= 250 ? 120 : 40); }
    const parts = turnParts(p, A.turns, prefix, A.user, ans, L.cache, outTok);
    const cap = L.cap ? o.cap : null;
    const okTurns = allowedTurns(parts, cap);
    const chatConv = sum(parts.slice(0, okTurns));
    let qChat = (L.haikuChat ? A.q.chatHaiku : A.q.chatSonnet) * (1 - trunc * 0.5);
    if (okTurns < A.turns) qChat *= okTurns / A.turns;
    const aParts = turnParts(p, A.abuseTurns, prefix, A.user, ans, L.cache, outTok);
    const aTurns = allowedTurns(aParts, cap);
    const abuse = sum(aParts.slice(0, aTurns));
    const sumJob = (A.sumIn * PRICE.sonnet.in + A.sumOut * PRICE.sonnet.out) / 1e6 * (L.batch ? 0.5 : 1);
    const ip = L.haikuIntent ? PRICE.haiku : PRICE.sonnet;
    const intent = (A.intentIn * ip.in + A.intentOut * ip.out) / 1e6;
    const fo = L.short ? A.faqShortOut : A.faqOut;
    const sp = PRICE.sonnet;
    let faq = ((L.cache ? A.faqPrefix * sp.read : A.faqPrefix * sp.in) + A.faqDyn * sp.in + fo * sp.out) / 1e6;
    let qFaq = A.q.faq;
    const sem = SEM.find((r) => r[0] === o.sem) || SEM[3];
    if (L.sem) { faq *= 1 - sem[3]; qFaq = (1 - sem[1]) * A.q.faq + sem[1] * sem[2]; }
    const rows = [
      { k: 'chat', name: 'Chat hỗ trợ (' + p.name + ')', color: 'var(--g1)', cost: A.convs * chatConv, q: qChat, tickets: A.convs * (1 - qChat), parts, okTurns },
      { k: 'abuse', name: 'Phiên lạm dụng / script', color: 'var(--warn)', cost: A.abuseSessions * abuse, q: null, tickets: 0, aTurns },
      { k: 'sum', name: 'Tóm tắt review hằng đêm', color: 'var(--g2)', cost: A.sumJobs * sumJob, q: A.q.sum, tickets: 0 },
      { k: 'intent', name: 'Phân loại ý định (' + ip.name + ')', color: 'var(--g3)', cost: A.intentCalls * intent, q: L.haikuIntent ? A.q.intentHaiku : A.q.intentSonnet, tickets: 0 },
      { k: 'faq', name: 'FAQ trang sản phẩm', color: 'var(--g4)', cost: A.faq * faq, q: qFaq, tickets: A.faq * (1 - qFaq) }
    ];
    const total = sum(rows, (r) => r.cost);
    const tickets = sum(rows, (r) => r.tickets);
    return { rows, total, tickets, trunc, okTurns, aTurns, chatConv, sem, parts };
  }

  const LEVERS = [
    { k: 'cache', g: 'free', t: 'Prompt caching: chuyển dòng "Thời gian hiện tại" xuống cuối lượt user', r: '§2.2' },

  function billSvg(before, after) {

    [[before, 'Trước', 22], [after, 'Sau', 82]].forEach(([b, label, y]) => {

  }

  return {

    hook: 'Bật tắt từng đòn bẩy. Lab tính lại hoá đơn tháng bằng giá README §2.1 và công thức chi phí README, chia theo năm tính năng, rồi kiểm chất lượng giả định với ngưỡng eval bạn đặt. Đòn bẩy nào cắt tiền nhưng làm chất lượng tụt hoặc làm phát sinh ticket cho người xử lý sẽ bị đánh dấu.',

  Phần đọc được từ cache\n---------------------  ---------------  ----------------------------  ----------------------\nĐầu prompt             1.112            18                            1,6%\nCuối prompt            1.111            1.110                         99,9%\n\nRút ra: cùng công thức README, cache + trả lời ngắn + batch + hạn mức cắt phần lớn hoá đơn mà chất lượng giả định không đổi;\nHaiku cho chat rẻ hơn nhưng tụt dưới quality guard và sinh thêm ticket. Dòng thời gian ở đầu prompt làm prefix trùng gần 0%.",
      measured: true,
      read: ["Bảng ban đầu: chat chiếm 60% hoá đơn, nên caching (−49,6%) là đòn bẩy lớn nhất; 5 đòn bẩy không đổi chất lượng cộng lại −65,4%.", "Haiku cho chat cắt 62% tiền nhưng chất lượng (giả định) tụt dưới guard 90% và thêm 42.000 ticket; semantic cache FAQ ở ngưỡng 0,80 có lợi ròng âm khi tính ticket.", "Bảng cuối: dòng 'Thời gian hiện tại' ở đầu prompt làm prefix trùng chỉ 1,6%; chuyển xuống cuối thì 99,9% — đúng câu chuyện mở đầu README."]
    },
    mount(stage) {
      const L = { cache: false, trim: false, short: false, batch: false, cap: false, haikuIntent: false, haikuChat: false, maxtok: false, sem: false };
      const o = { ticket: 0.5, guard: 0.90, cap: 0.15, sem: '0.80' };
      const steps = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px' });
      const groups = el('div', { class: 'cols', style: 'margin-bottom:10px' });
      const ctl = el('div', { class: 'row' });
      const svgBox = el('div');
      const stats = el('div');
      const tblBox = el('div', { style: 'margin-top:10px' });
      const cap = el('div');
      const mk = (g, title) => {
        const box = el('div', {}, [el('h4', { html: title })]);
        LEVERS.filter((l) => l.g === g).forEach((l) => box.append(el('label', { class: 'ctl', style: 'margin:4px 0;align-items:flex-start' }, [el('input', { type: 'checkbox', onchange: (e) => { L[l.k] = e.target.checked; draw(); } }), el('span', { html: l.t + ' <small class="mono">' + l.r + '</small>' })])));
        return box;
      };
      groups.append(mk('free', 'Không đổi chất lượng <small>(làm trước)</small>'), mk('trade', 'Đổi chất lượng lấy chi phí <small>(cần eval)</small>'));
      const draw = () => {
        const B = compute({}, o), Z = compute(L, o);
        const flags = [];
        const rows = Z.rows.map((r, i) => {
          const b = B.rows[i];
          const dropped = r.q != null && (r.q < o.guard || b.q - r.q > 0.02);
          if (dropped) flags.push(r);
          const qTxt = r.q == null ? '—' : `${pct(b.q)} → <b class="${dropped ? 'bad' : ''}">${pct(r.q)}</b>`;
          const d = b.cost ? 1 - r.cost / b.cost : 0;
          return [`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${r.color};margin-right:6px"></span>${r.name}`, usd(b.cost, 0), usd(r.cost, 0), d > 0.0005 ? `<span class="ok">−${pct(d)}</span>` : '0%', qTxt];
        });
        const saved = B.total - Z.total;
        const extraTickets = Z.tickets - B.tickets;
        const net = saved - extraTickets * o.ticket;
        const pass = !flags.length;
        const stepDefs = [['1. Đo', 'usage mỗi request'], ['2. Quy về tính năng', 'chat chiếm ' + pct(B.rows[0].cost / B.total, 0)], ['3. Chọn đòn bẩy', Object.values(L).filter(Boolean).length + ' đang bật'], ['4. Đo lại + quality guard', pass ? 'đạt ngưỡng ' + pct(o.guard, 0) : flags.length + ' tính năng dưới ngưỡng']];
        steps.replaceChildren(...stepDefs.map(([t, s], i) => el('div', { style: `flex:1 1 150px;border:1px solid ${i === 3 ? (pass ? 'var(--ok)' : 'var(--bad)') : 'var(--line)'};border-radius:8px;padding:6px 10px;background:var(--bg);font-size:13px`, html: `<b>${t}</b><br><span style="color:${i === 3 ? (pass ? 'var(--ok)' : 'var(--bad)') : 'var(--mute)'}">${s}</span>` })));
        svgBox.replaceChildren(billSvg(B, Z), el('div', { class: 'legend', html: Z.rows.map((r) => `<span><i style="background:${r.color}"></i>${r.name}</span>`).join('') }));
        stats.innerHTML = `<div class="stat"><span>Hoá đơn: <b>${usd(B.total, 0)}</b> → <b>${usd(Z.total, 0)}</b> / tháng</span><span>Tiền token tiết kiệm: <b class="ok">${usd(saved, 0)}</b> (${pct(saved / B.total)})</span><span>Ticket thêm do trả lời sai: <b class="${extraTickets > 0 ? 'bad' : ''}">${vn(Math.max(0, extraTickets))}</b> × $${o.ticket.toFixed(2)}</span><span>Ròng: <b class="${net < 0 ? 'bad' : 'ok'}">${net < 0 ? '−' : '+'}${usd(Math.abs(net), 0)}</b></span></div>`;
        tblBox.innerHTML = table(['Tính năng', 'Trước', 'Sau', 'Giảm', 'Chất lượng (giả định)'], rows);
        const parts = [];
        if (L.haikuChat) {
          const tokSave = compute(Object.assign({}, L, { haikuChat: false }), o).rows[0].cost - Z.rows[0].cost;
          const tk = A.convs * (A.q.chatSonnet - A.q.chatHaiku) * o.ticket;
          parts.push(note(tk > tokSave ? 'var(--bad)' : 'var(--warn)', `<b>Haiku cho chat cắt ${usd(tokSave, 0)} tiền token nhưng thêm ${usd(tk, 0)} tiền ticket${tk > tokSave ? ': tổng đắt hơn' : ''}.</b> Vì sao: chất lượng giả định 92% → 78%, mỗi hội thoại hỏng thành một ticket. Không có nghĩa model nhỏ vô dụng: phân loại ý định trên Haiku chỉ tụt 2 điểm. Trong hệ thống thật: so chi phí mỗi tác vụ hoàn thành, trên phần khó nhất của traffic (README §1.4, §3.1).`));
        }
        if (L.maxtok) parts.push(note('var(--bad)', `<b>max_tokens 200 cắt ${pct(Z.trunc, 0)} câu trả lời chat (giả định), chất lượng tụt, tiền token gần như không giảm.</b> Vì sao: model không thấy max_tokens, vẫn viết dài rồi bị cắt; phần đã sinh vẫn tính tiền. Không có nghĩa câu trả lời không thể ngắn hơn: "Mô tả format trả lời ngắn" cắt 39% output mà không đổi chất lượng. Trong hệ thống thật: max_tokens để chặn sự cố, prompt để điều khiển độ dài (README §3.3).`));
        if (L.sem) parts.push(note(Z.rows[4].q < o.guard ? 'var(--bad)' : 'var(--warn)', `<b>Semantic cache ngưỡng ${Z.sem[0]}: FAQ rẻ hơn ${pct(Z.sem[3], 0)} nhưng khoảng ${vn(A.faq * Z.sem[1] * (1 - Z.sem[2]))} câu trả lời sai mỗi tháng.</b> Vì sao: hai câu gần nhau về embedding vẫn có thể cần câu trả lời khác ("hoàn tiền trong bao lâu" và "hoàn tiền được không"). Số hit và độ chính xác lấy từ benchmark AWS trong README §3.4, áp lên ShopViet là giả định. Trong hệ thống thật: chỉ cho câu trả lời chung, lọc metadata, chấm mẫu hit định kỳ.`));
        if (L.cap && Z.okTurns < A.turns) parts.push(note('var(--bad)', `<b>Hạn mức $${o.cap.toFixed(2)} chặn cả khách thật ở lượt ${Z.okTurns + 1}.</b> Vì sao: một hội thoại 8 lượt bình thường đang tốn ${usd(sum(Z.parts))}${L.cache ? '' : ' vì chưa bật cache'}. Không có nghĩa hạn mức là sai: phiên script vẫn cần chặn. Trong hệ thống thật: đặt hạn mức từ phân vị chi phí mỗi user đo trong log, và đặt lại sau khi bật cache (README §3.5).`));
        else if (L.cap) parts.push(note('var(--ok)', `Hạn mức $${o.cap.toFixed(2)}: phiên script dừng sau ${Z.aTurns} / ${A.abuseTurns} lượt, khách thật đi đủ ${A.turns} lượt.`));
        if (L.cache && !L.haikuChat) parts.push(note('var(--accent)', `Chat với cache: ${usd(Z.chatConv)} mỗi hội thoại${!L.trim && !L.short && !L.maxtok && !L.cap ? ' (README §2.2: 0,0514 USD)' : ''}. Đây là đòn bẩy lớn nhất trong hoá đơn này và không đổi chất lượng.`));
        if (!Object.values(L).some(Boolean)) parts.push(note('var(--mute)', 'Chưa bật đòn bẩy nào. Chat hỗ trợ chiếm phần lớn hoá đơn: 300.000 hội thoại × 0,1440 USD (README §3.6: khoảng 43.200 USD không cache). Bắt đầu từ cột bên trái.'));
        if (pass && Object.values(L).some(Boolean) && net > 0) parts.push(note('var(--ok)', `Mọi tính năng đạt ngưỡng eval ${pct(o.guard, 0)}. Hoá đơn giảm ${pct(saved / B.total)}, không phát sinh ticket.`));
        cap.innerHTML = parts.join('');
      };
      ctl.append(
        slider('Ngưỡng eval tối thiểu', 0.7, 0.97, 0.01, o.guard, (v) => { o.guard = v; draw(); }, (v) => Math.round(v * 100) + '%').node,
        slider('Giá một ticket (giả định)', 0, 3, 0.05, o.ticket, (v) => { o.ticket = v; draw(); }, (v) => '$' + v.toFixed(2)).node,
        slider('Hạn mức mỗi user / ngày', 0.05, 1, 0.01, o.cap, (v) => { o.cap = v; draw(); }, (v) => '$' + v.toFixed(2)).node,
        select('Ngưỡng semantic cache', SEM.map((r) => [r[0], r[0] + ' (hit ' + Math.round(r[1] * 100) + '%)']), o.sem, (v) => { o.sem = v; draw(); }).node);
      stage.append(steps, groups, ctl, el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Giá từ README §2.1 (06/11/2026). Khối lượng giả định: 300.000 hội thoại chat 8 lượt, 3.000 phiên script 40 lượt, 600.000 tóm tắt (6.000 in / 400 out), 2,4 triệu lần phân loại (1.500 / 15), 900.000 câu FAQ (3.000 / 250). Chất lượng và giá ticket là giả định.' }), svgBox, stats, tblBox, cap);
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
