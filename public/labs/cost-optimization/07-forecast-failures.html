const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

      c: 'Dự báo bằng mô phỏng từ log: phân phối số lượt, tỉ lệ cache hit, token mỗi lượt; giá theo ngày hiệu lực; trình kèm khoảng (gốc và khi các giả định cùng lệch). Theo dõi các thừa số nhạy nhất (số lượt, tăng trưởng) hằng tuần. Nâng bậc tài khoản trước khi dự báo chạm trần. Dùng bảng failure mode để chẩn đoán, checklist để chặn trước.',
      s: 'Một con số: "15.400 USD/tháng" từ một độ dài cố định. Nhân prompt trung bình với đơn giá: bỏ qua bình phương số lượt và đuôi dài. Dùng giá hôm nay cho cả kỳ: giá khuyến mãi hết hạn giữa chừng. Coi checklist là đủ: nó không có mục cho semantic cache hay flex.',
      p: 'Cần log usage đủ trường và đủ lâu để có phân phối. Dự báo dạng khoảng khó trình bày hơn một con số. Phải theo dõi ngày đổi giá của từng provider và cập nhật dự báo mỗi lần giá, model hay default đổi.'

    deep: [
      {
        q: 'Bản nháp "10.000 × 0,0514 × 30" lấy đúng số README. Sao vẫn gọi là ước lượng sai?',

<ol><li><b>Hội thoại dài lên.</b> Chi phí mỗi hội thoại tăng gần theo bình phương số lượt khi không cache. Tính năng mới cho phép hội thoại dài hơn làm chi phí mỗi người dùng tăng dù số người dùng không đổi.</li>
<li><b>Phân phối có đuôi dài.</b> Trung bình bị kéo bởi vài tác vụ rất đắt. Dùng phân vị từ log và mô phỏng với phân phối đó.</li>
<li><b>Cache hit rate đổi theo quy mô.</b> Traffic thưa thì cache hết hạn giữa các request; traffic dày lên có thể làm hit tăng, hoặc với OpenAI, tràn sang máy khác làm hit giảm.</li></ol>
<p>Thêm một lý do của §2.1: giá khuyến mãi hết hạn. Hình chính cho bạn bật từng thứ này và xem con số đổi bao nhiêu.</p>`,
        take: 'Một con số dự báo là một tập giả định. Viết các giả định ra, đo chúng từ log, và theo dõi chúng.'

      {
        q: 'Số lượt tăng 10% thì chi phí tăng bao nhiêu? Cũng 10% chứ?',
        a: `<p>Nhiều hơn. Lượt t gửi lại toàn bộ lịch sử trước đó, nên tổng input của hội thoại n lượt là tổng 1 + 2 + … + n phần lịch sử, tăng theo n². Không cache, chi phí gần như tăng theo bình phương; có cache, phần đọc lại rẻ nhưng vẫn tăng nhanh hơn tuyến tính.</p>
<p>Hình dưới tính bằng đúng hàm của hình chính (Sonnet 5.5, README §2.2) cho 1 tới 60 lượt. Hai điểm đánh dấu là 8 và 40 lượt; số tính ra khớp bảng README: 0,1440 / 0,0514 USD và 1,2320 / 0,2277 USD.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { n: 8 };
          const p = MODELS.sonnet.p(), W = 600, H = 170, L = 46, Rr = 10, T = 10, B = 22, mx = 60, ymax = conv(mx, p, 1, false);

          const line = (cache, col) => el('path', { d: Array.from({ length: mx }, (_, i) => (i ? 'L' : 'M') + x(i + 1).toFixed(1) + ' ' + y(conv(i + 1, p, 1, cache)).toFixed(1)).join(' '), fill: 'none', stroke: col, 'stroke-width': 2 });
          function draw() {
            const a = conv(st.n, p, 1, false), b = conv(st.n, p, 1, true), a2 = conv(Math.round(st.n * 1.1), p, 1, false), b2 = conv(Math.round(st.n * 1.1), p, 1, true);
            out.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Chi phí mỗi hội thoại theo số lượt' }, [
              el('line', { x1: L, x2: W - Rr, y1: y(0), y2: y(0), stroke: 'var(--line)' }), line(false, 'var(--g2)'), line(true, 'var(--accent)'),

              el('line', { x1: x(st.n), x2: x(st.n), y1: T, y2: H - B, stroke: 'var(--ink)', 'stroke-dasharray': '3 3' }),
              el('text', { x: 2, y: y(ymax) + 10, class: 'mute', text: usd(ymax) }), el('text', { x: L, y: H - 6, class: 'mute', text: '1 lượt' }), el('text', { x: W - Rr - 50, y: H - 6, class: 'mute', text: '60 lượt' }),
              el('text', { x: L + 6, y: T + 12, fill: 'var(--g2)', text: 'không cache' }), el('text', { x: L + 6, y: T + 28, fill: 'var(--accent)', text: 'có cache' })]));
            cap.innerHTML = st.n + ' lượt: không cache <b>' + usd(a) + '</b>, có cache <b>' + usd(b) + '</b>. Thêm 10% số lượt (' + Math.round(st.n * 1.1) + '): không cache <b class="' + (a2 / a - 1 > 0.12 ? 'bad' : '') + '">' + sgn(a2 / a - 1) + '</b>, có cache <b>' + sgn(b2 / b - 1) + '</b>.' + (Math.round(st.n * 1.1) === st.n ? ' (10% của ' + st.n + ' lượt làm tròn về cùng số lượt.)' : '');

        take: 'Thừa số số lượt tác động mạnh hơn tuyến tính. Theo dõi phân phối độ dài hội thoại như một chỉ số chi phí.'

      {
        q: 'Trung bình 8 lượt. Nếu phần lớn hội thoại 3 lượt và vài cái 60 lượt thì sao?',
        a: `<p>Thì hoá đơn cao hơn ước lượng ở 8 lượt, dù trung bình vẫn là 8. Vì chi phí là hàm lồi theo số lượt (đường cong cong lên: mỗi lượt thêm đắt hơn lượt trước, vì nó gửi lại lịch sử dài hơn), một hội thoại 60 lượt đắt hơn nhiều so với tổng tiết kiệm của vài hội thoại ngắn. Đây là lý do README bảo dùng phân vị và mô phỏng.</p>
<p>Ví dụ nhỏ không cache: hai hội thoại 8 lượt tốn 2 × 0,1440 = 0,288 USD; một cái 1 lượt cộng một cái 15 lượt cũng trung bình 8 lượt nhưng tốn 0,015 + 0,312 = 0,327 USD: riêng cái 15 lượt đã đắt hơn hai cái 8 lượt cộng lại. POC đo với phân phối có đuôi: cùng trung bình 8 lượt, chi phí mỗi hội thoại cao hơn <b>6,9%</b> khi có cache và <b>17%</b> khi không cache (không cache thì đường cong cong hơn nên đuôi đắt hơn).</p>
<p>Hình dưới lấy 2.000 hội thoại theo phân phối log-chuẩn (dạng phân phối phổ biến cho độ dài: phần lớn ngắn, một ít rất dài, không bao giờ âm) có cùng trung bình với số bạn chọn (độ lệch là <b>giả định</b>), tính chi phí từng hội thoại bằng hàm của README.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { m: 8, s: 0.8, cache: true };
          function draw() {
            const p = MODELS.sonnet.p(), mu = Math.log(st.m) - st.s * st.s / 2, memo = new Map();
            const costs = lengths.map((z) => { const n = Math.max(1, Math.min(200, Math.round(Math.exp(mu + st.s * z)))); if (!memo.has(n)) memo.set(n, conv(n, p, 1, st.cache)); return memo.get(n); }).sort((a, b) => a - b);
            const q = (f) => costs[Math.min(costs.length - 1, Math.floor(f * costs.length))], mean = costs.reduce((s, v) => s + v, 0) / costs.length, fixed = conv(Math.round(st.m), p, 1, st.cache);
            const top = costs.slice(Math.floor(0.9 * costs.length)).reduce((s, v) => s + v, 0) / (mean * costs.length);
            out.replaceChildren(hbars([['p50', q(0.5), false], ['p90', q(0.9), false], ['p99', q(0.99), false], ['Trung bình (đuôi dài)', mean, true], ['Ước lượng ở đúng ' + Math.round(st.m) + ' lượt', fixed, false]], { max: q(0.99), fmt: usd }));
            cap.innerHTML = '10% hội thoại đắt nhất chiếm <b>' + pct(top) + '</b> tổng chi phí. Trung bình thật ' + usd(mean) + ' so với ước lượng ở ' + Math.round(st.m) + ' lượt ' + usd(fixed) + ': <b class="' + (mean / fixed - 1 > 0.1 ? 'bad' : '') + '">' + sgn(mean / fixed - 1) + '</b>.' + (mean / fixed - 1 > 0.1 ? ' Cùng trung bình số lượt, hoá đơn khác vì hàm chi phí cong lên.' : '');

          draw();
        },
        take: 'Dự báo bằng phân phối, không bằng trung bình. Tối ưu đuôi (hội thoại dài nhất) thường được nhiều hơn tối ưu trường hợp điển hình.'

      {
        q: 'Hit rate đang 90%. Khi ShopViet lớn gấp đôi, hit rate có giữ 90% không?',
        a: `<p>Không chắc, và có thể theo hai hướng. Cache Claude TTL 5 phút: nếu khách trả lời chậm hơn 5 phút, lượt sau miss và phải ghi lại toàn bộ prompt. Traffic thưa trên một prefix (ít request mỗi phút) thì hit thấp; traffic dày hơn khi scale thì hit có thể tăng.</p>
<p>Hình dưới giả sử request trên cùng một prefix đến ngẫu nhiên đều đặn (quá trình Poisson, <b>giả định</b>): xác suất request kế tiếp đến trong TTL là 1 − e^(−tần suất × TTL). README thêm một chiều ngược lại với OpenAI: cache nằm trên từng máy, và trên khoảng 15 request mỗi phút cho cùng prefix thì traffic có thể tràn sang máy khác, làm giảm hit. README không cho con số giảm bao nhiêu, nên vùng đó chỉ được tô, không được tính.</p>`,
        viz(box) {

            out.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Hit theo tần suất request' }, [

              el('path', { d: curve(5), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }), el('path', { d: curve(60), fill: 'none', stroke: 'var(--g3)', 'stroke-width': 2 }),

function terms(list) {

    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;

    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {

        el('div', { class: 'qa-a', html: d.a })]);
