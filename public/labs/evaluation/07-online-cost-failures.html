const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<p>Judge cũng trôi: phân phối câu hỏi đổi, provider cập nhật model judge. Định kỳ gán nhãn trace mới, đo lại TPR/TNR; tập test dùng đi dùng lại để sửa judge sẽ thành tập dev.</p>
<h4>Chi phí (§3.6)</h4>
<p>Chi phí một lần ≈ số ca × số lần chạy × (chi phí hệ thống + chi phí judge). Agent nhiều bước có thể gấp chục lần một lời gọi đơn.</p>
<ul><li>Nên giảm: grader code trước judge; cache output hệ thống khi chỉ sửa grader/judge; judge nhỏ khi TPR/TNR vẫn đạt; Batch API cho bộ lớn; rút gọn transcript cho judge; số lần chạy theo mục đích (CI 1–3 lần).</li><li>Không giảm: hạ temperature, bỏ nhóm ca khó, bỏ hiệu chỉnh judge.</li></ul>

<tr><td>Grader code chấm sai câu tiếng Việt đúng</td><td>Không chuẩn hoá Unicode</td><td>Chuẩn hoá NFC</td></tr>
</table></div>
<h4>Checklist (§3.8)</h4>
<p>Bốn nhóm: Dataset (trace thật, ca biên, version, tách dev/test, theo nhóm), Grader (code trước, judge một tiêu chí, hiệu chỉnh, đảo thứ tự, khác họ), Thống kê (khoảng tin cậy, so cặp, biết MDE, không hạ temperature), Vận hành (CI không 100%, bộ đầy đủ theo lịch, đọc transcript ca đổi trạng thái, judge online, đo lại TPR/TNR). Câu hỏi 8 bên trên cho bạn tick và xem failure mode nào còn hở.</p>
<div class="verdict"><b>Điểm cần nhớ:</b> offline chặn lỗi đã biết, online tìm lỗi chưa biết rồi đưa về offline. A/B là một phép thử thống kê: định cỡ mẫu và metric chính trước, nhìn để phát hiện sự cố chứ không để quyết định sớm.</div>`,
    why: {

      p: 'A/B chậm (vài ngày đến vài tuần) và khách nhánh B gặp lỗi thật trong lúc chạy. Judge online tốn tiền theo traffic. Batch rẻ một nửa nhưng có thể chờ tới 24 giờ, không hợp với CI của mỗi pull request. Phải gán nhãn trace mới định kỳ để biết judge còn đúng.'

    deep: [
      {
        q: 'A/B mới chạy 3 ngày, v8.1 giảm handoff, p < 0,05. Sao không dừng và ship luôn?',

<p>Mô phỏng dưới đây: 400 A/A (hai nhánh cùng 12% handoff, 1.500 hội thoại mỗi nhánh mỗi ngày, 30 ngày). Mỗi dòng là số lần nhìn, chia đều trong 30 ngày. Kéo ngưỡng |z| để xem muốn nhìn nhiều lần thì ngưỡng phải chặt cỡ nào.</p>`,
        viz(box) {
          const rnd = seeded(701), S = 400, D = 30, nd = 1500, Z = [];
          for (let s = 0; s < S; s++) { let a = 0, b = 0, n = 0; const row = new Float64Array(D); for (let d = 0; d < D; d++) { a += binom(nd, 0.12, rnd); b += binom(nd, 0.12, rnd); n += nd; row[d] = zstat(a, b, n); } Z.push(row); }

          box.append(slider('Ngưỡng |z| để dừng', 1.96, 3.5, 0.02, 1.96, draw, (v) => dec(v)).node, out, cap);

        take: 'Nhìn một lần ở ngày định trước. Mỗi lần nhìn thêm mà vẫn dùng ngưỡng 1,96 là thêm một cơ hội báo sai.'

      {

<p class="mono">n mỗi nhánh ≈ 7,85 × (p₁(1 − p₁) + p₂(1 − p₂)) / δ²</p>
<p>A/B là hai nhánh độc lập thật (khách khác nhau), nên không có lợi thế so cặp như eval offline. Hiệu ứng nhỏ cần cỡ mẫu tăng theo bình phương: chênh nhỏ đi một nửa thì cần gấp bốn lần hội thoại. Kéo tỉ lệ handoff của v7 và traffic để xem số ngày.</p>`,

            const n1 = nPerArm(st.p1, Math.max(0.001, st.p1 - 0.005)), d1 = Math.ceil(2 * n1 / st.tr);

      },
      {
        q: 'Ngoài handoff còn CSAT, thời gian xử lý, tỉ lệ giải quyết. Nhìn cả bốn, metric nào có ý nghĩa thì báo cáo?',
        a: `<p>Đó là cùng một bẫy với nhìn trộm, chỉ khác là nhìn theo chiều ngang: mỗi metric là một phép thử, mỗi phép thử có 5% báo sai. Nếu các metric độc lập (giả định để tính), xác suất ít nhất một metric báo sai là 1 − 0,95^m. Thực tế các metric tương quan nên con số thấp hơn một chút, nhưng vẫn vượt xa 5%.</p>
<p>README §3.5 nói rõ: quyết định <b>metric chính</b> trước khi bắt đầu. Các metric còn lại là metric bảo vệ (guardrail): chỉ dùng để chặn khi xấu đi rõ rệt, không dùng để tuyên bố thắng.</p>`,
        viz(box) {

      {
        q: 'Dashboard có sẵn nút thích/không thích. Lấy tỉ lệ dislike làm metric chất lượng chính có được không?',

<p>Mô hình dưới đây có xác suất bấm là giả định. So ba kịch bản: hiện tại, v8.1 thật sự giảm câu trả lời tệ 2 điểm, và chỉ đổi giao diện cho nút thích nổi hơn (chất lượng giữ nguyên).</p>`,

      {

          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {

    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
