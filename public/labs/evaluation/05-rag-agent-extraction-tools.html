const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

        q: 'Câu trả lời sai là sai. Tách ra "sai do retrieval" hay "sai do generation" để làm gì?',
        a: `<p>Để biết sửa chỗ nào. Hai loại lỗi cần hai cách sửa khác nhau:</p>
<ul><li><b>Retrieval miss</b> (chunk cần thiết không có trong top-k): sửa retriever, cách cắt chunk, viết lại câu hỏi trước khi tìm (query rewriting), tăng k. Sửa prompt của model sinh không giúp gì, vì model chưa từng thấy thông tin đúng.</li>
<li><b>Generation error</b> (chunk đúng có trong context mà vẫn sai): sửa prompt, thứ tự chunk, thêm bước xếp hạng lại chunk bằng một model chấm độ liên quan (rerank), đổi model. Thay retriever không giúp gì, có khi còn tệ hơn vì kéo thêm chunk gây nhầm.</li></ul>
<p>Trong lab, ở k = 3, retriever v1 hỏng chủ yếu vì không tìm thấy chunk, còn v2 tìm thấy nhưng xếp chunk gây nhầm (bảo hành laptop, chính sách 2024) lên trên chunk đúng. Cùng 7/12, hai bệnh khác nhau. Một con số end-to-end không nói được điều này.</p>`,
        take: 'Đo mỗi tầng một metric. Con số end-to-end cho biết có bệnh, metric theo tầng cho biết bệnh ở đâu.'
      },
      {
        q: 'Faithfulness 100% mà câu trả lời vẫn sai: làm sao có chuyện đó?',
        a: `<p>Faithfulness chỉ hỏi "mỗi claim có được <b>context</b> hỗ trợ không", không hỏi "context có đúng không". Ragas tách câu trả lời thành claim, kiểm từng claim với context, điểm = số claim được hỗ trợ / tổng số claim.</p>
<p>Câu hỏi: "Tai nghe đơn SV-4821 mua 20 ngày, chưa mở hộp, đổi được không, bảo hành bao lâu?". Chọn context dưới đây. Claim được kiểm bằng cách so với chunk trong context (mô phỏng việc LLM kiểm claim), còn độ đúng so với đáp án tham chiếu.</p>`,
        viz(box) {
          const SETS = {
            good: [['D1', 'D3'], [['Còn đổi được', 'D1', true], ['Hạn đổi 30 ngày', 'D1', true], ['Tai nghe bảo hành 12 tháng', 'D3', true]]],
            stale: [['D2', 'D3'], [['Không đổi được nữa', 'D2', false], ['Hạn đổi 15 ngày', 'D2', false], ['Tai nghe bảo hành 12 tháng', 'D3', true]]],
            miss: [['D3'], [['Còn đổi được', null, true], ['Hạn đổi 60 ngày', null, false], ['Tai nghe bảo hành 12 tháng', 'D3', true]]]
          };
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw(key) {

            out.innerHTML = '<p style="font-size:13px;margin:4px 0">Context: ' + ctx.map((d) => '<code>' + d + '</code> ' + esc(DOCS[d])).join('; ') + '</p><div class="tbl"><table><tr><th>Claim</th><th>Context hỗ trợ?</th><th>Đúng theo đáp án tham chiếu?</th></tr>' + claims.map((c) => '<tr><td>' + c[0] + '</td><td class="' + (c[1] ? 'ok' : 'bad') + '">' + (c[1] ? 'có (' + c[1] + ')' : 'không') + '</td><td class="' + (c[2] ? 'ok' : 'bad') + '">' + (c[2] ? 'đúng' : 'sai') + '</td></tr>').join('') + '</table></div><div class="stat"><span>Faithfulness <b>' + sup + '/' + claims.length + ' = ' + dec(sup / claims.length) + '</b></span><span>Claim đúng <b class="' + (right < claims.length ? 'bad' : 'ok') + '">' + right + '/' + claims.length + '</b></span></div>';

              : key === 'miss' ? '<span class="bad">Claim "Còn đổi được" đúng nhưng không được context hỗ trợ</span>, nên bị trừ điểm faithfulness; claim "60 ngày" là bịa. Faithfulness bắt được bịa, nhưng nó cũng trừ điểm cả câu đúng mà model "đoán trúng".'
                : 'Context đúng, mọi claim được hỗ trợ và đúng. Chọn context lỗi thời để thấy faithfulness không đổi mà câu trả lời sai.';
          }
          const s = select('Context được lấy', [['good', 'Đúng: D1 + D3'], ['stale', 'Lỗi thời: D2 + D3'], ['miss', 'Thiếu chính sách đổi trả: D3']], 'good', draw);
          box.append(s.node, out, cap);
          draw('good');

        take: 'Faithfulness đo "bám context", không đo "đúng". Luôn đo kèm độ đúng so với đáp án tham chiếu.'
      },
      {
        q: 'Recall@k đã bằng 1 rồi, context precision còn thêm được gì?',
        a: `<p>Recall@k chỉ hỏi chunk cần thiết <b>có mặt</b> trong top-k không. Context precision hỏi nó có được <b>xếp lên đầu</b> không. Ragas tính: tại mỗi vị trí i có chunk liên quan, lấy precision@i (số chunk liên quan trong i chunk đầu, chia i), rồi lấy trung bình các giá trị đó.</p>
<p>Chọn vị trí của 2 chunk liên quan trong top-5:</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw(key) {
            const pos = key.split(',').map(Number);
            let hits = 0;
            const steps = [];
            for (let i = 1; i <= 5; i++) if (pos.includes(i)) { hits++; steps.push(hits + '/' + i); }
            const cp = steps.reduce((s, t) => { const [a, b] = t.split('/').map(Number); return s + a / b; }, 0) / pos.length;
            out.innerHTML = '<div style="display:flex;gap:4px;margin:6px 0">' + [1, 2, 3, 4, 5].map((i) => '<span style="flex:1;text-align:center;padding:4px;border-radius:4px;font-size:12px;border:2px solid ' + (pos.includes(i) ? 'var(--ok)' : 'var(--line)') + '">hạng ' + i + '</span>').join('') + '</div><p class="mono" style="font-size:12.5px;margin:4px 0">Recall@5 = 2/2 = 1,00<br>Context precision = (' + steps.join(' + ') + ') / 2 = <b>' + dec(cp) + '</b></p>';
            cap.innerHTML = cp < 0.7 ? '<span class="bad">Recall@5 vẫn 1,00 nhưng context precision ' + dec(cp) + '.</span> Model phải đọc qua 3 chunk không liên quan trước khi gặp chunk đúng. Trong lab chính, đây là kiểu lỗi của retriever v2: chunk gây nhầm đứng trên chunk đúng, và model sinh trả lời theo chunk gây nhầm. Ví dụ ngưỡng OpenAI: context precision &gt; 0,7 (ví dụ, không phải chuẩn).' : 'Chunk liên quan ở đầu, precision cao. Chọn "hạng 4, 5" để thấy recall không đổi mà precision rơi.';
          }
          const s = select('Chunk liên quan ở', [['1,2', 'hạng 1, 2'], ['1,5', 'hạng 1, 5'], ['4,5', 'hạng 4, 5']], '1,2', draw);
          box.append(s.node, out, cap);
          draw('1,2');
        },
        take: 'Recall@k nói "có tìm thấy không", context precision nói "có xếp đúng chỗ không". Lỗi generation do chunk gây nhầm thường hiện ra ở metric thứ hai.'
      },
      {
        q: 'Ragas, DeepEval tính sẵn faithfulness rồi. Tin luôn được không?',
        a: `<p>Không tin ngay được, vì <b>metric bằng model vẫn là judge</b>. Faithfulness của Ragas dùng LLM để tách và kiểm claim. DeepEval có ba chế độ:</p>
<div class="tbl"><table><tr><th>Chế độ DeepEval</th><th>Ai tách claim</th><th>Ai quyết định từng claim</th></tr>
<tr><td><code>eval_mode="llm"</code> (mặc định)</td><td>LLM</td><td>LLM</td></tr>
<tr><td><code>hybrid</code></td><td>LLM</td><td>Jev (model phân loại riêng của DeepEval)</td></tr>
<tr><td><code>system_one</code></td><td colspan="2">Jev chấm toàn bộ, không gọi LLM</td></tr></table></div>
<p>Dù chế độ nào, người chấm vẫn là một model, nên cũng cần kiểm với nhãn người trên dữ liệu của bạn như §2.2. README lưu ý riêng tiếng Việt: bước tách claim có thể kém hơn tiếng Anh. Câu "Dạ còn đổi được ạ, trong 30 ngày, nhớ mang hoá đơn" có thể bị tách thành 2 hay 3 claim tuỳ judge, và điểm thay đổi theo.</p>`,
        take: 'Metric dựng sẵn là judge chưa hiệu chỉnh với dữ liệu của bạn. Đo TPR/TNR của nó trước khi đặt ngưỡng.'
      },
      {
        q: 'Agent thành công 90% mỗi lần. Vậy khách của ShopViet gặp agent hỏng bao nhiêu lần?',
        a: `<p>Tuỳ bạn hỏi câu nào. Anthropic định nghĩa:</p>
<ul><li><b>pass@k</b>: xác suất ít nhất một lần thành công trong k lần thử. Hợp với agent viết code cho lập trình viên tự review: thử 5 lần, lấy bản tốt.</li>
<li><b>pass^k</b>: xác suất cả k lần đều thành công. Hợp với agent phục vụ khách: mỗi khách chỉ có một lần, và cùng một loại yêu cầu lặp lại hàng nghìn lần.</li></ul>
<p>Khi có n lần chạy mỗi task và c lần thành công, τ-bench (benchmark công khai cho agent dùng tool và nói chuyện với người dùng, Yao và cộng sự 2024) ước lượng pass^k bằng <code>C(c, k) / C(n, k)</code> (trung bình qua các task). Kéo các thanh dưới đây.</p>`,
        viz(box) {
          const st = { p: 0.9, k: 8, n: 8, c: 7 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const C = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
          function draw() {
            const rows = [];
            for (let k = 1; k <= 8; k++) rows.push([k, 1 - Math.pow(1 - st.p, k), Math.pow(st.p, k)]);
            const kk = Math.min(st.k, st.n), cc = Math.min(st.c, st.n);
            const est = C(cc, kk) / C(st.n, kk);
            out.innerHTML = '<div class="tbl"><table><tr><th>k</th>' + rows.map((r) => '<th' + (r[0] === st.k ? ' style="color:var(--accent)"' : '') + '>' + r[0] + '</th>').join('') + '</tr><tr><td>pass@k</td>' + rows.map((r) => '<td class="mono">' + pct(r[1]) + '</td>').join('') + '</tr><tr><td>pass^k</td>' + rows.map((r) => '<td class="mono ' + (r[2] < 0.6 ? 'bad' : '') + '">' + pct(r[2]) + '</td>').join('') + '</tr></table></div>' +
              '<p class="mono" style="font-size:12.5px;margin:6px 0">Ước lượng τ-bench cho một task: n = ' + st.n + ' lần chạy, c = ' + cc + ' lần thành công, k = ' + kk + ' → C(' + cc + ', ' + kk + ') / C(' + st.n + ', ' + kk + ') = <b>' + dec(est, 3) + '</b></p>';
            const pk = rows[st.k - 1];
            cap.innerHTML = pk[1] > 0.95 && pk[2] < 0.6 ? '<span class="bad">pass@' + st.k + ' = ' + pct(pk[1]) + ' nhưng pass^' + st.k + ' = ' + pct(pk[2]) + '.</span> Cùng một agent. Báo pass@k cho agent phục vụ khách là chọn con số đẹp. README: với p = 0,9 độc lập, pass^8 = 0,9⁸ ≈ 43%.' + (cc === st.n - 1 && kk === st.n ? ' Ở ô ước lượng: chỉ cần trượt 1/' + st.n + ' lần là pass^' + kk + ' của task này về 0.' : '')
              : 'Kéo k lên 8 với p = 0,9 để thấy hai con số tách xa nhau.';
          }
          box.append(el('div', { class: 'row' }, [
            slider('p mỗi lần', 0.5, 1, 0.01, st.p, (v) => { st.p = v; draw(); }, (v) => pct(v)).node,
            slider('k', 1, 8, 1, st.k, (v) => { st.k = Math.round(v); draw(); }).node,
            slider('n lần chạy', 1, 12, 1, st.n, (v) => { st.n = Math.round(v); draw(); }).node,
            slider('c thành công', 0, 12, 1, st.c, (v) => { st.c = Math.round(v); draw(); }).node]), out, cap);
          draw();
        },
        take: 'Agent phục vụ khách thì báo pass^k. pass@k chỉ hợp khi có người chọn lại bản tốt nhất.'
      },
      {
        q: 'Chấm agent hoàn tiền: đọc lời agent nói, kiểm chuỗi tool, hay kiểm database?',
        a: `<p>README (theo Anthropic): <b>chấm trạng thái, không chấm lời tự khai</b>; <b>chấm kết quả, không bắt buộc một đường đi</b>. Ba lần chạy dưới đây cho yêu cầu "hoàn tiền đơn SV-4821 vì giao thiếu sạc". Chọn grader để xem lần nào pass.</p>`,
        viz(box) {
          const RUNS = [
            ['A', 'lookup_order("SV-4821") → refund("SV-4821", 350000) → "Em đã hoàn 350.000đ"', true, true, true],
            ['B', 'lookup_order("SV-4821") → "Em đã hoàn tiền cho anh rồi ạ" (không gọi refund)', false, false, true],
            ['C', 'lookup_customer("0903…") → list_orders → refund("SV-4821", 350000) → "Đã hoàn 350.000đ"', true, false, true]
          ];
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw(g) {
            const idx = g === 'state' ? 2 : g === 'path' ? 3 : 4;
            out.innerHTML = '<div class="tbl"><table><tr><th>Lần chạy</th><th>Trajectory</th><th>Database: đơn đã hoàn?</th><th>Grader chọn</th></tr>' + RUNS.map((r) => '<tr><td>' + r[0] + '</td><td style="font-size:12px" class="mono">' + esc(r[1]) + '</td><td class="' + (r[2] ? 'ok' : 'bad') + '">' + (r[2] ? 'có' : 'không') + '</td><td class="' + (r[idx] === r[2] ? 'ok' : 'bad') + '"><b>' + (r[idx] ? 'Pass' : 'Fail') + '</b>' + (r[idx] !== r[2] ? ' (sai)' : '') + '</td></tr>').join('') + '</table></div>';
            cap.innerHTML = g === 'claim' ? '<span class="bad">Lần B pass</span> dù database không đổi: agent nói "đã hoàn" mà chưa gọi refund. Đây là failure mode "Agent báo thành công nhưng hệ thống không đổi" ở §3.7.'
              : g === 'path' ? '<span class="bad">Lần C fail</span> dù hoàn tiền đúng: agent tìm đơn qua số điện thoại, một đường hợp lệ người viết eval không nghĩ tới. Anthropic nhận xét grader theo chuỗi tool làm test quá giòn.'
                : 'Grader đọc database sau khi chạy: A và C pass, B fail, khớp thực tế. Với task nhiều phần, cho điểm từng phần: xác minh đúng đơn nhưng chưa hoàn vẫn hơn hỏng từ đầu.';
          }
          const s = select('Grader', [['state', 'Đọc trạng thái database'], ['path', 'Đúng chuỗi tool lookup_order → refund'], ['claim', 'Đọc lời agent tự khai']], 'state', draw);
          box.append(s.node, out, cap);
          draw('state');
        },
        take: 'Grader đọc trạng thái cuối của môi trường. Vẫn đọc transcript, kể cả ca pass, để thấy grader lỏng hoặc lối đi hợp lệ mới.'
      },
      {
        q: 'Trích xuất đơn hàng ra JSON: chấm cả bản ghi đúng/sai là đủ chứ?',
        a: `<p>Không đủ để biết sửa gì. README §2.5: báo độ chính xác <b>theo field</b>, và đếm riêng ba loại lỗi: <b>đọc sai</b> (giá trị khác), <b>bỏ sót</b> (trả null khi tài liệu có), <b>bịa</b> (trả giá trị khi tài liệu không có). Bịa nguy hiểm nhất cho pipeline tự động, và chỉ đo được khi bộ eval có ca cố ý thiếu field.</p>
<p>Dưới đây là 5 tin nhắn khách hàng được trích thành JSON 6 field. Bật tắt chuẩn hoá và ca thiếu field.</p>`,
        viz(box) {
          const F = ['order_id', 'product', 'qty', 'amount', 'phone', 'reason'];
          const REC = [
            [['SV-4821', 'SV-4821'], ['Tai nghe Pro X', 'Tai nghe  Pro X'], [1, 1], ['1290000', '1.290.000đ'], ['0903123456', '0903123456'], ['thiếu sạc', 'thiếu sạc']],
            [['SV-5102', 'SV-5102'], ['Laptop Air 14', 'Laptop Air 14'], [1, 1], ['20990000', '20990000'], ['0912000111', '0912000111'], ['lỗi màn hình', 'lỗi màn hình']],
            [['SV-6110', 'SV-6110'], ['Ốp lưng S24', 'Ốp lưng S24'], [2, 1], ['180000', '180000'], ['0988777666', null], ['đổi size', 'đổi size']],
            [['SV-4907', 'SV-4907'], ['Sạc nhanh 65W', 'Sạc nhanh 65W'], [1, 1], ['450000', '450000'], [null, '0900000000'], ['mất hoá đơn', 'mất hoá đơn']],
            [['SV-5233', 'SV-5233'], ['Loa mini', 'Loa mini'], [1, 1], ['790000', '790000'], [null, '0911222333'], ['không thích màu', 'không thích màu']]
          ];
          const MISSING = [3, 4];
          const st = { norm: false, missing: true };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const norm = (v) => v == null ? null : String(v).normalize('NFC').replace(/\s+/g, ' ').trim().replace(/[.đ]/g, '');
          function draw() {
            const recs = REC.map((r, i) => [r, i]).filter(([, i]) => st.missing || !MISSING.includes(i));
            const cnt = { ok: 0, mis: 0, omit: 0, fab: 0 }, perF = F.map(() => [0, 0]);
            let recOk = 0;
            const rows = recs.map(([r]) => {
              let all = true;
              const cells = r.map(([g, p], fi) => {
                const eq = st.norm ? norm(g) === norm(p) : g === p;
                const t = eq ? 'ok' : g == null ? 'fab' : p == null ? 'omit' : 'mis';
                cnt[t]++; perF[fi][1]++; if (t === 'ok') perF[fi][0]++; else all = false;
                return '<td class="mono ' + (t === 'ok' ? '' : 'bad') + '" style="font-size:11.5px">' + esc(p == null ? 'null' : p) + (t === 'ok' ? '' : '<br><span style="color:var(--warn)">' + { mis: 'đọc sai', omit: 'bỏ sót', fab: 'bịa' }[t] + '</span>') + '</td>';
              });
              if (all) recOk++;
              return '<tr>' + cells.join('') + '</tr>';
            });
            const nf = recs.length * F.length;

          what: 'v2 tìm thấy chunk đúng ở hầu hết câu (Recall@' + o.k + ' ' + dec(E2.recall) + '), nhưng ' + E2.gen + ' câu vẫn sai ở tầng generation.',
          why: 'Embedding đưa các chunk "gần nghĩa" lên trên: hỏi bảo hành tai nghe thì chunk bảo hành laptop xếp hạng 1. Model sinh đọc chunk đầu và trả lời theo nó.',
          not: 'Không có nghĩa phải bỏ v2: retrieval miss đã giảm từ ' + E1.ret + ' xuống ' + E2.ret + '.',
          real: 'Thêm rerank hoặc metadata (loại sản phẩm, bản chính sách còn hiệu lực), gỡ tài liệu lỗi thời khỏi index, rồi đo lại context precision.' };
        else if (o.ret === 'r1' && E1.ret > E1.gen) c = {
          what: 'v1 sai chủ yếu vì không tìm thấy chunk cần thiết (' + E1.ret + ' retrieval miss).',
          why: 'Retriever từ khoá cần trùng chữ: "rơi vỡ màn hình" không khớp từ khoá của chunk "Rơi vỡ, vào nước", nên chunk đó xếp sau top-' + o.k + '. Model không thấy thì đoán hoặc bám chunk khác.',
          not: 'Không có nghĩa model sinh tốt: khi có chunk đúng, nó vẫn sai câu trả góp.',
          real: 'Sửa retriever (hybrid, query rewriting) hoặc tăng k, đo lại Recall@k; prompt của model sinh không chữa được lỗi này.' };
        else c = {
          what: 'Ở k = ' + o.k + ', v1 đúng ' + E1.acc + ', v2 đúng ' + E2.acc + '.',
          why: 'k lớn hơn đưa thêm chunk đúng vào context nhưng cũng đưa thêm chunk gây nhầm. Recall tăng không chắc kéo theo độ đúng tăng.',
          not: 'Không có nghĩa k lớn luôn tốt hay luôn xấu.',
          real: 'Quét k trên bộ có nhãn, nhìn cả Recall@k, context precision và độ đúng trước khi chọn.' };
        cap.innerHTML = '<div style="font-size:13.5px"><p style="margin:0 0 4px"><b>Chuyện gì xảy ra:</b> ' + c.what + '</p><p style="margin:0 0 4px"><b>Vì sao:</b> ' + c.why + '</p><p style="margin:0 0 4px"><b>Không có nghĩa là:</b> ' + c.not + '</p><p style="margin:0"><b>Trong hệ thống thật:</b> ' + c.real + '</p></div>';
      }

      function renderCards() {
        const rec = { ci: ['promptfoo'], agent: ['Inspect AI (UK AI Security Institute)'], trace: ['Braintrust', 'LangSmith (LangChain)', 'Langfuse'] }[o.need] || [];
        cards.replaceChildren(...TOOLS.map(([name, kind, note, lvl, tags]) => {
          const hit = rec.includes(name);
          return el('div', { style: 'border:' + (hit ? '2px solid var(--accent)' : '1px solid ' + (lvl ? 'var(--' + lvl + ')' : 'var(--line)')) + ';border-radius:8px;padding:10px;background:' + (hit ? 'var(--accent-soft)' : 'var(--bg)') + ';opacity:' + (o.need === 'all' || hit ? 1 : 0.5) }, [
            el('h4', { html: esc(name) + ' <small>' + esc(kind) + '</small>' }),
            el('div', { style: 'font-size:12.5px', html: esc(note) }),
            lvl === 'bad' ? el('div', { class: 'bad', style: 'font-size:12px;margin-top:4px', text: 'Không chọn cho dự án mới.' }) : lvl === 'warn' ? el('div', { style: 'font-size:12px;margin-top:4px;color:var(--warn)', text: 'Mặc định cần đổi trước khi tin kết quả.' }) : null]);
        }));
      }

      const ret = select('Retriever đang xem', [['r2', 'v2: embedding (mới)'], ['r1', 'v1: từ khoá (cũ)']], o.ret, (v) => { o.ret = v; render(); });
      const kS = slider('k (số chunk vào context)', 1, 5, 1, o.k, (v) => { o.k = Math.round(v); render(); });
      const mode = select('Cách đo', [['layer', 'Đo theo tầng'], ['e2e', 'Chỉ đo end-to-end']], o.mode, (v) => { o.mode = v; render(); });
      const need = select('Nhu cầu', [['all', 'Xem tất cả'], ['ci', 'Cần chạy trong CI ngay, ít phụ thuộc'], ['agent', 'Eval agent có môi trường, nhiều lần chạy'], ['trace', 'Đã có tracing ở một nền tảng']], 'all', (v) => { o.need = v; renderCards(); });

      stage.append(
        el('div', { class: 'row' }, [ret.node, kS.node, mode.node]),
        el('h4', { text: '12 câu có nhãn, chấm theo tầng', style: 'margin:8px 0 4px' }), tbl, detail,
        el('h4', { text: 'Hai retriever, cùng model sinh', style: 'margin:16px 0 4px' }), bars, stat,
        el('h4', { text: 'Phát hiện từ dữ liệu', style: 'margin:16px 0 4px' }), flags, cap,
        el('p', { class: 'hint', text: 'Mô phỏng, không phải hệ thống thật. 9 chunk là chính sách giả định của ShopViet; thứ hạng của hai retriever và câu trả lời là dữ liệu viết tay. Quy tắc sinh câu trả lời giả định: thiếu chunk cần thiết thì model bịa, từ chối hoặc bám chunk sai; có chunk đúng nhưng chunk gây nhầm đứng trên thì trả lời theo chunk gây nhầm. Faithfulness lấy theo số claim được context hỗ trợ (2 claim mỗi câu), context precision theo công thức trung bình precision tại các vị trí liên quan.' }),
        el('h4', { text: 'Công cụ eval (README §2.6, kiểm tra trên docs 11/2026)', style: 'margin:20px 0 4px' }), el('div', { class: 'row' }, [need.node]), cards
      );
      render();
      renderCards();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
