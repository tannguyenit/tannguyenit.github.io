const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

        viz(box) {

          const draw = () => {
            const x = Math.min(st.x, st.n);

            out.innerHTML = `<div class="tbl"><table><tr><th>Cách tính</th><th>Khoảng 95%</th></tr><tr><td>p̂ ± 1,96·SE</td><td class="mono ${bad ? 'bad' : ''}">[${pc(p - h)}; ${pc(p + h)}]</td></tr><tr class="cur"><td>Wilson</td><td class="mono">[${pc(w[0])}; ${pc(w[1])}]</td></tr></table></div>` +

      {
        q: 'Bộ RAG của ShopViet có 300 câu hỏi nhưng chỉ về 30 trang chính sách. Vẫn tính SE như 300 ca độc lập được không?',
        a: `<p>Không. Công thức SE giả định các ca độc lập. Khi nhiều câu hỏi về cùng một tài liệu (hoặc nhiều lượt cùng một hội thoại), chúng hay cùng đúng hoặc cùng sai. Miller (2024) đưa công thức sai số chuẩn theo cụm; trong ví dụ của paper, hiệu chỉnh theo cụm làm SE lớn hơn hơn ba lần (README §1.4).</p>
<p>Hình dưới mô phỏng 400 bộ eval, mỗi bộ gồm các cụm câu hỏi chung một trang. Mức "dính" là phần phương sai do trang gây ra (giả định). Lab đo độ lệch chuẩn thật của pass rate qua 400 bộ và so với SE ngây thơ.</p>`,
        viz(box) {
          const out = el('div');
          const st = { size: 10, icc: 0.3 };
          const draw = () => {
            const m = Math.round(300 / st.size), n = m * st.size, rnd = seeded(17);
            const sc = Math.sqrt(st.icc) * 2.2, sw = Math.sqrt(1 - st.icc) * 2.2;
            const means = [], naive = [];
            for (let t = 0; t < 400; t++) {
              let s = 0;
              for (let c = 0; c < m; c++) { const u = randn(rnd) * sc; for (let j = 0; j < st.size; j++) s += rnd() < sig(1.7 + u + randn(rnd) * sw) ? 1 : 0; }
              const p = s / n; means.push(p); naive.push(Math.sqrt(p * (1 - p) / n));
            }
            const mm = means.reduce((a, b) => a + b, 0) / 400;
            const trueSd = Math.sqrt(means.reduce((a, b) => a + (b - mm) * (b - mm), 0) / 399);
            const nv = naive.reduce((a, b) => a + b, 0) / 400;
            const ratio = trueSd / nv;
            out.replaceChildren(hbars([['SE ngây thơ (coi ' + n + ' ca độc lập)', nv * 100, false], ['Độ lệch thật qua 400 bộ', trueSd * 100, true]], { max: Math.max(nv, trueSd) * 100 * 1.1, fmt: (v) => vn(v, 2) + ' điểm' }),
              el('div', { class: 'cap', html: ratio > 1.5 ? `<b style="color:var(--bad)">SE thật lớn gấp ${vn(ratio, 1)} lần SE ngây thơ.</b> Vì sao: ${m} trang, mỗi trang ${st.size} câu; câu cùng trang cùng đúng hoặc cùng sai, nên số "mẩu thông tin độc lập" gần với ${m} hơn ${n}. Không có nghĩa nên bỏ câu: chúng vẫn giúp, chỉ ít hơn bạn tưởng. Trong hệ thống thật: resample theo nhóm, như tham số <code>clusters</code> trong <code>paired_diff_ci</code> của README.` : `SE thật gấp ${vn(ratio, 1)} lần SE ngây thơ. Khi cụm nhỏ hoặc ít dính, công thức ngây thơ gần đúng.` }));
          };
          box.append(el('div', { class: 'row' }, [slider('Câu hỏi mỗi trang', 1, 30, 1, st.size, (v) => { st.size = v; draw(); }).node, slider('Mức dính trong cụm (giả định)', 0, 0.8, 0.05, st.icc, (v) => { st.icc = v; draw(); }, (v) => vn(v, 2)).node]), out);
          draw();
        },
        take: 'Đếm số mẩu thông tin độc lập, không đếm số dòng. 300 câu về 30 trang không phải 300 phép thử độc lập.'
      },
      {
        q: 'Cùng 200 ca, sao so theo cặp lại cho khoảng hẹp hơn gần một nửa?',
        a: `<p>Vì hai phiên bản thường đúng và sai trên cùng các ca khó. Khi trừ từng ca, phần "ca này khó" triệt tiêu. README §1.4 giả định: 162 ca cả hai đúng, 22 ca cả hai sai, 10 ca chỉ v7 đúng, 6 ca chỉ v8 đúng. Hiệu số chỉ khác 0 ở 16 ca bất đồng. Kéo số ca bất đồng để thấy chỉ chúng quyết định độ rộng khoảng theo cặp.</p>`,
        viz(box) {
          const out = el('div');
          const st = { b: 10, c: 6, both: 162 };
          const draw = () => {
            const n = 200, neither = n - st.both - st.b - st.c;
            if (neither < 0) { out.innerHTML = '<div class="cap bad">Tổng vượt 200 ca, giảm bớt.</div>'; return; }
            const pB = (st.both + st.b) / n, pC = (st.both + st.c) / n, d = pC - pB;

<div class="tbl"><table><tr><th>Cách so</th><th>Hiệu số và CI 95%</th><th>Kết luận</th></tr>
<tr><td>Hai số độc lập</td><td class="mono">${pt(d)} ± ${vn(ind * 100)}</td><td>${Math.abs(d) > ind ? (d > 0 ? 'v8 tốt hơn' : 'v8 tệ hơn') : 'chưa phân biệt được'}</td></tr>
<tr class="cur"><td>Theo cặp</td><td class="mono">${pt(d)} ± ${vn(pair * 100)}</td><td>${Math.abs(d) > pair ? (d > 0 ? 'v8 tốt hơn' : 'v8 tệ hơn') : 'chưa phân biệt được'}</td></tr></table></div>` +

          };
          box.append(el('div', { class: 'row' }, [slider('Chỉ v7 đúng', 0, 40, 1, st.b, (v) => { st.b = v; draw(); }).node, slider('Chỉ v8 đúng', 0, 40, 1, st.c, (v) => { st.c = v; draw(); }).node, slider('Cả hai đúng', 100, 190, 1, st.both, (v) => { st.both = v; draw(); }).node]), out);
          draw();
        },
        take: 'So cặp miễn phí: cùng lời gọi, cùng dữ liệu, chỉ đổi cách tính.'
      },
      {
        q: 'Bootstrap theo cặp của README làm gì bên trong?',
        a: `<p><code>paired_diff_ci</code> (README §1.4) lấy hiệu số từng ca (hoặc tổng theo cụm), rút ngẫu nhiên có hoàn lại đúng số cụm đó 10.000 lần, mỗi lần tính lại hiệu số trung bình, rồi lấy phân vị 2,5% và 97,5%. Không cần giả định phân phối. Hình dưới chạy đúng thuật toán đó (2.000 lần cho nhẹ máy) trên ví dụ 162/22/10/6.</p>
<p>Đọc kết quả theo README: cả khoảng dưới 0 thì bản mới tệ hơn với độ tin cậy 95%; khoảng chứa 0 thì dữ liệu chưa đủ để kết luận theo hướng nào.</p>`,

      },
      {
        q: 'Muốn phân biệt 80% với 85% thì cần bao nhiêu ca?',

        viz(box) {

      },
      {
        q: 'Thiếu ca thì chạy mỗi ca 10 lần cho bù được không?',
        a: `<p>Chỉ bù được một phần. Phương sai của pass rate có hai phần: <b>giữa các ca</b> (câu khó, câu dễ) chia cho n, và <b>trong ca</b> (cùng câu, lần chạy khác) chia cho n × K. Tăng K chỉ làm nhỏ phần thứ hai. Miller chỉ ra khi phương sai giữa các ca chiếm phần lớn, tăng K có ít tác dụng; thêm câu hỏi hiệu quả hơn (README §1.4).</p>
<p>Hình dưới tính thật SE từ hai phần đó, với cùng ngân sách 600 lời gọi chia thành n ca × K lần.</p>`,
        viz(box) {
          const out = el('div');
          const draw = (s) => {
            const mu = muFor(0.85, s);
            const qs = ZG.map((z) => sig(mu + s * z));
            const m = qs.reduce((a, b) => a + b, 0) / qs.length;
            const between = qs.reduce((a, q) => a + (q - m) * (q - m), 0) / qs.length, within = qs.reduce((a, q) => a + q * (1 - q), 0) / qs.length;
            const rows = [1, 2, 3, 5, 10].map((K) => { const n = Math.floor(600 / K); return [n + ' ca × ' + K + ' lần', Math.sqrt(between / n + within / (n * K)) * 100, K === 1]; });
            out.replaceChildren(el('div', { class: 'stat' }, [el('span', { html: `Phần giữa các ca: <b>${vn(between / (between + within) * 100, 0)}%</b> tổng phương sai một lần chạy` })]),

        },
        take: 'K giảm nhiễu trong ca, n giảm nhiễu giữa các ca. Khi câu khó, câu dễ chênh nhau nhiều, chỉ n mới giúp (khi đo một phiên bản; câu tiếp theo là trường hợp so cặp).'
      },
      {
        q: 'Nhưng POC lại thấy K = 5 nâng power từ 14,5% lên 46% trên cùng 60 câu. Vậy K có giúp hay không?',
        a: `<p>Cả hai đúng, vì hai câu hỏi khác nhau. Câu trên đo <b>một</b> phiên bản: pass rate của v7 dao động vì câu khó, câu dễ, và K không chạm tới phần đó. Ở đây ta <b>so theo cặp</b> v8 với v7 trên cùng câu. Nếu một câu khó với v7 thì cũng khó với v8, phần "câu khó" bị trừ mất trong hiệu số. Cái còn lại trong hiệu số chủ yếu là nhiễu trong ca (lần này qua, lần sau trượt), và đó đúng là thứ K làm nhỏ đi.</p>
<p>Hình dưới chạy lại mô phỏng của hình chính (v7 80%, v8 thật sự hơn 5 điểm, độ chênh độ khó 1,5) với ba cách tiêu cùng ngân sách: 60 câu × 1 lần, 60 câu × 5 lần, 300 câu × 1 lần.</p>`,
        viz(box) {
          const cfgs = [[60, 1], [60, 5], [300, 1]];

function problem(p) {

  return el('div', { class: 'prob' }, [

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
