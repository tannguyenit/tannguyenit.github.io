const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<div class="verdict"><b>Điểm cần nhớ:</b> mỗi bước trả lời một câu hỏi khác nhau. Dataset: đo có đúng chỗ không. Grader: chấm có đúng không. k lần và CI: con số có phải nhiễu không. Theo nhóm: tổng có che chỗ hỏng không. Cổng CI: có ai lỡ merge không. A/B: những gì bộ offline chưa nghĩ tới có hỏng không.</div>`,
    why: {
      c: 'Golden dataset có version, grader code trước rồi judge, chạy baseline và candidate cùng đợt k lần, so theo cặp bằng bootstrap và báo cáo theo nhóm, cổng CI chặn khi cả khoảng tin cậy nằm dưới biên, rồi A/B cho thay đổi lớn. Lý do: mỗi bước loại một nguồn sai khác nhau (thiếu phủ, chấm sai, nhiễu, tổng che nhóm, merge vội, thiếu phân phối thật).',
      s: 'Thử vài câu rồi merge: chỉ kiểm chỗ người viết vừa nghĩ tới. Ngưỡng 100% trong CI: đỏ vì ca chập chờn, đội học cách bấm chạy lại. So hai pass rate như hai số độc lập: khoảng tin cậy rộng gần gấp đôi. Chỉ dựa vào A/B: chậm, tốn traffic thật, và khách gặp lỗi trước khi bạn thấy.',
      p: 'Phải xây và bảo trì golden dataset, mỗi sự cố thêm ít nhất một ca. Mỗi lần eval tốn số ca × số lần chạy × (chi phí hệ thống + judge). Cổng nhỏ để lọt regression nhỏ; muốn bắt chênh 1–2 điểm cần hàng nghìn ca. Judge phải được hiệu chỉnh với 100–200 nhãn người mỗi failure mode.'
    },
    deep: [
      {
        q: 'v8 trả lời đúng cả 5 câu thử, v7 trượt một câu. Vậy v8 tốt hơn chứ?',
        a: `<p>5 câu thử chỉ trả lời "v8 có làm được 5 việc này không". Câu hỏi thật là "v8 có làm hỏng việc nào khác không". Hình dưới lấy seed và ứng viên đang chọn ở hình chính, so kết luận của 5 câu demo (mỗi câu chạy 1 lần như đội thử tay) với kết luận của từng nhóm trong bộ 200 ca.</p>`,
        viz(box) {
          const out = el('div');
          const draw = (seed) => {
            const A = analyse(+seed, 'v8', 3);
            const demoSays = A.demoC - A.demoB;
            const worst = A.groups.slice().sort((a, b) => a.mean - b.mean)[0];
            out.replaceChildren(hbars([['5 câu demo, v7', A.demoB / 5 * 100, false], ['5 câu demo, v8', A.demoC / 5 * 100, true], ['Nhóm ' + worst.g.name + ', v7', worst.base * 100, false], ['Nhóm ' + worst.g.name + ', v8', worst.cand * 100, true]], { max: 100, fmt: (v) => v.toFixed(0) + '%' }),
              el('div', { class: 'cap', html: demoSays >= 0 && worst.hi < 0
                ? `<b style="color:var(--bad)">Demo nói v8 ${demoSays > 0 ? 'tốt hơn' : 'ngang'} (${A.demoC}/5 so với ${A.demoB}/5), nhóm ${worst.g.name} nói v8 tụt ${pt(-worst.mean)} điểm, CI [${pt(worst.lo)}; ${pt(worst.hi)}].</b> Vì sao: 5 câu demo không có câu nào thuộc nhóm ${worst.g.name}; phần prompt bị rút gọn chỉ ảnh hưởng nhóm đó. Không có nghĩa demo sai: v8 đúng là trả lời tốt 5 câu ấy. Trong hệ thống thật: bộ ca phủ mọi nhóm câu hỏi, kể cả nhóm không liên quan tới chỗ vừa sửa (README §1.1, ảnh hưởng không cục bộ).`
                : `Với seed này 5 câu demo cho ${A.demoC}/5 và ${A.demoB}/5. Thử seed khác: kết luận của 5 câu đổi theo may rủi, còn nhóm ${worst.g.name} vẫn tụt ${pt(-worst.mean)} điểm.` }));
          };
          box.append(el('div', { class: 'row' }, [select('Seed', [['1', '1'], ['2', '2'], ['3', '3'], ['4', '4']], '4', draw).node]), out);
          draw('4');
        },
        take: 'Câu demo kiểm tra chỗ bạn nghĩ tới. Regression nằm ở chỗ bạn không nghĩ tới.'
      },
      {
        q: 'Vậy golden dataset lấy câu ở đâu, và bao nhiêu câu là đủ?',
        a: `<p>README §3.1 xếp nguồn theo ưu tiên: (1) trace production đã ẩn danh, vì nó có câu không dấu, viết tắt, hỏi nhiều ý; (2) lỗi đã biết từ ticket, khiếu nại, mỗi sự cố thêm ít nhất một ca; (3) ca biên và đối kháng; (4) dữ liệu synthetic khi chưa có traffic, vì nó "sạch" và "điển hình" hơn câu thật.</p>
<p>Về số lượng: bắt đầu 20–50 ca từ lỗi thật. Nhưng phải <b>phủ theo nhóm</b>: README ví dụ 500 ca mà 480 ca là tra cứu đơn thì nhóm đổi trả chỉ còn 20 ca. Kéo thanh để xem khoảng tin cậy ±1,96·SE của pass rate trong từng nhóm (giả định pass rate 85%).</p>`,
        viz(box) {
          const out = el('div');
          const draw = (share) => {
            const total = 500, nRet = Math.max(1, Math.round(total * share / 100)), nOrd = total - nRet;
            const half = (n) => 1.96 * Math.sqrt(0.85 * 0.15 / n);
            out.replaceChildren(hbars([['Tra cứu đơn (' + nOrd + ' ca)', half(nOrd) * 100, false], ['Đổi trả (' + nRet + ' ca)', half(nRet) * 100, true]], { max: 40, fmt: (v) => '±' + v.toFixed(1) + ' điểm' }),
              el('div', { class: 'cap', html: half(nRet) > 0.1 ? `<b style="color:var(--warn)">Tổng 500 ca nghe nhiều, nhưng nhóm đổi trả chỉ ${nRet} ca, khoảng tin cậy ±${(half(nRet) * 100).toFixed(1)} điểm.</b> Một regression 15 điểm ở nhóm này có thể không thấy được. Trong hệ thống thật: báo cáo pass rate theo nhóm và bổ sung ca cho nhóm mỏng.` : `Nhóm đổi trả có ${nRet} ca, khoảng tin cậy ±${(half(nRet) * 100).toFixed(1)} điểm: đủ để thấy regression lớn trong nhóm.` }));
          };
          box.append(el('div', { class: 'row' }, [slider('Tỉ lệ ca đổi trả trong 500 ca', 1, 50, 1, 4, draw, (v) => v + '%').node]), out);
          draw(4);
        },
        take: 'Đếm ca theo nhóm, không chỉ tổng. Nhóm mỏng là nhóm mà regression trốn được.'
      },
      {
        q: 'Ai chấm 200 ca đó? Người đọc hết à?',
        a: `<p>README §2.1: dùng code cho mọi thứ kiểm được bằng code, chỉ gọi judge cho phần còn lại. Code nhanh, rẻ, tái lập được, không có thiên lệch kiểu LLM; nhược điểm là giòn. Ở bước 2 của hình chính, bốn tiêu chí của <code>grade_refund_answer</code> chạy thật trên câu trả lời, còn tiêu chí "áp dụng đúng chính sách đổi trả" cần đọc hiểu nên giao cho judge.</p>

<tr><td>Văn bản tự do</td><td>Judge nhị phân theo từng tiêu chí, đã hiệu chỉnh với nhãn người</td><td>Người duyệt mẫu định kỳ</td></tr>
<tr><td>Giọng điệu, an toàn</td><td>Judge hoặc classifier</td><td>Người duyệt ca judge không chắc</td></tr></table></div>
<p>Người vẫn có mặt: Hamel Husain khuyên tự đọc ít nhất 30 trace để tìm failure mode, và cần khoảng 100–200 nhãn người cho mỗi failure mode để hiệu chỉnh judge (README Tra cứu nhanh). Judge chưa từng so với nhãn người là "một con số không ai biết có ý nghĩa gì" (README §1.2).</p>`,

      {
        q: 'Sao phải chạy mỗi ca k lần? Chạy một lần không đủ à?',
        a: `<p>Output không tất định, kể cả ở cấu hình gọi là tất định: Atil và cộng sự (2024) chạy 5 LLM với temperature 0, seed cố định, mỗi tác vụ 10 lần, độ chính xác dao động tới 15% giữa các lần chạy (README §1.1). Với một lần chạy, một ca "qua" có thể chỉ là lần may mắn.</p>
<p>Hình dưới đếm số ca chập chờn (qua ở lần này, trượt ở lần khác) trong 200 ca của v7 khi tăng k. Với k = 1 bạn không thể thấy ca nào chập chờn.</p>`,
        viz(box) {

        },
        take: 'Một lần chạy cho biết hệ thống có thể làm đúng, không cho biết nó làm đúng bao nhiêu phần trăm số lần.'
      },
      {
        q: 'v7 86%, v8 84%. Chênh 2 điểm thì có nghĩa gì không?',
        a: `<p>Đó đúng là tình huống thứ hai ở đầu README. Câu trả lời phụ thuộc cách so. README §1.4 giả định 200 câu: 162 câu cả hai đúng, 22 câu cả hai sai, 10 câu chỉ v7 đúng, 6 câu chỉ v8 đúng. Hình dưới tính thật hai cách từ đúng các con số đó.</p>`,
        viz(box) {
          const d = [].concat(Array(162).fill(0), Array(22).fill(0), Array(10).fill(-1), Array(6).fill(1));
          const b = [].concat(Array(162).fill(1), Array(22).fill(0), Array(10).fill(1), Array(6).fill(0));
          const c = [].concat(Array(162).fill(1), Array(22).fill(0), Array(10).fill(0), Array(6).fill(1));
          const nb = normCI(b), nc = normCI(c), nd = normCI(d);
          const ind = 1.96 * Math.sqrt(0.86 * 0.14 / 200 + 0.84 * 0.16 / 200);
          const bt = boot(d, 4000, 7);
          box.append(el('div', { class: 'tbl' }, [el('table', { html: `<tr><th>Cách so</th><th>Hiệu số</th><th>Khoảng tin cậy 95%</th><th>Chứa 0?</th></tr>
<tr><td>Hai số độc lập</td><td class="mono">${pt(nc.m - nb.m)}</td><td class="mono">${pt(nc.m - nb.m)} ± ${(ind * 100).toFixed(1)}</td><td>có</td></tr>
<tr class="cur"><td>Theo cặp, xấp xỉ chuẩn</td><td class="mono">${pt(nd.m)}</td><td class="mono">${pt(nd.m)} ± ${(nd.half * 100).toFixed(1)}</td><td>${nd.m - nd.half < 0 && nd.m + nd.half > 0 ? 'có' : 'không'}</td></tr>

            el('div', { class: 'cap', html: `README ghi −2 ± 7,0 điểm (độc lập) và −2 ± 3,9 điểm (theo cặp); lab tính lại ra ±${(ind * 100).toFixed(1)} và ±${(nd.half * 100).toFixed(1)}. 184 câu hai bản cùng đúng hoặc cùng sai cho hiệu số 0, chỉ 16 câu bất đồng mang thông tin. Cả hai khoảng đều chứa 0: chưa đủ bằng chứng là khác nhau, <b>không</b> có nghĩa là bằng nhau.` }));

      {

      {
        q: 'Sao cổng CI không đặt "pass rate phải đạt 95%" cho đơn giản?',

<p>Còn một lựa chọn: chặn khi <code>hi &lt; −MARGIN</code> (chắc chắn tụt quá biên) hay khi <code>lo &lt; −MARGIN</code> (chưa chứng minh được là không tụt quá biên). Hình dưới chạy cả hai luật trên v8.1, bản đã sửa, với các cỡ dataset khác nhau (lấy mẫu con từ 200 ca).</p>`,

      output: "Dữ liệu: 200 ca ShopViet TỔNG HỢP (numpy, seed 4). Xác suất đúng mỗi ca do mô hình logistic giả định\nsinh ra; v8 làm hỏng nhóm Đổi trả (hiệu ứng ẩn -2.3 logit). Không gọi model thật.\n\n== 1. Golden dataset ==\nNhóm           Số ca\n-------------  -----\nTra cứu đơn    70   \nĐổi trả        30   \nBảo hành       25   \nSo sánh SP     35   \nCửa hàng       20   \nNgoài phạm vi  20   \nTổng           200  \n\n== 2. Grader code README §2.1 trên 3 câu trả lời VIẾT TAY cho đơn SV-4821 ==\nBản   Ký tự  mentions_order_id  mentions_invoice_check  no_internal_url  within_length\n----  -----  -----------------  ----------------------  ---------------  -------------\nv7    173    pass               pass                    pass             pass         \nv8    102    pass               FAIL                    pass             pass         \nv8.1  135    pass               pass                    pass             pass         \n\n== 3. 'Thử 5 câu' của đội (không câu nào thuộc nhóm Đổi trả), mỗi câu chạy 1 lần ==\nCa    Nhóm      v7  v8\n----  --------  --  --\nC001  order     1   1 \nC126  compare   1   0 \nC127  compare   1   1 \nC151  compare   1   1 \nC101  warranty  1   1 \nTổng: v7 5/5, v8 4/5\n\n== 4. Chạy cả 200 ca × 3 lần, so theo cặp (bootstrap README §1.4, 10.000 lần) ==\n\nv8 so với v7:\nNhóm           n    v7     v8     Hiệu số  CI95            \n-------------  ---  -----  -----  -------  ----------------\nTra cứu đơn    70   84.8%  88.6%  +0.038   [-0.033, +0.110]\nĐổi trả        30   83.3%  42.2%  -0.411   [-0.533, -0.289]\nBảo hành       25   82.7%  94.7%  +0.120   [+0.027, +0.214]\nSo sánh SP     35   72.4%  81.9%  +0.095   [-0.019, +0.219]\nCửa hàng       20   95.0%  93.3%  -0.017   [-0.067, +0.033]\nNgoài phạm vi  20   71.7%  70.0%  -0.017   [-0.117, +0.083]\nTổng           200  81.8%  79.8%  -0.020   [-0.068, +0.028]\n\nv8.1 so với v7:\nNhóm           n    v7     v8.1   Hiệu số  CI95            \n-------------  ---  -----  -----  -------  ----------------\nTra cứu đơn    70   84.8%  91.4%  +0.067   [+0.010, +0.129]\nĐổi trả        30   83.3%  85.6%  +0.022   [-0.056, +0.100]\nBảo hành       25   82.7%  89.3%  +0.067   [-0.013, +0.147]\nSo sánh SP     35   72.4%  86.7%  +0.143   [+0.048, +0.248]\nCửa hàng       20   95.0%  96.7%  +0.017   [-0.033, +0.083]\nNgoài phạm vi  20   71.7%  83.3%  +0.117   [-0.050, +0.300]\nTổng           200  81.8%  89.2%  +0.073   [+0.037, +0.110]\n\n== 5. Cổng CI: chạy eval_gate.py của README §3.4 trên file JSONL thật ==\n\n$ python eval_gate.py v7.jsonl v8.jsonl\ncompare              n=  35 diff=+0.095 CI95=[-0.019, +0.219]\nedge                 n=  20 diff=-0.017 CI95=[-0.117, +0.083]\norder                n=  70 diff=+0.038 CI95=[-0.033, +0.110]\nreturn               n=  30 diff=-0.411 CI95=[-0.533, -0.289]\nstore                n=  20 diff=-0.017 CI95=[-0.067, +0.033]\nwarranty             n=  25 diff=+0.120 CI95=[+0.027, +0.214]\n__all__              n= 200 diff=-0.020 CI95=[-0.068, +0.028]\n-> exit code 1\n\n$ python eval_gate.py v7.jsonl v8.1.jsonl\ncompare              n=  35 diff=+0.143 CI95=[+0.048, +0.248]\nedge                 n=  20 diff=+0.117 CI95=[-0.050, +0.300]\norder                n=  70 diff=+0.067 CI95=[+0.010, +0.129]\nreturn               n=  30 diff=+0.022 CI95=[-0.056, +0.100]\nstore                n=  20 diff=+0.017 CI95=[-0.033, +0.083]\nwarranty             n=  25 diff=+0.067 CI95=[-0.013, +0.147]\n__all__              n= 200 diff=+0.073 CI95=[+0.037, +0.110]\n-> exit code 0\n\n$ python eval_gate.py v7.jsonl v8.1_thieu_2_ca.jsonl\ncase không khớp: thiếu ['C199', 'C200'], thừa []\n-> exit code 2\n\nRút ra: 5 câu quen tay không chạm nhóm Đổi trả, chênh 1 câu ở đó là nhiễu của một lần chạy. Grader bắt v8\nthiếu bước hoá đơn, bootstrap theo nhóm thấy Đổi trả tụt ~41 điểm dù tổng chỉ -2, và cùng một eval_gate.py\ntrả 1 cho v8, 0 cho v8.1, 2 khi thiếu ca. Lưu ý: Bảo hành của v8 có CI > 0 dù hiệu ứng ẩn = 0: so 7 dòng thì\nmột dòng 'có ý nghĩa' vì may là chuyện bình thường.",
      measured: true,
      read: ["Dòng đầu: \"hiệu ứng ẩn −2,3 logit\" là cách mô phỏng làm v8 tệ đi ở nhóm Đổi trả. Logit là thang đo trước khi đổi ra xác suất; với ca mà v7 đúng 88%, trừ 2,3 logit còn khoảng 43%. Đó là con số người viết POC đặt ra, không phải số đo.", "Bảng grader: chỉ v8 FAIL <code>mentions_invoice_check</code>, đúng lỗi bỏ bước kiểm tra hoá đơn.", "Bảng v8 so với v7: tổng −2 điểm với CI chứa 0, nhưng Đổi trả −41 điểm với CI nằm hẳn dưới 0. Báo cáo theo nhóm mới thấy.", "Ba lệnh <code>eval_gate.py</code>: exit 1 cho v8, 0 cho v8.1, 2 khi file candidate thiếu 2 ca.", "Bảo hành của v8 có CI &gt; 0 dù hiệu ứng ẩn bằng 0: so 7 dòng thì một dòng \"có ý nghĩa\" vì may là bình thường.", "Mục 3 ngược với hình chính: ở seed 4 của POC, 5 câu demo cho <b>v7 5/5, v8 4/5</b>, tức v8 trông <i>tệ hơn</i>; ở seed 4 của lab thì v8 5/5, v7 4/5. Vì sao: mỗi câu chạy 1 lần, nên chỉ một câu so sánh sản phẩm (C126) trượt do may rủi là đủ đảo kết luận, dù ở nhóm đó v8 thật ra tốt hơn trung bình. Không có nghĩa POC hay lab sai: hai bộ sinh số ngẫu nhiên khác nhau (numpy và JavaScript) nên cùng số seed vẫn ra kết quả khác. Đó chính là bài học: kết luận của 5 câu đổi theo seed, còn kết luận theo nhóm của 200 ca (Đổi trả tụt mạnh, cổng exit 1) giữ nguyên ở cả hai. Trong hệ thống thật: không quyết định dựa trên vài câu chạy một lần, dù chúng nói tốt hay xấu."]
    },
    mount(stage) {
      const st = { step: 0, seed: 4, cand: 'v8', k: 3, strict: false, abN: 4000, abP: 0.12 };
      const ctl = el('div', { class: 'row' });
      const nav = el('div', { class: 'row' });
      const body = el('div');
      const cap = el('div', { style: 'margin-top:10px;font-size:13.5px' });
      const foot = el('div', { class: 'stat', style: 'border-top:1px solid var(--line);padding-top:8px;margin-top:12px' });
      const box = (color, html) => `<div style="border-left:3px solid ${color};background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:6px">${html}</div>`;
      let A = null, key = '';
      ctl.append(select('Seed', [['1', 'seed 1'], ['2', 'seed 2'], ['3', 'seed 3'], ['4', 'seed 4']], '4', (v) => { st.seed = +v; draw(); }).node,
        select('Ứng viên', [['v8', CANDS.v8.name], ['v81', CANDS.v81.name]], 'v8', (v) => { st.cand = v; draw(); }).node,
        slider('k lần chạy mỗi ca', 1, 5, 1, 3, (v) => { st.k = v; draw(); }).node);

      function abSim(nPerArm, p1, p2, days, sims, seed) {
        const rnd = seeded(seed);
        const per = nPerArm / days;
        let peekHit = 0, endHit = 0;
        for (let s = 0; s < sims; s++) {
          let x1 = 0, x2 = 0, n = 0, stopped = false, zEnd = 0;
          for (let dd = 0; dd < days; dd++) {
            x1 += Math.max(0, Math.round(per * p1 + randn(rnd) * Math.sqrt(per * p1 * (1 - p1))));
            x2 += Math.max(0, Math.round(per * p2 + randn(rnd) * Math.sqrt(per * p2 * (1 - p2))));
            n += per;
            const q1 = x1 / n, q2 = x2 / n, se = Math.sqrt((q1 * (1 - q1) + q2 * (1 - q2)) / n) || 1e-9;
            const z = (q2 - q1) / se;
            if (!stopped && Math.abs(z) > 1.96) stopped = true;
            zEnd = z;
          }
          if (stopped) peekHit++;
          if (Math.abs(zEnd) > 1.96) endHit++;
        }
        return { peek: peekHit / sims, end: endHit / sims };
      }

      function draw() {
        const k2 = [st.seed, st.cand, st.k].join('|');
        if (k2 !== key) { A = analyse(st.seed, st.cand, st.k); key = k2; }
        const s = STEPS[st.step];
        nav.replaceChildren(...STEPS.map((x, i) => el('button', { class: i === st.step ? 'on' : '', text: x.name, onclick: () => { st.step = i; draw(); } })),
          el('button', { text: 'Bước tiếp', onclick: () => { st.step = Math.min(STEPS.length - 1, st.step + 1); draw(); } }));
        const parts = [];
        body.replaceChildren();
        const g = gate(A, st.strict);
        const ret = A.groups.find((x) => x.g.id === 'return');

        if (s.key === 'data') {
          body.append(el('h4', { style: 'margin:0 0 6px;font-size:13px', text: 'Golden dataset v12: 200 ca, 6 nhóm (dữ liệu giả lập theo seed)' }),
            hbars(GROUPS.map((x) => [x.name, x.n, x.id === 'return']), { max: 80, fmt: (v) => v + ' ca' }),
            el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Ca</th><th>Nhóm</th><th>Câu hỏi của khách</th></tr>' + A.cases.filter((c) => c.demo || c.gi < 1).map((c) => `<tr class="${c.demo ? 'cur' : ''}"><td class="mono">${c.cid}</td><td>${GROUPS.find((x) => x.id === c.g).name}</td><td>${esc(c.q)}${c.demo ? ' <b>(demo)</b>' : ''}</td></tr>`).join('') })]));
          parts.push(box('var(--warn)', `<b>5 câu demo nằm ở ${new Set(A.cases.filter((c) => c.demo).map((c) => c.g)).size} nhóm, không câu nào ở nhóm Đổi trả.</b> Đó là 5 câu đội quen thử. Phần prompt bị rút gọn trong v8 là đoạn hướng dẫn đổi trả. Trong hệ thống thật: dataset lấy từ trace production và lỗi đã biết, phủ mọi nhóm, có version (README §3.1).`));
        }

        if (s.key === 'grade') {
          const ans = { base: ANSWERS.base, cand: ANSWERS[st.cand] };
          const rows = [['v7 (baseline)', ans.base, JUDGE.base], [CANDS[st.cand].name, ans.cand, JUDGE[st.cand]]];
          body.append(el('div', { class: 'hint', style: 'margin:0 0 6px', html: 'Ca C071 (nhóm Đổi trả): <b>Tai nghe đơn SV-4821 bị rè, đổi được không?</b> · <code>max_chars</code> = ' + MAX_CHARS + ' (giả định, chính sách của sản phẩm ví dụ)' }),
            el('div', { class: 'cols' }, rows.map(([n, t, j]) => {
              const gr = gradeRefund(t, 'SV-4821');
              return el('div', {}, [el('h4', { html: esc(n) + ` <small>${t.length} ký tự</small>` }),
                el('div', { style: 'font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px', text: t }),
                el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Tiêu chí</th><th>Grader</th><th>Kết quả</th></tr>' + gr.map(([c, ok]) => `<tr><td class="mono">${c}</td><td>code</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'pass' : 'fail'}</td></tr>`).join('') + `<tr><td>áp dụng đúng chính sách đổi trả</td><td>judge (mô phỏng)</td><td class="${j[0] ? 'ok' : 'bad'}">${j[0] ? 'pass' : 'fail'}: ${esc(j[1])}</td></tr>` })])]);
            })));
          const candInv = gradeRefund(ans.cand, 'SV-4821')[1][1];
          if (st.cand === 'v8') parts.push(box('var(--bad)', '<b>v8 ngắn hơn, lịch sự, có mã đơn, không lộ URL nội bộ, vẫn fail.</b> Vì sao: câu trả lời bỏ bước "kiểm tra hoá đơn còn hạn". Đọc lướt thì thấy hay hơn v7 vì gọn. Không có nghĩa câu ngắn là xấu: mỗi tiêu chí được chấm riêng, và chỉ đúng tiêu chí này hỏng. Trong hệ thống thật: viết tiêu chí trước khi nhìn output của bản mới (README §1.1, §1.3).'));
          else parts.push(box('var(--ok)', `v8.1 viết "hóa đơn" (dấu sắc trên chữ o), v7 viết "hoá đơn" (dấu sắc trên chữ a). Grader làm hai việc: chuẩn hoá NFC (đưa mỗi chữ có dấu về một dạng lưu duy nhất trong máy), rồi tìm <b>cả hai</b> chuỗi "hoá đơn" và "hóa đơn". Kết quả: <b>${candInv ? 'pass' : 'fail'}</b>. NFC không biến "hóa" thành "hoá": đó là hai cách viết khác nhau, nên phải liệt kê cả hai. README §2.1: nếu chỉ tìm một biến thể, grader sẽ chấm sai câu đúng một cách có hệ thống. Lab 03 đi sâu phần này.`));
        }

        if (s.key === 'run') {
          body.append(el('div', { class: 'cols' }, [
            el('div', {}, [el('h4', { html: `v7, ${st.k} lần mỗi ca <small>pass rate ${pc(A.baseRate)}, ${A.flakyB} ca chập chờn</small>` }), cellGrid(A.res, (r) => ({ col: scoreCol(r.b), t: 'v7 qua ' + Math.round(r.b * st.k) + '/' + st.k }))]),
            el('div', {}, [el('h4', { html: `${esc(CANDS[st.cand].name.split(':')[0])}, ${st.k} lần mỗi ca <small>pass rate ${pc(A.candRate)}, ${A.flakyC} ca chập chờn</small>` }), cellGrid(A.res, (r) => ({ col: scoreCol(r.cs), t: 'ứng viên qua ' + Math.round(r.cs * st.k) + '/' + st.k }))])]),
            el('div', { class: 'legend' }, [el('span', { html: '<i style="background:var(--ok)"></i>qua mọi lần' }), el('span', { html: '<i style="background:var(--warn)"></i>chập chờn' }), el('span', { html: '<i style="background:var(--bad)"></i>trượt mọi lần' }), el('span', { html: '<i style="background:transparent;outline:2px solid var(--ink)"></i>câu demo' })]));
          if (A.demoC >= A.demoB && A.candRate < A.baseRate) parts.push(box('var(--bad)', `<b>5 câu demo (1 lần chạy): v7 ${A.demoB}/5, ứng viên ${A.demoC}/5. Bộ đầy đủ: v7 ${pc(A.baseRate)}, ứng viên ${pc(A.candRate)}.</b> Vì sao: demo nằm ở nhóm ứng viên làm tốt hơn hoặc như cũ; cả khối Đổi trả đổi màu mà không ô demo nào ở đó. Không có nghĩa demo nói dối: nó trả lời một câu hỏi hẹp hơn. Trong hệ thống thật: chạy baseline và candidate trên cùng bộ, cùng cấu hình, cùng đợt (README §3.3).`));
          else parts.push(box('var(--warn)', `5 câu demo: v7 ${A.demoB}/5, ứng viên ${A.demoC}/5. Bộ đầy đủ: v7 ${pc(A.baseRate)}, ứng viên ${pc(A.candRate)}. ${st.k === 1 ? 'Với k = 1, không ô nào màu cam: một lần chạy không lộ ca chập chờn.' : 'Ô cam là ca chập chờn: cùng câu, cùng prompt, lúc qua lúc trượt.'} Hai pass rate vẫn chưa nói được chênh lệch có thật không; xem bước 4.`));
        }

        if (s.key === 'pair' || s.key === 'gate') {
          const rows = A.groups.map((x) => ({ label: x.g.name + ' (' + x.n + ')', mean: x.mean, lo: x.lo, hi: x.hi })).concat([{ label: 'Tổng (' + A.res.length + ')', mean: A.all.mean, lo: A.all.lo, hi: A.all.hi }]);
          body.append(el('h4', { style: 'margin:0 0 4px;font-size:13px', text: 'Hiệu số ứng viên − v7 theo cặp, CI 95% bằng bootstrap (điểm %)' }), ciPlot(rows));
          if (s.key === 'pair') {
            body.append(el('div', { class: 'stat' }, [el('span', { html: `Hiệu số tổng: <b>${pt(A.all.mean)}</b> điểm` }), el('span', { html: `CI theo cặp: <b>[${pt(A.all.lo)}; ${pt(A.all.hi)}]</b>` }), el('span', { html: `Nếu so như hai số độc lập: <b>±${(A.indepHalf * 100).toFixed(1)}</b> thay vì ±${(A.pairedHalf * 100).toFixed(1)}` })]));
            if (A.all.lo < 0 && A.all.hi > 0 && ret.hi < 0) parts.push(box('var(--bad)', `<b>Tổng: CI [${pt(A.all.lo)}; ${pt(A.all.hi)}] chứa 0. Nhóm Đổi trả: tụt ${pt(-ret.mean)} điểm, CI [${pt(ret.lo)}; ${pt(ret.hi)}] nằm hẳn dưới 0.</b> Vì sao: nhóm So sánh sản phẩm tăng, bù gần hết cho nhóm Đổi trả trong con số tổng. Không có nghĩa v8 "ngang v7": khách hỏi đổi trả gặp bản tệ hơn hẳn. Trong hệ thống thật: báo cáo theo nhóm và đọc transcript mọi ca đổi từ pass sang fail (README §3.3).`));
            else if (ret.hi < 0) parts.push(box('var(--bad)', `<b>Nhóm Đổi trả tụt ${pt(-ret.mean)} điểm, CI [${pt(ret.lo)}; ${pt(ret.hi)}].</b> Ở seed này tổng cũng thấy được, nhưng con số tổng ${pt(A.all.mean)} điểm nhỏ hơn nhiều so với mức tụt thật của nhóm.`));
            else parts.push(box('var(--ok)', `Không nhóm nào có CI nằm hẳn dưới 0. Khoảng của nhóm nhỏ rộng hơn tổng vì ít ca hơn: nhóm 20 ca rộng hơn hẳn nhóm 70 ca.`));
          } else {
            const strictCtl = select('Luật chặn', [['0', 'README: hi < −2 điểm'], ['1', 'Chặt: lo < −2 điểm']], st.strict ? '1' : '0', (v) => { st.strict = v === '1'; draw(); });
            const lines = g.rows.map((r) => `${r.name.padEnd(20)} n=${String(r.n).padStart(4)} diff=${(r.mean >= 0 ? '+' : '') + r.mean.toFixed(3)} CI95=[${(r.lo >= 0 ? '+' : '') + r.lo.toFixed(3)}, ${(r.hi >= 0 ? '+' : '') + r.hi.toFixed(3)}]${r.fail ? '   <- chặn' : ''}`).join('\n');
            body.append(el('div', { class: 'row', style: 'margin-top:8px' }, [strictCtl.node]),
              el('div', { class: 'mono', style: 'white-space:pre;overflow-x:auto;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px', text: '$ python eval_gate.py base.jsonl cand.jsonl\n' + lines + '\nexit ' + g.code }));
            const allRow = g.rows[g.rows.length - 1];
            if (g.code && !allRow.fail) parts.push(box('var(--bad)', `<b>Exit 1: chặn merge, dù dòng __all__ không bị chặn.</b> Vì sao: cổng lặp qua từng nhóm; ${g.rows.filter((r) => r.fail).map((r) => r.name).join(', ')} có ${st.strict ? 'cận dưới' : 'cả khoảng tin cậy'} dưới −2 điểm. Nếu cổng chỉ nhìn tổng, v8 đã được merge. Trong hệ thống thật: cổng xét từng nhóm, và thoát mã 2 nếu hai file không cùng tập case (README §3.4).`));
            else if (g.code) parts.push(box('var(--bad)', `<b>Exit 1: chặn merge.</b> ${g.rows.filter((r) => r.fail).map((r) => r.name).join(', ')} bị chặn. ${st.strict && st.cand === 'v81' ? 'v8.1 không có regression thật; luật chặt chặn vì khoảng tin cậy của nhóm nhỏ rộng, cận dưới chạm qua −2 điểm. Đó là giá của luật chặt với bộ nhỏ (README §3.4).' : ''}`));
            else parts.push(box('var(--ok)', `Exit 0: cho merge. Không dòng nào có ${st.strict ? 'cận dưới' : 'cả khoảng'} dưới −2 điểm. Đây không phải bằng chứng ứng viên tốt hơn, chỉ là không có bằng chứng tệ đi quá biên. Bước tiếp theo cho thay đổi lớn: A/B.`));
          }
        }

        if (s.key === 'ab') {
          const p1 = 0.12, p2 = st.abP, n = st.abN;
          const se = Math.sqrt(p1 * (1 - p1) / n + p2 * (1 - p2) / n), diff = p2 - p1;
          const sim = abSim(n, 0.12, 0.12, 14, 300, 99);
          body.append(el('div', { class: 'row' }, [slider('Hội thoại mỗi nhánh', 500, 20000, 500, st.abN, (v) => { st.abN = v; draw(); }).node,
            slider('Tỉ lệ chuyển nhân viên thật của ứng viên', 0.08, 0.2, 0.005, st.abP, (v) => { st.abP = v; draw(); }, (v) => pc(v, 1)).node]),
            el('div', { class: 'stat' }, [el('span', { html: `v7: <b>12,0%</b> (giả định, theo ví dụ đầu README)` }), el('span', { html: `Hiệu số kỳ vọng: <b>${pt(diff)}</b> điểm` }), el('span', { html: `CI 95% khi đủ cỡ mẫu: <b>±${(1.96 * se * 100).toFixed(2)}</b> điểm` })]),
            el('h4', { style: 'margin:12px 0 4px;font-size:13px', text: 'Hai bản thật ra như nhau (12% và 12%), 300 A/B mô phỏng, chạy 14 ngày' }),
            hbars([['Xem một lần cuối ngày 14', sim.end * 100, false], ['Xem mỗi ngày, dừng khi |z| > 1,96', sim.peek * 100, true]], { max: 50, fmt: (v) => v.toFixed(1) + '% báo "khác nhau"' }));
          if (gate(A, false).code) parts.push(box('var(--warn)', `Ứng viên đang chọn chưa qua cổng CI ở bước 5. A/B chỉ chạy sau khi offline không cho thấy regression; chọn v8.1 để đi tiếp.`));
          parts.push(sim.peek > 0.1
            ? box('var(--bad)', `<b>Xem kết quả mỗi ngày và dừng khi thấy "có ý nghĩa": ${pc(sim.peek, 0)} số A/B báo khác nhau, dù hai bản giống hệt nhau.</b> Xem một lần lúc kết thúc: ${pc(sim.end, 0)}, gần mức 5% danh nghĩa. (z là hiệu số chia cho sai số chuẩn của nó; |z| &gt; 1,96 là mốc "có ý nghĩa" ứng với khoảng tin cậy 95%.) Vì sao: mỗi lần nhìn là một cơ hội thêm để nhiễu vượt ngưỡng. Không có nghĩa không được theo dõi A/B: theo dõi để phát hiện sự cố, không để quyết định sớm. Trong hệ thống thật: quyết định cỡ mẫu và metric chính trước khi bắt đầu, không dừng sớm khi thấy kết quả đẹp (README §3.5).`)
            : box('var(--ok)', `Xem mỗi ngày: ${pc(sim.peek, 0)} báo khác nhau; xem một lần: ${pc(sim.end, 0)}.`));
          if (Math.abs(diff) > 1e-9 && Math.abs(diff) < 1.96 * se) parts.push(box('var(--warn)', `Với ${n.toLocaleString('vi-VN')} hội thoại mỗi nhánh, chênh ${pt(diff)} điểm nằm trong ±${(1.96 * se * 100).toFixed(2)}: A/B này nhiều khả năng không thấy được nó. Tăng số hội thoại hoặc chấp nhận rằng chênh lệch nhỏ hơn mức đo được.`));
        }

        cap.innerHTML = parts.join('');
        const gg = gate(A, st.strict);
        foot.innerHTML = `<span>5 câu demo: <b>v7 ${A.demoB}/5 · ứng viên ${A.demoC}/5</b></span><span>Bộ đầy đủ: <b class="${A.all.hi < 0 ? 'bad' : A.all.lo > 0 ? 'ok' : ''}">${pt(A.all.mean)} [${pt(A.all.lo)}; ${pt(A.all.hi)}]</b></span><span>Đổi trả: <b class="${ret.hi < 0 ? 'bad' : ''}">${pt(ret.mean)}</b></span><span>Cổng CI: <b class="${gg.code ? 'bad' : 'ok'}">exit ${gg.code}</b></span>`;
      }

      stage.append(ctl, nav, body, cap, foot,
        el('p', { class: 'hint', text: 'Dữ liệu giả lập: mỗi ca có độ khó ngẫu nhiên theo seed, xác suất qua của mỗi bản là hàm logistic của độ khó cộng hiệu ứng theo nhóm (v8: Đổi trả giảm mạnh, So sánh sản phẩm tăng; v8.1: chỉ còn phần tăng). Bootstrap, cổng CI và mô phỏng A/B tính thật trong trình duyệt. Grader code chạy thật trên câu trả lời; judge là mô phỏng, không gọi model. Tỉ lệ chuyển nhân viên 12% và max_chars là giả định.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
