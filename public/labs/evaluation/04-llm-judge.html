const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

  function makePairs(seed) {
    const rnd = seeded(seed);
    return Array.from({ length: N }, (_, i) => {
      const m = randn(rnd) * 0.7 - 0.15;
      const l1 = Math.round(50 + rnd() * 50), l2 = Math.round(l1 + 25 + rnd() * 70);
      const human = m > T ? 'v8' : m < -T ? 'v7' : 'tie';
      return { i, q: QS[i % QS.length], m, l1, l2, human, z1: randn(rnd), z2: randn(rnd) };
    });
  }

  function judgeOne(p, v8First, o) {
    const qX = v8First ? p.m : 0, qY = v8First ? 0 : p.m;
    const lX = v8First ? p.l2 : p.l1, lY = v8First ? p.l1 : p.l2;
    const parts = { q: qX - qY, pos: o.pos, verb: o.verb * (lX - lY) / 60, self: o.self ? o.selfS * (v8First ? 1 : -1) : 0, noise: o.noise * (v8First ? p.z1 : p.z2) };
    const s = parts.q + parts.pos + parts.verb + parts.self + parts.noise;

    cls.forEach((c) => { pe += (h.filter((x) => x === c).length / n) * (j.filter((x) => x === c).length / n); });

  }

<ul><li><b>Gấp đôi lời gọi judge:</b> 40 cặp thành 80 lời gọi.</li>
<li><b>Nhiều hoà hơn:</b> cặp có chênh lệch thật nhỏ hơn thiên lệch vị trí bị đẩy thành hoà. Ví dụ chênh thật +0,2 cho v8, vị trí +0,6 cho ô A: lần 1 (v8 ở A) điểm +0,8 → chọn v8; lần 2 (v7 ở A) điểm −0,2 + 0,6 = +0,4 → chọn v7. Hai lần ngược nhau → hoà. Trong POC (judge mô phỏng, thiên lệch vị trí 0,6), đảo thứ tự biến <b>28–32/40 cặp</b> thành hoà, trong khi người chỉ hoà 18/40. Bạn mất tín hiệu ở đúng những cặp khó phân biệt nhất.</li>
<li><b>Không chữa được thiên lệch đi theo câu trả lời:</b> độ dài và tự ưu ái gắn với chính câu v8, không với ô A. Đảo thứ tự thì chúng đi theo v8 sang ô B. Chọn chế độ "Hai lần đảo thứ tự" trong lab, bật thiên lệch độ dài cao, và thấy judge vẫn nghiêng về v8. POC: với vị trí + độ dài + tự ưu ái, sau khi đảo thứ tự judge vẫn cho v8 thắng 12 cặp, người chỉ cho 7.</li></ul>`,
        take: 'Đảo thứ tự chỉ khử thiên lệch gắn với vị trí. Thiên lệch gắn với nội dung (độ dài, họ model) cần cách khác.'
      },
      {
        q: 'Làm sao biết judge của mình có thiên lệch độ dài, khi câu dài thường cũng là câu đầy đủ hơn?',
        a: `<p>Đây là cái bẫy: trong dữ liệu tự nhiên, câu dài hay đúng hơn, nên judge "thích câu dài" trông như judge "thích câu đúng". Zheng và cộng sự tách hai thứ bằng phép thử "danh sách lặp lại": chèn nội dung lặp để câu dài hơn mà không thêm thông tin. Claude-v1 và GPT-3.5 bị lừa 91,3%, GPT-4 8,7%.</p>
<p>README khuyên: thêm vào bộ hiệu chỉnh judge những ca <b>ngắn mà đúng</b> và <b>dài mà sai</b>. Mô phỏng dưới đây chấm pointwise 40 câu, 10 câu mỗi ô. Điểm judge = (+1 nếu đúng, −1 nếu sai) + hệ số độ dài × (+1 nếu dài, −1 nếu ngắn) + nhiễu; Pass nếu điểm &gt; 0.</p>`,
        viz(box) {
          const rnd0 = seeded(77), Z = Array.from({ length: 40 }, () => randn(rnd0));
          const st = { b: 0.9, natural: false };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const cells = [['Ngắn, đúng', -1, 1], ['Dài, đúng', 1, 1], ['Ngắn, sai', -1, -1], ['Dài, sai', 1, -1]];
          function draw() {
            const use = st.natural ? [1, 2] : [0, 1, 2, 3];
            const res = cells.map(([name, len, q], ci) => {
              let pass = 0;
              for (let k = 0; k < 10; k++) if (q + st.b * len + 0.5 * Z[ci * 10 + k] > 0) pass++;
              return { name, q, pass };
            });
            const good = use.filter((i) => res[i].q > 0), bad = use.filter((i) => res[i].q < 0);
            const tpr = good.reduce((s, i) => s + res[i].pass, 0) / (good.length * 10), tnr = bad.reduce((s, i) => s + 10 - res[i].pass, 0) / (bad.length * 10);
            out.innerHTML = '<div class="tbl"><table><tr><th>Ô</th><th>Judge cho Pass</th><th>Đúng phải là</th></tr>' + res.map((r, i) => '<tr' + (use.includes(i) ? '' : ' style="opacity:.35"') + '><td>' + r.name + (use.includes(i) ? '' : ' (không có trong bộ)') + '</td><td class="mono ' + ((r.q > 0 ? r.pass >= 8 : r.pass <= 2) ? 'ok' : 'bad') + '">' + r.pass + '/10</td><td>' + (r.q > 0 ? 'Pass' : 'Fail') + '</td></tr>').join('') + '</table></div><div class="stat"><span>TPR đo được: <b>' + pct(tpr) + '</b></span><span>TNR đo được: <b class="' + (tnr < 0.8 ? 'bad' : 'ok') + '">' + pct(tnr) + '</b></span></div>';
            const longBad = res[3].pass;
            cap.innerHTML = st.natural && st.b > 0.5 ? '<span class="bad">Bộ hiệu chỉnh chỉ có dài-đúng và ngắn-sai:</span> judge trông gần hoàn hảo dù hệ số độ dài là ' + dec(st.b, 1) + '. Độ dài và độ đúng đi cùng nhau nên không tách được. Bật lại hai ô còn thiếu để thấy judge cho Pass ' + longBad + '/10 câu dài mà sai.'
              : longBad >= 4 ? '<span class="bad">Judge cho Pass ' + longBad + '/10 câu dài mà sai</span> và đánh Fail ' + (10 - res[0].pass) + '/10 câu ngắn mà đúng. Đây là lỗi bị ẩn nếu bộ hiệu chỉnh không có hai ô này. Trong hệ thống thật: viết vào rubric "không xét độ dài", rồi đo lại đúng hai ô này.'
                : 'Ở hệ số này, độ dài chưa lấn được chất lượng. Kéo hệ số lên 0,9 trở lên.';
          }
          const s = slider('Hệ số thiên lệch độ dài', 0, 1.5, 0.1, st.b, (v) => { st.b = v; draw(); }, (v) => dec(v, 1));
          const t = select('Bộ hiệu chỉnh', [['full', 'Đủ 4 ô (có ngắn-đúng, dài-sai)'], ['nat', 'Phân phối tự nhiên (chỉ dài-đúng, ngắn-sai)']], 'full', (v) => { st.natural = v === 'nat'; draw(); });
          box.append(el('div', { class: 'row' }, [s.node, t.node]), out, cap);
          draw();
        },
        take: 'Thiên lệch độ dài chỉ lộ ra khi bộ hiệu chỉnh có ca mà độ dài và độ đúng đi ngược nhau.'
      },
      {
        q: 'Judge cùng họ với model sinh v8 thì sao? Nó có biết đâu là câu của "mình"?',
        a: `<p>Có bằng chứng là có. Zheng và cộng sự thấy GPT-4 cho chính nó tỉ lệ thắng cao hơn khoảng 10%, Claude-v1 khoảng 25% (tác giả nói dữ liệu còn hạn chế). Panickssery và cộng sự (2024) đo thêm một bước: model càng nhận ra được output của chính nó thì càng tự ưu ái, quan hệ tuyến tính.</p>
<p>Cơ chế dễ hình dung: văn phong, cách mở đầu, cách liệt kê của câu trả lời cùng họ "quen" với judge, nên xác suất judge chọn nó cao hơn. Giống thiên lệch độ dài, tự ưu ái đi theo câu trả lời, không theo vị trí, nên đảo thứ tự không khử được. Chọn "Judge cùng họ với model của v8" trong lab, rồi chuyển sang chế độ hai lần đảo thứ tự: số cặp v8 thắng vẫn cao hơn nhãn người.</p>
<p>README dẫn code tham chiếu của Anthropic: nên chấm bằng một model khác với model sinh output. Câu chuyện ShopViet hay gặp: đổi model chat sang họ X, judge cũng đang là họ X, eval báo "cải thiện" mà người dùng không thấy.</p>`,
        take: 'Judge khác họ với model được chấm, và vẫn kiểm bằng nhãn người.'
      },
      {
        q: 'Judge khớp người 95%. Vậy là judge tốt rồi chứ?',
        a: `<p>Chưa chắc. Agreement bị thổi phồng khi một nhãn chiếm đa số. README lấy ví dụ của Hamel: nếu chỉ 5% câu trả lời có lỗi, một judge <b>luôn trả Pass</b> vẫn đạt agreement 95% mà không bắt được lỗi nào.</p>
<p>Vì vậy README khuyên đo <b>TPR</b> (ca tốt được Pass) và <b>TNR</b> (ca hỏng bị Fail) riêng. κ cũng bắt được trường hợp này vì nó trừ đi phần trùng "do may". Kéo tỉ lệ lỗi dưới đây. Số đếm tính từ 200 ca giả định với TPR/TNR của từng loại judge.</p>`,
        viz(box) {
          const st = { fail: 0.05, j: 'always' };
          const J = { always: [1, 0, 'Luôn trả Pass'], weak: [0.95, 0.6, 'Judge dễ tính: TPR 95%, TNR 60%'], good: [0.92, 0.9, 'Judge đã hiệu chỉnh: TPR 92%, TNR 90%'] };
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const n = 200, nb = Math.round(n * st.fail), ng = n - nb, [tpr, tnr] = J[st.j];
            const tp = Math.round(ng * tpr), tn = Math.round(nb * tnr), fn = ng - tp, fp = nb - tn;
            const po = (tp + tn) / n, jp = (tp + fp) / n, hp = ng / n, pe = jp * hp + (1 - jp) * (1 - hp);
            const k = pe >= 1 ? 0 : (po - pe) / (1 - pe);
            out.innerHTML = '<div class="tbl"><table><tr><th></th><th>Judge: Pass</th><th>Judge: Fail</th></tr><tr><th>Người: Pass (' + ng + ')</th><td class="mono">' + tp + '</td><td class="mono">' + fn + '</td></tr><tr><th>Người: Fail (' + nb + ')</th><td class="mono ' + (fp ? 'bad' : '') + '">' + fp + '</td><td class="mono">' + tn + '</td></tr></table></div>' +
              '<div class="stat"><span>Agreement <b>' + pct(po, 1) + '</b></span><span>κ <b class="' + (k < 0.4 ? 'bad' : 'ok') + '">' + dec(k) + '</b></span><span>TPR <b>' + (ng ? pct(tp / ng, 1) : '—') + '</b></span><span>TNR <b class="' + (nb && tn / nb < 0.8 ? 'bad' : 'ok') + '">' + (nb ? pct(tn / nb, 1) : '—') + '</b></span></div>';
            cap.innerHTML = po >= 0.85 && k < 0.4 ? '<span class="bad">Agreement ' + pct(po, 1) + ' nhưng κ chỉ ' + dec(k) + '.</span> Judge cho lọt ' + fp + '/' + nb + ' ca hỏng. Agreement cao đến từ việc phần lớn ca là Pass, không từ việc judge giỏi. Trong hệ thống thật: báo TPR và TNR riêng, mỗi tập dev/test có 30–50 ca Pass và 30–50 ca Fail nếu được.'
              : 'Tăng tỉ lệ lỗi lên 50%: agreement của judge "luôn Pass" rơi xuống 50%, lộ ra ngay. Lỗi càng hiếm, agreement càng che giấu.';
          }
          const s = slider('Tỉ lệ ca hỏng (theo người)', 0.01, 0.5, 0.01, st.fail, (v) => { st.fail = v; draw(); }, (v) => pct(v));
          const t = select('Judge', Object.entries(J).map(([k, v]) => [k, v[2]]), 'always', (v) => { st.j = v; draw(); });
          box.append(el('div', { class: 'row' }, [s.node, t.node]), out, cap);
          draw();
        },
        take: 'Agreement một mình không đủ. Báo TPR, TNR (hoặc ít nhất κ) và số ca Fail trong tập đo.'
      },
      {
        q: 'κ tính bằng tay thế nào? "Trùng do may" là trùng cái gì?',
        a: `<p>Công thức trong README §3.2: <code>κ = (p_o − p_e) / (1 − p_e)</code>. p_o là tỉ lệ đồng ý thực tế. p_e là tỉ lệ đồng ý nếu hai bên gán ngẫu nhiên nhưng giữ đúng tỉ lệ nhãn của mỗi bên. Ví dụ người A cho Pass 88%, người B cho Pass 86%: nếu cả hai gán bừa theo tỉ lệ đó, xác suất cùng Pass là 0,88 × 0,86, cùng Fail là 0,12 × 0,14, cộng lại là p_e.</p>
<p>Chỉnh số ca dưới đây (hai người gán nhãn 50 ca, hoặc người và judge). Ô còn lại tự tính để tổng là 50.</p>`,
        viz(box) {
          const st = { pp: 40, ff: 3, pf: 4 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          function draw() {
            const fp = Math.max(0, 50 - st.pp - st.ff - st.pf), n = st.pp + st.ff + st.pf + fp;
            const po = (st.pp + st.ff) / n, a = (st.pp + st.pf) / n, b = (st.pp + fp) / n, pe = a * b + (1 - a) * (1 - b);
            const k = pe >= 1 ? 0 : (po - pe) / (1 - pe);
            out.innerHTML = '<div class="tbl"><table><tr><th></th><th>B: Pass</th><th>B: Fail</th></tr><tr><th>A: Pass</th><td class="mono">' + st.pp + '</td><td class="mono">' + st.pf + '</td></tr><tr><th>A: Fail</th><td class="mono">' + fp + '</td><td class="mono">' + st.ff + '</td></tr></table></div>' +
              '<p class="mono" style="font-size:12.5px;margin:6px 0">p_o = (' + st.pp + ' + ' + st.ff + ') / ' + n + ' = ' + dec(po, 3) + '<br>p_e = ' + dec(a, 2) + ' × ' + dec(b, 2) + ' + ' + dec(1 - a, 2) + ' × ' + dec(1 - b, 2) + ' = ' + dec(pe, 3) + '<br>κ = (' + dec(po, 3) + ' − ' + dec(pe, 3) + ') / (1 − ' + dec(pe, 3) + ') = <b>' + dec(k, 2) + '</b></p>';
            cap.innerHTML = (n !== 50 ? '<span class="bad">Ba ô đã vượt 50 ca; ô còn lại bị kẹp ở 0, tổng là ' + n + '.</span> ' : '') + (po >= 0.8 && k < 0.5 ? '<span class="bad">Đồng ý ' + pct(po) + ' nhưng κ = ' + dec(k) + '.</span> Hai bên cùng cho Pass phần lớn ca, nên trùng nhau là chuyện dễ. Phần đồng ý vượt mức may mắn mới đáng kể, và nó nhỏ. README: nếu hai người chỉ đồng ý 70%, đừng kỳ vọng judge hơn thế; vấn đề nằm ở rubric.' : 'Thử tăng ô "cùng Fail" và giảm ô "cùng Pass": cùng p_o nhưng κ cao hơn khi nhãn cân hơn.');
          }
          box.append(el('div', { class: 'row' }, [
            slider('Cùng Pass', 0, 50, 1, st.pp, (v) => { st.pp = v; draw(); }).node,
            slider('Cùng Fail', 0, 50, 1, st.ff, (v) => { st.ff = v; draw(); }).node,
            slider('A Pass, B Fail', 0, 50, 1, st.pf, (v) => { st.pf = v; draw(); }).node]), out, cap);
          draw();
        },
        take: 'κ hỏi: đồng ý nhiều hơn mức gán bừa theo tỉ lệ nhãn bao nhiêu? Nhãn càng lệch, p_e càng cao, κ càng khó cao.'
      },
      {
        q: 'Biết TPR và TNR của judge rồi thì dùng chúng làm gì với con số judge báo?',
        a: `<p>Sửa con số. Judge báo pass rate p_obs, nhưng p_obs lẫn cả ca hỏng được cho lọt và ca tốt bị đánh oan. Công thức Rogan–Gladen (dịch tễ học, được thư viện <code>judgy</code> dùng cho LLM judge):</p>
<p><code>pass thật ≈ (p_obs + TNR − 1) / (TPR + TNR − 1)</code>, chỉ dùng được khi TPR + TNR − 1 &gt; 0.</p>
<p>Ví dụ README: judge A báo 85%, TPR 0,92, TNR 0,90 → pass thật ≈ 91,5%. Câu chuyện đáng sợ hơn: ShopViet đổi sang judge B dễ tính, chạy lại cùng hệ thống. Lab tính judge B sẽ báo bao nhiêu cho <b>cùng</b> pass rate thật đó.</p>`,
        viz(box) {
          const st = { tprB: 0.97, tnrB: 0.6 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const rg = (p, tpr, tnr) => { const y = tpr + tnr - 1; return y <= 0 ? null : Math.min(1, Math.max(0, (p + tnr - 1) / y)); };
          function draw() {
            const truth = rg(0.85, 0.92, 0.9);
            const pB = st.tprB * truth + (1 - st.tnrB) * (1 - truth), back = rg(pB, st.tprB, st.tnrB);
            out.innerHTML = '<div class="tbl"><table><tr><th>Judge</th><th>TPR</th><th>TNR</th><th>Pass rate judge báo</th><th>Sau hiệu chỉnh</th></tr><tr><td>A (README)</td><td>0,92</td><td>0,90</td><td class="mono">85,0%</td><td class="mono">' + pct(truth, 1) + '</td></tr><tr><td>B (đổi judge)</td><td>' + dec(st.tprB) + '</td><td>' + dec(st.tnrB) + '</td><td class="mono ' + (pB - 0.85 > 0.03 ? 'bad' : '') + '">' + pct(pB, 1) + '</td><td class="mono">' + (back == null ? '<span class="bad">không hiệu chỉnh được</span>' : pct(back, 1)) + '</td></tr></table></div>';
            cap.innerHTML = back == null ? '<span class="bad">TPR + TNR − 1 = ' + dec(st.tprB + st.tnrB - 1) + ' ≤ 0:</span> judge B không tốt hơn đoán ngẫu nhiên, công thức chia cho số không dương. README cho hàm này raise lỗi thay vì trả số.'
              : pB - 0.85 > 0.03 ? '<span class="bad">"Cải thiện" ' + dec((pB - 0.85) * 100, 1) + ' điểm xuất hiện chỉ vì đổi judge.</span> Hệ thống không đổi. Hiệu chỉnh xong, cả hai judge cùng ra ' + pct(truth, 1) + '. Không có nghĩa con số hiệu chỉnh là chính xác tuyệt đối: TPR/TNR ước lượng từ vài chục ca nên nó cũng có khoảng tin cậy (<code>judgy</code> tính bằng bootstrap).'
                : 'Judge B gần giống judge A, con số báo gần nhau. Kéo TNR của B xuống 0,6 để thấy judge dễ tính đẩy pass rate lên.';
          }
          box.append(el('div', { class: 'row' }, [
            slider('TPR judge B', 0.3, 1, 0.01, st.tprB, (v) => { st.tprB = v; draw(); }, (v) => dec(v)).node,
            slider('TNR judge B', 0, 1, 0.01, st.tnrB, (v) => { st.tnrB = v; draw(); }, (v) => dec(v)).node]), out, cap);
          draw();
        },
        take: 'So hai lần chạy dùng hai judge khác nhau thì phải hiệu chỉnh trước. Nếu không, "cải thiện" có thể đến từ judge.'
      },
      {
        q: 'Paper nói judge GPT-4 đồng thuận với người trên 80%. Sao không lấy luôn con số đó cho judge của mình?',
        a: `<p>Vì hai lý do.</p>
<p><b>Con số hay bị trích sai.</b> README chỉ ra: "trên 80%" trong abstract của Zheng và cộng sự là khi bỏ các ca hoà (85%). Tính cả ca hoà thì là 66%. Người với người đồng thuận 81% và 63% tương ứng. Nghĩa là judge ngang người, nhưng không phải "80% là đủ tốt" như câu trích thường gặp.</p>
<p><b>Con số đo trên dữ liệu và model khác.</b> Judge của bạn chấm tiếng Việt, chính sách đổi trả của ShopViet, với prompt và rubric của bạn, trên model 2026. Phải đo lại trên nhãn của chính bạn, theo quy trình chia ba tập. Kéo số nhãn dưới đây để thấy mỗi tập có bao nhiêu ca.</p>`,
        viz(box) {
          const out = el('div');
          function draw(n) {
            const tr = Math.round(n * 0.15), dv = Math.round((n - tr) / 2), te = n - tr - dv;
            out.innerHTML = '<div class="stat"><span>Train (10–20%, few-shot cho judge) <b>' + tr + '</b></span><span>Dev (40–45%, sửa prompt judge) <b>' + dv + '</b></span><span>Test (40–45%, đo một lần) <b>' + te + '</b></span></div><p class="cap">' + (te < 60 ? '<span class="bad">Tập test chỉ ' + te + ' ca:</span> khó có đủ 30–50 ca Pass và 30–50 ca Fail như README gợi ý, TPR/TNR sẽ có khoảng tin cậy rộng.' : 'Tập test ' + te + ' ca đủ để có cả 30+ Pass và 30+ Fail nếu tỉ lệ lỗi không quá thấp.') + ' Ca dev và test không bao giờ vào prompt của judge.</p>';
          }
          box.append(slider('Số nhãn chuyên gia cho một failure mode', 40, 200, 10, 150, draw).node, out);
          draw(150);
        },
        take: 'Ghi lại model judge kèm phiên bản, prompt, rubric và TPR/TNR đo được trên tập test của bạn. Đổi một thứ là đo lại.'
      }
    ],
    poc: {

        el('h4', { text: 'Phát hiện từ dữ liệu', style: 'margin:16px 0 4px' }), flags, cap,
        el('p', { class: 'hint', text: 'Mô phỏng, không phải judge thật. Chênh chất lượng thật của từng cặp, độ dài câu trả lời và nhiễu được rút ngẫu nhiên với seed cố định; v8 được giả định viết dài hơn v7 25–95 từ và trung bình hơi kém hơn về chính sách. Nhãn người là chênh chất lượng thật với ngưỡng hoà 0,35. Các hệ số thiên lệch là núm giả định; số đo thật của Zheng và cộng sự nằm ở phần tóm tắt.' })
      );
      render();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
