const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

  const pct = (x, d = 1) => (x * 100).toFixed(d).replace('.', ',') + '%';
  const pts = (x, d = 1) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d).replace('.', ',');
  const dec = (x, d = 2) => x.toFixed(d).replace('.', ',');
  const flagBox = (l, t) => el('div', { style: 'font-size:13px;margin:4px 0;padding:6px 10px;border-left:3px solid var(--' + l + ');background:var(--bg);border-radius:0 6px 6px 0', html: t });
  const GROUPS = [['tra_don', 'Tra đơn'], ['doi_tra', 'Đổi trả'], ['bao_hanh', 'Bảo hành'], ['tra_gop', 'Trả góp'], ['ngoai', 'Ngoài phạm vi'], ['doi_khang', 'Đối kháng']];
  const DIST = { balanced: [1, 1, 1, 1, 1, 1], log: [80, 5, 6, 4, 3, 2] };
  const SCEN = {
    same: 'Giống hệt baseline (chỉ chạy lại)',
    small: 'Tụt nhẹ 1 điểm ở mọi ca',
    group: 'Bỏ bước "kiểm tra hoá đơn": nhóm Đổi trả tụt 30 điểm',

  };

  function alloc(n, w) {
    const tot = w.reduce((a, b) => a + b, 0), raw = w.map((x) => (x / tot) * n);
    const c = raw.map((x) => Math.max(2, Math.floor(x)));
    let left = n - c.reduce((a, b) => a + b, 0);
    const order = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]);
    for (let j = 0; left > 0; j = (j + 1) % order.length, left--) c[order[j][1]]++;
    for (let j = 0; left < 0; j++) { const i = c.indexOf(Math.max(...c)); c[i]--; left++; }
    return c;
  }

  function makeCases(n, dist, seed) {
    const rnd = seeded(seed * 7919 + n), counts = alloc(n, DIST[dist]), cases = [];
    counts.forEach((cnt, gi) => {
      for (let j = 0; j < cnt; j++) {
        const u = rnd();
        const p = u < 0.05 ? 0.2 + rnd() * 0.2 : u < 0.17 ? 0.6 + rnd() * 0.3 : 0.97 + rnd() * 0.03;
        cases.push({ id: 'c' + cases.length, g: GROUPS[gi][0], p });
      }
    });
    return cases;
  }

  function candP(c, scen) {
    if (scen === 'small') return Math.max(0, c.p - 0.01);
    if (scen === 'big') return Math.max(0, c.p - 0.06);
    if (scen === 'group') return c.g === 'doi_tra' ? Math.max(0, c.p - 0.3) : c.p;
    if (scen === 'better') return c.p + (1 - c.p) * 0.5;
    return c.p;
  }

  function runOnce(cases, scen, k, seed) {
    const rnd = seeded(seed * 104729 + 17);
    const base = {}, cand = {}, flat = { cp: 0, cn: 0, bp: 0 };
    cases.forEach((c) => {
      let b = 0, d = 0;
      const pc = candP(c, scen);
      for (let r = 0; r < k; r++) { if (rnd() < c.p) b++; if (rnd() < pc) d++; }
      base[c.id] = b / k; cand[c.id] = d / k; flat.cp += d; flat.bp += b; flat.cn += k;
    });
    return { base, cand, flat };
  }

  function bootCI(diffs, nb, rnd) {
    const n = diffs.length, mean = diffs.reduce((a, b) => a + b, 0) / n;
    if (n < 2) return [mean, mean, mean];
    const bs = new Float64Array(nb);

    bs.sort();

      const sub = cases.filter((c) => g === '__all__' || c.g === g);
      const diffs = sub.map((c) => run.cand[c.id] - run.base[c.id]);

      return { g, n: sub.length, b, c: cnd, diff, lo, hi, block };
    });
    const pairedExit = rows.some((r) => r.block) ? 1 : 0;
    return { exit: o.rule === 'abs' ? absExit : pairedExit, rows, absRate, absExit, pairedExit };
  }

        a: `<p>Tuỳ 500 ca phân bổ ra sao. README: 500 ca mà 480 ca là tra cứu đơn hàng thì nhóm đổi trả vẫn chỉ có 20 ca. Khoảng tin cậy của nhóm đó rộng theo 20 ca, không theo 500. README cũng nhắc: <code>wilson_interval(0, 20)</code> ≈ (0,00; 0,16), tức 0 lỗi trên 20 ca vẫn có thể là 16% lỗi.</p>
<p>Kéo số ca của một nhóm và số ca pass. Khoảng Wilson tính trong trình duyệt (z = 1,96).</p>`,
        viz(box) {
          const st = { n: 20, k: 20 };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const wilson = (k, n, z = 1.96) => { if (!n) return [0, 1]; const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [Math.max(0, c - h), Math.min(1, c + h)]; };
          function draw() {

            out.innerHTML = '<div style="position:relative;height:26px;background:var(--panel);border:1px solid var(--line);border-radius:4px;margin:6px 0"><div style="position:absolute;top:4px;bottom:4px;left:' + lo * 100 + '%;width:' + Math.max(0.5, (hi - lo) * 100) + '%;background:var(--accent-soft);border:2px solid var(--accent);border-radius:3px"></div><div style="position:absolute;top:0;bottom:0;left:' + (k / st.n) * 100 + '%;width:2px;background:var(--ink)"></div></div><div class="stat"><span>Pass <b>' + k + '/' + st.n + ' = ' + pct(k / st.n) + '</b></span><span>Wilson 95% <b>[' + pct(lo) + '; ' + pct(hi) + ']</b></span><span>Độ rộng <b>' + dec((hi - lo) * 100, 1) + ' điểm</b></span></div>';
            cap.innerHTML = st.n <= 30 && hi - lo > 0.15 ? '<span class="bad">Với ' + st.n + ' ca, khoảng tin cậy rộng ' + dec((hi - lo) * 100, 0) + ' điểm.</span> Một regression 10 điểm trong nhóm này nằm gọn trong nhiễu. Đây là cùng cơ chế làm cổng CI ở lab chính để lọt nhóm đổi trả khi phân bổ theo log.' : 'Thêm ca làm khoảng hẹp lại theo căn bậc hai: gấp 4 lần số ca mới hẹp được một nửa.';
          }
          box.append(el('div', { class: 'row' }, [slider('Số ca của nhóm', 5, 400, 5, st.n, (v) => { st.n = Math.round(v); draw(); }).node, slider('Số ca pass', 0, 400, 1, st.k, (v) => { st.k = Math.round(v); draw(); }).node]), out, cap);

      {
        q: 'Nhóm Ngoài phạm vi chỉ 3 ca mà eval_gate in CI95 [0; +33], nhóm Đối kháng 2 ca in [−33; 0]. Ít ca vậy sao khoảng không rộng hơn?',
        a: `<p>Chuyện gì xảy ra: ở POC, bộ 120 ca lấy từ log có nhóm 2–3 ca, và eval_gate in cho chúng những khoảng như <code>ngoai n=3 CI95=[+0.000, +0.333]</code>. Trông như "biết khá chắc", nhưng chỉ dựa trên 3 ca.</p>
<p>Vì sao, về cơ chế: bootstrap không tạo thêm thông tin, nó chỉ rút lại từ đúng các hiệu số đã thấy. Mỗi ca chạy 3 lần nên hiệu số của một ca chỉ là một trong vài mức (0, ±1/3, ±2/3, ±1). Với 3 ca, trung bình rút lại chỉ có vài giá trị khả dĩ, và không bao giờ ra ngoài khoảng giữa hiệu số nhỏ nhất và lớn nhất đã thấy. Nếu 3 ca đều có hiệu số 0, mọi lần rút đều ra 0 và CI là [0; 0], dù 3 ca không nói được gì về ca thứ 4.</p>
<p>Không có nghĩa bootstrap sai: với nhóm vài chục ca trở lên nó ổn. Nó hỏng khi n quá nhỏ, và README §3.4 không đặt cỡ nhóm tối thiểu trong eval_gate.py.</p>
<p>Hình dưới đo trực tiếp: rút nhiều nhóm n ca mới từ cùng phân phối tỉ lệ đúng của lab, mỗi nhóm tính CI bootstrap 95%, rồi đếm bao nhiêu phần trăm CI chứa hiệu số thật. CI 95% đúng nghĩa phải chứa khoảng 95%.</p>`,
        viz(box) {
          const st = { eff: 'reg' };
          const out = el('div'), cap = el('div', { class: 'cap' });
          const drawP = (rnd) => { const u = rnd(); return u < 0.05 ? 0.2 + rnd() * 0.2 : u < 0.17 ? 0.6 + rnd() * 0.3 : 0.97 + rnd() * 0.03; };
          const cp = (p) => st.eff === 'reg' ? Math.max(0, p - 0.3) : p;
          function truth() { const rnd = seeded(99); let s = 0; for (let i = 0; i < 20000; i++) { const p = drawP(rnd); s += cp(p) - p; } return s / 20000; }
          function draw() {
            const T = truth(), K = 3, G = 300;
            const rows = [2, 3, 5, 10, 20, 50].map((n) => {
              const rnd = seeded(n * 131 + (st.eff === 'reg' ? 7 : 3));
              let cover = 0, w = 0, zero = 0;
              for (let g = 0; g < G; g++) {
                const d = [];
                for (let i = 0; i < n; i++) { const p = drawP(rnd), q = cp(p); let b = 0, c = 0; for (let r = 0; r < K; r++) { if (rnd() < p) b++; if (rnd() < q) c++; } d.push((c - b) / K); }
                const [, lo, hi] = bootCI(d, 400, rnd);
                if (lo <= T + 1e-9 && hi >= T - 1e-9) cover++;
                if (hi - lo < 1e-9) zero++;
                w += hi - lo;
              }
              return { n, cover: cover / G, w: w / G, zero: zero / G };
            });
            out.innerHTML = '<div class="tbl"><table><tr><th>Ca trong nhóm</th><th>CI 95% chứa hiệu số thật</th><th>Độ rộng CI trung bình</th><th>CI rộng 0 (kiểu [0; 0])</th></tr>' + rows.map((r) => '<tr><td class="mono">' + r.n + '</td><td class="mono ' + (r.cover < 0.85 ? 'bad' : r.cover >= 0.9 ? 'ok' : '') + '">' + pct(r.cover, 0) + '</td><td class="mono">' + dec(r.w * 100, 1) + ' điểm</td><td class="mono">' + pct(r.zero, 0) + '</td></tr>').join('') + '</table></div><p class="hint">Hiệu số thật (trung bình trên rất nhiều ca): ' + pts(T) + ' điểm. 300 nhóm mỗi dòng, mỗi ca chạy 3 lần, bootstrap 400 lần rút.</p>';

          }
          box.append(select('Thay đổi của candidate', [['reg', 'Nhóm này tụt 30 điểm (bỏ bước hoá đơn)'], ['same', 'Giống hệt baseline']], 'reg', (v) => { st.eff = v; draw(); }).node, out, cap);
          draw();
        },
        take: 'Bootstrap trên 2–3 ca cho khoảng hẹp giả. Nhóm quá nhỏ thì báo "chưa đủ ca", đừng in CI.'

<p>Ví dụ README: 162 ca cả hai đúng, 22 ca cả hai sai, 10 ca chỉ bản cũ đúng, 6 ca chỉ bản mới đúng. Kéo số ca bất đồng (tổng 200 ca, phần còn lại chia theo tỉ lệ cùng đúng/cùng sai).</p>`,

<ul><li><code>hi &lt; −MARGIN</code> (README mặc định): chỉ chặn khi <b>chắc chắn</b> tụt quá biên. Ít báo động giả; với bộ nhỏ sẽ để lọt regression nhỏ. README: đó là cái giá của cỡ mẫu nhỏ, không phải lỗi của cổng.</li>
<li><code>lo &lt; −MARGIN</code>: chặn khi <b>chưa chứng minh được</b> là không tụt quá biên. Chặt hơn, nhưng bộ eval phải đủ lớn, nếu không CI đỏ thường xuyên. Chọn luật này trong lab chính, kịch bản "Giống hệt baseline", rồi chạy 20 lần.</li></ul>
<p>"Đủ lớn" là bao nhiêu? POC chạy luật chặt trên bộ cân bằng 6 nhóm, candidate giống hệt baseline, 20 lần mỗi cỡ: đỏ <b>20/20 ở 120 ca, 19/20 ở 1.200 ca</b>, 4/20 ở 6.000 ca, 0/20 ở 12.000 ca. Vì sao cần nhiều vậy: cận dưới ≈ hiệu số − 1,96 × sai số chuẩn. Khi hiệu số thật bằng 0, muốn cận dưới chắc nằm trên −2 điểm thì nửa độ rộng CI phải nhỏ hơn hẳn 2 điểm, ở <b>cả 7 dòng</b> (6 nhóm và tổng), vì chỉ một dòng chạm −2 là cổng đỏ. Mỗi nhóm có 200 ca thì nửa độ rộng vẫn khoảng 2 điểm; phải lên khoảng 1.000–2.000 ca mỗi nhóm. Không có nghĩa luật chặt sai: nó trả lời câu hỏi khó hơn ("chứng minh không tụt"), và câu hỏi đó cần nhiều dữ liệu hơn. Trong hệ thống thật: bộ cho mỗi PR dùng <code>hi &lt; −MARGIN</code>; chỉ dùng luật chặt khi có bộ hàng nghìn ca mỗi nhóm.</p>
<p>Thêm vài điều README nhắc cho CI:</p>
<ul><li>Hai file kết quả không cùng tập ca (bị ngắt, timeout, lệch version) thì thoát mã 2, không so phần giao nhau. Bật "Candidate bị ngắt" trong lab để thấy ngưỡng tuyệt đối không nhận ra chuyện này.</li>
<li>Chạy khi prompt, model, tool, dataset đổi (path filter); bộ nhỏ cho mỗi PR, bộ đầy đủ nhiều lần chạy hằng đêm.</li>
<li>CI xanh chưa phải là đủ: Anthropic viết trong postmortem 09/2025 rằng eval họ chạy đã không bắt được suy giảm người dùng báo cáo. Eval offline chỉ phủ những gì bạn đã nghĩ tới. Lab 7 nói về tín hiệu production.</li></ul>`,
        take: 'Chọn luật chặn theo cỡ bộ eval và mức rủi ro; luật nào cũng chỉ thấy những gì bộ ca phủ.'
      }
    ],
    poc: {
      goal: "Bộ ca <b>tổng hợp</b> cùng phân phối với lab, baseline v7 và candidate v8 chạy 3 lần mỗi ca, 20 seed mỗi ô. Bốn cổng: ngưỡng 100% (mặc định promptfoo), ngưỡng tuyệt đối 90%, luật README <code>hi &lt; −2</code> và luật chặt <code>lo &lt; −2</code>. <code>eval_gate.py</code> thật chạy bằng subprocess. Thêm kappa của hai người gán nhãn (nhãn viết tay). <b>Nói thẳng:</b> không có lần gọi model nào; mọi kết quả pass/fail là số ngẫu nhiên rút từ tỉ lệ đúng giả định. Phần thật duy nhất là <code>eval_gate.py</code> của README chạy trên các file JSONL tổng hợp đó.",
      file: "docs/evaluation/pocs/06_dataset_labeling_ci.py",

      needs: "<code>uv</code>, <code>numpy</code>, CPU, khoảng 12 giây, miễn phí.",
      output: "Bộ ca và kết quả chạy là TỔNG HỢP (numpy, có seed), cùng phân phối tỉ lệ đúng mỗi ca với lab 06:\n83% ca gần như luôn đúng, 12% chập chờn (0,6–0,9), 5% khó (0,2–0,4). Prompt v7 = baseline, v8 = candidate.\n\n== 1. Bộ 120 ca lấy ngẫu nhiên từ log: mỗi nhóm có bao nhiêu ca ==\nNhóm       Số ca\n---------  -----\ntra_don    98   \ndoi_tra    6    \nbao_hanh   7    \ntra_gop    4    \nngoai      3    \ndoi_khang  2    \n\n== 2. 20 lần chạy mỗi ô: bao nhiêu lần mỗi cổng ĐỎ (n = 120 ca, k = 3) ==\nBộ ca                     Thay đổi                    promptfoo 100%  tuyệt đối 90%  README hi<-2  chặt lo<-2\n------------------------  --------------------------  --------------  -------------  ------------  ----------\nlấy từ log (80% tra đơn)  v8 giống hệt v7 (chạy lại)  20/20           0/20           0/20          20/20     \nlấy từ log (80% tra đơn)  v8 bỏ bước hoá đơn          20/20           3/20           16/20         20/20     \ncân bằng theo nhóm        v8 giống hệt v7 (chạy lại)  20/20           0/20           0/20          20/20     \ncân bằng theo nhóm        v8 bỏ bước hoá đơn          20/20           17/20          20/20         20/20     \n\n== 3. Luật chặt theo cỡ bộ ca (cân bằng, không có thay đổi nào): số lần đỏ / 20 ==\nSố ca  Ca mỗi nhóm  Luật chặt đỏ\n-----  -----------  ------------\n120    20           20/20       \n1200   200          19/20       \n6000   1000         4/20        \n12000  2000         0/20        \n\n== 4. Chạy eval_gate.py thật (README §3.4) trên một lần chạy, bộ 120 ca ==\n\n[lấy từ log (80% tra đơn)] $ python eval_gate.py v7.jsonl v8.jsonl\nbao_hanh             n=   7 diff=-0.000 CI95=[-0.143, +0.143]\ndoi_khang            n=   2 diff=-0.167 CI95=[-0.333, +0.000]\ndoi_tra              n=   6 diff=-0.278 CI95=[-0.444, -0.111]\nngoai                n=   3 diff=+0.111 CI95=[+0.000, +0.333]\ntra_don              n=  98 diff=+0.024 CI95=[-0.010, +0.061]\ntra_gop              n=   4 diff=+0.083 CI95=[+0.000, +0.250]\n__all__              n= 120 diff=+0.008 CI95=[-0.025, +0.044]\n-> exit code 1\n\n[cân bằng theo nhóm] $ python eval_gate.py v7.jsonl v8.jsonl\nbao_hanh             n=  20 diff=+0.067 CI95=[-0.033, +0.200]\ndoi_khang            n=  20 diff=+0.033 CI95=[-0.050, +0.117]\ndoi_tra              n=  20 diff=-0.300 CI95=[-0.467, -0.133]\nngoai                n=  20 diff=+0.033 CI95=[-0.033, +0.117]\ntra_don              n=  20 diff=-0.033 CI95=[-0.083, +0.000]\ntra_gop              n=  20 diff=+0.000 CI95=[-0.067, +0.067]\n__all__              n= 120 diff=-0.033 CI95=[-0.078, +0.011]\n-> exit code 1\n\n== 5. Hai người gán nhãn 30 ca đổi trả (nhãn VIẾT TAY): agreement và kappa ==\nAn Pass 26/30, Bình Pass 27/30 -> đồng ý p_o = 0.90, ngẫu nhiên p_e = 0.79, kappa = +0.52\n\nRút ra: ngưỡng 100% đỏ mọi lần dù không ai sửa gì. Ngưỡng tuyệt đối 90% (baseline ~92%) chỉ đỏ 3/20 khi nhóm\nĐổi trả tụt 30 điểm trong bộ lấy từ log, vì nhóm đó chỉ ~5% tổng. Cổng theo cặp, theo nhóm của README không đỏ\nkhi không có thay đổi, bắt 16/20 với 6 ca Đổi trả và 20/20 khi cân bằng nhóm. Luật chặt lo<-2 đỏ gần như mọi lần\nkhi không có thay đổi tới 1.200 ca, còn 4/20 ở 6.000 ca: 7 dòng, mỗi dòng chỉ cần một cận dưới chạm -2.\nKappa: hai người đồng ý 90% nhưng trừ phần trùng do may chỉ còn ~0,5.",
      measured: true,
      read: ["Mục 1: 120 ca lấy từ log chỉ có 6 ca Đổi trả.", "Mục 2: ngưỡng 100% đỏ 20/20 khi không đổi gì; ngưỡng 90% chỉ đỏ 3/20 khi Đổi trả tụt 30 điểm trong bộ lấy từ log; luật README 0/20 khi không đổi gì, 16/20 (log) và 20/20 (cân bằng) khi có hỏng.", "Mục 3: luật chặt đỏ khi không đổi gì 20/20 ở 120 ca, 19/20 ở 1.200, 4/20 ở 6.000, 0/20 ở 12.000.", "Mục 4: bootstrap trên nhóm 2–3 ca cho CI hẹp giả (chỉ vài giá trị resample khả dĩ); mục 5: đồng ý 90% nhưng kappa 0,52."]
    },
    mount(stage) {
      const o = { n: 120, dist: 'log', scen: 'group', k: 3, margin: 0.02, rule: 'paired', thr: 100, seed: 8, missing: false };
      const covBox = el('div'), gateBox = el('div'), exitBox = el('div', { class: 'stat' }), repBox = el('div'), flags = el('div'), cap = el('div', { class: 'qa-viz' });
      let cases = makeCases(o.n, o.dist, 1), rep = null;
      const GN = Object.fromEntries(GROUPS);

      function track(r) {
        const L = -0.5, R = 0.2, x = (v) => ((Math.min(R, Math.max(L, v)) - L) / (R - L)) * 100;
        return '<div style="position:relative;height:18px;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:' + x(0) + '%;width:1px;background:var(--mute)"></div><div style="position:absolute;top:0;bottom:0;left:' + x(-o.margin) + '%;width:2px;background:var(--bad)"></div><div style="position:absolute;top:5px;height:8px;left:' + x(r.lo) + '%;width:' + Math.max(1, x(r.hi) - x(r.lo)) + '%;background:' + (r.block ? 'var(--bad)' : 'var(--accent)') + ';border-radius:2px"></div><div style="position:absolute;top:2px;height:14px;left:' + x(r.diff) + '%;width:2px;background:var(--ink)"></div></div>';
      }

      function render() {
        const run = runOnce(cases, o.scen, o.k, o.seed);
        const G = gate(cases, run, o, 2000, o.missing);
        const counts = GROUPS.map(([g, name]) => [name, cases.filter((c) => c.g === g).length, g === 'doi_tra']);
        covBox.replaceChildren(hbars(counts, { fmt: (v) => v + ' ca' }));
        if (G.rows.length) {
          gateBox.innerHTML = '<div class="tbl sum" style="border:0;margin:0;padding:0"><table><tr><th>Nhóm</th><th>n</th><th>Baseline</th><th>Candidate</th><th>Hiệu số</th><th>CI95</th><th>−50 … 0 … +20 điểm</th><th>Cổng</th></tr>' + G.rows.map((r) => '<tr' + (r.g === '__all__' ? ' class="cur"' : '') + '><td>' + (r.g === '__all__' ? '<b>Tổng</b>' : GN[r.g]) + '</td><td class="mono">' + r.n + '</td><td class="mono">' + pct(r.b) + '</td><td class="mono">' + pct(r.c) + '</td><td class="mono">' + pts(r.diff) + '</td><td class="mono" style="white-space:nowrap">[' + pts(r.lo) + '; ' + pts(r.hi) + ']</td><td>' + track(r) + '</td><td class="' + (o.rule === 'abs' ? '' : r.block ? 'bad' : 'ok') + '">' + (o.rule === 'abs' ? '—' : r.block ? '<b>chặn</b>' : 'qua') + '</td></tr>').join('') + '</table></div>';
        } else gateBox.innerHTML = '<p class="bad" style="font-size:13.5px">case không khớp: thiếu 5 ca trong kết quả candidate. eval_gate không so phần giao nhau, thoát mã 2.</p>';
        const ex = G.exit, rule = { paired: 'eval_gate: chặn khi hi &lt; −MARGIN', strict: 'Chặt: chặn khi lo &lt; −MARGIN', abs: 'Ngưỡng tuyệt đối ' + o.thr + '% (kiểu promptfoo)' }[o.rule];
        exitBox.innerHTML = '<span>Cổng đang chọn: <b>' + rule + '</b></span><span>Exit code <b class="' + (ex ? 'bad' : 'ok') + '">' + ex + '</b> (' + (ex === 0 ? 'xanh, cho merge' : ex === 2 ? 'dữ liệu lệch' : 'đỏ, chặn') + ')</span><span>Pass rate candidate theo từng lần chạy <b>' + pct(G.absRate) + '</b> → ngưỡng ' + o.thr + '%: exit <b>' + G.absExit + '</b></span>';
        if (rep) {
          repBox.innerHTML = '<div class="tbl sum" style="border:0;margin:0;padding:0"><table><tr><th>Cổng (cùng bộ ca, 20 seed chạy khác nhau)</th><th>Số lần đỏ</th><th>Đánh giá</th></tr>' + rep.map(([name, red, good]) => '<tr><td>' + name + '</td><td class="mono">' + red + '/20</td><td class="' + (good ? 'ok' : 'bad') + '">' + (good ? 'ổn định' : (o.scen === 'same' || o.scen === 'better') && red >= 19 ? '<b>luôn đỏ dù không có regression</b>' : o.scen === 'same' || o.scen === 'better' ? '<b>chập chờn: đỏ khi không có regression</b>' : '<b>để lọt regression ở một số lần</b>') + '</td></tr>').join('') + '</table></div><p class="hint">Kịch bản: ' + SCEN[o.scen] + '. Bấm lại sau khi đổi kịch bản hoặc cỡ bộ ca.</p>';
        } else repBox.innerHTML = '<p class="hint">Chưa chạy. Bấm "Chạy CI 20 lần".</p>';

        const fl = [];
        const flaky = cases.filter((c) => c.p < 0.97).length;
        if (o.rule === 'abs' && G.absExit && (o.scen === 'same' || o.scen === 'better')) fl.push(['bad', 'CI đỏ (exit ' + G.absExit + ') dù candidate ' + (o.scen === 'same' ? 'giống hệt baseline' : 'tốt hơn baseline') + ': bộ có ' + flaky + ' ca với tỉ lệ đúng dưới 97% mỗi lần, ngưỡng ' + o.thr + '% không chừa chỗ cho nhiễu.']);
        const dt = G.rows.find((r) => r.g === 'doi_tra');
        if (o.scen === 'group' && dt && !dt.block && o.rule !== 'abs') fl.push(['bad', 'Nhóm Đổi trả tụt thật (' + pts(dt.diff) + ' điểm) nhưng cổng cho qua: nhóm chỉ có ' + dt.n + ' ca, CI95 rộng ' + dec((dt.hi - dt.lo) * 100, 0) + ' điểm nên chưa nằm hẳn dưới −MARGIN.']);
        const all = G.rows.find((r) => r.g === '__all__');
        if (o.scen === 'group' && dt && dt.block && all && !all.block) fl.push(['ok', 'Tổng chỉ ' + pts(all.diff) + ' điểm, CI chứa vùng trên −MARGIN; cổng chặn được là nhờ vòng lặp theo nhóm, không nhờ con số tổng.']);
        if (o.rule === 'abs' && !G.absExit && o.scen !== 'same' && o.scen !== 'better') fl.push(['bad', 'Ngưỡng tuyệt đối ' + o.thr + '% cho qua candidate tệ hơn baseline: pass rate candidate ' + pct(G.absRate) + ' vẫn trên ngưỡng.']);
        if (o.missing) fl.push([o.rule === 'abs' ? 'bad' : 'ok', o.rule === 'abs' ? 'Candidate thiếu 5 ca mà ngưỡng tuyệt đối vẫn tính pass rate trên phần còn lại (exit ' + G.absExit + '). Kết quả thiếu ca không chứng minh được gì.' : 'Thiếu 5 ca: eval_gate thoát mã 2 thay vì so phần giao nhau.']);
        const tiny = G.rows.filter((r) => r.g !== '__all__' && r.n <= 5);
        if (tiny.length) fl.push(['warn', 'Nhóm rất nhỏ: ' + tiny.map((r) => GN[r.g] + ' ' + r.n + ' ca, CI95 [' + pts(r.lo) + '; ' + pts(r.hi) + ']').join('; ') + '. Các khoảng này hẹp giả: bootstrap chỉ rút lại từ đúng ' + tiny.map((r) => r.n).join('/') + ' hiệu số đã thấy, nên CI không rộng hơn khoảng giữa hiệu số nhỏ nhất và lớn nhất; nếu mọi ca cùng hiệu số 0 thì CI là [0; 0]. eval_gate.py ở README §3.4 không có cỡ nhóm tối thiểu nên vẫn in và vẫn dùng các CI này (xem câu hỏi "Nhóm Ngoài phạm vi chỉ 3 ca…" bên dưới).']);
        if (o.rule === 'strict' && ex === 1 && (o.scen === 'same' || o.scen === 'better')) fl.push(['warn', 'Luật chặt (lo &lt; −MARGIN) chặn cả khi không có gì thay đổi: với ' + o.n + ' ca, CI quá rộng để chứng minh "không tụt quá ' + dec(o.margin * 100, 0) + ' điểm". POC (bộ cân bằng, không thay đổi gì, 20 lần): đỏ 20/20 ở 120 ca, 19/20 ở 1.200 ca, 4/20 ở 6.000 ca, 0/20 ở 12.000 ca. Thanh trượt của lab dừng ở 400 ca nên ở đây luật này gần như luôn đỏ.']);
        if (rep) rep.forEach(([name, red, good]) => { if (!good) fl.push(['warn', 'Chạy 20 lần: "' + name + '" đỏ ' + red + '/20 lần. ' + (o.scen === 'same' || o.scen === 'better' ? 'Cổng chập chờn.' : 'Cổng không ổn định trước regression này.')]); });
        flags.replaceChildren(...(fl.length ? fl.map(([l, t]) => flagBox(l, t)) : [el('div', { class: 'ok', style: 'font-size:13px', text: 'Không phát hiện bất thường ở lần chạy này.' })]));

        let c;
        if (o.rule === 'abs' && G.absExit && (o.scen === 'same' || o.scen === 'better')) c = {
          what: 'Ngưỡng ' + o.thr + '% làm CI đỏ dù không có regression.',

          not: 'Không có nghĩa bot tệ đi: candidate và baseline có cùng tỉ lệ đúng giả định.',
          real: 'Hạ ngưỡng (PROMPTFOO_PASS_RATE_THRESHOLD) hoặc tốt hơn là so cặp với baseline như eval_gate.' };
        else if (o.scen === 'group' && dt && !dt.block && o.rule !== 'abs') c = {

          not: 'Không có nghĩa eval_gate sai: nó làm đúng việc "chỉ chặn khi chắc chắn". Bộ ca mới là chỗ hỏng.',
          real: 'Phủ theo nhóm: đổi "Phân bổ ca" sang "Cân theo nhóm" và xem cổng chặn được. Đây chính là tình huống ở đầu README.' };
        else if (o.missing) c = {
          what: 'Lần chạy candidate bị ngắt, thiếu 5 ca.',
          why: 'Ca thiếu thường là ca timeout hoặc lỗi, tức ca khó. So phần giao nhau là bỏ đúng những ca có khả năng fail.',
          not: 'Không có nghĩa candidate tốt hay xấu: không đủ dữ liệu để nói.',
          real: 'Cổng thoát mã 2 và CI báo lỗi hạ tầng, không báo pass.' };
        else if (ex === 0 && (o.scen === 'small' || o.scen === 'big')) c = {

          not: 'Không có nghĩa cổng hỏng: cổng chỉ chặn khi chắc chắn.',
          real: 'Muốn bắt regression nhỏ thì cần thêm ca (§1.4: phân biệt 80% và 85% cần khoảng 900 ca mỗi nhánh nếu độc lập, ít hơn nhiều nếu so cặp).' };
        else c = {
          what: 'Cổng ' + (ex ? 'chặn' : 'cho qua') + ' với kịch bản "' + SCEN[o.scen] + '".',
          why: 'Cổng so cặp từng nhóm và tổng, chỉ chặn khi CI95 của hiệu số nằm hẳn dưới −' + dec(o.margin * 100, 0) + ' điểm' + (o.rule === 'strict' ? ' (luật chặt: khi cận dưới chạm −MARGIN)' : '') + '.',
          not: 'Một lần chạy chưa nói cổng ổn định.',
          real: 'Bấm "Chạy CI 20 lần" để đếm cổng đỏ bao nhiêu lần với cùng kịch bản.' };
        cap.innerHTML = '<div style="font-size:13.5px"><p style="margin:0 0 4px"><b>Chuyện gì xảy ra:</b> ' + c.what + '</p><p style="margin:0 0 4px"><b>Vì sao:</b> ' + c.why + '</p><p style="margin:0 0 4px"><b>Không có nghĩa là:</b> ' + c.not + '</p><p style="margin:0"><b>Trong hệ thống thật:</b> ' + c.real + '</p></div>';
      }

      function repeat20() {
        const gates = [['eval_gate (hi &lt; −MARGIN)', 'paired'], ['Luật chặt (lo &lt; −MARGIN)', 'strict'], ['Ngưỡng tuyệt đối ' + o.thr + '%', 'abs']];
        const shouldPass = o.scen === 'same' || o.scen === 'better' || o.scen === 'small';
        rep = gates.map(([name, rule]) => {
          let red = 0;
          for (let s = 1; s <= 20; s++) {
            const run = runOnce(cases, o.scen, o.k, 1000 + s);
            if (gate(cases, run, Object.assign({}, o, { rule, seed: 1000 + s }), 400, false).exit) red++;
          }
          return [name, red, shouldPass ? red <= 1 : red >= 19];
        });
        render();
      }

      const reset = () => { cases = makeCases(o.n, o.dist, 1); rep = null; render(); };
      const sN = slider('Số ca', 40, 400, 20, o.n, (v) => { o.n = Math.round(v); reset(); });
      const dist = select('Phân bổ ca', [['log', 'Lấy ngẫu nhiên từ log (80% tra đơn)'], ['balanced', 'Cân theo nhóm']], o.dist, (v) => { o.dist = v; reset(); });
      const scen = select('Candidate', Object.entries(SCEN), o.scen, (v) => { o.scen = v; rep = null; render(); });
      const sK = slider('Lần chạy mỗi ca', 1, 5, 1, o.k, (v) => { o.k = Math.round(v); rep = null; render(); });
      const sM = slider('MARGIN', 0, 0.05, 0.005, o.margin, (v) => { o.margin = v; rep = null; render(); }, (v) => dec(v * 100, 1) + ' điểm');
      const rule = select('Cổng', [['paired', 'eval_gate: hi < −MARGIN'], ['strict', 'Chặt: lo < −MARGIN'], ['abs', 'Ngưỡng tuyệt đối (promptfoo)']], o.rule, (v) => { o.rule = v; render(); });
      const sT = slider('Ngưỡng tuyệt đối', 80, 100, 1, o.thr, (v) => { o.thr = v; rep = null; render(); }, (v) => v + '%');
      const miss = select('Lần chạy candidate', [['ok', 'Đủ ca'], ['miss', 'Bị ngắt, thiếu 5 ca']], 'ok', (v) => { o.missing = v === 'miss'; render(); });
      const rerun = el('button', { text: 'Chạy lại (seed khác)', onclick: () => { o.seed += 1; render(); } });
      const r20 = el('button', { class: 'primary', text: 'Chạy CI 20 lần', onclick: repeat20 });

      stage.append(
        el('div', { class: 'row' }, [sN.node, dist.node]),
        el('h4', { text: 'Golden dataset: số ca theo nhóm', style: 'margin:4px 0' }), covBox,
        el('div', { class: 'row', style: 'margin-top:12px' }, [scen.node, sK.node]),
        el('div', { class: 'row' }, [rule.node, sM.node, sT.node, miss.node]),
        el('div', { class: 'row' }, [rerun, r20]),
        el('h4', { text: 'eval_gate: so cặp bằng bootstrap (2.000 lần rút) cho từng nhóm và tổng', style: 'margin:10px 0 4px' }), gateBox, exitBox,
        el('h4', { text: 'Cổng có chập chờn không?', style: 'margin:16px 0 4px' }), repBox,
        el('h4', { text: 'Phát hiện từ dữ liệu', style: 'margin:16px 0 4px' }), flags, cap,
        el('p', { class: 'hint', text: 'Mô phỏng. Tỉ lệ đúng mỗi lần của từng ca là giả định: khoảng 83% ca đúng 97–100%, 12% ca chập chờn 60–90%, 5% ca khó 20–40%. Baseline và candidate được rút độc lập từ tỉ lệ đó, K lần mỗi ca. Cổng theo logic eval_gate.py ở README §3.4 (MARGIN 2 điểm là ví dụ của README); bootstrap theo ca, không theo cụm. Ngưỡng tuyệt đối tính trên mọi lần chạy gộp lại như promptfoo; exit 100 là mặc định của promptfoo.' })

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
