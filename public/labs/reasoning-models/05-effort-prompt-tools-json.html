const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<ul><li>Bỏ "hãy suy nghĩ từng bước"; viết mục tiêu, ràng buộc, định dạng đầu ra.</li><li>Few-shot: OpenAI nói thường không cần; Claude nói ví dụ có lời giải mẫu vẫn hiệu quả. Thử cả hai trên eval.</li><li>Chỉ dẫn cấp cao về cách nghĩ thì có ích. "Nghĩ ít thôi" trên Sonnet 5.5, Haiku 5.5 không đủ: hạ effort.</li><li>OpenAI: developer message, markdown mặc định tắt. Claude 4.6 trở lên: prefill là 400.</li></ul>
<h4>Tool use (§3.3)</h4>
<ul><li>Gửi lại trạng thái suy luận trong tool loop. Chỉ đổi cấu hình thinking ở ranh giới user turn.</li><li>Forced tool use bị giới hạn trên nhiều model Claude; khi được chấp nhận thì model không suy luận trước tool call.</li><li>Effort thấp gọi ít tool hơn. Tool call bị cắt do <code>max_tokens</code> không được thực thi. Đặt trần lượt và token cho cả phiên agent.</li></ul>
<h4>Structured output và streaming (§3.4)</h4>
<ul><li>Provider đóng: suy luận và structured output dùng cùng nhau. Tự host: constrained decoding có thể chặn suy luận.</li><li>Kiểm tra <code>status</code>/<code>stop_reason</code>/<code>finishReason</code> trước khi parse JSON.</li><li>TTFT gồm thời gian suy luận; kết nối có thể im lặng hàng chục giây, đúng lúc proxy hay cắt.</li></ul>
<div class="tbl"><table><tr><th>Provider</th><th>Event suy luận khi stream</th></tr>
<tr><td>OpenAI Responses</td><td><code>response.reasoning_summary_text.delta</code>, <code>response.reasoning_text.delta</code>; lấy item từ <code>response.output_item.done</code></td></tr>

<tr><td>Gemini Interactions</td><td><code>step.delta</code> loại <code>thought_summary</code>, rồi <code>thought_signature</code></td></tr>
<tr><td>Grok, DeepSeek, vLLM</td><td><code>delta.reasoning_content</code> hoặc <code>delta.reasoning</code></td></tr></table></div>`,
    why: {

      s: '<code>high</code> cho mọi request: trả tiền suy luận cho FAQ mà không đúng hơn, có khi tệ đi. Effort động theo request mà bộ phân loại kém: câu khó bị gửi sang low. Đổi effort ở cấp request giữa hội thoại: mất cache. Prompt "hãy suy nghĩ từng bước": thừa với reasoning model, có thể làm tệ đi.',

      {

      {

            el('div', { class: 'cap', text: 'Thanh là input của từng vòng. Giả định: prompt ban đầu 2.000 token, mỗi vòng thêm 120 token tool call và 400 token kết quả tool. Với keep-all, phần thinking cũ tăng theo bình phương số vòng.' }));

        },
        take: 'Đặt trần số vòng và trần token cho cả phiên agent, không chỉ cho từng request.'
      },
      {
        q: 'max_tokens hết đúng lúc model đang viết tool call hoặc JSON. Chuyện gì xảy ra?',
        a: `<p>Suy luận được sinh trước, nên nó ăn phần lớn <code>max_tokens</code>. Nếu trần chạm giữa lúc viết tool call, tool call cuối có thể chưa đầy đủ. Claude dừng với <code>stop_reason: "max_tokens"</code>; nguyên tắc là <b>không thực thi tool call dở</b>. Với structured output, JSON bị cắt giữa chừng và parse lỗi.</p>
<p>Lab dưới đây cắt thật một chuỗi output theo số token (ước lượng 1 token ≈ 4 ký tự), rồi chạy <code>JSON.parse</code> thật trên phần còn lại.</p>`,
        viz(box) {
          const THINK = 900;
          const JS = JSON.stringify({ name: 'create_refund', input: { order_id: 'SV-4821', items: ['tai nghe'], duplicate_charge: true, reason: 'giao thiếu, trừ tiền hai lần' } });
          const out = el('div');
          const draw = (mx) => {
            const left = Math.max(0, mx - THINK), chars = left * 4, part = JS.slice(0, chars), done = chars >= JS.length;
            let parsed = 'OK'; try { JSON.parse(part); } catch (e) { parsed = 'lỗi: ' + e.message; }
            const stop = done ? 'end_turn / tool_use' : 'max_tokens';
            out.replaceChildren(hbars([['Suy luận', Math.min(THINK, mx), true], ['Tool call JSON', Math.min(left, Math.ceil(JS.length / 4))]], { max: THINK + Math.ceil(JS.length / 4), fmt: (v) => v + ' tok' }),
              el('pre', { class: 'mono', style: preStyle, text: part || '(chưa có ký tự nào của tool call)' }),
              el('div', { class: 'stat', html: `<span>stop_reason <b class="${done ? 'ok' : 'bad'}">${stop}</b></span><span>JSON.parse <b class="${parsed === 'OK' ? 'ok' : 'bad'}">${parsed.length > 40 ? parsed.slice(0, 40) + '…' : parsed}</b></span>` }),
              note(done ? 'ok' : 'bad', done ? 'Tool call đầy đủ, có thể thực thi sau khi validate.' : `<b>Không thực thi.</b> ${part ? 'Có một phần JSON trông hợp lệ, nhưng thiếu món hàng hoặc khoản trừ trùng: hoàn tiền dựa trên nó là hoàn sai.' : 'Suy luận đã ăn hết trần, chưa có chữ nào của tool call.'} Tăng <code>max_tokens</code> hoặc hạ effort; muốn tiếp tục thì gửi lại assistant turn nguyên văn kèm <code>tool_result</code> cho mỗi <code>tool_use</code>.`));
          };
          const s = slider('max_tokens', 500, 1000, 5, 920, draw);
          box.append(el('div', { class: 'row' }, [s.node]), out, el('div', { class: 'cap', text: '900 token suy luận là giả định. Trên production, trần nên lớn hơn nhiều (OpenAI khuyên ít nhất 25.000 lúc đầu); thang nhỏ ở đây chỉ để thấy chỗ cắt.' }));
          draw(920);
        },
        take: 'Kiểm tra stop_reason / status / finishReason trước khi parse hay thực thi. JSON "trông hợp lệ một nửa" là nguy hiểm nhất.'
      },
      {
        q: 'Trong lúc model im lặng suy nghĩ hàng chục giây, giao diện ShopViet nên hiển thị gì?',
        a: `<p>Hiện trạng thái "đang suy nghĩ" kèm thời gian đã trôi qua, để khách biết hệ thống chưa treo. Nếu provider trả bản tóm tắt suy luận (<code>summarized</code>, <code>reasoning.summary</code>, <code>thought_summary</code>), có thể hiển thị nhưng <b>trình bày khác câu trả lời</b> (thu gọn, chữ mờ) và đừng gọi nó là "lý do" của câu trả lời.</p>
<p>Với agent, Claude có <code>display: "updates"</code> (beta): suy luận vẫn ẩn, chỉ progress update giữa các tool call trả text đọc được, hợp để hiện "Đang tra đơn SV-4821...". Model có thể bỏ qua update, và viết ít update hơn ở effort cao, nên UI không được giả định lúc nào cũng có.</p>
<p>Phía hạ tầng: TTFT gồm cả suy luận, nên proxy cần idle timeout đủ dài và server nên gửi heartbeat (xem dòng thời gian B ở trên). Với self-host, nhớ rằng vLLM bật structured output thì model không suy luận: nếu cần cả hai, chạy hai bước.</p>`,
        take: 'Khoảng im lặng là chi phí thật của suy luận. Che nó bằng UI trung thực và hạ tầng stream, không bằng cách gọi bản tóm tắt là lời giải thích.'
      }
    ],
    poc: {
      goal: "Bảng routing effort với giá thật Sonnet 5.5, bảng khoảng im lặng trước chữ đầu tiên so với proxy 60 s, và một phép đo thật trên socket: server stream im lặng rồi mới trả chữ, client đọc với idle timeout. Lượng request, token, độ đúng và tốc độ sinh là <b>giả định</b>; thời gian trên socket nén 20 lần.",
      file: "docs/reasoning-models/pocs/05_effort_routing_stream.py",
      run: "uv run docs/reasoning-models/pocs/05_effort_routing_stream.py",
      needs: "chỉ <code>uv</code> và CPU, chạy dưới vài giây, miễn phí. Mở một HTTP server tạm trên <code>127.0.0.1</code>, chạy khoảng 8 giây.",
      output: "A. Routing effort theo loại câu hỏi (claude-sonnet-5-5, giá thật $2/$10; lượng/ngày, token, độ đúng: GIẢ ĐỊNH của lab)\nLoại                  Lượng/ngày  Ngưỡng  Mức chọn  Đúng ở mức chọn  Đúng ở high\n--------------------  ----------  ------  --------  ---------------  -----------\nFAQ giao hàng Đà Lạt  20.000      96%     off       97%              96%\nKhiếu nại SV-4821     2.000       87%     medium    87%              90%\nKhuyến mãi chồng      5.000       90%     high      92%              92%\n   Chi phí/ngày: high cho mọi thứ $699.40, thấp nhất đạt ngưỡng $553.40 → tiết kiệm 21% ($4,380.00/tháng)\n\nB. Khoảng im lặng trước chữ đầu tiên, bài khuyến mãi (80 token/s, proxy idle 60 s; tốc độ GIẢ ĐỊNH)\n   p95 = trung vị × e^(1,645×0.7) = 3.16 × trung vị (phân bố log-normal giả định)\nEffort  Phân vị  Suy luận  TTFT   omitted    summarized (mỗi 600 token)  heartbeat 15 s\n------  -------  --------  -----  ---------  --------------------------  --------------\nlow     p50      1.300     17 s   17 s       8 s                         15 s\nlow     p95      4.112     52 s   52 s       8 s                         15 s\nmedium  p50      3.600     46 s   45 s       8 s                         15 s\nmedium  p95      11.387    143 s  143 s CẮT  8 s                         15 s\nhigh    p50      8.200     103 s  103 s CẮT  8 s                         15 s\nhigh    p95      25.936    325 s  325 s CẮT  8 s                         15 s\nmax     p50      18.000    226 s  225 s CẮT  8 s                         15 s\nmax     p95      56.933    712 s  712 s CẮT  8 s                         15 s\n\nC. Đo thật trên socket: server stream im lặng 80 s rồi mới có chữ, client đọc với idle timeout 60 s\n   (thời gian nén 20 lần để chạy nhanh: 80 s → 4 s thật, 60 s → 3 s thật)\nServer              Thời gian (quy đổi)  Số ping  Kết cục\n------------------  -------------------  -------  -----------------------\nKhông heartbeat     60 s                 0        TIMEOUT, kết nối bị cắt\nHeartbeat mỗi 15 s  91 s                 6        nhận được câu trả lời\n\nD. Tool input / JSON bị cắt vì max_tokens\n   stop_reason=end_turn: {'order_id': 'SV-4821', 'items': ['tai nghe'], 'duplicate_charge': True}\n   stop_reason=max_tokens: KHÔNG parse, KHÔNG thực thi. (Nếu cứ parse: JSONDecodeError: Expecting property name enclosed in double quotes)\n\nRút ra: chọn effort theo loại câu hỏi rẻ hơn 21% so với high cho mọi thứ mà vẫn đạt mọi ngưỡng (off = model không suy luận).\nVới display omitted, cả thời gian suy luận là khoảng im lặng: proxy 60 s cắt từ p95 của medium và p50 của high;\ntrên socket thật, không heartbeat thì timeout ở giây 60, có ping 15 s thì nhận đủ câu trả lời.",
      measured: true,
      read: ["Phần A: chọn mức thấp nhất đạt ngưỡng tiết kiệm 21% so với high cho mọi thứ; phần lớn tiền còn lại là câu khuyến mãi ở high.", "Phần B: với <code>display: \"omitted\"</code> khoảng im lặng bằng cả TTFT, proxy 60 s cắt từ p95 của medium; summarized hoặc heartbeat giữ khoảng lặng dưới 15 s.", "Phần C (đo thật): không heartbeat thì timeout ở giây 60, có ping mỗi 15 s thì nhận được câu trả lời.", "Phần D: JSON bị cắt vì <code>max_tokens</code> không parse được; kiểm tra <code>stop_reason</code> trước."]

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
