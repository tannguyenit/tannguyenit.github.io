const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

        a: `<p>Vào phần suy luận. README §3.4: TTFT của reasoning model <b>bao gồm cả thời gian suy luận</b>. Khi provider không stream nội dung suy luận, kết nối có thể im lặng hàng chục giây.</p>

<p>Với chat cần phản hồi nhanh, README gợi ý dùng <code>low</code> hoặc <code>medium</code>, stream kèm trạng thái "đang suy nghĩ" và thời gian đã trôi qua.</p>`,
        take: 'Effort là đòn bẩy độ trễ lớn nhất trên reasoning model, lớn hơn mọi tối ưu mạng hay prompt (README §3.5).'
      },
      {
        q: 'Lượt sau phải gửi lại những gì? Sao không tự dựng lại lịch sử từ text khách đã thấy?',
        a: `<p>API kiểu Claude Messages là <b>stateless</b>: server không nhớ gì giữa hai request, bạn gửi lại cả lịch sử. Nhưng response có một trạng thái ẩn: thinking block kèm <code>signature</code>. Signature là thứ để model nối tiếp mạch suy luận.</p>
<p>Trong tool loop, nếu bạn chỉ gửi lại text và tool_use mà bỏ thinking block, model mất mạch suy luận đã dẫn đến tool call, và phần lớn trường hợp API trả 400 (README §1.5). Đây đúng là lỗi "agent báo 400 ở lượt thứ hai của tool loop" trong câu chuyện mở đầu.</p>
<p>Quy tắc an toàn: <b>lưu nguyên response, gửi lại nguyên văn, để API tự lọc</b>. Docs Claude: gửi lại mọi thứ, API tự bỏ những gì model không cần. Chọn "Khiếu nại" ở hình chính rồi đổi "Code lưu lịch sử" sang "chỉ giữ text".</p>`,
        take: 'Lịch sử hội thoại là bản lưu response của provider, không phải bản lưu những gì khách nhìn thấy.'
      },
      {
        q: 'Muốn hạ effort giữa cuộc chat cho rẻ, đổi tham số ở request sau là xong?',
        a: `<p>Chạy được nhưng mất cache. README §1.5: cấu hình suy luận nằm trong phần prompt được render, nên đổi effort ở cấp request làm cache miss. Ví dụ trong docs Claude: request thứ ba đổi effort từ <code>medium</code> sang <code>low</code> cho kết quả <code>cache_read_input_tokens: 0</code>.</p>
<p>Cách giữ cache: OpenAI dùng item <code>{"type": "configuration_update", "reasoning": {"effort": "high"}}</code> trong <code>input</code>; Claude dùng per-message effort (beta <code>mid-conversation-output-config-2026-07-01</code>), một message <code>role: "system"</code> rỗng mang <code>output_config.effort</code> mới. Lab 03 đi sâu phần này.</p>`,
        take: 'Đổi cấu hình giữa hội thoại bằng cơ chế của provider, không bằng tham số cấp request.'
      },
      {
        q: 'Bản tóm tắt suy luận trông rất hợp lý. Dùng nó để giải thích cho khách vì sao bị từ chối hoàn tiền được không?',
        a: `<p>Không nên. Tóm tắt của Claude do <b>một model khác</b> viết, không phải bản ghi những gì model đã tính (README §1.2). Sâu hơn nữa, chính chuỗi suy luận gốc cũng không trung thực hoàn toàn: khi cài gợi ý vào câu hỏi, Claude 3.7 Sonnet chỉ nhắc tới gợi ý trong 25% số lần, DeepSeek R1 là 39%.</p>
<p>Nếu cần lý do kiểm tra được, yêu cầu model trích dẫn bằng chứng ngay trong câu trả lời (ví dụ "theo chính sách hoàn tiền mục 4.2") và kiểm tra trích dẫn bằng code. Suy luận vẫn có ích để debug, như một log gợi ý.</p>`,
        take: 'Suy luận là log gợi ý cho kỹ sư, không phải lời giải thích cho khách hay cho kiểm toán.'
      },
      {
        q: 'Vậy ShopViet nên cấu hình thế nào cho cả ba loại câu hỏi?',
        a: `<p>Chia traffic theo loại việc, mỗi loại một mức effort (README §3.1). Hình dưới so chi phí một tháng của hai cách, với tỉ lệ traffic giả định 80% FAQ, 12% khiếu nại, 8% tính giá, 20.000 request/ngày, và cùng bảng token giả định của hình chính.</p>`,
        viz(box) {
          const mix = { faq: 0.8, complaint: 0.12, promo: 0.08 }, N = 20000 * 30;
          const monthly = (pick) => Object.keys(mix).reduce((s, k) => s + run({ task: k, eff: pick(k), maxTok: 64000, display: 'omitted' }).cost * mix[k] * N, 0);
          const acc = (pick) => Object.keys(mix).reduce((s, k) => s + TASKS[k].acc[pick(k)] * mix[k], 0);
          const rows = [['high cho mọi request', () => 'high'], ['Theo loại: FAQ off, còn lại medium', (k) => (k === 'faq' ? 'off' : 'medium')], ['Theo loại: FAQ off, khiếu nại medium, tính giá high', (k) => (k === 'faq' ? 'off' : k === 'promo' ? 'high' : 'medium')]];
          const vals = rows.map(([n, p]) => [n, monthly(p), acc(p)]), mx = Math.max(...vals.map((v) => v[1]));
          box.append(hbars(vals.map(([n, v], i) => [n, v, i === 2]), { max: mx, fmt: (v) => usd(v) }),
            el('div', { class: 'stat', html: vals.map(([n, , a]) => `<span>${n.split(':')[0]}: đúng ~<b>${a.toFixed(1)}%</b></span>`).join('') }),
            el('div', { class: 'cap', text: `Giá thật Sonnet 5.5: $${P_IN}/1M input, $${P_OUT}/1M output (Cost optimization §2.1). Độ đúng là số giả định có trọng số theo tỉ lệ traffic.` }));
        },
        take: 'Phần lớn tiền suy luận nằm ở loại việc chiếm nhiều traffic nhất. Hạ effort đúng chỗ đó tiết kiệm nhiều nhất mà gần như không mất độ đúng.'
      }
    ],
    poc: {
      goal: "Dựng request Claude Messages thật cho ba việc của ShopViet, đếm token input thật, rồi đi qua bốn bước: sinh suy luận, chạm hay không chạm <code>max_tokens</code>, tính tiền theo giá thật Sonnet 5.5, lưu lịch sử cho vòng hai của tool loop. Token suy luận và câu trả lời là số <b>giả định</b> của lab.",
      file: "docs/reasoning-models/pocs/00_workflow.py",
      run: "uv run docs/reasoning-models/pocs/00_workflow.py",
      needs: "chỉ <code>uv</code> và CPU, chạy dưới vài giây, miễn phí. Token đếm bằng <code>tiktoken</code> (tokenizer OpenAI), chỉ để ước lượng.",
      output: "Bước 1–3: request thật dạng Claude Messages (claude-sonnet-5-5, effort medium) → sinh → tính tiền\n  Token input đếm bằng tiktoken o200k (tokenizer OpenAI, chỉ để ước lượng; Claude đếm khác).\n  Token suy luận và câu trả lời là số GIẢ ĐỊNH của lab (README không có số cho ShopViet).\nViệc                  Input  Suy luận  Trả lời  % output ẩn  Tiền      Riêng suy luận\n--------------------  -----  --------  -------  -----------  --------  --------------\nFAQ giao hàng Đà Lạt  122    120       70       63%          $0.00214  $0.00120\nKhiếu nại SV-4821     206    1.900     260      88%          $0.0220   $0.0190\nKhuyến mãi chồng      173    3.600     320      92%          $0.0395   $0.0360\n  Giá thật: Sonnet 5.5 $2 input / $10 output mỗi 1M token (docs/cost-optimization/README.md §2.1).\n\nBước 2 lặp lại với max_tokens khác nhau: bài khuyến mãi, 3.600 token suy luận + 320 token trả lời (giả định)\nmax_tokens  Suy luận đã sinh  Trả lời  stop_reason  Tiền output vẫn trả\n----------  ----------------  -------  -----------  -------------------\n256         256               0/320    max_tokens   $0.00256\n1.000       1.000             0/320    max_tokens   $0.0100\n3.800       3.600             200/320  max_tokens   $0.0380\n4.000       3.600             320/320  end_turn     $0.0392\n16.000      3.600             320/320  end_turn     $0.0392\n\nBước 4: lưu lịch sử của tool loop (khiếu nại SV-4821) rồi gửi vòng hai\n  Không gọi API: bộ kiểm tra áp quy tắc README §1.5 lên request thật mà code sẽ gửi.\n  Lưu nguyên response      → hợp lệ: thinking block (rỗng vì display omitted) + signature đi cùng tool_use\n  Chỉ giữ text / tool_use  → 400: messages[1] tool_use thiếu thinking\n\nRút ra: ở effort medium, 85–92% output của hai việc khó là suy luận không ai đọc nhưng vẫn trả tiền;\nmax_tokens tính cả phần đó nên trần 256 hay 1.000 cho ra response rỗng; và bỏ thinking block khỏi lịch sử là 400 ở vòng hai.",
      measured: true,
      read: ["Cột <b>% output ẩn</b>: 88% với khiếu nại, 92% với khuyến mãi. Đó là phần trả tiền mà không ai đọc.", "Cột <b>Tiền</b> dùng giá thật Sonnet 5.5 ($2 input / $10 output mỗi 1M token, Cost Optimization §2.1), cùng giá với hình chính của lab.", "Bảng <code>max_tokens</code>: 256 và 1.000 cho 0/320 token trả lời mà vẫn trả tiền phần đã sinh; 3.800 cho câu trả lời cụt.", "Bước 4: 400 là luật README §1.5 được mã hoá, không phải API thật trả về."]
    },
    mount(stage) {
      const st = { task: 'promo', eff: 'high', display: 'omitted', maxTok: 25000, keep: 'raw', rpd: 20000 };
      const pipe = el('svg', { class: 'canvas', viewBox: '0 0 860 120', role: 'img', 'aria-label': 'Bốn bước của một request có suy luận' });
      const bars = el('svg', { class: 'canvas', viewBox: '0 0 860 110', role: 'img', 'aria-label': 'Token tính tiền so với token nhìn thấy' });
      const stat = el('div', { class: 'stat' }), flags = el('div');
      const pre = el('pre', { class: 'mono', style: 'background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;overflow-x:auto;max-height:340px;margin:6px 0 0' });
      const payNote = el('div');

      function drawPipe(r) {
        const W = 860, bw = 190, gap = (W - 4 * bw) / 3;
        const steps = [
          ['1. Chọn effort', `effort: ${st.eff}`, `max_tokens: ${fT(st.maxTok)}`, 'var(--g1)'],
          ['2. Suy luận', `${fT(r.thinkGen)} token`, st.display === 'summarized' ? `thấy ~${fT(r.visThink)} (tóm tắt)` : 'thấy 0 (omitted)', 'var(--warn)'],
          ['3. Trả lời', r.empty ? 'rỗng' : `${fT(r.ansGen)} token`, `TTFT ${fs(r.ttft)}`, r.empty ? 'var(--bad)' : 'var(--accent)'],
          ['4. Lượt sau', st.keep === 'raw' ? 'gửi lại nguyên văn' : 'chỉ giữ text', r.t.tool ? 'đang trong tool loop' : 'user turn mới', st.keep === 'raw' || !r.t.tool ? 'var(--ok)' : 'var(--bad)']
        ];
        const kids = [];
        steps.forEach(([h, a, b, col], i) => {
          const x = i * (bw + gap);
          kids.push(el('rect', { x: x + 1, y: 10, width: bw - 2, height: 96, rx: 8, fill: 'var(--panel)', stroke: col, 'stroke-width': 2.5 }),
            el('text', { x: x + 12, y: 36, text: h, style: 'font-weight:700' }), el('text', { x: x + 12, y: 62, text: a, class: 'mono', style: 'font-size:12px' }), el('text', { x: x + 12, y: 86, text: b, class: 'mute', style: 'font-size:12px' }));
          if (i < 3) kids.push(el('path', { d: `M${x + bw + 4} 58 L${x + bw + gap - 6} 58`, stroke: 'var(--mute)', 'stroke-width': 2, fill: 'none' }), el('polygon', { points: `${x + bw + gap - 6},53 ${x + bw + gap},58 ${x + bw + gap - 6},63`, fill: 'var(--mute)' }));
        });
        pipe.replaceChildren(...kids);
      }

      function drawBars(r) {
        const W = 860, L = 90, R = 10, full = r.think + r.ans;
        const scale = Math.max(full, Math.min(st.maxTok, full * 1.6), 200);
        const X = (n) => L + (Math.min(n, scale) / scale) * (W - L - R);
        const kids = [el('text', { x: 0, y: 32, text: 'Tính tiền' }), el('text', { x: 0, y: 78, text: 'Bạn thấy' }),
          el('rect', { x: L, y: 16, width: X(r.thinkGen) - L, height: 24, fill: 'var(--warn)' }),
          el('rect', { x: X(r.thinkGen), y: 16, width: X(r.thinkGen + r.ansGen) - X(r.thinkGen), height: 24, fill: 'var(--accent)' }),
          el('rect', { x: L, y: 62, width: X(r.visThink) - L, height: 24, fill: 'var(--warn)', opacity: 0.45 }),
          el('rect', { x: X(r.visThink), y: 62, width: X(r.visThink + r.ansGen) - X(r.visThink), height: 24, fill: 'var(--accent)' }),
          el('text', { x: L + 4, y: 104, class: 'mute', style: 'font-size:11px', text: `cam: suy luận ${fT(r.thinkGen)} · xanh: trả lời ${fT(r.ansGen)} · mờ: tóm tắt nhìn thấy ${fT(r.visThink)}` })];
        if (r.cut && r.think > r.thinkGen) kids.push(el('rect', { x: X(r.thinkGen), y: 16, width: Math.max(0, X(r.think) - X(r.thinkGen)), height: 24, fill: 'none', stroke: 'var(--warn)', 'stroke-dasharray': '4 3' }));
        if (st.maxTok <= scale) kids.push(el('line', { x1: X(st.maxTok), x2: X(st.maxTok), y1: 8, y2: 92, stroke: 'var(--bad)', 'stroke-width': 2.5 }), el('text', { x: Math.min(X(st.maxTok) + 4, W - 120), y: 12, text: 'max_tokens', style: 'font-size:11px;fill:var(--bad)' }));
        else kids.push(el('text', { x: W - 200, y: 12, class: 'mute', style: 'font-size:11px', text: `max_tokens ${fT(st.maxTok)} (ngoài hình)` }));
        bars.replaceChildren(...kids);
      }

      function render() {
        const r = run(st);
        drawPipe(r); drawBars(r);
        const month = r.cost * st.rpd * 30;
        stat.innerHTML = `<span>Input ước lượng: <b>${fT(r.inTok)}</b></span><span>TTFT: <b class="${r.ttft > LB ? 'bad' : ''}">${fs(r.ttft)}</b></span><span>Tổng: <b>${fs(r.total)}</b></span><span>Tiền/request: <b>${usd(r.cost)}</b></span><span>Tháng (${fT(st.rpd)}/ngày): <b>${usd(month)}</b></span><span>Phần tiền cho suy luận: <b>${r.cost ? Math.round((r.costThink / r.cost) * 100) : 0}%</b></span><span>Độ đúng ước tính: <b>${r.empty ? 0 : r.acc}%</b> (tắt: ${r.accLow}%)</span>`;
        const f = [];
        if (r.empty) f.push(flag('bad', `<b>Response rỗng.</b> Model đã sinh ${fT(r.thinkGen)} token suy luận thì chạm max_tokens = ${fT(st.maxTok)}, chưa viết chữ trả lời nào. Claude trả <code>stop_reason: "max_tokens"</code>, OpenAI trả <code>status: "incomplete"</code>. Bạn vẫn trả tiền ${fT(r.thinkGen)} token đó. Không có nghĩa model "không biết giải": nó chưa kịp giải xong.<br>Trong hệ thống thật: đặt trần rộng (OpenAI ≥ 25.000 lúc đầu), kiểm tra status trước khi dùng output, không retry vô điều kiện request bị cắt.`));
        else if (r.cut) f.push(flag('bad', `<b>Câu trả lời bị cắt</b> sau ${fT(r.ansGen)}/${fT(r.ans)} token. Với bài tool loop, tool call dở không được thực thi.`));
        if (st.task === 'faq' && (st.eff === 'high' || st.eff === 'max')) f.push(flag('warn', `<b>Effort ${st.eff} cho câu FAQ.</b> Tiền gấp ${(r.cost / run(Object.assign({}, st, { eff: 'off' })).cost).toFixed(1)} lần mức tắt mà độ đúng ước tính ${r.acc}% so với ${r.accLow}%: không tăng, còn có thể giảm. README gọi đây là overthinking.<br>Trong hệ thống thật: route FAQ sang effort thấp nhất hoặc model không suy luận.`));
        if (r.ttft > LB) f.push(flag('warn', `<b>TTFT ${fs(r.ttft)} vượt 60 giây</b>, timeout mặc định của nhiều load balancer (README §3.5). Khách nhìn màn hình trống, proxy có thể cắt kết nối trước khi có chữ đầu.<br>Trong hệ thống thật: stream kèm heartbeat, nới timeout, hoặc chạy nền với request rất dài.`));
        if (st.display === 'omitted' && r.thinkGen > 0) f.push(flag('warn', `Bạn trả tiền <b>${fT(r.thinkGen)} token</b> suy luận mà không thấy chữ nào (<code>display: "omitted"</code>). Đổi sang summarized cũng không đổi số tiền, chỉ đổi thứ bạn thấy.`));
        if (r.think === 0 && st.eff !== 'off') f.push(flag('ok', 'Adaptive: với câu dễ ở effort thấp, model có thể không tạo thinking block nào (giả định trong bảng token). Code không được giả định lúc nào cũng có block.'));
        flags.replaceChildren(...f);
        pre.textContent = payload(st, r);
        const pn = [];
        if (st.keep === 'text' && r.t.tool && r.thinkGen > 0) pn.push(flag('bad', '<b>400 ở vòng hai của tool loop.</b> Assistant turn có tool_use nhưng thiếu thinking block đã sinh ra nó. Model mất mạch suy luận dẫn tới tool call; README §1.5: phần lớn trường hợp API trả 400.<br>Trong hệ thống thật: <code>messages.append({"role": "assistant", "content": resp.content})</code>, không lọc theo type, không dựng lại từ text.'));
        else if (st.keep === 'text' && r.thinkGen > 0) pn.push(flag('warn', 'Không lỗi ngay vì đây là user turn mới, không phải tool loop. Nhưng trái quy tắc "gửi lại nguyên văn": với model keep-all (Sonnet 5.5), model mất suy luận của lượt trước.'));
        else if (r.thinkGen > 0) pn.push(flag('ok', 'Thinking block được gửi lại nguyên văn, kể cả khi <code>thinking</code> là chuỗi rỗng (omitted). Signature giống nhau với mọi giá trị display.'));
        payNote.replaceChildren(...pn);
      }

      const tS = select('Việc', Object.entries(TASKS).map(([k, v]) => [k, v.name]), st.task, (v) => { st.task = v; render(); });
      const eS = select('Effort', EFF, st.eff, (v) => { st.eff = v; render(); });
      const dS = select('Display', [['omitted', 'omitted (rỗng, mặc định Claude 5.x)'], ['summarized', 'summarized (tóm tắt)']], st.display, (v) => { st.display = v; render(); });
      const mS = select('max_tokens', [256, 1000, 4000, 16000, 25000, 64000, 128000].map((n) => [n, fT(n)]), st.maxTok, (v) => { st.maxTok = +v; render(); });
      const kS = select('Code lưu lịch sử', [['raw', 'lưu nguyên response'], ['text', 'chỉ giữ text / tool_use']], st.keep, (v) => { st.keep = v; render(); });
      const rS = slider('Request/ngày', 1000, 100000, 1000, st.rpd, (v) => { st.rpd = v; render(); }, fT);
      stage.append(el('div', { class: 'row' }, [tS.node, eS.node]), el('div', { class: 'row' }, [dS.node, mS.node, rS.node]), pipe, bars, stat, flags,
        el('h4', { text: 'Request lượt sau (dạng Claude Messages)', style: 'margin:18px 0 4px' }), el('div', { class: 'row' }, [kS.node]), pre, payNote,
        el('p', { class: 'hint', text: `Số giả định (README không có): token suy luận theo effort và độ đúng của từng việc; giá $${P_IN}/1M input và $${P_OUT}/1M output; tốc độ ${SPEED} token/giây; độ trễ nền ${BASE} s; system prompt ${fT(SYS)} token; tóm tắt dài ~${SUMR * 100}% phần suy luận. Input của câu hỏi ước lượng bằng số ký tự / 3. Mốc 60 giây, 25.000 token và quy tắc gửi lại lấy từ README.` }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
