const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const TURNS = [
    { u: 'Giao tới Đà Lạt mất mấy ngày?', ut: 20, th: 0, ans: 40, tool: false },

  ];
  const PROV = {
    claudeKeep: { name: 'Claude Sonnet 5.5 (keep-all, preserved thinking)', claude: true, oldIn: true, loop: '400: tool_use thiếu thinking block đã sinh ra nó', cross: 'silent', bind: true, eff: { request: 'miss', mid: 'ok' } },

    oaiResp: { name: 'OpenAI Responses gpt-5.6, tự quản lịch sử', oldIn: true, loop: '400: thiếu reasoning item khi có function call', cross: 'silent', eff: { request: 'miss', mid: 'ok' } },

    gemini: { name: 'Gemini 3.5 Flash, generateContent stateless', oldIn: null, loop: 'finishReason: MISSING_THOUGHT_SIGNATURE', cross: 'gem', eff: { request: 'unk', mid: 'unk' } },
    deepseek: { name: 'DeepSeek, request có tools', always: true, oldIn: true, loop: '400: thiếu reasoning_content', cross: 'err', eff: { request: 'unk', mid: 'unk' } }
  };
  const SYS = 1500, TOOLIO = 90, P_IN = 2, P_OUT = 10, CR = 0.05;
  const RANK = { ok: 0, silent: 1, risk: 2, err: 3 };
  const fT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const usd = (x) => '$' + x.toFixed(4);
  const flag = (kind, html) => el('div', { style: `border-left:4px solid var(--${kind});background:color-mix(in srgb, var(--${kind}) 9%, var(--panel));padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:13.5px`, html });

  function simulate(c) {
    const P = PROV[c.p], s = P.stateful || P.none || (c.s === 'filter' && !P.claude) ? 'raw' : c.s, rows = [];
    let blocked = false, prevPrompt = 0, histText = SYS;
    TURNS.forEach((t, i) => {
      if (blocked) { rows.push({ i, blocked: true }); return; }
      const notes = [];
      let st = 'ok', cacheBreak = false;
      const bump = (k, msg) => { if (RANK[k] > RANK[st]) st = k; notes.push([k, msg]); };
      const priorTh = P.always ? i > 0 : TURNS.slice(0, i).some((x) => x.th > 0);
      const oldThink = (s === 'raw' || s === 'filter') && P.oldIn === true ? TURNS.slice(0, i).reduce((a, x) => a + x.th, 0) : 0;
      if ((s === 'text' || s === 'between') && priorTh) {
        if (P.cross === 'err') bump('err', '400: request có tools nhưng thiếu reasoning_content của lượt trước (README §1.5)');
        else if (P.cross === 'gem') bump('err', 'finishReason: MISSING_THOUGHT_SIGNATURE, lịch sử thiếu thought signature (README §3.7)');
        else if (P.cross === 'silent') bump('silent', 'Không lỗi, nhưng model mất suy luận các lượt trước (model này đọc suy luận của mọi lượt)');
        else notes.push(['ok', 'API vốn tự bỏ thinking của lượt cũ, nên bỏ trước cũng không đổi gì']);
      }
      if (c.edit && i === 3) {
        cacheBreak = true;
        if (P.bind && s !== 'text') bump('risk', 'Sửa system prompt: mọi thinking block sinh trước chỗ sửa mất hiệu lực. Sonnet 5.5 có thể trả 400 hoặc không báo lỗi; nếu không lỗi, block vẫn bị tính tiền và model làm tiếp dựa trên suy luận về prompt cũ (README §1.5)');
        else notes.push(['silent', 'Sửa system prompt: prefix đổi từ token đầu, cache miss toàn bộ']);
      }
      if (i === 2 && c.eff !== 'none') {
        const r = P.eff[c.eff];
        if (r === 'miss') { cacheBreak = true; notes.push(['silent', c.eff === 'request' ? 'Đổi effort ở cấp request: cấu hình nằm trong prompt được render, cache_read_input_tokens: 0' : 'Không có cơ chế đổi giữa chừng, đành đổi ở cấp request: cache miss']); }
        else if (r === 'na') { cacheBreak = true; notes.push(['silent', 'Chat Completions không có configuration_update (README chỉ mô tả cho Responses): đổi ở cấp request, cache miss']); }
        else if (r === 'ok') notes.push(['ok', P.claude ? 'Per-message effort (beta): message role "system" rỗng mang output_config.effort; prefix giữ nguyên, cache vẫn khớp' : 'Item configuration_update trong input: prefix giữ nguyên, cache vẫn khớp']);
        else if (r === 'err') bump('err', '400: output_config.effort requires a model that supports per-turn effort (Haiku 4.5 không có trong danh sách hỗ trợ)');
        else notes.push(['silent', 'README không nêu ảnh hưởng tới cache với provider này: phải tự đo']);
      }
      if (t.tool && t.th > 0) {
        if (P.none) bump('silent', 'Reasoning không vào context lượt sau: docs ghi chất lượng có thể giảm nhẹ và token suy luận tăng trong workflow nhiều function call');
        else if (!P.stateful && s === 'text') bump('err', P.loop + ' (vòng hai của tool loop)');
        else if (!P.stateful && s === 'filter' && P.claude && t.redacted) bump('err', 'Tool loop hỏng: lọc block.type == "thinking" làm mất redacted_thinking (README §1.2, §3.7)');
        else if (P.stateful) notes.push(['ok', 'Server giữ trạng thái suy luận, bạn chỉ gửi previous_response_id']);
      }
      if (c.s === 'filter' && !P.claude && !P.stateful && !P.none && i === 0) notes.push(['ok', 'Lọc theo type "thinking" là lỗi riêng của Claude; provider này coi như gửi nguyên văn']);
      const hist = histText + oldThink + t.ut;
      const cache1 = i === 0 || cacheBreak ? 0 : Math.min(prevPrompt, hist - t.ut);
      const reqs = [[hist, cache1]];
      const loopOk = st !== 'err';
      if (t.tool && loopOk) { const h2 = hist + (P.none ? 0 : t.th) + TOOLIO; reqs.push([h2, hist]); }
      const inTok = reqs.reduce((a, r) => a + r[0], 0), cached = reqs.reduce((a, r) => a + r[1], 0);
      const outTok = st === 'err' && !t.tool ? 0 : t.th + (t.tool ? 30 : 0) + (loopOk ? t.ans : 0);
      const billed = !(st === 'err' && !t.tool);
      const cost = billed ? ((inTok - cached) * P_IN + cached * P_IN * CR + outTok * P_OUT) / 1e6 : 0;
      rows.push({ i, st, notes, hist, histText, oldThink, ut: t.ut, inTok, cached, cache1, outTok, cost, reqs: reqs.length });
      prevPrompt = reqs[reqs.length - 1][0];
      histText += t.ut + t.ans + (t.tool ? TOOLIO : 0);
      if (st === 'err') blocked = true;
    });
    return rows;
  }

              el('div', { style: 'display:flex;height:14px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden' }, [

        const cost = sum(R, (r) => r.cost), bcost = sum(base, (r) => r.cost), inT = sum(R, (r) => r.inTok), ca = sum(R, (r) => r.cached), old = sum(R, (r) => r.oldThink);

        if (risk) f.push(flag('bad', `<b>Lượt ${risk.i + 1} có thể lỗi hoặc tệ hơn: chạy mà sai.</b> Sửa system prompt làm mất hiệu lực thinking cũ. Nếu API không báo lỗi, model vẫn đọc suy luận về prompt cũ và bạn vẫn trả tiền cho nó.<br>Trong hệ thống thật: lịch sử append-only; đặt <code>prefix_mismatch_behavior: "error"</code> để lỗi lộ ra thay vì âm thầm.`));
        const miss = R.filter((r) => !r.blocked && r.i > 0 && r.cached === 0);
        if (miss.length) f.push(flag('warn', `<b>Cache miss ở lượt ${miss.map((r) => r.i + 1).join(', ')}:</b> ${fT(miss.reduce((a, r) => a + r.hist, 0))} token input tính giá đầy đủ thay vì giá cache read. Đổi effort ở cấp request hoặc sửa system prompt làm prefix khác từ đầu. Không có nghĩa cache hỏng: nó đang làm đúng việc là chỉ khớp prefix giống hệt.<br>Trong hệ thống thật: <code>configuration_update</code> hoặc per-message effort; không sửa phần đầu của prompt giữa phiên.`));
        const silent = R.find((r) => !r.blocked && r.notes.some((n) => n[0] === 'silent' && /mất suy luận/.test(n[1])));
        if (silent) f.push(flag('warn', '<b>Không lỗi, nhưng model quên suy luận cũ.</b> Model này đọc suy luận của mọi lượt; code chỉ giữ text nên lượt sau model phải nghĩ lại từ đầu hoặc thiếu ngữ cảnh. Lỗi kiểu này chỉ thấy qua eval chất lượng, không thấy trong log lỗi.'));
        if (!stop && old > 0 && st.p === 'claudeKeep') f.push(flag('ok', `Keep-all: ${fT(old)} token thinking cũ đi kèm input qua các lượt. Đó là giá của việc model nhớ suy luận; phần lớn đọc từ cache nếu prefix ổn định.`));
        flags.replaceChildren(...f);
      }
      const pS = select('Provider', Object.entries(PROV).map(([k, v]) => [k, v.name]), st.p, (v) => { st.p = v; render(); });
      const sS = select('Code lưu lịch sử', [['raw', 'lưu nguyên response'], ['text', 'chỉ giữ role + text / tool call'], ['between', 'giữ nguyên trong tool loop, lưu DB chỉ text'], ['filter', 'lọc block.type == "thinking"']], st.s, (v) => { st.s = v; render(); });
      const eS = select('Lượt 3 hạ effort', [['none', 'không đổi'], ['request', 'đổi tham số cấp request'], ['mid', 'cơ chế giữa chừng của provider']], st.eff, (v) => { st.eff = v; render(); });
      const ed = el('input', { type: 'checkbox' }); ed.addEventListener('change', () => { st.edit = ed.checked; render(); });
      stage.append(el('div', { class: 'row' }, [pS.node, sS.node]), el('div', { class: 'row' }, [eS.node, el('label', { class: 'ctl' }, [ed, 'Sửa system prompt trước lượt 4'])]),
        el('div', { class: 'legend', html: '<span><i style="background:var(--g1)"></i>system + lịch sử text</span><span><i style="background:var(--warn)"></i>thinking cũ gửi lại</span><span><i style="background:var(--accent)"></i>câu mới</span><span><i style="background:var(--ok)"></i>đọc từ cache</span>' }),
        list, stat, flags,
        el('p', { class: 'hint', text: 'Giả định: token mỗi lượt, system + tools 1.500 token, mỗi vòng tool 90 token, giá Sonnet 5.5 theo Cost optimization §2.1 ($2/1M input, $10/1M output, $0,10/1M cache read) áp cho mọi provider, bỏ qua phí ghi cache, cache khớp phần lịch sử trùng với request trước. Với OpenAI, thinking cũ (reasoning.context all_turns) được tính như input là giả định. Quy tắc 400, MISSING_THOUGHT_SIGNATURE, keep-all, cache miss khi đổi effort và prefix binding lấy từ README §1.2, §1.5, §2.2, §2.3, §3.7.' }));
      render();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
