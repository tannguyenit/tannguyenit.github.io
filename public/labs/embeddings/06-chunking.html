const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson({
  id: 'chunking', nav: '6. Chunking', ref: '§1.4.3, §3.3',
  title: 'Câu trả lời bị cắt đôi thì retriever chỉ tìm được nửa',
  hook: 'Câu hỏi: "Hoàn tiền trong bao lâu và cần giấy tờ gì?". Chỉnh kích thước và overlap, xem có chunk nào chứa trọn câu trả lời.',
  terms: [['Chunk', 'Một mảnh của tài liệu, là đơn vị được embed và tìm kiếm. Tài liệu dài được cắt thành nhiều chunk.'], ['Token', 'Đơn vị model dùng để đếm văn bản. Tiếng Anh khoảng 3/4 từ mỗi token, tiếng Việt thường tốn nhiều token hơn mỗi từ. Lab dùng "từ" để xấp xỉ.'], ['Overlap', 'Hai chunk liền nhau chia sẻ một đoạn chung. Là vùng đệm để một ý nằm sát ranh giới vẫn trọn vẹn trong ít nhất một chunk.'], ['Giới hạn đầu vào của model', 'Mỗi embedding model chỉ nhận tối đa một số token nhất định (từ 256 đến 8192). Vượt thì bị cắt mất hoặc báo lỗi.'], ['Số vector', 'Mỗi chunk là một vector phải lưu. Nhiều chunk hơn nghĩa là nhiều RAM hơn, tốn tiền embed hơn.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Trang <i>"Chính sách đổi trả"</i> nói: <i>"Thời hạn hoàn tiền là 30 ngày"</i> ở câu này và <i>"Khách cần xuất trình hóa đơn gốc"</i> ở câu ngay sau. Nếu chunk cắt ở giữa hai câu, trợ lý chỉ thấy "30 ngày", khách đến cửa hàng mà thiếu hóa đơn.',
    scenario: 'Tài liệu chính sách đổi trả có 9 câu. Câu trả lời cho "Hoàn tiền trong bao lâu và cần giấy tờ gì?" nằm ở hai câu liền nhau. Retriever chỉ trả về từng chunk riêng lẻ.',
    ask: 'Cắt tài liệu thế nào để có ít nhất một chunk chứa trọn câu trả lời?',
    solves: 'Chọn cách cắt, kích thước và overlap để ranh giới chunk không rơi vào giữa câu trả lời, mà không tạo ra quá nhiều vector.',
    read: ['Dải trên cùng là cả tài liệu. Vùng sáng là hai câu chứa đáp án. Mỗi thanh màu là một chunk.', 'Dòng kết quả cho biết đáp án nằm trọn trong một chunk hay bị cắt qua nhiều chunk.', 'Thử đổi <b>Kích thước</b>, kéo <b>Overlap</b> lên 10, hoặc chọn cách cắt <b>Theo câu</b>.', 'Để ý số chunk: càng nhiều chunk thì càng nhiều vector phải lưu.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<p>Embedding model có giới hạn context (256 đến 8192 token) nên tài liệu dài phải chia chunk. Chunk quá nhỏ thì mất ngữ cảnh, quá lớn thì loãng nội dung, cắt giữa ý thì mất mạch.</p>
<h4>Chọn đơn vị trước, kích thước sau</h4>
<div class="tbl"><table>
<tr><th>Loại dữ liệu</th><th>Đơn vị retrieve hợp lý</th><th>Gợi ý</th></tr>
<tr><td>FAQ, catalog, KB ngắn</td><td>Mỗi item hoàn chỉnh</td><td>Thường không cắt nhỏ hơn item. Giữ title, id, tags đi kèm</td></tr>
<tr><td>Docs kỹ thuật, wiki</td><td>Section / subsection</td><td>Giữ heading, giải thích và ví dụ cùng chunk</td></tr>
<tr><td>Source code</td><td>Function, class, module nhỏ</td><td>Không cắt giữa signature và implementation. Lưu path + tên symbol</td></tr>
<tr><td>Transcript, chat</td><td>Cửa sổ theo lượt nói</td><td>Giữ speaker, timestamp, một ít ngữ cảnh trước</td></tr>
<tr><td>PDF, báo cáo, hợp đồng</td><td>Page + heading + đoạn liên quan</td><td>Đừng tách bảng khỏi caption. OCR kém cần overlap cao hơn</td></tr>
</table></div>
<h4>So sánh chiến lược cắt</h4>
<div class="tbl"><table>
<tr><th>Chiến lược</th><th>Khi nào dùng</th><th>Ưu</th><th>Nhược</th></tr>
<tr><td><b>Fixed-size</b> (~512 token + 20-25% overlap)</td><td>Baseline, corpus nhiều định dạng</td><td>Đơn giản, kích thước đều</td><td>Cắt giữa câu, giữa ý</td></tr>
<tr><td><b>Sentence-boundary</b></td><td>Văn xuôi: bài viết, email</td><td>Tự nhiên, giữ mạch</td><td>Kích thước không đều</td></tr>
<tr><td><b>Semantic</b> (dò đổi chủ đề)</td><td>Cần nâng chất lượng retrieval</td><td>Recall thường tốt hơn fixed</td><td>Phức tạp, cần model thêm</td></tr>
<tr><td><b>Recursive / Hierarchical</b></td><td>Tài liệu có heading rõ</td><td>Giữ cấu trúc logic</td><td>Phụ thuộc định dạng</td></tr>
<tr><td><b>Contextualized chunk embeddings</b></td><td>Docs dài, chunk phụ thuộc ngữ cảnh nơi khác</td><td>Không cần tự viết chunker</td><td>Khoá vào một provider</td></tr>
</table></div>
<div class="verdict"><b>Khi không cần chunk:</b> tài liệu đã ngắn, mỗi record tự là một đơn vị tri thức (FAQ, product, ticket ngắn), hoặc bài toán cần similarity/classification cả tài liệu. Cắt thêm chỉ làm tăng số vector.<br><b>Chọn sai đơn vị ngay từ đầu</b> thì chỉnh 256 hay 512 token sau đó thường không cứu được nhiều.</div>`,
  why: {
    c: 'Chọn đơn vị theo cấu trúc tài liệu trước (một mục FAQ, một section, một hàm), rồi mới chọn kích thước. Overlap 20 đến 25% giống vùng đệm: nếu ranh giới rơi giữa một ý, ý đó vẫn nằm trọn trong ít nhất một chunk. Kích thước phải vừa giới hạn đầu vào của model embedding, vừa đủ nhỏ để vector của chunk nói về một chủ đề.',
    s: 'Embed cả tài liệu làm một vector: vector bị trung bình hoá giữa nhiều chủ đề nên mờ, và đưa cả tài liệu dài vào prompt thì tốn token. Chunk quá nhỏ (một câu): mất ngữ cảnh, câu "Cần hóa đơn gốc" đứng một mình không cho biết cần để làm gì.',
    p: 'Chunk càng nhỏ và overlap càng lớn thì số vector càng nhiều, tốn RAM, tiền embed và thời gian index. Cắt cố định theo số từ thì đơn giản nhưng có thể cắt giữa ý. Cắt theo cấu trúc hoặc ngữ nghĩa thông minh hơn nhưng phức tạp hơn.'
  },
  mount(stage) {
    const sents = [
      'Cửa hàng nhận đổi trả cho hầu hết sản phẩm điện tử.',
      'Sản phẩm phải còn nguyên tem niêm phong và đầy đủ phụ kiện đi kèm.',
      'Thời hạn hoàn tiền là 30 ngày kể từ ngày mua.',
      'Khách cần xuất trình hóa đơn gốc để được hoàn tiền.',
      'Với hàng khuyến mãi, thời hạn rút ngắn còn 7 ngày.',
      'Tiền hoàn sẽ về tài khoản thanh toán ban đầu trong 5 đến 7 ngày làm việc.',
      'Phí vận chuyển chiều về do khách hàng chịu nếu sản phẩm không lỗi.',
      'Sản phẩm lỗi do nhà sản xuất được đổi mới miễn phí trong 12 tháng.',
      'Mọi thắc mắc xin liên hệ tổng đài chăm sóc khách hàng.'
    ];
    const words = [], sentOf = [];
    sents.forEach((s, i) => s.split(' ').forEach((w) => { words.push(w); sentOf.push(i); }));
    const total = words.length;
    const aStart = sentOf.indexOf(2), aEnd = sentOf.lastIndexOf(3) + 1;
    const S = { mode: 'fixed', size: 30, overlap: 0 };
    const strip = el('div', { class: 'strip' }), list = el('div', { class: 'chunks' }), stat = el('div', { class: 'stat' });
    function build() {
      const out = [];
      if (S.mode === 'fixed') {
        const step = Math.max(1, S.size - S.overlap);
        for (let s = 0; s < total; s += step) { out.push([s, Math.min(total, s + S.size)]); if (s + S.size >= total) break; }
      } else {
        let s = 0;
        for (let i = 0; i < sents.length; i++) {
          const first = sentOf.indexOf(i), last = sentOf.lastIndexOf(i) + 1;
          if (last - s > S.size && first > s) { out.push([s, first]); s = first; }
        }
        out.push([s, total]);
      }
      return out;
    }
    function render() {
      const ch = build();
      strip.replaceChildren(el('div', { class: 'band', style: `left:${(aStart / total) * 100}%;width:${((aEnd - aStart) / total) * 100}%` }));
      ch.forEach(([s, e], i) => strip.append(el('div', { class: 'seg', style: `left:${(s / total) * 100}%;width:${((e - s) / total) * 100}%;top:${6 + (i % 2) * 26}px`, title: `chunk ${i + 1}` })));
      const whole = ch.findIndex(([s, e]) => s <= aStart && e >= aEnd);
      list.replaceChildren(...ch.map(([s, e], i) => el('div', { class: 'ch', style: i === whole ? 'border-color:var(--ok)' : '' }, [
        el('small', { text: `chunk ${i + 1} · ${e - s} từ${i === whole ? ' · chứa trọn câu trả lời' : ''}` }),
        el('span', { html: words.slice(s, e).map((w, k) => (s + k >= aStart && s + k < aEnd ? `<mark>${w}</mark>` : w)).join(' ') })
      ])));
      stat.innerHTML = `<span>Số chunk (= số vector): <b>${ch.length}</b></span><span>Câu trả lời: <b class="${whole >= 0 ? 'ok' : 'bad'}">${whole >= 0 ? 'nằm trọn trong 1 chunk' : 'bị cắt qua nhiều chunk'}</b></span>`;
    }
    const mode = select('Cách cắt', [['fixed', 'Fixed-size (theo từ)'], ['sentence', 'Theo câu']], S.mode, (v) => { S.mode = v; ov.input.disabled = v === 'sentence'; render(); });
    const sz = slider('Kích thước', 10, 80, 1, S.size, (v) => { S.size = v; render(); }, (v) => v + ' từ');
    const ov = slider('Overlap', 0, 30, 1, S.overlap, (v) => { S.overlap = v; render(); }, (v) => v + ' từ');
    stage.append(el('div', { class: 'row' }, [mode.node, sz.node, ov.node]),
      el('div', { class: 'hint', style: 'margin:0 0 6px', text: 'Dải trên: tài liệu 9 câu. Vùng sáng là hai câu chứa đáp án. Mỗi thanh màu là một chunk.' }), strip, stat,
      el('div', { style: 'height:8px' }), list,
      el('p', { class: 'hint', text: 'Đơn vị là từ, xấp xỉ token. Thanh chunk chồng lên nhau khi overlap > 0.' }));
    render();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage,
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
