const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson({
  id: 'chunking', nav: '6. Chunking', ref: '§1.4.3, §3.3',

  problem: {

  summary: `<h3>Tóm tắt bài</h3>
<p>Embedding model có giới hạn context (256 đến 8192 token) nên tài liệu dài phải chia chunk. Chunk quá nhỏ thì mất ngữ cảnh, quá lớn thì loãng nội dung, cắt giữa ý thì mất mạch.</p>

<tr><td><b>Recursive / Hierarchical</b></td><td>Tài liệu có heading rõ</td><td>Giữ cấu trúc logic</td><td>Phụ thuộc định dạng</td></tr>
<tr><td><b>Contextualized chunk embeddings</b></td><td>Docs dài, chunk phụ thuộc ngữ cảnh nơi khác</td><td>Không cần tự viết chunker</td><td>Khoá vào một provider</td></tr>
</table></div>
<div class="verdict"><b>Khi không cần chunk:</b> tài liệu đã ngắn, mỗi record tự là một đơn vị tri thức (FAQ, product, ticket ngắn), hoặc bài toán cần similarity/classification cả tài liệu. Cắt thêm chỉ làm tăng số vector.<br><b>Chọn sai đơn vị ngay từ đầu</b> thì chỉnh 256 hay 512 token sau đó thường không cứu được nhiều.</div>`,
  why: {
    c: 'Chọn đơn vị theo cấu trúc tài liệu trước (một mục FAQ, một section, một hàm), rồi mới chọn kích thước. Overlap 20 đến 25% giống vùng đệm: nếu ranh giới rơi giữa một ý, ý đó vẫn nằm trọn trong ít nhất một chunk. Kích thước phải vừa giới hạn đầu vào của model embedding, vừa đủ nhỏ để vector của chunk nói về một chủ đề.',
    s: 'Embed cả tài liệu làm một vector: vector bị trung bình hoá giữa nhiều chủ đề nên mờ, và đưa cả tài liệu dài vào prompt thì tốn token. Chunk quá nhỏ (một câu): mất ngữ cảnh, câu "Cần hóa đơn gốc" đứng một mình không cho biết cần để làm gì.',
    p: 'Chunk càng nhỏ và overlap càng lớn thì số vector càng nhiều, tốn RAM, tiền embed và thời gian index. Cắt cố định theo số từ thì đơn giản nhưng có thể cắt giữa ý. Cắt theo cấu trúc hoặc ngữ nghĩa thông minh hơn nhưng phức tạp hơn.'

  deep: [
    {
      q: 'Sao phải cắt? Embed nguyên cả trang chính sách thành một vector không được à?',

<p><b>Lý do cứng: model có giới hạn đầu vào.</b> README ghi các embedding model nhận từ 256 đến 8192 token. Đưa văn bản dài hơn thì phần đuôi bị cắt mất (thường là cắt lặng lẽ, không báo lỗi) hoặc API trả lỗi. Phần bị cắt coi như chưa từng được index: hỏi gì về nó cũng không tìm ra.</p>
<p><b>Lý do mềm: một vector chỉ là một điểm.</b> Model phải nén cả đoạn văn thành một hướng duy nhất. Nhiều model sentence-transformers làm việc này bằng <b>mean pooling</b>: lấy trung bình vector của tất cả token. Một trang nói về hoàn tiền, phí ship, bảo hành và tuyển dụng sẽ cho ra một vector "ở giữa" bốn chủ đề, không gần hẳn chủ đề nào. Câu hỏi về hoàn tiền so với vector đó sẽ được điểm thấp, có khi thua một đoạn ngắn nói về chủ đề khác nhưng "tập trung".</p>
<p>Thí nghiệm dưới đây tính thật trong trình duyệt. Mỗi chủ đề là một vector ngẫu nhiên 384 chiều. "Tài liệu" là trung bình của N chủ đề. Câu hỏi nhắm vào chủ đề số 1.</p>`,
      viz(box) {
        const d = 384, rnd = seeded(6), topics = Array.from({ length: 8 }, () => unitVec(d, rnd));
        const q = (() => { const v = topics[0].map((x) => x + 0.03 * randn(rnd)); const n = Math.hypot(...v); return v.map((x) => x / n); })();
        const docOf = (k) => { const m = Array(d).fill(0); for (let t = 0; t < k; t++) topics[t].forEach((x, i) => { m[i] += x; }); const n = Math.hypot(...m); return m.map((x) => x / n); };
        const cos = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => dotp(q, docOf(k)));

          stat.innerHTML = `<span>cos(câu hỏi, tài liệu ${k} chủ đề) = <b>${cos[k - 1].toFixed(3)}</b></span><span>1/√N = <b>${(1 / Math.sqrt(k)).toFixed(3)}</b></span>`;

        draw(4);
      },
      take: 'Một vector cho nhiều ý thì mỗi ý chỉ còn một phần tín hiệu. Cắt nhỏ để mỗi vector nói về một chuyện.'

    {
      q: 'Vậy cắt thật nhỏ cho chắc, mỗi câu một chunk?',
      a: `<p>Cắt quá nhỏ thì vector rất "tập trung" nhưng <b>mất ngữ cảnh</b>. Thử đọc riêng câu này: <i>"Khách cần mang theo hóa đơn gốc và đầy đủ phụ kiện."</i> Mang theo để làm gì? Để đổi trả, để bảo hành hay để nhận hàng? Câu đó dựa vào câu trước nó để có nghĩa.</p>
<p>Hậu quả có hai chiều:</p>
<ul><li><b>Tìm kiếm:</b> câu hỏi "đổi hàng lỗi cần gì?" không khớp tốt với một câu không hề nhắc tới "đổi hàng".</li>
<li><b>Trả lời:</b> dù tìm đúng, LLM chỉ nhận một mẩu. Nó thấy "30 ngày" mà không thấy "hóa đơn gốc", hoặc ngược lại.</li></ul>
<p>Cắt nhỏ còn làm tăng số vector. README đưa công thức gần đúng: <code>số chunk ≈ tổng token / (kích thước − overlap)</code>. Giảm kích thước một nửa thì số vector gần gấp đôi: RAM, tiền embed, thời gian index đều tăng theo.</p>
<p>Nên đây là bài toán cân bằng: chunk phải đủ lớn để tự đứng được (đọc riêng vẫn hiểu), và đủ nhỏ để chỉ nói về một ý. Giống viết hàm: không nhét cả module vào một hàm, nhưng cũng không tách mỗi dòng thành một hàm.</p>`,
      take: 'Chunk tốt là chunk đọc riêng vẫn hiểu và chỉ nói một ý. Quá to thì loãng, quá nhỏ thì cụt.'
    },
    {
      q: 'Thế cắt cứng theo số ký tự có sao không? Đơn giản mà.',
      a: `<p>Cắt cứng không biết câu ở đâu, nên ranh giới rơi vào chỗ nào thì rơi, kể cả giữa một từ. POC <code>pocs/06_chunking.py</code> đã đo trên đoạn chính sách đổi trả ShopViet, với câu hỏi <i>"Đổi hàng lỗi cần mang theo gì và trong bao lâu?"</i>:</p>
<div class="tbl"><table><tr><th>Cách cắt (số đo thật)</th><th>Số chunk</th><th>Chunk top-1 có đủ "30 ngày" + "hóa đơn gốc"?</th></tr>
<tr><td>Cứng 80 ký tự, không overlap</td><td>5</td><td class="bad">Không. Top-1 là mẩu «c hoặc đã bị tháo máy.»</td></tr>
<tr><td>Cứng 160 ký tự, overlap 20%</td><td>3</td><td class="ok">Có</td></tr>
<tr><td>Theo câu, 3 câu một chunk</td><td>2</td><td class="ok">Có</td></tr></table></div>
<p>Trường hợp 80 ký tự đáng xem kỹ, vì nó không hỏng theo kiểu bạn đoán. Kéo thanh trượt bên dưới về 80 ký tự, overlap 0: chunk 2 <b>có</b> chứa cả "30 ngày" lẫn "hóa đơn gốc". Nhưng nó bắt đầu bằng "30 ngày kể từ...", còn phần đầu câu "Hàng bị lỗi do nhà sản xuất được đổi mới trong" đã rơi sang chunk 1. Chính những chữ khớp với câu hỏi "đổi hàng lỗi" lại nằm ở chunk khác. Kết quả là model chọn mẩu cụt «c hoặc đã bị tháo máy.» POC không đo vì sao đúng mẩu đó thắng, nhưng bài học rõ: chunk chứa dữ kiện mà mất chủ ngữ thì vẫn khó được tìm thấy.</p>
<p>Đây mới là 1 câu hỏi trên 1 đoạn văn, nên chỉ để thấy cơ chế, không đủ để kết luận cấu hình nào tốt nhất.</p>`,
      viz(box) {
        const T = 'Chính sách đổi trả của ShopViet. Hàng bị lỗi do nhà sản xuất được đổi mới trong 30 ngày kể từ ngày nhận. Khách cần mang theo hóa đơn gốc và đầy đủ phụ kiện. Hàng khuyến mãi chỉ đổi trong 7 ngày. Phí vận chuyển khi đổi trả do ShopViet chịu nếu lỗi thuộc về nhà sản xuất. Trường hợp không áp dụng: sản phẩm rơi vỡ, vào nước hoặc đã bị tháo máy.';
        const need = ['30 ngày', 'hóa đơn gốc'], S = { size: 80, ov: 0 }, list = el('div', { class: 'chunks' }), stat = el('div', { class: 'stat' });
        const isWord = (c) => /[\p{L}\p{N}]/u.test(c || '');
        function draw() {
          const step = Math.max(1, S.size - S.ov), ch = [];
          for (let i = 0; i < T.length; i += step) { ch.push([i, Math.min(T.length, i + S.size)]); if (i + S.size >= T.length) break; }
          let broken = 0, full = 0;
          list.replaceChildren(...ch.map(([s, e], i) => {
            const txt = T.slice(s, e), ok = need.every((k) => txt.includes(k));
            const cut = isWord(T[e - 1]) && isWord(T[e]); if (cut) broken++; if (ok) full++;
            return el('div', { class: 'ch', style: ok ? 'border-color:var(--ok)' : '' }, [
              el('small', { text: `chunk ${i + 1} · ký tự ${s}–${e}${cut ? ' · cắt giữa từ' : ''}${ok ? ' · đủ cả hai ý' : ''}` }), el('span', { text: txt })]);
          }));
          stat.innerHTML = `<span>Số chunk: <b>${ch.length}</b></span><span>Chunk cắt giữa từ: <b>${broken}</b></span><span>Chunk đủ hai ý: <b class="${full ? 'ok' : 'bad'}">${full}</b></span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('Kích thước', 40, 240, 10, S.size, (v) => { S.size = v; draw(); }, (v) => v + ' ký tự').node,
          slider('Overlap', 0, 80, 4, S.ov, (v) => { S.ov = v; draw(); }, (v) => v + ' ký tự').node]), stat, list,
          el('div', { class: 'cap', text: 'Cắt thật trên đúng đoạn văn của POC 06, cùng thuật toán text[i:i+size] với bước size − overlap. Viền xanh là chunk chứa đủ "30 ngày" và "hóa đơn gốc". Viz không embed nên không biết chunk nào được retriever chọn, chỉ kiểm tra chunk nào có đủ dữ kiện.' }));
        draw();
      },
      take: 'Cắt cứng có thể tách dữ kiện khỏi ngữ cảnh của nó. Chunk có đủ số liệu mà mất chủ ngữ thì retriever vẫn bỏ qua.'
    },
    {
      q: 'Overlap cứu được chuyện đó à? Sao không để overlap 50% cho chắc?',
      a: `<p>Overlap nghĩa là chunk sau lặp lại phần cuối của chunk trước. Nhờ vậy ranh giới có "vùng đệm". Có một quy luật đơn giản: <b>nếu câu trả lời ngắn hơn overlap, nó chắc chắn nằm trọn trong ít nhất một chunk</b>, bất kể nằm ở đâu. Nếu dài hơn overlap thì chỉ là "có xác suất".</p>
<p>Lý do: các chunk bắt đầu cách nhau một bước <code>T = kích thước − overlap</code>. Một đoạn dài L nằm trọn trong chunk khi điểm bắt đầu của nó cách đầu chunk không quá <code>kích thước − L</code>. Với vị trí ngẫu nhiên, xác suất đó là <code>min(1, (kích thước − L + 1) / T)</code>.</p>
<p>Còn overlap 50%? Khi overlap đã lớn hơn độ dài câu trả lời, xác suất đã là 100%. Tăng thêm chỉ làm số chunk tăng, không được gì. README ghi overlap trên 30% thường làm chi phí tăng nhanh hơn lợi ích, và top kết quả hay bị lặp các đoạn gần giống nhau.</p>`,
      viz(box) {
        const S = { size: 512, pct: 0, L: 120 }, N = 5000, stat = el('div', { class: 'stat' }), bars = el('div');
        function draw() {
          const ov = Math.round((S.size * S.pct) / 100), T = S.size - ov, p = Math.min(1, (S.size - S.L + 1) / T), n = Math.ceil((N - ov) / T);
          bars.replaceChildren(hbars([['Xác suất câu trả lời nằm trọn', p * 100, true]], { max: 100, fmt: (v) => v.toFixed(0) + '%' }),

          stat.innerHTML = `<span>Overlap = <b>${ov}</b> token, bước T = <b>${T}</b></span><span class="${ov >= S.L - 1 ? 'ok' : ''}">${ov >= S.L - 1 ? 'Overlap ≥ độ dài câu trả lời: luôn nằm trọn' : 'Overlap &lt; độ dài câu trả lời: chỉ là xác suất'}</span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('Kích thước', 128, 1024, 32, S.size, (v) => { S.size = v; draw(); }, (v) => v + ' token').node,

        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
