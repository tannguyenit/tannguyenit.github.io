const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  terms: [['Bi-encoder', 'Model đọc từng đoạn văn riêng lẻ và trả về một vector cho mỗi đoạn. So hai đoạn bằng cách so hai vector. Ví như tính sẵn mã băm của từng đoạn.'], ['Cross-encoder', 'Model đọc cả cặp (câu hỏi, đoạn) cùng lúc và trả về một điểm liên quan. Chính xác hơn vì thấy được cả hai, nhưng không tính sẵn được.'], ['Forward pass', 'Một lần chạy model trên một đầu vào, tốn thời gian GPU. Có thể coi là một request đắt tiền tới model.'], ['Offline / online', 'Offline: việc làm một lần khi nạp dữ liệu (tính vector cho cả kho). Online: việc làm mỗi lần khách hỏi. Càng đẩy được việc sang offline, độ trễ lúc hỏi càng thấp.'], ['Precompute', 'Tính sẵn và lưu lại, giống cache hay materialized view. Bi-encoder tính sẵn được vì vector của một đoạn không phụ thuộc câu hỏi.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Mỗi khách hỏi, hệ thống phải tìm trong 1 triệu đoạn. Có model chấm cặp (câu hỏi, đoạn) rất chuẩn, mất khoảng 5 ms mỗi cặp. Nếu chạy cho cả 1 triệu đoạn, mỗi khách phải chờ hơn 80 phút (giả định 5 ms để minh hoạ).',
    scenario: 'Kho có 1 triệu tài liệu. Mỗi query cần chọn ra tài liệu liên quan. Model cross-encoder chính xác nhất vì đọc cả cặp (query, tài liệu), nhưng mỗi cặp là một lần chạy model.',
    ask: 'Nếu chạy model chính xác nhất cho từng tài liệu thì một query mất bao lâu?',
    solves: 'Bi-encoder encode tài liệu một lần lúc index và lưu vector. Lúc query chỉ encode query một lần rồi so vector. Cross-encoder để dành cho bước chấm lại một tập nhỏ.',
    read: ['Hai khối ô vuông: mỗi ô là một tài liệu. Chỉ có 60 ô để đại diện cho cả kho.', 'Kéo thanh <b>Số tài liệu</b> từ 1k đến 10M, xem số lần gọi model lớn bên dưới.', 'Bấm <b>Chạy 1 query</b>: bi-encoder quét xong gần như ngay, cross-encoder chạy từng ô một.', 'Ô xanh nhạt viền xanh là vector đã tính sẵn từ lúc index.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<div class="tbl"><table>
<tr><th></th><th>Bi-encoder</th><th>Cross-encoder</th></tr>
<tr><td><b>Input</b></td><td>Query và document encode riêng</td><td>Nhận cặp (query, doc) cùng lúc</td></tr>
<tr><td><b>Output</b></td><td>2 vector → similarity score</td><td>1 relevance score trực tiếp</td></tr>
<tr><td><b>Tốc độ</b></td><td>Nhanh, document vector tính sẵn</td><td>Chậm, phải chấm từng cặp</td></tr>
<tr><td><b>Scale</b></td><td>Retrieval trên hàng triệu document</td><td>Chỉ re-score một tập nhỏ ứng viên</td></tr>
<tr><td><b>Điểm mạnh</b></td><td>Scalable, hợp search/retrieval</td><td>Chính xác hơn nhờ token tương tác với nhau</td></tr>
<tr><td><b>Điểm yếu</b></td><td>Mất chi tiết ở mức token</td><td>Không quét được toàn corpus</td></tr>
</table></div>
<div class="verdict"><b>Kết luận của tài liệu:</b> semantic search hiện đại gần như luôn dùng <b>bi-encoder cho retrieval</b> và <b>cross-encoder cho reranking</b>. Cột mốc là Sentence-BERT (2019): encode câu độc lập, nhanh hơn cross-encoder BERT cỡ 1000 lần.</div>
<h4>Query và document không cùng vai trò (asymmetric search)</h4>
<div class="tbl"><table>
<tr><th></th><th>Query</th><th>Document</th></tr>
<tr><td>Độ dài</td><td>Ngắn</td><td>Dài hơn</td></tr>
<tr><td>Vai trò</td><td>Mô tả nhu cầu, thường dạng hỏi</td><td>Cung cấp thông tin</td></tr>
</table></div>
<p>Một câu hỏi thường giống một câu hỏi khác hơn là giống đoạn văn trả lời nó. Vì vậy nhiều model có chế độ riêng <code>search_query</code> và <code>search_document</code>. Hai bên vẫn nằm trong cùng không gian để so được với nhau.</p>
<div class="verdict"><b>Mẹo thực tế:</b> kiểm tra docs của model xem có cần đặt tham số vai trò khi embed query và document không. Embed cả hai bằng cùng một chế độ là lỗi dễ mắc.</div>`,
  why: {
    c: 'Chia hai việc theo thời điểm. Lúc nạp dữ liệu (offline), bi-encoder tính vector cho 1 triệu đoạn một lần và lưu lại, giống tính sẵn rồi cache. Lúc có câu hỏi (online), chỉ chạy model 1 lần cho câu hỏi rồi so vector bằng phép tính rẻ. Cross-encoder đọc cả cặp nên hiểu sâu hơn, nhưng kết quả phụ thuộc cả câu hỏi lẫn đoạn nên không tính sẵn được. Vì vậy chỉ dùng nó để chấm lại vài chục ứng viên.',
    s: 'Cross-encoder cho cả kho: 1 triệu lần gọi model mỗi câu hỏi, giống chạy một query đắt tiền trên từng dòng thay vì dùng index. Chỉ dùng bi-encoder: nhanh nhưng bỏ lỡ chi tiết ở mức từ, ví dụ phủ định như "không được hoàn tiền".',
    p: 'Bi-encoder nén cả đoạn thành một vector nên mất chi tiết, đó là lý do cần cross-encoder chấm lại. Ghép hai bước thì thêm một lần gọi model nữa (độ trễ, chi phí), đổi lại độ chính xác cao hơn.'

  deep: [
    {
      q: 'Bi-encoder biến một đoạn văn thành một vector bằng cách nào? Sao lại "tính sẵn" được?',
      a: `<p>Đoạn văn được cắt thành token (mẩu từ). Model transformer cho mỗi token một vector, và trong lúc tính, các token <b>của cùng đoạn đó</b> nhìn nhau qua cơ chế attention (mỗi token tự quyết định nên "để ý" token nào khác). Cuối cùng một bước pooling, thường là lấy trung bình, gộp mọi vector token thành <b>một vector duy nhất</b> cho cả đoạn.</p>
<p>Điểm mấu chốt: trong suốt quá trình đó, model <b>không hề thấy câu hỏi</b>. Vector của đoạn "Gói Pro được hoàn tiền trong 14 ngày" là như nhau dù sau này ai hỏi gì. Một hàm chỉ phụ thuộc vào đầu vào của nó thì kết quả cache được. Đó là lý do bi-encoder tính vector cho 1 triệu đoạn một lần lúc nạp dữ liệu, lưu vào Qdrant, và lúc có câu hỏi chỉ chạy model đúng một lần cho câu hỏi.</p>
<p>Giống trong backend: bạn tính sẵn cột <code>search_vector</code> cho mỗi dòng lúc INSERT, thay vì tính lại cho cả bảng mỗi lần SELECT.</p>
<p>Chi tiết nhỏ: "bi" nghĩa là hai phía, câu hỏi và tài liệu, đi qua encoder riêng rẽ. Nhiều model còn cho đánh dấu vai trò, như Cohere với <code>input_type="search_query"</code> và <code>"search_document"</code>. Vai trò khác nhau nhưng vẫn không phía nào nhìn thấy phía kia.</p>`,
      take: 'Vector tài liệu không phụ thuộc câu hỏi, nên tính một lần và dùng mãi. Đây là toàn bộ lý do bi-encoder nhanh.'
    },
    {
      q: 'Nhưng mã hoá đoạn văn khi chưa biết câu hỏi thì mất gì?',
      a: `<p>Model phải nén mọi thứ của đoạn vào một vector cố định mà không biết sau này người ta quan tâm chi tiết nào. Đoạn "Hàng khuyến mãi chỉ được đổi trả trong 7 ngày và không hoàn lại phần giảm giá" chứa ít nhất ba ý: khuyến mãi, 7 ngày, không hoàn phần giảm giá. Vector chỉ có một hướng, nên nó là "trung bình" của các ý đó. Câu hỏi chỉ quan tâm một ý sẽ thấy đoạn này "hơi giống".</p>
<p>Những chi tiết nhỏ nhưng đổi hẳn nghĩa, như phủ định "không", con số "7 hay 30 ngày", ai là chủ thể, dễ bị chìm trong trung bình. README gọi đây là "mất chi tiết ở mức token".</p>
<p>Hình bên dưới dùng một <b>encoder đồ chơi</b>: mỗi từ được gán một vector ngẫu nhiên cố định, vector của câu là trung bình các vector từ. Kết quả với câu mặc định: đoạn B, nói điều <b>ngược lại</b>, còn được điểm cao hơn đoạn A. Lý do: trong câu hỏi tiếng Việt, "không" ở cuối là trợ từ hỏi, còn trong đoạn B nó là phủ định. Encoder đồ chơi coi hai chữ đó là một và thưởng cho đoạn B vì "chung từ". Thử sửa các ô để xem điểm thay đổi ra sao.</p>`,
      viz(box) {
        const tok = (s) => s.normalize('NFC').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
        const hash = (w) => { let h = 2166136261; for (const ch of w) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; };
        const enc = (s) => { const ws = tok(s), v = new Array(64).fill(0); ws.forEach((w) => unitVec(64, seeded(hash(w))).forEach((x, k) => (v[k] += x))); const n = Math.sqrt(dotp(v, v)) || 1; return v.map((x) => x / n); };
        const field = (label, val) => { const i = el('input', { type: 'text', value: val, style: 'width:100%;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)' }); i.addEventListener('input', draw); return [el('div', { class: 'hint', style: 'margin:6px 0 2px', text: label }), i]; };
        const [lq, iq] = field('Câu hỏi', 'Gói Pro có được hoàn tiền không?'), [la, ia] = field('Đoạn A', 'Gói Pro được hoàn tiền trong 14 ngày.'), [lb, ib] = field('Đoạn B', 'Gói Pro không được hoàn tiền sau 14 ngày.');
        const stat = el('div', { class: 'stat' });
        function draw() {
          const q = enc(iq.value), a = dotp(q, enc(ia.value)), b = dotp(q, enc(ib.value));
          stat.innerHTML = `<span>cos(câu hỏi, A) = <b>${a.toFixed(3)}</b></span><span>cos(câu hỏi, B) = <b>${b.toFixed(3)}</b></span><span>chênh: <b>${Math.abs(a - b).toFixed(3)}</b></span>`;
        }
        box.append(lq, iq, la, ia, lb, ib, stat, el('div', { class: 'cap', text: 'Encoder đồ chơi để minh hoạ khái niệm: trung bình vector ngẫu nhiên của từng từ, 64 chiều, không phải model thật. Model thật hiểu ngữ cảnh tốt hơn nhiều, nhưng vẫn phải nén cả đoạn vào một vector trước khi thấy câu hỏi.' }));
        draw();
      },
      take: 'Bi-encoder phải đoán trước điều gì quan trọng trong đoạn văn. Chi tiết nhỏ mà đổi nghĩa là thứ dễ mất nhất.'
    },
    {
      q: 'Cross-encoder "đọc cả cặp cùng lúc" thì khác gì về cơ chế? Sao vậy lại chính xác hơn?',
      a: `<p>Cross-encoder ghép câu hỏi và đoạn văn thành <b>một chuỗi đầu vào</b>, dạng <span class="mono">[câu hỏi] [SEP] [đoạn văn]</span>, rồi cho qua transformer. Ở mỗi lớp, mỗi token có thể attention tới <b>mọi token của cả hai phía</b>. Chữ "rè" trong câu hỏi nhìn thẳng được vào "Bluetooth yếu" trong đoạn văn. Chữ "đổi trả" nhìn được vào "30 ngày", "hóa đơn gốc". Cuối cùng model trả ra một con số: cặp này liên quan đến đâu.</p>
<p>Đếm thử: câu hỏi 10 token, đoạn văn 30 token. Bi-encoder có <b>0</b> cặp (token câu hỏi, token đoạn văn) được nhìn nhau trước khi chấm điểm, chỉ có một phép so hai vector ở cuối. Cross-encoder có 10 × 30 = <b>300</b> cặp như vậy ở mỗi lớp, mỗi attention head, theo cả hai chiều. Model có chỗ để kiểm tra "chữ không này phủ định cái gì", "con số này có khớp với câu hỏi không".</p>
<p>So sánh đời thường: bi-encoder giống tuyển dụng bằng cách so CV với mô tả công việc, mỗi bên tóm tắt riêng thành vài từ khoá. Cross-encoder giống phỏng vấn: đặt ứng viên trước đúng câu hỏi đó rồi mới đánh giá.</p>`,
      take: 'Cross-encoder cho từng token câu hỏi đối chiếu trực tiếp với từng token tài liệu. Bi-encoder chỉ so hai bản tóm tắt.'
    },
    {
      q: 'Nghe thì cross-encoder hơn hẳn. POC có cho thấy điều đó không?',
      a: `<p>POC 03 chạy câu "Tai nghe của tôi bị rè, đổi trả được không?" trên 24 đoạn ShopViet. Đáp án đúng là <code>doitra-1</code> (chính sách đổi trả 30 ngày). Bi-encoder là <code>paraphrase-multilingual-MiniLM-L12-v2</code>, cross-encoder là <code>cross-encoder/mmarco-mMiniLMv2-L12-H384-v1</code>, cả hai chạy trên CPU.</p>
<p>Kết quả đo được: cross-encoder kéo đoạn đúng từ <b>hạng 15 lên hạng 8</b>. Có tiến bộ, nhưng vẫn chưa vào top 3. Cả hai model đều bị đoạn "Tai nghe bị rè ... Bluetooth yếu" hút về hạng 1, vì câu hỏi nói về triệu chứng nhiều hơn về ý định đổi trả.</p>
<p>Đọc kết quả này cho đúng: chỉ có <b>một câu hỏi, 24 đoạn</b>, và hai model nhỏ. Nó cho thấy cơ chế (đọc cặp giúp đẩy đoạn đúng lên), không chứng minh cross-encoder luôn đưa đáp án lên đầu. Reranker lớn hơn như Cohere rerank-v3.5 trong RAG POC có thể làm tốt hơn, nhưng phải đo mới biết.</p>`,
      viz(box) {
        const strip = (name, rank, cls) => el('div', { style: 'margin-bottom:10px' }, [el('div', { class: 'hint', style: 'margin:0 0 4px', html: `${name}: đoạn đúng ở <b class="${cls}">hạng ${rank}</b> / 24` }),
          el('div', { style: 'display:grid;grid-template-columns:repeat(24,1fr);gap:2px' }, Array.from({ length: 24 }, (_, i) => el('span', { title: 'hạng ' + (i + 1), style: `height:22px;border-radius:3px;background:${i + 1 === rank ? 'var(--accent)' : i < 3 ? 'color-mix(in srgb, var(--ok) 30%, var(--bg))' : 'var(--line)'}` })))]);
        const top = (rows) => '<table><tr><th>Điểm</th><th>Top 3</th></tr>' + rows.map(([s, t]) => `<tr><td class="mono">${s}</td><td>${t}</td></tr>`).join('') + '</table>';
        box.append(strip('Bi-encoder (cosine)', 15, 'bad'), strip('Cross-encoder', 8, 'bad'),
          el('div', { class: 'cols' }, [
            el('div', { html: '<h4>Bi-encoder</h4>' + top([['0.636', 'Tai nghe bị rè ... Bluetooth yếu'], ['0.504', 'Tai nghe Pro X: driver 40mm ...'], ['0.438', 'Tai nghe được bảo hành 12 tháng ...']]) }),
            el('div', { html: '<h4>Cross-encoder</h4>' + top([['1.237', 'Tai nghe bị rè ... Bluetooth yếu'], ['-2.260', 'Tai nghe được bảo hành 12 tháng ...'], ['-4.765', 'Sạc nhanh 65W ...']]) })]),
          el('div', { class: 'cap', text: 'Số đo thật từ pocs/03_encoders.py. Một câu hỏi, 24 đoạn: đủ để thấy cơ chế, không đủ để kết luận về chất lượng model. Ô xanh nhạt là top 3.' }));
      },
      take: 'Đọc cặp giúp đẩy đoạn đúng lên, nhưng không phải phép màu. Chất lượng reranker cũng phải đo trên câu hỏi thật.'
    },
    {
      q: 'Chính xác hơn thì sao không chạy cross-encoder cho cả kho luôn, bỏ bi-encoder đi?',
      a: `<p>Vì kết quả của cross-encoder phụ thuộc <b>cả câu hỏi lẫn đoạn văn</b>. Không có gì để tính sẵn. Mỗi câu hỏi mới là N lần chạy model đầy đủ, với N là số đoạn trong kho. Giống một câu SQL buộc phải chạy một hàm đắt tiền trên từng dòng, không index nào giúp được.</p>
<p>POC 03 đo trên CPU: <b>4.4 ms mỗi cặp</b>. Với 1 triệu đoạn là khoảng <b>73 phút cho một câu hỏi</b>. GPU và batch lớn sẽ nhanh hơn nhiều lần, nhưng vẫn là hàng triệu lần chạy transformer cho mỗi câu hỏi, tức là không khả thi về chi phí.</p>
<p>Phía bi-encoder, POC in ra 17.62 ms. Lưu ý con số này gồm cả việc <b>chạy model một lần để mã hoá câu hỏi</b>. Phần so 24 vector thì gần như không tốn gì. Bấm nút dưới để đo riêng phần so vector trên máy bạn.</p>`,
      viz(box) {
        const out = el('div', { class: 'stat' }, [el('span', { text: 'Chưa đo.' })]);
        function run() {
          const N = 10000, d = 384, rnd = seeded(9), M = new Float32Array(N * d), q = new Float32Array(d);
          for (let i = 0; i < M.length; i++) M[i] = rnd() - 0.5;
          for (let k = 0; k < d; k++) q[k] = rnd() - 0.5;
          let sink = 0, best = 1e9;
          for (let r = 0; r < 3; r++) { const t = performance.now(); for (let i = 0; i < N; i++) { let s = 0; const o = i * d; for (let k = 0; k < d; k++) s += M[o + k] * q[k]; sink += s; } best = Math.min(best, performance.now() - t); }
          const bi1M = best * 100, cr1M = 4.4 * 1e6;
          out.title = 'checksum ' + sink.toFixed(3);
          out.innerHTML = `<span>So 10.000 vector: <b>${best.toFixed(1)} ms</b></span><span>Suy ra 1 triệu vector: <b>${(bi1M / 1000).toFixed(2)} giây</b></span><span>Cross-encoder 1 triệu cặp: <b>${(cr1M / 60000).toFixed(0)} phút</b></span><span>Chênh: <b>×${fmtNum(Math.round(cr1M / bi1M))}</b></span>`;
        }
        box.append(el('div', { class: 'row' }, [el('button', { class: 'primary', text: 'Đo phần so vector trên máy tôi', onclick: run })]), out,

      take: 'Bước đầu lấy đủ rộng để không bỏ sót, bước sau mới chấm kỹ. N quá nhỏ thì reranker vô dụng, N quá lớn thì chậm và tốn tiền.'

    {

      a: `<p>Không phải xác suất. Xác suất không thể âm. Cross-encoder trong POC trả về điểm thô, số càng lớn càng liên quan, không có đơn vị.</p>
<p>Điều <b>chắc chắn an toàn</b> với điểm rerank: trong cùng một câu hỏi, cùng một model, đoạn điểm cao hơn được model coi là liên quan hơn. Chỉ vậy thôi.</p>
<p>Những điều <b>không an toàn</b> nếu nhà cung cấp không nói rõ:</p>
<ul><li>Đọc điểm như "75% khả năng đúng". Có thể đưa điểm qua hàm sigmoid để được số từ 0 đến 1, nhưng đó chỉ là đổi thang, không phải xác suất đã kiểm chứng.</li>
<li>So điểm giữa hai câu hỏi khác nhau. Câu hỏi dễ có thể cho mọi đoạn điểm cao, câu hỏi khó cho mọi đoạn điểm thấp.</li>
<li>So điểm giữa hai model, hay giữa hai phiên bản của cùng một model.</li></ul>
<p>Một số reranker được <b>calibrate</b> (hiệu chỉnh để điểm có ý nghĩa ổn định giữa các câu hỏi). README ghi Cohere Rerank 5 có "calibrated relevance scores" và Voyage rerank-3 giữ thang điểm tương thích để dùng lại ngưỡng cũ. Với model khác, kể cả rerank-v3.5 trong RAG POC, README không nói, nên đừng giả định. Cần ngưỡng thì đo trên bộ câu hỏi có đáp án của bạn.</p>
<p>Hình dưới lấy 3 điểm thô đo thật từ POC, cộng thêm một hằng số rồi đưa qua sigmoid. Thứ hạng không bao giờ đổi, nhưng "xác suất" thì muốn bao nhiêu cũng được.</p>`,
      viz(box) {
        const raw = [['Tai nghe bị rè ... Bluetooth', 1.237], ['Bảo hành tai nghe 12 tháng', -2.26], ['Sạc nhanh 65W', -4.765]], out = el('div');
        const sig = (x) => 1 / (1 + Math.exp(-x));
        function draw(b) {

            el('div', { class: 'stat', html: `<span>Số đoạn "qua ngưỡng 0.5": <b>${raw.filter(([, s]) => sig(s + b) >= 0.5).length}</b> / 3</span><span>Thứ hạng: <b>không đổi</b></span>` }));

          el('div', { class: 'cap', text: 'Điểm thô 1.237, -2.260, -4.765 đo thật từ pocs/03_encoders.py. Phép dịch và sigmoid là biến đổi để minh hoạ: cùng một thứ hạng có thể khoác lên rất nhiều bộ "xác suất" khác nhau.' }));

      take: 'Điểm rerank chắc chắn dùng được để xếp hạng trong một câu hỏi. Dùng làm ngưỡng tuyệt đối thì chỉ khi model đã calibrate hoặc bạn tự đo.'

    {
      q: 'Có cách nào nằm giữa không, vừa tính sẵn được vừa so được chi tiết từng từ?',
      a: `<p>Có, README nhắc tới <b>ColBERT</b> (late interaction, tương tác muộn). Ý tưởng: vẫn mã hoá câu hỏi và tài liệu riêng như bi-encoder, nên tài liệu vẫn tính sẵn được. Nhưng thay vì gộp thành một vector, giữ lại <b>một vector cho mỗi token</b>.</p>
<p>Lúc chấm điểm dùng MaxSim: mỗi token của câu hỏi tìm token giống nó nhất trong tài liệu, rồi cộng các điểm đó lại. Chữ "đổi trả" trong câu hỏi tự tìm được chữ "đổi trả" trong đoạn văn, không bị chìm trong trung bình của cả đoạn.</p>
<p>Cái giá: một đoạn 100 token cần lưu 100 vector thay vì 1, nên bộ nhớ lớn hơn nhiều. Và tương tác vẫn yếu hơn cross-encoder, vì hai phía không attention vào nhau qua các lớp mà chỉ gặp nhau ở bước MaxSim cuối cùng.</p>
<div class="tbl"><table><tr><th></th><th>Tính sẵn tài liệu</th><th>Hai phía gặp nhau ở đâu</th><th>Lưu mỗi đoạn</th></tr>
<tr><td>Bi-encoder</td><td class="ok">Có</td><td>Một phép so hai vector</td><td>1 vector</td></tr>

<tr><td>Cross-encoder</td><td class="bad">Không</td><td>Mọi lớp attention</td><td>Không lưu gì, chấm lúc hỏi</td></tr></table></div>`,
      take: 'Càng để hai phía gặp nhau sớm thì càng chính xác và càng khó tính sẵn. Ba kiến trúc là ba điểm trên cùng một trục đánh đổi.'

    {
      q: 'Trong RAG POC, Cohere rerank-v3.5 nằm ở đâu và được dùng thế nào?',
      a: `<p>Luồng trong <code>rag-poc/pipeline.py</code>:</p>
<ol><li><b>Nạp</b>: Unstructured cắt tài liệu bằng <code>chunk_by_title</code>, Cohere <code>embed-v4.0</code> mã hoá từng chunk với <code>input_type="search_document"</code> thành vector 1536 chiều, lưu vào Qdrant (Distance.COSINE). Đây là phần bi-encoder, làm một lần.</li>
<li><b>Hỏi</b>: mã hoá câu hỏi với <code>input_type="search_query"</code>, Qdrant trả top N chunk (<code>limit=n</code>).</li>
<li><b>Rerank</b>: gửi câu hỏi và văn bản của N chunk đó cho <code>co.rerank(model="rerank-v3.5", top_n=k)</code>. API trả về chỉ số của từng chunk và <code>relevance_score</code>. Pipeline lưu thêm <code>rank_before</code>, tức hạng trước khi rerank, để bạn thấy reranker đã đảo thứ tự ra sao.</li></ol>
<p>Cohere không mô tả chi tiết kiến trúc của rerank-v3.5 trong tài liệu ta dùng. Nhưng về cách dùng nó đúng vai cross-encoder: nhận cặp (câu hỏi, đoạn văn) và trả một điểm cho mỗi cặp. Khác POC 03 ở chỗ việc chấm chạy trên máy chủ của Cohere, cả N chunk đi trong <b>một lần gọi API</b>, nên bạn trả theo lần gọi và chịu độ trễ mạng, không phải 4.4 ms × N trên CPU của mình.</p>
<p>Những gì nên thử trong RAG POC, theo README của nó: hỏi "Tai nghe bị rè, đổi trả được không?" và so <code>rank_before</code> với thứ hạng sau rerank. Rồi giảm N xuống 2 để thấy đoạn đúng bị loại trước khi reranker kịp nhìn thấy. Còn <code>relevance_score</code> thì dùng để xếp hạng. Đừng đặt ngưỡng cứng khi chưa đo, như câu hỏi trước đã giải thích.</p>`,
      take: 'RAG POC: embed-v4.0 + Qdrant lấy rộng (recall), rerank-v3.5 chấm kỹ top N (precision). Hạng trước và sau rerank là chỗ để quan sát.'
    }
  ],
  mount(stage) {
    const PER_PASS_MS = 5;
    let exp = 6, timers = [];
    const cells = (cls) => Array.from({ length: 60 }, () => el('span', { class: cls || '' }));
    const biCells = cells('pre'), crCells = cells('');
    const biGrid = el('div', { class: 'grid60' }, biCells), crGrid = el('div', { class: 'grid60 slow' }, crCells);
    const biStat = el('div', { class: 'stat' }), crStat = el('div', { class: 'stat' });
    const fmtTime = (ms) => (ms < 1000 ? ms.toFixed(0) + ' ms' : ms < 3.6e6 ? (ms / 60000 < 1 ? (ms / 1000).toFixed(0) + ' giây' : (ms / 60000).toFixed(0) + ' phút') : (ms / 3.6e6).toFixed(1) + ' giờ');
    function stats() {
      const n = 10 ** exp;
      biStat.innerHTML = `<span>Gọi model lớn: <b>1</b> lần</span><span>Còn lại: so vector tính sẵn</span>`;
      crStat.innerHTML = `<span>Gọi model lớn: <b>${fmtNum(n)}</b> lần</span><span>Ước tính: <b>${fmtTime(n * PER_PASS_MS)}</b> / query</span>`;
    }
    function run() {
      timers.forEach(clearInterval); timers = [];
      [...biCells, ...crCells].forEach((c) => c.classList.remove('lit'));
      biCells.forEach((c) => c.classList.add('pre'));
      let i = 0, j = 0;
      timers.push(setInterval(() => { if (i < 60) biCells[i++].classList.add('lit'); else clearInterval(timers[0]); }, 12));
      timers.push(setInterval(() => { if (j < 60) crCells[j++].classList.add('lit'); else clearInterval(timers[1]); }, 70));
    }
    const sl = slider('Số tài liệu', 3, 7, 1, exp, (v) => { exp = v; stats(); }, (v) => fmtNum(10 ** v));
    stage.append(
      el('div', { class: 'row' }, [sl.node, el('button', { class: 'primary', text: 'Chạy 1 query', onclick: run })]),
      el('div', { class: 'cols' }, [
        el('div', {}, [el('h4', { html: 'Bi-encoder <small>· mỗi ô là 1 vector tài liệu, tính sẵn lúc index</small>' }), biGrid, biStat]),
        el('div', {}, [el('h4', { html: 'Cross-encoder <small>· mỗi ô là 1 lần chạy model cho cặp (query, doc)</small>' }), crGrid, crStat])

      el('p', { class: 'hint', text: `60 ô là đại diện. Thời gian là ước tính minh hoạ với giả định ${PER_PASS_MS} ms mỗi cặp, để thấy bậc độ lớn. Ô xanh nhạt là vector đã tính sẵn.` })

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
