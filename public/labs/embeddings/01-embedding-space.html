const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson({
  id: 'embedding', nav: '1. Embedding là gì', ref: '§1.1',
  title: 'Biến từ thành tọa độ để máy đo được "gần nghĩa"',
  hook: 'Gán mỗi từ một mã số thì máy chỉ biết "khác nhau". Đặt từ vào không gian, nghĩa gần nhau thì nằm gần nhau.',
  terms: [['Vector', 'Một mảng số thực, ví dụ [0.12, -0.53, 0.88, ...]. Với embedding, mảng có từ vài trăm đến vài nghìn phần tử. Bạn có thể coi nó là toạ độ của một điểm trong không gian nhiều chiều.'], ['Chiều (dimension)', 'Số phần tử của mảng. Vector 1536 chiều là mảng 1536 số. Hình dưới dùng 2 chiều để vẽ được, thật ra là hàng trăm đến hàng nghìn.'], ['One-hot', 'Cách biến từ thành số trước khi có embedding. Giả sử từ điển chỉ có 4 từ: mèo, chó, ô tô, xe máy. Mỗi từ thành một dãy 4 ô, toàn số 0, riêng ô đúng vị trí của từ đó là 1. mèo = [1, 0, 0, 0], chó = [0, 1, 0, 0], ô tô = [0, 0, 1, 0]. Hai từ khác nhau không bao giờ có số 1 ở cùng một ô, nên máy thấy "mèo" khác "chó" y hệt như "mèo" khác "ô tô". Giống số căn cước: biết đây là ai, nhưng không biết ai giống ai. Từ điển thật có khoảng 100.000 từ thì mỗi dãy dài 100.000 ô.'], ['Gần nghĩa', 'Hai từ hay xuất hiện trong ngữ cảnh giống nhau thì được đặt gần nhau. "Cat" và "dog" cùng xuất hiện quanh chữ "pet", "feed", nên gần nhau.'], ['Model embedding', 'Một neural network đã huấn luyện sẵn, nhận văn bản và trả về vector. Bạn gọi nó như một API, không tự huấn luyện.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Khách gõ <i>"tai nghe không dây bị rè"</i>. Bài hướng dẫn đúng lại có tiêu đề <i>"Khắc phục lỗi âm thanh headphone bluetooth"</i>. Hai câu không có từ nào trùng, nên tìm theo từ khoá sẽ không ra. Hình bên dưới dùng cat và kitten làm bản thu nhỏ của đúng vấn đề này.',
    scenario: 'Người dùng gõ "kitten" nhưng tài liệu của bạn viết "cat". Với máy, hai chuỗi ký tự này khác nhau hoàn toàn. Nếu mỗi từ chỉ là một mã số, máy không có cách nào biết từ nào gần nghĩa từ nào.',
    ask: 'Làm sao biểu diễn từ để máy đo được "gần nghĩa" bằng một phép tính đơn giản?',
    solves: 'Embedding đặt mỗi từ thành một toạ độ. Từ cùng ngữ cảnh nằm gần nhau, nên "độ khác nghĩa" trở thành khoảng cách giữa hai điểm.',
    read: ['Mỗi chấm là một từ. Màu là nhóm nghĩa.', 'Bấm <b>Mã số (one-hot)</b>: mọi từ cách nhau như nhau, "cat" xa "kitten" bằng "cat" xa "car".', 'Bấm <b>Embedding</b>: các chấm tự gom thành nhóm. Bấm một từ để xem 3 từ gần nhất.', 'Bấm <b>Chạy king − man + woman</b> để thấy quan hệ ý nghĩa thành phép cộng trừ vector.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<h4>Tại sao Embedding quan trọng? (giữ nguyên từ tài liệu)</h4>
<blockquote>
<p><b>Biểu diễn ngữ nghĩa</b>: One-hot encoding (vector thưa, mỗi từ có 1 vị trí bằng 1) phân biệt danh tính từ nhưng không biểu diễn quan hệ ý nghĩa. Embedding có thể đặt “cat” và “kitten” gần nhau.</p>
<p><b>Giảm chiều</b>: Vocabulary 100,000 từ → one-hot cần 100,000 dims. Embedding chỉ cần 384-3072 dims mà chứa nhiều thông tin hơn.</p>
<p><b>Tính toán similarity</b>: Cho phép đo "khoảng cách ý nghĩa" giữa 2 khái niệm bất kỳ bằng phép toán vector đơn giản.</p>
<p><b>Transfer learning</b>: Embedding được train trên dataset lớn có thể transfer sang task khác — không cần train lại từ đầu.</p>
<p><b>Multimodal bridge</b>: Embedding cho phép đặt text, image, audio vào cùng không gian → so sánh cross-modal (tìm ảnh bằng mô tả text).</p>
<p>Chất lượng của biểu diễn này phụ thuộc vào cách model học ngữ cảnh, xử lý từ hiếm và tạo vector. Đó cũng là những điểm các thế hệ model sau tìm cách cải thiện.</p>
</blockquote>
<h4>Lịch sử rút gọn (§1.2): chỉ cần nhớ 4 mốc</h4>
<div class="tbl"><table>
<tr><th>Thế hệ</th><th>Giải quyết gì</th><th>Còn thiếu gì</th></tr>
<tr><td><b>Static</b> · Word2Vec 2013, GloVe 2014, FastText 2016</td><td>Học vector từ ngữ cảnh. FastText thêm subword nên xử lý được từ hiếm.</td><td>Mỗi từ đúng 1 vector. "bank" (ngân hàng) và "bank" (bờ sông) dùng chung.</td></tr>
<tr><td><b>Contextual</b> · Transformer 2017</td><td>Vector đổi theo câu chứa từ đó nhờ self-attention.</td><td>Chậm hơn, cần GPU. Chưa tiện cho search lớn.</td></tr>
<tr><td><b>Sentence</b> · Sentence-BERT 2019</td><td>Encode mỗi câu độc lập thành 1 vector, so bằng cosine. Nhanh hơn cross-encoder cỡ 1000 lần cho search.</td><td>Vector kích thước cố định, tốn RAM khi corpus lớn.</td></tr>
<tr><td><b>Flexible</b> · Matryoshka 2022, các model 2024-2026</td><td>Cắt bớt chiều mà vẫn giữ chất lượng. Đa phương thức, context dài.</td><td>Phải tự đo chất lượng sau khi cắt.</td></tr>
</table></div>
<div class="verdict"><b>Static → Contextual:</b> nên giữ, nhưng chỉ 1 câu. Đây là lý do embedding hiện đại không còn là bảng tra từ. Không cần đọc thêm.<br>
<b>Chi tiết từng model (CBOW, Skip-gram, negative sampling, GloVe, n-gram):</b> có thể bỏ qua nếu mục tiêu là dùng embedding trong sản phẩm. Hai mục đáng giữ là Sentence-BERT (xem Bài 3) và Matryoshka (xem Bài 7).</div>`,
  why: {
    c: 'Dùng vector liên tục: mỗi từ là một mảng vài trăm đến vài nghìn số thực. Máy so hai mảng bằng phép tính và ra một con số "gần hay xa". Nhờ vậy "kitten" và "cat" tự gần nhau mà không ai phải viết luật. Cùng một cách biểu diễn dùng được cho search, gom nhóm và gợi ý.',
    s: 'One-hot: mỗi từ một vị trí riêng, giống dùng ID. Biết "khác nhau", không biết "gần nhau". Vocab 100.000 từ cần mảng 100.000 phần tử gần như toàn số 0. Từ điển đồng nghĩa viết tay: không ai duy trì nổi cho cả tiếng Việt lẫn thuật ngữ sản phẩm.',
    p: 'Chất lượng nằm ở model, không ở code của bạn. Model học nghĩa từ dữ liệu huấn luyện nên có thể yếu ở thuật ngữ chuyên ngành hoặc tiếng Việt. Vector là hộp đen, khó giải thích vì sao hai thứ gần nhau. Hình dưới là 2 chiều cho dễ nhìn, thật ra 384 đến 3072 chiều.'
  },
  deep: (() => {
    const SENT = ['con mèo ăn cá', 'con chó ăn thịt', 'con mèo ngủ trong nhà', 'con chó ngủ ngoài sân', 'con mèo cắn người', 'con chó cắn người',
      'xe_máy chạy trên đường', 'ô_tô chạy trên đường', 'xe_máy đổ xăng', 'ô_tô đổ xăng', 'xe_máy kẹt xe', 'ô_tô kẹt trên đường', 'đường kẹt xe',
      'cà_phê thêm đường', 'trà thêm đường', 'cà_phê ngọt', 'trà ngọt', 'uống cà_phê', 'uống trà', 'đường ngọt'].map((s) => s.split(' '));
    const NOUN = ['mèo', 'chó', 'cá', 'thịt', 'người', 'nhà', 'sân', 'xe_máy', 'ô_tô', 'xăng', 'cà_phê', 'trà', 'đường'];
    const VOCAB = [...new Set(SENT.flat())], IX = new Map(VOCAB.map((w, i) => [w, i]));
    const CO = VOCAB.map(() => new Array(VOCAB.length).fill(0));
    SENT.forEach((s) => s.forEach((a) => s.forEach((b) => { if (a !== b) CO[IX.get(a)][IX.get(b)]++; })));
    const cosv = (a, b) => dotp(a, b) / (Math.hypot(...a) * Math.hypot(...b) || 1);
    const show = (w) => w.replace('_', ' ');
    return [
    {
      q: 'Embedding thật ra là gì? Một mảng số thì làm sao chứa được "nghĩa"?',
      a: `<p>Embedding là một hàm: đưa vào một đoạn chữ, trả ra một mảng số có độ dài cố định. Trong POC <code>pocs/01_embedding_space.py</code>, câu <i>"Chính sách đổi trả: hàng bị lỗi được đổi trong 30 ngày..."</i> đi qua model MiniLM và trở thành mảng 384 số. 5 số đầu đo được là <code>[-0.009, 0.018, -0.052, -0.017, 0.05]</code>.</p>
<p>Nhìn riêng 5 số đó thì không đọc ra gì cả. Không có ô nào nghĩa là "đổi trả" hay "30 ngày". Nghĩa nằm ở <b>vị trí tương đối</b>: điểm này nằm gần điểm nào, xa điểm nào. Giống toạ độ GPS: con số 10.77 không nói gì, nhưng hai địa chỉ có toạ độ gần nhau thì ở gần nhau.</p>
<p>Vì vậy câu hỏi quan trọng không phải "vector này là gì" mà là "<b>vì sao</b> hai câu cùng nghĩa lại được đặt gần nhau". Muốn hiểu điều đó, hãy xem cách đơn giản nhất mà người ta thử trước tiên, và vì sao nó hỏng.</p>`,
      take: 'Một vector đứng một mình vô nghĩa. Nghĩa chỉ xuất hiện khi so nó với vector khác.'
    },
    {
      q: 'Sao không gán mỗi từ một ID, hay dùng one-hot, cho đơn giản?',
      a: `<p>ID và one-hot giải được bài toán "đây có phải cùng một từ không", giống khoá chính trong bảng SQL. Nhưng chúng không trả lời được "hai từ này gần nghĩa đến đâu".</p>
<p>Lý do là toán học, không phải kỹ thuật. Với one-hot, mỗi từ là một mảng toàn số 0, chỉ có một ô bằng 1 ở vị trí riêng. Hai từ khác nhau thì số 1 nằm ở hai ô khác nhau, nên tích vô hướng (nhân từng cặp ô rồi cộng lại) luôn bằng 0. Cosine luôn bằng 0. Mọi cặp từ cách nhau đúng như nhau: "mèo" xa "chó" bằng "mèo" xa "xe máy".</p>
<p>Còn một vấn đề nữa: kích thước. README lấy ví dụ từ điển 100.000 từ, nghĩa là mảng 100.000 phần tử. Thêm từ mới vào từ điển thì mọi mảng phải dài thêm.</p>
<p>Bảng bên dưới tính cosine thật giữa 5 từ. Bấm nút để so one-hot với cách "đếm ngữ cảnh" ở câu tiếp theo. Mỗi ô là cosine của từ ở hàng với từ ở cột.</p>`,
      viz(box) {
        const W5 = ['mèo', 'chó', 'xe_máy', 'ô_tô', 'cà_phê'], out = el('div');
        let mode = 'onehot';
        const vec = (w) => mode === 'onehot' ? VOCAB.map((v) => (v === w ? 1 : 0)) : CO[IX.get(w)];
        function draw() {
          const head = '<tr><th></th>' + W5.map((w) => `<th>${show(w)}</th>`).join('') + '</tr>';
          const rows = W5.map((a) => `<tr><th>${show(a)}</th>` + W5.map((b) => {
            const c = cosv(vec(a), vec(b));
            return `<td class="mono" style="background:color-mix(in srgb, var(--accent) ${Math.round(c * 70)}%, transparent)">${c.toFixed(2)}</td>`;
          }).join('') + '</tr>').join('');
          out.innerHTML = `<div class="tbl"><table>${head}${rows}</table></div><div class="stat"><span>Độ dài mỗi vector: <b>${VOCAB.length}</b> (bằng số từ trong từ điển mini)</span></div>`;
          b1.classList.toggle('on', mode === 'onehot'); b2.classList.toggle('on', mode === 'co');
        }
        const b1 = el('button', { text: 'One-hot', onclick: () => { mode = 'onehot'; draw(); } });
        const b2 = el('button', { text: 'Đếm ngữ cảnh', onclick: () => { mode = 'co'; draw(); } });
        box.append(el('div', { class: 'row' }, [b1, b2]), out,
          el('div', { class: 'cap', text: 'Số tính thật trong trình duyệt trên 20 câu mẫu ở câu hỏi 3. One-hot: đường chéo là 1, mọi ô khác là 0. Đếm ngữ cảnh: mèo gần chó, xe máy gần ô tô.' }));
        draw();
      },
      take: 'One-hot chỉ nói "khác nhau", không nói "khác bao nhiêu". Muốn đo gần nghĩa thì các từ phải chia sẻ được một số ô.'
    },
    {
      q: 'Vậy máy lấy đâu ra biết "mèo" gần "chó"? Ai dạy nó?',
      a: `<p>Không ai dạy trực tiếp. Ý tưởng gốc là <b>giả thuyết phân bố</b> (distributional hypothesis), Harris đưa ra năm 1954: <i>từ nào xuất hiện trong ngữ cảnh giống nhau thì có nghĩa giống nhau</i>.</p>
<p>Bạn làm điều này hằng ngày. Gặp các câu "con <i>mèo</i> ăn cá", "con <i>chó</i> ăn thịt", "con <i>mèo</i> ngủ trong nhà", "con <i>chó</i> ngủ ngoài sân", bạn thấy mèo và chó hay đứng cạnh cùng những chữ: con, ăn, ngủ, cắn. Chưa cần biết mèo là gì, bạn đã đoán được nó cùng loại với chó.</p>
<p>Cách làm thô nhất cho máy: với mỗi từ, <b>đếm</b> xem nó đứng chung câu với từng từ khác bao nhiêu lần. Hàng đếm đó chính là một vector. Hai từ có hàng đếm giống nhau thì cosine cao.</p>
<p>Chọn một từ bên dưới. Trình duyệt dựng bảng đếm từ 20 câu mẫu, rồi tính cosine với mọi từ khác. Hãy thử từ <b>đường</b>: trong kho mẫu nó vừa là đường đi, vừa là đường ăn. Câu hỏi 8 sẽ quay lại chuyện này.</p>`,
      viz(box) {
        const out = el('div'), ctx = el('div', { class: 'hint' });
        function draw(w) {
          const v = CO[IX.get(w)];
          const nb = NOUN.filter((x) => x !== w).map((x) => [show(x), cosv(v, CO[IX.get(x)])]).sort((a, b) => b[1] - a[1]).slice(0, 6);
          out.replaceChildren(hbars(nb.map(([x, c], i) => [x, c, i === 0]), { max: 1, fmt: (c) => c.toFixed(2) }));
          ctx.innerHTML = 'Ngữ cảnh của <b>' + show(w) + '</b> (từ: số lần đứng chung câu): ' + VOCAB.map((x, i) => [x, v[i]]).filter((p) => p[1]).map(([x, n]) => `${show(x)}: ${n}`).join(', ');
        }
        const sel = select('Từ', ['mèo', 'chó', 'xe_máy', 'ô_tô', 'cà_phê', 'trà', 'đường'].map((w) => [w, show(w)]), 'mèo', draw);
        box.append(el('div', { class: 'row' }, [sel.node]), out, ctx,
          el('div', { class: 'cap', text: 'Cosine tính thật trên bảng đếm của 20 câu mẫu (ngữ cảnh = các từ cùng câu), so với 13 danh từ trong kho. Kho nhỏ nên con số dao động mạnh. Model thật học từ lượng văn bản lớn hơn rất nhiều.' }));
        draw('mèo');
      },
      take: 'Nghĩa của một từ được suy ra từ những từ hay đứng cạnh nó. Đó là gốc rễ của mọi embedding.'
    },
    {
      q: 'Đếm đơn giản thế đã ra kết quả, sao còn phải dùng neural network?',
      a: `<p>Bảng đếm có ba vấn đề khi lên quy mô thật:</p>
<ol><li><b>Quá dài và quá thưa.</b> Mỗi hàng dài bằng cả từ điển (100.000 ô), gần như toàn số 0. Embedding hiện đại chỉ dùng 384 đến 3072 số.</li>
<li><b>Nhiễu bởi từ phổ biến.</b> Chữ "thêm", "trên", "của" đứng cạnh mọi thứ, kéo các từ không liên quan lại gần nhau.</li>
<li><b>Chỉ thấy quan hệ trực tiếp.</b> Nếu "headphone" và "tai nghe" chưa từng đứng cạnh cùng một chữ nào trong kho, bảng đếm cho cosine 0, dù chúng cùng nghĩa.</li></ol>
<p>Cách giải là <b>nén</b>. Word2Vec (2013) cho một mạng nhỏ học đoán từ hàng xóm, và buộc mỗi từ chỉ có vài trăm số để làm việc đó. GloVe (2014) đi thẳng hơn: lấy bảng đếm rồi nén nó xuống. Khi chỗ chứa ít, model không thể nhớ riêng từng từ. Nó buộc phải cho các từ có ngữ cảnh na ná nhau dùng chung toạ độ. Chính việc bị ép chung chỗ tạo ra quan hệ gián tiếp: A giống B, B giống C, nên A cũng gần C.</p>
<p>Giống nén ảnh JPEG: bỏ chi tiết vụn, giữ lại hình dạng chính. Ở đây "hình dạng chính" là cấu trúc ngữ nghĩa.</p>`,
      take: 'Neural network không phát minh ra ý tưởng mới. Nó nén ý tưởng "đếm ngữ cảnh" thành vector ngắn, dày và khái quát hơn.'
    },
    {
      q: 'Hai câu gần như không chung từ nào mà vẫn gần nhau. Thật không? Có số đo không?',
      a: `<p>Có số đo thật từ <code>pocs/01_embedding_space.py</code>, model <code>paraphrase-multilingual-MiniLM-L12-v2</code> (384 chiều). Bảng dưới đặt cạnh nhau hai cách so: <b>trùng chữ</b> (giống SQL <code>LIKE</code> hay tìm theo từ khoá, trình duyệt tự tính) và <b>cosine embedding</b> (đo trong POC).</p>
<p>Lưu ý: hai câu đầu vẫn chung đúng một âm tiết là "tiền". Chỉ một chữ đó thì tìm theo từ khoá không phân biệt được với hàng trăm câu khác có chữ "tiền".</p>

    {

      a: `<p>Mỗi vector có hai thông tin: <b>hướng</b> (chỉ về phía nào) và <b>độ dài</b> (xa gốc bao nhiêu). Nghĩa nằm chủ yếu ở hướng. Độ dài thường bị ảnh hưởng bởi những thứ không liên quan tới nghĩa, ví dụ đoạn văn dài hay ngắn, từ phổ biến hay hiếm.</p>
<p>Có ba cách so hai vector:</p>
<ul><li><b>Cosine</b>: chỉ so hướng, bỏ qua độ dài.</li><li><b>Dot product</b> (tích vô hướng): so cả hướng lẫn độ dài. Vector dài hơn được điểm cao hơn.</li><li><b>L2</b> (khoảng cách Euclid): khoảng cách thẳng giữa hai đầu mũi tên.</li></ul>
<p>Khi mọi vector dài đúng 1, cả ba cho <b>cùng thứ hạng</b>, và dot product chính là cosine. Lúc đó database dùng phép tính rẻ nhất (dot) mà vẫn được kết quả của cosine. POC 02 đo đúng điều này: với vector đã chuẩn hoá, cả ba cho cùng top 3. Khi bỏ chuẩn hoá, dot trả về <code>don-2, tt-3, tt-1</code> thay vì <code>pro-1, pro-2, pro-3</code>.</p>

      viz(box) {
        const W = 320, H = 200, O = [40, 170], S = 60, q = [Math.cos(0.5), Math.sin(0.5)], a = [Math.cos(0.6), Math.sin(0.6)], bDir = [Math.cos(1.1), Math.sin(1.1)];

        function draw(len) {

          el('div', { class: 'cap', text: 'Vector 2 chiều, số tính thật. Câu hỏi và A dài 1. Khi B cũng dài 1, cả ba thước đo đều chọn A. Kéo B dài quá khoảng 1.2 thì dot đổi ý và chọn B, dù hướng của B không hề đổi. L2 cũng đổi theo độ dài B.' }));

      take: 'Chuẩn hoá một lần lúc lưu để độ dài không chen vào điểm số. Sau đó dot product nhanh nhất và cho kết quả bằng cosine.'

    {
      q: 'Một từ nhiều nghĩa như "đường" (đường đi, đường ăn) thì đặt ở đâu?',
      a: `<p>Quay lại câu hỏi 3 và chọn từ <b>đường</b>. Vì bảng đếm gộp mọi câu có chữ "đường", vector của nó là hỗn hợp của hai nghĩa: gần "xe máy" (0.55) nhưng vẫn dính sang "cà phê" (0.27). Tệ hơn, chọn từ <b>cà phê</b> sẽ thấy nó gần "ô tô" (0.29) hơn "xăng", chỉ vì cả hai cùng đứng cạnh chữ "đường". Một từ đa nghĩa kéo hai nhóm không liên quan lại gần nhau. Word2Vec, GloVe, FastText đều có đúng nhược điểm này: <b>mỗi từ một vector cố định</b>, gọi là static embedding.</p>
<p>Transformer (2017) sửa điều đó. Nó đọc cả câu và dùng self-attention, tức là mỗi từ "nhìn" các từ xung quanh để điều chỉnh vector của mình. "Đường" trong "kẹt xe trên đường" và "đường" trong "cà phê thêm đường" ra hai vector khác nhau. Gọi là contextual embedding.</p>
<p>Sentence-BERT (2019) đi thêm một bước: gom vector của cả câu thành <b>một vector duy nhất</b>. Đây là loại model dùng trong RAG. Ta không embed từng từ, mà embed nguyên một đoạn (chunk), nên ngữ cảnh đã nằm sẵn trong đầu vào.</p>`,

      q: 'Trong RAG POC của ShopViet, embedding nằm ở đâu, và mình kiểm soát được gì?',

<div class="tbl"><table><tr><th>Bạn chọn</th><th>Trong POC</th><th>Sai thì sao</th></tr>
<tr><td>Model</td><td><code>embed-v4.0</code>, đa ngôn ngữ</td><td>Model yếu tiếng Việt xếp đoạn đúng tụt hạng, như MiniLM ở câu 6</td></tr>
<tr><td>Đoạn nào được embed</td><td>Chunk từ <code>chunk_by_title</code>, tối đa 500 ký tự</td><td>Đoạn trả lời bị cắt đôi thì vector thiếu ý (Lab 06)</td></tr>
<tr><td>Vai trò đầu vào</td><td><code>search_document</code> khi lưu, <code>search_query</code> khi hỏi</td><td>README: dùng sai vai trò làm giảm chất lượng tìm kiếm đáng kể</td></tr>

<p>Một giới hạn embedding không tự giải được: mã chính xác. README (§1.4.4) ghi embedding nén cả câu thành một vector nên dễ mất tín hiệu chính xác như mã sản phẩm. Kho ShopViet có cả đơn SV-4821 lẫn SV-4822, chỉ khác một chữ số. README của RAG POC gợi ý thử câu "Đơn SV-4821 tới đâu rồi?" để tự xem. Cách xử lý nằm ở Lab 08 (hybrid search).</p>`,
      take: 'Model là hộp đen bạn thuê. Phần bạn làm chủ là chọn model, cắt đoạn, khai báo vai trò, và đo bằng câu hỏi có đáp án.'

  })(),
  mount(stage) {
    const W = 640, H = 380, cx = 320, cy = 190, SX = 48, SY = 38;
    const D = [1.6, 0.3];
    const words = [
      ['king', 2.5, 3.8, 'g1'], ['queen', 4.1, 4.1, 'g1'], ['prince', 2.0, 3.0, 'g1'], ['princess', 3.6, 3.3, 'g1'],
      ['man', -3.0, 0.5, 'g4'], ['woman', -1.4, 0.8, 'g4'],
      ['cat', -4.0, -3.2, 'g2'], ['dog', -3.0, -3.8, 'g2'], ['hamster', -4.6, -4.2, 'g2'], ['kitten', -3.6, -2.4, 'g2'],
      ['car', 3.0, -3.0, 'g3'], ['truck', 4.2, -3.6, 'g3'], ['bicycle', 2.2, -4.2, 'g3']
    ];
    const px = (w) => [cx + w[1] * SX, cy - w[2] * SY];
    const ring = words.map((w, i) => [cx + 150 * Math.cos((i / words.length) * 6.283 - 1.57), cy + 150 * Math.sin((i / words.length) * 6.283 - 1.57)]);
    let mode = 'embed', sel = null;
    const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H}` });
    const links = el('g'), over = el('g');
    const nodes = words.map((w, i) => {
      const g = el('g', { class: 'w' }, [el('circle', { r: 7, style: `fill: var(--${w[3]})` }), el('text', { x: 11, y: 4, text: w[0] })]);
      g.addEventListener('click', () => pick(i));
      return g;
    });
    svg.append(links, ...nodes, over);
    const info = el('div', { class: 'hint' });
    const place = () => nodes.forEach((g, i) => {
      const p = mode === 'embed' ? px(words[i]) : ring[i];
      g.style.transform = `translate(${p[0]}px,${p[1]}px)`;
    });
    const clear = () => { links.replaceChildren(); over.replaceChildren(); nodes.forEach((n) => n.classList.remove('sel')); };
    function pick(i) {
      clear(); sel = i; nodes[i].classList.add('sel');
      const me = words[i];
      if (mode === 'onehot') { info.textContent = `One-hot: "${me[0]}" cách mọi từ khác đúng √2 ≈ 1.41. Máy không biết từ nào gần nghĩa hơn.`; return; }
      const near = words.map((w, j) => [j, Math.hypot(w[1] - me[1], w[2] - me[2])]).filter((x) => x[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, 3);
      const a = px(me);
      const far = (d) => d > 2.5 * near[0][1];
      near.forEach(([j, d]) => { const b = px(words[j]); links.append(el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: far(d) ? 'var(--warn)' : 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': far(d) ? '2 6' : '4 3', opacity: far(d) ? 0.7 : 1 })); });
      const odd = near.filter(([, d]) => far(d));
      info.innerHTML = `3 từ gần "<b>${me[0]}</b>" nhất: ` + near.map(([j, d]) => far(d) ? `<span class="bad">${words[j][0]} (${d.toFixed(1)})</span>` : `<b>${words[j][0]}</b> (${d.toFixed(1)})`).join(', ') +
        (odd.length ? `<br>Màu cam: xa gấp ${(odd[0][1] / near[0][1]).toFixed(0)} lần từ gần nhất, không cùng nhóm nghĩa. Phép tìm "3 từ gần nhất" luôn trả đủ 3 kết quả, nên khi nhóm hết từ, nó lấy từ <b>ít xa nhất</b> trong phần còn lại. Vector database trong RAG cũng vậy: top-K luôn đủ K, kể cả khi đoạn cuối không liên quan.` : '');
    }
    function setMode(m) {
      mode = m; clear(); place();
      bOne.classList.toggle('on', m === 'onehot'); bEmb.classList.toggle('on', m === 'embed');
      info.textContent = m === 'embed' ? 'Bấm một từ để xem 3 từ gần nó nhất.' : 'Mỗi từ là một chiều riêng nên mọi cặp từ cách nhau như nhau. Chuyển sang Embedding để so sánh.';
    }
    const arrow = (x, y, dx, dy, color) => {
      const a = Math.atan2(dy, dx), L = 9, ex = x + dx, ey = y + dy;
      return [
        el('line', { x1: x, y1: y, x2: ex, y2: ey, stroke: color, 'stroke-width': 3 }),
        el('polygon', { points: `${ex},${ey} ${ex - L * Math.cos(a - 0.45)},${ey - L * Math.sin(a - 0.45)} ${ex - L * Math.cos(a + 0.45)},${ey - L * Math.sin(a + 0.45)}`, fill: color })
      ];
    };
    function analogy() {
      setMode('embed'); clear();
      const get = (n) => px(words.find((w) => w[0] === n));
      const man = get('man'), woman = get('woman'), king = get('king'), queen = get('queen');
      const d = [D[0] * SX, -D[1] * SY];
      const step1 = el('g', {}, arrow(man[0], man[1], d[0], d[1], 'var(--g4)'));
      over.append(step1);
      info.textContent = 'Bước 1: vector "man → woman" là hướng chuyển giới tính.';
      setTimeout(() => {
        const copy = el('g', { style: `transform: translate(${man[0] - king[0]}px, ${man[1] - king[1]}px); transition: transform 1s` }, arrow(king[0], king[1], d[0], d[1], 'var(--g4)'));
        over.append(copy);
        requestAnimationFrame(() => requestAnimationFrame(() => { copy.style.transform = 'translate(0px,0px)'; }));
        info.textContent = 'Bước 2: dời mũi tên đó tới "king".';
      }, 1500);
      setTimeout(() => {
        over.append(el('circle', { cx: queen[0], cy: queen[1], r: 16, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 3, class: 'pulse' }));
        info.innerHTML = 'Bước 3: điểm rơi trúng <b>queen</b>. king − man + woman ≈ queen. Quan hệ ý nghĩa thành phép cộng trừ vector.';
      }, 3000);

    const bOne = el('button', { text: 'Mã số (one-hot)', onclick: () => setMode('onehot') });
    const bEmb = el('button', { text: 'Embedding', onclick: () => setMode('embed') });
    const bAna = el('button', { class: 'primary', text: 'Chạy king − man + woman', onclick: analogy });
    stage.append(el('div', { class: 'row' }, [bOne, bEmb, bAna]), svg, info,
      el('div', { class: 'legend', html: '<span><i style="background:var(--g1)"></i>hoàng gia</span><span><i style="background:var(--g4)"></i>giới tính</span><span><i style="background:var(--g2)"></i>thú cưng</span><span><i style="background:var(--g3)"></i>phương tiện</span>' }));
    setMode('embed');
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: 'Junior hỏi: vì sao?' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
