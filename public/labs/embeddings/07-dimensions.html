const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  title: 'Một triệu vector tốn bao nhiêu RAM, và cắt đi đâu',
  hook: 'Chọn số vector, số chiều và kiểu số. Ô sáng là phần vector được giữ lại.',
  terms: [['Số chiều', 'Số phần tử của vector. Model text-embedding-3-small trả 1536 số, text-embedding-3-large trả 3072 số.'], ['float32, int8, binary', 'Kiểu lưu mỗi phần tử. float32 tốn 4 byte, int8 tốn 1 byte, binary tốn 1 bit (1/8 byte). Ít byte hơn thì ít RAM hơn nhưng kém chính xác hơn.'], ['Quantization', 'Làm tròn số thực sang kiểu nhỏ hơn (float32 sang int8 hoặc binary) để tiết kiệm bộ nhớ.'], ['MRL (Matryoshka)', 'Kỹ thuật huấn luyện để các chiều đầu của vector đã chứa thông tin quan trọng nhất. Nhờ vậy cắt bớt phần đuôi (gọi API với tham số dimensions) mà ít mất chất lượng. Tên lấy từ búp bê Nga lồng nhau.'], ['Recall@K', 'Với bộ câu hỏi test biết trước đoạn đúng, lấy K kết quả đầu. Recall@K là tỉ lệ câu hỏi có đoạn đúng nằm trong K kết quả đó. Giống hit rate của cache hay tỉ lệ test case đạt. Recall@5 = 92% nghĩa là 100 câu hỏi thì 92 câu tìm thấy đoạn đúng trong 5 kết quả đầu.'], ['Ngưỡng chấp nhận', 'Mức chất lượng thấp nhất bạn đồng ý, do sản phẩm quyết định. Ví dụ "Recall@5 không được dưới 92%".']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Hiện kho có 1 triệu vector 1536 chiều (khoảng 6 GB). Sắp tới ShopViet thêm đánh giá sản phẩm và email hỗ trợ cũ, kho lên 10 triệu vector. Máy chủ vector database hiện tại có 32 GB RAM.',
    scenario: 'Bạn index 10 triệu đoạn văn bằng model 1536 chiều, lưu float32. Riêng vector đã là 10.000.000 × 1536 × 4 byte, cỡ 61 GB RAM, chưa kể index và metadata.',
    ask: 'Cắt bớt số chiều hay dùng kiểu số nhỏ hơn thì tiết kiệm được bao nhiêu, và cắt tới đâu thì còn an toàn?',
    solves: 'Matryoshka (MRL) cho phép cắt bớt chiều ngay khi gọi API mà ít mất chất lượng. Quantization giảm số bit mỗi giá trị. Cả hai đổi chất lượng lấy RAM, nên phải đo.',
    read: ['Chọn <b>Số vector</b>, <b>Số chiều</b>, <b>Kiểu số</b>. Dòng tính bên dưới là công thức dung lượng.', 'Dải ô: mỗi ô là 64 chiều của vector 3072 chiều. Ô tối là phần bị cắt.', 'Các thanh ngang so sánh 5 cấu hình phổ biến với 3072 chiều float32.', 'Lab chỉ tính dung lượng. Chất lượng sau khi cắt bạn phải tự đo bằng Recall@K trên dữ liệu của mình.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<p>Hai cách giảm dung lượng vector: <b>giảm số chiều</b> hoặc <b>dùng ít bit hơn cho mỗi giá trị</b> (quantization). Cả hai tiết kiệm RAM và tăng tốc, nhưng phải đo phần chất lượng bị mất. Ví dụ tài liệu: vector 1536 chiều float32 là 6144 byte, 1 triệu chunk cần cỡ 6 GB cho riêng vector.</p>
<div class="tbl"><table>
<tr><th>Kỹ thuật</th><th>Nên dùng khi</th><th>Đừng kỳ vọng</th><th>Vai trò</th></tr>
<tr class="cur"><td><b>MRL / native truncation</b></td><td>Model hỗ trợ và cần giảm storage, RAM, latency</td><td>Không thay được visualization 2D/3D</td><td>Giảm chiều cho production retrieval</td></tr>
<tr><td><b>PCA</b></td><td>Model không hỗ trợ MRL, hoặc phân tích khám phá</td><td>Không phải cách tốt nhất giữ chất lượng retrieval ở scale lớn</td><td>Baseline, phân tích phương sai</td></tr>
<tr><td><b>UMAP</b></td><td>Cần nhìn cấu trúc dữ liệu ở 2D/3D</td><td>Không thay embedding production</td><td>Visualization</td></tr>
<tr><td><b>Quantization</b></td><td>RAM hoặc storage đã là nút thắt rõ rệt</td><td>Không phải lúc nào cũng miễn phí về chất lượng</td><td>Giảm footprint, tăng throughput</td></tr>
</table></div>
<h4>Vì sao MRL tốt hơn PCA</h4>
<div class="tbl"><table>
<tr><th></th><th>MRL (native)</th><th>PCA (sau khi embed)</th></tr>
<tr><td>Khi nào</td><td>Ngay lúc training</td><td>Sau training</td></tr>
<tr><td>Cách làm</td><td>Loss ở nhiều mức số chiều, các chiều đầu giữ thông tin quan trọng</td><td>Biến đổi tuyến tính, không biết cấu trúc embedding</td></tr>
<tr><td>Dùng</td><td>Tham số <code>dimensions</code> / <code>output_dimension</code> khi gọi API</td><td>Tự fit và áp dụng</td></tr>
<tr><td>Chất lượng</td><td>Giữ tốt khi cắt còn khoảng một nửa</td><td>Thường mất nhiều hơn</td></tr>
</table></div>
<h4>Chọn số chiều đích: 4 bước</h4>
<ol><li>Lấy baseline ở full dims hoặc mức nhà cung cấp khuyến nghị.</li><li>Quét vài mức: 3072 → 1536 → 768 → 512.</li><li>Đo đúng metric của use case, không chỉ nhìn dung lượng giảm bao nhiêu.</li><li>Dừng ở mức thấp nhất mà chất lượng còn trong ngưỡng chấp nhận.</li></ol>
<div class="verdict"><b>Độ nhạy theo use case:</b> retrieval và RAG thường chịu giảm chiều khá tốt nếu model có MRL. Clustering nhạy hơn với thay đổi hình học nên cần test kỹ. Classification thường ổn nếu ranh giới quyết định không quá phức tạp.</div>`,
  why: {
    c: 'Chọn số chiều thấp nhất mà chất lượng vẫn đạt ngưỡng bạn đặt, bằng cách đo chứ không đoán. Với model có MRL, chỉ cần truyền tham số dimensions khi gọi API, vì model được huấn luyện để các chiều đầu chứa thông tin quan trọng nhất. Số chiều ảnh hưởng ba thứ cùng lúc: RAM (tỉ lệ thuận), tốc độ tìm (ít số hơn để tính) và chất lượng (ít chỗ hơn để chứa nghĩa).',
    s: 'Giữ 3072 chiều cho chắc: tốn gấp đôi RAM so với 1536, trong khi nhiều bài toán không cần. Cắt xuống 256 cho rẻ nhất: chỗ quá chật, hai đoạn khác ý nhưng gần nghĩa bị nén thành gần như một điểm, Recall@K tụt rõ. PCA sau khi embed: không biết cấu trúc embedding nên thường mất nhiều hơn MRL.',
    p: 'Không có con số chung. 1536 hay 768 đều là điểm thương lượng giữa RAM và chất lượng, đúng với dữ liệu nào thì phải đo. Quantization (int8, binary) giảm RAM thêm nhưng mất thêm độ chính xác. Đổi số chiều sau khi đã index nghĩa là embed lại hoặc cắt và dựng lại index.'
  },
  deep: [
    {
      q: 'Một "chiều" là gì? Chiều số 37 có nghĩa là "giá tiền" hay "bảo hành" không?',
      a: `<p>Không. Mỗi chiều chỉ là một con số mà lớp cuối của model xuất ra. Lớp đó có bao nhiêu nơ-ron thì vector có bấy nhiêu chiều. Không ai đặt tên cho từng chiều. Model tự sắp xếp chúng trong lúc huấn luyện.</p>
<p>Nghĩa không nằm ở một ô riêng lẻ mà nằm ở <b>hướng</b> của cả vector, tức tổ hợp của tất cả các ô. Hãy so với màu RGB: kênh R luôn có nghĩa là "đỏ". Embedding giống một công thức pha 1536 loại sơn không có nhãn. Chỉ khi so hai công thức với nhau bạn mới biết chúng giống nhau đến đâu.</p>
<p>Thử nghiệm bên dưới chứng minh điều đó. Ba vector A, B, C có 12 chiều. Bấm nút để xáo trộn thứ tự các chiều và đổi dấu ngẫu nhiên, áp dụng giống nhau cho cả ba. Nhìn từng ô thì vector trông khác hẳn, nhưng cosine giữa chúng <b>không đổi một chút nào</b>. Nếu chiều số 37 thật sự có nghĩa "giá tiền" thì phép xáo trộn này đã làm hỏng nghĩa.</p>`,
      viz(box) {
        const d = 12, rnd = seeded(37);
        const base = unitVec(d, rnd), B = base.map((x) => x + 0.35 * randn(rnd)), C = unitVec(d, rnd);
        let vecs = [base, B, C].map((v) => { const n = Math.hypot(...v); return v.map((x) => x / n); });
        const strips = el('div'), stat = el('div', { class: 'stat' });
        const color = (x) => x >= 0 ? `color-mix(in srgb, var(--g1) ${Math.min(100, Math.abs(x) * 180)}%, var(--bg))` : `color-mix(in srgb, var(--g2) ${Math.min(100, Math.abs(x) * 180)}%, var(--bg))`;
        function draw() {
          strips.replaceChildren(...vecs.map((v, i) => el('div', { style: 'display:grid;grid-template-columns:28px repeat(12,1fr);gap:3px;margin-bottom:4px;align-items:center' },
            [el('b', { class: 'mono', text: 'ABC'[i] }), ...v.map((x) => el('span', { title: x.toFixed(3), style: `height:24px;border-radius:3px;background:${color(x)}` }))])));
          stat.innerHTML = `<span>cos(A, B) = <b>${dotp(vecs[0], vecs[1]).toFixed(4)}</b></span><span>cos(A, C) = <b>${dotp(vecs[0], vecs[2]).toFixed(4)}</b></span>`;
        }
        const btn = el('button', { text: 'Xáo trộn và đổi dấu các chiều', onclick: () => {
          const perm = Array.from({ length: d }, (_, i) => i).sort(() => rnd() - 0.5), sign = perm.map(() => (rnd() < 0.5 ? -1 : 1));
          vecs = vecs.map((v) => perm.map((p, i) => v[p] * sign[i]));
          draw(); strips.classList.remove('pulse'); void strips.offsetWidth; strips.classList.add('pulse');
        } });
        box.append(el('div', { class: 'row' }, [btn]), strips, stat,
          el('div', { class: 'cap', text: 'Xanh là số dương, cam là số âm, càng đậm thì trị tuyệt đối càng lớn. Rê chuột lên ô để xem giá trị.' }));
        draw();
      },
      take: 'Chiều không có nghĩa riêng. Vì vậy cắt bớt chiều không làm mất "một khái niệm" mà làm mọi khái niệm mờ đi một chút.'
    },
    {
      q: 'Vậy con số 1536 từ đâu ra? Sao chỗ nào cũng thấy 1536?',
      a: `<p>Số chiều do người thiết kế model chọn. Nó bằng kích thước lớp ẩn (hidden size) của mạng. Họ thường chọn bội số của 128 vì GPU nhân ma trận nhanh nhất ở các kích thước đó: 384 = 3 × 128, 768 = 6 × 128, 1536 = 12 × 128, 3072 = 24 × 128.</p>
<p>1536 phổ biến vì <b>lịch sử</b>, không phải vì nó là con số tối ưu:</p>
<ol><li>Tháng 12/2022 OpenAI ra <code>text-embedding-ada-002</code>, trả về 1536 chiều. Model này rẻ và dễ dùng nên trở thành mặc định trong rất nhiều tutorial, ví dụ của LangChain và LlamaIndex, và schema <code>vector(1536)</code> của pgvector.</li>
<li>Tháng 01/2024 <code>text-embedding-3-small</code> giữ mặc định 1536. Ai đang dùng ada-002 có thể đổi model mà không phải sửa schema.</li>
<li>Cohere <code>embed-v4.0</code> (model trong RAG POC) cũng mặc định 1536, và cho chọn 256, 512, 1024.</li></ol>
<p>OpenAI chưa từng công bố vì sao chọn đúng 1536. Model open-source lại hay dùng 384, 768 hoặc 1024. Hình dưới lấy số chiều từ bảng model trong README.</p>`,
      viz(box) {
        const rows = [['all-MiniLM-L6-v2', 384], ['EmbeddingGemma-300m', 768], ['BGE-M3', 1024], ['voyage-4', 1024], ['text-embedding-3-small', 1536], ['Cohere embed-v4.0', 1536], ['Cohere embed-v5.0-pro', 2048], ['text-embedding-3-large', 3072], ['gemini-embedding-2', 3072]];
        box.append(hbars(rows.map(([m, d]) => [m, d, d === 1536]), { max: 3072, fmt: (v) => `${v} = ${v / 128}×128` }),
          el('div', { class: 'cap', text: 'Thanh màu đậm là các model mặc định 1536 chiều. Mọi con số đều là bội của 128.' }));
      },
      take: '1536 là "chuẩn ngầm" do model của OpenAI phổ biến, không phải quy luật. Câu đúng phải là: số chiều nào đủ cho dữ liệu của tôi?'
    },
    {
      q: 'Nhiều chiều hơn thì được gì? "Có thêm chỗ chứa nghĩa" nghĩa là sao?',
      a: `<p>Thử tưởng tượng chỉ có 2 chiều, như một tờ bản đồ. Bạn muốn đặt "tai nghe" gần "bảo hành", gần "Bluetooth", gần "pin" và gần "giá". Nhưng "bảo hành" và "Bluetooth" không liên quan nhau, nên chúng phải ở xa nhau. Trên mặt phẳng không làm được: mọi thứ quây quanh "tai nghe" sẽ bị ép sát vào nhau.</p>
<p>Mỗi chiều thêm vào là một hướng mới để tách các thứ ra. Có một sự thật toán học đáng nhớ: trong không gian nhiều chiều, <b>hai hướng ngẫu nhiên gần như luôn vuông góc</b> (cosine gần 0). Độ lệch của cosine chỉ cỡ 1/√d. Với d = 1536 thì đó là ±0.026.</p>
<p>Nghĩa là chiều cao cho model rất nhiều "hướng trống". Các chủ đề không liên quan đứng ở các hướng gần vuông góc nhau và không lẫn vào nhau. Nhờ vậy các cặp thật sự liên quan, với cosine 0.4 hay 0.6, nổi bật hẳn lên.</p>
<p>Kéo thanh trượt bên dưới. Trình duyệt sẽ sinh 100 vector ngẫu nhiên ở số chiều bạn chọn và vẽ phân bố cosine của 4950 cặp. Đây là số tính thật, không phải số vẽ sẵn.</p>`,
      viz(box) {
        const ds = [2, 3, 8, 32, 128, 384, 1536], W = 560, H = 170, NB = 40;
        const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 26}`, role: 'img', 'aria-label': 'Histogram cosine giữa các cặp vector ngẫu nhiên' });
        const stat = el('div', { class: 'stat' });
        function draw(d) {
          const rnd = seeded(11), N = 100, vs = Array.from({ length: N }, () => unitVec(d, rnd));
          const bins = new Array(NB).fill(0); let big = 0, tot = 0;
          for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
            const c = dotp(vs[i], vs[j]);
            bins[Math.min(NB - 1, Math.floor(((c + 1) / 2) * NB))]++; if (Math.abs(c) > 0.5) big++; tot++;
          }
          const mx = Math.max(...bins), bw = W / NB;
          svg.replaceChildren(
            ...bins.map((b, i) => el('rect', { x: i * bw + 1, y: H - (b / mx) * (H - 10), width: bw - 2, height: (b / mx) * (H - 10), rx: 2, fill: Math.abs(i + 0.5 - NB / 2) > NB / 4 ? 'var(--warn)' : 'var(--accent)' })),
            el('line', { x1: 0, x2: W, y1: H, y2: H, stroke: 'var(--line)' }),
            ...[[-1, 0], [-0.5, W / 4], [0, W / 2], [0.5, (3 * W) / 4], [1, W]].map(([t, x]) => el('text', { x: Math.min(W - 14, Math.max(2, x - 6)), y: H + 18, class: 'mute', text: String(t) })));
          stat.innerHTML = `<span>${tot} cặp</span><span>cặp có |cos| &gt; 0.5: <b>${((big / tot) * 100).toFixed(1)}%</b></span><span>1/√d = <b>${(1 / Math.sqrt(d)).toFixed(3)}</b></span>`;
        }
        const sl = slider('Số chiều', 0, ds.length - 1, 1, 0, (v) => draw(ds[v]), (v) => ds[v]);
        box.append(el('div', { class: 'row' }, [sl.node]), svg, stat,
          el('div', { class: 'cap', text: 'Trục ngang là cosine từ -1 đến 1. Cột cam là các cặp "trông có vẻ liên quan" (|cos| > 0.5) dù thực ra chỉ là vector ngẫu nhiên. Ở 2 chiều có khoảng 2/3 số cặp như vậy. Ở 1536 chiều thì gần như không còn cặp nào.' }));
        draw(ds[0]);
      },
      take: 'Chiều cao làm cho những thứ không liên quan ở xa nhau một cách tự nhiên. Chiều thấp thì nhiều thứ trông "giống nhau" chỉ vì thiếu chỗ.'
    },
    {
      q: 'Vậy cắt xuống ít chiều thì hỏng đến mức nào? Có số đo thật không?',
      a: `<p>Có. File <code>pocs/07_dimensions.py</code> lấy model <code>paraphrase-multilingual-MiniLM-L12-v2</code> (384 chiều), embed 24 đoạn ShopViet, rồi cắt vector còn 256, 128, 64, 32 chiều và chuẩn hoá lại. Sau đó chạy 4 câu hỏi và đếm số câu tìm thấy đoạn đúng trong top 3.</p>
<p>Kết quả: 384, 256 và 128 chiều cho cùng mức 75%. Xuống 64 chiều thì tụt còn 25%. Lưu ý MiniLM <b>không được huấn luyện kiểu Matryoshka</b>, nên cắt đuôi là cách cắt "thô". Với chỉ 24 đoạn, 128 chiều vẫn đủ chỗ. Kho 1 triệu đoạn với nhiều chủ đề sát nhau sẽ cần nhiều chỗ hơn.</p>
<p>Đây là kiểu "va chạm" của chiều thấp. Khi không đủ hướng, "đổi trả tai nghe" và "bảo hành tai nghe" bị ép gần thành một điểm, nên đoạn sai chen vào top 3.</p>`,
      viz(box) {
        const rows = [['float32 · 384', 75, 1.54], ['float32 · 256', 75, 1.02], ['float32 · 128', 75, 0.51], ['float32 · 64', 25, 0.26], ['float32 · 32', 25, 0.13], ['int8 · 384', 75, 0.38], ['binary · 384', 50, 0.048]];
        box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Cấu hình</th><th>Recall@3 (4 câu hỏi)</th><th>RAM cho 1 triệu chunk</th></tr>' + rows.map(([c, r, g]) => `<tr><td>${c}</td><td><b class="${r >= 75 ? 'ok' : 'bad'}">${r}%</b></td><td class="mono">${g} GB</td></tr>`).join('') })]),
          el('div', { class: 'cap', text: 'Số đo thật từ pocs/07_dimensions.py. Chỉ có 4 câu hỏi nên mỗi câu bằng 25 điểm phần trăm. Dùng để thấy xu hướng, không dùng để chọn cấu hình production.' }));
      },
      take: 'Chiều thấp làm các ý gần nghĩa dính vào nhau. Điểm gãy phụ thuộc vào dữ liệu và model, nên phải tự đo.'
    },
    {
      q: 'Thế cứ chọn 3072 chiều cho chắc ăn được không?',

function problem(p) {

  return el('div', { class: 'prob' }, [

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: 'Junior hỏi: vì sao?' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
