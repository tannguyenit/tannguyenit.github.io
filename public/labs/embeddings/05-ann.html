const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  title: 'Tìm láng giềng gần nhất mà không phải so với tất cả',
  hook: 'Bấm vào vùng vẽ để đặt query, rồi chạy hai cách tìm và đếm số phép tính khoảng cách.',
  terms: [['Nearest neighbor', 'Láng giềng gần nhất: vector trong kho gần vector câu hỏi nhất. Đây là phép "tìm kiếm" của vector database.'], ['Brute-force, O(N)', 'So câu hỏi với từng vector một. Thời gian tăng đúng bằng số vector. Giống full table scan khi không có index.'], ['ANN', 'Approximate Nearest Neighbor, tìm láng giềng gần đúng. Chấp nhận thỉnh thoảng bỏ lỡ một kết quả để nhanh hơn rất nhiều.'], ['HNSW', 'Đồ thị nhiều tầng. Hình dung như skip list, hoặc bản đồ: tầng trên là quốc lộ nối vài thành phố, tầng dưới là đường làng nối mọi điểm.'], ['Greedy search', 'Ở mỗi bước chỉ nhìn các láng giềng của nút hiện tại, đi sang nút gần câu hỏi nhất. Hết đường tốt hơn thì dừng, hoặc xuống tầng dưới.'], ['Latency', 'Thời gian từ lúc gửi yêu cầu đến lúc có kết quả, đơn vị mili giây.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Trợ lý phải trả lời trong dưới 1 giây. Riêng bước tìm 1 triệu đoạn gần câu hỏi nhất chỉ được phép tốn vài chục mili giây. Mỗi tuần ShopViet lại thêm tài liệu mới, kho chỉ lớn lên.',
    scenario: 'Bạn có hàng triệu vector tài liệu. Mỗi query phải tìm vector gần nhất trong vài mili giây. So query với từng vector nghĩa là hàng triệu phép tính khoảng cách cho mỗi lần tìm.',
    ask: 'Có cách nào tìm gần đúng láng giềng gần nhất mà chỉ so với một phần rất nhỏ các vector?',
    solves: 'HNSW xây đồ thị nhiều tầng. Bắt đầu ở tầng thưa để nhảy xa tới đúng vùng, rồi xuống tầng dày để tìm chính xác. Số phép tính tăng rất chậm khi kho lớn hơn.',
    read: ['Mỗi chấm là vector của một tài liệu (rút còn 2 chiều, 150 chấm). Vòng tròn đen là query. Bấm vào vùng vẽ để đổi vị trí query.', 'Bấm <b>Brute-force</b>: máy so query với cả 150 chấm, vòng cam quét qua từng chấm.', 'Bấm <b>HNSW</b>: vòng xanh ngọc là nút đang đứng, vòng cam là các láng giềng được so, thử vài bước rồi xuống tầng dưới.', 'So hai con số "phép tính khoảng cách". Vòng xanh lá là láng giềng thật. Nếu HNSW trượt, đó là cái giá của việc tìm gần đúng.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<p>Brute-force so query với <b>tất cả</b> N vector, O(N). Vài nghìn tài liệu thì ổn, hàng triệu thì quá chậm. ANN (Approximate Nearest Neighbor) hy sinh một chút accuracy để đạt tốc độ sub-linear.</p>
<div class="tbl"><table>
<tr><th>Thuật toán</th><th>Ý tưởng</th><th>Điểm mạnh</th><th>Đánh đổi</th><th>Dùng trong</th></tr>
<tr class="cur"><td><b>HNSW</b></td><td>Đồ thị nhiều tầng. Tầng trên thưa để nhảy xa, tầng dưới dày để tinh chỉnh</td><td>Nhanh, recall cao</td><td>Tốn RAM</td><td>Qdrant, Weaviate, pgvector, Pinecone</td></tr>
<tr><td><b>IVF</b></td><td>Chia không gian thành K cụm bằng K-means, chỉ tìm trong cụm gần query</td><td>Ít bộ nhớ hơn</td><td>Cần phân cụm trước, nhạy với cách dữ liệu phân bố</td><td>FAISS, Milvus</td></tr>
<tr><td><b>DiskANN</b></td><td>Giống HNSW nhưng đồ thị nằm trên SSD</td><td>Scale rất lớn</td><td>Latency cao hơn in-memory</td><td>Milvus</td></tr>
<tr><td><b>Brute-force</b></td><td>So với tất cả</td><td>Chính xác 100%, không cần index</td><td>O(N)</td><td>Tập nhỏ</td></tr>
</table></div>
<div class="verdict"><b>Cách chọn:</b> bắt đầu bằng HNSW nếu RAM đủ. Chuyển IVF khi RAM là nút thắt, DiskANN khi dữ liệu vượt RAM. Quyết định dựa trên mức recall và độ trễ bạn chấp nhận được, đo trên dữ liệu thật. Tham số HNSW (<code>m</code>, <code>ef_construction</code>, <code>ef_search</code>) nằm ở §3.2 của tài liệu.</div>`,
  why: {
    c: 'HNSW giống bản đồ giao thông. Tầng trên chỉ có vài nút nối xa (như quốc lộ) để nhảy nhanh tới đúng vùng. Tầng dưới có mọi điểm nối với láng giềng gần (như đường làng) để tìm chính xác. Mỗi bước chỉ so với vài láng giềng của nút hiện tại, nên số phép tính tăng rất chậm khi kho lớn (cỡ log N thay vì N). Recall cao và nhanh trong nhiều thực tế, nên là mặc định của Qdrant, pgvector, Weaviate.',
    s: 'Brute-force: chính xác tuyệt đối, nhưng 1 triệu vector là 1 triệu phép tính mỗi câu hỏi. Vẫn dùng được cho vài nghìn tài liệu. IVF: chia kho thành cụm, chỉ tìm trong cụm gần nhất, tiết kiệm RAM hơn nhưng cần bước phân cụm trước. DiskANN: đồ thị nằm trên SSD cho kho vượt RAM, đổi lại chậm hơn.',
    p: 'Kết quả là gần đúng: đôi khi bỏ lỡ láng giềng thật, bạn có thể thấy điều đó trong hình. Đồ thị nằm trong RAM nên tốn bộ nhớ thêm ngoài vector. Dựng index mất thời gian, thêm tài liệu mới thì phải cập nhật đồ thị. Chỉnh tham số (m, ef_search) là đổi giữa recall và tốc độ, nên đo trên dữ liệu của bạn.'
  },
  deep: [
    {
      q: 'Máy tính nhân cộng cả tỷ phép mỗi giây. So với 1 triệu vector thì chậm chỗ nào?',
      a: `<p>Đếm thử. So câu hỏi với một vector d chiều là d phép nhân và d phép cộng. Brute-force (so với tất cả, giống full table scan khi không có index) với N vector là <b>N × d</b> phép nhân cộng cho <i>mỗi</i> câu hỏi, và phải đọc toàn bộ N × d × 4 byte từ RAM.</p>
<p>Với kịch bản ShopViet: 1 triệu × 1536 = khoảng 1,5 tỷ phép nhân cộng và 6 GB dữ liệu phải đọc cho một câu hỏi. Thường thì cái nghẽn là <b>tốc độ đọc RAM</b> chứ không phải CPU tính. Một trăm người hỏi cùng lúc là 100 lần như vậy.</p>
<p>POC 05 đo thật: 200.000 vector 384 chiều, brute-force mất <b>5.21 ms mỗi câu hỏi</b>. Nghe nhanh, nhưng chi phí tăng thẳng theo N × d. Chọn kích thước bên dưới để ngoại suy, và bấm nút để trình duyệt của bạn tự quét 20.000 vector thật.</p>`,
      viz(box) {
        const S = { n: 1e6, d: 1536 }, out = el('div', { class: 'stat' }), live = el('div', { class: 'stat' });
        const big = (x) => x >= 1e9 ? (x / 1e9).toFixed(1) + ' tỷ' : (x / 1e6).toFixed(1) + ' triệu';
        const ms = (v) => v < 1000 ? v.toFixed(1) + ' ms' : (v / 1000).toFixed(1) + ' giây';
        function draw() {
          const ops = S.n * S.d;
          out.innerHTML = `<span>Nhân cộng / câu hỏi: <b>${big(ops)}</b></span><span>Dữ liệu đọc: <b>${((ops * 4) / 1e9).toFixed(2)} GB</b></span><span>Ngoại suy từ POC 05: <b>${ms((5.21 * ops) / (2e5 * 384))}</b></span>`;
        }
        function bench() {
          const n = 20000, d = 384, data = new Float32Array(n * d), q = new Float32Array(d);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() - 0.5;
          for (let j = 0; j < d; j++) q[j] = Math.random() - 0.5;
          let best = Infinity, top = -1;
          for (let rep = 0; rep < 3; rep++) {
            const t0 = performance.now(); let bs = -Infinity;
            for (let i = 0; i < n; i++) { let s = 0; const o = i * d; for (let j = 0; j < d; j++) s += data[o + j] * q[j]; if (s > bs) { bs = s; top = i; } }
            best = Math.min(best, performance.now() - t0);
          }
          live.innerHTML = `<span>Trình duyệt của bạn: 20.000 × 384 mất <b>${best.toFixed(1)} ms</b></span><span>Suy ra 1 triệu × 1536: <b>${ms(best * 200)}</b></span><span class="mute">(gần nhất: vector #${top})</span>`;
        }
        box.append(el('div', { class: 'row' }, [
          select('Số vector', [[2e5, '200.000'], [1e6, '1 triệu'], [1e7, '10 triệu'], [1e8, '100 triệu']], S.n, (v) => { S.n = +v; draw(); }).node,
          select('Số chiều', [[384, '384'], [1536, '1536'], [3072, '3072']], S.d, (v) => { S.d = +v; draw(); }).node]), out,
          el('div', { class: 'row', style: 'margin-top:10px' }, [el('button', { text: 'Đo brute-force trên trình duyệt', onclick: bench })]), live,
          el('div', { class: 'cap', text: 'Dòng trên: 5.21 ms là số đo thật của POC 05 (FAISS, 200 câu hỏi gửi theo lô nên thời gian mỗi câu được chia đều), các kích thước khác là ngoại suy tuyến tính. Dòng dưới: JavaScript thuần một luồng, chậm hơn thư viện tối ưu như FAISS.' }));
        draw();
      },
      take: 'Brute-force tăng thẳng theo N × d. Kho lớn gấp 10 là chậm gấp 10, trong khi ngân sách tìm kiếm của ShopViet chỉ vài chục mili giây.'
    },
    {
      q: 'Database có B-tree làm index cho số và chuỗi. Sao vector không có index chính xác như vậy?',
      a: `<p>B-tree chạy được vì số và chuỗi có <b>thứ tự</b>: biết 500 &gt; 300 thì bỏ được nửa cây. Vector 1536 chiều không có thứ tự kiểu đó. "Gần nhau" phụ thuộc vào cả 1536 chiều cùng lúc.</p>
<p>Có những cây chia không gian, như kd-tree (cắt không gian lần lượt theo từng chiều). Chúng chạy tốt ở 2–3 chiều. Nhưng khi số chiều lớn, mọi điểm đều cách nhau gần như bằng nhau (lab 07 có hình minh hoạ), nên gần như nhánh nào cũng phải xét. Cây thoái hoá thành quét toàn bộ. Đây là "lời nguyền số chiều" (curse of dimensionality).</p>
<p>Vì vậy ngành chọn lối khác: <b>bỏ yêu cầu chính xác 100%</b>. ANN (Approximate Nearest Neighbor, tìm láng giềng gần đúng) chấp nhận đôi khi trả về hạng 11 thay vì hạng 10. Đổi lại, chỉ phải xét một phần rất nhỏ của kho. Với RAG, cái giá này thường nhỏ: bước sau còn reranker, và đoạn hạng 11 thường cũng liên quan gần bằng đoạn hạng 10.</p>`,
      take: '"Approximate" nghĩa là bỏ lời hứa luôn đúng top-K, để đổi lấy tốc độ không còn tăng thẳng theo N.'
    },
    {
      q: 'HNSW đi theo "hàng xóm" là sao? Sao đi như vậy lại tới được gần câu hỏi?',
      a: `<p>Lúc dựng index, mỗi vector được nối cạnh với vài vector gần nó nhất. Kết quả là một đồ thị, giống mạng bạn bè: ai cũng quen vài người ở gần.</p>
<p>Lúc tìm, bắt đầu từ một nút bất kỳ (entry point). Ở mỗi bước, tính khoảng cách từ câu hỏi tới các hàng xóm của nút hiện tại, rồi <b>nhảy sang hàng xóm gần câu hỏi nhất</b>. Khi không hàng xóm nào gần hơn nút đang đứng thì dừng. Đó là greedy search (tìm tham lam). Nó chỉ tính khoảng cách tới các nút nằm dọc đường đi, không phải cả kho.</p>
<p>Hình dưới chạy thật trên 300 điểm ngẫu nhiên. <b>M</b> là số hàng xóm gần nhất mỗi điểm được nối (cạnh hai chiều, như HNSW). Bấm vào hình để đặt câu hỏi. Thử M = 3: đồ thị thưa, đường đi dễ kẹt ở một điểm "trông như gần nhất" nhưng không phải.</p>`,
      viz(box) {
        const N = 300, W = 560, H = 300, rnd = seeded(21), P = Array.from({ length: N }, () => [rnd(), rnd()]);
        const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
        const near = P.map((p) => P.map((_, j) => j).sort((a, b) => d2(p, P[a]) - d2(p, P[b])).slice(1, 13));
        const graph = (m) => { const G = P.map(() => new Set()); near.forEach((ns, i) => ns.slice(0, m).forEach((j) => { G[i].add(j); G[j].add(i); })); return G; };
        const S = { m: 6, q: [0.15, 0.85], g: graph(6) }, svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Greedy search trên đồ thị láng giềng', style: 'cursor:crosshair' }), stat = el('div', { class: 'stat' });
        const X = (p) => p[0] * (W - 20) + 10, Y = (p) => p[1] * (H - 20) + 10;
        function draw() {
          let cur = 0, ev = 1; const path = [0];
          for (;;) { let best = cur; for (const nb of S.g[cur]) { ev++; if (d2(P[nb], S.q) < d2(P[best], S.q)) best = nb; } if (best === cur) break; cur = best; path.push(cur); }
          const truth = P.reduce((b, p, i) => (d2(p, S.q) < d2(P[b], S.q) ? i : b), 0);
          svg.replaceChildren(
            ...P.flatMap((p, i) => near[i].slice(0, S.m).map((j) => el('line', { x1: X(p), y1: Y(p), x2: X(P[j]), y2: Y(P[j]), stroke: 'var(--line)' }))),
            ...P.map((p) => el('circle', { cx: X(p), cy: Y(p), r: 2.5, fill: 'var(--mute)' })),
            el('path', { d: path.map((i, k) => (k ? 'L' : 'M') + X(P[i]) + ' ' + Y(P[i])).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 3 }),
            el('circle', { cx: X(P[truth]), cy: Y(P[truth]), r: 9, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 2.5 }),
            el('circle', { cx: X(P[cur]), cy: Y(P[cur]), r: 6, fill: 'var(--accent)' }),
            el('circle', { cx: X(P[0]), cy: Y(P[0]), r: 6, fill: 'var(--g4)' }),
            el('circle', { cx: X(S.q), cy: Y(S.q), r: 7, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }));
          stat.innerHTML = `<span>Số bước nhảy: <b>${path.length - 1}</b></span><span>Phép tính khoảng cách: <b>${ev}</b> / ${N}</span><span>${cur === truth ? '<b class="ok">Tìm đúng láng giềng gần nhất</b>' : '<b class="bad">Kẹt ở cực tiểu cục bộ, trượt</b>'}</span>`;
        }
        svg.addEventListener('click', (e) => { const r = svg.getBoundingClientRect(); S.q = [((e.clientX - r.left) / r.width * W - 10) / (W - 20), ((e.clientY - r.top) / r.height * H - 10) / (H - 20)]; draw(); });
        box.append(el('div', { class: 'row' }, [slider('M (số hàng xóm)', 1, 12, 1, S.m, (v) => { S.m = v; S.g = graph(v); draw(); }).node]), svg, stat,
          el('div', { class: 'cap', text: 'Tính thật trong trình duyệt. Chấm tím là điểm xuất phát, vòng đen là câu hỏi, đường xanh ngọc là đường đi, vòng xanh lá là láng giềng gần nhất thật (tìm bằng brute-force để đối chiếu). Đây là một tầng, chưa có tầng trên của HNSW.' }));
        draw();
      },
      take: 'Đồ thị láng giềng biến "so với tất cả" thành "đi theo hướng gần hơn". Số phép tính tỉ lệ với độ dài đường đi, không phải với N.'
    },
    {
      q: 'Ở hình trên mỗi bước chỉ tiến một quãng ngắn. Kho 1 triệu thì sao? "Nhiều tầng" giải quyết gì?',
      a: `<p>Chỉ nối với hàng xóm gần thì mỗi bước chỉ tiến được một quãng ngắn. Kho càng lớn, đường đi càng dài. Giống đi từ Hà Nội vào Sài Gòn mà chỉ được dùng đường làng.</p>
<p>HNSW (Hierarchical Navigable Small World, đồ thị "thế giới nhỏ" nhiều tầng) thêm <b>tầng cao tốc</b>. Khi chèn một điểm, nó tung xúc xắc để quyết định điểm đó có mặt tới tầng nào. Xác suất giảm theo cấp số nhân: theo bài báo gốc, với M = 16 thì khoảng 1/16 số điểm có mặt ở tầng 1, 1/256 ở tầng 2, và cứ thế. Tầng trên ít điểm nên các cạnh nối rất xa.</p>
<p>Tìm kiếm bắt đầu ở tầng cao nhất, đi tham lam vài bước để nhảy về đúng vùng, rồi xuống tầng dưới dùng điểm vừa tìm làm điểm xuất phát, và lặp lại tới tầng 0 (tầng có mọi điểm). Đây chính là skip list (danh sách liên kết có làn nhảy) mở rộng sang không gian nhiều chiều. Nhờ vậy số bước tăng cỡ log N thay vì tăng theo kích thước kho.</p>
<p>Phần mô phỏng phía trên bài (nút <b>HNSW</b>) vẽ đúng cơ chế này với 3 tầng.</p>`,
      take: 'Tầng trên để nhảy xa cho đúng vùng, tầng 0 để tinh chỉnh. Không có tầng trên thì đường đi dài ra theo kích thước kho.'
    },
    {
      q: 'Vậy vì sao HNSW không đạt recall 100%? Làm sao kéo nó lên?',
      a: `<p>Greedy search chỉ giữ <b>một</b> ứng viên. Nếu mọi hàng xóm của nút hiện tại đều xa câu hỏi hơn, nó dừng, kể cả khi đi vòng qua một nút xa hơn một chút sẽ tới được điểm gần hơn. Đó là cực tiểu cục bộ ở hình câu 3.</p>

    const showEdges = (L) => {

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
