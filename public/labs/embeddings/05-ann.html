const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  title: 'Tìm láng giềng gần nhất mà không phải so với tất cả',
  hook: 'Bấm vào vùng vẽ để đặt query, rồi chạy hai cách tìm và đếm số phép tính khoảng cách.',
  terms: [['Nearest neighbor', 'Láng giềng gần nhất: vector trong kho gần vector câu hỏi nhất. Đây là phép "tìm kiếm" của vector database.'], ['Brute-force, O(N)', 'So câu hỏi với từng vector một. Thời gian tăng đúng bằng số vector. Giống full table scan khi không có index.'], ['ANN', 'Approximate Nearest Neighbor, tìm láng giềng gần đúng. Chấp nhận thỉnh thoảng bỏ lỡ một kết quả để nhanh hơn rất nhiều.'], ['HNSW', 'Đồ thị nhiều tầng. Hình dung như skip list, hoặc bản đồ: tầng trên là quốc lộ nối vài thành phố, tầng dưới là đường làng nối mọi điểm.'], ['Greedy search', 'Ở mỗi bước chỉ nhìn các láng giềng của nút hiện tại, đi sang nút gần câu hỏi nhất. Hết đường tốt hơn thì dừng, hoặc xuống tầng dưới.'], ['Latency', 'Thời gian từ lúc gửi yêu cầu đến lúc có kết quả, đơn vị mili giây.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Trợ lý phải trả lời trong dưới 1 giây. Riêng bước tìm 1 triệu đoạn gần câu hỏi nhất chỉ được phép tốn vài chục mili giây. Mỗi tuần ShopViet lại thêm tài liệu mới, kho chỉ lớn lên.',
    scenario: 'Bạn có hàng triệu vector tài liệu. Mỗi query phải tìm vector gần nhất trong vài mili giây. So query với từng vector nghĩa là hàng triệu phép tính khoảng cách cho mỗi lần tìm.',
    ask: 'Có cách nào tìm gần đúng láng giềng gần nhất mà chỉ so với một phần rất nhỏ các vector?',
    solves: 'HNSW xây đồ thị nhiều tầng. Bắt đầu ở tầng thưa để nhảy xa tới đúng vùng, rồi xuống tầng dày để tìm chính xác. Số phép tính tăng rất chậm khi kho lớn hơn.',
    read: ['Mỗi chấm là vector của một tài liệu (rút còn 2 chiều, 150 chấm). Vòng tròn đen là query. Bấm vào vùng vẽ để đổi vị trí query.', 'Bấm <b>Brute-force</b>: máy so query với cả 150 chấm, vòng cam quét qua từng chấm.', 'Bấm <b>HNSW</b>: vòng xanh ngọc là nút đang đứng, vòng cam là các láng giềng được so, thử vài bước rồi xuống tầng dưới.', 'So hai con số "phép tính khoảng cách". Vòng xanh lá là láng giềng thật. Nếu HNSW trượt, đó là cái giá của việc tìm gần đúng.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<p>Brute-force so query với <b>tất cả</b> N vector, O(N). Vài nghìn tài liệu thì ổn, hàng triệu thì quá chậm. ANN (Approximate Nearest Neighbor) hy sinh một chút accuracy để đạt tốc độ sub-linear.</p>
<div class="tbl"><table>
<tr><th>Thuật toán</th><th>Ý tưởng</th><th>Điểm mạnh</th><th>Đánh đổi</th><th>Dùng trong</th></tr>
<tr class="cur"><td><b>HNSW</b></td><td>Đồ thị nhiều tầng. Tầng trên thưa để nhảy xa, tầng dưới dày để tinh chỉnh</td><td>Nhanh, recall cao</td><td>Tốn RAM</td><td>Qdrant, Weaviate, pgvector, Pinecone</td></tr>
<tr><td><b>IVF</b></td><td>Chia không gian thành K cụm bằng K-means, chỉ tìm trong cụm gần query</td><td>Ít bộ nhớ hơn</td><td>Cần phân cụm trước, nhạy với cách dữ liệu phân bố</td><td>FAISS, Milvus</td></tr>
<tr><td><b>DiskANN</b></td><td>Giống HNSW nhưng đồ thị nằm trên SSD</td><td>Scale rất lớn</td><td>Latency cao hơn in-memory</td><td>Milvus</td></tr>
<tr><td><b>Brute-force</b></td><td>So với tất cả</td><td>Chính xác 100%, không cần index</td><td>O(N)</td><td>Tập nhỏ</td></tr>
</table></div>
<div class="verdict"><b>Cách chọn:</b> bắt đầu bằng HNSW nếu RAM đủ. Chuyển IVF khi RAM là nút thắt, DiskANN khi dữ liệu vượt RAM. Quyết định dựa trên mức recall và độ trễ bạn chấp nhận được, đo trên dữ liệu thật. Tham số HNSW (<code>m</code>, <code>ef_construction</code>, <code>ef_search</code>) nằm ở §3.2 của tài liệu.</div>`,
  why: {
    c: 'HNSW giống bản đồ giao thông. Tầng trên chỉ có vài nút nối xa (như quốc lộ) để nhảy nhanh tới đúng vùng. Tầng dưới có mọi điểm nối với láng giềng gần (như đường làng) để tìm chính xác. Mỗi bước chỉ so với vài láng giềng của nút hiện tại, nên số phép tính tăng rất chậm khi kho lớn (cỡ log N thay vì N). Recall cao và nhanh trong nhiều thực tế, nên là mặc định của Qdrant, pgvector, Weaviate.',
    s: 'Brute-force: chính xác tuyệt đối, nhưng 1 triệu vector là 1 triệu phép tính mỗi câu hỏi. Vẫn dùng được cho vài nghìn tài liệu. IVF: chia kho thành cụm, chỉ tìm trong cụm gần nhất, tiết kiệm RAM hơn nhưng cần bước phân cụm trước. DiskANN: đồ thị nằm trên SSD cho kho vượt RAM, đổi lại chậm hơn.',
    p: 'Kết quả là gần đúng: đôi khi bỏ lỡ láng giềng thật, bạn có thể thấy điều đó trong hình. Đồ thị nằm trong RAM nên tốn bộ nhớ thêm ngoài vector. Dựng index mất thời gian, thêm tài liệu mới thì phải cập nhật đồ thị. Chỉnh tham số (m, ef_search) là đổi giữa recall và tốc độ, nên đo trên dữ liệu của bạn.'
  },
  mount(stage) {
    const W = 600, H = 360, rnd = seeded(7), N = 150;
    const centers = [[0.22, 0.3], [0.7, 0.28], [0.5, 0.75]];
    const pts = Array.from({ length: N }, (_, i) => {
      const c = centers[i % 3];
      return [Math.min(0.98, Math.max(0.02, c[0] + (rnd() - 0.5) * 0.4)), Math.min(0.98, Math.max(0.02, c[1] + (rnd() - 0.5) * 0.4))];
    });
    const dist = (a, b) => Math.hypot(pts[a][0] - b[0], pts[a][1] - b[1]);
    const layers = [pts.map((_, i) => i), pts.map((_, i) => i).filter((i) => i % 5 === 0), pts.map((_, i) => i).filter((i) => i % 25 === 0)];
    const adj = layers.map((ids) => {
      const m = new Map(ids.map((i) => [i, new Set()]));
      ids.forEach((i) => ids.filter((j) => j !== i).sort((a, b) => dist(a, pts[i]) - dist(b, pts[i])).slice(0, 4).forEach((j) => { m.get(i).add(j); m.get(j).add(i); }));
      return m;
    });
    let q = [0.62, 0.55], timers = [];
    const X = (v) => v[0] * (W - 20) + 10, Y = (v) => v[1] * (H - 20) + 10;
    const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H}`, style: 'cursor:crosshair' });
    const edges = el('g'), dots = el('g'), fx = el('g'), qm = el('g');
    svg.append(edges, dots, fx, qm);
    pts.forEach((p, i) => dots.append(el('circle', { cx: X(p), cy: Y(p), r: layers[2].includes(i) ? 6 : layers[1].includes(i) ? 4.5 : 3, style: `fill: ${layers[2].includes(i) ? 'var(--g4)' : layers[1].includes(i) ? 'var(--g1)' : 'var(--dim)'}` })));
    const out = el('div', { class: 'stat' });
    const drawQ = () => { qm.replaceChildren(el('circle', { cx: X(q), cy: Y(q), r: 8, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }), el('text', { x: X(q) + 12, y: Y(q) - 8, text: 'query' })); };
    const showEdges = (L) => {
      edges.replaceChildren();
      const seen = new Set();
      adj[L].forEach((set, i) => set.forEach((j) => { const k = i < j ? i + '-' + j : j + '-' + i; if (seen.has(k)) return; seen.add(k); edges.append(el('line', { x1: X(pts[i]), y1: Y(pts[i]), x2: X(pts[j]), y2: Y(pts[j]), stroke: 'var(--line)', 'stroke-width': 1.2 })); }));
    };
    const trueNN = () => layers[0].reduce((b, i) => (dist(i, q) < dist(b, q) ? i : b), 0);
    const reset = () => { timers.forEach(clearTimeout); timers = []; fx.replaceChildren(); showEdges(2); drawQ(); out.innerHTML = '<span>Chọn một cách chạy.</span>'; };
    const at = (ms, fn) => timers.push(setTimeout(fn, ms));
    const mark = (i, c, r = 9) => fx.append(el('circle', { cx: X(pts[i]), cy: Y(pts[i]), r, fill: 'none', stroke: c, 'stroke-width': 2.5 }));
    const finish = (found, count, name) => {
      const t = trueNN(), good = found === t;
      mark(t, 'var(--ok)', 12); mark(found, 'var(--warn)', 7);
      out.innerHTML = `<span>${name}: <b>${count}</b> / ${N} phép tính khoảng cách${count < N ? ` (ít hơn ${(N / count).toFixed(1)} lần)` : ''}</span><span>Tìm đúng láng giềng thật: <b class="${good ? 'ok' : 'bad'}">${good ? 'đúng' : 'trượt (xấp xỉ)'}</b></span>`;
    };
    function brute() {
      reset(); showEdges(0);
      let best = 0;
      for (let i = 0; i < N; i++) at(i * 14, () => { fx.replaceChildren(); mark(i, 'var(--warn)', 6); if (dist(i, q) < dist(best, q)) best = i; out.innerHTML = `<span>Brute-force: đã so <b>${i + 1}</b> / ${N}</span>`; });
      at(N * 14 + 100, () => { fx.replaceChildren(); finish(best, N, 'Brute-force'); });
    }
    function hnsw() {
      reset();
      const seen = new Set(); let cur = layers[2][0]; const steps = [];
      for (let L = 2; L >= 0; L--) {
        for (;;) {
          const nbs = [...adj[L].get(cur)]; nbs.forEach((n) => seen.add(n)); seen.add(cur);
          const best = nbs.reduce((b, n) => (dist(n, q) < dist(b, q) ? n : b), cur);
          steps.push({ L, cur, nbs, best, count: seen.size });
          if (best === cur) break;
          cur = best;
        }
      }
      steps.forEach((s, k) => at(k * 750, () => {
        showEdges(s.L); fx.replaceChildren(); mark(s.cur, 'var(--accent)', 11);
        s.nbs.forEach((n) => mark(n, 'var(--warn)', 6));
        out.innerHTML = `<span>HNSW tầng <b>${s.L}</b></span><span>Đã tính: <b>${s.count}</b> khoảng cách</span>`;
      }));
      at(steps.length * 750, () => { fx.replaceChildren(); finish(cur, seen.size, 'HNSW'); });
    }
    svg.addEventListener('pointerdown', (e) => {
      const r = svg.getBoundingClientRect(), k = W / r.width;
      q = [((e.clientX - r.left) * k - 10) / (W - 20), ((e.clientY - r.top) * k - 10) / (H - 20)].map((v) => Math.min(1, Math.max(0, v)));
      reset();
    });
    stage.append(el('div', { class: 'row' }, [el('button', { text: 'Brute-force', onclick: brute }), el('button', { class: 'primary', text: 'HNSW', onclick: hnsw })]), svg, out,
      el('div', { class: 'legend', html: '<span><i style="background:var(--g4)"></i>tầng 2 (thưa)</span><span><i style="background:var(--g1)"></i>tầng 1</span><span><i style="background:var(--dim)"></i>tầng 0 (mọi điểm)</span><span><i style="background:var(--ok)"></i>láng giềng thật</span>' }),
      el('p', { class: 'hint', text: 'Đồ thị rút gọn để dễ nhìn: 150 điểm, mỗi nút nối 4 láng giềng gần nhất trong tầng. Bản thật dùng tham số m, ef_construction, ef_search.' }));
    reset();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage,
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
