const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  id: 'similarity', nav: '2. Cosine, dot, L2', ref: '§1.3',
  title: 'Cùng hai vector, ba thước đo cho ba thứ hạng khác nhau',
  hook: 'Kéo đầu mũi tên A, B, C. Thử kéo B dài ra mà giữ nguyên hướng và xem cột nào đổi.',

  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Khách hỏi <i>"bảo hành tai nghe bao lâu"</i>. Có hai đoạn cùng nói về bảo hành tai nghe: FAQ một dòng <i>"Tai nghe bảo hành 12 tháng"</i> và trang chính sách dài 3000 từ. Cùng chủ đề thì không nên đoạn nào bị xếp thấp chỉ vì ngắn hơn hay dài hơn. Ngược lại, ở trang chủ ShopViet gợi ý sản phẩm, sản phẩm bán chạy nên được ưu tiên.',
    scenario: 'Bạn search "cách debug Python". Có hai tài liệu cùng nói đúng chủ đề đó: A là một đoạn ngắn, B là bài hướng dẫn dài. Vector của B có độ dài lớn hơn vì chứa nhiều thông tin hơn.',
    ask: 'Hai tài liệu cùng chủ đề thì có nên xếp ngang nhau không? Câu trả lời đổi theo thước đo bạn chọn.',
    solves: 'Chọn thước đo theo việc độ dài vector có mang ý nghĩa hay không. Search muốn bỏ qua độ dài (cosine). Recommendation muốn giữ lại vì nó là tín hiệu phổ biến (dot). K-means cần khoảng cách thật (L2).',
    read: ['Mũi tên đen là query. A, B, C là ba tài liệu. <b>Hướng</b> mũi tên là chủ đề, <b>độ dài</b> là norm của vector.', 'Mặc định A và B cùng hướng, B dài gấp 2.5 lần. C lệch chủ đề.', 'Kéo đầu mũi tên B dài hoặc ngắn mà giữ nguyên hướng: cosine không đổi, dot và L2 đổi.', 'Ba cột bên dưới là thứ hạng theo từng thước đo. Đọc cột nào khớp với bài toán của bạn.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<p>Cosine trả lời "nói về cái gì?", dot product thêm "tự tin bao nhiêu?", L2 cho biết "xa nhau bao nhiêu?", Jaccard cho biết "có bao nhiêu từ trùng?".</p>
<div class="tbl"><table>
<tr><th>Metric</th><th>Đặc điểm cốt lõi</th><th>Hệ quả</th><th>Phù hợp cho</th></tr>
<tr class="cur"><td><b>Cosine</b></td><td>Chỉ đo hướng, triệt tiêu magnitude</td><td>Không bias bởi độ dài tài liệu hay norm embedding</td><td>Semantic search, RAG, STS, dedup: mọi thứ cần "pure meaning similarity"</td></tr>
<tr><td><b>Dot Product</b></td><td>Hướng × magnitude</td><td>Magnitude mã hoá popularity / confidence</td><td>Recommendation: muốn kết hợp relevance + popularity</td></tr>
<tr><td><b>L2</b></td><td>Khoảng cách tuyệt đối. Mean là điểm giảm tổng L2² nhiều nhất</td><td>Centroid có ý nghĩa toán học</td><td>K-means (bắt buộc), kNN, anomaly detection</td></tr>
<tr><td><b>L1</b></td><td>Cộng |chênh lệch| từng chiều, không bình phương</td><td>Không khuếch đại outlier dimensions</td><td>Dữ liệu thưa hoặc nhiễu. Hiếm dùng với embedding hiện đại</td></tr>
<tr><td><b>Jaccard</b></td><td>Overlap giữa 2 tập hợp</td><td>Chỉ biết trùng từ, không hiểu nghĩa</td><td>Keyword search, BM25, MinHash dedup. Không dùng cho dense vector</td></tr>
</table></div>
<h4>Vì sao cosine là mặc định cho semantic search (giữ nguyên từ tài liệu)</h4>
<blockquote>
<p>Trong thực tế, khi user search "cách debug Python", họ muốn tìm documents <b>nói về cùng chủ đề</b> — bất kể document dài 1 đoạn hay 10 trang. Cosine đáp ứng chính xác nhu cầu này:</p>
<ul><li>Một đoạn ngắn: <i>"Debug Python bằng pdb"</i> (embedding norm nhỏ vì ít thông tin)</li>
<li>Một bài dài: <i>"Hướng dẫn toàn diện debug Python: pdb, breakpoints, logging, IDE debugger..."</i> (embedding norm lớn vì nhiều thông tin)</li></ul>
<p>Cả hai đều <b>trỏ cùng hướng</b> "debug Python" trong embedding space → cosine similarity cao cho cả hai. Nếu dùng dot product hoặc L2, document dài sẽ bị ưu tiên/bất lợi chỉ vì nó dài hơn — không phải vì nó relevant hơn.</p>
<p>Vì lý do này:</p>
<ul><li>Cosine là <b>metric mặc định</b> cho semantic search, RAG retrieval, semantic text similarity (STS), deduplication</li>
<li>Hầu hết embedding models (OpenAI, Cohere, Google, Jina...) được <b>train để tối ưu cosine</b> giữa query-document pairs</li>
<li>Tất cả major vector databases (Pinecone, Weaviate, Qdrant, pgvector) đều <b>default hoặc recommend cosine</b></li>
<li>Khi bạn <b>không chắc dùng metric nào</b> → cosine luôn là lựa chọn an toàn nhất</li></ul>
</blockquote>
<h4>Vì sao recommendation dùng dot product</h4>
<p>Item phổ biến xuất hiện hàng triệu lần trong training nên embedding hội tụ mạnh, norm lớn. Item niche ít xuất hiện nên norm nhỏ. Norm vì thế mã hoá "model tự tin bao nhiêu". Ví dụ trong tài liệu: Endgame (norm 8.5) và Blade Runner 2049 (norm 3.2) cùng hợp sở thích, dot product cho Endgame cao hơn cỡ 2.6 lần nhờ tín hiệu popularity. Giữa hai phim cùng relevant, chọn phim nhiều người thích là lựa chọn an toàn hơn. Cosine sẽ cho hai phim điểm gần bằng nhau và mất tín hiệu này.</p>
<h4>Khi vector đã chuẩn hoá về độ dài 1</h4>
<p><b>Cosine ≡ dot product ≡ L2 ranking.</b> Chọn metric nào cũng cho cùng thứ hạng, chỉ khác thang điểm. OpenAI, Cohere trả vector đã normalize, nên dùng dot product cho nhanh vì bỏ được bước chia norm. Đây cũng là cách làm "K-means theo cosine": normalize rồi chạy K-means bình thường.</p>
<h4>Sai lầm thường gặp</h4>
<div class="tbl"><table>
<tr><th>Sai lầm</th><th>Vì sao sai</th><th>Cách sửa</th></tr>
<tr><td>L2 cho semantic search</td><td>Nhạy magnitude, tài liệu dài bị xếp thấp dù relevant</td><td>Dùng cosine</td></tr>
<tr><td>Cosine cho recommendation</td><td>Mất tín hiệu popularity, item niche ngang item phổ biến</td><td>Dùng dot product</td></tr>
<tr><td>K-means với cosine distance</td><td>Bước gán cluster và bước cập nhật centroid không nhất quán</td><td>Normalize trước, rồi K-means</td></tr>
<tr><td>Jaccard cho dense embedding</td><td>Cần set/binary, float vector cho kết quả vô nghĩa</td><td>Dùng cosine</td></tr>
<tr><td>Dot product cho search mà không normalize</td><td>Tài liệu norm lớn luôn xếp trên bất kể relevance</td><td>Normalize khi index, hoặc dùng cosine</td></tr>
</table></div>
<div class="verdict"><b>Có thể bỏ qua khi mới học:</b> L1 (ít dùng với embedding), công thức chứng minh L2² = 2(1 − cos). Chỉ cần nhớ kết luận ở mục chuẩn hoá.</div>`,
  why: {
    c: 'Chọn thước đo theo câu hỏi: độ dài vector có mang ý nghĩa không? Search: không. FAQ ngắn và trang dài cùng chủ đề phải ngang nhau, nên dùng cosine (chỉ xét hướng). Recommendation: có. Vector của sản phẩm bán chạy dài hơn vì model thấy nó nhiều lần, nên dùng dot product để ưu tiên nó. K-means: dùng L2 vì trung bình cộng của một nhóm chính là điểm có tổng L2² nhỏ nhất.',
    s: 'Dot product cho search: trang dài được ưu tiên chỉ vì vector dài, không vì đúng ý. L2 cho search: trang dài bị phạt vì cùng lý do. Cosine cho recommendation: sản phẩm ngách và sản phẩm bán chạy ngang điểm, mất tín hiệu quan trọng.',
    p: 'Cosine bỏ hẳn thông tin độ dài. Nếu vector đã chuẩn hoá về độ dài 1 (nhiều API embedding làm sẵn) thì cả ba thước đo cho cùng thứ hạng, và khi đó chọn dot cho nhanh nhất vì bỏ được bước chia. Việc cần làm là đọc docs của model xem vector đã chuẩn hoá chưa.'
  },
  deep: [
    {
      q: 'Khoan đã, "độ dài" của một embedding là gì? Một câu văn thì làm gì có độ dài theo kiểu hình học?',
      a: `<p>Embedding là một dãy số, ví dụ 384 hoặc 1536 số. Coi dãy đó là toạ độ của đầu một mũi tên xuất phát từ gốc toạ độ. <b>Độ dài</b> (norm) là độ dài mũi tên đó: căn bậc hai của tổng bình phương mọi phần tử, √(x₁² + x₂² + ... + x_d²). Giống định lý Pytago, chỉ là có nhiều chiều hơn.</p>
<p>Điều quan trọng: với model text, <b>không ai thiết kế để độ dài mang một nghĩa cụ thể</b>. Nó là sản phẩm phụ của lớp cuối và bước pooling (gộp vector của từng token thành một vector cho cả câu). Độ dài có thể dao động theo độ dài văn bản, theo việc từ hiếm hay phổ biến, tuỳ model. Ví dụ "bài dài thì norm lớn" trong README là một hình ảnh minh hoạ, không phải quy luật của mọi model.</p>
<p>Trên thực tế nhiều khi câu hỏi này tự biến mất. POC 01 chạy <code>paraphrase-multilingual-MiniLM-L12-v2</code> với <code>normalize_embeddings=True</code> và in ra độ dài vector bằng <b>1.00</b> (số đo thật). README ghi OpenAI và Cohere cũng trả vector đã chuẩn hoá về độ dài 1. Khi mọi vector dài bằng nhau, chỉ còn hướng là khác nhau.</p>`,
      take: 'Độ dài là sản phẩm phụ, không phải nghĩa được thiết kế. Trừ khi model được huấn luyện để độ dài mang tín hiệu (như recommendation), hãy coi nó là nhiễu.'
    },
    {
      q: 'Vậy sao lại so bằng góc (cosine) mà không dùng khoảng cách thường, như đo trên bản đồ?',
      a: `<p>Vì nghĩa nằm ở <b>hướng</b>. Lab 07 cho thấy từng chiều riêng lẻ không có nghĩa, chỉ có tổ hợp của tất cả các chiều, tức hướng của mũi tên, mới mang nghĩa. Model embedding được huấn luyện để câu hỏi và đoạn trả lời đúng <b>chỉ cùng một hướng</b>. README ghi hầu hết model (OpenAI, Cohere, Google, Jina) được train để tối ưu cosine.</p>
<p>Khoảng cách thường (L2) trộn hai thứ vào một con số: khác hướng bao nhiêu <b>và</b> khác độ dài bao nhiêu. Hãy nghĩ tới hai biển chỉ đường cùng chỉ về Hà Nội, một biển to, một biển nhỏ. Hỏi "đi hướng nào?" thì hai biển như nhau. Đo khoảng cách giữa hai đầu mũi tên thì lại thấy chúng khác nhau, chỉ vì kích thước biển.</p>
<p>Cosine = dot / (‖a‖ × ‖b‖). Bước chia cho hai độ dài chính là bước "bỏ yếu tố không liên quan", giống so sánh chuỗi không phân biệt hoa thường: hạ hết về chữ thường rồi mới so, vì hoa hay thường không đổi nghĩa của từ.</p>`,
      take: 'Cosine là dot product sau khi đã chia hết độ dài ra, chỉ còn lại hướng. Đó đúng là phần model được huấn luyện để mang nghĩa.'
    },
    {
      q: 'Nếu vector nào cũng dài 1 rồi thì cosine, dot và L2 còn khác nhau không?',
      a: `<p>Chỉ khác thang điểm, không khác thứ tự. Khai triển bình phương khoảng cách:</p>
<p class="mono">‖a − b‖² = (a − b)·(a − b) = a·a − 2 a·b + b·b = ‖a‖² + ‖b‖² − 2 a·b</p>
<p>Khi ‖a‖ = ‖b‖ = 1 thì a·b chính là cos, và công thức trở thành:</p>
<p class="mono"><b>‖a − b‖² = 2 − 2 cos</b></p>
<p>Đây là một hàm giảm đều: cos càng lớn thì L2 càng nhỏ. Không có cách nào để đoạn X có cos cao hơn đoạn Y mà lại có L2 lớn hơn. Ví dụ cos = 0.6 tương ứng L2 = √0.8 ≈ 0.894, cos = 0.4 tương ứng L2 ≈ 1.095. Còn dot thì bằng đúng cos. Ba thước đo, một thứ hạng.</p>
<p>Hình dưới sinh 160 cặp vector ngẫu nhiên 64 chiều và tính L2 thật cho từng cặp. Khi đã chuẩn hoá, mọi điểm rơi đúng lên đường cong √(2 − 2cos). Bấm nút để nhân mỗi vector với một độ dài ngẫu nhiên: các điểm văng ra khỏi đường cong, và một cos không còn ứng với một L2 duy nhất.</p>`,
      viz(box) {
        const W = 560, H = 220, P = 30, d = 64, rnd = seeded(3);
        const pairs = Array.from({ length: 160 }, () => {
          const a = unitVec(d, rnd), r = unitVec(d, rnd), t = rnd(), b0 = a.map((x, k) => t * x + (1 - t) * r[k]), nb = Math.sqrt(dotp(b0, b0));
          return [a, b0.map((x) => x / nb), 0.4 + 2.2 * rnd(), 0.4 + 2.2 * rnd()];
        });
        const X = (c) => P + ((c + 0.2) / 1.2) * (W - 2 * P), Y = (v) => H - (v / 4.5) * (H - 10);
        const curve = Array.from({ length: 61 }, (_, i) => { const c = -0.2 + i * 0.02; return (i ? 'L' : 'M') + X(c).toFixed(1) + ' ' + Y(Math.sqrt(2 - 2 * c)).toFixed(1); }).join(' ');
        const svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 22}`, role: 'img', 'aria-label': 'L2 theo cosine cho 160 cặp vector' }), stat = el('div', { class: 'stat' });
        let norm = true;
        function draw() {
          let worst = 0;
          const pts = pairs.map(([a, b, sa, sb]) => {
            const A = norm ? a : a.map((x) => x * sa), B = norm ? b : b.map((x) => x * sb);
            const cos = dotp(A, B) / Math.sqrt(dotp(A, A) * dotp(B, B)), l2sq = A.reduce((s, x, k) => s + (x - B[k]) ** 2, 0);
            if (norm) worst = Math.max(worst, Math.abs(l2sq - (2 - 2 * cos)));
            return el('circle', { cx: X(cos), cy: Y(Math.sqrt(l2sq)), r: 3, fill: norm ? 'var(--accent)' : 'var(--warn)', 'fill-opacity': 0.75 });
          });
          svg.replaceChildren(el('line', { x1: P, x2: W - P, y1: H, y2: H, stroke: 'var(--line)' }), el('line', { x1: P, x2: P, y1: 6, y2: H, stroke: 'var(--line)' }),
            el('path', { d: curve, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }), ...pts,
            ...[-0.2, 0, 0.5, 1].map((c) => el('text', { x: X(c) - 8, y: H + 16, class: 'mute', text: String(c) })),
            el('text', { x: W - P - 60, y: H - 6, class: 'mute', text: 'cosine →' }), el('text', { x: P + 6, y: 18, class: 'mute', text: 'L2 ↑' }));
          stat.innerHTML = norm ? `<span>Sai lệch lớn nhất giữa L2² và 2 − 2cos: <b>${worst.toExponential(1)}</b> (chỉ là sai số làm tròn)</span>` : '<span>Cùng một cosine giờ ứng với nhiều L2 khác nhau, nên thứ hạng theo L2 không còn trùng thứ hạng theo cosine.</span>';
        }
        const btn = el('button', { text: 'Bỏ chuẩn hoá (nhân độ dài ngẫu nhiên)', onclick: () => { norm = !norm; btn.textContent = norm ? 'Bỏ chuẩn hoá (nhân độ dài ngẫu nhiên)' : 'Chuẩn hoá lại về độ dài 1'; draw(); } });
        box.append(el('div', { class: 'row' }, [btn]), svg, stat, el('div', { class: 'cap', text: 'Mỗi chấm là một cặp vector ngẫu nhiên do trình duyệt sinh ra, L2 và cosine được tính thật. Đường đứt nét là √(2 − 2cos).' }));
        draw();
      },
      take: 'Với vector độ dài 1: ‖a − b‖² = 2 − 2cos. L2 chỉ là cosine viết theo thang khác, nên thứ hạng giống hệt.'
    },
    {
      q: 'Trên giấy thì cùng thứ hạng. Còn chạy thật thì giống y hệt, hay chỉ gần giống?',
      a: `<p>Giống y hệt, chỉ trừ trường hợp hai đoạn có điểm sát nhau đến mức sai số làm tròn của số thực (float32 chính xác khoảng 7 chữ số) đủ để đảo chỗ. Trường hợp đó hiếm và vô hại, vì hai đoạn gần như bằng điểm.</p>
<p>POC 02 kiểm tra trên 24 đoạn ShopViet với câu "Gói Pro hoàn tiền thế nào?". Khi vector đã chuẩn hoá, cả ba thước đo cho cùng top 3: <code>pro-1, pro-2, pro-3</code> (số đo thật). Sau đó script <b>cố ý</b> nhân vector của từng đoạn với một hệ số từ 0.5 đến 3.0 để giả lập model trả vector dài ngắn khác nhau. Lúc đó chỉ cosine giữ nguyên top 3. Dot và L2 cho ra hai danh sách khác hẳn.</p>
<p>Bạn có thể lặp lại thí nghiệm bên dưới. Trình duyệt sinh 24 vector 384 chiều có độ liên quan khác nhau với một query, rồi nhân độ dài theo đúng cách POC làm.</p>`,

      tags[k] = el('text', { 'text-anchor': 'middle', style: 'fill:#fff;pointer-events:none;font-weight:700', text: k });

    function refresh() {

        const [x, y] = docs[k], p = toPx(x, y), n = Math.hypot(x, y);

        m[k] = { cos: dot / (3 * n), dot, l2: Math.hypot(q[0] - x, q[1] - y) };
      }
      const show = (key, asc, f) => cols[key].list.update(Object.keys(m).sort((a, b) => (asc ? m[a][key] - m[b][key] : m[b][key] - m[a][key])).map((k) => ({ id: k, html: `<b style="color:${color[k]}">${k}</b><span class="mono">${f(m[k][key])}</span>` })));
      show('cos', false, (v) => v.toFixed(3)); show('dot', false, (v) => v.toFixed(2)); show('l2', true, (v) => v.toFixed(2));
    }
    let drag = null;
    const toUnits = (e) => {
      const r = svg.getBoundingClientRect(), k = W / r.width;
      return [((e.clientX - r.left) * k - OX) / S, (OY - (e.clientY - r.top) * k) / S];
    };
    svg.addEventListener('pointerdown', (e) => { const k = e.target.getAttribute && e.target.getAttribute('data-k'); if (k) { drag = k; svg.setPointerCapture(e.pointerId); } });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const [x, y] = toUnits(e);
      docs[drag] = [Math.min(7, Math.max(0.3, x)), Math.min(4.4, Math.max(0.3, y))];

    svg.addEventListener('pointerup', () => { drag = null; });
    const reset = el('button', { text: 'Đặt lại', onclick: () => { for (const k in init) docs[k] = init[k].slice(); refresh(); } });
    stage.append(el('div', { class: 'row' }, [reset, el('span', { class: 'hint', text: 'A ngắn và B dài cùng hướng 30°. C lệch hướng.' })]), svg, el('div', { style: 'height:12px' }), grid);
    refresh();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {

      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),

  });
})();
