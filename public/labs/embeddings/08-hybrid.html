const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson({
  id: 'hybrid', nav: '8. Hybrid + RRF', ref: '§1.4.4, §3.5',
  title: 'Keyword giỏi mã số, embedding giỏi diễn đạt: gộp theo thứ hạng',
  hook: 'Chọn một loại query, rồi kéo k. Xem tài liệu đúng (viền xanh) đi từ hai bảng riêng lên bảng gộp thế nào.',
  terms: [['BM25 / sparse', 'Tìm theo từ khoá: đoạn nào chứa nhiều từ của câu hỏi, đặc biệt từ hiếm, thì điểm cao. Giống full-text search của Elasticsearch hay Postgres. Gọi là sparse vì vector của nó toàn số 0, chỉ vài vị trí có giá trị.'], ['Dense', 'Tìm theo embedding. Gọi là dense vì vector đầy đủ số ở mọi vị trí.'], ['Exact match', 'Khớp chính xác từng ký tự. Cần cho mã đơn, mã lỗi, tên riêng. Embedding thường không giữ được.'], ['Hạng (rank)', 'Vị trí trong danh sách xếp hạng: 1, 2, 3... Điểm của BM25 và cosine khác thang đo nên không cộng trực tiếp được, còn hạng thì so sánh được.'], ['RRF', 'Reciprocal Rank Fusion. Điểm của một tài liệu = tổng của 1/(k + hạng) ở từng nhánh. Hạng cao thì được điểm lớn. k = 60 là giá trị mặc định thường dùng.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Khách dán mã đơn <i>"PO-2024-001234"</i> vào chat, hoặc gõ <i>"cách làm máy tính chạy nhanh hơn"</i>. Mã đơn cần khớp từng ký tự, câu tự nhiên cần hiểu nghĩa. Một nhánh tìm kiếm không làm tốt cả hai.',
    scenario: 'Người dùng lúc thì gõ mã đơn "PO-2024-001234", lúc thì gõ câu tự nhiên "cách làm máy tính chạy nhanh hơn". Từ khoá (BM25) giỏi mã nhưng không hiểu diễn đạt. Embedding giỏi diễn đạt nhưng hay trượt mã chính xác.',
    ask: 'Nên dùng nhánh nào, và nếu dùng cả hai thì gộp hai danh sách kết quả ra sao khi điểm của chúng khác thang đo?',
    solves: 'Chạy cả hai nhánh rồi gộp theo thứ hạng bằng RRF. Chỉ dùng hạng nên không cần chuẩn hoá điểm giữa BM25 và cosine.',
    read: ['Chọn một trong ba loại query ở hàng nút đầu.', 'Cột Sparse và Dense là thứ hạng riêng của từng nhánh. Viền xanh lá là tài liệu đúng.', 'Cột Gộp RRF là kết quả sau khi cộng 1/(k + hạng). Hàng nền xanh là hạng 1.', 'Kéo <b>k</b> để xem tham số này làm thứ hạng thay đổi ra sao. Dòng dưới cùng giải thích điểm của tài liệu đúng.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<div class="tbl"><table>
<tr><th>Kiểu</th><th>Dựa trên</th><th>Mạnh ở</th><th>Yếu ở</th><th>Ví dụ</th></tr>
<tr><td><b>Sparse</b> (BM25, TF-IDF)</td><td>Trùng token</td><td>Exact match: tên riêng, mã lỗi, mã sản phẩm</td><td>Không hiểu synonym, paraphrase</td><td>"PO-2024-001234", "OWASP Top 10"</td></tr>
<tr><td><b>Dense</b> (embedding)</td><td>Vector</td><td>Paraphrase, đa ngôn ngữ, câu hỏi tự nhiên</td><td>Dễ mất tín hiệu exact token</td><td>"feelings of sadness" → "depression symptoms"</td></tr>
<tr class="cur"><td><b>Hybrid</b></td><td>Cả hai + fusion</td><td>Giữ cả exact lẫn semantic</td><td>Phức tạp hơn, cần tune</td><td>Query vừa có mã vừa có diễn đạt tự nhiên</td></tr>
</table></div>
<h4>Reciprocal Rank Fusion</h4>
<p><code>RRF_score(d) = 1/(k + rank_sparse(d)) + 1/(k + rank_dense(d))</code>, với <code>k = 60</code> mặc định. Chỉ dùng <b>thứ hạng</b>, không dùng điểm thô, nên không cần chuẩn hoá điểm giữa hai hệ thống. Tỷ lệ gợi ý 70-80% dense + 20-30% sparse là heuristic, tune theo domain: legal/medical tăng sparse, Q&A thường tăng dense, e-commerce cân bằng.</p>
<h4>Gộp kết quả: các cách so sánh</h4>
<div class="tbl"><table>
<tr><th>Cách</th><th>Ý tưởng</th><th>Khi nào</th></tr>
<tr><td><b>RRF</b></td><td>Cộng 1/(k + hạng)</td><td>Baseline, ít cần hiệu chỉnh</td></tr>
<tr><td>Weighted score fusion</td><td>Cộng điểm có trọng số sau khi normalize cùng thang</td><td>Khi muốn chỉnh trọng số rõ ràng</td></tr>
<tr><td>Learning-to-rank</td><td>Học cách kết hợp BM25, dense, click, độ mới</td><td>Có nhiều tín hiệu và dữ liệu nhãn</td></tr>
<tr><td>Conditional fusion</td><td>Đổi cách gộp theo loại query</td><td>Query pha trộn rõ rệt</td></tr>
</table></div>
<div class="verdict"><b>Khi nào đủ dùng một nhánh:</b> dense-only khi query chủ yếu ngôn ngữ tự nhiên, ít mã định danh. Sparse-only khi dữ liệu có cấu trúc cao, nhiều mã số, tên chuẩn. <b>Đừng thêm hybrid sớm</b> nếu chưa có bằng chứng hai nhánh bổ trợ nhau, vì chỉ làm pipeline phức tạp hơn.<br><b>Có thể bỏ qua khi mới học:</b> SPLADE (learned sparse), query routing. Đọc sau khi đã chạy được hybrid cơ bản.</div>`,
  why: {
    c: 'Hai nhánh sai ở hai chỗ khác nhau nên gộp lại thì bù cho nhau. BM25 (đếm từ trùng) bắt đúng mã đơn, tên riêng, mã lỗi. Embedding bắt đúng các cách diễn đạt khác nhau của cùng một ý. RRF gộp theo thứ hạng thay vì điểm vì điểm BM25 và điểm cosine khác thang đo, cộng thẳng thì nhánh có số lớn áp đảo.',
    s: 'Chỉ dense: trượt mã chính xác như "PO-2024-001234" vì model coi chuỗi số này gần như vô nghĩa. Chỉ sparse: không hiểu "máy tính chạy chậm" và "tối ưu hiệu năng" là cùng ý. Cộng điểm thô có trọng số: phải chuẩn hoá điểm hai bên, và trọng số lệch theo từng loại query.',
    p: 'Phải duy trì và đồng bộ hai chỉ mục, mỗi câu hỏi chạy hai truy vấn, thêm tham số cần tune (k, tỉ lệ hai nhánh). Nếu dữ liệu và câu hỏi của bạn nghiêng hẳn về một kiểu thì hybrid chỉ thêm phức tạp, nên đo trước khi thêm.'
  },
  mount(stage) {
    const Q = {
      code: { q: 'PO-2024-001234', gold: 'a1', docs: { a1: 'Đơn hàng PO-2024-001234 đã giao', a2: 'Hướng dẫn tra cứu đơn hàng', a3: 'Chính sách đổi trả', a4: 'Đơn hàng PO-2023-009911', a5: 'Theo dõi vận chuyển' }, sparse: ['a1', 'a4', 'a5', 'a2', 'a3'], dense: ['a2', 'a5', 'a1', 'a3', 'a4'] },
      para: { q: 'cách làm cho máy tính chạy nhanh hơn', gold: 'b1', docs: { b1: 'Performance optimization guide', b2: 'Tăng tốc máy tính chạy chậm', b3: 'Cách làm bánh nhanh hơn', b4: 'Chọn máy tính mới', b5: 'Dọn rác hệ thống' }, sparse: ['b3', 'b2', 'b4'], dense: ['b1', 'b5', 'b2', 'b4', 'b3'] },
      mix: { q: 'lỗi ERR_504 gateway timeout khi tải trang chậm', gold: 'c1', docs: { c1: 'ERR_504 Gateway Timeout: nguyên nhân và cách sửa', c2: 'Tăng tốc tải trang web', c3: 'Lỗi 502 Bad Gateway', c4: 'Cấu hình timeout cho nginx', c5: 'Sửa lỗi mạng chậm' }, sparse: ['c1', 'c3', 'c4', 'c2', 'c5'], dense: ['c2', 'c5', 'c1', 'c4', 'c3'] }
    };
    const S = { key: 'code', k: 60 };
    const sp = rankList(34), de = rankList(34), fu = rankList(34);
    const note = el('div', { class: 'hint' }), qbox = el('div', { class: 'row' });
    const rows = (d, ids, gold) => ids.map((id, i) => ({ id, cls: id === gold ? 'gold' : '', html: `<i>#${i + 1}</i>${d[id]}` }));
    function render() {
      const c = Q[S.key], score = {};
      Object.keys(c.docs).forEach((id) => { score[id] = 0; });
      [c.sparse, c.dense].forEach((list) => list.forEach((id, i) => { score[id] += 1 / (S.k + i + 1); }));
      const fused = Object.keys(score).sort((a, b) => score[b] - score[a]);
      const max = score[fused[0]];
      sp.update(rows(c.docs, c.sparse, c.gold)); de.update(rows(c.docs, c.dense, c.gold));
      fu.update(fused.map((id, i) => ({ id, cls: (id === c.gold ? 'gold ' : '') + (i === 0 ? 'hit' : ''), html: `<i>#${i + 1}</i>${c.docs[id]}<span class="bar" style="width:${(score[id] / max) * 44}px"></span>` })));
      const rs = c.sparse.indexOf(c.gold), rd = c.dense.indexOf(c.gold), rf = fused.indexOf(c.gold) + 1;
      note.innerHTML = `Tài liệu đúng: hạng sparse <b>${rs < 0 ? 'không có' : rs + 1}</b>, hạng dense <b>${rd < 0 ? 'không có' : rd + 1}</b>, sau RRF <b class="${rf === 1 ? 'ok' : ''}">hạng ${rf}</b>. Điểm = ${[rs, rd].filter((r) => r >= 0).map((r) => `1/${S.k + r + 1}`).join(' + ')}.`;
    }
    const tabs = [['code', 'Mã đơn hàng'], ['para', 'Diễn đạt tự nhiên'], ['mix', 'Pha trộn']];
    const btns = tabs.map(([k, t]) => el('button', { text: t, onclick: () => { S.key = k; btns.forEach((b, i) => b.classList.toggle('on', tabs[i][0] === k)); head(); render(); } }));
    btns[0].classList.add('on');
    const qline = el('code', { class: 'mono' });
    const head = () => { qline.textContent = 'query: ' + Q[S.key].q; };
    const sl = slider('k', 1, 100, 1, S.k, (v) => { S.k = v; render(); });
    qbox.append(...btns, sl.node, qline);
    const col = (t, s, l) => el('div', {}, [el('h4', { html: `${t} <small>· ${s}</small>` }), l.node]);
    stage.append(qbox, el('div', { class: 'cols' }, [col('Sparse', 'BM25, khớp từ khoá', sp), col('Dense', 'embedding, khớp nghĩa', de), col('Gộp RRF', '1/(k + hạng) cộng lại', fu)]), note,
      el('p', { class: 'hint', text: 'Thứ hạng của từng nhánh là dữ liệu giả lập, dựng sẵn để minh hoạ cơ chế. Tài liệu không có trong danh sách một nhánh thì nhánh đó góp 0 điểm.' }));
    head(); render();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage,
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
