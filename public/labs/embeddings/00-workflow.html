const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  chunks: [
    ['doitra-1', 'Đổi trả: hàng lỗi trong 30 ngày, cần hóa đơn gốc', 'doitra', 0.20, 0.30],

    ['doitra-3', 'Phí vận chuyển khi đổi trả', 'doitra', 0.28, 0.20],
    ['baohanh-1', 'Bảo hành tai nghe 12 tháng', 'baohanh', 0.70, 0.25],
    ['baohanh-2', 'Trung tâm bảo hành gần bạn', 'baohanh', 0.80, 0.18],

  }
  const indexFlow = () => { showDetail('chunks'); run([[1, 'chunking', 'chunks', 'cắt tài liệu thành các chunk nhỏ.'], [2, 'g1', 'embed', 'embedding model biến mỗi chunk thành một vector.'], [3, 'g2', 'db', 'lưu vector, đoạn gốc, metadata và dựng index. Kho đã sẵn sàng, bấm "Khách hỏi".']], 'Nạp dữ liệu (làm một lần): tài liệu đi qua chunk, embed, rồi vào vector database.', () => {}, 'var(--d-green)'); };
  const askFlow = () => { S.answered = false; render(); showDetail('db'); run([[4, 'o1', 'embed', 'câu hỏi được embed bằng đúng model đã embed chunk.'], [5, 'o2', 'db', `tìm ANN, ${S.n} chấm xanh dương là ứng viên.`], [6, 'c1', 'rerank', `reranker chấm lại ${S.n} ứng viên, lấy top-${K}.`], [7, 'c2', 'prompt', 'ghép top-3 vào prompt template.'], [8, 'pr', 'llm', 'LLM đọc prompt và sinh câu trả lời.'], [9, 'fin', 'chat', 'câu trả lời hiện trong khung chat.']], 'Khách hỏi (mỗi lần chat): câu hỏi đi một vòng qua hệ thống.', () => { S.answered = true; render(); }, 'var(--d-orange)'); };

  const chips = WF.presets.map((p, i) => el('button', { type: 'button', text: short(p.text, 34), title: p.text, onclick: () => { S.token++; refs.fx.replaceChildren(); S.p = i; S.q = p.pos.slice(); S.custom = false; S.answered = false; chips.forEach((c, j) => c.classList.toggle('on', i === j)); render(); } }));
  chips[0].classList.add('on');
  const nSl = slider('N (số ứng viên ANN)', 3, 28, 1, S.n, (v) => { S.n = v; S.answered = false; render(); });
  stage.append(el('div', { class: 'row' }, [el('b', { text: 'Câu hỏi của khách:' }), ...chips]),
    el('div', { class: 'row' }, [el('button', { class: 'primary', text: 'Nạp dữ liệu (bước 1 đến 3)', onclick: indexFlow }), el('button', { class: 'primary', style: 'background:var(--d-orange);border-color:var(--d-orange)', text: 'Khách hỏi (bước 4 đến 9)', onclick: askFlow }), nSl.node]),
    svg, caption,
    el('div', { class: 'cols', style: 'margin-top:14px' }, [el('div', {}, [el('h4', { html: 'Ứng viên ANN <small>· khoảng cách, nền xanh là top-3 sau rerank</small>' }), candList.node]), el('div', {}, [el('h4', { html: 'Top-3 sau rerank <small>· điểm giả lập</small>' }), topList.node])]),
    verdict, el('div', { style: 'height:14px' }), detail,
    el('p', { class: 'hint', text: 'Sơ đồ rút gọn: 28 chunk thay cho 1 triệu, khoảng cách 2 chiều thay cho 1536 chiều. Điểm rerank và các câu hỏi mẫu là dữ liệu giả lập để thấy luồng.' }));
  showDetail('embed'); render();
}
lesson({
  id: 'workflow', nav: '0. Workflow tổng hợp', ref: '§1.4.5, §2.2, §3',
  title: 'Một câu hỏi của khách đi qua cả hệ thống tìm kiếm',
  hook: 'Bấm các khối để xem chi tiết, chạy hai luồng (xanh lá và cam), kéo chấm cam trong vector database.',
  terms: [['RAG', 'Retrieval-Augmented Generation. Tra cứu tài liệu liên quan trước, rồi mới nhờ LLM trả lời dựa trên những tài liệu đó. Giống backend gọi DB lấy dữ liệu trước khi render trang.'], ['LLM', 'Large Language Model, ví dụ GPT hay Claude. Nhận một đoạn văn (prompt) và sinh ra đoạn văn trả lời. Tính tiền theo số token đưa vào và sinh ra.'], ['Embedding', 'Biến một đoạn văn thành một mảng số (vector) sao cho đoạn có nghĩa gần nhau thì mảng số cũng gần nhau.'], ['Index', 'Cấu trúc dữ liệu dựng sẵn để tìm nhanh, giống index trong database. Ở đây có index cho vector (HNSW) và index cho từ khoá (BM25).'], ['Retrieve / Rerank', 'Retrieve: lọc thô nhanh từ cả kho ra vài chục ứng viên. Rerank: chấm lại kỹ vài chục ứng viên đó để chọn ra vài đoạn tốt nhất.'], ['Top-K', 'K kết quả xếp hạng cao nhất. Top-3 là 3 kết quả đứng đầu.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online. Khách chat: <i>"Tai nghe Pro X mua tuần trước bị rè, đổi trả được không và cần mang gì?"</i>. Trợ lý phải trả lời đúng theo chính sách hiện hành, kèm nguồn, trong dưới 1 giây, dựa trên khoảng 1 triệu đoạn tài liệu.',
    scenario: 'Mỗi lab trước giải một khâu riêng. Ngoài thực tế, các khâu nối với nhau thành một dây chuyền: một quyết định ở khâu trước (cách cắt chunk, số chiều, thước đo) ảnh hưởng chất lượng và chi phí ở khâu sau.',
    ask: 'Cần những khâu nào, theo thứ tự nào, và mỗi khâu chọn giải pháp gì để trợ lý trả lời đúng, nhanh và rẻ?',
    solves: 'Chuẩn bị dữ liệu một lần (chunk, embed, index). Mỗi câu hỏi: tìm rộng bằng hybrid, chấm lại bằng reranker, rồi mới đưa cho LLM.',
    read: ['Đường <b>xanh lá</b> là nạp dữ liệu (bước 1 đến 3, làm một lần). Đường <b>cam</b> là câu hỏi của khách (bước 4 đến 9, mỗi lần chat).', 'Bấm <b>Nạp dữ liệu</b> hoặc <b>Khách hỏi</b>: chấm tròn chạy dọc mũi tên, từng khối sáng lên kèm lời giải thích bên dưới sơ đồ.', 'Bấm bất kỳ khối nào (Chunk, Embedding model, Vector database, Reranker...) để xem vào, làm gì, ra, vì sao chọn và link sang lab chi tiết.', 'Trong ô vector database, <b>kéo chấm cam</b> (câu hỏi) hoặc chọn câu hỏi mẫu. Kéo thanh <b>N</b> xuống thấp để thấy đoạn đúng bị loại khỏi ứng viên.']
  },
  summary: `<h3>Tóm tắt workflow</h3>
<div class="tbl"><table>
<tr><th>Khâu</th><th>Chọn gì</th><th>Lý do</th><th>Lab</th></tr>
<tr><td>Chunk</td><td>Theo section, overlap 20%</td><td>Đáp án không bị cắt đôi</td><td><a href="06-chunking.html">06</a></td></tr>
<tr><td>Embed</td><td>1536 chiều (hoặc cắt MRL), chuẩn hoá</td><td>Cân bằng RAM và chất lượng, cosine ≡ dot</td><td><a href="07-dimensions.html">07</a>, <a href="02-similarity.html">02</a></td></tr>
<tr><td>Index</td><td>HNSW cho vector, BM25 cho từ khoá</td><td>Tìm gần đúng trong mili giây</td><td><a href="05-ann.html">05</a></td></tr>
<tr><td>Retrieve</td><td>Dense + sparse, gộp RRF, lấy rộng</td><td>Khớp cả nghĩa lẫn mã chính xác, ưu tiên recall</td><td><a href="08-hybrid.html">08</a></td></tr>

</table></div>
<div class="verdict">Số liệu trong lab này (số chunk, thứ hạng, điểm rerank) là dữ liệu giả định của ví dụ ShopViet để thấy luồng, không phải kết quả đo.</div>`,
  why: {
    c: 'Đưa việc nặng ra khỏi đường nóng. Chunk, embed, index chỉ làm một lần khi nạp dữ liệu, giống build index trong DB. Mỗi request của khách chỉ làm 3 việc nhẹ và có giới hạn: encode 1 câu, tìm gần đúng trong index, chấm lại vài chục đoạn. Nhờ vậy độ trễ gần như không tăng theo kích thước kho.',
    s: 'Bỏ rerank: nhanh hơn nhưng đoạn hơi lệch có thể chen vào top-3. Chỉ dùng một nhánh tìm kiếm: mất mã đơn hoặc mất câu diễn đạt tự nhiên. Đưa cả kho cho LLM: vượt giới hạn context, tốn tiền, và LLM bị nhiễu.',
    p: 'Nhiều khâu nghĩa là nhiều chỗ có thể sai mà không báo lỗi: hệ thống vẫn trả lời, chỉ trả lời sai. Cần bộ câu hỏi test để đo từng khâu. Đổi embedding model về sau nghĩa là embed lại cả kho, giống migrate toàn bộ index.'
  },
  deep: [
    {
      q: 'Sao phải tìm kiếm rồi mới hỏi? Gửi luôn cả kho tài liệu cho LLM, để nó tự đọc, không được à?',
      a: `<p>LLM chỉ biết những gì có trong dữ liệu huấn luyện. Nó không biết chính sách đổi trả của ShopViet, nên muốn nó trả lời đúng thì phải <b>đưa tài liệu vào prompt</b>. Câu hỏi chỉ là đưa bao nhiêu.</p>
<p>LLM đọc và tính tiền theo <b>token</b> (mẩu chữ, thường ngắn hơn một từ). Mỗi model có giới hạn số token đọc được trong một lần, gọi là context window. README lấy ví dụ 128K token, cỡ 100 trang. Có ba lý do không gửi cả kho:</p>
<ol><li><b>Không vừa.</b> 1 triệu đoạn thì gấp hàng nghìn lần context window.</li>
<li><b>Đắt.</b> Mỗi câu chat trả tiền cho toàn bộ token đọc vào, kể cả 99,99% không liên quan.</li>
<li><b>Nhiễu.</b> Đoạn trả lời bị chìm giữa hàng trăm đoạn na ná. Ít đoạn mà đúng thì LLM dễ bám hơn.</li></ol>
<p>Ngược lại, nếu kho rất nhỏ (như 24 đoạn của POC) thì gửi hết là hoàn toàn được, và đơn giản hơn RAG. Kéo thử bên dưới để thấy ranh giới nằm ở đâu.</p>`,
      viz(box) {
        const S = { n: 1e6, t: 150 }, CTX = 128000, PRICE_IN = 2.5, out = el('div');
        function draw() {
          const all = S.n * S.t, rag = 3 * S.t + 100, fit = all <= CTX;
          out.replaceChildren(hbars([['Gửi cả kho', all, false], ['RAG: 3 đoạn + câu hỏi', rag, true], ['Context window 128K', CTX, false]], { max: Math.max(all, CTX), fmt: fmtNum }),
            el('div', { class: 'stat', html: `<span>Cả kho = <b>${(all / CTX).toFixed(all < CTX ? 2 : 0)}×</b> context window: <b class="${fit ? 'ok' : 'bad'}">${fit ? 'vừa' : 'không vừa'}</b></span><span>Tiền input mỗi câu hỏi: gửi cả kho ≈ <b>$${((all / 1e6) * PRICE_IN).toFixed(2)}</b>, RAG ≈ <b>$${((rag / 1e6) * PRICE_IN).toFixed(4)}</b></span>` }));
        }
        box.append(el('div', { class: 'row' }, [
          select('Kho', [[24, '24 đoạn (POC)'], [1e4, '10 nghìn đoạn'], [1e6, '1 triệu đoạn']], S.n, (v) => { S.n = +v; draw(); }).node,
          slider('Token mỗi đoạn', 50, 500, 50, S.t, (v) => { S.t = v; draw(); }).node]), out,
          el('div', { class: 'cap', text: 'Số token mỗi đoạn và 100 token cho câu hỏi kèm hướng dẫn là số giả định. Giá $2.5 / 1 triệu token input lấy từ bảng PRICE ước tính trong rag-poc/pipeline.py, cần đối chiếu trang giá của nhà cung cấp.' }));
        draw();
      },
      take: 'RAG tồn tại vì kho lớn hơn context window và vì trả tiền cho token không liên quan là lãng phí. Kho đủ nhỏ thì không cần RAG.'
    },
    {
      q: 'Vậy sao phải chia ra "nạp một lần" (bước 1 đến 3) và "mỗi câu hỏi" (bước 4 đến 9)?',
      a: `<p>Vì phần nạp rất nặng. Thử tính với 1 triệu đoạn, mỗi đoạn khoảng 150 token (số giả định): embed toàn bộ là 150 triệu token. Theo giá ước tính trong <code>pipeline.py</code> ($0.12 / 1 triệu token cho <code>embed-v4.0</code>) thì khoảng $18 mỗi lần. Cohere nhận tối đa 96 đoạn mỗi request (README), nên cần hơn 10 nghìn request. Làm việc này cho mỗi câu chat là không thể.</p>
<p>Nhưng kết quả embed của một đoạn <b>không phụ thuộc vào câu hỏi</b>. Đoạn "đổi trong 30 ngày" có cùng một vector dù ai hỏi gì. Vậy tính một lần, lưu lại, dùng mãi. Giống <code>CREATE INDEX</code> chạy lúc deploy, còn <code>SELECT</code> chạy mỗi request.</p>
<p>Khi khách hỏi, hệ thống chỉ embed <b>một câu</b> ngắn, tìm trong index đã dựng, rồi chấm lại vài chục đoạn. Ba việc này có chi phí gần như cố định, không tăng theo kích thước kho.</p>
<p>Lưu ý: RAG POC xoá collection và nạp lại từ đầu mỗi lần để cho đơn giản. Hệ thống thật chỉ embed lại các đoạn vừa thay đổi rồi upsert (ghi đè theo ID).</p>`,
      take: 'Việc gì không phụ thuộc câu hỏi thì làm trước và lưu lại. Đường nóng chỉ giữ những việc nhỏ và có giới hạn.'
    },
    {
      q: 'Sao phải cắt tài liệu thành chunk? Embed nguyên một tài liệu cho gọn không được à?',
      a: `<p>Một vector chỉ có một hướng. Nếu tài liệu "Chính sách ShopViet" nói về đổi trả, bảo hành, vận chuyển và trả góp, vector của nó phải chỉ về đâu? Nó bị kéo về <b>khoảng giữa</b> của bốn chủ đề và không gần hẳn chủ đề nào. README gọi đây là "trung bình hoá".</p>
<p>Hệ quả: câu hỏi về đổi trả thấy tài liệu này chỉ "hơi liên quan". Một đoạn ngắn nói <i>sai</i> nhưng tập trung đúng chủ đề (ví dụ đổi trả hàng khuyến mãi) có thể vượt lên trên. Thêm nữa, kể cả tìm đúng tài liệu thì vẫn phải nhét cả tài liệu dài vào prompt.</p>
<p>Mô hình bên dưới tính thật: mỗi mục của tài liệu là một hướng ngẫu nhiên trong 256 chiều, vector tài liệu là trung bình các mục. Kéo số mục lên và xem tài liệu tụt điểm. Cosine tụt theo khoảng 1/√(số mục).</p>
<p>Ngược lại, chunk quá nhỏ thì câu trả lời bị cắt đôi ("đổi trong 30 ngày" ở chunk này, "cần hoá đơn gốc" ở chunk kia). Lab 06 đi sâu vào phần cân bằng này.</p>`,
      viz(box) {
        const d = 256, rnd = seeded(6), norm = (v) => { const n = Math.hypot(...v); return v.map((x) => x / n); };
        const secs = Array.from({ length: 12 }, () => unitVec(d, rnd)), noise = unitVec(d, rnd), other = unitVec(d, rnd);
        const q = norm(secs[0].map((x, i) => 0.8 * x + 0.6 * noise[i])), wrong = norm(secs[0].map((x, i) => 0.5 * x + 0.87 * other[i]));
        const out = el('div'), stat = el('div', { class: 'stat' });
        function draw(k) {
          const doc = norm(secs[0].map((_, i) => secs.slice(0, k).reduce((s, v) => s + v[i], 0)));
          const cDoc = dotp(q, doc), cWrong = dotp(q, wrong);
          out.replaceChildren(hbars([['Chunk đúng (1 mục)', dotp(q, secs[0]), true], [`Cả tài liệu (${k} mục)`, cDoc, false], ['Chunk sai, cùng chủ đề', cWrong, false]], { max: 1, fmt: (v) => v.toFixed(3) }));
          stat.innerHTML = cDoc < cWrong ? '<span class="bad">Cả tài liệu đã xếp sau chunk sai.</span>' : '<span class="ok">Cả tài liệu vẫn xếp trên chunk sai.</span>';
        }
        box.append(el('div', { class: 'row' }, [slider('Số mục trong tài liệu', 1, 12, 1, 2, draw).node]), out, stat,
          el('div', { class: 'cap', text: 'Minh hoạ khái niệm, số tính thật trên vector ngẫu nhiên. Model thật không đơn thuần lấy trung bình, nhưng hiện tượng một vector phải đại diện nhiều ý thì loãng là cùng bản chất.' }));
        draw(2);
      },
      take: 'Chunk là đơn vị tìm kiếm. Mỗi chunk nên chứa trọn một ý để vector của nó chỉ rõ về một hướng.'
    },
    {
      q: 'Sao lúc lưu dùng input_type="search_document", lúc hỏi lại dùng "search_query"? Cùng một model mà?',
      a: `<p>Vì câu hỏi và tài liệu không giống nhau, dù cùng nói về một chuyện. Câu hỏi ngắn, dạng hỏi: <i>"Tai nghe bị rè, đổi trả được không?"</i>. Đoạn trả lời dài hơn, dạng khẳng định: <i>"Hàng bị lỗi được đổi trong 30 ngày, cần hóa đơn gốc."</i></p>
<p>README chỉ ra cái bẫy: <b>một câu hỏi thường giống một câu hỏi khác hơn là giống đoạn trả lời nó</b>. Nếu kho ShopViet có cả các câu hỏi cũ của khách, embed câu hỏi như một tài liệu bình thường sẽ kéo về những câu hỏi cũ (cùng dạng câu) thay vì đoạn chính sách (cùng nội dung).</p>
<p><code>input_type</code> báo cho model biết vai trò của đầu vào để nó tạo vector "hỏi" và vector "đáp" sao cho <b>cặp hỏi-đáp</b> gần nhau. Một số nhà cung cấp làm việc này bằng cách tự thêm một câu hướng dẫn vào trước văn bản, ví dụ Voyage (theo README). Hai vector vẫn nằm trong cùng một không gian nên vẫn so được với nhau.</p>
<p>Lỗi hay gặp: dùng <code>search_document</code> cho cả hai đầu, hoặc quên tham số ở một đầu. Hệ thống vẫn chạy, không báo lỗi, chỉ tìm kém đi. README ghi dùng sai <code>input_type</code> làm giảm chất lượng tìm kiếm đáng kể. Trong RAG POC, <code>app.py</code> gọi <code>embed(..., "search_document")</code> lúc lưu và <code>embed([q], "search_query")</code> lúc hỏi.</p>`,
      take: 'Câu hỏi và tài liệu đóng hai vai khác nhau. Khai báo đúng vai để model ghép cặp hỏi-đáp, không ghép câu hỏi với câu hỏi.'
    },
    {

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: 'Junior hỏi: vì sao?' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),

        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
