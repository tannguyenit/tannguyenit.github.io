const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  terms: [['Recall', 'Trong tất cả tài liệu đúng, hệ thống tìm được bao nhiêu phần. Recall thấp nghĩa là bỏ sót. Retrieve cần recall cao.'], ['Precision', 'Trong những tài liệu hệ thống trả về, bao nhiêu phần là đúng. Precision thấp nghĩa là lẫn nhiều rác. Rerank cần precision cao.'], ['Recall@N', 'Thử với một bộ câu hỏi test biết trước đoạn đúng. Với mỗi câu, lấy N kết quả đầu, xem đoạn đúng có trong đó không. Recall@N là tỉ lệ câu có. Ví dụ 100 câu test, 93 câu có đoạn đúng trong top-20 thì Recall@20 = 93%.'], ['Context window', 'Số token tối đa LLM đọc được trong một lần gọi. Kho tài liệu lớn hơn nhiều, nên chỉ đưa vào vài đoạn tốt nhất.'], ['Hallucination', 'LLM bịa ra câu trả lời nghe hợp lý nhưng không có trong nguồn. Dễ xảy ra khi không thấy đoạn đúng.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Khách hỏi <i>"Gói Pro hoàn tiền thế nào?"</i>. Đoạn đúng ("Gói Pro hoàn tiền trong 14 ngày") chỉ đứng thứ 7 theo độ gần vector. Nếu hệ thống chỉ lấy top-3, trợ lý sẽ trả lời bằng chính sách của gói Basic, và khách nhận thông tin sai.',
    scenario: 'Hệ thống RAG nhận câu hỏi "Chính sách hoàn tiền của gói Pro?". LLM chỉ được đọc 3 đoạn. Retriever xếp hạng nhanh nhưng thô, và đoạn có câu trả lời đúng nằm ở hạng 7.',

    solves: 'Retrieve rộng và rẻ để không bỏ sót (recall), rồi dùng reranker chính xác hơn để chọn ra 3 đoạn tốt nhất (precision).',
    read: ['Cột trái: 16 tài liệu theo thứ hạng của retriever. Viền xanh lá là tài liệu chứa câu trả lời.', 'Cột phải: các ứng viên trong top-N sau khi rerank. Ba hàng đầu (nền xanh) là thứ LLM nhận được.', 'Kéo <b>N</b> xuống dưới 7: tài liệu đúng mờ đi ở cột trái và biến mất khỏi cột phải.', 'Dòng kết quả bên dưới cho biết LLM có thấy nguồn đúng hay không.']

  summary: `<h3>Tóm tắt bài</h3>
<div class="tbl"><table>
<tr><th>Bước</th><th>Làm gì</th><th>Công cụ</th><th>Tối ưu</th><th>Chi phí</th></tr>
<tr><td><b>1. Retrieve</b></td><td>Tìm nhanh một tập ứng viên đủ rộng</td><td>Bi-encoder, hybrid</td><td><b>Recall</b></td><td>Rẻ, quét cả kho</td></tr>
<tr><td><b>2. Rerank</b></td><td>Chấm lại ứng viên, đẩy tài liệu liên quan lên đầu</td><td>Cross-encoder</td><td><b>Precision</b></td><td>Đắt hơn, chỉ trên tập nhỏ</td></tr>
<tr><td><b>3. Generate</b></td><td>Đưa top-K tốt nhất vào ngữ cảnh LLM để trả lời có nguồn</td><td>LLM</td><td>Bám nguồn</td><td>Đắt nhất</td></tr>
</table></div>
<blockquote><p>Reranker chỉ nhận được các tài liệu mà retriever đã lấy ra. Nếu bỏ sót tài liệu chứa câu trả lời, cả reranker lẫn bước sinh câu trả lời phía sau đều không được đọc nó. Vì vậy: giai đoạn đầu ưu tiên <b>recall</b>, giai đoạn sau tối ưu <b>precision</b>.</p></blockquote>
<h4>So sánh các cấu hình</h4>

<tr><td>Retrieve top-3 → LLM</td><td>Đơn giản, rẻ nhất</td><td>Một lần xếp hạng sai là mất nguồn đúng</td></tr>
<tr><td>Retrieve N lớn → Rerank → top-K → LLM</td><td>Giữ recall rộng, prompt gọn và chính xác</td><td>Thêm một lần gọi reranker (trễ, tiền)</td></tr>
<tr><td>Retrieve N lớn → LLM luôn</td><td>Không cần reranker</td><td>Prompt dài, tốn token, nhiễu</td></tr>

<div class="verdict"><b>Mẫu hình này lặp lại</b> trong semantic search, RAG và recommendation (candidate generation → ranking). Đo <b>Recall@N</b> của retriever để chọn N.</div>`,
  why: {
    c: 'Hai bước có mục tiêu khác nhau. Retrieve lấy rộng và rẻ, mục tiêu là recall: đoạn đúng phải nằm trong tập ứng viên. Rerank chấm kỹ trên tập nhỏ, mục tiêu là precision: chọn đúng vài đoạn tốt nhất cho prompt. LLM chỉ đọc được vài đoạn vì giới hạn context và chi phí token, nên chất lượng 3 đoạn đó quyết định chất lượng câu trả lời.',
    s: 'Lấy top-3 rồi đưa thẳng cho LLM: một lần xếp hạng thô sai là mất nguồn đúng, và LLM sẽ trả lời từ đoạn sai hoặc tự bịa. Đưa cả 50 ứng viên vào prompt: tốn token, chậm, và các đoạn gần đúng gây nhiễu.',
    p: 'Thêm một lần gọi reranker (độ trễ và tiền). N lớn thì recall cao nhưng reranker phải chấm nhiều cặp hơn. Chọn N bằng cách đo Recall@N: tăng N tới khi tỉ lệ câu hỏi có đoạn đúng trong tập ứng viên đạt mức bạn cần.'
  },
  deep: [
    {
      q: 'Retriever và reranker đều chấm "độ liên quan". Sao phải chấm hai lần?',
      a: `<p>Vì hai bước dùng hai loại model khác nhau về bản chất, và khác nhau ở chỗ <b>lúc nào thì được đọc tài liệu</b>.</p>
<p><b>Retriever</b> thường là bi-encoder: model mã hoá câu hỏi và tài liệu <i>riêng rẽ</i>. Mỗi đoạn đã được biến thành vector từ lúc index, trước khi biết ai sẽ hỏi gì. Lúc có câu hỏi, chỉ còn phép nhân vector. Rẻ, nhưng mọi chi tiết của đoạn phải nén vào một vector cố định. Giống lọc CV bằng bản tóm tắt viết sẵn.</p>
<p><b>Reranker</b> thường là cross-encoder: model đọc <i>cặp</i> (câu hỏi, đoạn) cùng lúc trong một lần chạy. Từng từ của câu hỏi được đối chiếu với từng từ của đoạn. Giống phỏng vấn trực tiếp từng ứng viên: chính xác hơn, nhưng mỗi ứng viên tốn một buổi.</p>
<p>Số đo thật từ <code>pocs/03_encoders.py</code> (24 đoạn ShopViet, model nhỏ chạy CPU): với câu "Tai nghe của tôi bị rè, đổi trả được không?", bi-encoder xếp đoạn đúng <code>doitra-1</code> ở <b>hạng 15</b>, cross-encoder đưa nó lên <b>hạng 8</b>. Cross-encoder tốt hơn, nhưng cũng không thần kỳ: cả hai đều là model nhỏ chạy CPU, và đoạn đúng vẫn chưa vào top-3.</p>`,
      take: 'Bi-encoder tính trước được nên quét được cả kho. Cross-encoder phải đọc từng cặp nên chỉ dùng được trên tập nhỏ.'
    },
    {
      q: 'Cross-encoder chính xác hơn thì dùng nó chấm thẳng cả kho, bỏ retriever đi?',
      a: `<p>Vì không tính trước được, cross-encoder phải chạy model <b>một lần cho mỗi đoạn</b>, mỗi câu hỏi. Thời gian tăng thẳng theo kích thước kho. Còn bi-encoder chỉ còn phép nhân vector, rẻ hơn hàng nghìn lần mỗi đoạn.</p>
<p>Hình dưới dùng hai số đo thật trên cùng máy: cross-encoder <b>4.4 ms mỗi cặp</b> (POC 03) và brute-force bi-encoder <b>5.21 ms cho 200.000 vector 384 chiều</b> (POC 05). Chọn kích thước kho để xem mỗi câu hỏi tốn bao lâu.</p>`,
      viz(box) {
        const CE = 4.4, BI = 5.21 / 2e5, out = el('div');

        function draw(n) {

<tr><td>Cross-encoder chấm cả kho</td><td class="mono">${n.toLocaleString('vi')} × 4.4 ms</td><td><b class="bad">${t(n * CE)}</b></td></tr>
<tr><td>Bi-encoder quét cả kho (brute-force)</td><td class="mono">${n.toLocaleString('vi')} × ${(BI * 1e6).toFixed(0)} ns</td><td><b class="ok">${t(n * BI)}</b></td></tr>
<tr><td>Bi-encoder rồi cross-encoder chấm 100 ứng viên</td><td class="mono">trên + 100 × 4.4 ms</td><td><b>${t(n * BI + 100 * CE)}</b></td></tr></table></div>`;

        box.append(el('div', { class: 'row' }, [select('Số đoạn trong kho', [[24, '24 (POC ShopViet)'], [1e4, '10.000'], [2e5, '200.000'], [1e6, '1 triệu'], [1e7, '10 triệu']], 1e6, (v) => draw(+v)).node]), out,
          el('div', { class: 'cap', text: 'Số đo thật trên CPU laptop, reranker nhỏ, đo một lần. Dòng bi-encoder ngoại suy tuyến tính từ 200.000 vector và chưa tính thời gian embed câu hỏi. Reranker qua API chạy GPU nên nhanh hơn nhiều, README không đưa con số.' }));

      take: 'Retriever tồn tại để thu hẹp hàng triệu đoạn xuống vài chục đoạn, đủ nhỏ để model đắt được phép đọc kỹ.'
    },
    {
      q: 'Sao tài liệu nói "tối ưu recall trước"? Lấy ít mà trúng không tốt hơn à?',
      a: `<p>Hãy nhìn phễu như hai cửa nối tiếp. Đoạn đúng muốn tới được LLM phải qua <b>cả hai</b>:</p>
<ol><li>Cửa 1: lọt vào top-N của retriever. Xác suất này chính là Recall@N.</li><li>Cửa 2: được reranker xếp vào top-K.</li></ol>
<p>Xác suất cuối cùng là <b>tích</b> của hai cửa. Reranker giỏi đến đâu cũng chỉ làm cửa 2 gần 100%. Nó không mở lại được cửa 1. Vì thế README gọi Recall@N là <b>trần</b> (ceiling) của cả hệ thống: đoạn bị loại ở cửa 1 thì mất hẳn.</p>
<p>"Lấy ít mà trúng" là đòi retriever vừa nhanh vừa chính xác, đúng thứ bi-encoder không làm được. Chia việc thì mỗi bước chỉ cần giỏi một thứ. Kéo N và K bên dưới. Trình duyệt mô phỏng 200 câu hỏi và đếm mỗi câu rơi ở cửa nào.</p>`,
      viz(box) {
        const Q = 200, rnd = seeded(4), S = { n: 5, k: 3 };
        const rank = Array.from({ length: Q }, () => Math.max(1, Math.round(Math.exp(0.7 + 1.5 * randn(rnd)))));
        const gold = rank.map(() => 3 + randn(rnd)), noise = rank.map(() => Array.from({ length: 199 }, () => randn(rnd)));
        const bar = el('div', { style: 'display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)' }), stat = el('div', { class: 'stat' });
        function draw() {
          let lost1 = 0, lost2 = 0;
          rank.forEach((r, i) => {
            if (r > S.n) lost1++;
            else if (noise[i].slice(0, S.n - 1).filter((x) => x > gold[i]).length >= S.k) lost2++;
          });
          const ok = Q - lost1 - lost2;
          bar.replaceChildren(...[[ok, 'var(--ok)'], [lost2, 'var(--warn)'], [lost1, 'var(--bad)']].map(([v, c]) => el('span', { style: `width:${(v / Q) * 100}%;background:${c}` })));
          stat.innerHTML = `<span class="ok">Tới LLM: <b>${ok}</b></span><span>Lọt top-N nhưng reranker xếp trượt: <b>${lost2}</b></span><span class="bad">Bị loại ở retriever: <b>${lost1}</b></span><span>Recall@${S.n} = <b>${(((Q - lost1) / Q) * 100).toFixed(0)}%</b></span>`;
        }
        box.append(el('div', { class: 'row' }, [slider('N', 1, 200, 1, S.n, (v) => { S.n = v; draw(); }).node, slider('K', 1, 10, 1, S.k, (v) => { S.k = v; draw(); }).node]), bar, stat,
          el('div', { class: 'cap', text: 'Mô phỏng với số giả định: hạng của đoạn đúng theo retriever lấy ngẫu nhiên (trung vị khoảng hạng 2, có đuôi dài), điểm rerank là điểm đoạn đúng cộng nhiễu so với các ứng viên khác. Chỉ để thấy cơ chế, không phải số đo.' }));
        draw();
      },
      take: 'Phần đỏ (bị loại ở retriever) không bước nào phía sau cứu được. Vì vậy bước đầu tối ưu recall, bước sau mới lo precision.'
    },
    {
      q: 'Vậy lấy N thật lớn, 1000 luôn cho chắc?',
      a: `<p>Không, vì hai đường cong đi ngược nhau:</p>
<ul><li><b>Recall@N tăng nhanh lúc đầu rồi chững lại.</b> Phần lớn đoạn đúng nằm ở vài chục hạng đầu. Từ 100 lên 1000 chỉ cứu thêm vài câu hỏi hiếm.</li>
<li><b>Chi phí rerank tăng thẳng theo N.</b> Gấp 10 lần ứng viên là gấp 10 lần số cặp phải chấm, gấp 10 lần độ trễ nếu tự host.</li>
<li><b>Nhiều ứng viên hơn là nhiều "đối thủ" hơn</b> cho reranker. Mỗi ứng viên thêm vào là thêm một cơ hội để một đoạn gần đúng vượt mặt đoạn đúng. Ở mô phỏng câu trước, thử đẩy N lên 200: phần cam nhích lên.</li></ul>
<p>Đó là lý do README chọn vùng <b>N = 50–100</b>: thường đã qua khúc cua của đường recall, mà reranker vẫn chấm kịp. Con số chính xác phải đo trên dữ liệu của bạn.</p>`,
      viz(box) {
        const rnd = seeded(4), R = Array.from({ length: 3000 }, () => Math.max(1, Math.round(Math.exp(0.7 + 1.5 * randn(rnd)))));
        const W = 560, H = 180, P = 34, NS = [1, 2, 3, 5, 8, 10, 15, 20, 30, 50, 70, 100, 150, 200];
        const x = (n) => P + (Math.log(n) / Math.log(200)) * (W - 2 * P), yR = (r) => H - 8 - r * (H - 24), yT = (n) => H - 8 - (n / 200) * (H - 24);

        const mark = el('line', { y1: 8, y2: H - 8, stroke: 'var(--ink)', 'stroke-dasharray': '4 4' }), stat = el('div', { class: 'stat' });
        box.append(el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 22}`, role: 'img', 'aria-label': 'Recall theo N và chi phí rerank theo N' }, [
          el('line', { x1: P, x2: W - P, y1: H - 8, y2: H - 8, stroke: 'var(--line)' }),
          el('path', { d: path((n) => yR(rec(n))), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.5 }),
          el('path', { d: path(yT), fill: 'none', stroke: 'var(--warn)', 'stroke-width': 2.5 }), mark,
          ...[1, 3, 10, 30, 100, 200].map((n) => el('text', { x: x(n) - 6, y: H + 14, class: 'mute', text: String(n) })),
          el('text', { x: P + 4, y: 20, fill: 'var(--accent)', text: 'Recall@N (mô phỏng)' }),
          el('text', { x: W - P - 150, y: H - 30, fill: 'var(--warn)', text: 'Số cặp phải rerank' })]));
        const draw = (i) => { const n = NS[i]; mark.setAttribute('x1', x(n)); mark.setAttribute('x2', x(n));
          stat.innerHTML = `<span>N = <b>${n}</b></span><span>Recall@N = <b>${(rec(n) * 100).toFixed(1)}%</b></span><span>Rerank: <b>${n}</b> cặp, ≈ <b>${(n * 4.4).toFixed(0)} ms</b> ở tốc độ CPU của POC 03</span>`; };
        box.append(el('div', { class: 'row' }, [slider('N', 0, NS.length - 1, 1, 9, draw, (i) => NS[i]).node]), stat,
          el('div', { class: 'cap', text: 'Trục ngang dạng log. Đường xanh dùng phân bố hạng giả định như câu trước. Đường cam là số cặp, tỉ lệ thuận với N. Mili giây lấy từ số đo 4.4 ms/cặp của POC 03 trên CPU, chỉ để so thứ bậc.' }));
        draw(9);
      },
      take: 'Tăng N tới khi đường recall gần phẳng thì dừng. Phần recall còn thiếu sau đó nên sửa ở retriever (hybrid, chunking), không phải bằng N.'
    },
    {
      q: 'Sao không bỏ reranker, đưa thẳng 50 ứng viên cho LLM tự chọn?',
      a: `<p>Làm được, và README liệt kê nó là một cấu hình hợp lệ. Nhưng có ba cái giá:</p>
<ol><li><b>Tiền và độ trễ.</b> LLM tính tiền theo token đầu vào. 50 đoạn là gấp hơn 10 lần token so với 3–5 đoạn, cho <i>mỗi</i> câu hỏi. Prompt dài cũng làm LLM trả lời chậm hơn.</li>

<li><b>Khó trích dẫn và debug.</b> Câu trả lời sai thì khó biết LLM đã dựa vào đoạn nào trong 50 đoạn.</li></ol>
<p>Thử bảng tính dưới đây. Chú ý dòng "phần prompt là đoạn đúng": K càng lớn, câu trả lời càng là cây kim nhỏ trong đống rơm.</p>`,
      viz(box) {
        const S = { k: 5, t: 300, q: 1e4 }, PRICE = 2.5, BASE = 150, out = el('div', { class: 'stat' });
        function draw() {

        }
        box.append(el('div', { class: 'row' }, [
          select('K đoạn vào prompt', [[3, '3'], [5, '5'], [10, '10'], [50, '50'], [100, '100']], S.k, (v) => { S.k = +v; draw(); }).node,
          slider('Token / đoạn', 100, 800, 50, S.t, (v) => { S.t = v; draw(); }).node,
          select('Câu hỏi / ngày', [[1e3, '1.000'], [1e4, '10.000'], [1e5, '100.000']], S.q, (v) => { S.q = +v; draw(); }).node]), out,
          el('div', { class: 'cap', text: 'Giá đầu vào $2.5 / 1 triệu token lấy từ hằng số PRICE trong rag-poc/pipeline.py (model chat của POC). 150 token cho chỉ dẫn và câu hỏi là số giả định. Chưa tính token đầu ra.' }));
        draw();
      },
      take: 'Reranker là bộ lọc rẻ đặt trước bước đắt nhất. Nó giữ prompt ngắn, sắc, và giữ tỉ lệ tín hiệu trên nhiễu cao.'
    },
    {
      q: 'Còn K thì sao? Chọn 3 hay 10?',
      a: `<p>K là số đoạn cuối cùng đưa cho LLM. README gợi ý <b>K ≈ 3–10</b>. Cân nhắc hai chiều:</p>
<ul><li><b>K quá nhỏ</b>: câu trả lời cần ghép từ nhiều đoạn thì thiếu mảnh. Ví dụ "đổi trả tai nghe mất phí ship không?" cần cả đoạn đổi trả 30 ngày lẫn đoạn ai chịu phí vận chuyển. Reranker xếp sai một bậc là mất luôn nguồn.</li>
<li><b>K quá lớn</b>: quay lại vấn đề của câu trước, prompt dài và loãng.</li></ul>
<p>Thứ tự trong top-K cũng quan trọng. README dùng nDCG@K (điểm thưởng nhiều hơn khi đoạn đúng đứng đầu) để đo bước rerank, vì các đoạn ở vị trí 1–3 ảnh hưởng LLM nhiều hơn vị trí 8–10.</p>
<p>Sau rerank còn bước <b>ghép ngữ cảnh</b> (context assembly): bỏ đoạn trùng ý, giữ tiêu đề và nguồn để LLM trích dẫn, tôn trọng ngân sách token. README nói thẳng: ba đoạn ngắn nhưng sắc thường hữu ích hơn mười đoạn dài và loãng.</p>`,
      take: 'K nhỏ khi câu hỏi thường có một nguồn, K lớn hơn khi câu trả lời hay phải ghép nhiều đoạn. Cả hai phải kiểm bằng câu hỏi thật.'
    },
    {
      q: 'Trong thực tế làm sao biết N đã đủ chưa?',
      a: `<p>Đo Recall@N trên một bộ câu hỏi test. Mẹo rẻ: bạn <b>không cần chạy lại cho từng N</b>.</p>
<ol><li>Gom vài chục đến vài trăm câu hỏi thật, mỗi câu ghi lại đoạn đúng.</li>
<li>Chạy retriever một lần với N lớn (ví dụ 200), ghi lại <b>hạng</b> của đoạn đúng. Không thấy thì coi như hạng vô cùng.</li>
<li>Recall@N với mọi N chỉ là đếm: bao nhiêu câu có hạng ≤ N. Một lần chạy cho ra cả đường cong.</li></ol>
<p>Ô bên dưới đã điền hạng <b>đo thật</b> của đoạn đúng cho 4 câu hỏi ShopViet trong POC (model MiniLM 384 chiều, 24 đoạn): 15, 1, 3, 3. Thử sửa danh sách để xem bảng tính lại.</p>`,
      viz(box) {
        const NS = [1, 3, 5, 10, 15, 20], out = el('div');
        const inp = el('input', { type: 'text', value: '15, 1, 3, 3', 'aria-label': 'Danh sách hạng của đoạn đúng', style: 'font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:220px' });
        function draw() {
          const r = inp.value.split(/[,\s]+/).map(Number).filter((v) => v > 0);
          if (!r.length) { out.innerHTML = '<p class="hint">Nhập ít nhất một số hạng.</p>'; return; }
          out.innerHTML = '<div class="tbl"><table><tr><th>N</th>' + NS.map((n) => `<th>${n}</th>`).join('') + '</tr><tr><td>Recall@N</td>' +
            NS.map((n) => { const v = r.filter((x) => x <= n).length / r.length; return `<td class="mono"><b class="${v === 1 ? 'ok' : v < 0.75 ? 'bad' : ''}">${Math.round(v * 100)}%</b></td>`; }).join('') + '</tr></table></div>';

          el('div', { class: 'cap', text: 'Số mặc định đo thật từ POC (poc-out: 01 và 03), chỉ 4 câu hỏi nên mỗi câu là 25 điểm phần trăm. Kho 24 đoạn nên N = 15 đã là hơn nửa kho. Đủ để thấy cách tính, không đủ để chọn N.' }));
        draw();
      },
      take: 'Một lần chạy với N lớn cho cả đường Recall@N. Chọn N ở chỗ đường cong gần phẳng, rồi mới chỉnh K bằng chất lượng câu trả lời.'
    },
    {
      q: 'RAG POC của ShopViet đang đặt N, K bao nhiêu, và vì sao không phải 50–100?',
      a: `<p>Trong <code>rag-poc/app.py</code>, mặc định là <b>N = 8</b> (Qdrant tìm theo cosine trên vector Cohere <code>embed-v4.0</code> 1536 chiều) và <b>K = 3</b> (Cohere <code>rerank-v3.5</code> giữ 3 đoạn cho prompt). Kho POC chỉ có vài file mẫu (chính sách, bảng giá, ảnh) cắt bằng Unstructured <code>chunk_by_title</code>, nên 8 ứng viên đã là một phần lớn của kho. Lấy 50 thì gần như đưa cả kho cho reranker.</p>
<p>Khi kho lên cỡ 1 triệu đoạn như kịch bản ShopViet, mọi thứ đổi:</p>
<ul><li>N = 8 gần như chắc chắn làm Recall@N tụt. Đo lại theo cách ở câu trước, rồi đẩy N về vùng 50–100 như README gợi ý.</li>
<li>Chi phí rerank: <code>pipeline.py</code> ghi phí rerank theo <b>mỗi lần gọi</b> chứ không theo N (đây là hằng số trong code, hãy kiểm tra trang giá Cohere trước khi dự toán). Độ trễ thì vẫn tăng theo N.</li>
<li>K = 3 hợp với câu hỏi một nguồn như "Gói Pro hoàn tiền thế nào?". Nếu log thấy nhiều câu cần ghép hai ba chính sách, thử K = 5 và so câu trả lời.</li></ul>`,
      take: 'N và K không phải hằng số. N theo kích thước kho và Recall@N đo được, K theo kiểu câu hỏi và chất lượng câu trả lời.'
    }
  ],
  mount(stage) {
    const K = 3;
    const docs = [
      ['Bảng giá các gói Basic, Pro, Team', 0.41], ['Gói Pro gồm những tính năng nào', 0.38], ['Hướng dẫn nâng cấp lên Pro', 0.3],
      ['Điều khoản thanh toán chung', 0.55], ['Chính sách hoàn tiền gói Basic', 0.62], ['Gói Pro: hoàn tiền trong 14 ngày, không cần lý do', 0.96],
      ['Đổi trả phần cứng', 0.36], ['Chính sách bảo mật', 0.1], ['Hủy gói và chu kỳ thanh toán', 0.5], ['Câu hỏi thường gặp về hoá đơn', 0.34],
      ['Giới thiệu công ty', 0.05], ['Liên hệ hỗ trợ', 0.2], ['Lộ trình sản phẩm', 0.08], ['Quy định sử dụng hợp lý', 0.15], ['Changelog tháng 10', 0.04], ['API rate limit', 0.06]
    ];
    const GOLD = 5;
    const order = [0, 1, 3, 4, 2, 6, 5, 8, 9, 7, 11, 10, 13, 12, 15, 14];
    let N = 5;
    const L = rankList(34), M = rankList(34);
    const verdict = el('div', { class: 'hint' });
    function update() {
      const inN = new Set(order.slice(0, N));
      L.update(order.map((d, r) => ({ id: 'd' + d, cls: (inN.has(d) ? '' : 'dim ') + (d === GOLD ? 'gold' : ''), html: `<i>#${r + 1}</i>${docs[d][0]}` })));
      const rer = order.slice(0, N).sort((a, b) => docs[b][1] - docs[a][1]);
      M.update(rer.map((d, r) => ({ id: 'd' + d, cls: (r < K ? 'hit ' : '') + (d === GOLD ? 'gold' : ''), html: `<i>#${r + 1}</i>${docs[d][0]}<span class="bar" style="width:${docs[d][1] * 50}px"></span>` })));
      const got = rer.slice(0, K).includes(GOLD);
      verdict.innerHTML = got
        ? `<b class="ok">LLM nhận được nguồn đúng</b> trong top-${K} sau rerank.`
        : `<b class="bad">LLM không thấy nguồn đúng.</b> Tài liệu đúng nằm ở hạng ${order.indexOf(GOLD) + 1} của retriever nhưng N = ${N}, nên reranker không bao giờ được đọc nó.`;
    }
    const sl = slider('N (số ứng viên)', 3, 16, 1, N, (v) => { N = v; update(); });
    stage.append(el('div', { class: 'row' }, [sl.node]),
      el('div', { class: 'cols' }, [
        el('div', {}, [el('h4', { html: '1. Retrieve <small>· bi-encoder, thứ hạng theo vector</small>' }), L.node]),
        el('div', {}, [el('h4', { html: `2. Rerank <small>· cross-encoder, lấy top-${K} đưa vào prompt</small>` }), M.node])
      ]), verdict,
      el('p', { class: 'hint', text: 'Điểm rerank là dữ liệu giả lập để minh hoạ. Viền xanh lá là tài liệu chứa câu trả lời.' }));
    update();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
