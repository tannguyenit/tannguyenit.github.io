const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  hook: 'Câu hỏi: "Chính sách hoàn tiền của gói Pro?". Kéo N xuống thấp và xem tài liệu đúng biến mất khỏi LLM.',
  terms: [['Recall', 'Trong tất cả tài liệu đúng, hệ thống tìm được bao nhiêu phần. Recall thấp nghĩa là bỏ sót. Retrieve cần recall cao.'], ['Precision', 'Trong những tài liệu hệ thống trả về, bao nhiêu phần là đúng. Precision thấp nghĩa là lẫn nhiều rác. Rerank cần precision cao.'], ['Recall@N', 'Thử với một bộ câu hỏi test biết trước đoạn đúng. Với mỗi câu, lấy N kết quả đầu, xem đoạn đúng có trong đó không. Recall@N là tỉ lệ câu có. Ví dụ 100 câu test, 93 câu có đoạn đúng trong top-20 thì Recall@20 = 93%.'], ['Context window', 'Số token tối đa LLM đọc được trong một lần gọi. Kho tài liệu lớn hơn nhiều, nên chỉ đưa vào vài đoạn tốt nhất.'], ['Hallucination', 'LLM bịa ra câu trả lời nghe hợp lý nhưng không có trong nguồn. Dễ xảy ra khi không thấy đoạn đúng.']],
  problem: {
    example: '<b>ShopViet</b> là cửa hàng điện tử online, có trợ lý chat trả lời khách dựa trên khoảng 1 triệu đoạn chính sách, hướng dẫn và mô tả sản phẩm. Khách hỏi <i>"Gói Pro hoàn tiền thế nào?"</i>. Đoạn đúng ("Gói Pro hoàn tiền trong 14 ngày") chỉ đứng thứ 7 theo độ gần vector. Nếu hệ thống chỉ lấy top-3, trợ lý sẽ trả lời bằng chính sách của gói Basic, và khách nhận thông tin sai.',
    scenario: 'Hệ thống RAG nhận câu hỏi "Chính sách hoàn tiền của gói Pro?". LLM chỉ được đọc 3 đoạn. Retriever xếp hạng nhanh nhưng thô, và đoạn có câu trả lời đúng nằm ở hạng 7.',
    ask: 'Nên lấy bao nhiêu ứng viên (N) từ retriever trước khi chọn 3 đoạn cuối?',
    solves: 'Retrieve rộng và rẻ để không bỏ sót (recall), rồi dùng reranker chính xác hơn để chọn ra 3 đoạn tốt nhất (precision).',
    read: ['Cột trái: 16 tài liệu theo thứ hạng của retriever. Viền xanh lá là tài liệu chứa câu trả lời.', 'Cột phải: các ứng viên trong top-N sau khi rerank. Ba hàng đầu (nền xanh) là thứ LLM nhận được.', 'Kéo <b>N</b> xuống dưới 7: tài liệu đúng mờ đi ở cột trái và biến mất khỏi cột phải.', 'Dòng kết quả bên dưới cho biết LLM có thấy nguồn đúng hay không.']
  },
  summary: `<h3>Tóm tắt bài</h3>
<div class="tbl"><table>
<tr><th>Bước</th><th>Làm gì</th><th>Công cụ</th><th>Tối ưu</th><th>Chi phí</th></tr>
<tr><td><b>1. Retrieve</b></td><td>Tìm nhanh một tập ứng viên đủ rộng</td><td>Bi-encoder, hybrid</td><td><b>Recall</b></td><td>Rẻ, quét cả kho</td></tr>
<tr><td><b>2. Rerank</b></td><td>Chấm lại ứng viên, đẩy tài liệu liên quan lên đầu</td><td>Cross-encoder</td><td><b>Precision</b></td><td>Đắt hơn, chỉ trên tập nhỏ</td></tr>
<tr><td><b>3. Generate</b></td><td>Đưa top-K tốt nhất vào ngữ cảnh LLM để trả lời có nguồn</td><td>LLM</td><td>Bám nguồn</td><td>Đắt nhất</td></tr>
</table></div>
<blockquote><p>Reranker chỉ nhận được các tài liệu mà retriever đã lấy ra. Nếu bỏ sót tài liệu chứa câu trả lời, cả reranker lẫn bước sinh câu trả lời phía sau đều không được đọc nó. Vì vậy: giai đoạn đầu ưu tiên <b>recall</b>, giai đoạn sau tối ưu <b>precision</b>.</p></blockquote>
<h4>So sánh các cấu hình</h4>
<div class="tbl"><table>
<tr><th>Cấu hình</th><th>Ưu</th><th>Nhược</th></tr>
<tr><td>Retrieve top-3 → LLM</td><td>Đơn giản, rẻ nhất</td><td>Một lần xếp hạng sai là mất nguồn đúng</td></tr>
<tr><td>Retrieve N lớn → Rerank → top-K → LLM</td><td>Giữ recall rộng, prompt gọn và chính xác</td><td>Thêm một lần gọi reranker (trễ, tiền)</td></tr>
<tr><td>Retrieve N lớn → LLM luôn</td><td>Không cần reranker</td><td>Prompt dài, tốn token, nhiễu</td></tr>
</table></div>
<div class="verdict"><b>Mẫu hình này lặp lại</b> trong semantic search, RAG và recommendation (candidate generation → ranking). Đo <b>Recall@N</b> của retriever để chọn N.</div>`,
  why: {
    c: 'Hai bước có mục tiêu khác nhau. Retrieve lấy rộng và rẻ, mục tiêu là recall: đoạn đúng phải nằm trong tập ứng viên. Rerank chấm kỹ trên tập nhỏ, mục tiêu là precision: chọn đúng vài đoạn tốt nhất cho prompt. LLM chỉ đọc được vài đoạn vì giới hạn context và chi phí token, nên chất lượng 3 đoạn đó quyết định chất lượng câu trả lời.',
    s: 'Lấy top-3 rồi đưa thẳng cho LLM: một lần xếp hạng thô sai là mất nguồn đúng, và LLM sẽ trả lời từ đoạn sai hoặc tự bịa. Đưa cả 50 ứng viên vào prompt: tốn token, chậm, và các đoạn gần đúng gây nhiễu.',
    p: 'Thêm một lần gọi reranker (độ trễ và tiền). N lớn thì recall cao nhưng reranker phải chấm nhiều cặp hơn. Chọn N bằng cách đo Recall@N: tăng N tới khi tỉ lệ câu hỏi có đoạn đúng trong tập ứng viên đạt mức bạn cần.'
  },
  mount(stage) {
    const K = 3;
    const docs = [
      ['Bảng giá các gói Basic, Pro, Team', 0.41], ['Gói Pro gồm những tính năng nào', 0.38], ['Hướng dẫn nâng cấp lên Pro', 0.3],
      ['Điều khoản thanh toán chung', 0.55], ['Chính sách hoàn tiền gói Basic', 0.62], ['Gói Pro: hoàn tiền trong 14 ngày, không cần lý do', 0.96],
      ['Đổi trả phần cứng', 0.36], ['Chính sách bảo mật', 0.1], ['Hủy gói và chu kỳ thanh toán', 0.5], ['Câu hỏi thường gặp về hoá đơn', 0.34],
      ['Giới thiệu công ty', 0.05], ['Liên hệ hỗ trợ', 0.2], ['Lộ trình sản phẩm', 0.08], ['Quy định sử dụng hợp lý', 0.15], ['Changelog tháng 10', 0.04], ['API rate limit', 0.06]
    ];
    const GOLD = 5;
    const order = [0, 1, 3, 4, 2, 6, 5, 8, 9, 7, 11, 10, 13, 12, 15, 14];
    let N = 5;
    const L = rankList(34), M = rankList(34);
    const verdict = el('div', { class: 'hint' });
    function update() {
      const inN = new Set(order.slice(0, N));
      L.update(order.map((d, r) => ({ id: 'd' + d, cls: (inN.has(d) ? '' : 'dim ') + (d === GOLD ? 'gold' : ''), html: `<i>#${r + 1}</i>${docs[d][0]}` })));
      const rer = order.slice(0, N).sort((a, b) => docs[b][1] - docs[a][1]);
      M.update(rer.map((d, r) => ({ id: 'd' + d, cls: (r < K ? 'hit ' : '') + (d === GOLD ? 'gold' : ''), html: `<i>#${r + 1}</i>${docs[d][0]}<span class="bar" style="width:${docs[d][1] * 50}px"></span>` })));
      const got = rer.slice(0, K).includes(GOLD);
      verdict.innerHTML = got
        ? `<b class="ok">LLM nhận được nguồn đúng</b> trong top-${K} sau rerank.`
        : `<b class="bad">LLM không thấy nguồn đúng.</b> Tài liệu đúng nằm ở hạng ${order.indexOf(GOLD) + 1} của retriever nhưng N = ${N}, nên reranker không bao giờ được đọc nó.`;
    }
    const sl = slider('N (số ứng viên)', 3, 16, 1, N, (v) => { N = v; update(); });
    stage.append(el('div', { class: 'row' }, [sl.node]),
      el('div', { class: 'cols' }, [
        el('div', {}, [el('h4', { html: '1. Retrieve <small>· bi-encoder, thứ hạng theo vector</small>' }), L.node]),
        el('div', {}, [el('h4', { html: `2. Rerank <small>· cross-encoder, lấy top-${K} đưa vào prompt</small>` }), M.node])
      ]), verdict,
      el('p', { class: 'hint', text: 'Điểm rerank là dữ liệu giả lập để minh hoạ. Viền xanh lá là tài liệu chứa câu trả lời.' }));
    update();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage,
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ])
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
