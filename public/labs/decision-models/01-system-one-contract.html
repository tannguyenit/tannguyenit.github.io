const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<p>TypeSafe cho ví dụ: "Tin nhắn này có khẩn cấp không?" là câu hỏi tốt. "Phân tích tin nhắn và quyết định hành động tốt nhất" thì không, vì nó cần suy luận chậm. Đó là dấu hiệu nên tách thành nhiều câu nhỏ. Bấm từng câu hỏi bên dưới để xem.</p>`,

          function draw() {

      read: ["Dòng <b>Lỗi parse</b>: 7/15 hỏng với <code>json.loads</code> thẳng, vẫn còn 5/15 khi đã tìm <code>{…}</code> rồi parse. Tỉ lệ này do ta chọn chuỗi lỗi để viết, không phải tỉ lệ lỗi của LLM thật. Điều đáng xem là loại lỗi nào parser lenient cứu được (câu dẫn, khối ```json) và loại nào không (tên option sai, gộp hai option, <code>null</code>).", "Bảng thứ hai: chuỗi viết tay cho LLM chọn van_chuyen 2 lần, thanh_toan 2 lần, lần nào cũng ghi 0.9; phân phối viết tay của decision model là 0.52 / 0.41. Đây là minh hoạ hiện tượng README mô tả, không phải số đo.", "Bảng token: input hai cách gần bằng nhau (181 và 191). Khác biệt là 16 bước decode tuần tự so với 0, và output của decision model không tính tiền."]

    mount(stage) {

      const runRow = (i, raw, r) => el('div', { style: `border-left:4px solid ${r.ok ? 'var(--ok)' : 'var(--bad)'};background:var(--bg);padding:6px 10px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:12.5px` }, [
        el('div', { style: 'display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap' }, [el('b', { text: 'Lần ' + (i + 1) }), el('span', { class: 'mono', style: `color:${r.ok ? 'var(--ok)' : 'var(--bad)'}`, text: r.ok ? '→ ' + r.v + (r.c != null ? ' · conf ' + r.c : '') : 'parse hỏng: ' + r.why })]),
        el('div', { class: 'mono', style: 'white-space:pre-wrap;word-break:break-word;font-size:11.5px;color:var(--mute)', text: raw })]);

      function render() {
        const c = CASES.find((x) => x.id === S.c);
        chips.replaceChildren(...CASES.map((x) => el('button', { class: x.id === S.c ? 'on' : '', text: x.name, onclick: () => { S.c = x.id; render(); } })));
        msg.innerHTML = `<b>Tin nhắn khách:</b> ${esc(c.msg)}`;
        const raws = S.mode === 'so' ? c.strict.map((v) => JSON.stringify({ intent: v, confidence: 0.9 })) : c.raw;
        const res = raws.map((r) => parse(r, S.mode === 'so' ? 'strict' : parser.sel.value));
        const okRes = res.filter((r) => r.ok), fails = res.length - okRes.length, distinct = new Set(okRes.map((r) => r.v));
        const selfConf = okRes.filter((r) => typeof r.c === 'number').map((r) => r.c), avgConf = selfConf.length ? selfConf.reduce((a, b) => a + b, 0) / selfConf.length : 0;
        left.replaceChildren(el('h4', { text: 'Generative LLM: 5 lần gọi' }), ...raws.map((r, i) => runRow(i, r, res[i])),
          el('div', { class: 'stat', html: `<span>Parse hỏng: <b class="${fails ? 'bad' : 'ok'}">${fails}/5</b></span><span>Quyết định khác nhau: <b>${distinct.size}</b></span><span>Confidence tự viết TB: <b>${avgConf ? avgConf.toFixed(2) : '–'}</b></span>` }));

          el('div', { class: 'hint', text: 'Cùng request thì cùng phân phối. README: phần lớn đáp án giống hệt nhau qua nhiều lần gọi; ca ranh giới vẫn có thể dao động nhỏ.' }));

        const promptTxt = llmPrompt(c.msg), inTok = tokCount(promptTxt), outTok = Math.round(raws.reduce((a, r) => a + tokCount(r), 0) / raws.length);
        const dmTok = tokCount(dmRequest(c.msg));

        cmp.innerHTML = `<table><tr><th></th><th>Generative LLM</th><th>Decision model (Jev)</th><th>Nguồn</th></tr>
<tr><td>Output</td><td>Chuỗi, cần parse</td><td>Phân phối trên đúng 5 option</td><td>README §1.2</td></tr>
<tr><td>Độ trễ</td><td>1,9–13,5 giây</td><td>103 ms trung bình</td><td>README §1.8, thử nghiệm của TypeSafe (request 8 câu Choice)</td></tr>
<tr><td>Token input / request</td><td class="mono">≈ ${inTok}</td><td class="mono">≈ ${dmTok}</td><td>Đếm thô từ chuỗi trong hình</td></tr>
<tr><td>Token output / request</td><td class="mono">≈ ${outTok}</td><td class="mono">0 tính phí</td><td>Jev không tính output</td></tr>
<tr><td>Chi phí / ngày (${n.toLocaleString('vi-VN')} ticket)</td><td class="mono">$${(llmCost * n).toFixed(2)}</td><td class="mono">$${(dmCost * n).toFixed(3)}</td><td>LLM: giá giả định; Jev: $0.042/1M (README)</td></tr>
<tr><td>Rủi ro parse (5 lần trong hình)</td><td class="${fails ? 'bad' : 'ok'}">${fails}/5 hỏng</td><td class="ok">0, không parse</td><td>Tính từ chuỗi trong hình</td></tr>
<tr><td>Đổi quyết định khi hỏi lại</td><td>Có bài hơn 15%</td><td>TB 4,0%, tối đa 6,7%</td><td>README §1.8, 40 bài ranh giới × 15 lần</td></tr>
<tr><td>Độ bất định đọc được</td><td>Không: confidence là chữ model viết</td><td>Có: xác suất từng option</td><td>README §1.5</td></tr></table>`;

        const f = [];
        if (fails) f.push(note('var(--bad)', `<b>${fails}/5 lần gọi không dùng được.</b> ${[...new Set(res.filter((r) => !r.ok).map((r) => r.why))].join('; ')}. Cơ chế: model sinh văn bản tự do, chữ "đổi trả" hay một câu dẫn trước JSON đều là output hợp lệ với nó. Không có nghĩa model kém: nó đang làm việc của System 2 cho một câu hỏi System 1. <br>Trong hệ thống thật: hoặc ép format bằng structured output, hoặc dùng hợp đồng chọn-trong-danh-sách để bỏ hẳn bước parse.`));
        if (S.mode === 'so' && distinct.size > 1) f.push(note('var(--warn)', `<b>Format đúng 5/5 nhưng ra ${distinct.size} đội khác nhau: ${[...distinct].join(', ')}.</b> Constrained decoding chỉ chặn token không hợp lệ; việc chọn giữa hai token hợp lệ vẫn là lấy mẫu khi sinh. Không có nghĩa structured output vô dụng. <br>Trong hệ thống thật: đo self-consistency; quyết định lặp lại nhiều lần thì cần một con số ổn định và đọc được.`));
        if (avgConf >= 0.85 && sorted[0][1] < 0.7) f.push(note('var(--warn)', `<b>LLM tự ghi confidence ${avgConf.toFixed(2)}, trong khi decision model chỉ cho ${sorted[0][0]} ${sorted[0][1].toFixed(2)}.</b> ${S.c === 'oos' ? 'Tin này còn không thuộc đội nào.' : 'Tin này thật sự chia đôi giữa hai đội.'} Số 0.9 là chữ model viết theo thói quen, không đo gì cả: tin rõ hay mơ hồ đều 0.9. <br>Trong hệ thống thật: không đặt ngưỡng trên confidence tự viết.`));
        if (!f.length) f.push(note('var(--ok)', '<b>Ca dễ: cả hai cách cùng ra một đội.</b> Khác biệt nằm ở độ trễ, chi phí và việc bạn có biết ca này dễ hay không. Chọn ticket khác để thấy chỗ hai cách tách nhau.'));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
