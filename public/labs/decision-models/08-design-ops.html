const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<div class="verdict"><b>Bài học của lab:</b> mọi metric phải tính <b>theo từng lớp</b>, nhất là lớp hiếm mà sai thì đắt. Không có tài liệu chính thức nào nói về chất lượng decision model trên tiếng Việt (README ghi chưa xác minh), nên tập có nhãn của chính bạn là nguồn duy nhất đáng tin.</div>`,

    p: 'Cần gán nhãn vài trăm ticket thật, giữ riêng một phần, và chạy lại eval mỗi khi đổi câu hỏi, version hay provider. Ngưỡng chặt cho lớp critical làm giảm coverage, nghĩa là nhiều ticket hơn cho người xem.'

  gen(seed, shift) {
    const rnd = seeded(seed), C = ['billing', 'orders', 'account', 'fraud'], prior = [0.35, 0.40, 0.20, 0.05];
    return Array.from({ length: 800 }, () => {
      let u = rnd(), y = 0;
      while (y < 3 && u > prior[y]) { u -= prior[y]; y++; }
      const p0 = 1 - 0.6 * Math.pow(rnd(), 3), p = Math.min(0.999, p0 + (shift || 0));
      const ok = rnd() < (C[y] === 'fraud' ? Math.max(0.05, p0 - 0.3) : p0);
      let pred = y;
      if (!ok) pred = C[y] === 'fraud' ? (rnd() < 0.8 ? 0 : 2) : rnd() < 0.1 ? 3 : [0, 1, 2].filter((c) => c !== y)[rnd() < 0.5 ? 0 : 1];
      const fz = C[y] === 'fraud' ? 0.15 + 0.8 * rnd() : 0.25 * rnd() * rnd() + (rnd() < 0.05 ? 0.3 * rnd() : 0);
      return { y: C[y], pred: C[pred], p, fz };
    });
  },

  poc: {
    goal: "<b>POC này không gọi model nào.</b> Cả nhãn lẫn xác suất \"model trả về\" đều là số <b>tổng hợp</b> sinh bằng numpy, không phải đáp án thật của decision model. Tập 4.000 ticket (seed cố định; cùng cách sinh với lab, khác bộ số ngẫu nhiên): ba lớp thường calibrate tốt, lớp fraud 5% tự tin quá mức và hay bị đoán là billing. Code thật quét ngưỡng, tính precision theo lớp, ngưỡng theo lớp, câu sàng lọc, drift và chi phí; chi phí mỗi loại lỗi là giả định.",
    file: "docs/decision-models/pocs/08_design_ops.py",
    run: "uv run docs/decision-models/pocs/08_design_ops.py",
    needs: "chỉ <code>uv</code>, <code>numpy</code> và CPU, miễn phí. Lần chạy đầu <code>tiktoken</code> tải file từ vựng vài MB.",
    output: "Tập có nhãn TỔNG HỢP (numpy, seed 7): 4000 ticket, fraud 5%. Ba lớp thường calibrate tốt;\nlớp fraud bị tự tin quá mức và hay bị đoán là billing (cùng cách sinh với lab, khác bộ số ngẫu nhiên).\nChi phí giả định: người xem $0.5, chuyển sai $2, fraud lọt $50.\n\n1. Ngưỡng nào đạt mục tiêu precision 95%? (cột lớp = tỉ lệ đúng của ticket tự động có nhãn thật thuộc lớp đó)\nCấu hình                             Coverage  Precision  billing  orders  account  fraud  Fraud lọt  Chi phí\n-----------------------------------  --------  ---------  -------  ------  -------  -----  ---------  -------\nNgưỡng chung 0.70                    79.2%     91.3%      93%      93%     91%      67%    52         $3,461\nNgưỡng chung 0.85 (precision ≥ 95%)  62.3%     95.1%      97%      97%     95%      69%    36         $2,729\nNgưỡng theo lớp dự đoán              61.7%     95.1%      95%      99%     93%      32%    32         $2,542\nChung 0.85 + sàng fraud fz<0.3       59.0%     96.0%      97%      97%     95%      55%    9          $1,442\nTheo lớp + sàng fraud fz<0.3         59.9%     96.1%      95%      99%     93%      12%    7          $1,326\n   Ngưỡng theo lớp dự đoán: {'billing': 0.875, 'orders': 0.71, 'account': 0.92}, fraud dự đoán → luôn người xem\n   Fraud bị đoán thành billing nên ngưỡng riêng của lớp fraud không chạm tới; chỉ câu yes/no sàng lọc mới bắt.\n\n2. Drift: version mới tự tin hơn 0.05 ở mọi đáp án, độ đúng không đổi, ngưỡng giữ nguyên\nCấu hình                Coverage  Precision  billing  orders  account  fraud  Fraud lọt  Chi phí\n----------------------  --------  ---------  -------  ------  -------  -----  ---------  -------\nTrước, ngưỡng 0.85      62.3%     95.1%      97%      97%     95%      69%    36         $2,729\nSau drift, ngưỡng 0.85  69.3%     93.5%      95%      95%     94%      66%    46         $3,184\n   Coverage tăng, precision giảm mà code không đổi dòng nào: chạy lại eval khi đổi version.\n\n3. Chi phí fan-out (state 1.500 token, 10 câu hỏi × 40 token, $0.042/1M)\nCách gửi                         Token/ticket  Chi phí / 1M ticket\n-------------------------------  ------------  -------------------\n10 request, mỗi câu một request  15400         $646.80\n1 request gộp 10 câu             1900          $79.80\n   State gọn 97 token vs state 'cho chắc' (40 đơn cũ, 20 ticket cũ) 1987 token (o200k): 20.5× tiền mỗi request.\n   Độ dài JSON: 285 vs 5152 ký tự.\n\nRút ra: precision trung bình 95% vẫn để fraud lọt vì lớp 5% đóng góp ít vào trung bình và bị đoán thành billing;\nđo theo từng lớp, thêm câu yes/no sàng lọc cho lớp nguy hiểm, và chạy lại eval khi version đổi.",
    measured: true,

  mount(stage) {
    const C = ['billing', 'orders', 'account', 'fraud'], D = this.gen(7, 0), N = D.length;
    const S = { t: 0.85, per: false, th: { billing: 0.85, orders: 0.85, account: 0.85, fraud: 0.85 }, scr: false, tf: 0.3, target: 0.95 };
    const COST = { human: 0.5, wrong: 2, fraud: 50 };
    const flagBox = (f) => el('div', { style: 'border-left:3px solid var(--warn);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:13.5px;line-height:1.55', html: `<b style="color:var(--warn)">Bất thường:</b> ${f.what}<br><b>Vì sao:</b> ${f.why}<br><b>Không có nghĩa là:</b> ${f.not}<br><b>Trong hệ thống thật:</b> ${f.real}` });
    const thr = (d) => (S.per ? S.th[d.pred] : S.t);
    function metrics(th) {
      const auto = D.filter((d) => d.p >= th(d) && !(S.scr && d.fz >= S.tf)), ok = auto.filter((d) => d.pred === d.y);
      const cls = C.map((c) => { const n = D.filter((d) => d.y === c).length, a = auto.filter((d) => d.y === c), g = a.filter((d) => d.pred === d.y).length; return { c, n, a: a.length, g, acc: a.length ? g / a.length : null, rec: n ? g / n : 0 }; });
      const missF = auto.filter((d) => d.y === 'fraud' && d.pred !== 'fraud').length, wrong = auto.length - ok.length - missF;
      const cost = (N - auto.length) * COST.human + wrong * COST.wrong + missF * COST.fraud + (N * 800 * 0.042) / 1e6;
      return { cov: auto.length / N, prec: auto.length ? ok.length / auto.length : 1, cls, missF, wrong, cost, human: N - auto.length };
    }
    const W = 560, H = 190, P = 34, svg = el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 26}`, role: 'img', 'aria-label': 'Coverage, precision và độ đúng lớp fraud theo ngưỡng' });
    const x = (t) => P + ((t - 0.4) / 0.59) * (W - 2 * P), y = (v) => H - 6 - v * (H - 16);
    const sweep = Array.from({ length: 60 }, (_, i) => 0.4 + i * 0.01).map((t) => { const m = metrics(() => t), f = m.cls[3]; return [t, m.cov, m.prec, f.acc]; });
    const line = (k, col) => el('path', { d: sweep.filter((s) => s[k] !== null).map((s, i) => (i ? 'L' : 'M') + x(s[0]).toFixed(1) + ' ' + y(s[k]).toFixed(1)).join(' '), stroke: col, 'stroke-width': 2.5, fill: 'none' });
    const tbl = el('div', { class: 'sum tbl', style: 'border:0;margin:0;padding:0' }), stat = el('div', { class: 'stat' }), flagHost = el('div'), perBox = el('div', { class: 'row' });
    function render() {
      const m = metrics(thr), f = m.cls[3];
      svg.replaceChildren(
        el('line', { x1: P, x2: W - P, y1: y(0), y2: y(0), stroke: 'var(--line)' }),
        el('line', { x1: P, x2: W - P, y1: y(S.target), y2: y(S.target), stroke: 'var(--line)', 'stroke-dasharray': '4 3' }),
        el('text', { x: P + 2, y: y(S.target) - 4, class: 'mute', text: 'mục tiêu ' + S.target.toFixed(2) }),
        line(1, 'var(--g1)'), line(2, 'var(--accent)'), line(3, 'var(--bad)'),
        S.per ? el('g') : el('line', { x1: x(S.t), x2: x(S.t), y1: 6, y2: H - 6, stroke: 'var(--ink)', 'stroke-width': 1.5 }),
        ...[0.4, 0.6, 0.8, 0.99].map((t) => el('text', { x: x(t) - 10, y: H + 16, class: 'mute', text: String(t) })),
        ...[0, 0.5, 1].map((v) => el('text', { x: 2, y: y(v) + 4, class: 'mute', text: String(v) })));
      tbl.innerHTML = '<table><tr><th>Lớp thật</th><th>Số ticket</th><th>Tự động</th><th>Đúng đội / tự động</th><th>Recall (đúng tự động / tổng)</th></tr>' +
        m.cls.map((c) => { const bad = c.acc !== null && c.acc < S.target; return `<tr${bad ? ' style="color:var(--bad)"' : ''}><td><b>${c.c}</b></td><td class="mono">${c.n}</td><td class="mono">${c.a}</td><td class="mono">${c.acc === null ? 'không có' : (c.acc * 100).toFixed(1) + '%'}</td><td class="mono">${(c.rec * 100).toFixed(1)}%</td></tr>`; }).join('') +
        `<tr class="cur"><td><b>Tổng</b></td><td class="mono">${N}</td><td class="mono">${N - m.human}</td><td class="mono"><b>${(m.prec * 100).toFixed(1)}%</b></td><td class="mono">coverage ${(m.cov * 100).toFixed(1)}%</td></tr></table>`;
      stat.innerHTML = `<span>Người xem: <b>${m.human}</b></span><span>Chuyển sai đội: <b>${m.wrong}</b></span><span>Lừa đảo lọt: <b class="${m.missF ? 'bad' : 'ok'}">${m.missF}</b></span><span>Chi phí ước tính: <b>$${m.cost.toFixed(0)}</b> / 800 ticket</span><span>Trong đó decision model: <b>$${((N * 800 * 0.042) / 1e6).toFixed(4)}</b></span>`;
      let fl = null;
      if (m.prec >= S.target && f.acc !== null && f.acc < S.target) fl = { what: `Precision tổng ${(m.prec * 100).toFixed(1)}% đạt mục tiêu, nhưng trong ${f.a} ticket fraud được tự động chỉ ${(f.acc * 100).toFixed(0)}% đi đúng đội: ${m.missF} vụ lừa đảo bị chuyển như ticket thường.`, why: 'Fraud chỉ khoảng 5% tập nên lỗi của nó gần như không kéo trung bình. Và trên lớp này model tự tin quá mức: xác suất 0.9 nhưng đúng ít hơn nhiều (xem câu hỏi 5 về calibration).', not: 'Không có nghĩa ngưỡng hay model vô dụng. Ba lớp còn lại vẫn đúng như số xác suất nói.', real: 'Tính metric theo từng lớp và gán chi phí riêng cho lỗi lớp critical. Bật câu yes/no sàng lọc fraud với ngưỡng thấp (README §4.3 screen trước, §4.4 hạ ngưỡng khi bỏ sót đắt).' };
      else if (S.per && S.th.fraud > S.t && m.missF > 0 && !S.scr) fl = { what: `Đã nâng ngưỡng lớp fraud lên ${S.th.fraud.toFixed(2)} mà vẫn còn ${m.missF} vụ lừa đảo lọt.`, why: 'Ngưỡng áp lên lớp model chọn, không phải lớp thật. Vụ lọt là ticket lừa đảo mà model chọn billing hoặc account, nên chỉ ngưỡng của billing và account chạm tới chúng.', not: 'Không có nghĩa ngưỡng riêng vô ích: ngưỡng fraud kiểm soát ticket thường bị gắn nhầm là lừa đảo.', real: 'Thêm một câu yes/no hẹp "có dấu hiệu lừa đảo không" chạy cho mọi ticket, ngưỡng thấp, trên ngưỡng thì không tự động (bật ô sàng lọc).' };
      flagHost.replaceChildren(fl ? flagBox(fl) : el('span'));
    }
    const gT = slider('Ngưỡng chung P(option được chọn)', 0.4, 0.99, 0.01, S.t, (v) => { S.t = v; if (!S.per) C.forEach((c) => (S.th[c] = v)); buildPer(); render(); }, (v) => v.toFixed(2));
    function buildPer() {
      perBox.replaceChildren(...(S.per ? C.map((c) => slider('Ngưỡng ' + c, 0.4, 0.99, 0.01, S.th[c], (v) => { S.th[c] = v; render(); }, (v) => v.toFixed(2)).node) : []));
    }
    const perCb = el('input', { type: 'checkbox' }), scrCb = el('input', { type: 'checkbox' });
    perCb.addEventListener('change', () => { S.per = perCb.checked; buildPer(); render(); });
    scrCb.addEventListener('change', () => { S.scr = scrCb.checked; render(); });
    stage.append(
      el('div', { class: 'row' }, [gT.node, slider('Mục tiêu precision', 0.8, 0.99, 0.01, S.target, (v) => { S.target = v; render(); }, (v) => v.toFixed(2)).node]),
      el('div', { class: 'row' }, [el('label', { class: 'ctl' }, [perCb, ' Ngưỡng riêng từng lớp']), el('label', { class: 'ctl' }, [scrCb, ' Câu yes/no sàng lọc possible_fraud']), slider('Ngưỡng possible_fraud', 0.05, 0.9, 0.01, S.tf, (v) => { S.tf = v; render(); }, (v) => v.toFixed(2)).node]),
      perBox, svg,
      el('div', { class: 'legend', html: '<span><i style="background:var(--g1)"></i>Coverage</span><span><i style="background:var(--accent)"></i>Precision tổng</span><span><i style="background:var(--bad)"></i>Fraud: đúng đội / tự động</span><span>Vạch đen: ngưỡng chung hiện tại</span>' }),
      tbl, stat, flagHost,
      el('p', { class: 'hint', text: 'Dữ liệu giả lập, sinh trong trình duyệt với seed cố định: 800 ticket, tỉ lệ billing 35%, orders 40%, account 20%, fraud 5% (giả định). Ba lớp thường được calibrate tốt; lớp fraud tự tin quá mức 0.3. Các đường cong luôn tính với ngưỡng chung và không có sàng lọc. Chi phí giả định: người xem $0.5/ticket, chuyển sai đội $2, lừa đảo lọt $50. Chi phí decision model: 800 token/ticket × $0.042/1M (giá Jev từ README).' }));
    render();
  }
});
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
