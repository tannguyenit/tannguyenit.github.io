const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';

        a: `<p>ECE (Expected Calibration Error) gom bảng trên thành một số: mỗi khoảng lấy |p trung bình − tỉ lệ đúng|, nhân với tỉ lệ đáp án rơi vào khoảng đó, rồi cộng lại. Khoảng đông ticket nặng ký hơn khoảng thưa.</p>
<p>ECE là thước đo phổ biến trong nghiên cứu, README không dùng tên này nhưng mô tả đúng phép so đó. Hai điểm cần biết:</p>
<ul><li>ECE <b>không có dấu</b>. 0.08 có thể là tự tin quá mức hoặc rụt rè. Phải nhìn biểu đồ để biết hướng.</li>
<li>ECE <b>phụ thuộc số mẫu và số khoảng</b>. Tập nhỏ chia nhiều khoảng thì mỗi khoảng ít ticket, tỉ lệ đúng dao động, ECE tăng dù model calibrate hoàn hảo.</li></ul>
<p>Bảng dưới tính ECE của một model <b>calibrate hoàn hảo</b> (T = 1) với số ticket và số khoảng khác nhau. Lẽ ra phải bằng 0.</p>`,
        viz(box) {

            el('div', { class: 'cap', text: 'Mỗi ô là ECE trung bình của 5 tập giả định khác nhau, tính thật trong trình duyệt. Đỏ khi ECE > 0.04: con số trông như model lệch calibration, nhưng thực ra chỉ là nhiễu do ít mẫu.' }));

        take: 'Đọc ECE kèm số mẫu và biểu đồ. Với vài trăm ticket, ECE khoảng 0.03–0.05 có thể chỉ là nhiễu; dùng 10 khoảng như README gợi ý, đừng chia quá mịn.'
      },
      {
        q: 'LLM với structured output cũng trả được field confidence. Sao không dùng nó?',
        a: `<p>README kể đúng tình huống này: bạn thêm field <code>confidence</code> vào JSON Schema. Model ghi 0.9 cho tin rõ ràng và cũng ghi 0.9 cho tin mơ hồ, vì <b>con số đó là văn bản model viết ra, không phải xác suất model tính</b>.</p>
<p>Decision model thì khác: nó không viết chữ nào, mà đọc input một lượt (prefill) rồi chấm điểm mọi option cùng lúc, và phần chấm điểm được huấn luyện cho calibration. Cloudflare mô tả Clef dùng Brier loss (phạt khi con số xa kết quả thật, xem mục thuật ngữ) và mục tiêu RLCD (Reinforcement Learning for Calibrated Decisions: thưởng khi xác suất cao đi kèm khả năng đúng cao).</p>
<p>Còn LLM chat thường được tinh chỉnh bằng RLHF: huấn luyện theo đánh giá của người chấm. TypeSafe nói họ không dùng RLHF vì nó dạy model nói điều người thích nghe, có thể thưởng cho câu bịa nghe tự tin, và dồn xác suất vào một kiểu output. Không bước nào trong đó dạy model rằng "0.9" phải đúng 9 trên 10 lần.</p>
<p>Mô phỏng dưới cùng 1.000 ticket: "LLM" ghi 0.9 cho phần lớn ticket bất kể đúng sai (giả định), decision model báo p_max calibrate. Cùng ngưỡng 0.85:</p>`,
        viz(box) {
          const set = makeSet(1000, 7), dm = reported(set, 1), rnd = seeded(91);
          const llm = set.map((r) => ({ p: rnd() < 0.85 ? 0.9 : 0.7, ok: r.ok }));

            `<tr><td>LLM tự ghi confidence</td><td class="mono">${pc(b.cov)}</td><td class="mono bad">${pc(b.prec)}</td><td class="mono">${e2.toFixed(3)}</td></tr>`),
            el('div', { class: 'cap', text: `Với "LLM", ticket vượt ngưỡng có precision ${pc(b.prec)}, gần bằng tỉ lệ đúng chung ${pc(accOf(dm))}: con số 0.9 không tách được ticket dễ khỏi ticket khó. Hành vi LLM ở đây là giả định để minh hoạ điều README mô tả, không phải số đo.` }));
        },
        take: 'Ngưỡng chỉ có tác dụng khi con số cao thật sự đi kèm tỉ lệ đúng cao. Confidence do LLM tự viết không có tính chất đó.'
      },
      {
        q: 'Jev trả cả probabilities lẫn confidence. Hai số khác nhau thế nào?',
        a: `<p><code>confidence</code> tóm tắt <b>hình dạng</b> phân phối, không phải xác suất đáp án đúng. Với Choice có n option, Jev công bố:</p>
<p><code>confidence = (p_max − 1/n) / (1 − 1/n)</code></p>
<p>Phân phối đều cho 0, dồn hết vào một option cho 1. Vì chỉ phụ thuộc p_max, cùng confidence 0.5 ứng với p_max khác nhau tuỳ số option: 2 option cần 0.75, 10 option chỉ cần 0.55. Đặt ngưỡng "confidence ≥ 0.5" nghĩa là chấp nhận tới 45% rủi ro sai khi có 10 option.</p>
<p>Với Score, confidence tính thêm khoảng cách giữa các mức: <code>spread = Σ p_i · |i − m|</code>, <code>MAD_unif = (1/n) · Σ |i − (n−1)/2|</code>, <code>confidence = max(0, 1 − spread / MAD_unif)</code>, với m là mức có xác suất cao nhất.</p>`,
        viz(box) {
          const out = el('div', { class: 'stat' }), sc = el('div', { class: 'stat' });
          let n = 4, pm = 0.7;
          const draw = () => {
            const p = Math.max(pm, 1 / n), c = (p - 1 / n) / (1 - 1 / n);
            out.innerHTML = `<span>n = <b>${n}</b></span><span>p_max = <b>${p.toFixed(2)}</b></span><span>confidence = <b>${c.toFixed(3)}</b></span><span>rủi ro chọn sai ≈ <b>${pc(1 - p, 0)}</b></span>`;
          };
          const scoreConf = (ps) => { const N = ps.length, m = ps.indexOf(Math.max(...ps)), spread = ps.reduce((s, p, i) => s + p * Math.abs(i - m), 0), mad = ps.reduce((s, _, i) => s + Math.abs(i - (N - 1) / 2), 0) / N; return { score: ps.reduce((s, p, i) => s + p * i, 0), conf: Math.max(0, 1 - spread / mad) }; };
          const presets = [['1,0,0', [0, 1, 0]], ['0,.5,.5', [0, 0.5, 0.5]], ['.5,0,.5', [0.5, 0, 0.5]]];
          const drawS = (k) => { const ps = presets[k][1], r = scoreConf(ps); sc.innerHTML = `<span>Score 3 mức, xác suất (${ps.join(', ')})</span><span>score = <b>${r.score.toFixed(2)}</b></span><span>confidence = <b>${r.conf.toFixed(2)}</b></span>`; };
          box.append(el('div', { class: 'row' }, [slider('Số option n', 2, 10, 1, n, (v) => { n = v; draw(); }).node, slider('p_max', 0.1, 1, 0.01, pm, (v) => { pm = v; draw(); }, (v) => v.toFixed(2)).node]), out,
            el('div', { class: 'row', style: 'margin-top:12px' }, [select('Phân phối Score', presets.map(([t], i) => [i, t]), 1, (v) => drawS(+v)).node]), sc,
            el('div', { class: 'cap', text: 'Công thức từ docs Jev, tính trực tiếp. p_max nhỏ hơn 1/n được nâng lên 1/n vì không thể xảy ra. (0, .5, .5) cho 0.25 vì phân vân giữa hai mức kề; (.5, 0, .5) cho 0 vì phân vân giữa hai đầu thang, dù score cùng bằng 1.0 với (0, 1, 0).' }));
          draw(); drawS(1);
        },
        take: 'Với Choice, đặt ngưỡng trên xác suất của option sắp hành động, không trên confidence. Confidence hữu ích nhất ở Score để biết đáp án đã "ổn định" chưa.'
      },
      {
        q: 'Score có confidence cao thì yên tâm rẽ nhánh theo score được chưa?',
        a: `<p>Chưa, nếu quyết định của bạn phụ thuộc vào một <b>ranh giới</b>. README (§1.5, §4.4) cảnh báo: một đáp án chia đều giữa hai mức kề nhau có score lẻ và confidence khá cao, vì hai mức kề nhau chỉ làm confidence giảm ít. Nhưng về quyết định "có gọi người trực không", đó là 50/50.</p>
<p>ShopViet dùng thang 4 mức cho tác động lên khách: Không ảnh hưởng, Nhẹ, Nặng, Nghiêm trọng (giống ví dụ của Cloudflare). Quy tắc: từ mức 2 (Nặng) trở lên thì gọi kỹ sư trực. Cách đúng là cộng xác suất các mức từ 2 trở lên, không làm tròn score.</p>`,
        viz(box) {
          const L = ['Không ảnh hưởng', 'Nhẹ', 'Nặng', 'Nghiêm trọng'];
          const P = [[0, 0.05, 0.9, 0.05], [0, 0.5, 0.5, 0], [0.05, 0.45, 0.5, 0], [0.5, 0, 0, 0.5], [0.1, 0.6, 0.25, 0.05]];
          const out = el('div');
          function draw(k) {
            const ps = P[k], m = ps.indexOf(Math.max(...ps)), sp = ps.reduce((s, p, i) => s + p * Math.abs(i - m), 0), mad = ps.reduce((s, _, i) => s + Math.abs(i - 1.5), 0) / 4;
            const conf = Math.max(0, 1 - sp / mad), score = ps.reduce((s, p, i) => s + p * i, 0), up = ps[2] + ps[3], round = Math.round(score) >= 2;
            const risky = conf >= 0.4 && up > 0.35 && up < 0.65;
            out.replaceChildren(hbars(ps.map((p, i) => [`${i} · ${L[i]}`, p, i >= 2]), { max: 1, fmt: (v) => v.toFixed(2) }),
              el('div', { class: 'stat', html: `<span>score = <b>${score.toFixed(2)}</b></span><span>confidence = <b>${conf.toFixed(2)}</b></span><span>P(mức ≥ 2) = <b>${up.toFixed(2)}</b></span><span>làm tròn score: <b>${round ? 'gọi người trực' : 'không gọi'}</b></span>` }),
              risky ? flag('warn', `<b>Confidence ${conf.toFixed(2)} trông ổn, nhưng quyết định là ${pc(up, 0)} / ${pc(1 - up, 0)}.</b> Score ${score.toFixed(2)} đứng ngay ranh giới; làm tròn thành "${round ? 'gọi' : 'không gọi'}" là tung đồng xu. Điều này không có nghĩa model kém: nó báo đúng là đang phân vân giữa hai mức kề. Trong hệ thống thật: rẽ nhánh theo P(mức ≥ 2) với ngưỡng riêng, và cho vùng giữa một đường xử lý riêng.`) : el('span'));
          }
          box.append(el('div', { class: 'row' }, [select('Đáp án', P.map((p, i) => [i, p.join(' / ')]), 1, (v) => draw(+v)).node]), out,
            el('div', { class: 'cap', text: 'Score và confidence tính bằng công thức Jev. Thanh đậm là các mức từ 2 trở lên. Phân phối là ví dụ giả định.' }));
          draw(1);
        },
        take: 'Ranh giới quan trọng thì cộng xác suất các mức phía đó. Score lẻ cộng confidence cao không có nghĩa là quyết định chắc chắn.'
      },
      {
        q: 'Nếu đo xong thấy model tự tin quá mức thì sửa thế nào? Đổi model?',
        a: `<p>Chưa cần. Nếu model xếp thứ tự đúng (ticket dễ có p cao hơn ticket khó) nhưng con số bị phóng đại, có hai cách rẻ:</p>
<ol><li><b>Đặt ngưỡng theo precision đo được</b> thay vì theo con số. Muốn sai dưới 10% thì tìm ngưỡng mà precision trên tập có nhãn ≥ 90%, dù ngưỡng đó là 0.97.</li>
<li><b>Hiệu chỉnh lại xác suất</b> bằng temperature scaling: nâng mỗi xác suất lên luỹ thừa 1/T rồi chuẩn hoá lại, chọn T làm khớp nhất với tập có nhãn. Đây là kỹ thuật chung, không phải tính năng của provider nào.</li></ol>
<p>README có một ví dụ thật về nhiệt độ: Bespoke Nimble 9B v2 dùng temperature 2.179 <b>lấy lại từ v1, chưa fit cho v2</b>. Hệ số hiệu chỉnh gắn với một version model; đổi version mà giữ hệ số cũ là mất calibration âm thầm.</p>
<p>Chọn T bằng cách nào? Thử nhiều T, mỗi T tính <b>log loss</b> trên tập có nhãn: trung bình của −log(xác suất gán cho đội đúng). Gán 0.9 cho đội đúng bị phạt 0.11; nói 0.99 cho một đội sai (nên đội đúng chỉ còn khoảng 0.003) bị phạt khoảng 5.8. Model nói quá chắc mà sai bị phạt nặng, nên T có log loss nhỏ nhất là T làm con số vừa đúng mức tự tin.</p>
<p>Dưới đây: model giả định tự tin quá mức (nhiệt độ nội tại 0.55). Trình duyệt thử các T từ 0.5 đến 3, chọn T có log loss nhỏ nhất trên 1.000 ticket.</p>`,
        viz(box) {
          const set = makeSet(1000, 21), raw = set.map((r) => softmax(r.z, 0.55));
          const resc = (q, T) => { const e = q.map((x) => Math.pow(Math.max(x, 1e-12), 1 / T)), s = e.reduce((a, b) => a + b, 0); return e.map((x) => x / s); };
          let best = 1, bestL = Infinity; const curve = [];
          for (let T = 0.5; T <= 3.0001; T += 0.05) { let L = 0; raw.forEach((q, i) => { L -= Math.log(Math.max(resc(q, T)[set[i].y], 1e-12)); }); L /= raw.length; curve.push([T, L]); if (L < bestL) { bestL = L; best = T; } }
          const rowsAt = (T) => raw.map((q, i) => ({ p: resc(q, T)[set[i].pred], ok: set[i].ok }));
          const before = rowsAt(1), after = rowsAt(best), cb = cut(before, 0.9), ca = cut(after, 0.9);
          const W = 520, H = 120, mn = Math.min(...curve.map((c) => c[1])), mx = Math.max(...curve.map((c) => c[1]));
          const x = (T) => 30 + ((T - 0.5) / 2.5) * (W - 40), y = (L) => 10 + (1 - (L - mn) / (mx - mn || 1)) * (H - 20);
          box.append(el('svg', { class: 'canvas', viewBox: `0 0 ${W} ${H + 20}`, role: 'img', 'aria-label': 'Log loss theo T' }, [
            el('path', { d: curve.map(([T, L], i) => (i ? 'L' : 'M') + x(T).toFixed(1) + ' ' + y(L).toFixed(1)).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }),
            el('circle', { cx: x(best), cy: y(bestL), r: 5, fill: 'var(--ok)' }),
            el('text', { x: Math.min(W - 120, x(best) + 8), y: y(bestL) - 6, text: `T tốt nhất ≈ ${best.toFixed(2)}` }),
            ...[0.5, 1, 1.5, 2, 2.5, 3].map((t) => el('text', { x: x(t) - 8, y: H + 16, class: 'mute', text: String(t) }))]),
            tableBox('<tr><th></th><th>ECE</th><th>Ngưỡng 0.9: coverage</th><th>Ngưỡng 0.9: model hứa</th><th>Ngưỡng 0.9: precision thật</th></tr>' +
              `<tr><td>Trước hiệu chỉnh</td><td class="mono bad">${eceOf(binsOf(before, 10)).toFixed(3)}</td><td class="mono">${pc(cb.cov)}</td><td class="mono">${cb.prom === null ? '—' : pc(cb.prom)}</td><td class="mono bad">${cb.prec === null ? '—' : pc(cb.prec)}</td></tr>` +
              `<tr><td>Sau hiệu chỉnh (T = ${best.toFixed(2)})</td><td class="mono ok">${eceOf(binsOf(after, 10)).toFixed(3)}</td><td class="mono">${pc(ca.cov)}</td><td class="mono">${ca.prom === null ? '—' : pc(ca.prom)}</td><td class="mono ok">${ca.prec === null ? '—' : pc(ca.prec)}</td></tr>`),
            el('div', { class: 'cap', text: 'T tìm được gần 1 / 0.55 ≈ 1.8, đúng lượng phóng đại đã cài. Sau hiệu chỉnh, ít ticket vượt 0.9 hơn nhưng precision của chúng khớp với lời hứa. Dữ liệu và độ lệch là giả định.' }));
        },
        take: 'Lệch calibration thường sửa được bằng một tham số fit trên tập có nhãn. Nhưng tham số đó thuộc về một version model; pin version và fit lại khi đổi.'
      },
      {
        q: 'Gửi ba câu hỏi về cùng một ticket trong một request: câu này có làm lệch câu kia?',
        a: `<p>Không. README §1.6: các câu hỏi cùng thấy một state nhưng được đánh giá độc lập; đáp án câu này không thành ngữ cảnh ẩn cho câu khác. TypeSafe kiểm tra trên 13 câu về bài Wikipedia GDPR (khoảng 54.000 ký tự): gửi chung một request và gửi 13 request riêng, mỗi cách lặp 5 lần. Phần lớn đáp án giống hệt nhau (độ lệch chuẩn bằng 0); hai câu dao động nhỏ, và dao động đó như nhau ở cả hai cách.</p>
<p>Còn tiền thì khác hẳn. State bị tính tiền một lần cho mỗi request. 13 request là trả 13 lần cho cùng bài viết. TypeSafe đo: gộp rẻ hơn 12,2 lần và nhanh hơn 10 lần.</p>
<p>Provider tính tiền theo <b>token</b>: mẩu chữ model đọc, tiếng Anh trung bình khoảng 4 ký tự một token. Máy tính dưới đếm token thuần (không tính overhead), giá Jev $0.042 / 1M token input từ README, output miễn phí.</p>`,

          const S = { s: 13500, n: 13, q: 60 }, out = el('div', { class: 'stat' });

            el('div', { class: 'cap', text: 'Mặc định 13.500 token ≈ 54.000 ký tự / 4 (ước lượng thô cho tiếng Anh) và 13 câu như thử nghiệm GDPR. Tỉ lệ tính ra gần 13 lần; TypeSafe đo thật 12,2 lần. State càng lớn so với câu hỏi, tỉ lệ càng tiến về số câu hỏi.' }));
          draw();
        },
        take: 'Mọi câu hỏi về cùng một state đi chung một request. Độc lập về đáp án, nhưng chung tiền state.'

    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
