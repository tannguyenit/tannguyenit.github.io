const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

<p>Từ đó ra hai lỗi cơ học, đều thấy trong POC với tin <i>"Cho mình đổi địa chỉ giao đơn SV-5120 sang Quận 3 nhé"</i> (logit là giả định, cách tách token là thật):</p>
<ol><li><b>Chỉ đọc token đầu:</b> doi_tra và doi_dia_chi cùng bắt đầu bằng "doi", nên nhận đúng một số: 0.848 và 0.848. Không tách được. Viết tiếng Việt có dấu cũng không thoát: "đổi trả" và "đổi địa chỉ" chung tới hai token đầu.</li>
<li><b>Nhân cả chuỗi:</b> doi_dia_chi dài hơn doi_tra 2 token, tức bị nhân thêm hai thừa số nhỏ hơn 1. Với mỗi token sau giả định 0.9, đó là 0.9 × 0.9 = 0.81. Kết quả: doi_tra 0.3436, doi_dia_chi 0.3401, chọn doi_tra dù nhánh "đổi địa chỉ" được model ưa hơn (0.55 so với 0.45).</li></ol>
<p>Không có nghĩa LLM hiểu sai tin nhắn. Điểm của nó bị bóp méo bởi cách tên option bị cắt. Trong hệ thống thật: decision model chấm một điểm cho cả option, nên tên dài hay ngắn, chung tiền tố hay không đều không ảnh hưởng. Phần 2 của hình chính cho bạn kéo các xác suất này (lab tách token đơn giản hơn, ở dấu gạch dưới).</p>`,
        take: 'Xác suất của LLM thường là theo token. Tên option dài hơn hoặc chung tiền tố là đủ để làm lệch kết quả, dù model hiểu đúng.'
      },
      {
        q: 'Thế sao không tự hỏi LLM rồi đọc logprob của token đầu? Cũng ra xác suất mà.',
        a: `<p>README gọi đây là "decision model nghèo", và Cloudflare đã thử hướng này trước Clef (đọc logprob DiffusionGemma sinh ra cho từng lựa chọn). Có hai vấn đề.</p>
<p><b>Một là cơ học</b>: câu hỏi ngay trên. Option chung token đầu bị gộp; nhân xác suất cả chuỗi thì option dài bị phạt.</p>
<p><b>Hai là xác suất không được huấn luyện để khớp tần suất đúng.</b> LLM chat thường đã qua RLHF: người chấm chọn câu trả lời họ thích hơn, model học theo. TypeSafe giải thích vì sao họ không dùng RLHF: RLHF dạy model nói điều người thích nghe, có thể thưởng cho câu bịa nghe tự tin, và gây <b>mode dropping</b>: dồn xác suất vào một kiểu output, bỏ các khả năng khác.</p>
<p>Hình dưới minh hoạ mode dropping bằng một phép tính đơn giản: lấy phân phối calibrate của ticket "giao thiếu sạc, bị trừ tiền" rồi nâng lũy thừa k và chuẩn hoá lại. k càng lớn càng "tự tin". Đây là minh hoạ khái niệm, không phải cách RLHF thật sự làm.</p>`,
        viz(box) {
          const base = [0.52, 0.41, 0.04, 0.02, 0.01], names = ['van_chuyen', 'thanh_toan', 'doi_tra', 'tu_van', 'bao_hanh'];
          const out = el('div'), stat = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });
          const sk = slider('Độ "dồn" k', 1, 8, 0.5, 1, draw, (v) => v.toFixed(1));
          function draw() {

      {
        q: 'Huấn luyện "cho calibration" là làm gì? Brier loss là gì?',
        a: `<p>Theo blog Cloudflare mà README dẫn, Clef được huấn luyện với cross-entropy có label smoothing cho output hợp lệ, cộng <b>Brier loss</b> để tinh chỉnh calibration, trên dữ liệu tổng hợp hoán vị thứ tự field, prompt và schema. Thêm mục tiêu RL tên RLCD, cho điểm một phần khi chọn mức liền kề trên thang có thứ tự.</p>
<p><b>Brier score</b> đo khoảng cách giữa phân phối dự đoán và đáp án đúng: tổng (p<sub>i</sub> − y<sub>i</sub>)², với y = 1 ở option đúng, 0 ở các option khác. Thấp hơn là tốt hơn. Nó phạt cả việc tự tin sai lẫn việc rụt rè khi đúng.</p>
<p>Chọn đáp án đúng bên dưới. Trình duyệt tính Brier và log loss cho hai model: một model calibrate (0.52 / 0.41) và một model tự tin thái quá (0.95 / 0.03). Dòng cuối là giá trị trung bình nếu đáp án đúng xuất hiện với tần suất 0.52 / 0.41 / ...</p>`,
        viz(box) {
          const names = ['van_chuyen', 'thanh_toan', 'doi_tra', 'tu_van', 'bao_hanh'], cal = [0.52, 0.41, 0.04, 0.02, 0.01], over = [0.95, 0.03, 0.01, 0.005, 0.005];
          const S = { t: 0 }, out = el('div'), cap = el('div', { class: 'cap' });
          const brier = (p, t) => p.reduce((a, x, i) => a + Math.pow(x - (i === t ? 1 : 0), 2), 0), logl = (p, t) => -Math.log(p[t]);
          const exp = (p, f) => cal.reduce((a, w, t) => a + w * f(p, t), 0);
          const st = select('Đáp án đúng', names.map((n, i) => [i, n]), 0, (v) => { S.t = +v; draw(); });
          function draw() {
            const t = S.t;
            out.innerHTML = `<table><tr><th></th><th>Brier (ticket này)</th><th>Log loss (ticket này)</th><th>Brier trung bình</th><th>Log loss trung bình</th></tr>
<tr><td>Calibrate (0.52 / 0.41 / …)</td><td class="mono">${brier(cal, t).toFixed(3)}</td><td class="mono">${logl(cal, t).toFixed(2)}</td><td class="mono ok">${exp(cal, brier).toFixed(3)}</td><td class="mono ok">${exp(cal, logl).toFixed(2)}</td></tr>
<tr><td>Tự tin thái quá (0.95 / 0.03 / …)</td><td class="mono">${brier(over, t).toFixed(3)}</td><td class="mono">${logl(over, t).toFixed(2)}</td><td class="mono bad">${exp(over, brier).toFixed(3)}</td><td class="mono bad">${exp(over, logl).toFixed(2)}</td></tr></table>`;
            cap.innerHTML = t === 0 ? 'Khi model tự tin đoán trúng, nó được điểm tốt hơn trên ticket này. Nhưng nhìn cột trung bình: trên nhiều ticket, model calibrate thắng.' : `<span class="bad">Đáp án là ${names[t]}: model tự tin thái quá bị phạt nặng</span> (log loss ${logl(over, t).toFixed(2)}). Loss trung bình là thứ huấn luyện tối ưu, nên model bị đẩy về phía nói đúng độ bất định thật.`;
          }
          box.append(el('div', { class: 'row' }, [st.node]), out, cap, el('div', { class: 'cap', text: 'Phân phối là ví dụ dựng sẵn. Công thức Brier và log loss là chuẩn; README không công bố trọng số các loss của Clef.' }));
          draw();

        el('p', { class: 'hint', text: 'Logit, xác suất token và các phân phối là số dựng sẵn để minh hoạ. Công thức softmax, score và confidence là công thức thật (confidence theo Jev, README §1.5).' }));
      drawA(); loadB(); drawT();
    }

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
