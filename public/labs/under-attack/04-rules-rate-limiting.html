const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

    poc: {

      file: "docs/under-attack/pocs/04_rules_rate_limiting.py",

      output: "=== 60 giây synthetic: 2062 request, 6 nhóm\nnhóm                           loại        request\n-----------------------------  ----------  -------\nBot A, 1 IP (python-requests)  tấn công    360\nBot B, 1 IP (Go-http-client)   tấn công    240\nBotnet 40 IP, UA giả Chrome    tấn công    160\nKhách lẻ, 4G riêng             khách thật  31\nVăn phòng 20 người, 1 IP NAT   khách thật  541\nApp, 60 thuê bao sau CGNAT     khách thật  730\n\n=== Đếm cao nhất của mỗi nhóm trong 1 cửa sổ 10 giây (không chặn gì) → ngưỡng gợi ý ×3–5 của README\npath eq \"/login\"                       theo IP               botA=61 botB=0 net=1 solo=3 office=43 cgnat=10 | người thật cao nhất 43 → ngưỡng 129–215\npath eq \"/login\" and method eq \"POST\"  theo IP có hỗ trợ NAT botA=61 botB=0 net=1 solo=2 office=2 cgnat=10 | người thật cao nhất 10 → ngưỡng 30–50\nstarts_with(path, \"/api/\")             theo IP               botA=0 botB=41 net=0 solo=6 office=87 cgnat=121 | người thật cao nhất 121 → ngưỡng 363–605\n\n=== Một rate limiting rule, nhiều cấu hình, cùng dòng request\ncấu hình                                       tấn công bị chặn  req khách bị chặn  khách bị challenge  người bị ảnh hưởng  botnet bị chặn  plan\n---------------------------------------------  ----------------  -----------------  ------------------  ------------------  --------------  ----------\nFree mặc định: /login, IP, 10/10s, Block 10s   39.7%             34                 0                   20/81               0               Free\nNhư trên + custom rule R2 (UA thư viện) trước  47.4%             34                 0                   20/81               0               Free\nFree, ngưỡng 129 (người thật cao nhất × 3)     0.0%              0                  0                   0/81                0               Free\nBusiness: POST /login, IP có hỗ trợ NAT        39.7%             0                  0                   0/81                0               Business\nPro: /api/, IP, 10/10s                         25.0%             982                0                   80/81               0               Pro\nEnterprise: /login, đếm theo User-Agent        45.9%             39                 0                   21/81               47              Enterprise\nFree, Managed Challenge (throttle)             46.1%             0                  34                  20/81               0               Free\nPro: /login, IP, Block 600s                    46.1%             34                 0                   20/81               0               Pro\n\n=== Cửa sổ trượt và cửa sổ cố định: 10 request lúc 9,5–9,9 s và 10 request lúc 10,0–10,4 s, ngưỡng 10 / 10 s\nfixed   : 20 / 20 request lọt trong chưa tới 1 giây\nsliding : 10 / 20 request lọt trong chưa tới 1 giây\n\n=== Bộ đếm riêng từng data center (ví dụ README: 80 / 70 / 90 request vào 3 DC, ngưỡng 100 / 10 s, đếm theo JA4)\nĐếm theo từng DC: chặn 0 / 240 (counter cao nhất 90). Nếu đếm gộp toàn mạng: chặn 140.\nRút ra: rate limit theo IP chặn bot ít IP gửi nhiều nhưng không chạm botnet trải rộng. Trên Free, ngưỡng an toàn ×3 (129) còn cao hơn cả bot A, nên không tách được bot A khỏi văn phòng sau NAT; R2 (signature) hoặc Business (POST + IP có hỗ trợ NAT) mới tách được. Mọi request là synthetic, không có gì gửi tới Cloudflare.",
      measured: true,
      read: ["Dòng baseline: với <code>/login</code> theo IP, văn phòng 20 người đạt 43 request / 10 s, nên ngưỡng ×3–5 của README là 129–215, cao hơn cả bot A (61). Hàng \"Free, ngưỡng 129\" chặn 0% tấn công: trên Free không có ngưỡng nào vừa chặn bot A vừa tha văn phòng.", "Free mặc định 10/10 s chặn 39,7% tấn công nhưng 20/81 người thật bị ảnh hưởng (cả văn phòng). Business POST /login + IP có hỗ trợ NAT: cùng 39,7% mà 0 người bị chạm.", "Botnet 40 IP chỉ bị chặn khi đếm theo User-Agent (Enterprise), và khi đó 21 người thật bị gộp chung bộ đếm Chrome. Rule <code>/api/</code> theo IP chặn nhầm 982 request, 80/81 người (CGNAT và văn phòng).", "Cửa sổ cố định để lọt 20/20 request trong chưa tới 1 giây quanh mốc 10 s; cửa sổ trượt chỉ 10. Ví dụ README 80 / 70 / 90 vào 3 data center, ngưỡng 100: chặn 0; nếu đếm gộp sẽ chặn 140."]

    mount(stage) {
      const o = { expr: 'login', ch: 'ip', period: 10, thr: 10, timeout: 10, action: 'block', r2: false };
      const svgBox = el('div'), stat = el('div', { class: 'stat' }), notes = el('div'), table = el('div', { style: 'overflow-x:auto;margin-top:10px' });
      const exprBox = el('div', { class: 'mono', style: 'font-size:12px;margin:4px 0 8px;color:var(--mute)' });
      function draw() {
        const { G, maxCnt } = run(o);

        const legitMax = Math.max(base.solo || 0, base.office || 0, base.cgnat || 0);
        const plan = Math.max(EXPR[o.expr].plan, CHAR[o.ch].plan, PERIODS.find((p) => p[0] === o.period)[1], o.action === 'block' ? TIMEOUTS.find((p) => p[0] === o.timeout)[1] : 0);
        exprBox.textContent = 'Expression: ' + EXPR[o.expr].t + '  |  ' + o.thr + ' request / ' + o.period + ' giây / ' + CHAR[o.ch].t + ' → ' + (o.action === 'block' ? 'Block ' + o.timeout + ' giây' : 'Managed Challenge (throttle)');
        svgBox.replaceChildren(grid(G));
        const atk = GROUPS.filter((g) => g.attack), leg = GROUPS.filter((g) => !g.attack);
        const sum = (gs, f) => gs.reduce((a, g) => a + f(G[g.k]), 0);
        const atkN = sum(atk, (x) => x.n), atkStop = sum(atk, (x) => x.stop);
        const legN = sum(leg, (x) => x.n), legStop = sum(leg, (x) => x.stop), legChal = sum(leg, (x) => x.chal);
        const hurt = sum(leg, (x) => x.hurt.size), people = sum(leg, (x) => x.people.size);
        stat.innerHTML = `<span>Request tấn công bị chặn <b class="${atkStop / atkN > 0.8 ? 'ok' : 'bad'}">${pct(atkStop / atkN)}</b></span><span>Request khách thật bị chặn <b class="${legStop ? 'bad' : 'ok'}">${fmt(legStop)} / ${fmt(legN)}</b></span>${legChal ? `<span>Khách bị challenge <b style="color:var(--warn)">${fmt(legChal)}</b></span>` : ''}<span>Người thật bị ảnh hưởng <b class="${hurt ? 'bad' : 'ok'}">${hurt} / ${people}</b></span><span>Plan tối thiểu <b>${PLANS[plan]}</b></span>`;
        const ns = [];
        const hurtG = leg.filter((g) => G[g.k].hurt.size);
        if (hurtG.length) ns.push(['bad', `Ngưỡng đang chặn khách thật: ${hurtG.map((g) => esc(g.t) + ' (' + G[g.k].hurt.size + ' người)').join('; ')}. Vì sao: ${o.ch === 'ua' ? 'đếm theo User-Agent gộp mọi khách dùng cùng trình duyệt hoặc cùng app vào một bộ đếm.' : 'bộ đếm gắn với khoá ' + esc(CHAR[o.ch].t) + ', nhiều người sau một IP dùng chung bộ đếm, mức cao nhất của người thật là ' + legitMax + ' trong khi ngưỡng là ' + o.thr + '.'} Không có nghĩa là rate limit sai ý tưởng. Trong hệ thống thật: ngưỡng ≥ ${legitMax * 3}–${legitMax * 5} (×3–5 theo README), Business+ dùng IP có hỗ trợ NAT, IP đối tác quen thì R0 Skip.`]);
        if (legitMax && o.thr >= legitMax * 3 && atkStop / atkN < 0.05) ns.push(['bad', `Ngưỡng ${o.thr} theo quy tắc ×3–5 (người thật cao nhất ${legitMax}) không chạm khách nào, nhưng cũng chỉ chặn ${pct(atkStop / atkN)} tấn công. Vì sao: bot mạnh nhất chỉ đạt ${Math.max(base.botA || 0, base.botB || 0, base.net || 0)} trong một chu kỳ, thấp hơn ngưỡng. Không có nghĩa là nên hạ ngưỡng: hạ xuống dưới ${legitMax} là chặn khách. Trong hệ thống thật: với khoá này không có ngưỡng nào tách được bot khỏi người; dùng custom rule theo signature (R2) hoặc khoá khác (Business+).`]);
        if (o.ch === 'nat' && G.cgnat.hurt.size) ns.push(['warn', 'Đã dùng IP có hỗ trợ NAT mà app sau CGNAT vẫn bị gộp: lab giả định app không giữ cookie _cfuvid, nên mọi thuê bao rơi vào một bucket.']);
        if (o.action !== 'block' && G.cgnat.stop) ns.push(['bad', `Managed Challenge chặn ${fmt(G.cgnat.stop)} request của app: app không chạy được trang challenge (nhận HTML thay vì JSON). Trình duyệt thì qua được (cam). README: không đặt challenge lên path API mà app gọi.`]);
        if (G.net.n && !G.net.stop && (o.expr !== 'api')) ns.push(['warn', `Botnet 40 IP lọt hết ${fmt(G.net.n)} request: mỗi IP chỉ đạt tối đa ${maxCnt.net || 0} trong một chu kỳ${o.ch === 'ua' ? ', và đếm theo UA thì bộ đếm chia theo 3 data center' : ''}. Rate limit theo IP vô dụng với botnet trải rộng; chặn theo signature ở A3.`]);
        if (o.ch === 'ua' && G.net.stop) ns.push(['warn', 'Đếm theo User-Agent bắt được botnet vì cả 40 IP cùng một UA giả Chrome, nhưng cũng gộp chung mọi khách Chrome thật vào cùng bộ đếm đó.']);

        if (o.expr !== 'api' && !G.botB.stop) ns.push(['warn', 'Bot B đánh /api/products không khớp expression của rule này nên lọt hết. Free chỉ có 1 rate limiting rule: chọn path đang bị đánh nặng nhất.']);

        table.innerHTML = `<table style="border-collapse:collapse;font-size:12.5px;width:100%;min-width:560px"><tr>${th('Nhóm')}${th('Request')}${th('Bị chặn')}${th('Challenge')}${th('Đếm cao nhất / chu kỳ')}${th('So ngưỡng ' + o.thr)}</tr>` + GROUPS.map((g) => {
          const x = G[g.k], m = base[g.k] || 0, good = g.attack ? x.stop > 0 : !x.hurt.size;
          return `<tr>${td(esc(g.t), g.attack ? 'color:var(--bad)' : '')}${td(fmt(x.n), 'font-family:var(--mono)')}${td(fmt(x.stop), `font-family:var(--mono);color:var(--${good ? 'ok' : 'bad'})`)}${td(x.chal ? fmt(x.chal) : '–', 'font-family:var(--mono)')}${td(m ? fmt(m) : 'không khớp', 'font-family:var(--mono)')}${td(m > o.thr ? 'vượt' : m ? 'dưới' : '–', m > o.thr ? `color:var(--${g.attack ? 'ok' : 'bad'})` : '')}</tr>`;
        }).join('') + `</table><p class="hint">Gợi ý ngưỡng theo README (mức cao nhất của người thật ${legitMax} × 3–5): <b>${legitMax * 3}–${legitMax * 5}</b>${o.thr < legitMax ? ' <span style="color:var(--bad)">· ngưỡng hiện tại thấp hơn cả một nhóm người thật</span>' : o.thr < legitMax * 3 ? ' <span style="color:var(--warn)">· ngưỡng hiện tại không có khoảng an toàn ×3</span>' : ''}</p>`;
      }
      const drawSoon = debounce(draw);
      stage.append(el('h4', { text: '60 giây đầu flash sale, 6 nhóm client, một rate limiting rule', style: 'margin:0 0 8px' }),
        el('div', { class: 'row' }, [
          select('Expression', [['login', 'path eq "/login" (Free+)'], ['loginpost', '/login và method POST (Business+)'], ['api', 'starts_with path "/api/" (Pro+)']], o.expr, (v) => { o.expr = v; draw(); }).node,
          select('Đếm theo', Object.entries(CHAR).map(([k, v]) => [k, v.t + ' (' + PLANS[v.plan] + '+)']), o.ch, (v) => { o.ch = v; draw(); }).node,
          chk('Custom rule R2 trước (UA thư viện vào trang không phải /api/ → Block)', false, (v) => { o.r2 = v; draw(); })]),
        el('div', { class: 'row' }, [
          slider('Ngưỡng', 1, 300, 1, o.thr, (v) => { o.thr = v; drawSoon(); }, (v) => v + ' req').node,
          select('Chu kỳ', PERIODS.map(([p, pl]) => [p, p + ' giây (' + PLANS[pl] + '+)']), o.period, (v) => { o.period = +v; draw(); }).node,
          select('Action', [['block', 'Block'], ['challenge', 'Managed Challenge (throttle)']], o.action, (v) => { o.action = v; draw(); }).node,
          select('Timeout', TIMEOUTS.map(([p, pl]) => [p, p + ' giây (' + PLANS[pl] + '+)']), o.timeout, (v) => { o.timeout = +v; draw(); }).node]),
        exprBox, svgBox,
        el('div', { class: 'legend', html: '<span><i style="background:var(--ok)"></i>tốt: khách lọt qua, bot bị chặn</span><span><i style="background:var(--bad)"></i>xấu: bot lọt qua, khách bị chặn</span><span><i style="background:var(--warn)"></i>khách bị challenge</span>' }),
        stat, notes, table,
        el('div', { class: 'cap', style: 'font-size:12.5px;color:var(--mute);margin-top:8px', text: `Dữ liệu synthetic, ${fmt(REQS.length)} request trong 60 giây, sinh bằng seed cố định. Giả định: bot A ${6} req/s, bot B 4 req/s, mỗi IP botnet 1 request / 15 giây trải 3 data center; mỗi lượt xem trang của người thật = 1 trang + 3 lời gọi /api/; 10 / 60 thuê bao app đăng nhập; app không giữ cookie; mọi khách thật vào data center DC1. Lab đếm trong cửa sổ trượt theo khoá + data center, request đang bị chặn không được đếm thêm; cách đếm thực của Cloudflare là xấp xỉ, có thể lệch.` }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
