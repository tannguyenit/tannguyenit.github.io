const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

<p>Null-route là cách nhà cung cấp tự bảo vệ: họ bỏ <b>mọi</b> gói tới IP bị đánh, để flood không ảnh hưởng khách hàng khác của họ. Với bạn, IP đó biến mất: khách qua Cloudflare nhận 52x, SSH không vào được, và Tunnel cũng mất nếu cloudflared đi ra bằng chính IP đó. Tấn công "thành công" theo nghĩa site đã chết; bạn chỉ còn đường đổi IP (B3).</p>
<p>Trong hình chính, chọn "Nhà cung cấp null-route IP": mọi hàng dừng ở cột đầu. Đổi sang IP mới thì null-route trên IP cũ không còn liên quan.</p>`,
        take: 'Hỏi nhà cung cấp sớm, trước khi có sự cố: họ lọc được gì, ai trực, có null-route tự động không. README đưa số điện thoại hỗ trợ khẩn vào danh sách chuẩn bị.'

      {
        q: 'Đổi IP luôn cho nhanh, sao README bắt bịt chỗ lộ trước?',
        a: `<p>Vì phần lớn chỗ lộ <b>tự đi theo</b> sang IP mới. Record <code>mail.shopviet.vn</code> DNS-only trỏ về cùng máy: bạn cập nhật IP mới vào đó là lộ ngay. SPF chứa <code>ip4:</code>, email gửi từ server có header <code>Received:</code>, tính năng tải ảnh từ URL đi ra bằng IP của máy, certificate trả về khi truy cập thẳng IP: tất cả đều lộ IP mới. README: "IP mới sẽ lộ tiếp sau vài giờ." Chỉ lịch sử DNS là gắn với IP cũ, đổi IP là xong. Tích các chỗ lộ còn mở rồi chọn IP mới:</p>`,

        a: `<p>Ngược chiều với bình thường. <code>cloudflared</code> trên origin chủ động mở kết nối <b>ra</b> tới Cloudflare và giữ nó. Khi khách gửi request tới <code>shopviet.vn</code>, Cloudflare đẩy request vào theo kết nối đã có, <code>cloudflared</code> chuyển tới Service URL nội bộ (ví dụ <code>http://localhost:8080</code>). Firewall chỉ cần cho kết nối đi ra; cổng 80/443 đóng hẳn. Dù IP lộ, không có cổng web nào để đánh vào.</p>
<p>Đánh đổi theo README:</p>
<ul><li>Nginx thấy mọi request đến từ <code>127.0.0.1</code> / <code>::1</code> (kết nối từ <code>cloudflared</code> trên cùng máy), nên cần cấu hình realip (module nginx lấy lại IP thật của khách từ header) với <code>set_real_ip_from 127.0.0.1</code>. Quên dòng này mà bật rate limit ở nginx thì cả 300 khách trong mô phỏng của Bài 5 dùng chung một bộ đếm <code>127.0.0.1</code> và bị chặn hết (POC Bài 5: 300/300).</li>
<li>Một tiến trình chết là site chết: chạy thêm một bản <code>cloudflared</code> thứ hai (replica) dùng cùng tunnel.</li>

<li>Token của tunnel giữ như mật khẩu; lộ thì rotate trên dashboard.</li>
<li>Tunnel không chặn tấn công băng thông vào IP đã lộ: đường truyền đầy thì kết nối ra của cloudflared cũng nghẽn.</li></ul>`,

    poc: {
      goal: "Lấy script <code>cf-only.sh</code> và lệnh Tunnel <b>từ README</b>, thay <code>$v4</code> / <code>$v6</code> bằng 22 dải Cloudflare của README (không tải từ mạng), in ruleset nftables dạng text, kiểm tra tĩnh, rồi cho 7 gói tin giả đi qua 4 biến thể bằng một bộ đánh giá nhỏ. Cuối cùng rà một bản export DNS synthetic tìm chỗ lộ IP origin (B3).",
      file: "docs/under-attack/pocs/03_branch_b_origin.py",

      output: "=== Ruleset README sinh ra (danh sách IP lấy từ khối set_real_ip_from của README, KHÔNG tải từ cloudflare.com)\ntable inet cf_guard\ndelete table inet cf_guard\ntable inet cf_guard {\n  set cf4 { type ipv4_addr; flags interval; elements = { 173.245.48.0/20,103.21.244.0/22,103.22.2… } }\n  set cf6 { type ipv6_addr; flags interval; elements = { 2400:cb00::/32,2606:4700::/32,2803:f800:… } }\n  chain input {\n    type filter hook input priority -10; policy accept;\n    tcp dport { 80, 443 } ip  saddr @cf4 accept\n    tcp dport { 80, 443 } ip6 saddr @cf6 accept\n    tcp dport { 80, 443 } drop\n  }\n}\n\n=== Kiểm tra tĩnh\n[x] Script có set -euo pipefail và dừng khi danh sách rỗng\n[x] Thay cả bảng trong 1 lần nft -f (table; delete table; table {...})\n[x] set cf4: 15 dải, đều là IPv4 hợp lệ\n[x] set cf6: 7 dải, đều là IPv6 hợp lệ\n[x] Có rule accept cho IPv6 (ip6 saddr @cf6)\n[x] Rule drop cuối không giới hạn họ địa chỉ (chặn cả IPv4 lẫn IPv6)\n[x] Hook input, priority -10 (< 0: chạy trước ufw / firewalld ở priority 0)\n[x] Chỉ đụng cổng 80/443 (policy accept: cổng khác như SSH 22 vẫn mở)\n\n=== Gói tin giả đi qua từng biến thể (cột 'muốn' là kết quả an toàn)\ngói tin                          cổng     muốn    README    README, Tunnel (đóng 80/443)  Quên IPv6 (bỏ set cf6)  Drop chỉ IPv4 (kiểu iptables)\n-------------------------------  -------  ------  --------  ----------------------------  ----------------------  -----------------------------\nKhách qua Cloudflare IPv4        tcp/443  accept  ✓ accept  ✓ đi qua Tunnel               ✓ accept                ✓ accept\nKhách qua Cloudflare IPv6        tcp/443  accept  ✓ accept  ✓ đi qua Tunnel               ✗ drop                  ✓ accept\nBotnet thẳng IPv4                tcp/443  drop    ✓ drop    ✓ drop                        ✓ drop                  ✓ drop\nBotnet thẳng IPv6                tcp/443  drop    ✓ drop    ✓ drop                        ✓ drop                  ✗ accept\nZone Cloudflare của kẻ tấn công  tcp/443  drop    ✗ accept  ✓ drop                        ✗ accept                ✗ accept\nBạn SSH từ văn phòng             tcp/22   accept  ✓ accept  ✓ accept                      ✓ accept                ✓ accept\nBotnet dò SSH                    tcp/22   drop    ✗ accept  ✗ accept                      ✗ accept                ✗ accept\nZone Cloudflare của kẻ tấn công mang IP Cloudflare nên allowlist không phân biệt được: cần Tunnel hoặc AOP certificate riêng.\nSSH: ruleset README không đụng tới cổng 22, phải tự giới hạn. UDP flood làm đầy đường truyền thì firewall trên máy vô dụng (B2).\n\n=== Nếu curl trả về trang lỗi HTML với mã 200: điều kiện [ -n \"$v4\" ] của README vẫn qua\nPhần tử '<!DOCTYPE html><html><body>Jus'… không phải CIDR: POC bắt được bằng ipaddress. Script README không kiểm tra từng dòng; nft sẽ từ chối cú pháp cả file và giữ bảng cũ (theo tài liệu nft, POC không chạy nft để xác nhận).\n\n=== B3: rà một bản export DNS synthetic tìm chỗ lộ IP origin\nLỘ  A    mail         192.0.2.10                               ← DNS-only trỏ đúng IP origin\nLỘ  A    cpanel       192.0.2.10                               ← DNS-only trỏ đúng IP origin\nLỘ  MX   shopviet.vn  mail.shopviet.vn                         ← MX trỏ về host DNS-only cùng máy\nLỘ  TXT  shopviet.vn  v=spf1 ip4:192.0.2.10 include:_spf.googl ← SPF chứa ip4:<IP origin>\nRút ra: script README chặn đúng IPv4 lẫn IPv6 và không làm hỏng khách IPv6; quên cf6 thì khách IPv6 qua Cloudflare bị drop, drop kiểu chỉ IPv4 thì botnet IPv6 lọt. Mọi thứ ở đây là text và gói tin giả: không lệnh firewall nào được chạy.",
      measured: true,
      read: ["Kiểm tra tĩnh: cả 8 mục đạt, gồm set <code>cf6</code> hợp lệ và rule drop cuối không giới hạn họ địa chỉ, nên ruleset README chặn được botnet IPv6. Mục cuối đạt nhưng là cảnh báo: cổng 22 không được đụng tới.", "Cột \"Quên IPv6\": khách qua Cloudflare IPv6 bị drop. Cột \"Drop chỉ IPv4\": botnet IPv6 đi thẳng vào. Đây là hai lỗi kinh điển của lab.", "Hàng \"Zone Cloudflare của kẻ tấn công\" là ✗ ở mọi biến thể allowlist, vì gói tin mang IP Cloudflare thật. Chỉ Tunnel (hoặc AOP với certificate riêng, không mô phỏng ở đây) chặn được.", "Phần trang lỗi HTML: điều kiện <code>[ -n \"$v4\" ]</code> của README không kiểm tra nội dung. Theo tài liệu, nft sẽ từ chối cả transaction và giữ bảng cũ, nhưng POC không chạy nft nên phần này chưa đo."]

          select('Nhà cung cấp', [['none', 'Chưa gọi'], ['filter', 'Lọc DDoS upstream + ACL dải CF vào 80/443'], ['null', 'Null-route IP bị đánh']], o.up, (v) => { o.up = v; draw(); }).node,
          select('IP origin', [['old', OLD4 + ' (IP đã lộ)'], ['same', 'Đổi sang ' + NEWIPS.same], ['other', 'Đổi sang ' + NEWIPS.other]], o.ip, (v) => { o.ip = v; draw(); }).node,
          slider('UDP flood', 0, 10, 0.5, o.gbps, (v) => { o.gbps = v; draw(); }, (v) => v + ' Gbps').node]),
        leakWrap, flow, stat, notes, table,
        el('div', { class: 'cap', style: 'font-size:12.5px;color:var(--mute);margin-top:8px', text: 'Giả định của lab: khách qua Cloudflare 1.200 req/s (IPv4) + 300 req/s (IPv6); botnet thẳng 40.000 req/s IPv4, 15.000 req/s IPv6; zone Cloudflare của kẻ tấn công 8.000 req/s; nginx chịu 3.000 req/s; đường truyền 1 Gbps, lưu lượng hợp lệ 0,2 Gbps. Danh sách dải IP Cloudflare lấy từ README (11/2026). Khi đổi IP mà còn chỗ lộ đi theo, lab coi như kẻ tấn công đã tìm lại IP mới.' }));
      draw();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
