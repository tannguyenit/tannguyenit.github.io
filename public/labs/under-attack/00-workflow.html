const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

        q2a: { x: 190, y: 112, q: true, l: ['Origin: IP lạ / SYN-RECV', '/ băng thông đầy?'] },
        q2b: { x: 570, y: 112, q: true, l: ['Origin: IP lạ / SYN-RECV', '/ băng thông đầy?'] },
        both: { x: 70, y: 196, leaf: 'both', l: ['Cả hai', 'B1 trước, rồi A1'] },
        q3a: { x: 290, y: 196, q: true, l: ['Origin', 'còn khoẻ?'] },
        B: { x: 460, y: 196, leaf: 'B', l: ['Nhánh B', 'đánh thẳng origin'] },
        q3b: { x: 640, y: 196, q: true, l: ['Origin', 'còn khoẻ?'] },
        watch: { x: 220, y: 280, leaf: 'watch', l: ['Cloudflare chặn tốt', 'theo dõi, làm A2'] },
        A: { x: 360, y: 280, leaf: 'A', l: ['Nhánh A', 'L7 qua Cloudflare'] },
        calm: { x: 570, y: 280, leaf: 'calm', l: ['Không thấy', 'dấu hiệu tấn công'] },
        none: { x: 694, y: 280, leaf: 'none', l: ['Ngoài bảng', 'README'] }
      };
      const E = [['q1', 'q2a', 'có'], ['q1', 'q2b', 'không'], ['q2a', 'both', 'có'], ['q2a', 'q3a', 'không'], ['q2b', 'B', 'có'], ['q2b', 'q3b', 'không'], ['q3a', 'watch', 'khoẻ'], ['q3a', 'A', 'quá tải'], ['q3b', 'calm', 'khoẻ'], ['q3b', 'none', 'quá tải']];
      const PATH = { both: ['q1', 'q2a', 'both'], A: ['q1', 'q2a', 'q3a', 'A'], watch: ['q1', 'q2a', 'q3a', 'watch'], B: ['q1', 'q2b', 'B'], calm: ['q1', 'q2b', 'q3b', 'calm'], none: ['q1', 'q2b', 'q3b', 'none'] };
      const LEAF_COLOR = { both: 'var(--bad)', B: 'var(--bad)', A: 'var(--warn)', watch: 'var(--ok)', calm: 'var(--ok)', none: 'var(--g1)' };

      function drawTree(r) {
        const on = new Set(PATH[r.leaf]), kids = [];
        tree.setAttribute('viewBox', `0 0 ${W} 312`);
        E.forEach(([a, b, lbl]) => {
          const A = N[a], B = N[b], act = on.has(a) && on.has(b);
          kids.push(el('line', { x1: A.x, y1: A.y + 17, x2: B.x, y2: B.y - 17, stroke: act ? 'var(--accent)' : 'var(--line)', 'stroke-width': act ? 3 : 1.4 }),
            el('text', { x: (A.x + B.x) / 2 + (B.x < A.x ? -6 : 6), y: (A.y + B.y) / 2 + 4, 'text-anchor': B.x < A.x ? 'end' : 'start', class: act ? '' : 'mute', style: 'font-size:11px' + (act ? ';font-weight:700' : ''), text: lbl }));
        });
        Object.entries(N).forEach(([k, n]) => {
          const act = on.has(k), w = n.leaf ? 120 : 150, col = n.leaf ? LEAF_COLOR[n.leaf] : 'var(--accent)';
          kids.push(el('g', { opacity: act ? 1 : 0.38 }, [
            el('rect', { x: n.x - w / 2, y: n.y - 17, width: w, height: 34, rx: n.q ? 17 : 5, fill: act && n.leaf ? 'var(--accent-soft)' : 'var(--panel)', stroke: act ? col : 'var(--line)', 'stroke-width': act ? 2.4 : 1.2 }),
            el('text', { x: n.x, y: n.y - 3, 'text-anchor': 'middle', style: 'font-size:11px;font-weight:' + (n.leaf ? 700 : 500), text: n.l[0] }),
            el('text', { x: n.x, y: n.y + 11, 'text-anchor': 'middle', style: 'font-size:10.5px', class: 'mute', text: n.l[1] })]));
        });
        tree.replaceChildren(...kids);
      }

      function stepsFor(r) {
        const triage = { t: [0, 2], k: 'T', name: 'Triage: traffic đi qua đâu?', cmd: 'triage' };
        if (r.leaf === 'A') return [triage, ...STEPS.A];
        if (r.leaf === 'B') return [triage, ...STEPS.B(st.tunnel, r.sig.bw)];
        if (r.leaf === 'both') {
          const b = STEPS.B(st.tunnel, r.sig.bw);
          const shift = r.sig.bw ? 8 : 1;
          return [triage, b[0], ...(r.sig.bw ? [b[1]] : []), ...STEPS.A.map((s) => Object.assign({}, s, { t: [s.t[0] + shift, s.t[1] + shift] }))];
        }
        if (r.leaf === 'watch') return [triage, { t: [2, 8], k: 'A2', name: 'Làm A2 để chắc chắn, không cần vội', cmd: 'sig' }];
        return [triage];
      }

      function drawTimeline(list) {
        const maxT = Math.max(35, ...list.map((s) => s.t[1])), x = (m) => 40 + (m / maxT) * (W - 60), kids = [];
        timeline.setAttribute('viewBox', `0 0 ${W} ${list.length * 24 + 34}`);
        for (let m = 0; m <= maxT; m += 5) kids.push(el('line', { x1: x(m), x2: x(m), y1: 4, y2: list.length * 24 + 10, stroke: 'var(--line)', 'stroke-dasharray': '2 4' }), el('text', { x: x(m), y: list.length * 24 + 26, 'text-anchor': 'middle', class: 'mute', style: 'font-size:10.5px', text: m + "'" }));
        list.forEach((s, i) => {
          const col = s.k === 'T' ? 'var(--g1)' : s.k[0] === 'B' ? 'var(--bad)' : 'var(--warn)';
          kids.push(el('rect', { x: x(s.t[0]), y: 6 + i * 24, width: Math.max(4, x(s.t[1]) - x(s.t[0]) - 1), height: 18, rx: 3, fill: col, opacity: 0.85 }, [el('title', { text: s.k + ' ' + s.name })]),
            el('text', { x: 2, y: 19 + i * 24, style: 'font-size:11px;font-weight:700', text: s.k }),
            el('text', { x: x(s.t[1]) + 4 > W - 150 ? x(s.t[0]) - 4 : x(s.t[1]) + 4, y: 19 + i * 24, 'text-anchor': x(s.t[1]) + 4 > W - 150 ? 'end' : 'start', style: 'font-size:11px', text: s.name }));
        });
        timeline.replaceChildren(...kids);
      }

      function draw() {
        const r = route(st);
        drawTree(r);
        const chip = (t, v, bad) => `<span>${t}: <b class="${bad ? 'bad' : 'ok'}">${v}</b></span>`;
        sigRow.innerHTML = chip('Analytics CF', r.sig.cf ? 'tăng vọt' : 'bình thường', r.sig.cf) + chip('IP lạ', st.other + '% (ngưỡng ' + LIM.other + '%)', r.sig.other) + chip('SYN-RECV', st.syn + ' (ngưỡng ' + LIM.syn + ')', r.sig.syn) + chip('%ifutil', st.util + '% (ngưỡng ' + LIM.util + '%)', r.sig.bw) + chip('Origin', r.sig.down ? 'quá tải' : 'khoẻ', r.sig.down);
        const VERD = {
          A: 'Nhánh A: tấn công L7 qua Cloudflare. Mọi rule Cloudflare đều có tác dụng.',
          B: 'Nhánh B: origin IP đã lộ, bị đánh trực tiếp. Rule Cloudflare không chạm được phần này.',
          both: 'Cả hai: làm B1 trước (mất 1 phút), rồi sang Nhánh A.',
          watch: 'Analytics Cloudflare tăng nhưng origin vẫn khoẻ: Cloudflare đang chặn tốt. Theo dõi; làm A2 để chắc chắn, không cần vội.',
          calm: 'Không có dấu hiệu tấn công. Tiếp tục theo dõi.',
          none: 'Ngoài bảng README: bảng quyết định chỉ có 4 hàng (A, B, cả hai, Cloudflare chặn tốt), không hàng nào cho "origin quá tải nhưng không thấy tấn công ở cả Cloudflare lẫn origin". Lab gọi đây là ca ngoài runbook DDoS (diễn giải của lab).'
        };
        ver.innerHTML = box(LEAF_COLOR[r.leaf], '<b>Kết luận:</b> ' + VERD[r.leaf]);
        const list = stepsFor(r);
        drawTimeline(list);
        steps.replaceChildren(...list.flatMap((s) => [
          el('div', { style: 'font-size:13px;margin-top:6px', html: `<b>${s.k === 'T' ? 'Phút 0–2' : s.t[1] >= 35 ? 'Phút ' + s.t[0] + '+' : 'Phút ' + s.t[0] + '–' + s.t[1]} · ${s.k === 'T' ? '' : s.k + '. '}${esc(s.name)}</b>${s.note ? ' <span class="mute" style="color:var(--mute)">' + esc(s.note) + '</span>' : ''}` }),
          pre(CMD[s.cmd]), s.cmd2 ? pre(CMD[s.cmd2]) : null]).filter(Boolean));
        const f = [];
        if (st.tunnel && st.other > 0) f.push(box('var(--bad)', `<b>Đang dùng Tunnel nhưng ${st.other}% kết nối 80/443 đến từ IP bên ngoài.</b> Vì sao: với Tunnel, cloudflared gửi request vào nginx ở <code>localhost:8080</code> (ví dụ Service URL của README), nên bộ lọc <code>sport = :80 or sport = :443</code> của README không bao giờ thấy kết nối của khách. Dòng nào lọt vào bộ lọc đó đều đến từ ngoài: cổng web vẫn mở ra internet. Vì thế kịch bản có sẵn ra 100%. Không có nghĩa Tunnel hỏng: Tunnel không tự đóng cổng. Trong hệ thống thật: B1 bản cho Tunnel (đóng hẳn 80/443), đừng chạy script allowlist IP Cloudflare.`));
        if (st.tunnel && st.other === 0) f.push(box('var(--g1)', '<b>Dùng Tunnel và 0% kết nối 80/443 từ ngoài.</b> Ngoài đời, lệnh top IP của README lúc này trả về <b>rỗng</b>: kết nối của cloudflared đi vào <code>localhost:8080</code>, không nằm trong bộ lọc 80/443. Không có nghĩa không có ai truy cập hay đã hết tấn công. Trong hệ thống thật: đọc Analytics Cloudflare để biết có bị đánh không; muốn thấy kết nối cloudflared thì thêm <code>or sport = :8080</code> (port Service URL của bạn) vào bộ lọc (Lab 01).'));
        if (r.sig.bw && (r.leaf === 'B' || r.leaf === 'both')) f.push(box('var(--bad)', `<b>%ifutil ${st.util}%: đường truyền đã đầy.</b> Vì sao: gói tin chiếm hết đường trước khi tới firewall trên máy, nên B1 không cứu được. Không có nghĩa bỏ qua B1: nó vẫn chặn phần HTTP flood lọt vào. Trong hệ thống thật: B2, gọi nhà cung cấp lọc upstream; chuẩn bị bị null-route và chuyển sang B3.`));
        if (r.leaf === 'none') f.push(box('var(--g1)', '<b>Origin chết mà không thấy tấn công, và README không có hàng cho ca này.</b> POC 00 duyệt 32 tổ hợp tín hiệu: đây là tổ hợp duy nhất bảng không trả lời. Vì sao có thể xảy ra: khoảng thời gian trên Analytics chưa bao trọn sự cố; đây không phải DDoS (DB chậm, deploy lỗi, chính lượng khách flash sale vượt sức máy); hoặc bị đánh vào cổng khác 80/443 mà lệnh <code>ss</code> của README không lọc tới. Không có nghĩa nên bật Under Attack "cho chắc": nó làm khổ khách mà không giải quyết gì. Trong hệ thống thật: so với baseline đã ghi, kiểm tra log ứng dụng và DB, xem <code>ss</code> không lọc port (diễn giải của lab).'));
        if (st.reflex === 'uam') {
          if (r.leaf === 'B') f.push(box('var(--bad)', '<b>Bật Under Attack: origin vẫn chết.</b> Vì sao: traffic tấn công đi thẳng vào IP origin, không qua Cloudflare. Trong khi đó khách thật bắt đầu phải qua trang kiểm tra và app mobile hỏng. Không có nghĩa Under Attack kém: nó không được thiết kế cho đường này. Trong hệ thống thật: B1.'));
          else if (r.leaf === 'both') f.push(box('var(--warn)', '<b>Bật Under Attack: chỉ xử lý một nửa.</b> Phần đánh thẳng vẫn đè origin, nên CPU không giảm và bạn không biết Under Attack có tác dụng hay không. Trong hệ thống thật: B1 trước (1 phút), rồi A1.'));
          else if (r.leaf === 'A') f.push(box('var(--warn)', '<b>Bật Under Attack: đúng nhánh, có tác dụng sau 1–2 phút.</b> Nhưng app mobile gọi <code>/api/</code> sẽ hỏng nếu không có Configuration Rule chừa <code>/api/</code>. Bạn đã bỏ qua triage và may mắn chọn đúng.'));
          else f.push(box('var(--warn)', '<b>Bật Under Attack khi không cần.</b> Mọi khách đang mua hàng phải qua trang kiểm tra, app mobile hỏng, trong khi origin vốn không bị tấn công (hoặc Cloudflare đã chặn tốt).'));
        }
        if (st.reflex === 'fw') {
          if (r.leaf === 'A' || r.leaf === 'watch') f.push(box('var(--bad)', '<b>Chặn top IP bằng firewall: chặn chính khách.</b> Vì sao: ở nhánh này top IP trên origin là IP Cloudflare, mỗi IP chở cả khách thật lẫn bot. Khách đi qua các data center đó nhận 521/522, bot qua data center khác vẫn vào. Trong hệ thống thật: chặn trên Cloudflare theo signature (Lab 02).'));
          else if (r.leaf === 'B' || r.leaf === 'both') f.push(box('var(--warn)', '<b>Chặn top IP bằng firewall: đúng hướng nhưng chậm.</b> Botnet có hàng trăm IP và SYN flood thường giả IP nguồn; chặn từng IP là chạy theo. Trong hệ thống thật: B1 chặn mọi IP không phải Cloudflare trong một lệnh.'));
        }
        if (st.code !== 'none') f.push(box('var(--g1)', `<b>Mã ${st.code}:</b> ${CODE_TXT[st.code]}. Mã 52x do Cloudflare sinh ra, cho biết origin đang không trả lời được, không cho biết tấn công đi đường nào.` + (st.code === '521' && (r.leaf === 'B' || r.leaf === 'both') ? ' Nếu 521 xuất hiện ngay sau khi chạy B1: kiểm tra <code>nft list table inet cf_guard</code>; dùng Tunnel mà chạy script allowlist, hoặc tải thiếu dải IP Cloudflare, sẽ chặn chính Cloudflare.' : '')));
        flags.innerHTML = f.join('');
      }

      stage.append(
        el('div', { class: 'row' }, presetBtns),
        el('div', { class: 'row' }, [sCf.node, sHealth.node, el('label', { class: 'ctl' }, [tunIn, 'Origin dùng Cloudflare Tunnel'])]),
        el('div', { class: 'row' }, [sOther.node, sSyn.node, sUtil.node]),
        el('div', { class: 'row' }, [sCode.node, sReflex.node]),
        sigRow, tree, ver,
        el('h4', { style: 'margin:14px 0 2px;font-size:13px', text: 'Dòng thời gian (phút, theo README) và việc đầu tiên của mỗi bước' }), timeline,
        el('div', { class: 'legend' }, [el('span', {}, [el('i', { style: 'background:var(--g1)' }), 'triage']), el('span', {}, [el('i', { style: 'background:var(--bad)' }), 'Nhánh B']), el('span', {}, [el('i', { style: 'background:var(--warn)' }), 'Nhánh A'])]),
        flags, steps,
        el('p', { class: 'hint', text: 'Tín hiệu trong các kịch bản và ngưỡng là giả lập. Bảng quyết định, bước, mốc phút và lệnh lấy từ README. Sau Nhánh A hoặc B là hạ nhiệt theo thứ tự ngược (câu hỏi 6).' }));

    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
