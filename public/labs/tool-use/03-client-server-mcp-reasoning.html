const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<tr><th>Loại</th><th>Ai thực thi</th><th>Ví dụ</th><th>Bạn thấy gì trong response</th></tr>
<tr><td>Client tool</td><td>Code của bạn</td><td><code>tra_don_hang</code>, <code>huy_don</code></td><td>Tool call, <code>stop_reason: tool_use</code>; bạn phải gửi kết quả</td></tr>
<tr><td>Server tool (built-in)</td><td>Provider</td><td>Web search, code execution, file search, tool search</td><td>Block / item mô tả lần gọi và kết quả, đã nằm sẵn</td></tr>
<tr><td>MCP qua provider</td><td>Provider gọi MCP server của bạn hoặc bên thứ ba</td><td><code>mcp</code> (OpenAI, Grok), <code>mcp_toolset</code> (Claude), <code>mcp_server</code> (Gemini)</td><td>Item lần gọi và kết quả; có thể kèm yêu cầu approval</td></tr>
</table></div>
<ul>
<li>Claude: server tool chạy trong vòng lặp nội bộ, chạm giới hạn (mặc định 10 vòng) thì <code>pause_turn</code>; gửi lại kèm <code>container</code> ID nếu có.</li>
<li>Cùng lượt có client tool và server tool chưa chạy: Claude trả <code>tool_use</code>, server tool chạy ở request sau.</li>
<li>Web search: Claude 10 USD / 1.000 lượt + token (lượt lỗi không tính); OpenAI 10 USD / 1.000 lượt + token. <code>max_tool_calls</code> của OpenAI không áp dụng cho function tool.</li>
<li>Approval: OpenAI mặc định cần, <code>authorization</code> không được lưu nên gửi lại mỗi request; Grok không hỗ trợ; Gemini chỉ Streamable HTTP, tên server không chứa dấu <code>-</code>.</li>
</ul>
<h4>Trạng thái ẩn phải gửi lại (README §1.6)</h4>
<div class="tbl"><table>
<tr><th>Provider</th><th>Phải gửi lại</th><th>Khi thiếu hoặc sửa</th></tr>
<tr><td>OpenAI Responses</td><td>Mọi reasoning item, function call và output kể từ user message cuối; <code>encrypted_content</code> khi <code>store: false</code></td><td><code>400</code> thiếu reasoning item</td></tr>
<tr><td>Claude</td><td>Mọi <code>thinking</code> và <code>redacted_thinking</code> block, nguyên văn, kể cả block rỗng</td><td><code>400</code> blocks cannot be modified</td></tr>
<tr><td>Gemini 3+</td><td><code>thought_signature</code> trên function call part, đúng vị trí</td><td><code>400</code></td></tr>
<tr><td>DeepSeek (thinking + tools)</td><td><code>reasoning_content</code> mọi lượt</td><td><code>400</code></td></tr>
<tr><td>Kimi, MiniMax, GLM</td><td>Toàn bộ assistant message gồm <code>reasoning_content</code></td><td>Mất tính liên tục; Kimi K2.7 Code bắt buộc</td></tr>
</table></div>
<div class="verdict"><b>Quy tắc an toàn cho mọi provider:</b> lưu nguyên response của provider và dựng request tiếp theo từ chính các object đó, không phải từ bản rút gọn trong database. Giữ lịch sử chỉ-thêm.</div>`,
    why: {
      c: 'Giữ tool chạm dữ liệu khách và tool ghi (tra_don_hang, huy_don) ở client, nơi bạn kiểm soát danh tính, xác nhận và log. Dùng server tool cho việc provider làm tốt hơn và không cần dữ liệu riêng (web search). Với reasoning model, lưu và gửi lại nguyên văn mọi object provider trả về. Lý do: nơi tool chạy quyết định ai đứng giữa model và tác dụng phụ; còn phần suy luận ẩn là input mà provider kiểm tra.',
      s: 'Đưa mọi tool lên MCP qua provider để bỏ vòng lặp: provider gọi huy_don thay bạn, cổng xác nhận phụ thuộc cơ chế approval của từng provider (Grok không có). Tự dựng search và sandbox cho mọi thứ: tốn công vận hành mà không thêm kiểm soát với dữ liệu công khai. Lưu lịch sử dạng rút gọn rồi dựng lại: gãy ngay khi đổi sang reasoning model.',
      p: 'Client tool tốn một round trip mỗi đợt và bạn tự viết vòng lặp. Server tool tính tiền theo lượt và đưa nội dung không tin cậy vào context. Lưu nguyên response tốn chỗ hơn và gắn bạn với format của từng provider.'
    },
    deep: [
      {
        q: 'Client tool và server tool khác nhau thế nào khi nhìn vào response?',
        a: `<p>Với client tool, response <b>dừng lại</b> ở tool call: <code>stop_reason: tool_use</code>, bạn phải chạy tool và gửi kết quả ở request mới. Với server tool, provider đã chạy và response chứa sẵn block / item mô tả lần gọi và kết quả (README §1.5). Bạn nhận câu trả lời hoàn chỉnh trong cùng một request.</p>
<p>Claude có một trường hợp lai: nếu cùng lượt có cả client tool call và server tool call chưa chạy, API trả <code>stop_reason: "tool_use"</code> mà chưa thực thi server tool. Bạn gửi kết quả client tool, giữ nguyên <code>tools</code>, và server tool chạy ở request sau. Chọn tổ hợp để xem chuỗi request:</p>`,
        viz(v) {
          const out = el('div');
          const draw = (k) => {
            const seq = { c: [['request 1', 'tool_use: kiem_kho', 'bạn chạy kiem_kho'], ['request 2', 'end_turn: câu trả lời', '']], s: [['request 1', 'web search chạy trong provider → end_turn: câu trả lời', '']], cs: [['request 1', 'tool_use: kiem_kho; web_search chưa chạy', 'bạn chạy kiem_kho, giữ nguyên tools'], ['request 2', 'web search chạy trong provider → end_turn', '']] }[k];
            let h = '<div class="tbl"><table><tr><th>Request</th><th>Response</th><th>Việc của bạn</th></tr>';
            seq.forEach((r) => { h += `<tr><td>${r[0]}</td><td class="mono" style="font-size:12px">${esc(r[1])}</td><td>${esc(r[2]) || '<span class="ok">xong</span>'}</td></tr>`; });
            out.innerHTML = h + '</table></div>';
            if (k === 'cs') out.append(note('warn', 'Web search không chạy ở request 1 dù model đã quyết định gọi. Không có nghĩa nó bị bỏ qua. Trong hệ thống thật: nếu code đổi <code>tools</code> ở request 2 (ví dụ bỏ web_search vì "đã gọi rồi"), server tool không còn để chạy.'));
          };
          const s = select('Tổ hợp (Claude)', [['c', 'Chỉ client tool'], ['s', 'Chỉ server tool'], ['cs', 'Client + server cùng lượt']], 'cs', draw);
          v.append(el('div', { class: 'row' }, [s.node]), out, el('div', { class: 'cap', text: 'Hành vi theo README §1.5 [20][24].' }));
          draw('cs');
        },
        take: 'Client tool trả quyền điều khiển về cho bạn; server tool giữ nó ở provider cho tới khi xong hoặc chạm giới hạn.'
      },
      {
        q: 'Server tool chạy trong provider thì có bị kẹt vòng lặp vô hạn không?',
        a: `<p>Provider tự giới hạn. Claude chạy server tool trong một vòng lặp bên trong provider (model gọi tool, đọc kết quả, quyết định gọi tiếp hay trả lời), giống vòng lặp bạn tự viết cho client tool nhưng chạy ở phía họ; chạm giới hạn (mặc định 10 vòng mỗi request) thì trả <code>stop_reason: "pause_turn"</code>. Bạn gửi lại nguyên nội dung assistant để model tiếp tục, kèm <code>container</code> ID nếu có, nếu không sẽ mất file trong sandbox (README §1.5). OpenAI có <code>max_tool_calls</code> giới hạn số lần gọi built-in tool trong một response, nhưng không áp dụng cho function tool của bạn.</p>`,
        viz(v) {
          const out = el('div');
          let lost = false;
          const nS = slider('Số vòng server tool cần (giả định)', 1, 40, 1, 14, draw, (x) => x);
          const bL = el('button', { text: 'Quên gửi container ID', onclick: () => { lost = !lost; bL.classList.toggle('on', lost); draw(); } });
          function draw() {
            const n = nS.get(), reqs = Math.ceil(n / 10), pauses = reqs - 1;
            out.replaceChildren(el('div', { class: 'stat', html: `<span>Request cần gửi: <b>${reqs}</b></span><span>Số lần nhận pause_turn: <b>${pauses}</b></span>` }),
              el('div', { style: 'display:flex;gap:3px;flex-wrap:wrap;margin-top:6px' }, Array.from({ length: n }, (_, i) => el('span', { title: 'vòng ' + (i + 1), style: `width:14px;height:14px;border-radius:3px;background:${lost && i >= 10 ? 'var(--bad)' : 'var(--g' + (1 + (Math.floor(i / 10) % 4)) + ')'}` }))),
              pauses && lost ? note('bad', `Từ vòng 11, request mới chạy trong container mới: file model đã tạo ở ${10} vòng đầu biến mất. Không có lỗi nào báo cho bạn. Trong hệ thống thật: lưu <code>container.id</code> từ response và gửi lại ở mọi request sau.`) : pauses ? note('warn', `Code chỉ kiểm tra <code>tool_use</code> và <code>end_turn</code> sẽ coi <code>pause_turn</code> là "xong" và trả cho khách câu trả lời dở dang. Trong hệ thống thật: xử lý <code>pause_turn</code> bằng cách gửi lại nguyên nội dung assistant.`) : note('ok', 'Xong trong một request, không có pause_turn.'));
          }
          v.append(el('div', { class: 'row' }, [nS.node, bL]), out, el('div', { class: 'cap', text: 'Mỗi màu là một request; giới hạn 10 vòng mỗi request lấy từ README §1.5.' }));
          draw();
        },
        take: 'Server tool không xoá vòng lặp, nó chỉ chuyển vòng lặp vào provider và trả lại cho bạn khi chạm giới hạn.'
      },
      {
        q: 'Server tool tính tiền thế nào? Có đắt hơn tự gọi API search không?',
        a: `<p>README §1.5: web search của Claude là 10 USD / 1.000 lượt tìm, cộng token nội dung; lượt lỗi không tính tiền. OpenAI web search là 10 USD / 1.000 lượt, cộng token nội dung tìm được tính theo giá model. Phần token phụ thuộc giá model và độ dài kết quả, lab không tính. Kéo để xem riêng phí theo lượt:</p>`,
        viz(v) {
          const out = el('div');
          const sS = slider('Lượt search mỗi hội thoại (giả định)', 0, 10, 1, 2, draw, (x) => x);
          const cS = slider('Hội thoại có search mỗi ngày (giả định)', 100, 50000, 100, 5000, draw, vi);
          const eS = slider('Tỉ lệ lượt lỗi (giả định)', 0, 0.3, 0.01, 0.05, draw, (x) => Math.round(x * 100) + '%');
          function draw() {
            const n = sS.get() * cS.get(), cl = n * (1 - eS.get()) * 0.01, oa = n * 0.01;
            out.replaceChildren(hbars([['Claude: phí lượt / ngày', cl, true], ['OpenAI: phí lượt / ngày', oa, false]], { max: Math.max(oa, 0.01), fmt: usd }),

              sS.get() >= 5 ? note('warn', `${sS.get()} lượt mỗi hội thoại: model đang tìm lặp. Phí lượt tăng tuyến tính, còn token kết quả cộng dồn vào context của các bước sau. Trong hệ thống thật: OpenAI có <code>max_tool_calls</code> cho built-in tool; với Claude, theo dõi số lượt trong log (README §1.5, §3.5).`) : '');
          }
          v.append(el('div', { class: 'row' }, [sS.node, cS.node, eS.node]), out, el('div', { class: 'cap', text: 'Giá 10 USD / 1.000 lượt từ README §1.5. README không ghi OpenAI có miễn phí lượt lỗi không, nên lab tính đủ. Chưa gồm token nội dung.' }));

        take: 'Server tool có hai đồng hồ tính tiền: theo lượt và theo token kết quả. Giới hạn số lượt là việc của bạn.'
      },
      {
        q: 'MCP qua provider tiện vậy, sao không đưa hết tool lên đó?',
        a: `<p>Ba lý do trong README §1.5. Thứ nhất, context phình: OpenAI nhập danh sách tool thành một item <code>mcp_list_tools</code>; xoá item đó khỏi context buộc API tải lại và tăng độ trễ. Grok ghi rõ nếu không đặt <code>allowed_tools</code>, mọi tool của server đều vào context. Thứ hai, approval khác nhau: OpenAI mặc định cần, Grok không hỗ trợ. Thứ ba, <code>authorization</code> không được OpenAI lưu nên phải gửi lại mỗi request, tức credential của bạn đi qua provider ở mọi lượt.</p>
<p>Kéo số tool mà MCP server công bố:</p>`,
        viz(v) {
          const out = el('div');
          const tj = JSON.stringify({ name: 'tra_don_hang', description: 'Tra trạng thái và vị trí giao của một đơn ShopViet theo mã đơn dạng SV-4821.', input_schema: { type: 'object', properties: { order_id: { type: 'string' } }, required: ['order_id'] } });
          const per = Math.ceil(tj.length / 4);
          const nS = slider('Tool trên MCP server', 4, 200, 1, 40, draw, (x) => x);
          const aS = slider('allowed_tools', 1, 20, 1, 4, draw, (x) => x);
          function draw() {
            const n = nS.get(), a = Math.min(aS.get(), n);
            out.replaceChildren(hbars([['Grok, không đặt allowed_tools', n * per, false], ['Có allowed_tools', a * per, true]], { max: n * per, fmt: (x) => vi(x) + ' token' }),
              n > 20 ? note('warn', `${n} tool vào context ở mỗi request, khoảng ${vi(n * per)} token, trong khi câu hỏi chỉ cần ${a}. Không chỉ tốn tiền: Google khuyên giữ tập tool đang hoạt động ở 10–20 vì nhiều tool làm model chọn kém hơn (README §2.4). Trong hệ thống thật: luôn đặt <code>allowed_tools</code> cho MCP.`) : '');
          }
          v.append(el('div', { class: 'row' }, [nS.node, aS.node]), out, el('div', { class: 'cap', text: `Mỗi định nghĩa ước lượng ${per} token từ chuỗi JSON của tra_don_hang (ký tự / 4), không phải tokenizer thật.` }));
          draw();
        },
        take: 'MCP qua provider đổi vòng lặp tự viết lấy ít kiểm soát hơn: về context, về credential, và về approval.'
      },
      {
        q: 'Nếu huy_don nằm trên MCP server, ai đảm bảo khách thật sự đồng ý?',
        a: `<p>README §3.6: xác nhận phải đến từ người dùng qua kênh model không giả được. Với client tool, bạn tự cài: model gọi <code>huy_don</code> → code không thực thi mà tạo <code>pending_action</code> → UI hiện nút → khách bấm → backend chạy. Với MCP qua provider, bước đó phụ thuộc approval của provider: OpenAI có <code>require_approval</code>, Grok không có.</p>
<p>Thêm một lớp nữa: lethal trifecta. Bật các khả năng mà agent đang có để xem nó có đủ ba yếu tố không:</p>`,
        viz(v) {

          const L = { priv: 'Đọc dữ liệu khách (tra_don_hang)', untrusted: 'Đọc nội dung ngoài (web_search, review sản phẩm)', exfil: 'Kênh gửi ra ngoài (gửi email)', idArg: 'customer_id lấy từ arguments của model' };

          function draw() {

      },
      {
        q: 'Reasoning model "suy luận ẩn" là gì, và tại sao bản thân tôi không đọc được mà vẫn phải gửi lại?',
        a: `<p>Reasoning model suy luận trước mỗi tool call và tiếp tục sau khi nhận kết quả (<i>interleaved thinking</i>). Phần suy luận đó thường không trả về dạng đọc được. Provider trả một đối tượng mờ: reasoning item (OpenAI), thinking block có <code>signature</code> (Claude), <code>thought_signature</code> (Gemini). Ở request sau, provider dùng chính đối tượng đó để khôi phục phần suy luận đã làm (README §1.6).</p>
<p>Với Claude model mới, <code>display</code> mặc định là <code>"omitted"</code>: field <code>thinking</code> là chuỗi rỗng, chỉ có <code>signature</code>. Block trông "rỗng" nhưng vẫn phải gửi lại (README §2.3). Sonnet 5.5 không tắt được thinking bằng <code>disabled</code>; mức thấp nhất là <code>between_tools</code>, vẫn sinh thinking block giữa các tool call.</p>
<p><b>Vì sao provider không tự nhớ mà bắt bạn gửi lại?</b> Vì API stateless (README §1.1): mỗi request độc lập, giống REST API không có session phía server, nên mọi thứ model cần phải nằm trong request. Có chế độ để provider giữ hộ: OpenAI với <code>store: true</code> dùng <code>previous_response_id</code> thay vì gửi lại; Gemini Interactions với <code>store: true</code> + <code>previous_interaction_id</code> (README §2.2, §2.4). Lab này xét trường hợp bạn tự lưu lịch sử.</p>
<p>Reasoning cũng không chuyển giữa các họ model: <code>gpt-5.6-sol</code>, <code>-terra</code>, <code>-luna</code> dùng được của nhau, nhưng không chuyển giữa GPT-5.6 và GPT-5.5; API tự bỏ phần không tương thích. Fallback sang model khác giữa chừng thì model mới không thừa hưởng phần suy luận (README §2.2).</p>`,
        take: 'Đối tượng mờ là "bộ nhớ" của model giữa hai request. Bạn không cần hiểu nó, chỉ cần không làm mất nó.'
      },

        const extra = r.kind === 'bad' && S.rm === 'drop' ? ` Vì sao: code dựng lại lịch sử từ những field nó biết (role, content, tool_calls) và vô tình bỏ đúng phần provider cần. Không có nghĩa tool call sai: hai call và hai kết quả đều đủ. Trong hệ thống thật: lưu nguyên response của provider, dựng request sau từ chính các object đó (README §1.6).` : r.kind === 'bad' && S.rm === 'dropEmpty' ? ' Block có thinking rỗng vì display mặc định là "omitted" trên model mới, nhưng signature trong đó vẫn là thứ API kiểm tra. Trong hệ thống thật: không lọc block theo nội dung; nếu lọc theo type, giữ cả thinking lẫn redacted_thinking (README §2.3).' : '';

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])

    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }

})();
