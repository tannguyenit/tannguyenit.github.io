const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

    summary: `<h3>Tóm tắt bài</h3>
<p>Câu trả lời cuối đúng chưa cho biết agent làm đúng. Agent có thể huỷ nhầm đơn rồi xin lỗi, và câu xin lỗi được chấm là "lịch sự, đúng ngữ cảnh". Eval cho tool use cần nhiều tầng; observability ở production cần span cho từng tool call để thấy cùng những tầng đó trên traffic thật.</p>
<h4>Các tầng eval (§3.9)</h4>
<div class="tbl"><table><tr><th>Tầng</th><th>Câu hỏi</th><th>Cách đo</th></tr>
<tr><td>Chọn tool</td><td>Gọi đúng tool không? Có gọi khi không nên gọi không?</td><td>So tên tool với nhãn; tập câu hỏi không cần tool (irrelevance)</td></tr>
<tr><td>Tham số</td><td>Arguments đúng không? Có hỏi lại khi thiếu thông tin không?</td><td>So từng field; tập câu thiếu tham số</td></tr>
<tr><td>Quỹ đạo</td><td>Thứ tự và số bước hợp lý không?</td><td>So với quỹ đạo tham chiếu, cho phép nhiều đường đúng</td></tr>
<tr class="cur"><td>Kết quả</td><td>Trạng thái hệ thống sau cùng đúng không?</td><td>So database / trạng thái mock với trạng thái mục tiêu</td></tr>
<tr><td>Độ ổn định</td><td>Đúng bao nhiêu lần trên k lần chạy?</td><td>pass^k</td></tr></table></div>
<ul><li><b>pass^k</b> (τ-bench): xác suất thành công ở cả k lần chạy độc lập, chấm bằng trạng thái database. gpt-4o đạt pass^1 61,2% ở miền retail nhưng pass^8 dưới 25%.</li>
<li><b>Ca khó theo benchmark</b>: thiếu thông tin phải hỏi lại (ToolSandbox), gọi lồng nhau (NESTFUL: GPT-4o khớp toàn chuỗi 28%), MCP thật (MCP-Universe: GPT-5 43,72%, Claude-4.0-Sonnet 29,44%), irrelevance và thiếu tham số (BFCL).</li>
<li><b>Bộ eval của bạn</b>: hội thoại thật từ log (ẩn danh) cộng ca biên tự viết; tool giả lập có trạng thái; chạy k lần mỗi ca; chạy lại khi sửa description, thêm bớt tool, đổi model, đổi provider, nâng cấp engine hoặc chat template; kiểm tra nhà cung cấp bằng trigger similarity và tỉ lệ arguments đúng schema (K2 Vendor Verifier).</li></ul>
<h4>Observability (§3.10)</h4>
<ul><li>Span OTel <code>execute_tool {gen_ai.tool.name}</code>, kind <code>INTERNAL</code>, trạng thái Development. Bắt buộc <code>gen_ai.tool.name</code>; bắt buộc có điều kiện <code>gen_ai.tool.call.id</code>, <code>error.type</code>, <code>gen_ai.conversation.id</code>; khuyến nghị <code>gen_ai.tool.type</code>, <code>gen_ai.tool.description</code>.</li>
<li><code>gen_ai.tool.call.arguments</code> và <code>gen_ai.tool.call.result</code> là opt-in vì thường chứa dữ liệu cá nhân. Metric <code>gen_ai.execute_tool.duration</code>. Span tool là con của span gọi model.</li>
<li>Dashboard: theo tool (số lần gọi, lỗi theo <code>error.type</code>, p50 / p95, kích thước kết quả); theo tác vụ (số bước, tổng token, chạm giới hạn, gọi trùng); chất lượng tool call (arguments sai schema, tên tool không tồn tại, tool call bị cắt); tool ghi (xác nhận, từ chối, hết hạn, idempotency chặn trùng).</li>
<li>Lưu raw request / response của provider, có kiểm soát truy cập và thời hạn, để phát lại phiên lỗi.</li></ul>
<h4>Failure modes hay gặp (§3.11, rút gọn)</h4>
<div class="tbl"><table><tr><th>Triệu chứng</th><th>Nguyên nhân khả dĩ</th><th>Xử lý</th></tr>
<tr><td>Gọi tool với ID / mã bịa</td><td>Không có đường thoát khi thiếu thông tin; tool_choice ép buộc</td><td>Hướng dẫn "không đoán", hỏi lại; validate tồn tại trong code</td></tr>
<tr><td>Gọi cùng tool cùng tham số nhiều lần</td><td>Model không biết dừng; lỗi không ghi retryable</td><td>Phát hiện gọi trùng; <code>retryable: false</code></td></tr>
<tr><td>Báo "đã xong" nhưng thao tác thất bại</td><td>Tool trả ok khi lỗi; cắt im lặng</td><td>Kết quả phản ánh đúng trạng thái; ghi rõ <code>truncated</code></td></tr>
<tr><td>Tool call sai schema tăng sau khi đổi nhà cung cấp</td><td>Chat template, parser, quantization, ID sai format</td><td>Eval kiểu vendor verifier; chuẩn hoá ID</td></tr>
<tr><td>Người dùng nhận 500 sau nhiều bước</td><td>Exception chạm giới hạn của framework không được bắt</td><td>Bắt <code>MaxTurnsExceeded</code> / <code>GraphRecursionError</code>, tóm tắt phần đã làm</td></tr></table></div>
<h4>Checklist (§3.12, ý chính)</h4>
<ul><li><b>Vòng lặp</b>: mọi tool call nhận đúng một kết quả; gửi lại nguyên văn reasoning; kiểm stop_reason; giới hạn bước, token, thời gian, gọi trùng.</li>
<li><b>Bộ tool</b>: description trả lời làm gì / khi nào dùng / khi nào không; không có tham số định danh trong schema; strict bật tường minh; description trong version control và có eval đi kèm.</li>
<li><b>Kết quả và lỗi</b>: gọn, có giới hạn, lỗi có <code>code</code>, <code>message</code>, <code>retryable</code>.</li>
<li><b>Tác dụng phụ</b>: tool ghi qua xác nhận ở kênh model không giả được; idempotency key <code>(conversation_id, tool_call_id)</code>; mỗi tool tự kiểm quyền.</li></ul>
<div class="verdict"><b>Một câu:</b> chấm quỹ đạo và trạng thái, không chỉ chấm lời. Một tool ghi chạy sai không hiện ra trong câu trả lời; nó chỉ hiện ra trong DB và trong span.</div>`,
    why: {

      s: 'Chỉ cho LLM-as-judge đọc câu trả lời cuối: không thấy huy_don chạy thừa, không thấy trả lời đúng nhờ may. So nguyên chuỗi quỹ đạo với một đường tham chiếu: đánh trượt các đường đúng khác. Chạy mỗi ca một lần: không thấy ca chập chờn. Log toàn bộ arguments và result mặc định: thu luôn dữ liệu cá nhân của khách vào hệ thống trace.',

    deep: [
      {

      {

        el('p', { class: 'hint', text: 'Dữ liệu dựng sẵn: 3 đơn, tồn kho Pro X theo cửa hàng, giá sản phẩm và lãi suất trả góp 0% đều là giả định của lab. Tool là mock có trạng thái, chạy thật trong trình duyệt; mỗi hội thoại bắt đầu từ DB sạch. Giả định huy_don đã qua bước xác nhận của UI, nên ở đây nó chạy ngay khi được gọi. "Câu cuối đúng" = có đủ cụm từ bắt buộc của nhãn, không có cụm từ cấm: một bộ chấm chỉ đọc text, giống LLM-as-judge chỉ đọc câu trả lời.' }));

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
