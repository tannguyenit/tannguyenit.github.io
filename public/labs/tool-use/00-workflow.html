const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

<div class="verdict"><b>Nguồn số liệu:</b> 286 token overhead, giới hạn 8–12 bước, ngưỡng 3 lần gọi trùng, thông báo lỗi "tool_use ids were found without tool_result blocks immediately after" và ví dụ 20 bước × 2.000 token lấy từ README. Nội dung tool, kết quả, id <code>toolu_0…</code>, câu trả lời và cách ước lượng token là của lab.</div>`,
    why: {
      c: 'Tự viết vòng lặp ngắn: nối nguyên văn response, mỗi tool_use một tool_result đúng id, execute_safely không raise, giới hạn số bước bằng code và một request dọn dẹp với tool_choice none khi chạm giới hạn. Mọi tác dụng phụ đi qua code của bạn, nên bạn kiểm soát được.',
      s: 'Để framework tự lặp với mặc định của nó: LangGraph mặc định cho phép tới 10.007 super-step (bước lặp), tức gần như không có giới hạn. Dựng lại lịch sử từ role/content trong database: rơi mất block provider cần. Tắt hẳn song song cho đơn giản: thêm một request, mỗi request gửi lại toàn bộ lịch sử.',
      p: 'Mỗi bước gửi lại mọi thứ trước đó, nên input tăng gần theo bình phương số bước. Bạn phải tự lo phần khó: lỗi tool thành kết quả đọc được, lịch sử không bao giờ mồ côi, xác nhận và idempotency cho tool ghi.'
    },
    deep: [
      {
        q: 'Khách chỉ gõ một câu. Request đầu tiên app gửi lên thật ra gồm những gì?',
        a: `<p>Ba phần, theo đúng thứ tự Claude dùng để dựng prompt: <code>tools</code> → <code>system</code> → <code>messages</code>. Câu của khách chỉ là message cuối:</p>
<pre class="mono" style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:6px;border:1px solid var(--line)">{
  "model": "claude-sonnet-5-5",
  "max_tokens": 1024,
  "tools": [ tra_don_hang, kiem_kho, tinh_tra_gop, huy_don ],
  "system": "Bạn là trợ lý của ShopViet...",
  "messages": [
    {"role": "user", "content": "Đơn SV-4821 của mình tới đâu rồi? ..."}
  ]
}</pre>
<p>Model không "có" tool nào theo nghĩa được nối vào backend. Nó chỉ đọc mô tả tool như đọc một đoạn prompt. Lab 01 đi sâu chuyện tool definition nằm ở đâu trong prompt và tốn bao nhiêu token.</p>`,
        take: 'Tool definition là chữ trong prompt. Model biết có kiem_kho vì đọc được mô tả của nó, không vì được nối vào hệ thống kho.'
      },
      {
        q: 'Response 1 có tool_use kiem_kho. Lúc đó kho Q.7 đã bị truy vấn chưa?',
        a: `<p>Chưa. Response chỉ là dữ liệu: model sinh ra một khối có cấu trúc, API tách thành block <code>tool_use</code>, đặt <code>stop_reason: "tool_use"</code> rồi trả về. Phía provider không chạy gì (trừ server tool như web search, README §1.5).</p>
<p>Trong response, <code>id</code> như <code>toolu_01B</code> do API gán; code của bạn chỉ chép lại id đó vào <code>tool_use_id</code> của kết quả. Từ đây quyền nằm ở code của bạn. Bạn có thể chạy, từ chối, hỏi khách xác nhận, hay chạy với tham số đã kiểm tra lại. README tóm lại ranh giới: <b>model chỉ sinh ra yêu cầu gọi tool; code của bạn quyết định có thực thi hay không, thực thi thế nào và trả lại gì.</b></p>
<p>Hệ quả ngược lại cũng đúng: model không biết tool đã chạy hay chưa, ngoài những gì bạn nói. Trả <code>{"ok": true}</code> khi thao tác thất bại thì model sẽ báo khách là đã xong.</p>`,
        take: 'tool_use là một yêu cầu. Thực thi, quyền hạn và tác dụng phụ đều thuộc về code của bạn.'
      },
      {
        q: 'Vì sao request 2 phải gửi lại cả assistant message có tool_use? Gửi riêng tool_result không được à?',
        a: `<p>Vì API stateless. Request 2 là một request độc lập: nếu chỉ có tool_result, model không biết kết quả đó trả lời cho yêu cầu nào, cũng không biết khách hỏi gì. App phải nối nguyên văn assistant message (gồm cả câu "Mình kiểm tra đơn..." và hai tool_use) rồi thêm một user message chứa hai tool_result.</p>
<p><code>tool_use_id</code> là khoá nối. Với Claude còn hai quy tắc vị trí (README §2.3): tool_result phải nằm <b>ngay sau</b> lượt assistant chứa tool_use tương ứng, và trong user message đó mọi tool_result đứng <b>trước</b> mọi text. Chọn kiểu lỗi "Sai tool_use_id" hoặc "Text đứng trước tool_result" trong hình chính để thấy API từ chối ở request 2.</p>`,
        take: 'Mỗi request phải tự đủ nghĩa: câu hỏi, yêu cầu gọi tool và kết quả, nối bằng đúng id.'
      },
      {
        q: 'Vì sao tra_don_hang và kiem_kho đi cùng một lượt, còn tinh_tra_gop phải chờ thêm một vòng?',
        a: `<p>Hai tra cứu đầu không phụ thuộc nhau, nên model trả cả hai tool_use trong một response: gọi <b>song song</b>. tinh_tra_gop cần <code>price</code>, mà giá chỉ có trong kết quả kiem_kho. Model phải thấy kết quả đó trước, nên gọi <b>tuần tự</b> ở vòng sau.</p>
<p>Mỗi vòng thêm là một request nữa, và mỗi request gửi lại toàn bộ lịch sử. Bảng dưới chạy lại cùng kịch bản hai lần: một lần để model gọi song song (mặc định của Claude), một lần như khi đặt <code>disable_parallel_tool_use: true</code>.</p>`,
        viz(vb) {
          const a = totals(run('ok', 12, false)), b = totals(run('ok', 12, false, { serial: true }));
          vb.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Cách gọi</th><th>Số request</th><th>Tổng token input (ước lượng)</th></tr>' +
            `<tr><td>Song song (mặc định)</td><td class="mono">${a.n}</td><td class="mono">${fT(a.input)}</td></tr>` +
            `<tr><td>Một tool mỗi lượt</td><td class="mono">${b.n}</td><td class="mono bad">${fT(b.input)}</td></tr>` })]),
          el('div', { class: 'cap', text: `Tắt song song làm thêm ${b.n - a.n} request và ${fT(b.input - a.input)} token input (+${Math.round((b.input / a.input - 1) * 100)}%), dù dữ liệu tool trả về y hệt. Điều này không có nghĩa nên luôn bật song song cho mọi tool: README §1.4 nhắc "song song không có nghĩa là độc lập", model có thể trả hai huy_don khi khách chỉ muốn huỷ một. Trong hệ thống thật: chạy song song tool đọc, chạy tuần tự hoặc xin xác nhận với tool ghi.` }));
        },
        take: 'Số vòng quyết định số lần gửi lại lịch sử. Gộp được tra cứu độc lập vào một vòng là bớt một request.'
      },
      {
        q: 'Token ở request 3 lớn hơn request 1 nhiều vậy. Một tác vụ dài 20 bước thì sao?',
        a: `<p>Request thứ <i>i</i> mang theo kết quả của mọi bước trước. README §1.1 tính: 20 bước, mỗi tool result khoảng 2.000 token, thì riêng phần tool result trong input là 2.000 × (1 + 2 + … + 20) = 420.000 token, gấp 10,5 lần lượng dữ liệu tool thực sự trả về. Chi phí tăng gần theo bình phương số bước.</p>
<p>Kéo thử. Trình duyệt tính tổng r × n(n+1)/2 so với r × n.</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { n: 20, r: 2000 };
          function draw() {
            const sent = st.r * st.n * (st.n + 1) / 2, real = st.r * st.n, ratio = sent / real;
            out.replaceChildren(hbars([['Tool result thực sự trả về', real, false], ['Tool result đã gửi lên (cộng mọi request)', sent, true]], { max: sent, fmt: fT }));
            cap.innerHTML = `Gấp <b>${ratio.toFixed(1).replace('.', ',')}</b> lần. ` + (st.n === 20 && st.r === 2000 ? 'Đúng con số README: 420.000 token, gấp 10,5 lần. ' : '') +
              (ratio >= 5 ? '<span class="bad">Phần lớn input là dữ liệu cũ gửi lại.</span> Không có nghĩa prompt caching cứu được hết: cache giảm giá phần lặp lại nhưng không giảm độ dài context model phải đọc. Trong hệ thống thật: giảm số bước (tool ở mức tác vụ, gọi song song), thu nhỏ từng kết quả, che kết quả cũ (README §3.3, §3.5).' : 'Với ít bước, phần gửi lại chưa đáng kể.');
          }
          const s1 = slider('Số bước', 1, 40, 1, 20, (v) => { st.n = v; draw(); });
          const s2 = slider('Token mỗi tool result', 200, 5000, 100, 2000, (v) => { st.r = v; draw(); }, fT);
          vb.append(el('div', { class: 'row' }, [s1.node, s2.node]), out, cap);
          draw();
        },
        take: 'Thêm một bước không cộng thêm một kết quả mà cộng thêm cả lịch sử. Bước thứ 20 đắt hơn bước thứ 2 rất nhiều.'
      },
      {
        q: 'Nếu code của mình crash ngay sau khi lưu tool_use mà chưa lưu tool_result thì chỉ hỏng một lượt thôi đúng không?',
        a: `<p>Không. README §3.4 gọi đây là lịch sử bị "nhiễm độc": assistant message có tool_use đã nằm trong database, tool_result thì không. Khách nhắn tiếp, app dựng request từ lịch sử đó, và <b>mọi request từ đó trở đi đều trả 400</b>. Hội thoại không dùng được nữa dù lỗi gốc chỉ xảy ra một lần.</p>
<p>Phòng ở hai chỗ: <code>execute_safely</code> không bao giờ raise (lỗi thành tool_result có <code>is_error</code>), và <code>load_history</code> thêm kết quả lỗi <code>INTERRUPTED</code> cho mọi call mồ côi. Bật tắt bên dưới, trình duyệt chạy cùng hàm kiểm tra của hình chính trên lịch sử đã lưu.</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' });
          let fix = false;
          const saved = [{ role: 'user', content: Q }, { role: 'assistant', content: [{ type: 'text', text: 'Mình kiểm tra đơn và kho Q.7 giúp bạn nhé.' },
            { type: 'tool_use', id: 'toolu_01A', name: 'tra_don_hang', input: { order_id: 'SV-4821' } }, { type: 'tool_use', id: 'toolu_01B', name: 'kiem_kho', input: { sku: 'PROX-DEN', store: 'Q7' } }] }];
          const follow = ['Sao lâu vậy shop?', 'Alo shop ơi?', 'Thôi mình gọi hotline.'];
          const intr = (id) => ({ type: 'tool_result', tool_use_id: id, is_error: true, content: J({ error: { code: 'INTERRUPTED', message: 'Thao tác bị gián đoạn, chưa rõ đã thực hiện hay chưa.' } }) });
          const btn = el('button', { text: 'load_history sửa call mồ côi: tắt', onclick: () => { fix = !fix; draw(); } });
          function draw() {
            btn.className = fix ? 'on' : ''; btn.textContent = 'load_history sửa call mồ côi: ' + (fix ? 'bật' : 'tắt');
            const msgs = clone(saved); let ok = 0, lastUser = null;
            const rows = follow.map((t, i) => {
              if (i === 0 && fix) { lastUser = { role: 'user', content: [intr('toolu_01A'), intr('toolu_01B'), { type: 'text', text: t }] }; msgs.push(lastUser); }
              else msgs.push({ role: 'user', content: [{ type: 'text', text: t }] });
              const e = validate(msgs);
              if (!e) { ok++; msgs.push({ role: 'assistant', content: [{ type: 'text', text: 'Dạ, mình kiểm tra lại ngay.' }] }); }
              return `<tr><td>Khách: "${t}"</td><td class="mono ${e ? 'bad' : 'ok'}">${e ? '400' : '200'}</td></tr>`;
            });
            out.replaceChildren(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Lượt sau sự cố</th><th>Kết quả</th></tr>' + rows.join('') })]),
              fix ? pre('user message đầu tiên sau khi sửa:\n' + JSON.stringify(lastUser, null, 2)) : el('span'));
            cap.innerHTML = ok ? '<b class="ok">Hội thoại chạy tiếp.</b> Kết quả INTERRUPTED nói thật với model: chưa rõ đã chạy hay chưa. Với tool ghi như huy_don, model cần biết điều đó để kiểm tra trạng thái trước khi thử lại, thay vì huỷ lần hai.'
              : '<b class="bad">Cả 3 lượt sau đều 400.</b> Vì sao: toolu_01A và toolu_01B trong lịch sử không có tool_result ngay sau. Không có nghĩa API hay model đang lỗi: request bị từ chối trước khi model chạy. Trong hệ thống thật: sửa lịch sử lúc load, và ghi log call mồ côi để tìm chỗ crash.';
          }
          vb.append(el('div', { class: 'row' }, [btn]), out, cap);
          draw();
        },
        take: 'Một tool_use không có kết quả làm hỏng cả hội thoại, không chỉ một lượt. Mỗi tool call phải nhận đúng một kết quả, kể cả khi lỗi.'
      },
      {
        q: 'Nếu model gọi huy_don thì code nên chạy luôn không? Prompt đã dặn "hỏi khách trước khi huỷ" rồi mà.',
        a: `<p>Không nên. Khi chỉ dặn trong prompt, chính model là bên quyết định "khách đã đồng ý". Một câu mơ hồ cũng đủ. README §3.6: xác nhận đáng tin phải đi qua kênh model không giả được. Model gọi <code>huy_don</code> thì code tạo <code>pending_action</code>, UI hiện nút, khách bấm thì backend mới chạy.</p>
<p>Lớp thứ hai là business rule trong tool (README §3.1): "chỉ huỷ khi chưa giao cho đơn vị vận chuyển" phải nằm trong code của huy_don, không chỉ trong prompt. Đơn SV-4821 đang được GHN giao. Thử các tổ hợp bên dưới, khách nhắn: "Nếu thứ 6 chưa tới thì thôi nhé."</p>`,
        viz(vb) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { confirm: false, rule: false, click: 'no' };
          const b1 = el('button', { onclick: () => { st.confirm = !st.confirm; draw(); } }), b2 = el('button', { onclick: () => { st.rule = !st.rule; draw(); } });
          const sc = select('Khách bấm', [['no', 'Không'], ['yes', 'Xác nhận huỷ']], 'no', (v) => { st.click = v; draw(); });
          function draw() {
            b1.className = st.confirm ? 'on' : ''; b1.textContent = 'Xác nhận qua UI: ' + (st.confirm ? 'bật' : 'tắt');
            b2.className = st.rule ? 'on' : ''; b2.textContent = 'huy_don tự kiểm tra trạng thái: ' + (st.rule ? 'bật' : 'tắt');
            sc.node.style.display = st.confirm ? '' : 'none';
            const lines = ['model → tool_use huy_don {"order_id": "SV-4821"} (id toolu_05A)'];
            let result, cancelled = false;
            if (st.confirm) {
              lines.push('code: KHÔNG chạy; tạo pending_action {id: "pa_77", tool: "huy_don", args, expires_at}', 'UI: [Xác nhận huỷ đơn SV-4821] / [Không]', 'khách bấm: ' + (st.click === 'yes' ? 'Xác nhận huỷ' : 'Không'));
            }
            if (st.confirm && st.click === 'no') result = { status: 'NOT_EXECUTED', reason: 'Khách không xác nhận huỷ.' };
            else if (st.rule) result = { error: { code: 'NOT_CANCELLABLE', message: 'Đơn đã giao cho GHN, không huỷ được. Có thể yêu cầu trả hàng sau khi nhận.', retryable: false } };
            else { result = { status: 'cancelled', order_id: 'SV-4821' }; cancelled = true; }
            lines.push('backend: ' + (cancelled ? 'gọi API huỷ đơn, idempotency key "conv_88:toolu_05A"' : 'không gọi API huỷ'), 'tool_result → model: ' + J(result));
            out.replaceChildren(pre(lines.join('\n')));
            cap.innerHTML = cancelled ? `<b class="bad">Đơn SV-4821 bị huỷ${st.confirm ? '' : ' mà khách chưa từng bấm xác nhận'}.</b> ` + (st.confirm ? 'Khách đã xác nhận, nhưng đơn đang trên đường giao: không có business rule trong tool thì code làm theo. ' : 'Khách chỉ nói một điều kiện, model hiểu thành yêu cầu huỷ, và không có lớp nào chặn. ') + 'Trong hệ thống thật: tool ghi luôn có xác nhận từ người dùng và tự kiểm tra trạng thái nghiệp vụ.'
              : `<b class="ok">Không có tác dụng phụ ngoài ý muốn.</b> Model nhận ${result.error ? 'lỗi NOT_CANCELLABLE kèm việc nên làm' : 'NOT_EXECUTED'} và giải thích lại cho khách. Mỗi tool_use vẫn nhận đúng một tool_result, kể cả khi không chạy.`;
          }
          vb.append(el('div', { class: 'row' }, [b1, b2, sc.node]), out, cap);
          draw();
        },
        take: 'Xác nhận đến từ người dùng qua UI, quy tắc nghiệp vụ nằm trong tool. Prompt chỉ giúp model giải thích, không phải hàng rào.'
      },
      {
        q: 'Vòng lặp dừng khi nào? Nếu kho Q.7 cứ timeout thì model có tự dừng không?',
        a: `<p>Điều kiện dừng tự nhiên duy nhất là model trả lời bằng text (<code>stop_reason: "end_turn"</code>). Khi tool cứ lỗi, model có thể gọi lại mãi. Chọn kiểu lỗi "Kho Q.7 timeout mãi" trong hình chính: lỗi ghi <code>retryable: true</code>, model gọi lại kiem_kho mỗi vòng.</p>
<p>README §3.5 đặt nhiều lớp giới hạn bằng code: số bước 8–12, tổng token, thời gian, và phát hiện <b>cùng tool, cùng tham số, nhận cùng kết quả</b> 3 lần thì trả <code>REPEATED_CALL</code> với <code>retryable: false</code>. Khi chạm giới hạn số bước, đừng trả "đã có lỗi xảy ra": gửi thêm một request với <code>tool_choice: none</code>, giữ nguyên tools để không mất cache, kèm chỉ dẫn tóm tắt.</p>

      output: "\nPhần 1: vòng lặp thật, model là KỊCH BẢN viết tay (không gọi API)\n=================================================================\nEngine, validator ghép cặp tool_use/tool_result, execute_safely, bộ đếm gọi trùng là code thật.\nCâu trả lời của 'model' là hàm scripted_model đọc tool_result trong lịch sử rồi quyết định.\nToken = tiktoken o200k trên JSON {tools, system, messages}; chưa gồm ~286 token Claude tự thêm (README §1.2).\n\nA. Chạy đúng\nreq  số message  token input (o200k)  stop_reason  tool call / câu trả lời\n---  ----------  -------------------  -----------  -----------------------------------------------------------------------------------\n1    1           529                  tool_use     tra_don_hang({\"order_id\": \"SV-4821\"}), kiem_kho({\"sku\": \"PROX-DEN\", \"store\": \"Q7\"})\n2    3           788                  tool_use     tinh_tra_gop({\"price\": 2490000, \"months\": 12})\n3    5           908                  end_turn     Đơn SV-4821 đã giao cho GHN, dự kiến tới 28/11. Pro X đen ở Q.7 còn 3 chiếc. Trả\n  Kết thúc: end_turn. Tổng token input: 2,225\n\nB1. kiem_kho ném exception, vòng lặp KHÔNG có execute_safely\nreq  số message  token input (o200k)  stop_reason  tool call / câu trả lời\n---  ----------  -------------------  -----------  -----------------------------------------------------------------------------------\n1    1           529                  tool_use     tra_don_hang({\"order_id\": \"SV-4821\"}), kiem_kho({\"sku\": \"PROX-DEN\", \"store\": \"Q7\"})\n  Kết thúc: ConnectionResetError: kho Q.7 ngắt kết nối. Tổng token input: 529\n  Lịch sử đã lưu: assistant có 2 tool_use nhưng không có tool_result. Khách nhắn tiếp, validator trả:\n   400 tool_use ids were found without tool_result blocks immediately after: toolu_01A, toolu_01B\n  load_history thêm kết quả INTERRUPTED cho ['toolu_01A', 'toolu_01B'] → validator: hợp lệ\n\nB2. Cùng exception, CÓ execute_safely\nreq  số message  token input (o200k)  stop_reason   tool call / câu trả lời\n---  ----------  -------------------  -----------  -----------------------------------------------------------------------------------\n1    1           529                  tool_use     tra_don_hang({\"order_id\": \"SV-4821\"}), kiem_kho({\"sku\": \"PROX-DEN\", \"store\": \"Q7\"})\n2    3           783                  tool_use     kiem_kho({\"sku\": \"PROX-DEN\", \"store\": \"Q7\"})\n3    5           910                  tool_use     kiem_kho({\"sku\": \"PROX-DEN\", \"store\": \"Q7\"})\n4    7           1059                 end_turn     Đơn SV-4821 đã giao cho GHN, dự kiến tới 28/11. Kho Q.7 chưa phản hồi, bạn hỏi l\n  Kết thúc: end_turn. Tổng token input: 3,281\n\nPhần 2: cùng vòng lặp, model thật claude-haiku-5-5 (tuỳ chọn)\n=============================================================\n  Bỏ qua: không có ANTHROPIC_API_KEY trong docs/tool-use/pocs/.env (chép từ .env.example). Chi phí khi chạy < $0,001.\n\nRút ra: một câu hỏi thành 3 request và token input tăng ở mỗi request vì API stateless gửi lại cả lịch sử;\nexception không bắt để lại tool_use mồ côi làm MỌI request sau trả 400; lỗi tool lặp mãi chỉ dừng nhờ giới hạn bằng code.",

    mount(stage) {
      const st = { mode: 'ok', max: 8, detect: false, sel: 1, full: false };
      let steps = [];
      const sMode = select('Kiểu lỗi', MODES, 'ok', (v) => { st.mode = v; recompute(true); });
      const sMax = slider('MAX_STEPS', 2, 12, 1, 8, (v) => { st.max = v; recompute(false); });
      const bDet = el('button', { onclick: () => { st.detect = !st.detect; recompute(false); } });
      const sSel = slider('Bước', 1, 10, 1, 1, (v) => { st.sel = v; draw(); });
      const setSel = (v) => { st.sel = Math.max(1, Math.min(steps.length, v)); sSel.input.value = st.sel; sSel.node.querySelector('output').textContent = st.sel; draw(); };
      const prev = el('button', { text: '◀', 'aria-label': 'Bước trước', onclick: () => setSel(st.sel - 1) });
      const next = el('button', { text: '▶', 'aria-label': 'Bước sau', onclick: () => setSel(st.sel + 1) });
      const last = el('button', { text: 'Tới cuối', onclick: () => setSel(steps.length) });
      const cbFull = el('input', { type: 'checkbox' });
      cbFull.addEventListener('change', () => { st.full = cbFull.checked; draw(); });
      const seq = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Sơ đồ các bước giữa app, API và code tool' });
      const who = el('div', { class: 'stat' }), json = el('div'), cap = el('div', { style: 'margin-top:8px;font-size:13.5px' });
      const chart = el('svg', { class: 'canvas', role: 'img', 'aria-label': 'Token input của từng request' }), stat = el('div', { class: 'stat' });
      const W = 660, X = { app: 110, api: 330, tool: 550 }, ROW = 26, TOP = 44;
      const LANE = { app: 'App của bạn', api: 'API (model)', tool: 'Code tool của bạn' };
      const okRun = totals(run('ok', 12, false));

      function recompute(jump) {
        steps = run(st.mode, st.max, st.detect);
        sSel.input.setAttribute('max', steps.length);
        bDet.className = st.detect ? 'on' : '';
        bDet.textContent = 'Phát hiện gọi trùng (3 lần): ' + (st.detect ? 'bật' : 'tắt');
        const errAt = steps.findIndex((s) => s.kind === 'err');
        setSel(jump ? (errAt >= 0 ? errAt + 1 : 1) : Math.min(st.sel, steps.length));
      }

      function label(s) {
        if (s.kind === 'req') return `request ${s.n}${s.giveup ? ' (dọn dẹp, tool_choice none)' : ''} · ~${fT(s.tk.total)} token`;
        if (s.kind === 'err') return 'HTTP 400, model không chạy';
        if (s.kind === 'res') return s.uses.length ? `tool_use × ${s.uses.length}: ${s.uses.map((u) => u.name).join(', ')}` : 'end_turn: câu trả lời cho khách';
        return s.crash ? `chạy ${s.ran.join(', ') || 'không gì'}; ${s.crash.name} ném exception` : `chạy ${s.ran.join(', ')}${s.repeated ? ' → REPEATED_CALL' : s.timeout ? ' → lỗi' : ''}`;
      }

      function drawSeq() {
        const H = TOP + steps.length * ROW + 10, kids = [];
        seq.setAttribute('viewBox', `0 0 ${W} ${H}`);
        Object.entries(X).forEach(([k, x]) => kids.push(
          el('rect', { x: x - 72, y: 4, width: 144, height: 24, rx: 6, fill: 'var(--bg)', stroke: 'var(--line)' }),
          el('text', { x, y: 21, 'text-anchor': 'middle', text: LANE[k] }),
          el('line', { x1: x, x2: x, y1: 30, y2: H, stroke: 'var(--line)', 'stroke-dasharray': '4 4' })));
        steps.forEach((s, i) => {
          const y = TOP + i * ROW + ROW / 2, cur = i + 1 === st.sel;
          const color = s.kind === 'err' ? 'var(--bad)' : s.kind === 'exec' ? (s.crash ? 'var(--bad)' : s.timeout ? 'var(--warn)' : 'var(--g3)') : s.kind === 'res' ? (s.uses.length ? 'var(--g4)' : 'var(--ok)') : s.giveup ? 'var(--warn)' : 'var(--g1)';
          if (cur) kids.push(el('rect', { x: 0, y: y - ROW / 2 + 1, width: W, height: ROW - 2, fill: 'var(--accent-soft)', rx: 4 }));
          let x1 = X.app, x2 = X.api;
          if (s.kind === 'res' || s.kind === 'err') { x1 = X.api; x2 = X.app; }
          if (s.kind === 'exec') { x1 = X.app; x2 = X.tool; }
          const dir = x2 > x1 ? 1 : -1;
          kids.push(el('line', { x1, x2: x2 - dir * 6, y1: y + 4, y2: y + 4, stroke: color, 'stroke-width': cur ? 2.6 : 1.8 }),
            el('polygon', { points: `${x2},${y + 4} ${x2 - dir * 8},${y} ${x2 - dir * 8},${y + 8}`, fill: color }));
          if (s.kind === 'exec') kids.push(el('path', { d: `M${X.tool} ${y + 4} q 22 0 22 6`, fill: 'none', stroke: color }));
          kids.push(el('text', { x: 4, y: y + 1, class: 'mute', text: String(i + 1) }),
            el('text', { x: (x1 + x2) / 2, y: y - 1, 'text-anchor': 'middle', style: 'font-size:11px', fill: color, text: label(s) }));
          kids.push(el('rect', { x: 0, y: y - ROW / 2, width: W, height: ROW, fill: 'transparent', style: 'cursor:pointer', onclick: () => setSel(i + 1) }, [el('title', { text: 'Bước ' + (i + 1) })]));
        });
        seq.replaceChildren(...kids);
      }

      function drawChart() {
        const reqs = steps.filter((s) => s.kind === 'req'), H = 150, PAD = 40, bw = Math.min(70, (W - PAD) / Math.max(4, reqs.length));
        const max = Math.max(...reqs.map((r) => r.tk.total)), cur = steps[st.sel - 1], kids = [];
        chart.setAttribute('viewBox', `0 0 ${W} ${H + 34}`);
        const y = (v) => H - (v / max) * (H - 18);
        reqs.forEach((r, i) => {
          const x = PAD + i * bw + 3, w = bw - 6;
          let acc = 0;
          [['var(--g1)', r.tk.over + r.tk.tools, 'overhead 286 + tools'], ['var(--g4)', r.tk.sys, 'system'], ['var(--dim)', r.tk.old, 'messages gửi lại'], ['var(--accent)', r.tk.add, 'messages mới']].forEach(([c, v, t]) => {
            if (!v) return;
            kids.push(el('rect', { x, y: y(acc + v), width: w, height: y(acc) - y(acc + v), fill: c }, [el('title', { text: `${t}: ${fT(v)} token` })]));
            acc += v;
          });
          const isCur = cur && cur.n === r.n && (cur.kind !== 'req' || cur === r);
          kids.push(el('text', { x: x + w / 2, y: y(acc) - 4, 'text-anchor': 'middle', style: 'font-size:11px', text: fT(r.tk.total) }),
            el('text', { x: x + w / 2, y: H + 14, 'text-anchor': 'middle', class: isCur ? '' : 'mute', style: isCur ? 'font-weight:700' : '', text: 'req ' + r.n }));
        });
        kids.push(el('line', { x1: PAD, x2: W, y1: H, y2: H, stroke: 'var(--line)' }), el('text', { x: 0, y: H, class: 'mute', text: '0' }), el('text', { x: 0, y: 14, class: 'mute', text: fT(max) }),
          el('text', { x: PAD, y: H + 30, class: 'mute', text: 'token input ước lượng mỗi request' }));
        chart.replaceChildren(...kids);
      }

      function caption(s) {
        const p = [];
        const t = totals(steps);
        if (s.kind === 'req' && s.n === 1) p.push(box('var(--g1)', `<b>App của bạn tự ghép request.</b> Chưa có gì chạy. Request gồm 4 định nghĩa tool (~${fT(TOOLS_T)} token), system (~${fT(SYS_T)}), câu khách, cộng ${OVERHEAD} token provider tự thêm. Câu hỏi của khách chỉ chiếm ~${fT(est(Q))} token trong ~${fT(s.tk.total)}.`));
        else if (s.kind === 'req' && !s.giveup) p.push(box('var(--g1)', `<b>Request ${s.n} gửi lại toàn bộ request ${s.n - 1}</b> (~${fT(s.tk.old)} token messages cũ) cộng assistant message có tool_use và user message chứa tool_result (~${fT(s.tk.add)} token mới). API không nhớ gì giữa hai request.`));
        else if (s.kind === 'req') p.push(box('var(--warn)', `<b>Chạm MAX_STEPS = ${st.max}.</b> Code không dừng im lặng: user message cuối vẫn mang tool_result cho tool_use của response trước (thiếu là 400), chỉ dẫn tóm tắt đứng <i>sau</i> các tool_result, và <code>tool_choice: none</code> giữ nguyên tools để không mất cache. Không có nghĩa tác vụ thất bại hoàn toàn: khách nhận phần đã tìm được. Trong hệ thống thật: <code>give_up_gracefully</code> như README §3.5.`));
        if (s.kind === 'res' && s.uses.length) p.push(box('var(--g4)', `<b>Model chỉ sinh ra ${s.uses.length} yêu cầu gọi tool</b>, <code>stop_reason: "tool_use"</code>. Không có gì chạy phía provider. ` + (s.uses.length > 1 ? 'Hai tool_use trong một response là gọi song song: chúng độc lập. tinh_tra_gop chưa xuất hiện vì cần giá từ kiem_kho.' : s.uses[0].name === 'tinh_tra_gop' ? 'Giá 2490000 trong input lấy từ tool_result của kiem_kho ở request trước: đây là lý do phải có vòng thứ hai.' : 'Model gọi lại kiem_kho với đúng tham số cũ vì lỗi trước ghi retryable: true.')));
        if (s.kind === 'res' && !s.uses.length) p.push(box('var(--ok)', `<b>end_turn: vòng lặp kết thúc.</b> Cả tác vụ dùng ${t.n} request, tổng ~${fT(t.input)} token input. ` + (st.mode === 'loop' && t.input > okRun.input * 1.3 ? `<span class="bad">Gấp ${(t.input / okRun.input).toFixed(1).replace('.', ',')} lần phiên chạy đúng (~${fT(okRun.input)})</span>, cho một câu trả lời kém hơn.` : '')));
        if (s.kind === 'exec') {
          if (s.crash && st.mode === 'missing') p.push(box('var(--bad)', `<b>${s.crash.name} ném exception</b> (${esc(s.crash.msg)}). Code bắt ở ngoài vòng for, log, rồi vẫn gửi phần kết quả đã có: chỉ ${s.body.content.length} tool_result cho 2 tool_use. Bước sau sẽ thấy hậu quả.`));
          else if (s.repeated) p.push(box('var(--ok)', '<b>Bộ đếm phát hiện lần thứ 3</b>: cùng kiem_kho, cùng tham số, cùng kết quả UPSTREAM_TIMEOUT. Code thay kết quả bằng REPEATED_CALL, retryable: false. Model đổi hướng và trả lời với phần đã biết.'));
          else if (s.timeout) p.push(box('var(--warn)', `<b>kiem_kho lỗi UPSTREAM_TIMEOUT, retryable: true.</b> Code vẫn trả tool_result (is_error: true) cho đúng id. Lỗi đó nói "thử lại được", nên model sẽ thử lại.` + (!st.detect ? ' Chưa bật phát hiện gọi trùng: chỉ MAX_STEPS chặn được.' : '')));
          else p.push(box('var(--g3)', `<b>Code của bạn chạy ${s.ran.join(' và ')}.</b> Đây là chỗ duy nhất chạm vào database và hệ thống kho. Mỗi tool_use nhận đúng một tool_result` + (st.mode === 'wrongid' ? ', nhưng <span class="bad">cả hai mang tool_use_id ' + s.body.content[0].tool_use_id + '</span>.' : st.mode === 'order' ? ', nhưng <span class="bad">app chèn một text khách vừa gõ lên trước các tool_result</span>.' : ' cùng tool_use_id.')));
        }
        if (s.kind === 'err') {
          const e = s.err;
          const why = st.mode === 'wrongid' ? `User message có 2 tool_result, nhưng cả hai mang ${e.got[0]}; ${e.miss.join(', ')} không có kết quả. Không có nghĩa thiếu dữ liệu: đủ 2 kết quả, chỉ nối sai. Ở provider nối theo tên và thứ tự, lỗi tương tự có thể không bị báo mà model đọc nhầm kết quả. Trong hệ thống thật: lấy id từ chính block tool_use khi tạo kết quả, không lấy theo vị trí.`
            : e.code === 'order' ? 'Text đứng trước tool_result trong user message, trái quy tắc README §2.3. Không có nghĩa không được gửi text kèm kết quả: đặt nó sau các tool_result. Trong hệ thống thật: tin nhắn khách gửi trong lúc tool đang chạy thì nối vào sau tool_result.'
              : `Assistant message trước có 2 tool_use (${e.ids.join(', ')}) nhưng user message sau chỉ có tool_result cho ${e.got.join(', ') || 'không id nào'}. Không có nghĩa model hay tool kia sai: model chưa được chạy. Tệ hơn, nếu assistant message đã lưu vào database, mọi request sau của hội thoại này cũng 400 (câu hỏi 6). Trong hệ thống thật: execute_safely không bao giờ raise, lỗi tool thành tool_result có is_error.`;
          p.push(box('var(--bad)', `<b>Request ${s.n} bị từ chối trước khi tới model.</b> ${why}`));
        }
        return p.join('');
      }

      function draw() {
        const s = steps[st.sel - 1];
        drawSeq(); drawChart();
        who.innerHTML = `<span>Bước <b>${st.sel}</b>/${steps.length}</span><span>Bên đang làm: <b>${LANE[s.lane]}</b></span><span>${s.kind === 'req' ? 'gửi request' : s.kind === 'res' ? 'trả response' : s.kind === 'err' ? 'trả lỗi' : 'chạy tool, nối tool_result'}</span>`;
        let txt;
        if (s.kind === 'err') txt = s.body;
        else if (s.kind === 'req' && s.n > 1 && !st.full) txt = JSON.stringify(Object.assign({}, s.body, { tools: `[4 định nghĩa tool, ~${TOOLS_T} token, y hệt request 1]` }), null, 2);
        else txt = JSON.stringify(s.body, null, 2);

      }

      stage.append(
        el('div', { class: 'row' }, [sMode.node, sMax.node, bDet]),
        seq,
        el('div', { class: 'legend' }, [el('span', {}, [el('i', { style: 'background:var(--g1)' }), 'request']), el('span', {}, [el('i', { style: 'background:var(--g4)' }), 'response có tool_use']), el('span', {}, [el('i', { style: 'background:var(--g3)' }), 'code chạy tool']), el('span', {}, [el('i', { style: 'background:var(--ok)' }), 'câu trả lời']), el('span', {}, [el('i', { style: 'background:var(--bad)' }), 'lỗi'])]),
        el('div', { class: 'row', style: 'margin-top:10px' }, [prev, sSel.node, next, last, el('label', { class: 'ctl' }, [cbFull, 'hiện đủ tools trong request'])]),
        who, json, cap,
        el('h4', { style: 'margin:14px 0 2px;font-size:13px', text: 'Token input của từng request' }), chart,
        el('div', { class: 'legend' }, [el('span', {}, [el('i', { style: 'background:var(--g1)' }), 'overhead 286 + tools']), el('span', {}, [el('i', { style: 'background:var(--g4)' }), 'system']), el('span', {}, [el('i', { style: 'background:var(--dim)' }), 'messages gửi lại']), el('span', {}, [el('i', { style: 'background:var(--accent)' }), 'messages mới'])]),
        stat,
        el('p', { class: 'hint', text: 'Model là kịch bản giả lập theo dữ liệu tool trả về, không gọi API thật. Token ước lượng từ chuỗi JSON thật trong khung trên; tokenizer thật cho số khác.' }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));

    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {

      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),

      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),

})();
