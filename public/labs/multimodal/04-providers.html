const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);

    const E = hiRes ? 2576 : 1568, T = hiRes ? 4784 : 1568;
    const tk = (s) => Math.ceil(Math.floor(w * s) / 28) * Math.ceil(Math.floor(h * s) / 28);

      {
        q: 'Gemini tính cố định theo mức. Vậy thu nhỏ ảnh trước khi gửi Gemini còn có ích không?',
        a: `<p>Không giảm token, nhưng vẫn có ích ở chỗ khác. Gemini 3 và 4 đưa ảnh về ngân sách của mức <code>media_resolution</code>: low 280, medium 560, high 1.120, ultra_high 2.240 (chỉ đặt được theo từng ảnh). Mặc định là 1.120. Thu nhỏ ảnh 12 MP xuống 1.568 px không đổi 1.120 token, nhưng giảm băng thông và giúp request giữ dưới giới hạn 20 MB inline.</p>
<p>Cái bẫy là <b>các trang docs mâu thuẫn nhau</b>. Trang image understanding và token counting vẫn ghi cách tính của thế hệ trước: ảnh có cả hai cạnh ≤ 384 px tính 258 token, ảnh lớn hơn chia tile 768×768, mỗi tile 258 token. Nếu đội bạn dự toán theo trang đó, con số sẽ lệch.</p>
<p>Bảng dưới tính cả hai cách cho các ảnh trong lab. Cột "thế hệ trước" dùng cách chia tile đơn giản ⌈w/768⌉ × ⌈h/768⌉, chỉ để thấy độ lệch.</p>`,
        viz(box) {

      {

<p>Điều hay bị quên: con số 20 tính <b>cả ảnh ở các lượt trước</b> và ảnh trong <code>tool_result</code>. Khách gửi 5 ảnh mỗi lượt, đến lượt thứ 5 là 25 ảnh trong lịch sử. Request lượt 5 bị từ chối dù lượt đó chỉ gửi 5 ảnh. Agent chụp màn hình qua nhiều lượt rất dễ chạm quy tắc này.</p>`,

      {
        q: 'Gửi ảnh bằng base64, URL hay file_id thì khác nhau gì?',
        a: `<p>Ba cách, cùng một ảnh, nhưng khác ở <b>dung lượng request</b> và <b>vòng đời</b>:</p>
<ul><li><b>base64</b>: byte của ảnh viết thành chữ, nhét thẳng vào JSON. Mỗi 3 byte thành 4 ký tự, nên request nặng hơn file khoảng một phần ba. Gemini gộp mọi thứ inline vào giới hạn 20 MB của cả request, gồm prompt và mọi file. Claude ghi giới hạn mỗi ảnh là "10 MB (base64)".</li>
<li><b>URL</b>: provider tự tải ảnh. Request nhẹ, nhưng ảnh phải công khai (Grok yêu cầu URL công khai), và bạn không kiểm soát được lúc provider tải.</li>
<li><b>Files API / file_id</b>: upload một lần, các request sau chỉ gửi id. Không giảm token, nhưng giảm băng thông và tránh giới hạn dung lượng. File trên Files API của Gemini tự xoá sau 48 giờ, nên đừng lưu <code>file.name</code> vào database như một tham chiếu lâu dài.</li></ul>
<p>OpenAI có một chi tiết: file dùng làm input upload với <code>purpose: "user_data"</code>; <code>purpose: "vision"</code> là dữ liệu fine-tune vision. Trên Bedrock, Claude chỉ nhận base64, mỗi ảnh tối đa 5 MB.</p>`,
        viz(box) {

            el('div', { class: 'cap', text: 'Hệ số 4/3 là tính chất của mã hoá base64, không phải số của provider. Dung lượng file là giả định.' }));

<ol><li><b>Ngân sách pixel mỗi ảnh.</b> Qwen3-VL dùng patch 16 px gộp 2×2, mỗi token ứng với vùng 32×32 px. Processor thu hoặc phóng ảnh về khoảng <code>[min_pixels, max_pixels]</code>. 256 đến 1.280 token mỗi ảnh nghĩa là <code>min_pixels = 256×32×32</code>, <code>max_pixels = 1280×32×32 = 1310720</code>. Để mặc định thì một ảnh lớn có thể chiếm hàng nghìn token và đẩy KV cache ra khỏi GPU. (KV cache: vùng nhớ GPU giữ kết quả tính sẵn cho từng token đang nằm trong context. Mỗi token ảnh chiếm một phần vùng nhớ này, nên ảnh to thì còn ít chỗ cho request khác chạy song song.)</li>
<li><b>Số media mỗi request.</b> vLLM cấp phát bộ nhớ theo <code>--limit-mm-per-prompt</code>, ví dụ <code>{"image": 4, "video": 0}</code>. Đặt modality không dùng về 0.</li>
<li><b>Tham số processor từ client.</b> vLLM nhận <code>mm_processor_kwargs</code> theo request, nhưng client gửi <code>max_pixels</code> rất lớn là chiếm được nhiều tài nguyên. Với API công khai, bật cờ từ chối giá trị lạ và đặt ngân sách ở phía server.</li></ol>

function terms(list) {

    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;

    el('h3', { text: '10 vạn câu hỏi vì sao' }),

    ...list.map((d, i) => {
