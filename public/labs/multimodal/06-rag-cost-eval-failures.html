const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';

<li>Tiền xử lý phải xác định. Lưu ảnh đã xử lý hoặc <code>file_id</code>, gửi lại đúng bản đó.</li>
<li>Files API giảm băng thông và tránh giới hạn dung lượng, không giảm token.</li>
<li>Thay ảnh cũ bằng bản trích xuất: mất cache một lần, giảm chi phí mọi lượt sau. Agent chụp màn hình: chỉ giữ vài ảnh gần nhất.</li></ul>
<h4>Eval cho vision (§3.6)</h4>
<ul><li>Thu mẫu theo nguồn thật, giữ phân bố điều kiện chụp (nghiêng, mờ, dấu đỏ, viết tay).</li>
<li>Chấm theo trường. Tách ba loại lỗi: đọc sai, bỏ sót, bịa. Có mẫu cố ý thiếu trường để đo bịa.</li>
<li>Tỉ lệ sai ký tự có dấu là metric riêng. Chạy eval ở vài mức detail / media_resolution / kích thước.</li>
<li>Benchmark công khai (DocVQA, ChartQA, OmniDocBench, olmOCR-bench) chủ yếu tiếng Anh và tiếng Trung, chỉ để tham khảo.</li></ul>
<h4>Failure modes và checklist (§3.7–3.8)</h4>
<p>Câu hỏi 9 và 10 bên dưới có bảng tra triệu chứng và checklist tương tác lấy từ README. Nhóm checklist: đầu vào, giới hạn, trích xuất, vận hành.</p>
<div class="verdict"><b>Hai câu cần nhớ:</b> cache chỉ rẻ khi prefix giống nhau từng byte và còn trong TTL; độ chính xác chỉ có nghĩa khi tách được loại lỗi, vì một lỗi bịa nguy hiểm hơn nhiều lỗi bỏ sót.</div>`,
    why: {
      c: 'Bật prompt caching với ảnh nằm trong prefix ổn định, lưu và gửi lại đúng byte đã xử lý, thay ảnh bằng bản trích xuất khi cuộc hội thoại không cần nhìn lại. Đo chất lượng bằng eval theo trường trên mẫu lấy từ production, tách đọc sai, bỏ sót, bịa, và so khớp chặt với chữ có dấu.',
      s: 'Không cache: trả giá đầy đủ cho ảnh ở mọi lượt. Cache nhưng xử lý lại ảnh mỗi lượt: trả phí ghi 1,25× mỗi lượt, đắt hơn không cache. Eval theo tài liệu "đúng/sai": không biết sửa ở đâu. So khớp mờ bỏ dấu: điểm đẹp nhưng tên công ty sai dấu vẫn được tính đúng. Một con số accuracy chung: che mất lỗi bịa.',

        a: `<p>Vì API không có trí nhớ. Mỗi request là độc lập: model chỉ thấy những gì nằm trong request đó. Muốn model "nhớ" tấm ảnh ở lượt 1, bạn phải gửi lại nó trong mảng <code>messages</code> ở mọi lượt sau. Và mỗi lần gửi, ảnh lại được tính token.</p>
<p>Kéo thanh trượt để xem mảng <code>messages</code> của request ở lượt N. Ảnh ở message đầu tiên vẫn nằm đó, lượt nào cũng vậy.</p>`,

        take: 'Ảnh không được "nhớ", ảnh được gửi lại. Câu hỏi về chi phí là: gửi lại với giá nào.'

      {
        q: 'Bật cache rồi, sao có lượt vẫn trả đủ giá cho ảnh?',
        a: `<p>Cache của Claude khớp theo <b>prefix từng byte</b>. Provider băm phần đầu request; lượt sau phải giống hệt từ byte đầu tiên mới đọc lại được. Ba thứ hay làm vỡ:</p>
<ul><li><b>Tiền xử lý không xác định</b>: mỗi lượt bạn đọc lại ảnh gốc và resize lại. Nếu bước đó ghi metadata thời gian, chọn quality khác, hoặc thư viện resize cho kết quả khác, byte khác, cache miss.</li>
<li><b>Hết TTL</b>: cache Claude mặc định sống 5 phút. Khách đi pha cà phê rồi quay lại hỏi tiếp là phải ghi lại từ đầu.</li>
<li><b>Xử lý lại bản đã xử lý</b>: kể cả khi hàm tiền xử lý xác định, chạy nó lần hai trên file JPEG đã xử lý sẽ nén JPEG thêm một lần và ra byte khác (POC lab 5: sha256 be908f… thành 77af61…). Đầu vào khác thì đầu ra khác.</li>
<li><b>Prefix quá ngắn</b>: Haiku 4.5 cần ít nhất 4.096 token mới cache được (Opus 5.5 là 512, theo README Multi-turn). Câu hỏi tiếp theo đi sâu vào trường hợp này.</li></ul>
<p>Ô dưới băm ba "phiên bản" của cùng một ảnh (băm = tính dấu vân tay ngắn của chuỗi byte). Đây là hàm băm đơn giản (FNV-1a) trên chuỗi mô tả byte, không phải byte ảnh thật, chỉ để thấy một thay đổi nhỏ làm hash khác hoàn toàn.</p>`,
        viz(box) {
          const fnv = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };

      {
        q: 'README nói cache giải quyết phần lớn chi phí ảnh. Sao POC trên Haiku 4.5 bật cache 10 lượt vẫn trả 93%?',
        a: `<p><b>Chuyện gì xảy ra.</b> Với 1 ảnh hoá đơn, bật cache đúng cách trên Haiku 4.5 chỉ giảm tiền input từ 100% xuống 93%. Trên Opus 5.5, cùng hội thoại xuống còn 18%.</p>
<p><b>Vì sao, về cơ học.</b> Claude chỉ cache prefix dài ít nhất một ngưỡng tối thiểu, và ngưỡng khác nhau theo model: Haiku 4.5 là 4.096 token, Opus 5.5 là 512 (README Multi-turn). Đếm request lượt 1: system prompt 1.500 (giả định) + ảnh 1.564 (công thức Claude standard) + câu hỏi khoảng 25 ≈ 3.100 token. Thiếu khoảng 1.000 token. Mỗi lượt sau chỉ thêm khoảng 130 token (câu trả lời trước + câu hỏi mới), nên phải tới lượt 9 request mới vượt 4.096 để ghi cache, và chỉ lượt 10 được đọc. Tám lượt đầu trả giá thường. Lượt 9 còn trả phí ghi 1,25×.</p>
<p><b>Điều này không có nghĩa</b> README sai hay cache vô dụng. Lời khuyên của README đúng khi prefix vượt ngưỡng: kéo thanh trượt lên 2 ảnh, lượt 1 đã khoảng 4.650 token, cache chạy từ lượt 1 và tiền rơi xuống khoảng một phần tư. Nó cũng không có nghĩa nên nhồi thêm ảnh cho đủ ngưỡng: điều cần nhớ là cache chỉ có tác dụng khi prefix ổn định <b>và</b> đủ dài.</p>
<p><b>Trong hệ thống thật:</b> tra ngưỡng tối thiểu của đúng model trước khi đưa "tiết kiệm nhờ cache" vào dự toán. README Multi-turn ghi: prefix chưa đủ dài thì request vẫn chạy, không báo lỗi, chỉ có <code>cache_creation_input_tokens</code> bằng 0. Log trường này ngay từ ngày đầu. Nếu prefix của bạn luôn dưới ngưỡng, cách giảm tiền còn lại là thu nhỏ ảnh hoặc thay ảnh bằng bản trích xuất (POC: 71% trên Haiku).</p>`,

        a: `<p>README nêu ba cách, đánh đổi giữa đơn giản và độ trung thực:</p>

<li><b>Embedding đa phương thức</b>: ảnh và text vào cùng không gian vector, truy vấn bằng text tìm được ảnh.</li>

<p>Lab dưới so dung lượng index. README chỉ nói "hàng trăm vector" mỗi trang, nên số vector mỗi trang và số chiều đều là giả định.</p>`,

        select('Model', Object.entries(MODELS).map(([k, m]) => [k, m.name]), S.model, (v) => { S.model = v; render(); }).node,
        select('Chiến lược', Object.entries(STRAT), S.strategy, (v) => { S.strategy = v; render(); }).node]),
      el('div', { class: 'row' }, [
        slider('Số ảnh lượt 1', 1, 5, 1, S.nimg, (v) => { S.nimg = v; render(); }).node,
        slider('Số lượt', 2, 30, 1, S.turns, (v) => { S.turns = v; render(); }).node,
        slider('Khoảng cách giữa các lượt', 1, 15, 1, S.gap, (v) => { S.gap = v; render(); }, (v) => v + ' phút').node, kS.node]),
      svg, el('div', { class: 'legend', html: '<span><i style="background:var(--accent)"></i>Cấu hình hiện tại (cộng dồn)</span><span><i style="background:var(--dim)"></i>Không cache</span><span><i style="background:var(--ok)"></i>Cache đúng cách</span><span><i style="background:var(--ok);border-radius:2px"></i>Cột: đọc cache</span><span><i style="background:var(--warn);border-radius:2px"></i>ghi cache</span><span><i style="background:var(--dim);border-radius:2px"></i>giá thường</span>' }),
      stat, flags,
      el('p', { class: 'hint', text: 'Giá, hệ số đọc/ghi cache, TTL 5 phút và ngưỡng cache tối thiểu lấy từ README (Multimodal §1.2, Multi-turn §1.4). Ảnh 3024×4032 tính bằng công thức Claude. System 1.500 token và câu trả lời 120 token là giả định; câu hỏi ước tính 1 token ≈ 3 ký tự. Mô phỏng đặt breakpoint cache (điểm đánh dấu "cache tới đây") ở cuối mỗi lượt. Chỉ tính input.' }));
      stage.append(el('h4', { text: 'Eval theo trường trên 8 hoá đơn đã gán nhãn', style: 'margin:24px 0 4px' }));
      const E = { conf: 'A', fuzzy: false }, evalBox = el('div'), grid = el('div'), eflags = el('div');
      function renderEval() {
        const g = grade(E.conf, E.fuzzy, false), strict = grade(E.conf, false, false);
        let okSum = 0;
        const rows = F.map(([k, nm]) => { const p = g.per[k]; okSum += p.ok; return `<tr><td>${nm}</td><td class="mono">${p.ok}/${g.n}</td><td class="mono">${p.wrong}</td><td class="mono">${p.miss}</td><td class="mono ${p.fab ? 'bad' : ''}"><b>${p.fab}</b></td><td class="mono"><b>${(p.ok / g.n * 100).toFixed(0)}%</b></td></tr>`; }).join('');
        const fieldAcc = okSum / (g.n * F.length), docAcc = g.docOk / g.n, fab = F.reduce((a, [k]) => a + g.per[k].fab, 0);
        evalBox.replaceChildren(tbl('<tr><th>Trường</th><th>Đúng</th><th>Đọc sai</th><th>Bỏ sót</th><th>Bịa</th><th>Accuracy</th></tr>' + rows +
          `<tr class="cur"><td><b>Trung bình theo trường</b></td><td colspan="4">${okSum}/${g.n * F.length} lần chấm</td><td class="mono"><b>${(fieldAcc * 100).toFixed(1)}%</b></td></tr><tr class="cur"><td><b>Theo tài liệu (đúng cả 5 trường)</b></td><td colspan="4">${g.docOk}/${g.n} hoá đơn</td><td class="mono"><b>${(docAcc * 100).toFixed(0)}%</b></td></tr><tr><td>Sai ký tự có dấu (tên đơn vị bán)</td><td colspan="4">${g.diaErr}/${g.diaTot} ký tự có dấu</td><td class="mono"><b>${(g.diaErr / g.diaTot * 100).toFixed(1)}%</b></td></tr>`));
        const C = { ok: ['var(--ok)', 'đúng'], wrong: ['var(--warn)', 'đọc sai'], miss: ['var(--g1)', 'bỏ sót'], fab: ['var(--bad)', 'bịa'] };
        grid.replaceChildren(el('div', { style: 'display:grid;grid-template-columns:minmax(120px,170px) repeat(5,minmax(0,1fr));gap:3px;font-size:12px;margin-top:10px' }, [
          el('span', {}), ...F.map(([, nm]) => el('b', { class: 'mute', text: nm, style: 'font-size:11.5px' })),
          ...g.cells.flatMap((d) => [el('span', { text: d.c }), ...d.row.map((r) => el('span', { text: C[r][1], style: `text-align:center;border-radius:3px;padding:2px 0;color:var(--panel);background:${C[r][0]}` }))])]));
        const fl = [];
        if (fab) fl.push(flag('bad', `<b>${fab} trường bị bịa.</b> Hoá đơn hộ kinh doanh không có mã số thuế, nhưng schema bắt buộc trường này nên model điền một mã hợp lệ về định dạng. Lỗi này qua được mọi validator và đi thẳng vào hệ thống. Không có nghĩa model "nói dối": nó bị buộc phải điền. Trong hệ thống thật: cho phép null, có mẫu cố ý thiếu trường trong bộ eval, theo dõi riêng cột "Bịa".`));
        if (E.fuzzy && g.per.name.ok !== strict.per.name.ok) fl.push(flag('warn', `<b>So khớp bỏ dấu đẩy accuracy tên từ ${(strict.per.name.ok / g.n * 100).toFixed(0)}% lên ${(g.per.name.ok / g.n * 100).toFixed(0)}%.</b> "Cửa hàng Anh Dương" và "Cửa hàng Ánh Dương" được tính là khớp, dù là hai tên khác nhau. Không có nghĩa model đã đọc đúng. Trong hệ thống thật: so khớp chặt với chữ có dấu, và đo tỉ lệ sai ký tự có dấu như một metric riêng (${(g.diaErr / g.diaTot * 100).toFixed(1)}% ở đây).`));

        eflags.replaceChildren(...fl);
      }
      stage.append(el('div', { class: 'row' }, [select('Cấu hình', Object.entries(CONF), E.conf, (v) => { E.conf = v; renderEval(); }).node,
        select('So khớp tên', [['strict', 'Chặt (giữ dấu)'], ['fuzzy', 'Mờ (bỏ dấu, chữ thường)']], 'strict', (v) => { E.fuzzy = v === 'fuzzy'; renderEval(); }).node]),
      evalBox, grid, el('div', { class: 'legend', html: '<span><i style="background:var(--ok)"></i>đúng</span><span><i style="background:var(--warn)"></i>đọc sai</span><span><i style="background:var(--g1)"></i>bỏ sót (null khi có giá trị)</span><span><i style="background:var(--bad)"></i>bịa (có giá trị khi tài liệu không có)</span>' }), eflags,
      el('p', { class: 'hint', text: 'Dữ liệu dựng sẵn: 8 hoá đơn, đáp án và dự đoán của hai cấu hình là ví dụ, không phải kết quả đo. Mọi tỉ lệ tính trong trình duyệt. Bộ thật cần nhiều mẫu hơn nhiều; xem tài liệu Evaluation.' }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));

      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])

      pocBlock(l.poc)

    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }

})();
