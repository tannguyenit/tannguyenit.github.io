const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const fT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const usd = (x) => '$' + (x < 10 ? x.toFixed(2) : fT(x)).replace('.', ',');
  const flag = (kind, html) => el('div', { style: `border-left:4px solid var(--${kind});background:color-mix(in srgb, var(--${kind}) 9%, var(--panel));padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:13.5px`, html });
  const READ_PX = 8;

  function claude(w, h, hi) {
    const [me, mt] = hi ? [2576, 4784] : [1568, 1568];
    const t = (s) => Math.ceil(Math.floor(w * s) / 28) * Math.ceil(Math.floor(h * s) / 28);
    let s = Math.min(1, me / Math.max(w, h));
    if (t(s) > mt) {
      let lo = 0, up = s;
      for (let i = 0; i < 50; i++) { const m = (lo + up) / 2; if (t(m) <= mt) lo = m; else up = m; }
      s = lo;
    }
    const W = Math.floor(w * s), H = Math.floor(h * s);
    return { tok: t(s), s, W, H, gx: Math.ceil(W / 28), gy: Math.ceil(H / 28), cell: 28 };
  }
  function oaiPatch(w, h, mult) {
    const budget = 2500;
    const p = (s) => Math.ceil(Math.floor(w * s) / 32) * Math.ceil(Math.floor(h * s) / 32);
    let s = 1;
    if (p(1) > budget) { s = Math.sqrt(budget / p(1)); for (let i = 0; i < 400 && p(s) > budget; i++) s *= 0.998; }
    const W = Math.floor(w * s), H = Math.floor(h * s), pc = p(s);
    return { tok: Math.ceil(pc * mult), s, W, H, gx: Math.ceil(W / 32), gy: Math.ceil(H / 32), cell: 32, patches: pc };
  }
  function oaiTile(w, h, detail) {
    if (detail === 'low') return { tok: 70, s: null, W: null, H: null, gx: 0, gy: 0, cell: 512 };
    const s1 = Math.min(1, 2048 / Math.max(w, h));
    const s2 = Math.min(1, 768 / Math.min(w * s1, h * s1));
    const s = s1 * s2, W = Math.floor(w * s), H = Math.floor(h * s);
    const gx = Math.ceil(W / 512), gy = Math.ceil(H / 512);
    return { tok: 70 + 140 * gx * gy, s, W, H, gx, gy, cell: 512 };
  }
  const GEM3 = { low: 280, medium: 560, high: 1120, ultra_high: 2240 };
  function gemOld(w, h) {
    if (w <= 384 && h <= 384) return { tok: 258, s: 1, W: w, H: h, gx: 1, gy: 1, cell: Math.max(w, h) };
    const gx = Math.ceil(w / 768), gy = Math.ceil(h / 768);
    return { tok: 258 * gx * gy, s: 1, W: w, H: h, gx, gy, cell: 768 };
  }

  function rows(w, h, gl) {
    return [
      { id: 'cstd', name: 'Claude standard (vd. Haiku 4.5)', r: claude(w, h, false), src: 'README §1.2' },

      { id: 'oa', name: 'OpenAI gpt-6-astra, detail high (×1,2)', r: oaiPatch(w, h, 1.2), src: 'công thức README; ngân sách 2.500 patch suy từ ví dụ 2048→1600' },
      { id: 'onano', name: 'OpenAI gpt-5-nano, detail high (×1,5)', r: oaiPatch(w, h, 1.5), src: 'như trên, multiplier 1,5' },
      { id: 'ot', name: 'OpenAI gpt-5.1, tile 512, detail high', r: oaiTile(w, h, 'high'), src: 'README §1.2: 70 + 140 × tile' },
      { id: 'otl', name: 'OpenAI gpt-5.1, detail low', r: oaiTile(w, h, 'low'), src: 'README §1.2: chỉ base' },
      { id: 'g3', name: `Gemini 3/4, media_resolution ${gl}`, r: { tok: GEM3[gl], s: null, W: null, H: null, gx: 0, gy: 0 }, src: 'README §1.2, cố định' },
      { id: 'gold', name: 'Gemini đời cũ (tile 768)', r: gemOld(w, h), src: 'README §1.2' }
    ];
  }

        tbl.replaceChildren(el('table', { html: '<tr><th>Provider / model</th><th>Model thấy</th><th>Token</th><th>Tiền / 1.000 ảnh</th><th>Chữ còn</th></tr>' + R.map((x) => {
          const r = x.r, px = r.s ? st.txt * r.s : null;
          return `<tr class="${x.id === st.view ? 'cur' : ''}"><td>${x.name}<br><span class="hint" style="margin:0;font-size:11px">${x.src}</span></td><td class="mono">${r.W ? fT(r.W) + '×' + fT(r.H) : '?'}</td><td class="mono">${fT(r.tok)}</td><td class="mono">${usd((r.tok * st.price * 1000) / 1e6)}</td><td class="mono ${px === null ? '' : px < READ_PX ? 'bad' : 'ok'}">${px === null ? '?' : px.toFixed(1).replace('.', ',') + ' px'}</td></tr>`;
        }).join('') }));
        const mp = (st.w * st.h) / 1e6, cs = R[0].r, ch = R[1].r;
        stat.innerHTML = `<span>Ảnh gốc: <b>${fT(st.w)}×${fT(st.h)}</b> (${mp.toFixed(1).replace('.', ',')} MP)</span><span>Claude standard giữ: <b>${((cs.W * cs.H) / (st.w * st.h) * 100).toFixed(0)}%</b> số pixel</span><span>High-res / standard: <b>×${(ch.tok / cs.tok).toFixed(2).replace('.', ',')}</b></span><span>Đơn giá đang dùng: <b>$${st.price}/1M</b> (áp cho mọi dòng chỉ để so token)</span>`;
        const f = [], r = cur.r, px = r.s ? st.txt * r.s : null;
        if (px !== null && px < READ_PX) f.push(flag('bad', `<b>Dòng chữ nhỏ còn ${px.toFixed(1).replace('.', ',')} px khi tới model.</b> Provider thu ảnh theo hệ số ×${r.s.toFixed(3).replace('.', ',')} trước khi cắt patch, nên chữ ${st.txt} px trên ảnh gốc chỉ còn chưa tới một phần ba ô ${r.cell} px. Không có nghĩa model kém: nó nhận bản mờ và không biết bản đó mờ, nên thường đoán ra dãy số hợp lý thay vì trả null.<br>Trong hệ thống thật: cắt vùng chân hoá đơn gửi riêng (thử mẫu "Vùng chân hoá đơn đã cắt 1200×300"), với Claude đặt <code>transformations.oversized_image: "error"</code> trên image block để API trả lỗi 400 thay vì âm thầm thu nhỏ (README §3.7).`));
        if (ch.tok / cs.tok >= 1.7) f.push(flag('warn', `<b>Cùng ảnh, Claude high-res tốn ×${(ch.tok / cs.tok).toFixed(2).replace('.', ',')} token so với standard</b> (${fT(ch.tok)} so với ${fT(cs.tok)}). Đơn giá token không đổi khi nâng lên model 4.7+, nhưng tier phân giải đổi. Không có nghĩa high-res là lãng phí: chữ nhỏ còn nhiều pixel hơn.<br>Trong hệ thống thật: đo lại <code>usage.input_tokens</code> sau mỗi lần đổi model; thu ảnh về kích thước tác vụ cần.`));
        if (cur.id === 'cstd' || cur.id === 'chi') {
          const [me, mt] = cur.id === 'chi' ? [2576, 4784] : [1568, 1568], k = Math.min(1, me / Math.max(st.w, st.h));
          const ew = Math.floor(st.w * k), eh = Math.floor(st.h * k), et = Math.ceil(ew / 28) * Math.ceil(eh / 28);
          if (k < 1 && et > mt) f.push(flag('warn', `<b>Khung model thấy là ${fT(r.W)}×${fT(r.H)}, nhỏ hơn trần cạnh ${fT(me)} px.</b> Thu về cạnh ${fT(me)} cho ra ${fT(ew)}×${fT(eh)} = ${fT(et)} token, vượt trần ${fT(mt)} token, nên ảnh bị thu thêm. Không có nghĩa lab tính sai hay README sai: README ghi cả hai trần, chỉ là với ảnh không quá dài thì trần token chặn trước.<br>Trong hệ thống thật: đặt kích thước resize theo hàm token của README (ở đây ${fT(r.W)}×${fT(r.H)}), không chỉ theo max_long_edge.`));
        }
        const g = R.find((x) => x.id === 'g3').r.tok;
        if (cs.tok < g / 2) f.push(flag('warn', `<b>Ảnh nhỏ mà Gemini 3 vẫn tính ${fT(g)} token</b>, gấp ${(g / cs.tok).toFixed(1).replace('.', ',')} lần Claude standard (${fT(cs.tok)}). Ngân sách Gemini 3 cố định theo media_resolution, không theo pixel. Không có nghĩa Gemini đắt hơn nói chung: với ảnh lớn thì ngược lại.<br>Trong hệ thống thật: với Gemini 3, hạ media_resolution khi ảnh nhỏ hoặc tác vụ đơn giản.`));
        if (Math.max(st.w, st.h) > 8000) f.push(flag('bad', `<b>Cạnh ${fT(Math.max(st.w, st.h))} px vượt giới hạn 8000×8000 px của Claude</b> (README, Tra cứu nhanh). Ảnh bị từ chối chứ không được thu nhỏ. Tự thu nhỏ trước khi gửi.`));
        if (Math.max(st.w, st.h) > 3000) f.push(flag('warn', `Cạnh dài > 3.000 px: với Claude, request có <b>hơn 20</b> ảnh hoặc document block (tính cả lượt trước) sẽ bị từ chối với lỗi "many-image requests". Tự thu nhỏ còn tránh được lỗi này.`));
        flags.replaceChildren(...f);
      }

      stage.append(el('div', { class: 'row' }, [pS.node, vS.node]), el('div', { class: 'row' }, [wS.node, hS.node]), el('div', { class: 'row' }, [tS.node, gS.node, prS.node]),
        svg, el('div', { class: 'legend', html: '<span><i style="background:var(--accent)"></i>khung model thấy</span><span><i style="background:var(--g1)"></i>patch / tile</span><span><i style="background:var(--warn)"></i>dòng chữ nhỏ</span>' }),
        tbl, stat, flags,
        el('p', { class: 'hint', text: `Công thức, trần, multiplier và đơn giá lấy từ README §1.2. Hàm Claude là hàm ước lượng trong README (khớp tám con số ví dụ). Ngân sách 2.500 patch của OpenAI detail high suy ra từ ví dụ 2048→1600 của docs; cách thu nhỏ OpenAI là ước lượng. Ngưỡng ${READ_PX} px là giả định.` }));
      render();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
