const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const fT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const dec = (x, d = 1) => x.toFixed(d).replace('.', ',');
  const usd = (x) => '$' + (x < 0.01 ? x.toFixed(5) : x < 10 ? x.toFixed(4) : fT(x)).replace('.', ',');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const flag = (kind, html) => el('div', { style: `border-left:4px solid var(--${kind});background:color-mix(in srgb, var(--${kind}) 9%, var(--panel));padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:13.5px`, html });
  const READ_PX = 8;

  function claude(w, h, hi) {
    const [me, mt] = hi ? [2576, 4784] : [1568, 1568];
    const t = (s) => Math.ceil(Math.floor(w * s) / 28) * Math.ceil(Math.floor(h * s) / 28);
    let s = Math.min(1, me / Math.max(w, h));
    if (t(s) > mt) {
      let lo = 0, up = s;
      for (let i = 0; i < 50; i++) { const m = (lo + up) / 2; if (t(m) <= mt) lo = m; else up = m; }
      s = lo;
    }
    return { tok: t(s), s, W: Math.floor(w * s), H: Math.floor(h * s) };
  }
  function oai(w, h) {
    const p = (s) => Math.ceil(Math.floor(w * s) / 32) * Math.ceil(Math.floor(h * s) / 32);
    let s = 1;
    if (p(1) > 2500) { s = Math.sqrt(2500 / p(1)); for (let i = 0; i < 400 && p(s) > 2500; i++) s *= 0.998; }
    return { tok: Math.ceil(p(s) * 1.2), s, W: Math.floor(w * s), H: Math.floor(h * s) };
  }
  const PROV = {
    haiku: { name: 'Claude Haiku 4.5 (standard)', img: (w, h) => claude(w, h, false), cap: 1568, mt: 1568, price: 1, audio: false, pdfPage: () => 1500 + claude(1240, 1754, false).tok },
    opus: { name: 'Claude Opus 5.5 (high-res)', img: (w, h) => claude(w, h, true), cap: 2576, mt: 4784, price: 4, audio: false, pdfPage: () => 1500 + claude(1240, 1754, true).tok },
    gpt: { name: 'OpenAI gpt-6-astra, detail high', img: oai, cap: 2048, price: null, audio: false, pdfPage: () => null },
    gemini: { name: 'Gemini 3/4, mặc định', img: () => ({ tok: 1120, s: null, W: null, H: null }), cap: null, price: null, audio: true, pdfPage: () => 560 }
  };
  const INPUTS = {
    photo: { name: 'Ảnh tai nghe vỡ + nhãn đơn trên hộp (4032×3024, EXIF xoay 6)', kind: 'image', w: 3024, h: 4032, small: 20, smallName: 'mã đơn trên nhãn hộp', mb: 3.5 },
    pdfText: { name: 'Hoá đơn PDF 2 trang, text layer sạch', kind: 'pdf', pages: 2, text: true, small: 10, smallName: 'MST chân trang', mb: 0.2 },
    pdfScan: { name: 'Hoá đơn scan 2 trang, không text layer', kind: 'pdf', pages: 2, text: false, small: 10, smallName: 'MST chân trang', mb: 0.8 },
    voice: { name: 'Tin nhắn thoại 45 giây', kind: 'audio', sec: 45, mb: 0.18 }
  };
  const TRANSCRIPT = 'Chào shop, tôi mua tai nghe đơn SV-4821, mới dùng một tuần thì loa trái bị rè, vỏ hộp sạc cũng nứt. Đây là lần thứ hai tôi gặp lỗi, tôi rất bực. Shop đổi giúp tôi máy mới.';
  const estTok = (s) => Math.ceil(s.length / 3);
  const ORDERS = { 'SV-4821': { product: 'Tai nghe không dây Pro X', total: 1250000 } };

  function run(c) {
    const I = INPUTS[c.input], P = PROV[c.prov], r = { stages: [], issues: [], tokens: 0, stt: 0, seen: '', guessed: [], nulls: [] };
    let readable = true, sidewaysImg = false, eff = null;
    if (I.kind === 'image') {
      const stored = c.exif ? [I.w, I.h] : [I.h, I.w];
      sidewaysImg = !c.exif;
      const sent = c.resize && P.cap ? (() => { const k = Math.min(1, P.cap / Math.max(...stored)); return [Math.round(stored[0] * k), Math.round(stored[1] * k)]; })() : stored;
      const im = P.img(sent[0], sent[1]);
      const ks = c.resize && P.cap ? P.cap / Math.max(I.w, I.h) : 1;
      r.tokens = im.tok; r.im = im;
      eff = im.s === null ? null : I.small * Math.min(1, ks) * (im.s || 1);
      if (c.crop) { r.tokens += P.img(1300, 140).tok; eff = I.small * (P.img(1300, 140).s || 1); }
      r.sent = sent; r.seen = im.W ? `${fT(im.W)}×${fT(im.H)}${sidewaysImg ? ' (nằm ngang)' : ''}` : '1.120 token cố định';
      r.mbSent = c.resize ? 0.4 : I.mb;
      readable = (eff === null ? !sidewaysImg : eff >= READ_PX) && !sidewaysImg;
    } else if (I.kind === 'pdf') {
      const per = P.pdfPage();
      const textTok = I.text ? 1500 : 0;
      r.tokens = per === null ? null : (I.text ? per : per - (P === PROV.gemini ? 0 : 1500)) * I.pages;

      const pageS = P === PROV.gemini ? null : P.img(1240, 1754).s;
      eff = I.text || pageS === null ? null : I.small * pageS;
      if (c.crop && !I.text) { const cr = P.img(1240, 160); r.tokens = r.tokens === null ? null : r.tokens + cr.tok; if (eff !== null) eff = I.small * cr.s; }

    } else {
      if (P.audio) { r.tokens = I.sec * 25; r.seen = `${I.sec} s audio = ${fT(I.sec * 25)} token`; }
      else { r.stt = (I.sec / 60) * 0.006; r.tokens = estTok(TRANSCRIPT); r.seen = `bản chép lời ~${fT(r.tokens)} token (ước lượng)`; }
      r.mbSent = I.mb;
    }
    r.eff = eff; r.readable = readable; r.sideways = sidewaysImg;
    r.cost = r.tokens !== null && P.price ? (r.tokens * P.price) / 1e6 : null;

    let out;
    if (I.kind === 'image') {
      const oid = readable ? 'SV-4821' : c.nullOk ? null : 'SV-4827';
      if (!readable && c.nullOk) r.nulls.push('order_id');
      if (!readable && !c.nullOk) r.guessed.push('order_id');
      out = { order_id: oid, product: 'Tai nghe không dây Pro X', defect: 'vỏ hộp sạc nứt', unreadable_fields: r.nulls };
    } else if (I.kind === 'pdf') {
      const tax = readable ? '0312345678' : c.nullOk ? null : '0312345670';
      if (!readable && c.nullOk) r.nulls.push('tax_code');
      if (!readable && !c.nullOk) r.guessed.push('tax_code');
      out = { invoice_number: 'HD-00918', order_id: 'SV-4821', tax_code: tax, subtotal: 1136364, vat_amount: 113636, total: 1250000, total_raw: '1.250.000đ', items: [{ description: 'Tai nghe không dây Pro X', quantity: 1, amount: 1136364 }], page: 1, unreadable_fields: r.nulls };
    } else {
      out = { order_id: 'SV-4821', defect: 'loa trái rè; vỏ hộp sạc nứt', request: 'đổi máy mới', customer_mood: P.audio ? 'bực (từ lời và giọng)' : 'bực (chỉ từ chữ "tôi rất bực")', unreadable_fields: [] };
    }
    r.out = out;

    const checks = [];
    if (out.order_id !== undefined) {
      const o = out.order_id;
      checks.push(['order_id đúng dạng SV-dddd', o === null ? null : /^SV-\d{4}$/.test(o)]);
      checks.push(['order_id có trong đơn của khách này', o === null ? null : !!ORDERS[o]]);

    if (I.kind === 'pdf') {
      checks.push(['subtotal + VAT = total', out.subtotal + out.vat_amount === out.total]);

      checks.push(['total khớp đơn SV-4821', ORDERS[out.order_id] ? ORDERS[out.order_id].total === out.total : false]);
    }
    r.checks = checks;
    r.failed = checks.filter(([, v]) => v === false).map(([n]) => n);
    r.review = r.nulls.length > 0 || (c.checks && r.failed.length > 0);
    r.silentWrong = r.guessed.length > 0 && !(c.checks && r.failed.length > 0);
    return r;
  }

    ],
    poc: {
      goal: "Chạy cả sáu bước của lab trên một ảnh hoá đơn ShopViet thật do Pillow vẽ: ảnh 4032×3024 lưu xoay bằng EXIF, xoay lại, tính provider thu về kích thước nào, bao nhiêu token và tiền, dãy số MST chân trang còn bao nhiêu hàng pixel, rồi chạy schema + kiểm tra nghiệp vụ trên hai output. <b>Không gọi vision model nào.</b> Hai output JSON A và B là <b>viết tay</b>, không phải câu trả lời của model; script in rõ điều này. Phần đo thật là ảnh, kích thước, token, hàng pixel và các phép kiểm tra.",

      output: "Bước 1-2. Ảnh điện thoại khách gửi và xoay EXIF\n\n                             Giá trị\n---------------------------  -----------------------------------------\nFile JPEG                    4.59 MB\nPixel lưu trong file         4032×3024 (nằm ngang), EXIF Orientation=6\nSau ImageOps.exif_transpose  3024×4032 (dọc), EXIF Orientation=None\n\nBước 3-4. Provider thu nhỏ → token, tiền, và dãy MST chân trang còn bao nhiêu hàng pixel\n\nProvider                                   Model nhìn thấy  Token  Tiền/ảnh              Hàng pixel chữ số MST\n-----------------------------------------  ---------------  -----  --------------------  ---------------------\nClaude Haiku 4.5 (standard)                952×1270         1564   $0.00156              4\nClaude Opus 5.5 (high-res)                 1659×2212        4740   $0.01896              8\nOpenAI gpt-6-astra, high                   1376×1835        2993   README không nêu giá  7\nGemini 3/4 mặc định                        không công bố    1120   README không nêu giá  không biết\n+ ảnh cắt chân trang 1300×140, Claude std  1300×140         235    $0.00023              13\n\nBước 5-6. Trích JSON rồi kiểm tra bằng code. Hai output dưới đây VIẾT TAY, không gọi model:\n  A = schema bắt buộc mọi trường, model đoán MST mờ; B = schema cho phép null, model khai báo không đọc rõ\n\nOutput  MST         Schema + kiểm tra nghiệp vụ                   Kết quả\n------  ----------  --------------------------------------------  ----------------------\nA đoán  0312345670  qua hết                                       GHI THẲNG, SAI ÂM THẦM\nB null  None        model khai báo không đọc rõ: seller_tax_code  người duyệt\n\nRút ra: ảnh 12 MP xoay EXIF phải được xoay ở phía bạn; provider thu về 1,2–3,7 MP và dãy MST chỉ còn 4–8 hàng pixel,\nảnh cắt 1.300×140 giữ 13 hàng chỉ với 235 token; MST đoán sai vẫn qua schema + nghiệp vụ, chỉ null + người duyệt chặn được.",

      read: ["Dòng <b>Pixel lưu trong file</b>: 4032×3024 nằm ngang. Không gọi <code>exif_transpose</code> thì model nhận đúng ảnh nằm ngang này.", "Claude Haiku 4.5 thấy <b>952×1270</b>, không phải 1176×1568 dù trần cạnh là 1.568 px: 1176×1568 đã là 42 × 56 = 2.352 token, vượt trần 1.568 token, nên bị thu tiếp. Trần token chặn trước (bài 1).", "Cột <b>Hàng pixel chữ số MST</b>: 13 ở ảnh gốc, còn 4 sau khi Claude standard thu về 952×1270. Ảnh cắt 1300×140 giữ đủ 13 hàng chỉ với 235 token.", "Output A (MST đoán) qua hết schema và kiểm tra nghiệp vụ vì vẫn đúng dạng 10 chữ số: đây là ca <b>sai âm thầm</b>. Chỉ output B (null + khai báo) được đưa sang người duyệt.", "Gemini 3 ghi 1.120 token nhưng không công bố ảnh được thu về kích thước nào, nên script không đo được hàng pixel."]

    mount(stage) {
      const st = { input: 'photo', prov: 'haiku', exif: false, resize: false, crop: false, nullOk: false, checks: true };
      const pipe = el('svg', { class: 'canvas', viewBox: '0 0 900 130', role: 'img', 'aria-label': 'Sáu bước xử lý input đa phương thức' });
      const seen = el('svg', { class: 'canvas', viewBox: '0 0 300 220', style: 'max-width:300px', role: 'img', 'aria-label': 'Thứ model nhận được' });
      const seenTxt = el('div', { class: 'stat' }), pre = el('pre', { class: 'mono', style: 'background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11.5px;overflow-x:auto;margin:0;max-height:300px' });
      const chk = el('div'), stat = el('div', { class: 'stat' }), flags = el('div');

      function drawPipe(r) {
        const I = INPUTS[st.input], P = PROV[st.prov], W = 900, bw = 138, gap = (W - 6 * bw) / 5;
        const prep = I.kind === 'audio' ? (P.audio ? 'gửi audio thẳng' : 'chép lời (STT)') : [st.exif ? 'xoay EXIF' : '', st.resize ? 'thu nhỏ' : '', st.crop ? '+ crop' : ''].filter(Boolean).join(', ') || 'gửi file gốc';
        const tokTxt = r.tokens === null ? '? token' : fT(r.tokens) + ' token';
        const S = [
          ['1. Input', I.kind === 'image' ? '4032×3024 JPEG' : I.kind === 'pdf' ? `${I.pages} trang PDF` : `${I.sec} s audio`, `${dec(I.mb, 2)} MB`, 'var(--g1)'],
          ['2. Tiền xử lý', prep, r.mbSent !== undefined ? `gửi ${dec(r.mbSent, 2)} MB` : '', r.sideways ? 'var(--bad)' : I.kind === 'image' && !st.resize ? 'var(--warn)' : 'var(--ok)'],
          ['3. Token', tokTxt, r.cost !== null ? usd(r.cost) : r.stt ? '+ ' + usd(r.stt) + ' STT' : 'README không có giá', 'var(--accent)'],
          ['4. Model thấy', r.eff !== null ? `chữ nhỏ ${dec(r.eff)} px` : I.kind === 'audio' ? (P.audio ? 'cả giọng nói' : 'chỉ chữ') : I.kind === 'pdf' && I.text ? 'text layer chính xác' : 'không rõ kích thước', r.sideways ? 'ảnh nằm ngang' : '', !r.readable ? 'var(--bad)' : 'var(--ok)'],
          ['5. JSON', r.guessed.length ? 'đoán: ' + r.guessed.join(', ') : r.nulls.length ? 'null: ' + r.nulls.join(', ') : 'đủ trường', st.nullOk ? 'schema cho null' : 'schema bắt buộc', r.guessed.length ? 'var(--bad)' : r.nulls.length ? 'var(--warn)' : 'var(--ok)'],
          ['6. Validation', !st.checks ? 'tắt' : r.failed.length ? `trượt ${r.failed.length}` : 'qua', r.review ? 'người duyệt' : r.silentWrong ? 'ghi sai vào hệ thống' : 'ghi vào hệ thống', r.silentWrong ? 'var(--bad)' : r.review ? 'var(--warn)' : 'var(--ok)']
        ];
        const kids = [];
        S.forEach(([h, a, b, col], i) => {
          const x = i * (bw + gap);
          kids.push(el('rect', { x: x + 1, y: 8, width: bw - 2, height: 110, rx: 8, fill: 'var(--panel)', stroke: col, 'stroke-width': 2.5 }),
            el('text', { x: x + 10, y: 32, text: h, style: 'font-weight:700;font-size:13px' }),
            el('text', { x: x + 10, y: 60, text: a.length > 20 ? a.slice(0, 19) + '…' : a, class: 'mono', style: 'font-size:11px' }, [el('title', { text: a })]),
            el('text', { x: x + 10, y: 84, text: b, class: 'mute', style: 'font-size:11px' }));
          if (i < 5) kids.push(el('path', { d: `M${x + bw + 2} 63 L${x + bw + gap - 5} 63`, stroke: 'var(--mute)', 'stroke-width': 2, fill: 'none' }), el('polygon', { points: `${x + bw + gap - 6},58 ${x + bw + gap},63 ${x + bw + gap - 6},68`, fill: 'var(--mute)' }));
        });
        pipe.replaceChildren(...kids);
      }

      function drawSeen(r) {
        const I = INPUTS[st.input], kids = [el('rect', { x: 0, y: 0, width: 300, height: 220, fill: 'var(--bg)' })];
        if (I.kind === 'image') {
          const land = r.sideways, w = land ? 200 : 150, h = land ? 150 : 200, x = (300 - w) / 2, y = 10;
          const g = el('g', { transform: land ? `translate(${x} ${y + h}) rotate(-90)` : `translate(${x} ${y})` });
          const iw = 150, ih = 200;
          g.append(el('rect', { x: 0, y: 0, width: iw, height: ih, fill: 'var(--accent-soft)', stroke: 'var(--line)' }),
            el('circle', { cx: 75, cy: 80, r: 40, fill: 'var(--panel)', stroke: 'var(--accent)', 'stroke-width': 2 }),
            el('path', { d: 'M55 60 L72 82 L82 70 L98 104', stroke: 'var(--bad)', 'stroke-width': 2.5, fill: 'none' }),
            el('rect', { x: 20, y: 150, width: 110, height: 26, fill: 'var(--panel)', stroke: 'var(--mute)' }),
            el('text', { x: 75, y: 168, 'text-anchor': 'middle', style: `font-size:11px;${r.readable ? '' : 'filter:blur(1.6px);opacity:.55'}`, text: 'Đơn SV-4821' }));
          kids.push(g);
          if (st.crop && !r.sideways) kids.push(el('rect', { x: 20, y: 192, width: 260, height: 24, fill: 'var(--panel)', stroke: 'var(--accent)', 'stroke-width': 2 }), el('text', { x: 150, y: 209, 'text-anchor': 'middle', style: 'font-size:13px;font-weight:700', text: 'crop: Đơn SV-4821' }));
        } else if (I.kind === 'pdf') {
          [0, 1].forEach((p) => {
            const x = 20 + p * 140;
            kids.push(el('rect', { x, y: 10, width: 120, height: 160, fill: 'var(--panel)', stroke: 'var(--line)' }), el('text', { x: x + 8, y: 30, style: 'font-size:10px;font-weight:700', text: p ? 'Trang 2' : 'HOÁ ĐƠN GTGT' }), el('text', { x: x + 8, y: 160, style: `font-size:6px;${r.readable ? '' : 'filter:blur(1px);opacity:.55'}`, text: 'MST: 0312345678' }));
            for (let i = 0; i < 5; i++) kids.push(el('rect', { x: x + 8, y: 44 + i * 16, width: 100 - i * 9, height: 5, fill: 'var(--dim)' }));
          });
          kids.push(el('text', { x: 20, y: 192, style: 'font-size:11px', class: I.text ? '' : 'mute', text: I.text ? 'text layer: "HOÁ ĐƠN GTGT Số: HD-00918 ..."' : 'text layer: "" (rỗng)' }));
        } else {
          for (let i = 0; i < 60; i++) { const h = 8 + Math.abs(Math.sin(i * 0.7) * 34) + ((i * 13) % 11); kids.push(el('rect', { x: 10 + i * 4.7, y: 60 - h / 2, width: 3, height: h, fill: PROV[st.prov].audio ? 'var(--accent)' : 'var(--dim)' })); }
          kids.push(el('text', { x: 10, y: 120, style: 'font-size:11px', text: PROV[st.prov].audio ? 'Model nghe trực tiếp: lời, giọng, tiếng ồn' : 'Model chỉ nhận bản chép lời:' }));
          if (!PROV[st.prov].audio) TRANSCRIPT.match(/.{1,52}(\s|$)/g).slice(0, 4).forEach((ln, i) => kids.push(el('text', { x: 10, y: 140 + i * 16, class: 'mono', style: 'font-size:9.5px', text: ln.trim() })));
        }
        seen.replaceChildren(...kids);
      }

      function render() {
        const I = INPUTS[st.input], P = PROV[st.prov], r = run(st);
        drawPipe(r); drawSeen(r);
        seenTxt.innerHTML = `<span>Model nhận: <b>${esc(r.seen)}</b></span>${r.eff !== null ? `<span>${I.smallName}: <b class="${r.eff < READ_PX ? 'bad' : 'ok'}">${dec(I.small)} → ${dec(r.eff)} px</b></span>` : ''}${!r.readable && r.eff !== null ? `<span class="hint" style="margin:0">Chữ vẽ mờ, nhạt trong hình = dưới ngưỡng ${READ_PX} px khi tới model</span>` : ''}`;
        pre.textContent = JSON.stringify(r.out, null, 2);
        chk.replaceChildren(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Kiểm tra bằng code</th><th>Kết quả</th></tr>' + (st.checks ? r.checks.map(([n, v]) => `<tr><td>${n}</td><td class="${v === null ? '' : v ? 'ok' : 'bad'}"><b>${v === null ? 'bỏ qua (null)' : v ? 'qua' : 'trượt'}</b></td></tr>`).join('') : '<tr><td colspan="2">Đang tắt validation: JSON ghi thẳng vào hệ thống.</td></tr>') })]));
        stat.innerHTML = `<span>Provider: <b>${P.name}</b></span><span>Token input (phần media): <b>${r.tokens === null ? esc(r.tokensNote) : fT(r.tokens)}</b></span><span>Tiền / request: <b>${r.cost !== null ? usd(r.cost + r.stt) : r.stt ? usd(r.stt) + ' STT + token chữ' : 'README không có đơn giá'}</b></span><span>Mỗi 10.000 yêu cầu: <b>${r.cost !== null ? usd((r.cost + r.stt) * 1e4) : '—'}</b></span><span>Kết cục: <b class="${r.silentWrong ? 'bad' : r.review ? '' : 'ok'}">${r.silentWrong ? 'ghi sai, không ai biết' : r.review ? 'người duyệt' : 'tự động, đúng'}</b></span>`;
        const f = [];
        if (r.sideways) f.push(flag('bad', `<b>Ảnh tới model nằm ngang.</b> Điện thoại lưu pixel 4032×3024 theo chiều cảm biến và cờ EXIF Orientation = 6; trình xem tự xoay, nhưng README §3.1 ghi docs provider không nêu có áp cờ này. Không có nghĩa ảnh hỏng: trên điện thoại khách nó vẫn đứng.<br>Trong hệ thống thật: bật "Xoay theo EXIF" (<code>ImageOps.exif_transpose</code>) trước mọi bước khác.`));
        if (r.eff !== null && r.eff < READ_PX && !st.crop) f.push(flag('bad', `<b>${I.smallName} còn ${dec(r.eff)} px khi tới model</b> (từ ${I.small} px). Provider thu ảnh về trần của nó trước khi cắt patch. Model không biết mình đang nhìn bản mờ (README §1.5). Không có nghĩa phải gửi ảnh lớn hơn: provider vẫn sẽ thu nhỏ.<br>Trong hệ thống thật: bật "Cắt vùng chữ" để gửi thêm một ảnh nhỏ của vùng đó ở độ phân giải đầy đủ.`));
        if (r.guessed.length && r.silentWrong) f.push(flag('bad', `<b>Giá trị đoán đi thẳng vào hệ thống: ${r.guessed.map((g) => `${g} = "${r.out[g]}"`).join(', ')}.</b> Schema bắt buộc trường nên model điền giá trị hợp lý thay vì null${st.checks ? ', và giá trị đó vẫn qua mọi kiểm tra định dạng: đủ chữ số, tổng tiền vẫn khớp' : ', và validation đang tắt'}. Không có nghĩa validation vô dụng: nó bắt lỗi làm vỡ quan hệ, không bắt giá trị sai mà hợp lệ.<br>Trong hệ thống thật: schema cho phép null + unreadable_fields, và crop vùng chữ nhỏ.`));
        else if (r.guessed.length && r.review) f.push(flag('warn', `<b>Model đoán ${r.guessed.join(', ')} = "${r.out[r.guessed[0]]}", và validation bắt được:</b> ${r.failed.join('; ')}. Yêu cầu đi vào hàng đợi người duyệt thay vì mở sang đơn của người khác. May mắn: giá trị đoán lần này không tồn tại trong hệ thống.`));
        if (r.nulls.length) f.push(flag('ok', `Model trả <code>null</code> cho ${r.nulls.join(', ')} và liệt kê trong unreadable_fields. Bot hỏi lại khách hoặc chuyển người duyệt. Đó là kết quả đúng khi input không đủ rõ.`));
        if (I.kind === 'image' && !st.resize) f.push(flag('warn', `Gửi file gốc ${dec(I.mb, 1)} MB (giả định) mà model chỉ thấy ${esc(r.seen)}. Phần còn lại bị bỏ ở bước thu nhỏ của provider. Thu nhỏ về trần (${P.cap ? fT(P.cap) + ' px' : 'Gemini: token không đổi'}) giảm băng thông và tránh giới hạn dung lượng.${P.cap && P.mt ? ` Với Claude, kích thước model thấy còn bị trần ${fT(P.mt)} token chặn: bật "Thu nhỏ về trần provider" để xem.` : ''}`));
        const mt = { haiku: 1568, opus: 4784 }[st.prov];
        if (I.kind === 'image' && st.resize && mt && r.im) {
          const [sw, sh] = r.sent, gx = Math.ceil(sw / 28), gy = Math.ceil(sh / 28);
          if (gx * gy > mt) f.push(flag('warn', `<b>Bạn gửi ${fT(sw)}×${fT(sh)}, nhưng model thấy ${fT(r.im.W)}×${fT(r.im.H)}.</b> Ảnh đã vừa trần cạnh ${fT(P.cap)} px, nhưng ⌈${sw}/28⌉ × ⌈${sh}/28⌉ = ${gx} × ${gy} = ${fT(gx * gy)} token, vượt trần ${fT(mt)} token, nên Claude thu tiếp lần hai (hàm ước lượng README §1.2). Không có nghĩa bước thu nhỏ của bạn vô ích: file nhẹ hơn và ảnh đúng chiều. Nhưng con số max_long_edge trong README §3.1 không phải kích thước model thấy: với ảnh 4:3 trên Claude, trần token chặn trước trần cạnh.<br>Trong hệ thống thật: thu thẳng về ${fT(r.im.W)}×${fT(r.im.H)} (vừa cả hai trần), tính bằng hàm token của README, để biết chính xác model thấy gì.`));
        }
        if (I.kind === 'audio' && !P.audio) f.push(flag('warn', `<b>${P.name} không nhận audio</b>${st.prov === 'gpt' ? ' trong luồng này (README: OpenAI có model transcribe và realtime riêng)' : ' (README §1.4)'}: phải chép lời trước, ${usd(r.stt)} cho ${I.sec} giây ở $0,006/phút. Chữ "tôi rất bực" còn, giọng điệu thì mất. Muốn đo cảm xúc từ giọng: Gemini native.`));
        if (st.prov === 'opus' && I.kind === 'image') { const h = PROV.haiku.img(...r.sent).tok; f.push(flag('warn', `Opus 5.5 dùng tier high-res: ${fT(r.tokens)} token so với ${fT(h + (st.crop ? PROV.haiku.img(1300, 140).tok : 0))} trên tier standard, cộng đơn giá $4 thay vì $1 / 1M. Chữ nhỏ rõ hơn, nhưng đổi model là đổi chi phí ảnh (README §1.2).`)); }
        flags.replaceChildren(...f);
      }

      const cb = (key, label) => { const i = el('input', { type: 'checkbox' }); i.checked = st[key]; i.addEventListener('change', () => { st[key] = i.checked; render(); }); return el('label', { class: 'ctl' }, [i, label]); };
      stage.append(
        el('div', { class: 'row' }, [select('Khách gửi', Object.entries(INPUTS).map(([k, v]) => [k, v.name]), st.input, (v) => { st.input = v; render(); }).node,
          select('Provider', Object.entries(PROV).map(([k, v]) => [k, v.name]), st.prov, (v) => { st.prov = v; render(); }).node]),
        el('div', { class: 'row' }, [cb('exif', 'Xoay theo EXIF'), cb('resize', 'Thu nhỏ về trần provider'), cb('crop', 'Cắt vùng chữ nhỏ gửi thêm'), cb('nullOk', 'Schema cho phép null'), cb('checks', 'Validation bằng code')]),
        pipe, stat, flags,
        el('div', { class: 'cols' }, [el('div', {}, [el('h4', { text: 'Model thấy gì' }), seen, seenTxt]), el('div', {}, [el('h4', { text: 'JSON trích ra (ví dụ dựng sẵn)' }), pre, chk])]),
        el('p', { class: 'hint', text: `Từ README: công thức token ảnh (Claude, OpenAI patch 32 px, Gemini 3 cố định 1.120), PDF Gemini 560/trang, Claude text 1.500–3.000/trang + ảnh trang, audio 25 token/giây, STT $0,006/phút, đơn giá Haiku 4.5 $1 và Opus 5.5 $4 / 1M input. Giả định: nhãn đơn cao 20 px trên ảnh gốc, MST 10 px trên trang render 1240×1754, crop 1300×140 (ảnh) và 1240×160 (trang), dung lượng file, token chép lời ước lượng bằng số ký tự / 3, ngưỡng đọc được ${READ_PX} px. JSON là ví dụ dựng sẵn; các kiểm tra chạy thật.` }));
      render();
    }
  };
})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
