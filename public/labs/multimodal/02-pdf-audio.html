const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

    poc: {

      output: "1) PDF 3 trang tạo bằng reportlab (104 KB), trích bằng pypdf\n\nTrang                                     Ký tự trích  Chữ có dấu  Ký tự lạ  Định tuyến\n----------------------------------------  -----------  ----------  --------  ---------------------\ntext layer sạch (font TTF nhúng)          266          20%         0%        parse text\nảnh trang + text ẩn mã TCVN3 (font hỏng)  266          7%          16%       VLM (text layer hỏng)\nchỉ ảnh (scan)                            0            0%          0%        VLM (không có text)\n\n   pypdf thấy ở trang 'text layer sạch (font TTF nhúng)':\n   HOÁ ĐƠN GIÁ TRỊ GIA TĂNG\n   Số: 0004821  Đơn hàng: SV-4821\n   Công ty TNHH ShopViet\n\n   pypdf thấy ở trang 'ảnh trang + text ẩn mã TCVN3 (font hỏng)':\n   HO¸ §¥N GI¸ TRÞ GIA T¡NG\n   Sè: 0004821  §¬n hµng: SV-4821\n   C«ng ty TNHH ShopViet\n\n   pypdf thấy ở trang 'chỉ ảnh (scan)':\n   (rỗng)\n\n2) Token một trang hoá đơn (ảnh trang 1240×1754). Text ≈ 89 token (ƯỚC LƯỢNG ký tự/3, không phải tokenizer thật)\n\nCách đưa vào                    Claude std  Claude hi-res  Gemini 3/4 mặc định\n------------------------------  ----------  -------------  -----------------------\nChỉ text (parse trước)          89          89             89\nChỉ ảnh trang                   1551        2835           1120\nGửi PDF cho model (ảnh + text)  1640        2924           560 (text gốc miễn phí)\n\n3) Âm thanh: WAV 16 kHz mono 16-bit tạo bằng module wave, đọc lại header: 45 giây, 32 KB/giây\n\nĐộ dài                 Gemini 3/4 (25 tok/s)  trang audio cũ (32 tok/s)  gpt-4o-transcribe  gpt-4o-mini-transcribe  WAV\n---------------------  ---------------------  -------------------------  -----------------  ----------------------  ------------------------\n45 giây (file thật)    1.125                  1.440                      $0.005             $0.002                  1.4 MB\n10 phút                15.000                 19.200                     $0.060             $0.030                  19.2 MB\n1 giờ                  90.000                 115.200                    $0.360             $0.180                  115.2 MB > 20 MB inline\n9,5 giờ (trần Gemini)  855.000                1.094.400                  $3.420             $1.710                  1094.4 MB > 20 MB inline\n\nRút ra: trang font hỏng trông đúng nhưng pypdf trả chuỗi TCVN3, tín hiệu 'ký tự lạ' rẻ tiền bắt được nó; trang scan trả rỗng.\nGửi PDF cho Claude trả cả text lẫn ảnh trang; WAV 32 KB/giây chạm 20 MB inline sau ~10 phút, còn rất xa trần 9,5 giờ.",

    mount(stage) {
      const st = { page: 'scan', strat: 'text', pages: 2, dens: 1500, hi: false, gl: 'unspecified', dur: 2, kbps: 32, task: 'extract', vol: 50 };

      function drawPage() {

        line(36, 0, 'HOÁ ĐƠN GTGT', 16, true); line(56, 0, 'Số: HD-00918   Mã đơn: SV-4821', 11);
        kids.push(el('rect', { x: 24, y: 72, width: 252, height: 90, fill: 'none', stroke: 'var(--mute)' }), el('path', { d: 'M24 92H276M180 72V162M230 72V162', stroke: 'var(--mute)', fill: 'none' }));
        line(86, 0, 'Tên hàng               SL    Thành tiền', 9.5, true); line(110, 0, 'Tai nghe không dây Pro X   1    1.136.364', 9.5); line(130, 0, 'Thuế GTGT 10%                    113.636', 9.5);
        line(186, 0, 'Tổng cộng: 1.250.000đ', 13, true);
        kids.push(el('circle', { cx: 220, cy: 250, r: 34, fill: 'none', stroke: 'var(--bad)', 'stroke-width': 2.5, opacity: 0.8 }), el('text', { x: 220, y: 254, 'text-anchor': 'middle', style: 'font-size:9px;fill:var(--bad)', text: 'SHOPVIET' }));
        if (P === 'mixed') kids.push(el('text', { x: 26, y: 300, style: 'font-size:13px;font-style:italic;fill:var(--g1)', transform: 'rotate(-4 26 300)', text: 'đổi máy, lỗi loa trái' }));
        line(372, 0, 'MST người bán: 0312345678 · ShopViet, Q.1, TP.HCM', 6.5);
        if (P === 'scan') kids.push(el('rect', { x: 10, y: 6, width: 280, height: 388, fill: 'var(--mute)', opacity: 0.1 }), el('text', { x: 150, y: 396, 'text-anchor': 'middle', class: 'mute', style: 'font-size:10px', text: 'ảnh scan: không có lớp chữ' }));
        if (st.strat === 'text') kids.push(el('rect', { x: 10, y: 6, width: 280, height: 388, fill: 'none', stroke: 'var(--bad)', 'stroke-dasharray': '6 4', 'stroke-width': 2 }), el('text', { x: 150, y: 222, 'text-anchor': 'middle', style: 'font-size:12px;fill:var(--bad);font-weight:700', text: 'model KHÔNG nhận ảnh trang này' }));

      function renderPdf() {
        drawPage();

        const T = pdfTokens(st), N = st.pages;

        tokTbl.replaceChildren(el('table', { html: `<tr><th>Provider</th><th>Token / trang</th><th>× ${fT(N)} trang</th></tr>
<tr class="cur"><td>Claude ${st.hi ? 'high-res' : 'standard'}</td>${cell(T.claude)}</tr>
<tr><td>Gemini 3/4, ${st.gl}</td>${cell(T.gem)}</tr>
<tr><td>OpenAI</td>${T.oai === null ? '<td class="mono" colspan="2">chữ ~' + fT(T.tTok) + '/trang + ảnh trang (docs không nêu số)</td>' : cell(T.oai)}</tr>` }));
        const f = [];

        if (st.page === 'broken' && st.strat === 'text') f.push(flag('bad', `<b>Tên hàng ra "kh«ng d©y" mà không có lỗi nào.</b> Font nhúng ánh xạ ký tự sai: trang hiển thị đúng, text trích ra sai. Mã đơn và số tiền vẫn đúng nên kiểm tra nhanh tưởng là ổn. Không có nghĩa PDF bị hỏng: mở bằng trình xem vẫn đẹp.<br>Trong hệ thống thật: đo tỉ lệ ký tự lạ trên từng trang (tỉ lệ chữ có dấu chỉ giảm chứ không về 0, xem câu hỏi "Hoá đơn scan thì sao?" bên dưới); trang lỗi thì dùng ảnh trang thay vì text.`));
        if (st.page === 'broken' && st.strat === 'both') f.push(flag('warn', '<b>Hai nguồn mâu thuẫn.</b> Ảnh ghi "không dây", text ghi "kh«ng d©y". Bạn không biết model chọn nguồn nào. README §3.7: với trang lỗi font, dùng ảnh trang thay vì text.'));
        if (st.strat === 'both' && T.tTok > 0) f.push(flag('warn', `<b>Claude tính mỗi trang ${fT(T.claude)} token, gấp ×${dec(T.claude / T.tTok, 2)} phần chữ.</b> Document block gửi cả text (${fT(T.tTok)}) lẫn ảnh trang (${fT(T.cImg)}). Dự toán chỉ đếm chữ sẽ hụt. Không có nghĩa bị tính nhầm: ảnh cho model thấy bảng và con dấu.<br>Trong hệ thống thật: trang chỉ có chữ thì parse và gửi text; gửi ảnh cho trang khó.`));
        if (st.strat === 'text' && T.tTok > GEM_PDF[st.gl] && st.page !== 'scan') f.push(flag('warn', `<b>Trên Gemini 3, parse trước lại đắt hơn:</b> ${fT(T.tTok)} token chữ mỗi trang so với ${fT(GEM_PDF[st.gl])} nếu gửi PDF gốc (text gốc không tính tiền). Không có nghĩa luôn rẻ hơn: một trang docs Gemini khác ghi 258 token/trang.<br>Trong hệ thống thật: <code>countTokens</code> với file thật trước khi chọn đường.`));
        if (st.strat === 'image' && !st.hi && st.page !== 'scan') f.push(flag('warn', 'Chỉ gửi ảnh trang: bỏ mất chuỗi ký tự chính xác mà text layer sạch cho miễn phí. Chữ nhỏ ở chân trang (MST) phụ thuộc vào mức thu nhỏ của provider.'));
        const cTot = T.claude * N;
        if (N > 600) f.push(flag('bad', `<b>${fT(N)} trang vượt giới hạn 600 trang mỗi request của Claude</b>${N > 1000 ? ' và 1.000 trang của Gemini' : ''}.`));
        else if (N > 100) f.push(flag('warn', `${fT(N)} trang: Claude chỉ nhận 100 trang nếu context của request dưới 1M.`));
        if (cTot > 1e6) f.push(flag('bad', `<b>Claude: ${fT(cTot)} token cho ${fT(N)} trang, vượt context 1M</b> trước cả khi chạm giới hạn trang. README: PDF dày chữ đầy context trước giới hạn số trang.`));
        if (T.mb > 50) f.push(flag('bad', `Ước ${fT(T.mb)} MB (giả định ${PAGES[st.page].mb} MB/trang): vượt 50 MB của OpenAI và Gemini${T.mb > 128 ? ', và 128 MB request của Claude' : ''}.`));
        pFlags.replaceChildren(...f);
      }

      function renderAudio() {
        const s = AUD_STEPS[st.dur], min = s / 60, mb = (st.kbps * 1000 * s) / 8 / 1e6;
        const sttTok = Math.round(min * STT_TOK_MIN), V = st.vol * 1000;
        const rows = [
          ['Gemini 3/4 native (25 token/giây)', fT(s * 25) + ' token audio', 'README không nêu đơn giá', st.task === 'emotion' ? ['giữ giọng điệu', 'ok'] : ['đủ', 'ok']],
          ['Gemini theo trang docs cũ (32 token/giây)', fT(s * 32) + ' token audio', 'chênh +' + fT(s * 7) + ' token', ['dùng để so', 'mute']],
          ['OpenAI gpt-4o-transcribe / whisper-1 → LLM', '~' + fT(sttTok) + ' token chữ (giả định)', usd(min * 0.006) + ' chép lời; ' + usd(min * 0.006 * V) + '/tháng', st.task === 'emotion' ? ['mất cảm xúc', 'bad'] : ['đủ', 'ok']],
          ['OpenAI gpt-4o-mini-transcribe → LLM', '~' + fT(sttTok) + ' token chữ (giả định)', usd(min * 0.003) + ' chép lời; ' + usd(min * 0.003 * V) + '/tháng', st.task === 'emotion' ? ['mất cảm xúc', 'bad'] : ['đủ', 'ok']],
          ['OpenAI gpt-realtime (audio input $32/1M)', '? token/giây không có trong README', 'không tính được', ['hội thoại giọng nói', 'mute']],
          ['Claude (không nhận audio): chép lời trước', '~' + fT(sttTok) + ' token chữ (giả định)', 'cộng tiền STT ở trên', st.task === 'emotion' ? ['mất cảm xúc', 'bad'] : ['đủ', 'ok']]
        ];
        audTbl.replaceChildren(el('table', { html: '<tr><th>Đường đi</th><th>Token</th><th>Tiền</th><th>Với việc đã chọn</th></tr>' + rows.map(([a, b, c, [d, k]]) => `<tr><td>${a}</td><td class="mono">${b}</td><td class="mono">${c}</td><td class="${k}">${d}</td></tr>`).join('') }));
        aStat.innerHTML = `<span>Độ dài: <b>${fDur(s)}</b></span><span>File ở ${st.kbps} kbps: <b class="${mb > 20 ? 'bad' : ''}">${dec(mb, 2)} MB</b></span><span>Tin nhắn/tháng: <b>${fT(V)}</b></span><span>Gemini/tháng: <b>${fT(s * 25 * V)}</b> token audio</span>`;
        const f = [];
        if (st.task === 'emotion') f.push(flag('bad', `<b>Chép lời làm mất đúng thứ cần đo.</b> Bản chép "tôi rất bực vì đây là lần thứ hai" giữ chữ, nhưng giọng gắt, ngập ngừng hay tiếng ồn nền thì mất (README §1.4). Không có nghĩa STT tệ: nó làm đúng việc của nó là chép chữ.<br>Trong hệ thống thật: việc cần cảm xúc, người nói thì dùng model audio native; việc trích mã đơn thì chép lời cho rẻ và dễ debug.`));
        if (mb > 20) f.push(flag('warn', `<b>${dec(mb, 1)} MB vượt giới hạn inline 20 MB</b> của Gemini (tính cho cả request). Dùng Files API; file tự xoá sau 48 giờ.`));
        if (s > 34200) f.push(flag('bad', `<b>${fDur(s)} vượt 9,5 giờ mỗi prompt</b> của Gemini. Cắt thành nhiều đoạn.`));
        aFlags.replaceChildren(...f);
      }

      const rS = (v) => { renderPdf(); return v; };
      stage.append(el('h4', { text: 'PDF hoá đơn: ba cách đưa vào model', style: 'margin:0 0 6px' }),
        el('div', { class: 'row' }, [select('Loại trang', Object.entries(PAGES).map(([k, v]) => [k, v.name]), st.page, (v) => { st.page = v; rS(); }).node,
          select('Cách đưa vào', [['text', 'Chỉ text (parse trước)'], ['image', 'Chỉ ảnh trang'], ['both', 'Cả hai (mặc định provider)']], st.strat, (v) => { st.strat = v; rS(); }).node]),
        el('div', { class: 'row' }, [slider('Số trang', 1, 1200, 1, st.pages, (v) => { st.pages = v; rS(); }, fT).node,
          slider('Token chữ / trang (README 1.500–3.000)', 1500, 3000, 100, st.dens, (v) => { st.dens = v; rS(); }, fT).node]),
        el('div', { class: 'row' }, [select('Claude tier', [['std', 'standard (Haiku 4.5...)'], ['hi', 'high-res (4.7 trở lên)']], 'std', (v) => { st.hi = v === 'hi'; rS(); }).node,
          select('Gemini media_resolution', [['unspecified', 'mặc định (560/trang)'], ['low', 'low (280)'], ['medium', 'medium (560)'], ['high', 'high (1.120)']], st.gl, (v) => { st.gl = v; rS(); }).node]),
        el('div', { class: 'cols' }, [el('div', {}, [el('h4', { text: 'Trang (người nhìn thấy)' }), pageSvg]), el('div', {}, [el('h4', { text: 'Text layer (code nhận được)' }), textPre, fieldTbl])]),
        tokTbl, pFlags,
        el('h4', { text: 'Tin nhắn thoại: chép lời hay gửi thẳng', style: 'margin:22px 0 6px' }),
        el('div', { class: 'row' }, [slider('Độ dài', 0, AUD_STEPS.length - 1, 1, st.dur, (v) => { st.dur = v; renderAudio(); }, (i) => fDur(AUD_STEPS[i])).node,
          select('Bitrate (giả định)', [['32', '32 kbps (voice nén)'], ['128', '128 kbps (MP3)'], ['256', '256 kbps (WAV 16 kHz mono)']], '32', (v) => { st.kbps = +v; renderAudio(); }).node]),
        el('div', { class: 'row' }, [select('Việc cần làm', [['extract', 'Trích mã đơn SV-4821 và lỗi'], ['emotion', 'Đánh giá khách bực đến mức nào']], st.task, (v) => { st.task = v; renderAudio(); }).node,
          slider('Nghìn tin nhắn / tháng', 1, 500, 1, st.vol, (v) => { st.vol = v; renderAudio(); }, (v) => fT(v * 1000)).node]),
        audTbl, aStat, aFlags,
        el('p', { class: 'hint', text: `Từ README: token text Claude 1.500–3.000/trang, công thức ảnh Claude, Gemini 280/560/1.120 mỗi trang và text gốc miễn phí, giới hạn trang và MB, 25 và 32 token/giây, giá STT $0,006 và $0,003/phút, 20 MB inline, 9,5 giờ. Giả định: trang render ${PAGE_W}×${PAGE_H} px cho ảnh Claude; Gemini "chỉ ảnh trang" tính như ảnh theo media_resolution; dung lượng mỗi trang; ~${STT_TOK_MIN} token chữ mỗi phút lời nói; bitrate.` }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Output thật khi chạy script' : 'Output mẫu (script chưa chạy được)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), el('span', { html: l.why.c })]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), el('span', { html: l.why.s })]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), el('span', { html: l.why.p })])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
