const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const PRICE = { inp: 4, w: 5, r: 0.2 };
  const MIN_TOK = 512, S_TOK = 8000, TURNS = 30, USER = 300, ASSIST = 700, TOOL_USE = 100;
  const est = (s) => Math.ceil(s.length / 3);
  const usd = (x) => '$' + (x < 0.1 ? x.toFixed(4) : x.toFixed(3));
  const fmtT = (n) => Math.round(n).toLocaleString('vi-VN');
  const costOf = (read, write) => (read * PRICE.r + write * PRICE.w) / 1e6;

  function simulate(requests) {
    const entries = new Set();
    return requests.map((segs) => {
      let acc = 0, key = '', read = 0;
      const keys = segs.map((s) => { key += '|' + s.key; acc += s.tok; return { key, acc }; });
      keys.forEach((k) => { if (entries.has(k.key)) read = k.acc; });
      const total = acc, write = total >= MIN_TOK ? total - read : 0;
      segs.forEach((s, i) => { if (s.bp && keys[i].acc >= MIN_TOK) entries.add(keys[i].key); });
      if (total >= MIN_TOK) entries.add(keys[keys.length - 1].key);
      return { total, read, write, cost: costOf(read, write) + ((total - read - write) * PRICE.inp) / 1e6 };
    });
  }

  const FACTS = [
    { t: 1, kind: 'goal', msg: 'u1', text: 'Mục tiêu: mua tai nghe Pro X' },
    { t: 4, kind: 'constraint', msg: 'u4', text: 'Chỉ nhận hàng sau 18h' },
    { t: 6, kind: 'detail', msg: 'tr6', text: 'Trả góp 6 tháng 0%: 1.150.000đ/tháng (từ tinh_tra_gop)' },
    { t: 8, kind: 'detail', msg: 'tr8', text: 'Đơn cũ SV-4821 đã giao ngày 20/11 (từ tra_don_hang)' },
    { t: 11, kind: 'constraint', msg: 'u11', text: 'Chỉ thanh toán bằng thẻ tín dụng' },
    { t: 14, kind: 'decision', msg: 'u14', text: 'Đổi ý: lấy Pro X Lite thay cho Pro X' },
    { t: 17, kind: 'detail', msg: 'tr17', text: 'Kho Đà Nẵng còn 2 chiếc Pro X Lite (từ kiem_kho)' },
    { t: 21, kind: 'decision', msg: 'u21', text: 'Chốt trả góp 6 tháng cho Pro X Lite' },
    { t: 25, kind: 'constraint', msg: 'u25', text: 'Giao tới văn phòng, không giao nhà riêng' },
    { t: 28, kind: 'decision', msg: 'u28', text: 'Đã tạo đơn mới, chờ xác nhận thanh toán' }
  ];
  const KIND = { goal: 'mục tiêu', constraint: 'ràng buộc', decision: 'quyết định', detail: 'chi tiết từ tool' };
  const TOOLS = { 2: ['kiem_kho', 1800], 6: ['tinh_tra_gop', 1200], 8: ['tra_don_hang', 2500], 12: ['tra_don_hang', 6000], 17: ['kiem_kho', 1800], 21: ['tinh_tra_gop', 1200], 24: ['tra_don_hang', 6000] };

  function turnMsgs(k) {
    const m = [{ id: 'u' + k, tok: USER, role: 'user', turn: k }];
    if (TOOLS[k]) m.push({ id: 'tu' + k, tok: TOOL_USE, role: 'tool_use', turn: k, name: TOOLS[k][0] }, { id: 'tr' + k, tok: TOOLS[k][1], role: 'tool_result', turn: k, name: TOOLS[k][0] });
    return m;
  }

  function summarize(prevFacts, rawFacts, instr) {
    const keepRaw = rawFacts.filter((i) => FACTS[i].kind !== 'detail' && (instr || FACTS[i].kind !== 'constraint'));
    let keepPrev = prevFacts.filter((i) => FACTS[i].kind !== 'detail');
    if (!instr) {
      const lastDec = keepPrev.filter((i) => FACTS[i].kind === 'decision').pop();
      keepPrev = keepPrev.filter((i) => FACTS[i].kind === 'goal' || i === lastDec);
    }
    return [...new Set([...keepPrev, ...keepRaw])].sort((a, b) => a - b);
  }
  const summaryText = (ids, instr) => (instr ? 'TÓM TẮT PHIÊN (đặc tả hiện tại)\nMục tiêu, ràng buộc, quyết định đã chốt, việc còn dở:\n' : 'Tóm tắt cuộc trò chuyện:\n') + ids.map((i) => '- ' + FACTS[i].text).join('\n');
  const summaryTok = (ids, instr) => 600 + est(summaryText(ids, instr));

  function run(strat, th, keep, instr) {
    let hist = [], summary = null, compN = 0;
    const reqs = [], tags = [], turns = [], lostAt = {};
    const sz = (arr) => arr.reduce((a, m) => a + m.tok, 0);
    for (let k = 1; k <= TURNS; k++) {
      const cur = turnMsgs(k);
      const size = () => S_TOK + (summary ? summary.tok : 0) + sz(hist) + sz(cur);
      let comp = false, orphan = false, sumIdx = -1;
      if (strat === 'window' && size() > th) {
        while (size() > th && hist.length) hist.shift();
        comp = true;
        orphan = hist.length > 0 && hist[0].role !== 'user';
      } else if (strat === 'trim' && size() > th) {
        while (size() > keep && hist.length) { const t = hist[0].turn; hist = hist.filter((m) => m.turn !== t); }
        comp = true;
      } else if (strat === 'sum' && size() > th) {
        const prevSegs = reqs.length ? reqs[reqs.length - 1].concat([{ key: 'a' + (k - 1), tok: ASSIST }, { key: 'inst' + compN, tok: 150 }]) : null;
        if (prevSegs) { sumIdx = reqs.length; reqs.push(prevSegs); tags.push('sum'); }
        const ids = hist.map((m) => m.id);
        const rawFacts = FACTS.map((f, i) => i).filter((i) => ids.includes(FACTS[i].msg));
        const facts = summarize(summary ? summary.facts : [], rawFacts, instr);
        summary = { key: 'sum' + compN, tok: summaryTok(facts, instr), facts };
        hist = []; comp = true; compN++;
      }
      const segs = [{ key: 'S', tok: S_TOK, bp: true }];
      if (summary) segs.push({ key: summary.key, tok: summary.tok });
      hist.concat(cur).forEach((m) => segs.push({ key: m.id, tok: m.tok }));
      const idx = reqs.length; reqs.push(segs); tags.push('turn');
      const present = new Set(hist.concat(cur).map((m) => m.id));
      FACTS.forEach((f, i) => { if (f.t <= k && !present.has(f.msg) && !(summary && summary.facts.includes(i)) && !(i in lostAt)) lostAt[i] = k; });
      const fresh = sz(cur) + (k > 1 ? ASSIST : S_TOK);
      turns.push({ k, idx, sumIdx, comp, orphan, fresh, size: size(), over: size() > th, prevIdx: k > 1 ? turns[turns.length - 1].idx : -1 });
      hist.push(...cur, { id: 'a' + k, tok: ASSIST, role: 'assistant', turn: k });
    }
    const res = simulate(reqs);
    turns.forEach((t) => {
      const r = res[t.idx], s = t.sumIdx >= 0 ? res[t.sumIdx] : null;
      Object.assign(t, { total: r.total, read: r.read, write: r.write, cost: r.cost + (s ? s.cost : 0), sumCost: s ? s.cost : 0, rewrite: Math.max(0, r.write - t.fresh), lostCache: t.prevIdx >= 0 ? Math.max(0, res[t.prevIdx].total - r.read) : 0 });
    });
    const tot = (f) => turns.reduce((a, t) => a + f(t), 0);
    return { turns, lostAt, summary, cost: tot((t) => t.cost), input: tot((t) => t.total), read: tot((t) => t.read), rewrite: tot((t) => t.rewrite), lostCache: tot((t) => t.lostCache), comps: turns.filter((t) => t.comp).length, orphans: turns.filter((t) => t.orphan).map((t) => t.k), overs: turns.filter((t) => t.over).map((t) => t.k), nocache: tot((t) => t.total) * PRICE.inp / 1e6 };
  }

  const STRATS = [['none', 'Không rút gọn'], ['window', 'Cửa sổ trượt (mỗi lượt)'], ['trim', 'Trim theo ngưỡng'], ['sum', 'Summarize / compact theo ngưỡng']];
  const SNAME = Object.fromEntries(STRATS);

  function analyse(strat, th, keep, instr, R, all) {
    const flags = [];
    const late = R.turns.filter((t) => t.k > 1), lowHit = late.filter((t) => t.read / t.total < 0.5).length;
    if (R.overs.length && strat === 'none') flags.push({ lvl: 'bad', key: 'over', text: 'Từ lượt <b>' + R.overs[0] + '</b>, request vượt ngân sách ' + fmtT(th) + ' token (' + R.overs.length + ' lượt). Với context window thật, quá giới hạn là lỗi; dưới giới hạn mà quá dài thì model dễ bỏ sót (context rot).' });
    if (strat === 'window' && all.window.cost > all.none.cost) flags.push({ lvl: 'bad', key: 'wincost', text: 'Cửa sổ trượt <b>đắt hơn cả không rút gọn ' + Math.round((all.window.cost / all.none.cost - 1) * 100) + '%</b> (' + usd(all.window.cost) + ' so với ' + usd(all.none.cost) + '), dù gửi ít token hơn. ' + lowHit + ' lượt chỉ đọc được tools + system.' });
    else if (strat === 'window' && lowHit) flags.push({ lvl: 'bad', key: 'winhit', text: lowHit + ' lượt có hit dưới 50%: đầu lịch sử đổi mỗi lượt nên chỉ còn 8.000 token tools + system đọc được.' });
    if (R.orphans.length) flags.push({ lvl: 'bad', key: 'orphan', text: 'Lượt <b>' + R.orphans.join(', ') + '</b>: cửa sổ cắt giữa một vòng tool, message đầu lịch sử là tool_use/tool_result mất cặp hoặc assistant đứng đầu. Với Claude đây là lỗi 400.' });
    const lostC = FACTS.map((f, i) => i).filter((i) => i in R.lostAt && FACTS[i].kind !== 'detail');
    if (lostC.length) flags.push({ lvl: strat === 'sum' ? 'bad' : 'warn', key: 'lost', text: 'Mất ' + lostC.length + ' thông tin quan trọng: ' + lostC.map((i) => '<b>' + FACTS[i].text + '</b> (lượt ' + R.lostAt[i] + ')').join('; ') + '.' });
    if (strat === 'trim' && keep > th * 0.75 && R.comps > 3) flags.push({ lvl: 'warn', key: 'hyst', text: 'Mức giữ lại (' + fmtT(keep) + ') sát ngưỡng (' + fmtT(th) + '): rút gọn ' + R.comps + ' lần, mỗi lần bỏ ' + fmtT(R.lostCache / R.comps) + ' token cache. Khoảng cách giữa hai ngưỡng (hysteresis) quá nhỏ.' });
    if (strat === 'sum' && R.comps > 2) flags.push({ lvl: 'warn', key: 'many', text: 'Tóm tắt ' + R.comps + ' lần trong 30 lượt: mỗi lần là một lần nén có mất mát chồng lên lần trước (summary drift).' });
    return { flags, lowHit, lostC };
  }

  function caption(strat, a, R, all, instr) {
    if (strat === 'window') return {
      what: 'Gửi ít token hơn không rút gọn (' + fmtT(R.input) + ' so với ' + fmtT(all.none.input) + ') nhưng chi phí input ' + usd(R.cost) + ' so với ' + usd(all.none.cost) + '.',
      why: 'Mỗi lượt bỏ message cũ nhất, nên message đầu lịch sử đổi liên tục. Request sau không còn nhận request trước làm prefix; gần như toàn bộ lịch sử bị ghi lại với giá 1.25× input thay vì đọc với giá 0.05×.',
      not: 'Không có nghĩa rút gọn là xấu. Rút gọn mỗi lượt mới xấu; rút gọn theo ngưỡng chỉ vỡ cache một lần mỗi đợt.',
      real: 'Thay cửa sổ trượt bằng ngưỡng kích hoạt + mức giữ lại (ví dụ README: chạm 150K thì rút xuống khoảng 30K), cắt ở ranh giới lượt.' };
    if (strat === 'none') return {
      what: a.flags.some((f) => f.key === 'over') ? 'Chi phí input rẻ nhất (' + usd(R.cost) + ') vì gần như mọi lượt đọc cache, nhưng request vượt ngân sách từ lượt ' + R.overs[0] + '.' : 'Chưa chạm ngưỡng: không cần rút gọn, mọi lượt chỉ nối thêm.',
      why: 'Append-only giữ prefix tối đa. Nhưng lịch sử tăng mãi: tool result 6.000 token ở lượt 12 theo mọi request sau.',
      not: 'Rẻ nhất không có nghĩa tốt nhất. Lịch sử dài chứa cả kết quả cũ, giả định đã sửa (Pro X trước khi đổi sang Pro X Lite); model phải tự phân biệt.',
      real: 'Đặt ngưỡng trước khi chạm giới hạn context. Đo chất lượng trả lời ở phiên dài, không chỉ chi phí.' };
    if (strat === 'trim') return {
      what: 'Rút gọn ' + R.comps + ' lần, mỗi lần vỡ cache một lượt: bỏ lại ' + fmtT(R.lostCache) + ' token đã cache, ghi lại ' + fmtT(R.rewrite) + ' token nội dung cũ. Thông tin ở các lượt bị bỏ mất hẳn.',
      why: 'Cắt một khối lượt cũ làm phần đầu lịch sử đổi một lần; các lượt sau nối thêm trên prefix mới nên hit trở lại.',
      not: 'Mất thông tin không phải lỗi ngẫu nhiên: trim bỏ theo tuổi, không theo độ quan trọng. Ràng buộc ở lượt 4 ("chỉ nhận hàng sau 18h") bị bỏ trước chi tiết vô dụng ở lượt 20.',
      real: 'Trim hợp với hội thoại mà lượt cũ ít quan trọng. Với phiên bán hàng có ràng buộc từ đầu, cần tóm tắt dạng đặc tả hoặc external memory.' };
    return {
      what: 'Compact ' + R.comps + ' lần. Mỗi lần: một lời gọi tóm tắt (fork từ prefix đang cache, ' + usd(R.turns.reduce((x, t) => x + t.sumCost, 0)) + ' tổng) rồi vỡ cache một lượt (bỏ lại ' + fmtT(R.lostCache) + ' token đã cache). ' + (a.lostC.length ? 'Mất ' + a.lostC.length + ' thông tin quan trọng.' : 'Giữ được mọi mục tiêu, ràng buộc, quyết định; mất chi tiết từ tool.'),
      why: instr ? 'Chỉ dẫn summarizer nêu rõ phải giữ mục tiêu, ràng buộc, quyết định, việc còn dở. Chi tiết từ tool bị bỏ vì có thể gọi lại tool.' : 'Không có chỉ dẫn, summarizer giữ thứ trông "chính": mục tiêu, quyết định. Ràng buộc nhỏ bị bỏ; qua nhiều lần tóm tắt, quyết định cũ cũng trôi mất (summary drift).',
      not: 'Không có nghĩa model kém. Tóm tắt luôn bỏ bớt; câu hỏi là bỏ cái gì, và điều đó do chỉ dẫn quyết định.',
      real: 'Viết chỉ dẫn summarizer liệt kê thứ phải giữ, ghi đặc tả hiện tại thay vì kể lại lịch sử, và lưu payload gốc để còn đối chiếu.' };
  }

  return {
    id: 'long-context', nav: '7. Context dài', ref: '§3.6–3.9',
    title: 'Cửa sổ trượt gửi ít token hơn mà lại đắt hơn: rút gọn context thế nào cho đúng',
    hook: 'Chọn chiến lược rút gọn, ngưỡng và mức giữ lại. Lab chạy 30 lượt chat ShopViet, tính token, cache và thông tin bị mất ở từng lượt.',
    terms: [
      ['Context budget', 'Số token tối đa bạn cho phép một request mang. Đặt thấp hơn context window của model, vì chất lượng giảm trước khi chạm giới hạn.'],
      ['Cửa sổ trượt (sliding window)', 'Mỗi lượt bỏ message cũ nhất để giữ lịch sử dưới N token. Lượt 20 bỏ user₃, lượt 21 bỏ assistant₃... Đầu lịch sử đổi mỗi lượt.'],
      ['Trim theo ngưỡng', 'Để lịch sử lớn tới ngưỡng (ví dụ 36K), rồi bỏ một khối lượt cũ một lần cho còn mức giữ lại (ví dụ 14K).'],
      ['Summarize / compact', 'Thay lịch sử cũ bằng một bản tóm tắt. Client tự làm (summarize) hoặc provider làm (compaction phía server của Claude, OpenAI).'],
      ['Hysteresis', 'Khoảng cách giữa ngưỡng kích hoạt và mức giữ lại. Chạm 150K rút xuống 30K thì còn 120K chỗ trước lần sau; rút xuống 140K thì lượt sau lại phải rút.'],
      ['Thinking block', 'Phần suy luận model trả về kèm câu trả lời. Claude gắn signature: chuỗi ký xác nhận block được sinh từ đúng prefix nào.'],
      ['Fork / sub-agent', 'Fork: lời gọi phụ dùng lại nguyên prefix đang có rồi nối chỉ dẫn ở cuối. Sub-agent: agent con có context riêng, chỉ trả về bản tóm tắt ngắn.']
    ],
    problem: {
      example: '<b>ShopViet</b>: khách chat 30 lượt. Hỏi Pro X, hỏi kho (<code>kiem_kho</code>), trả góp (<code>tinh_tra_gop</code>), tra đơn SV-4821 (<code>tra_don_hang</code> trả lịch sử đơn 6.000 token), rồi đổi ý sang Pro X Lite, thêm ràng buộc giao hàng sau 18h, chỉ thẻ tín dụng, giao văn phòng.',
      scenario: 'Đến lượt 25 lịch sử vượt ngân sách. Bạn dev cài "giữ các message gần nhất cho vừa ngân sách" ở mỗi lượt. Hoá đơn tăng, và bot hẹn giao hàng buổi sáng.',
      ask: 'Rút gọn kiểu nào để vừa giữ được cache, vừa không quên ràng buộc của khách?',
      solves: 'Rút gọn theo ngưỡng, ở ranh giới lượt, với khoảng hysteresis đủ rộng. Nếu tóm tắt, chỉ dẫn summarizer phải nêu rõ thứ cần giữ. Lab tính cả ba mặt: token, cache, thông tin.',
      read: ['Chọn chiến lược, kéo ngưỡng (đường đỏ đứt) và mức giữ lại (đường xám đứt, chỉ dùng cho trim; summarize thay toàn bộ lịch sử bằng tóm tắt).', 'Mỗi cột là một lượt: phần xanh đọc từ cache, phần cam ghi lại. Tam giác trên cột là lượt rút gọn. Cột viền đỏ là lượt vượt ngân sách.', 'Thanh so sánh chạy cả 4 chiến lược với cùng thông số.', 'Bảng thông tin: 10 sự kiện khách đã nói hoặc tool đã trả, còn trong context ở lượt 30 hay mất từ lượt nào.', 'Giá Claude Opus 5.5 trong README; chỉ tính input. User 300, assistant 700 token như §1.4. Kích thước tool result, tóm tắt (600 token + nội dung, ước lượng ký tự/3) và quy tắc giữ/bỏ của summarizer là giả định để minh hoạ.']
    },
    summary: `<h3>Tóm tắt bài</h3>

<div class="tbl"><table><tr><th>Chiến lược</th><th>Tác động lên cache</th><th>Rủi ro</th></tr>
<tr><td><b>Cửa sổ trượt</b> (mỗi lượt)</td><td>Vỡ ở <b>mọi</b> request</td><td>Mất chi tiết đầu; tách cặp tool_use / tool_result</td></tr>
<tr><td><b>Trim theo ngưỡng</b></td><td>Vỡ một lần, rồi ổn định</td><td>Mất chi tiết đầu hội thoại</td></tr>
<tr class="cur"><td><b>Summarize theo ngưỡng</b> (client)</td><td>Vỡ một lần; tóm tắt thành prefix mới</td><td>Tóm tắt bỏ sót; summary drift</td></tr>
<tr><td><b>Compaction phía server</b> (Claude, OpenAI)</td><td>Vỡ một lần ở điểm compact</td><td>Ít kiểm soát nội dung (Claude cho truyền <code>instructions</code>)</td></tr>
<tr><td><b>Context editing</b> (Claude)</td><td>Phần bị dọn thay đổi; dọn theo ngưỡng</td><td>Model phải gọi lại tool nếu cần</td></tr>
<tr><td><b>External memory</b></td><td>Không ảnh hưởng: chỉ nối thêm</td><td>Model phải biết khi nào ghi, đọc</td></tr>
<tr><td><b>Sub-agent</b></td><td>Context chính chỉ nối thêm tóm tắt</td><td>Chi phí agent con; mất chi tiết</td></tr></table></div>
<ul><li>Hai ngưỡng: kích hoạt và mức giữ lại (ví dụ chạm 150K rút xuống khoảng 30K). Claude compaction mặc định kích hoạt ở 150K token.</li>
<li>Compact ở ranh giới lượt, không giữa tool round đang chờ <code>tool_result</code>.</li>

<li>Keep-tail với preserved thinking: thinking của các lượt giữ lại không qua được prefix check, phải bỏ hoặc dùng <code>drop_block</code>.</li></ul>
<h4>Tools trong hội thoại dài (§3.6)</h4>
<ul><li>Chọn tập tool khi tạo phiên, sort theo tên. Chặn quyền bằng <code>tool_choice</code>, chỉ dẫn mới hoặc ở tầng thực thi.</li><li>Kết quả lớn: lưu ra file/storage, trả đường dẫn + tóm tắt.</li><li>Tool call song song: mỗi call phải có result, kể cả khi lỗi; Claude gom các <code>tool_result</code> vào một user message.</li></ul>
<h4>Reasoning / thinking (§3.7, rút gọn)</h4>
<div class="tbl"><table><tr><th>Provider</th><th>Gửi lại?</th></tr>
<tr><td>Claude</td><td>Có, nguyên block kèm <code>signature</code></td></tr>
<tr><td>OpenAI Responses</td><td>Có, mọi item trong <code>output</code> (<code>encrypted_content</code> khi <code>store: false</code>)</td></tr>
<tr><td>xAI</td><td>Có, <code>reasoning.encrypted_content</code> y nguyên</td></tr>
<tr><td>Gemini generateContent</td><td>Có, mọi part với <code>thoughtSignature</code></td></tr>
<tr><td>DeepSeek</td><td>Có tools: bắt buộc mọi lượt (thiếu là 400). Không tools: bị bỏ qua</td></tr>
<tr><td>Self-hosted (Qwen3...)</td><td>Template thường tự bỏ reasoning lượt trước</td></tr></table></div>
<div class="verdict"><b>Fork hay context riêng (§3.9):</b> lời gọi phụ cần đúng lịch sử hiện có thì fork (giữ model, tools, system, lịch sử, nối chỉ dẫn ở cuối). Nhiệm vụ tách được (đọc 30 file) thì giao sub-agent context riêng và chỉ nhận về tóm tắt.</div>`,
    why: {
      c: 'Append-only giữa hai lần rút gọn; rút gọn theo ngưỡng ở ranh giới lượt, với hysteresis rộng. Ưu tiên tóm tắt dạng đặc tả với chỉ dẫn rõ ràng, hoặc compaction phía server. Kết quả tool lớn để ngoài context. Lời gọi tóm tắt là fork từ prefix đang cache.',
      s: 'Cửa sổ trượt: vỡ cache mọi lượt, có thể cắt đôi cặp tool. Không rút gọn: vượt giới hạn và context rot. Trim mù theo tuổi: mất ràng buộc từ đầu phiên. Summarizer với system prompt mới: ghi lại cả 100K token lịch sử.',
      p: 'Mỗi lần compact mất cache một lượt và trả thêm một lời gọi tóm tắt. Tóm tắt luôn mất chi tiết; model có thể phải gọi lại tool. Thinking của các lượt giữ lại sau tóm tắt phải bỏ.'
    },
    deep: [
      {
        q: 'Model có context 1M token rồi, sao còn phải rút gọn?',
        a: `<p>Vì hai lý do độc lập. <b>Chất lượng</b>: context window chỉ cho biết bao nhiêu token vào được, không cho biết model dùng chúng tốt ra sao. Lost in the Middle cho thấy thông tin ở giữa bị dùng kém nhất; Context Rot (Chroma, 18 model) cho thấy hiệu năng giảm khi input dài ra, kể cả tác vụ đơn giản; trên LongMemEval, đưa phần liên quan (~300 token) tốt hơn hẳn đưa toàn bộ lịch sử (~113K token) (§1.3).</p>
<p><b>Chi phí</b>: input của request thứ n ≈ S + n·t, tổng N lượt ≈ N·S + t·N(N+1)/2, tăng theo N². Cache giảm giá phần lặp lại nhưng không làm nó biến mất. Kéo số lượt để xem; ở 30 lượt các con số khớp ví dụ §1.4.</p>`,
        viz(box) {
          const out = el('div');
          function draw(N) {
            const S = 8300, t = 1000, input = N * S + t * (N * (N - 1)) / 2, newTok = S + t * (N - 1), read = input - newTok;
            out.innerHTML = '<div class="stat"><span>Tổng input <b>' + fmtT(input) + '</b> token</span><span>Nội dung mới chỉ <b>' + fmtT(newTok) + '</b> (' + Math.round((newTok / input) * 100) + '%)</span><span>Không cache <b>' + usd((input * PRICE.inp) / 1e6) + '</b></span><span>Cache đúng <b>' + usd(costOf(read, newTok)) + '</b></span><span>Request cuối mang <b>' + fmtT(S + t * (N - 1)) + '</b> token</span></div>';
          }
          const sl = slider('Số lượt', 5, 200, 1, 30, draw);
          box.append(el('div', { class: 'row' }, [sl.node]), out, el('div', { class: 'cap', text: 'S = 8.300 (tools + system + user₁), mỗi lượt thêm 1.000 token (§1.4). Giá Claude Opus 5.5 trong README. Gấp đôi số lượt thì tổng input gần gấp bốn.' }));
          draw(30);
        },
        take: 'Context window là trần, không phải mục tiêu. Rút gọn vì chất lượng trước, vì tiền sau.'
      },
      {
        q: 'Cửa sổ trượt gửi ít token hơn, sao lại đắt hơn?',
        a: `<p>Vì cái đắt không phải số token mà là số token <b>phải tính lại</b>. Cửa sổ trượt bỏ message cũ nhất ở mỗi lượt, nên message đầu tiên sau system đổi mỗi lượt. Request n+1 không còn bắt đầu bằng request n, cache chỉ còn đọc được 8.000 token tools + system. Phần lịch sử còn lại, dù y hệt nội dung lượt trước, bị ghi lại với giá 1.25× input thay vì đọc với giá 0.05× (Opus 5.5).</p>
<p>Hai dải ô dưới đây là 30 lượt với cùng ngưỡng 36K. Ô xanh: hơn nửa input đọc từ cache. Ô cam: không.</p>`,
        viz(box) {
          const rows = [['window', 'Cửa sổ trượt'], ['trim', 'Trim theo ngưỡng (giữ 14K)']].map(([s, n]) => [n, run(s, 36000, 14000, true)]);
          box.append(...rows.map(([n, R]) => el('div', { style: 'margin-bottom:10px' }, [
            el('div', { class: 'hint', style: 'margin:0 0 4px', html: n + ': chi phí input <b>' + usd(R.cost) + '</b>, ghi lại ' + fmtT(R.rewrite) + ' token nội dung cũ' }),
            el('div', { style: 'display:grid;grid-template-columns:repeat(30,1fr);gap:2px' }, R.turns.map((t) => el('span', { title: 'Lượt ' + t.k + ': hit ' + Math.round((t.read / t.total) * 100) + '%', style: 'height:20px;border-radius:2px;background:' + (t.k === 1 ? 'var(--line)' : t.read / t.total >= 0.5 ? 'var(--accent)' : 'var(--warn)') })))])),
            el('div', { class: 'cap', text: 'Ô đầu là lượt 1 (luôn ghi). Trim cũng có ô cam, nhưng chỉ ở lượt rút gọn; sau đó hit trở lại.' }));
        },
        take: 'Rút gọn mỗi lượt là trả tiền ghi cache mỗi lượt. Gom thành một lần theo ngưỡng.'
      },
      {
        q: 'Trim thì cắt ở đâu? Cắt giữa tool_use và tool_result thì sao?',
        a: `<p>Mỗi <code>tool_use</code> phải có <code>tool_result</code> tương ứng đúng ID, Claude yêu cầu user và assistant xen kẽ. Cắt theo số token "cho vừa" rất dễ để lại một <code>tool_result</code> mồ côi ở đầu lịch sử, hoặc một assistant đứng đầu. Với Claude đó là lỗi 400 (§1.3).</p>
<p>Kéo điểm cắt. Mọi message trước điểm cắt bị bỏ. Lab kiểm tra lịch sử còn lại có hợp lệ không.</p>`,
        viz(box) {
          const msgs = [7, 8, 9].flatMap((k) => turnMsgs(k).concat([{ id: 'a' + k, tok: ASSIST, role: 'assistant', turn: k }]));
          const list = el('div'), note = el('div', { class: 'cap' });
          function draw(c) {
            const kept = msgs.slice(c), first = kept[0];
            const pending = kept.filter((m) => m.role === 'tool_result').some((m) => !kept.find((x) => x.id === 'tu' + m.turn));
            list.replaceChildren(...msgs.map((m, i) => el('div', { class: 'mono', style: 'font-size:12px;padding:3px 8px;margin:2px 0;border-radius:4px;border:1px solid var(--line);' + (i < c ? 'opacity:.35;text-decoration:line-through' : i === c ? 'border-color:var(--accent)' : ''), text: m.role + (m.name ? ' ' + m.name : '') + ' (lượt ' + m.turn + ', ' + m.tok + ' tok)' })));
            note.innerHTML = !first ? 'Đã bỏ hết lịch sử.' : first.role === 'user' && !pending ? '<span class="ok">Hợp lệ: bắt đầu bằng user message, mọi tool_result còn tool_use của nó.</span> Đây là ranh giới lượt.' : first.role === 'tool_result' || pending ? '<b class="bad">tool_result mồ côi</b>: tool_use tương ứng đã bị cắt. Claude trả 400.' : '<b class="bad">Lịch sử bắt đầu bằng ' + first.role + '</b>: sai thứ tự role, và tool_use (nếu có) có thể mất cặp.';
          }
          const sl = slider('Điểm cắt', 0, msgs.length - 1, 1, 0, draw, (v) => 'bỏ ' + v + ' message');
          box.append(el('div', { class: 'row' }, [sl.node]), list, note);
          draw(0);
        },
        take: 'Cắt theo lượt, không theo token. Và không compact khi assistant vừa phát tool_use mà chưa có tool_result.'
      },
      {
        q: 'Tóm tắt thay vì cắt thì giữ được hết chứ?',
        a: `<p>Không. Tóm tắt luôn bỏ bớt; câu hỏi là bỏ cái gì. Summarizer không có chỉ dẫn thường giữ thứ trông "chính" (mục tiêu, quyết định) và bỏ ràng buộc nhỏ như "chỉ nhận hàng sau 18h". Bot sau đó hẹn giao buổi sáng, và không có gì trong context để nó biết là sai.</p>
<p>README đề nghị chỉ dẫn summarizer nêu rõ: mục tiêu hiện tại, ràng buộc của người dùng, quyết định đã chốt, việc còn dở, lỗi đã gặp. Và viết <b>đặc tả hiện tại</b> thay vì kể lại "đầu tiên khách hỏi Pro X, sau đó...". Bật tắt chỉ dẫn để xem bản tóm tắt thật được dựng từ 10 sự kiện của phiên.</p>`,
        viz(box) {
          const out = el('div');
          let instr = true;
          const btn = el('button', { class: 'on', text: 'Chỉ dẫn summarizer rõ ràng', onclick: () => { instr = !instr; btn.classList.toggle('on', instr); draw(); } });
          function draw() {
            const ids = summarize([], FACTS.map((f, i) => i), instr), txt = summaryText(ids, instr);
            const lost = FACTS.map((f, i) => i).filter((i) => !ids.includes(i));
            out.innerHTML = '<pre class="mono" style="white-space:pre-wrap;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)">' + txt + '</pre><div class="stat"><span>≈ <b>' + est(txt) + '</b> token (ước lượng)</span><span>Giữ <b>' + ids.length + '</b>/10</span></div><div class="cap">Bị bỏ: ' + lost.map((i) => '<span class="' + (FACTS[i].kind === 'detail' ? '' : 'bad') + '">' + FACTS[i].text + ' (' + KIND[FACTS[i].kind] + ')</span>').join('; ') + '</div>';
          }
          box.append(el('div', { class: 'row' }, [btn]), out, el('div', { class: 'cap', text: 'Quy tắc giữ/bỏ là giả định để minh hoạ. Chi tiết từ tool bị bỏ ở cả hai cách: model có thể gọi lại tool. Chữ đỏ là thông tin quan trọng bị mất.' }));
          draw();
        },
        take: 'Chất lượng bản tóm tắt quyết định phần công việc nào còn tiếp tục được. Viết chỉ dẫn cho summarizer như viết spec.'
      },
      {
        q: 'Tóm tắt một lần ổn rồi, tóm tắt lần hai, lần ba thì sao?',
        a: `<p>Lần hai tóm tắt <b>bản tóm tắt</b> cộng các lượt mới. Thứ gì lần một đã nén mạnh thì lần hai nén thêm. Không có chỉ dẫn, quyết định cũ trông như "lịch sử" và bị thay bằng quyết định mới nhất. Đó là <b>summary drift</b>: mỗi lần trôi một chút, sau vài lần phiên đã quên điều khách chốt từ đầu.</p>
<p>Kéo số lần tóm tắt. Mỗi lần, 3 sự kiện mới được thêm (theo thứ tự trong phiên) rồi cả bản cũ lẫn sự kiện mới đi qua summarizer.</p>`,
        viz(box) {
          const out = el('div');
          function draw(n) {
            const rowsFor = (instr) => { let s = []; for (let p = 0; p < n; p++) { const raw = FACTS.map((f, i) => i).filter((i) => i >= p * 3 && i < p * 3 + 3 + (p === n - 1 ? 10 : 0)); s = summarize(s, raw, instr); } return s; };
            const a = rowsFor(false), b = rowsFor(true);
            out.innerHTML = '<div class="tbl"><table><tr><th>Sự kiện</th><th>Loại</th><th>Không chỉ dẫn</th><th>Có chỉ dẫn</th></tr>' + FACTS.map((f, i) => '<tr><td>' + f.text + '</td><td>' + KIND[f.kind] + '</td><td>' + (a.includes(i) ? '<span class="ok">còn</span>' : '<span class="' + (f.kind === 'detail' ? '' : 'bad') + '">mất</span>') + '</td><td>' + (b.includes(i) ? '<span class="ok">còn</span>' : '<span class="' + (f.kind === 'detail' ? '' : 'bad') + '">mất</span>') + '</td></tr>').join('') + '</table></div>';
          }
          const sl = slider('Số lần tóm tắt', 1, 4, 1, 1, draw);
          box.append(el('div', { class: 'row' }, [sl.node]), out, el('div', { class: 'cap', text: 'Lần cuối gộp mọi sự kiện còn lại. Quy tắc là giả định: không chỉ dẫn thì từ bản cũ chỉ giữ mục tiêu và quyết định mới nhất.' }));
          draw(1);
        },
        take: 'Mỗi lần compact là một lần nén có mất mát. Giữ hysteresis rộng để compact ít lần, và cân nhắc external memory cho thứ phải nhớ chắc chắn.'
      },
      {
        q: 'tra_don_hang trả về lịch sử đơn 50.000 token. Để nguyên trong lịch sử có sao không, đằng nào cũng cache?',
        a: `<p>Cache làm nó rẻ, không làm nó biến mất. Kết quả 50K token ở lượt 3 theo <b>mọi</b> request sau cho tới lần rút gọn: chiếm ngân sách context, đẩy lượt compact tới sớm hơn, và là thêm 50K token model phải lọc khi tìm thứ liên quan.</p>
<p>README đề xuất: nếu đọc lại được qua tool, lưu kết quả lớn ra file hoặc storage, trả về đường dẫn + phần tóm tắt. Model vẫn lấy chi tiết khi cần. Cũng ở §3.6: danh sách tools cố định theo phiên và sort theo tên; tool chưa được phép thì chặn bằng <code>tool_choice</code> (ở Claude giữ được cache tools và system) hoặc ở tầng thực thi; mỗi tool call song song phải có result kể cả khi lỗi.</p>`,
        viz(box) {
          const out = el('div');
          function draw(sz) {
            const after = 20, full = costOf(sz * (after - 1), sz), ptr = costOf(500 * (after - 1), 500);
            out.replaceChildren(hbars([['Để nguyên ' + fmtT(sz) + ' token', full, false], ['Đường dẫn + tóm tắt 500 token', ptr, true]], { max: full, fmt: usd }),
              el('div', { class: 'cap', html: 'Qua ' + after + ' request sau lượt 3 (1 lần ghi, ' + (after - 1) + ' lần đọc cache). Với ngân sách 36K, kết quả này chiếm <b class="' + (sz > 36000 * 0.3 ? 'bad' : '') + '">' + Math.round((sz / 36000) * 100) + '%</b> context' + (sz > 28000 ? ': cộng 8.000 token tools + system là vượt ngân sách ngay lập tức.' : '.') }));
          }
          const sl = slider('Kích thước kết quả', 1000, 80000, 1000, 50000, draw, fmtT);
          box.append(el('div', { class: 'row' }, [sl.node]), out, el('div', { class: 'cap', text: 'Giá Claude Opus 5.5 trong README, giả định mọi request sau đều hit cache.' }));
          draw(50000);
        },
        take: 'Hỏi "kết quả này có cần nằm trong context mãi không", chứ không chỉ "có được cache không".'
      },
      {
        q: 'Thinking / reasoning của lượt trước: gửi lại hay bỏ cho nhẹ?',
        a: `<p>Không có câu trả lời chung: mỗi provider một quy tắc, làm sai thì mất cache, mất chất lượng, hoặc lỗi 400. Quy tắc an toàn ở tầng lưu trữ: <b>luôn lưu nguyên</b> output của provider. Ở tầng dựng request: áp quy tắc của API đang dùng, nhất quán ở mọi lượt. Chọn provider để xem quy tắc (bảng §3.7).</p>`,
        viz(box) {
          const P = [
            ['Claude', 'Có, nguyên block kèm signature. API tự bỏ block model hiện tại không đọc được (không tính phí).', 'Sửa lịch sử trước block (preserved thinking): tuỳ model 400, hoặc không lỗi mà model vẫn đọc và tính tiền block đã mất hiệu lực; với drop_block thì block bị bỏ. Bỏ block ở giữa: block sau mất hiệu lực.'],
            ['OpenAI Responses', 'Có, mọi item trong output, gồm reasoning item và encrypted_content khi store: false.', 'Prefix khác, mất cache; model mất phần suy luận đã làm.'],
            ['xAI', 'Có, reasoning.encrypted_content y nguyên.', 'Nguyên nhân cache miss số một theo docs xAI.'],
            ['Gemini generateContent', 'Có, mọi part với thoughtSignature y nguyên, đúng thứ tự (song song: các FC trước, các FR sau).', 'Gemini 3: 400 nếu thiếu ở function call trong lượt hiện tại. Gemini 2.5: giảm chất lượng.'],
            ['Gemini Interactions', 'Stateful: server tự lo. Stateless: gửi lại mọi thought step.', 'Model mất reasoning của các bước trước.'],
            ['DeepSeek', 'Có tools: bắt buộc gửi lại mọi lượt. Không tools: bị bỏ qua.', '400 nếu thiếu khi có tools.'],
            ['Kimi K3 / K3.1', 'Có, toàn bộ assistant message.', 'Bắt buộc trong tool loop.'],
            ['Kimi K2.6', 'Theo thinking.keep.', 'Mặc định bỏ.'],
            ['GLM 5.x / 4.7', 'Interleaved: gửi cùng tool results. Preserved (clear_thinking: false): gửi nguyên văn, đúng thứ tự.', 'Sai thứ tự hoặc sửa nội dung: hỏng tính liên tục.'],
            ['MiniMax M3.x', 'Có, toàn bộ message.', '"Phá vỡ tính liên tục".'],
            ['Self-hosted (Qwen3 và tương tự)', 'Template thường tự bỏ reasoning của lượt trước user message cuối.', 'Mất cache phần đó mỗi lượt mới.']];
          const out = el('div');
          const draw = (v) => { const p = P[+v]; out.innerHTML = '<div class="tbl"><table><tr><th>Gửi lại?</th><td>' + p[1] + '</td></tr><tr><th>Làm sai thì</th><td class="bad">' + p[2] + '</td></tr></table></div>'; };
          box.append(el('div', { class: 'row' }, [select('Provider', P.map((p, i) => [i, p[0]]), 0, draw).node]), out, el('div', { class: 'cap', text: 'Nội dung chép từ bảng §3.7 của README (tháng 11/2026).' }));
          draw(0);
        },
        take: 'Mặc định: giữ nguyên và gửi lại. Bỏ chỉ khi API yêu cầu, và bỏ nhất quán.'
      },
      {
        q: 'Compact xong muốn giữ nguyên vài lượt cuối cho model đỡ hụt hẫng (keep-tail). Có vấn đề gì với Claude?',
        a: `<p>Với model có <b>preserved thinking</b> (Opus 5.5, Sonnet 5.5, Haiku 5.5, Fable 5.1...), signature của mỗi thinking block ghi lại prefix đã sinh ra nó. Đặt lượt 4–5 sau bản tóm tắt nghĩa là prefix phía trước chúng đã khác, nên thinking của chúng không qua <b>prefix check</b>. Tương tự khi sửa một lượt cũ: thinking đứng sau chỗ sửa mất hiệu lực; thinking đứng trước và thinking sinh ra sau đó vẫn hợp lệ.</p>
<p>Quy tắc bỏ an toàn: bỏ ở hai đầu chuỗi (cũ nhất hoặc mới nhất) hoặc bỏ tất cả; phần còn lại phải là một dãy liền. Bấm từng block để giữ/bỏ, hoặc chọn một thao tác.</p>`,
        viz(box) {

          function draw() {
            const kept = keep.map((k, i) => (k ? i : -1)).filter((i) => i >= 0);

            const invalid = new Set();
            if (gapAt > 0) kept.slice(gapAt).forEach((i) => invalid.add(i));

          const s = select('Thao tác', [['none', 'Chỉ nối thêm'], ['edit', 'Sửa user message lượt 2 (tính năng "chỉnh sửa tin nhắn")'], ['tail', 'Tóm tắt lượt 1–3, giữ nguyên lượt 4–5']], 'none', (v) => { op = v; draw(); });

        },
        take: 'Docs Anthropic khuyên: tóm tắt toàn bộ rồi bắt đầu bằng tóm tắt + lượt mới. Nếu giữ đuôi, bỏ thinking của phần đuôi.'
      },
      {
        q: 'Để tóm tắt, gọi một request mới với system "Bạn là summarizer" cho sạch, có được không?',
        a: `<p>Được, nhưng đó là một <b>prefix mới</b> từ token đầu tiên. Chép 100K token lịch sử vào sau system prompt khác thì cả 100K phải tính lại. Fork thì giữ nguyên <code>model</code>, <code>tools</code>, <code>system</code> và lịch sử, chỉ nối chỉ dẫn tóm tắt ở cuối, nên đọc được cache của request vừa gửi. Với Claude preserved thinking, request tóm tắt vẫn phải giữ <code>tools</code> (bỏ tools là sửa prefix), và dặn model viết tóm tắt thay vì gọi tool (§3.9).</p>
<p>Sub-agent là chuyện khác: dùng khi nhiệm vụ <b>tách được</b>, ví dụ đọc 30 trang chính sách để trả lời một câu hỏi. Agent con có context riêng, trả về 1–2K token tóm tắt; context chính chỉ nối thêm phần đó.</p>`,
        viz(box) {
          const out = el('div');
          function draw(h) {
            const fork = costOf(h, 200), fresh = costOf(0, h + 200), plain = ((h + 200) * PRICE.inp) / 1e6;
            out.replaceChildren(hbars([['Fork (nối chỉ dẫn ở cuối)', fork, true], ['System mới, có cache', fresh, false], ['System mới, không cache', plain, false]], { max: fresh, fmt: usd }),
              el('div', { class: 'cap', html: 'Lịch sử ' + fmtT(h) + ' token: system mới tốn gấp <b>' + Math.round(fresh / fork) + '</b> lần fork, chỉ riêng phần input. So với một lượt chat chính (đọc cache ' + usd(costOf(h, 1000)) + '), lời gọi tóm tắt kiểu system mới còn đắt hơn.' }));

          box.append(el('div', { class: 'row' }, [sl.node]), out, el('div', { class: 'cap', text: 'Giá Claude Opus 5.5 trong README, chỉ dẫn tóm tắt 200 token (giả định). Không tính output. Fork giả định entry cache của request trước còn hiệu lực.' }));
          draw(100000);
        },
        take: 'Cần lại lịch sử hiện có thì fork. Nhiệm vụ tách được thì sub-agent với context riêng.'
      }
    ],
    mount(stage) {
      const st = { strat: 'window', th: 30000, keep: 12000, instr: false };
      const chart = el('div'), stat = el('div', { class: 'stat' }), cmp = el('div'), facts = el('div'), flagsBox = el('div'), cap = el('div', { class: 'qa-viz' });
      const instrBtn = el('button', { text: 'Chỉ dẫn summarizer rõ ràng', onclick: () => { st.instr = !st.instr; render(); } });
      function drawChart(R) {

        const max = Math.max(st.th * 1.1, ...R.turns.map((t) => t.total)), y = (v) => T + (H - T - B) * (1 - v / max), bw = (W - L - 6) / n;
        const kids = [el('line', { x1: L, x2: W, y1: H - B, y2: H - B, stroke: 'var(--line)' })];
        [0, 0.25, 0.5, 0.75, 1].forEach((f) => { const v = max * f; kids.push(el('text', { x: 0, y: y(v) + 4, class: 'mute', text: Math.round(v / 1000) + 'K' })); });
        R.turns.forEach((t, i) => {
          const x = L + i * bw + 1, w = bw - 2;
          kids.push(el('rect', { x, y: y(t.read), width: w, height: y(0) - y(t.read), fill: 'var(--accent)', opacity: 0.85 }, [el('title', { text: 'Lượt ' + t.k + ': đọc ' + t.read })]));
          kids.push(el('rect', { x, y: y(t.total), width: w, height: y(t.read) - y(t.total), fill: 'var(--warn)', opacity: 0.8, stroke: t.over && st.strat === 'none' ? 'var(--bad)' : 'none', 'stroke-width': 2 }, [el('title', { text: 'Lượt ' + t.k + ': ' + t.total + ' token, ghi ' + t.write })]));
          if (t.comp && st.strat !== 'none') kids.push(el('polygon', { points: (x + w / 2) + ',' + (y(t.total) - 3) + ' ' + (x + w / 2 - 4) + ',' + (y(t.total) - 10) + ' ' + (x + w / 2 + 4) + ',' + (y(t.total) - 10), fill: t.orphan ? 'var(--bad)' : 'var(--ink)' }));
          if (t.k % 5 === 0 || t.k === 1) kids.push(el('text', { x: x, y: H - 6, class: 'mute', text: String(t.k) }));
        });
        kids.push(el('line', { x1: L, x2: W, y1: y(st.th), y2: y(st.th), stroke: 'var(--bad)', 'stroke-dasharray': '6 4' }), el('text', { x: W - 120, y: y(st.th) - 4, fill: 'var(--bad)', text: 'ngưỡng ' + fmtT(st.th) }));
        if (st.strat === 'trim') kids.push(el('line', { x1: L, x2: W, y1: y(st.keep), y2: y(st.keep), stroke: 'var(--mute)', 'stroke-dasharray': '3 4' }), el('text', { x: W - 120, y: y(st.keep) - 4, class: 'mute', text: 'giữ lại ' + fmtT(st.keep) }));
        chart.replaceChildren(el('svg', { class: 'canvas', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Token mỗi lượt, phần đọc cache và ghi lại' }, kids),
          el('div', { class: 'legend', html: '<span><i style="background:var(--accent)"></i>đọc từ cache</span><span><i style="background:var(--warn)"></i>ghi lại</span><span>▼ lượt rút gọn (đỏ: cắt hỏng cặp tool)</span><span>Trục ngang: lượt 1–30</span>' }));

        const all = Object.fromEntries(STRATS.map(([s]) => [s, run(s, st.th, st.keep, st.instr)]));
        const R = all[st.strat];
        drawChart(R);
        const late = R.turns.filter((t) => t.k > 1), hit = late.reduce((a, t) => a + t.read, 0) / late.reduce((a, t) => a + t.total, 0);
        stat.innerHTML = '<span>Tổng input <b>' + fmtT(R.input) + '</b></span><span>Đọc cache lượt 2–30 <b class="' + (hit < 0.5 ? 'bad' : 'ok') + '">' + Math.round(hit * 100) + '%</b></span><span>Chi phí input <b>' + usd(R.cost) + '</b></span><span>Rút gọn <b>' + (st.strat === 'none' ? 0 : R.comps) + '</b> lần</span><span>Cache bỏ lại khi rút gọn <b>' + fmtT(R.lostCache) + '</b> token</span><span>Nội dung cũ ghi lại <b>' + fmtT(R.rewrite) + '</b> token</span><span>Lượt cuối mang <b>' + fmtT(R.turns[R.turns.length - 1].total) + '</b> token</span>';

          hbars(STRATS.map(([s, n]) => [n + ' · mất ' + FACTS.filter((f, i) => i in all[s].lostAt && f.kind !== 'detail').length + ' TT quan trọng', all[s].cost, s === st.strat]), { max: Math.max(...STRATS.map(([s]) => all[s].cost)), fmt: usd }),

        facts.innerHTML = '<h4 style="margin:16px 0 6px">Khách đã nói gì, còn trong context ở lượt 30 không?</h4><div class="tbl sum" style="border:0;margin:0;padding:0"><table><tr><th>Lượt</th><th>Sự kiện</th><th>Loại</th><th>Lượt 30</th></tr>' + FACTS.map((f, i) => {
          const lost = i in R.lostAt, inSum = R.summary && R.summary.facts.includes(i);
          return '<tr><td>' + f.t + '</td><td>' + f.text + '</td><td>' + KIND[f.kind] + '</td><td>' + (lost ? '<b class="' + (f.kind === 'detail' ? '' : 'bad') + '">mất từ lượt ' + R.lostAt[i] + '</b>' : inSum ? '<span class="ok">trong tóm tắt</span>' : '<span class="ok">còn nguyên văn</span>') + '</td></tr>';
        }).join('') + '</table></div>';
        const a = analyse(st.strat, st.th, st.keep, st.instr, R, all);
        flagsBox.replaceChildren(...(a.flags.length ? a.flags.map((f) => el('div', { style: 'font-size:13px;margin:4px 0;padding:6px 10px;border-left:3px solid var(--' + f.lvl + ');background:var(--bg);border-radius:0 6px 6px 0', html: f.text })) : [el('div', { class: 'ok', style: 'font-size:13px', text: 'Không phát hiện vấn đề nào với thông số này.' })]));
        const c = caption(st.strat, a, R, all, st.instr);
        cap.innerHTML = '<div style="font-size:13.5px"><p style="margin:0 0 4px"><b>Chuyện gì xảy ra:</b> ' + c.what + '</p><p style="margin:0 0 4px"><b>Vì sao:</b> ' + c.why + '</p><p style="margin:0 0 4px"><b>Không có nghĩa là:</b> ' + c.not + '</p><p style="margin:0"><b>Trong hệ thống thật:</b> ' + c.real + '</p></div>';
      }
      const sSel = select('Chiến lược', STRATS, st.strat, (v) => { st.strat = v; render(); });
      const thSl = slider('Ngưỡng / ngân sách', 16000, 60000, 1000, st.th, (v) => { st.th = v; render(); }, fmtT);
      const keepSl = slider('Giữ lại sau rút gọn', 4000, 40000, 1000, st.keep, (v) => { st.keep = v; render(); }, fmtT);
      stage.append(el('div', { class: 'row' }, [sSel.node, instrBtn]), el('div', { class: 'row' }, [thSl.node, keepSl.node]), chart, stat, el('h4', { text: 'Phát hiện từ dữ liệu', style: 'margin:16px 0 4px' }), flagsBox, cap, cmp, facts,
        el('p', { class: 'hint', text: 'Mỗi lượt gộp thành một request (thực tế mỗi vòng tool là thêm một request). Cache kiểu Claude: breakpoint sau system + breakpoint tự động ở cuối; các lượt cách nhau dưới 5 phút (giả định). Cửa sổ trượt bỏ từng message cũ nhất cho vừa ngưỡng; trim bỏ cả lượt; summarize thay toàn bộ lịch sử bằng tóm tắt (cách README mô tả cho client).' }));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),

})();
