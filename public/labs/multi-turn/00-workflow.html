const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const PRICE = { in: 4, w5: 5, w60: 8, rd: 0.2 };
  const TOOLS = 2000, SYS = 6000, U = 300, A = 700, MIN = 512;

<p>Hệ quả: request lượt n có input = 8.300 + 1.000·(n−1) token theo giả định README. Lượt 1 là 8.300, lượt 30 là 37.300. Cộng 30 lượt được 684.000 token, trong khi nội dung mới chỉ khoảng 38.000. Lab 01 đi sâu vào phần này.</p>`,
        take: 'Ứng dụng tạo ra "trí nhớ" bằng cách gửi lại lịch sử. Vì vậy hơn 90% input là chữ cũ, và đó là chỗ cache có đất dùng.'
      },
      {
        q: 'Cache "khớp prefix" là khớp cái gì? Đổi một ký tự giữa system prompt thì mất bao nhiêu?',
        a: `<p>Provider so request mới với request cũ <b>từ token đầu tiên</b>, dừng ở chỗ khác nhau đầu tiên. Lý do là attention trong decoder là causal: kết quả tính cho token thứ i phụ thuộc mọi token đứng trước nó. Đổi một ký tự ở vị trí i thì mọi thứ từ i trở đi phải tính lại, kể cả 29 lượt hội thoại không hề thay đổi chữ nào.</p>
<p>Với Claude còn thêm một điều kiện: cache chỉ được ghi và tìm ở <b>breakpoint</b>. Breakpoint đầu nằm ở cuối system, tức là sau chỗ bị đổi. Nên với Claude, đổi một ký tự trong system mất toàn bộ cache, kể cả tools đứng trước, trừ khi bạn đặt thêm breakpoint ngay sau tools.</p>
<p>Kéo vị trí bên dưới. Trình duyệt so hai bản system prompt từng ký tự và tính ở lượt 30 còn dùng lại được bao nhiêu.</p>`,
        viz(box) {
          const s1 = SYSTEM_TEXT, strip = el('div', { class: 'mono', style: 'font-size:12px;line-height:1.7;word-break:break-all' }), stat = el('div', { class: 'stat' }), cap = el('div', { class: 'cap' });

            strip.replaceChildren(...[...s2].map((c, j) => el('span', { text: c, style: j < m ? 'background:var(--accent-soft)' : j === m ? 'background:var(--bad);color:var(--panel)' : 'color:var(--bad)' })));

          const sl = slider('Vị trí đổi', 0, s1.length - 1, 1, 120, draw);

        take: 'Đổi ở đâu thì mất từ đó trở đi. System và tools đứng đầu nên một ký tự ở đó làm mất gần như toàn bộ.'
      },
      {
        q: 'Vì sao lượt 1 dùng cache lại đắt hơn không dùng?',
        a: `<p>Vì ghi cache có phụ phí. Với TTL 5 phút, Claude tính ghi bằng 1.25× giá input ($5 so với $4/MTok trên Opus 5.5). Với TTL 1 giờ là 2× (lab suy ra $8/MTok). Lượt 1 chỉ ghi, chưa đọc gì, nên đắt hơn 25% (hoặc 100%) so với không cache.</p>
<p>Tiền bỏ ra lúc ghi chỉ được bù khi prefix được đọc lại. README tính hoà vốn: TTL 5 phút cần 2 request dùng chung prefix, TTL 1 giờ cần ít nhất 3. Thử số request bên dưới, prefix 8.300 token như lượt 1.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' });

            const X = 8300, w = st.ttl === 60 ? PRICE.w60 : PRICE.w5;

        take: 'Cache write là khoản đầu tư. Lượt đầu và mỗi lần miss là lúc bỏ tiền ra; chỉ các lần đọc sau mới thu lại.'

      {
        q: 'Có ai lại đi sửa system prompt giữa phiên? Thực tế cái gì gây ra chuyện này?',

        },
        take: 'Kẻ phá cache thường là một dòng code nhỏ ở đầu prompt. Ứng dụng vẫn chạy đúng, chỉ có hoá đơn khác.'
      },
      {
        q: 'Khách đi pha cà phê 12 phút rồi quay lại hỏi tiếp. Nên dùng TTL 5 phút hay 1 giờ?',
        a: `<p>TTL 5 phút: mỗi lần đọc làm mới bộ đếm, nên khi khách nhắn đều thì cache sống mãi. Nghỉ 12 phút là cache hết hạn, lượt sau phải ghi lại toàn bộ prefix. TTL 1 giờ giữ được qua khoảng nghỉ đó, nhưng <b>mọi</b> lần ghi đều đắt hơn ($8 thay vì $5/MTok), kể cả 1.000 token mới mỗi lượt.</p>
<p>Vậy câu trả lời phụ thuộc số lần khách nghỉ. Kéo thử: trình duyệt chạy mô phỏng 30 lượt với các khoảng nghỉ chia đều.</p>`,
        viz(box) {
          const out = el('div'), cap = el('div', { class: 'cap' }), st = { k: 1, m: 12 };

      },
      {
        q: 'Ứng dụng vẫn trả lời đúng cả khi cache vỡ. Vậy làm sao biết mình đang trả tiền theo kịch bản nào?',

<p>Bảng dưới là usage mà mô phỏng sinh ra ở vài lượt. Hình mẫu cần nhớ: từ lượt 2, ghi khoảng 1.000 và đọc gần hết phần còn lại. Lượt nào ghi hàng chục nghìn token là lượt cần điều tra.</p>`,

      },
      {
        q: 'Vậy giờ hiện tại, tên khách, số token còn lại nên đặt ở đâu?',
        a: `<p>Ở chỗ chúng không làm đổi những gì đứng trước. README §3.2 đề xuất bố cục theo độ ổn định, cái ít đổi đứng trước:</p>

<p>Một chi tiết hay sai: dữ liệu ở đuôi sẽ thành lịch sử ở lượt sau. Lượt 5 gửi "giờ hiện tại: 14:02" thì lượt 6 phải giữ nguyên dòng đó và nối giờ mới vào lượt 6. Quay lại sửa thành "14:05" trong message cũ là sửa giữa lịch sử, mất cache từ đó trở đi.</p>`,

    ],
    mount(stage) {
      const st = { N: 30, sel: 30, sys: 'none', k: 12, pause: false, p: 15, pmin: 12, ttl: 5 };

function terms(list) {

}

function problem(p) {

    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')

}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {

    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;

(function build() {
