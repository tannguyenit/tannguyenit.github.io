const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

      read: [

    summary: `<h3>Tóm tắt bài</h3>
<p>Một request cache miss vẫn trả lời đúng và kết thúc thành công. Log lỗi HTTP không cho biết ứng dụng vừa prefill lại bao nhiêu token. Muốn phát hiện sớm, ghi usage của mọi request, chuẩn hoá về cùng một dạng, theo dõi tỉ lệ đọc và ghi qua các lượt, và diff hai request liên tiếp khi thấy bất thường.</p>
<h4>Routing, concurrency và TTL (§3.10)</h4>
<ul><li><b>Routing key</b>: OpenAI và xAI đặt <code>prompt_cache_key</code> / <code>x-grok-conv-id</code> theo conversation ID. Với model OpenAI trước GPT-5.6, giữ dưới khoảng 15 request/phút cho mỗi key. Claude không cần.</li>
<li><b>Request song song cùng prefix</b>: với Claude, cache chỉ dùng được sau khi response của request ghi nó đã bắt đầu. Gửi một request, chờ response, rồi mới fan out.</li></ul>
<div class="tbl"><table><tr><th>Khoảng cách giữa hai request</th><th>Lựa chọn</th></tr>
<tr><td>Dưới 5 phút</td><td>TTL mặc định của mọi provider là đủ</td></tr>
<tr><td>5–60 phút</td><td>Claude: TTL 1 giờ, hoặc keep-alive <code>max_tokens: 0</code>. OpenAI: <code>24h</code> retention hoặc TTL <code>30m</code> / <code>12h</code> với GPT-5.6+. Doubao: explicit cache với <code>expire_at</code></td></tr>
<tr><td>Trên 1 giờ</td><td>Chấp nhận miss cho request đầu khi user quay lại. DeepSeek: cache disk có thể còn sau vài giờ</td></tr></table></div>
<h4>Metric cần theo dõi (§3.11)</h4>
<div class="tbl"><table><tr><th>Metric</th><th>Ý nghĩa</th><th>Ngưỡng cảnh báo gợi ý</th></tr>
<tr><td>Hit rate theo request (<code>cached / total</code>)</td><td>Tỉ lệ input đi qua cache</td><td>Bằng 0 qua nhiều lượt dù prefix đủ dài, ổn định, trong TTL</td></tr>
<tr><td>Hit rate trung bình theo route</td><td>Sức khoẻ từng luồng</td><td>Giảm đột ngột sau một lần deploy</td></tr>
<tr class="cur"><td><code>written</code> so với phần mới thêm</td><td>Có đang ghi lại toàn bộ prefix không</td><td><code>written</code> gần bằng <code>total</code> ở nhiều request liên tiếp</td></tr>
<tr><td>Chi phí input / task hoàn thành</td><td>Thước đo cuối cùng</td><td>Tăng mà traffic không đổi</td></tr>
<tr><td>Số lần compact / phiên</td><td>Compact dày làm mất lợi ích cache</td><td>Tăng sau khi đổi ngưỡng</td></tr></table></div>
<h4>Tìm chỗ vỡ</h4>
<ol><li>Render hai request liên tiếp theo cùng một cách, bỏ marker cache (marker dịch theo lượt, không phải khác biệt thật).</li><li>So <code>model</code>, <code>tools</code>, <code>system</code>, tham số thinking/effort.</li><li>So từng message: message đầu tiên khác là chỗ vỡ.</li><li>Kiểm tra output của request trước được nối lại nguyên vẹn.</li><li>Nếu prefix nguyên vẹn mà vẫn miss: xem TTL, routing, ngưỡng tối thiểu, workspace. Claude có cache diagnostics làm phép so này ở server; self-hosted thì so chuỗi token sau chat template.</li></ol>
<h4>Failure modes thường gặp (§3.13, rút gọn)</h4>
<div class="tbl"><table><tr><th>Triệu chứng</th><th>Nguyên nhân khả dĩ</th><th>Cách kiểm tra</th></tr>
<tr><td>Hit luôn bằng 0</td><td>Prefix dưới ngưỡng; timestamp/UUID ở đầu prompt; tools đổi mỗi request</td><td>So body hai request đầu; đếm token phần tĩnh</td></tr>
<tr><td>Hit ở lượt 2–3 rồi về 0</td><td>Cửa sổ trượt bắt đầu cắt; lookback 20 vị trí (Claude) bị vượt</td><td>Xem lượt nào bắt đầu miss, đếm block mỗi lượt</td></tr>
<tr><td>Hit thấp giờ cao điểm</td><td>Routing tràn máy khác (OpenAI trên ~15 RPM/key); eviction</td><td>RPM theo key, chia key</td></tr>
<tr><td>Hit chỉ bằng tools + system</td><td>Lịch sử dựng lại khác mỗi lượt</td><td>Diff <code>messages</code> hai request liên tiếp</td></tr>
<tr><td><code>cache_creation_input_tokens</code> gần bằng toàn bộ input (Claude)</td><td>Prefix bị viết lại trước breakpoint</td><td>Cache diagnostics; kiểm tra model</td></tr>
<tr><td>Chi phí tăng sau khi bật caching</td><td>Có phí ghi mà cache vỡ liên tục; TTL 1 giờ cho traffic liên tục</td><td>So <code>written</code> với <code>cached</code></td></tr>
<tr><td>Hit tụt đồng loạt mọi phiên</td><td>Deploy prompt / tools mới áp vào phiên đang mở</td><td>Ghim <code>prompt_version</code> theo phiên</td></tr>
<tr><td>Fan-out N worker đều trả giá đầy đủ</td><td>Request song song trước khi cache được ghi</td><td>Gửi một request, chờ token đầu, rồi fan out</td></tr>
<tr><td>Self-hosted: mỗi lượt prefill lại phần lớn lịch sử</td><td>Chat template bỏ <code>&lt;think&gt;</code> của lượt trước</td><td>Render hai request ra token và so sánh</td></tr></table></div>
<h4>Kiểm tra trước khi đưa vào sử dụng (§3.14, ý chính)</h4>
<ul><li><code>model</code>, <code>tools</code>, <code>system</code> xác định một lần khi tạo phiên. System không chứa giờ, UUID, user ID, kết quả RAG hay giá trị đổi theo request.</li>
<li>Tools sort theo tên, JSON serialize với key đã sort. Response lưu và gửi lại nguyên dạng, arguments giữ chuỗi gốc, reasoning xử lý đúng quy tắc provider.</li>
<li>Thông tin động nối vào cuối ở lượt hiện tại. Không cửa sổ trượt; dọn context chỉ khi chạm ngưỡng, ở ranh giới lượt.</li>
<li>Usage được log ở mọi request. Có test hai lượt với prefix đủ dài, TTL còn hiệu lực và mức hit kỳ vọng theo provider.</li>
<li>Phiên đang mở không bị ảnh hưởng khi deploy prompt mới.</li></ul>
<div class="verdict"><b>Một câu:</b> cache vỡ không gây lỗi, chỉ gây tiền. Usage là nơi duy nhất nhìn thấy nó, diff hai request liên tiếp là cách nhanh nhất để biết vì sao.</div>`,
    why: {
      c: 'Log usage ở mọi request, chuẩn hoá về cached / written / total, cảnh báo khi written vượt xa phần mới thêm, và khi có cảnh báo thì diff request đó với request ngay trước. Diff chỉ thẳng vào block đầu tiên khác nhau; nếu diff trống thì biết ngay nguyên nhân nằm ở TTL, routing hay request song song chứ không phải code dựng prompt.',
      s: 'Chỉ nhìn log lỗi HTTP: cache miss vẫn là 200 OK. Chỉ đọc input_tokens của Claude: bỏ sót cả phần đọc lẫn phần ghi cache. Chờ hoá đơn cuối tháng: biết là tốn nhưng không biết request nào, lượt nào, vì sao. Chỉ nhìn hit rate trung bình: một phiên hỏng hoàn toàn bị pha loãng bởi nghìn phiên khoẻ.',
      p: 'Phải lưu body request (hoặc bản render) đủ để diff, nghĩa là thêm dung lượng và phải xử lý dữ liệu khách trong log. Cache là best effort nên test và cảnh báo có thể báo nhầm; một lần miss phải đối chiếu với request đã render và usage trước khi kết luận regression.'

    deep: [

<p>Khác biệt duy nhất nằm trong <code>usage</code> và trên hoá đơn. Bên dưới là lượt 6 của hai phiên trong lab, tính bằng cùng một bộ mô phỏng: phiên #1041 khoẻ, phiên #1042 vừa bị deploy system prompt mới. Câu trả lời giống nhau, usage thì không.</p>`,
        viz(box) {

      {

<p>Vì vậy README đề xuất một hàm <code>normalize_usage</code> đưa mọi provider về <code>{cached, written, total, hit_rate}</code> ngay khi nhận response. Chọn provider bên dưới. Cùng một request (18.300 token input, 11.300 đọc từ cache) được báo theo đúng hình dạng usage của từng API, rồi chuẩn hoá. Field lấy từ README §2.1 và §3.11; số token là ví dụ.</p>`,

<p>Ba lựa chọn cho một khoảng nghỉ: để cache hết hạn rồi ghi lại (giá ghi $5/MTok với Opus 5.5); ghi bằng TTL 1 giờ (2× input = $8/MTok) để đọc lại được; hoặc gửi keep-alive <code>max_tokens: 0</code> mỗi ít phút để đọc với $0,20/MTok. Điểm README nhấn mạnh: <b>chi phí giữ cache phát sinh cả ở những phiên khách không quay lại</b>.</p>

function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));

    })]);
}
