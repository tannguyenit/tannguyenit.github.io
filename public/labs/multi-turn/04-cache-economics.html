const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

        q: 'Cache đúng thì mỗi lượt ghi bao nhiêu, đọc bao nhiêu? Sao README ra đúng 646.700 và 37.300?',
        a: `<p>Breakpoint đặt ở block cuối của request. Request n xử lý xong thì toàn bộ input của nó (I<sub>n</sub>) nằm trong cache. Request n+1 bắt đầu bằng đúng I<sub>n</sub> token đó, rồi thêm câu trả lời 700 token của assistant và câu hỏi 300 token mới.</p>
<ul><li>Đọc: I<sub>n</sub> token (toàn bộ request trước).</li><li>Ghi: 1.000 token mới (câu trả lời trước không nằm trong cache vì nó là output, không phải input).</li></ul>
<p>Cộng qua 29 request (từ 2 đến 30): đọc = I<sub>1</sub> + ... + I<sub>29</sub> = 646.700. Ghi = 8.300 (request 1) + 29 × 1.000 = 37.300. Trình duyệt tính lại bên dưới. Bật timestamp để thấy cùng request đó bị đổi thành "ghi toàn bộ".</p>`,
        viz(box) {
          const out = el('div'), stat = el('div', { class: 'stat' });
          let ts = false, n = 12;
          const btn = el('button', { text: 'Timestamp trong system prompt: tắt', onclick: () => { ts = !ts; btn.classList.toggle('on', ts); btn.textContent = 'Timestamp trong system prompt: ' + (ts ? 'bật' : 'tắt'); draw(); } });
          function draw() {
            const r = sim({ row: byId('opus55'), mode: 0, turns: 30, sys: 8000, u: 300, a: 700, gap: 1, ts });
            const t = r.turns[n - 1], W = 560, sc = W / 37300;
            out.replaceChildren(el('svg', { class: 'canvas', viewBox: `0 0 ${W} 56`, role: 'img', 'aria-label': 'Phần đọc và phần ghi của một request' }, [
              el('rect', { x: 0, y: 8, width: t.read * sc, height: 26, fill: 'var(--accent)' }),
              el('rect', { x: t.read * sc, y: 8, width: t.write * sc, height: 26, fill: ts || t.n === 1 ? 'var(--bad)' : 'var(--warn)' }),
              el('text', { x: 4, y: 50, class: 'mute', text: `đọc ${tok(t.read)}` }), el('text', { x: Math.min(W - 110, t.read * sc + 4), y: 50, class: 'mute', text: `ghi ${tok(t.write)}` })]));
            stat.innerHTML = `<span>Request ${n}: input <b>${tok(t.I)}</b></span><span>Tiền <b>${usd(t.cost, 4)}</b> (không cache ${usd(t.base, 4)})</span><span>30 request: đọc <b>${tok(r.tot.read)}</b>, ghi <b>${tok(r.tot.write)}</b>, tổng <b>${usd(r.tot.cost, 2)}</b></span>`;
          }
          const sl = slider('Request thứ', 1, 30, 1, n, (v) => { n = v; draw(); });
          box.append(el('div', { class: 'row' }, [sl.node, btn]), out, stat,
            el('div', { class: 'cap', text: 'Xanh: đọc từ cache ($0,20/M). Cam: ghi phần mới ($5/M). Đỏ: ghi lại toàn bộ request.' }));
          draw();
        },
        take: 'Append-only biến mỗi lượt thành "đọc phần cũ, ghi phần mới". Một ký tự thay đổi ở đầu prompt biến nó thành "ghi lại tất cả".'
      },
      {
        q: 'Cần bao nhiêu request dùng chung prefix thì mới hoà vốn?',
        a: `<p>Gọi giá ghi là w, giá đọc là r (đều tính theo bội số của giá input). Một prefix được dùng m lần: lần đầu ghi, m−1 lần sau đọc. Có cache tốn w + r·(m−1), không cache tốn m. Hoà vốn khi w + r·(m−1) &lt; m.</p>
<p>README dùng 0.1× là giá đọc chung của Claude. Opus 5.5 đọc còn rẻ hơn (0.05×), nên kết quả không đổi: vẫn hoà vốn ở 2 request.</p>
<p>Claude TTL 5 phút: m = 2 cho 1,25 + 0,1 = 1,35 &lt; 2. TTL 1 giờ: m = 2 cho 2,1, chưa đủ; m = 3 cho 2,2 &lt; 3. Provider không có phí ghi (w = 1) thì m = 2 luôn có lợi, và m = 1 hoà, không bao giờ lỗ.</p>
<p>Chọn cấu hình rồi kéo số lần dùng. Trình duyệt tính và đánh dấu điểm hoà vốn.</p>`,
        viz(box) {
          const cfg = [['Claude TTL 5 phút (1.25× / 0.1×)', 1.25, 0.1], ['Claude TTL 1 giờ (2× / 0.1×)', 2, 0.1], ['Claude Opus 5.5 TTL 5 phút (1.25× / 0.05×)', 1.25, 0.05], ['OpenAI GPT-5.6+ TTL 12h (2.5× / 0.1×)', 2.5, 0.1], ['Implicit không phí ghi (1× / 0.1×)', 1, 0.1]];
          let ci = 0, m = 4;
          const out = el('div', { class: 'tbl' });
          function draw() {
            const [, w, r] = cfg[ci];
            let be = null; for (let k = 1; k <= 20; k++) if (w + r * (k - 1) < k) { be = k; break; }
            const rows = Array.from({ length: m }, (_, i) => i + 1).map((k) => { const c = w + r * (k - 1); return `<tr><td>${k}</td><td class="mono">${c.toFixed(2)}</td><td class="mono">${k}</td><td>${c < k ? '<b class="ok">rẻ hơn</b>' : c === k ? 'bằng' : '<b class="bad">đắt hơn</b>'}${k === be ? ' ← hoà vốn' : ''}</td></tr>`; }).join('');
            out.innerHTML = `<table><tr><th>Số lần dùng</th><th>Có cache (× giá input)</th><th>Không cache</th><th>So sánh</th></tr>${rows}</table><p class="hint">Cần ít nhất <b>${be}</b> request dùng chung prefix.</p>`;
          }
          const s = select('Cấu hình', cfg.map((c, i) => [i, c[0]]), 0, (v) => { ci = +v; draw(); });
          const sl = slider('Số lần dùng', 1, 6, 1, m, (v) => { m = v; draw(); });
          box.append(el('div', { class: 'row' }, [s.node, sl.node]), out, el('div', { class: 'cap', text: 'Tỉ lệ ghi / đọc lấy từ README §1.4, §2.2, §2.3.' }));
          draw();
        },
        take: 'Có phí ghi thì một request đơn lẻ luôn lỗ. Hội thoại nhiều lượt gần như luôn vượt điểm hoà vốn, miễn là prefix còn sống tới lượt sau.'
      },
      {
        q: 'TTL 5 phút tính từ lúc nào? Khách hỏi tiếp sau 3 phút thì chắc chắn hit chứ?',
        a: `<p>Chưa chắc. README ghi: TTL của Claude tính từ lúc <b>bắt đầu</b> request, không phải lúc trả lời xong. Nếu model generate mất 4 phút (câu trả lời dài, nhiều tool call), thì sau khi khách nhận câu trả lời chỉ còn khoảng 1 phút.</p>
<p>Mỗi lần đọc cache làm mới bộ đếm, nên hội thoại liên tục thì cache "sống" mãi. Chỉ khoảng nghỉ giữa hai lần bắt đầu request mới quan trọng.</p>`,
        viz(box) {
          let g = 4, rd = 3;
          const out = el('div'), stat = el('div', { class: 'stat' });
          function draw() {
            const W = 560, sc = W / 12, start2 = g + rd, hit = start2 <= 5;
            out.replaceChildren(el('svg', { class: 'canvas', viewBox: `0 0 ${W} 80`, role: 'img', 'aria-label': 'Dòng thời gian TTL' }, [
              el('rect', { x: 0, y: 10, width: Math.min(5, 12) * sc, height: 14, fill: 'var(--accent-soft)', stroke: 'var(--accent)' }),
              el('text', { x: 4, y: 21, text: 'TTL 5 phút' }),
              el('rect', { x: 0, y: 32, width: g * sc, height: 14, fill: 'var(--g1)' }),
              el('rect', { x: g * sc, y: 32, width: rd * sc, height: 14, fill: 'var(--dim)' }),
              el('line', { x1: Math.min(W - 2, start2 * sc), x2: Math.min(W - 2, start2 * sc), y1: 4, y2: 56, stroke: hit ? 'var(--ok)' : 'var(--bad)', 'stroke-width': 3 }),
              el('text', { x: Math.min(W - 150, start2 * sc + 4), y: 70, style: `fill:${hit ? 'var(--ok)' : 'var(--bad)'}`, text: `request 2 lúc ${start2} phút: ${hit ? 'hit' : 'miss'}` })]));
            stat.innerHTML = `<span>Còn lại sau khi trả lời xong: <b>${Math.max(0, 5 - g)} phút</b></span>`;
          }
          box.append(el('div', { class: 'row' }, [slider('Thời gian generate', 0.5, 6, 0.5, g, (v) => { g = v; draw(); }, (v) => v + ' phút').node,
            slider('Khách đọc rồi hỏi tiếp sau', 0.5, 6, 0.5, rd, (v) => { rd = v; draw(); }, (v) => v + ' phút').node]), out, stat,
            el('div', { class: 'cap', text: 'Xanh dương: model đang generate. Xám: khách đọc câu trả lời. Vạch dọc: request 2 bắt đầu. Quy tắc tính từ lúc bắt đầu request lấy từ README §2.2.' }));
          draw();
        },
        take: 'Khoảng nghỉ cần so với TTL là từ lúc request trước bắt đầu đến lúc request sau bắt đầu. Lượt generate dài ăn vào TTL.'
      },
      {
        q: 'Khách đọc xong rồi 20 phút sau mới hỏi tiếp. Nên dùng TTL 1 giờ, keep-alive, hay chịu miss?',
        a: `<p>README đưa ra ba lựa chọn cho khoảng nghỉ 5–60 phút:</p>
<ul><li><b>Chịu miss</b>: giữ TTL 5 phút, khi khách quay lại thì ghi lại toàn bộ prefix (1.25×).</li>
<li><b>TTL 1 giờ</b>: ghi 2× thay vì 1.25×, khách quay lại trong 1 giờ thì đọc 0.1×.</li>
<li><b>Keep-alive</b>: trước khi TTL 5 phút hết, gửi lại request trước với <code>max_tokens: 0</code>. Mỗi lần như vậy là một lần đọc cache, làm mới TTL mà không sinh output. README ghi cách này thường rẻ hơn TTL 1 giờ với Fable 5.1 vì đọc chỉ 0.025×.</li></ul>
<p>Mô hình bên dưới chỉ tính tiền phát sinh vì <b>một</b> khoảng nghỉ, với prefix P đã nằm trong cache trước đó:</p>
<ul><li>Chịu miss: nghỉ quá 5 phút thì khi khách quay lại, ghi lại P với giá 1.25×.</li>
<li>Keep-alive: cứ 5 phút một lần ping (mỗi ping là một lần đọc P), cộng lần đọc khi khách quay lại. Nghỉ 20 phút là 3 ping + 1 lần đọc.</li>
<li>TTL 1 giờ: lúc ghi P ban đầu phải trả 2× thay vì 1.25×, tức thêm 0,75× cho P. Khách quay lại trong 1 giờ thì chỉ trả một lần đọc.</li></ul>`,
        viz(box) {
          let rid = 'fable51', P = 40000, g = 20;
          const out = el('div'), note = el('div', { class: 'cap' });
          function draw() {
            const R = byId(rid), pin = R.in / 1e6;
            const miss = g <= 5 ? P * R.read / 1e6 : P * 1.25 * pin;
            const pings = g <= 5 ? 0 : Math.ceil(g / 5) - 1;
            const keep = (pings + 1) * P * R.read / 1e6;
            const hour = P * 0.75 * pin + (g <= 60 ? P * R.read / 1e6 : P * 2 * pin);
            const rows = [['Chịu miss (TTL 5 phút)', miss], [`Keep-alive (${pings} lần ping)`, keep], ['TTL 1 giờ (phần ghi thêm 0.75× + lần đọc)', hour]];
            const best = Math.min(...rows.map((r) => r[1]));
            out.replaceChildren(hbars(rows.map(([l, v]) => [l, v, v === best]), { fmt: (v) => usd(v, 4) }));
            note.textContent = `${R.name}: input ${usd(R.in, 2)}/M, đọc ${usd(R.read, 2)}/M. Keep-alive cũng tốn tiền cho phiên mà khách không bao giờ quay lại. Thanh đậm là phương án rẻ nhất.`;
          }
          box.append(el('div', { class: 'row' }, [
            select('Model', [['fable51', 'Claude Fable 5.1'], ['opus55', 'Claude Opus 5.5']], rid, (v) => { rid = v; draw(); }).node,
            slider('Prefix P', 5000, 150000, 5000, P, (v) => { P = v; draw(); }, (v) => tok(v) + ' token').node,
            slider('Khoảng nghỉ', 1, 90, 1, g, (v) => { g = v; draw(); }, (v) => v + ' phút').node]), out, note);
          draw();
        },
        take: 'Không có lựa chọn đúng cho mọi trường hợp. Cần biết khoảng nghỉ thực tế và tỉ lệ khách quay lại, rồi tính.'
      },
      {
        q: 'OpenAI cũ không thu phí ghi. Vậy với provider đó, cache có bao giờ làm tôi tốn hơn không?',
        a: `<p>Không. Khi ghi = 1×, một lần miss tính đúng bằng input thường. Tệ nhất là bạn không được giảm gì. Phần "cache phản tác dụng" chỉ xảy ra khi có phí ghi (Claude, GPT-5.6+, explicit của Qwen) hoặc phí lưu trữ theo giờ (explicit của Doubao, Gemini <code>cachedContents</code>).</p>
<p>Nhưng "không lỗ" khác "đang được lợi". Timestamp trong system prompt vẫn làm mất toàn bộ phần giảm giá. Bảng dưới chạy lại đúng kịch bản 30 lượt của ShopViet trên hai model OpenAI, một có phí ghi, một không:</p>`,
        viz(box) {
          const rows = [['gpt55', 0], ['gpt56', 0]].map(([id, m]) => {
            const R = byId(id), ok = sim({ row: R, mode: m, turns: 30, sys: 8000, u: 300, a: 700, gap: 3, ts: false }), bad = sim({ row: R, mode: m, turns: 30, sys: 8000, u: 300, a: 700, gap: 3, ts: true });
            return `<tr><td>${R.name}</td><td class="mono">${usd(ok.tot.base, 2)}</td><td class="mono ok">${usd(ok.tot.cost, 2)}</td><td class="mono ${bad.tot.cost > bad.tot.base + 1e-9 ? 'bad' : ''}">${usd(bad.tot.cost, 2)}</td></tr>`;
          }).join('');
          box.append(el('div', { class: 'tbl' }, [el('table', { html: '<tr><th>Model</th><th>Không cache</th><th>Cache đúng</th><th>Timestamp ở đầu</th></tr>' + rows })]),
            el('div', { class: 'cap', text: 'Giá từ README §2.3. gpt-5.5 không phí ghi nên timestamp chỉ làm mất phần giảm giá. gpt-5.6-sol ghi 1.25× nên timestamp làm tốn hơn không cache.' }));
        },
        take: 'Cùng một lỗi, ở provider không phí ghi thì "chỉ" mất tiền tiết kiệm, ở provider có phí ghi thì mất thêm tiền thật.'
      },
      {
        q: 'App vẫn trả lời đúng ở cả ba kịch bản. Làm sao biết mình đang trả $0,32 hay $3,42?',
        a: `<p>Đọc <code>usage</code> trong mỗi response. Với Claude có ba field: <code>input_tokens</code> (phần không cache), <code>cache_creation_input_tokens</code> (phần ghi) và <code>cache_read_input_tokens</code> (phần đọc). Tổng input là tổng của cả ba.</p>
<p>Trong mô phỏng này <code>input_tokens</code> luôn bằng 0 vì breakpoint nằm ở block cuối: mọi token đứng trước breakpoint hoặc được đọc, hoặc được ghi, không còn token nào nằm ngoài cache. Ví dụ request 12 cache đúng: đọc 18.300, ghi 1.000, không cache 0, tổng 19.300.</p>
<p>Dấu hiệu cache đang phản tác dụng theo README §3.11: <code>written</code> gần bằng <code>total</code> ở nhiều request liên tiếp. Chọn kịch bản và lượt, JSON bên dưới được dựng từ cùng mô hình tính ở trên.</p>`,
        viz(box) {
          let sc = 'ok', n = 12;
          const pre = el('pre', { class: 'mono', style: 'margin:0;font-size:12.5px;white-space:pre-wrap' }), stat = el('div', { class: 'stat' });
          function draw() {
            const r = sim({ row: byId('opus55'), mode: 0, turns: 30, sys: 8000, u: 300, a: 700, gap: sc === 'ttl' ? 7 : 3, ts: sc === 'ts' }), t = r.turns[n - 1];
            pre.textContent = JSON.stringify({ usage: { input_tokens: t.unc, cache_creation_input_tokens: t.write, cache_read_input_tokens: t.read, output_tokens: 700 } }, null, 2);
            const hr = t.read / t.I, wr = t.write / t.I;
            stat.innerHTML = `<span>Tổng input <b>${tok(t.I)}</b></span><span>Hit rate <b class="${hr > 0.5 ? 'ok' : 'bad'}">${(hr * 100).toFixed(1)}%</b></span><span>written / total <b class="${wr > 0.9 && n > 1 ? 'bad' : ''}">${(wr * 100).toFixed(1)}%</b></span>`;
          }
          box.append(el('div', { class: 'row' }, [
            select('Kịch bản', [['ok', 'Cache đúng'], ['ts', 'Timestamp trong system prompt'], ['ttl', 'Khách nghỉ 7 phút giữa các lượt']], sc, (v) => { sc = v; draw(); }).node,
            slider('Lượt', 1, 30, 1, n, (v) => { n = v; draw(); }).node]), pre, stat,
            el('div', { class: 'cap', text: 'Usage mô phỏng: input_tokens = 0 vì breakpoint đặt ở block cuối. Response thật có thể khác vài token.' }));
          draw();
        },
        take: 'Ghi hit rate và tỉ lệ written / total cho mọi request. Đó là cách duy nhất để phân biệt $0,32 với $3,42.'
      },
      {
        q: 'Vậy lúc nào cũng nên bật cache và đặt breakpoint ở cuối?',
        a: `<p>Với hội thoại tiếp diễn thì gần như luôn nên. README nêu hai trường hợp ngược lại:</p>
<ul><li><b>Request độc lập</b>, mỗi request có phần đuôi riêng không lặp lại (ví dụ câu hỏi một lần kèm kết quả RAG riêng). Breakpoint ở cuối khiến bạn trả phí ghi cho phần đuôi không ai đọc lại. Đặt marker explicit ở cuối phần dùng chung (tools + system) thay vì để tự động ở cuối.</li>
<li><b>Prefix quá ngắn</b> so với ngưỡng tối thiểu của model. Request vẫn chạy, nhưng <code>cache_creation_input_tokens</code> bằng 0. Claude Opus 5.5 cần 512 token, Opus 4.6 cần 4.096.</li></ul>
<p>Còn trong một hội thoại như của ShopViet, câu hỏi và kết quả tra cứu của lượt hiện tại sẽ trở thành lịch sử được đọc lại ở lượt sau, nên ghi chúng là đáng.</p>`,
        take: 'Đặt breakpoint ở chỗ sẽ được đọc lại. Trong hội thoại đó là cuối request; với câu hỏi một lần đó là cuối phần dùng chung.'
      }
    ],
    poc: {
      goal: "Một máy tính thuần Python tái tạo ví dụ 30 lượt ở README §1.4, rồi lập bảng hoà vốn theo số request và bảng chi phí theo khoảng nghỉ giữa các lượt so với TTL.",
      file: "docs/multi-turn-conversation/pocs/04_cache_economics.py",
      run: "uv run docs/multi-turn-conversation/pocs/04_cache_economics.py",
      needs: "Không cần Docker hay model: chỉ <code>numpy</code> và <code>tiktoken</code>, chạy dưới 1 giây.",

      measured: true,

    mount(stage) {
      const S = { row: 'opus55', mode: 0, turns: 30, sys: 8000, u: 300, a: 700, gi: 2, ts: false };

        const W = 640, H = 200, P = 8, bw = (W - P) / S.turns, mx = Math.max(...r.turns.map((t) => Math.max(t.cost, t.base))) || 1, y = (v) => H - (v / mx) * (H - 12);

        } else if (S.ts || why('ttl')) {
          al.push(box('warn', `<b>Mất toàn bộ phần giảm giá nhưng không tốn thêm.</b> ${S.ts ? 'Timestamp làm prefix khác ở mọi request' : `Khoảng nghỉ ${gap} phút vượt TTL ${M.ttl} phút`}, nên không request nào đọc được cache. ${R.name} không thu phí ghi (${M.w}×), miss tính như input thường. Điều này <b>không</b> có nghĩa lỗi vô hại: bạn đang trả gấp ${(R.in / (M.r != null ? M.r * R.in : R.read)).toFixed(0)} lần giá đọc cho phần lặp lại.<br><b>Trong hệ thống thật:</b> theo dõi <code>cached_tokens</code>; hit rate bằng 0 qua nhiều lượt dù prefix dài là dấu hiệu cần tìm chỗ vỡ.`));
        }
        if (why('min')) al.push(box('warn', `<b>${why('min')} request dưới ngưỡng ${tok(R.min)} token nên không được cache.</b> Request vẫn chạy bình thường, chỉ là không có gì được ghi. Điều này <b>không</b> có nghĩa marker đặt sai.<br><b>Trong hệ thống thật:</b> kiểm tra ngưỡng của đúng model trước tiên khi thấy <code>cache_creation_input_tokens</code> bằng 0.`));

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),

    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null

}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {

})();
