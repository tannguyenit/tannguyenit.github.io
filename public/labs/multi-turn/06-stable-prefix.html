const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const PRICE = { inp: 4, w: 5, r: 0.2 };
  const MIN_TOK = 512;
  const est = (s) => Math.ceil(s.length / 3);
  const usd = (x) => '$' + (x < 0.1 ? x.toFixed(4) : x.toFixed(3));
  const fmtT = (n) => Math.round(n).toLocaleString('vi-VN');
  const costOf = (read, write) => (read * PRICE.r + write * PRICE.w) / 1e6;

  function simulate(requests) {
    const entries = new Set();
    let prev = null;
    return requests.map((segs) => {
      let acc = 0, key = '', read = 0, readIdx = -1;
      const keys = segs.map((s) => { key += '|' + s.key; acc += s.tok; return { key, acc }; });
      keys.forEach((k, i) => { if (entries.has(k.key)) { read = k.acc; readIdx = i; } });
      const total = acc, write = total >= MIN_TOK ? total - read : 0, plain = total - read - write;
      segs.forEach((s, i) => { if (s.bp && keys[i].acc >= MIN_TOK) entries.add(keys[i].key); });
      if (total >= MIN_TOK) entries.add(keys[keys.length - 1].key);
      let diff = null;
      if (prev) {
        const i = segs.findIndex((s, j) => !prev[j] || prev[j].key !== s.key);
        diff = i < 0 || i >= prev.length ? null : segs[i].label;
      }
      prev = segs;
      return { segs, total, read, write, plain, readIdx, diff, cost: costOf(read, write) + (plain * PRICE.inp) / 1e6, nocache: (total * PRICE.inp) / 1e6 };
    });
  }

  const USER_MSGS = ['Tai nghe Pro X còn màu đen không?', 'Bảo hành Pro X bao lâu vậy?', 'Nếu đeo không vừa tai thì đổi trả thế nào?', 'Trả góp 6 tháng thì mỗi tháng bao nhiêu?', 'Thôi, kiểm tra giúp đơn SV-4821 của tôi.'];
  const BLOCKS = {
    tools: { name: 'Tool definitions', kind: 'global', tok: 3000, ex: 'tra_don_hang, kiem_kho, tinh_tra_gop + JSON schema' },
    system: { name: 'System prompt tĩnh', kind: 'global', tok: 5000, ex: 'Bạn là trợ lý của ShopViet. Chính sách đổi trả, bảo hành...' },
    profile: { name: 'Hồ sơ khách', kind: 'session', tok: 400, ex: '{"ten":"Minh Anh","hang":"Vàng","tinh":"Đà Nẵng"}' },
    history: { name: 'Lịch sử hội thoại', kind: 'history', tok: 0, ex: 'user₁, assistant₁, ..., assistantₙ₋₁ (chỉ nối thêm)' },
    rag: { name: 'Kết quả RAG', kind: 'turn', tok: 1200, ex: '3 đoạn chính sách khớp câu hỏi của lượt này' },
    time: { name: 'Giờ hiện tại', kind: 'turn', tok: 0, ex: 'Giờ hiện tại: 2026-11-27 14:02' },
    msg: { name: 'Tin nhắn mới', kind: 'turn', tok: 300, ex: USER_MSGS[0] }
  };
  const KIND = { global: 'dùng chung mọi khách', session: 'cố định trong phiên', history: 'chỉ nối thêm', turn: 'đổi mỗi lượt' };
  const timeTok = (n) => est('Giờ hiện tại: 2026-11-27 14:' + String(2 + n * 3).padStart(2, '0'));
  const ASSIST = 700;

  function version(id, n, br) {
    if (id === 'tools') return br.tools ? ['A', 'A', 'B', 'A', 'B'][(n - 1) % 5] : 'v1';
    if (id === 'system') return br.ts ? 'ts' + n : 'v1';
    if (id === 'profile') return br.json ? (n >= 4 ? 'B' : 'A') : 'v1';
    return 't' + n;
  }
  const tokOf = (id, n) => (id === 'time' ? timeTok(n) : BLOCKS[id].tok);

  function buildRequests(order, br, turns = 5) {
    const hi = order.indexOf('history');
    const head = hi < 0 ? order : order.slice(0, hi), tail = hi < 0 ? [] : order.slice(hi + 1);
    const tailSegs = (k) => tail.map((id) => ({ key: 'T' + k + ':' + id + ':' + version(id, k, br), tok: tokOf(id, k), label: BLOCKS[id].name + ' (lượt ' + k + ')', id, turn: k }));
    const reqs = [];
    for (let n = 1; n <= turns; n++) {
      const segs = [];
      head.forEach((id) => segs.push({ key: id + ':' + version(id, n, br), tok: tokOf(id, n), label: BLOCKS[id].name, id, bp: id === 'system' }));
      if (hi >= 0) {
        const from = br.win ? Math.max(1, n - 2) : 1;
        for (let k = from; k < n; k++) segs.push(...tailSegs(k).map((s) => Object.assign(s, { label: 'Lịch sử: ' + s.label })), { key: 'A' + k, tok: ASSIST, label: 'Lịch sử: assistant lượt ' + k, id: 'assistant', turn: k });
        segs.push(...tailSegs(n));
      }
      reqs.push(segs);
    }
    return reqs;
  }

  const RECOMMENDED = ['tools', 'system', 'profile', 'history', 'rag', 'time', 'msg'];
  const NAIVE = ['time', 'tools', 'system', 'profile', 'rag', 'history', 'msg'];

  function analyse(order, br, res) {
    const flags = [];
    const hi = order.indexOf('history');
    const volatileHead = order.slice(0, hi).filter((id) => BLOCKS[id].kind === 'turn');
    const stableTail = order.slice(hi + 1).filter((id) => BLOCKS[id].kind !== 'turn');
    const late = res.slice(1), avgHit = late.reduce((a, r) => a + r.read, 0) / Math.max(1, late.reduce((a, r) => a + r.total, 0));
    const tc = res.reduce((a, r) => a + r.cost, 0), tn = res.reduce((a, r) => a + r.nocache, 0);
    if (volatileHead.length) flags.push({ lvl: 'bad', key: 'vhead', text: 'Khối <b>' + volatileHead.map((i) => BLOCKS[i].name).join(', ') + '</b> đứng trước lịch sử và đổi mỗi lượt. Mọi thứ phía sau nó, gồm toàn bộ lịch sử, phải ghi cache lại ở mỗi request.' });
    if (br.ts) flags.push({ lvl: 'bad', key: 'ts', text: '<b>Giờ trong system prompt</b>: system đổi mỗi lượt, cache chỉ còn đọc được phần đứng trước system.' });
    if (br.tools) flags.push({ lvl: 'bad', key: 'tools', text: '<b>Tools không sort</b>: lượt 3 và 5 rơi vào worker nạp plugin theo thứ tự khác. Tools nằm ở đầu nên lượt 3 mất toàn bộ cache; lượt 4 và 5 chỉ đọc lại được phần mà lần gần nhất cùng thứ tự đã ghi, phần lịch sử ở giữa phải ghi lại.' });
    if (br.json) flags.push({ lvl: 'warn', key: 'json', text: '<b>JSON hồ sơ không sort key</b>: lượt 4 đọc hồ sơ từ Redis thay vì DB, key ra thứ tự khác. Cùng nghĩa nhưng khác byte, cache vỡ từ hồ sơ trở đi.' });
    if (br.win) flags.push({ lvl: 'bad', key: 'win', text: '<b>Cửa sổ trượt 2 lượt</b>: từ lượt 4, lượt cũ nhất bị bỏ nên phần đầu lịch sử đổi mỗi lượt.' });
    if (stableTail.length) flags.push({ lvl: 'warn', key: 'stail', text: 'Khối <b>' + stableTail.map((i) => BLOCKS[i].name).join(', ') + '</b> nằm sau lịch sử nên bị chép lại vào mỗi lượt: lượt 5 mang ' + stableTail.length * 4 + ' bản sao cũ. Với API Claude, tools và system luôn được render trước messages, nên thứ tự này chỉ xảy ra nếu bạn tự chép chúng vào message.' });
    const pi = order.indexOf('profile'), si = Math.max(order.indexOf('system'), order.indexOf('tools'));
    if (pi >= 0 && pi < si) flags.push({ lvl: 'warn', key: 'prof', text: '<b>Hồ sơ khách đứng trước system/tools</b>: trong phiên vẫn hit, nhưng mỗi khách có một prefix riêng, không dùng chung được 8.000 token tools + system giữa các khách.' });
    if (tc > tn) flags.push({ lvl: 'bad', key: 'cost', text: 'Bật cache còn <b>đắt hơn không cache ' + Math.round((tc / tn - 1) * 100) + '%</b>: ' + usd(tc) + ' so với ' + usd(tn) + '. Mỗi request trả phí ghi 1.25× mà không request nào đọc lại được.' });
    return { flags, avgHit, tc, tn };
  }

  function caption(a) {
    const has = (k) => a.flags.some((f) => f.key === k);
    if (has('cost') || has('ts') || has('vhead')) return {
      what: 'Từ lượt 2, phần đọc từ cache chỉ còn ' + Math.round(a.avgHit * 100) + '% input. Tổng chi phí input ' + usd(a.tc) + ' so với ' + usd(a.tn) + ' nếu tắt cache.',
      why: 'Cache khớp theo prefix. Một khối đổi mỗi lượt đứng trước lịch sử làm mọi token phía sau có ngữ cảnh khác, KV của chúng phải tính lại và bị tính giá ghi 1.25×.',
      not: 'Không có nghĩa caching hỏng hay provider lỗi. Câu trả lời vẫn đúng, request vẫn 200. Chỉ có hoá đơn và độ trễ tệ đi.',
      real: 'Đưa giờ, RAG và tin nhắn mới vào phần đuôi của lượt hiện tại; lượt sau giữ nguyên chúng trong lịch sử. Kiểm tra bằng cache_read_input_tokens ở mỗi request.' };
    if (has('tools') || has('json') || has('win')) return {
      what: 'Bố cục đúng, nhưng vẫn có lượt hit tụt. Xem cột "Khác biệt đầu tiên" để thấy khối nào lệch.',
      why: 'Cùng nghĩa không có nghĩa cùng byte. Thứ tự tool, thứ tự key JSON hay việc bỏ lượt cũ đều đổi chuỗi token ở đầu, nên phần phía sau không còn khớp.',
      not: 'Không phải do TTL hay routing: các lượt ở đây cách nhau dưới 5 phút và cùng một nơi xử lý (giả định).',
      real: 'Sort tools theo tên, serialize JSON với key đã sort và separator cố định, rút gọn theo ngưỡng thay vì cửa sổ trượt.' };
    return {
      what: 'Từ lượt 2, mỗi request đọc lại toàn bộ request trước và chỉ ghi phần mới (' + Math.round(a.avgHit * 100) + '% input đọc từ cache).',
      why: 'Mọi thứ đổi theo lượt đều nằm sau lịch sử, nên lượt sau chỉ nối thêm. Request trước là prefix nguyên vẹn của request sau.',
      not: 'Hit cao không đảm bảo hit thật: provider vẫn có thể evict sớm, TTL có thể hết khi khách nghỉ lâu.',
      real: 'Đây là bố cục §3.2. Muốn chắc, so body hai request liên tiếp và theo dõi usage, đừng chỉ đọc code ghép prompt.' };
  }

  return {
    id: 'stable-prefix', nav: '6. Prefix ổn định', ref: '§3.1–3.5',
    title: 'Một dòng giờ hiện tại đặt sai chỗ có thể làm mọi lượt trả giá đầy đủ',
    hook: 'Kéo thả hoặc bấm mũi tên để xếp các khối của prompt, bật các lỗi "âm thầm". Lab mô phỏng 5 lượt chat và tính phần đọc từ cache ở từng lượt.',
    terms: [

      ['Append-only', 'Chỉ nối thêm vào cuối, không sửa, không xoá cái đã có. Như sổ nhật ký viết bằng bút mực: muốn đính chính thì viết dòng mới.'],
      ['Cache read / cache write', 'Đọc cache: token lấy lại KV đã tính sẵn (KV là phần model tính cho từng token, bài 2), giá Claude Opus 5.5 $0,20/MTok. Ghi cache: token tính mới và lưu lại, $5/MTok (TTL 5 phút). Input thường không cache: $4/MTok. Số từ README.'],
      ['Breakpoint', 'Điểm đánh dấu cache_control của Claude: "cache từ đầu prompt tới đây". Ví dụ đặt breakpoint sau system thì tools + system được ghi thành một entry. Automatic caching tự đặt breakpoint ở block (mẩu nội dung) cuối cùng của request; lượt sau request dài thêm nên breakpoint cũng dời xuống cuối mới.'],

    problem: {

      solves: 'Xếp prompt theo độ ổn định (§3.2): thứ dùng chung lâu nhất ở đầu, thứ đổi theo lượt ở đuôi và trở thành lịch sử bất biến ở lượt sau. Lab tính phần đọc cache từng lượt từ bố cục bạn chọn.',
      read: ['Danh sách khối: kéo thả hoặc bấm ↑ ↓ để đổi thứ tự. Nhãn bên phải cho biết khối đổi nhanh cỡ nào.', 'Các nút lỗi âm thầm: bật để mô phỏng lỗi trong bảng §3.3.', 'Hình 5 dòng: mỗi dòng là một request. Phần xanh đọc từ cache, phần cam phải ghi lại. Vạch giữa các ô là ranh giới khối.', 'Bảng: số token, chi phí input theo giá Claude Opus 5.5 trong README, và khối đầu tiên khác request trước.', 'Kích thước tools (3.000), system (5.000), hồ sơ (400), RAG (1.200) là giả định, tổng tools + system = 8.000 như ví dụ §1.4. User 300, assistant 700 token theo §1.4. Giờ hiện tại ước lượng từ chuỗi thật, 1 token ≈ 3 ký tự (giả định).']
    },
    summary: `<h3>Tóm tắt bài</h3>

    deep: [
      {

  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

function pocBlock(p) {
  if (!p) return null;
  return el('div', { class: 'poc' }, [
    el('h3', { text: 'POC: tự chạy để thấy tận mắt' }),
    el('p', { html: p.goal }),
    el('div', { class: 'poc-run' }, [el('span', { text: 'File' }), el('code', { text: p.file }), el('span', { text: 'Chạy' }), el('code', { text: p.run })]),
    p.needs ? el('p', { class: 'hint', html: 'Cần: ' + p.needs }) : null,
    p.output ? el('details', { class: 'poc-out' }, [el('summary', { text: p.measured ? 'Kết quả chạy thật' : 'Kết quả mẫu (chưa chạy thật)' }), el('pre', { text: p.output })]) : null,
    p.read ? el('div', {}, [el('b', { text: 'Nhìn vào đâu' }), el('ol', {}, p.read.map((r) => el('li', { html: r })))]) : null
  ]);
}

(function build() {
  const nav = document.getElementById('tabs'), host = document.getElementById('lessons');
  lessons.forEach((l) => {
    nav.append(el('a', { href: '#' + l.id, text: l.nav }));
    const stage = el('div', { class: 'stage' });
    host.append(el('section', { class: 'lesson', id: l.id }, [
      el('div', { class: 'eyebrow', text: (l.id === 'workflow' ? 'Workflow tổng hợp' : `Bài ${parseInt(l.nav, 10)}`) + ` · README ${l.ref}` }),
      el('h2', { text: l.title }), terms(l.terms), problem(l.problem), el('p', { class: 'hook', text: l.hook }), stage, deepDive(l.deep),
      el('div', { class: 'sum', html: l.summary || '' }),
      el('div', { class: 'why' }, [
        el('div', { class: 'c' }, [el('b', { text: 'Chọn gì, vì sao' }), l.why.c]),
        el('div', { class: 's' }, [el('b', { text: 'Phương án bị loại' }), l.why.s]),
        el('div', { class: 'p' }, [el('b', { text: 'Giá phải trả' }), l.why.p])
      ]),
      pocBlock(l.poc)
    ]));
    try { l.mount(stage); } catch (e) { stage.append(el('p', { class: 'bad', text: 'Lỗi tải minh hoạ: ' + e.message })); }
  });
})();
</script></body></html>
