const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}
lesson((() => {
  const TOKRE = /\n|[^\S\n]*[\p{L}\p{M}\p{N}_]+|[^\S\n]*[^\s\p{L}\p{M}\p{N}_]|[^\S\n]+$/gu;
  const tok = (s) => s.match(TOKRE) || [];
  const fnv = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); };
  const lcpLen = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
  const vi = (n) => Math.round(n).toLocaleString('vi-VN');
  const show = (t) => (t === '\n' ? '↵' : t.trim() || '␠');
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const NEXT_Q = 'Vậy tôi đặt thêm một chiếc Pro X màu trắng nhé.';

      solves: 'Lab so hai request liên tiếp theo đúng cách engine làm: tách token, chia block, hash từng block kèm prefix trước nó, rồi đếm block nào dùng lại được. Bạn sẽ thấy cache chỉ khớp phần đầu chung, và chỉ khớp theo block nguyên.',

    summary: `<h3>Tóm tắt bài</h3>
<p>Inference có hai pha. <b>Prefill</b> đọc cả input một lượt, tính key và value (KV) cho từng token ở từng layer, chạy song song được và tốn compute. <b>Decode</b> sinh từng token, mỗi token attend vào KV của tất cả token trước nó. Prompt caching giữ KV của prefix để request sau có cùng prefix dùng tiếp, giảm phần phải prefill.</p>
<h4>Vì sao chỉ prefix</h4>
<p>Attention là causal. Từ layer thứ hai trở đi, KV của token <code>i</code> phụ thuộc toàn bộ chuỗi <code>[0, i]</code>. Hai request khác nhau ở vị trí 3 thì KV của <code>t0</code> đến <code>t2</code> dùng lại được, KV từ vị trí 3 trở đi phải tính lại, kể cả khi <code>t4</code> đến <code>t7</code> giống hệt. Thứ cần so là <b>chuỗi token sau khi render</b>: khác khoảng trắng, thứ tự key JSON hay cách encode Unicode đều làm chuỗi khác.</p>
<h4>Cache được cài đặt thế nào</h4>
<div class="tbl"><table>
<tr><th>Hệ thống</th><th>Cách làm</th><th>Hệ quả</th></tr>

<tr><td><b>SGLang RadixAttention</b></td><td>Lưu KV trong radix tree theo chuỗi token</td><td>Request có chung prefix với một nhánh thì tái dùng các node đó</td></tr>
<tr><td><b>API thương mại</b></td><td>Thêm chính sách giá (ghi, đọc) và routing (<code>prompt_cache_key</code> của OpenAI, <code>x-grok-conv-id</code> của xAI)</td><td>Request phải đến đúng nơi giữ cache</td></tr>
</table></div>

      s: 'Viết lại một bản "tương đương" của lịch sử (đổi khoảng trắng, sort lại key, chuẩn hoá Unicode): cùng nghĩa nhưng khác token, mất cache từ chỗ khác đầu tiên. Đưa giờ hay ID vào system prompt: vỡ cache ở mọi request. Kỳ vọng engine tự nhận ra đoạn đuôi giống nhau: không thể, vì KV của đoạn đuôi đã khác.',

<p>Prompt caching chỉ cắt phần việc của prefill: token nào đã có KV trong cache thì khỏi tính. Decode không nhanh hơn. Đó là lý do cache giảm thời gian tới token đầu tiên (TTFT) và giảm giá input, nhưng không làm câu trả lời dài sinh nhanh hơn.</p>`,

<p>Nhưng đầu ra của layer 1 cho token <code>t5</code> là một hỗn hợp: attention trộn value của <code>t0</code> đến <code>t5</code>, trong đó có <code>X</code>. Đầu ra đó là <b>đầu vào</b> của layer 2. Vì vậy ở layer 2, KV của <code>t5</code> đã khác, dù chữ <code>t5</code> vẫn y nguyên. Thay đổi lan sang phải từng layer một và không bao giờ lan sang trái, vì token chỉ nhìn được token đứng trước.</p>

function terms(list) {

}

function problem(p) {

  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {

  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [

}
