const SVG_TAGS = ['svg', 'g', 'circle', 'line', 'rect', 'text', 'tspan', 'path', 'polygon', 'defs', 'filter', 'feTurbulence', 'feDisplacementMap', 'marker', 'clipPath', 'title'];
const lessons = [];
const lesson = (def) => lessons.push(def);

function el(tag, attrs = {}, kids = []) {
  const n = SVG_TAGS.includes(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function seeded(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slider(label, min, max, step, value, onInput, fmt = (v) => v) {
  const out = el('output', { text: fmt(value) });
  const input = el('input', { type: 'range', min, max, step, value });
  input.addEventListener('input', () => { out.textContent = fmt(+input.value); onInput(+input.value); });
  const node = el('label', { class: 'ctl' }, [label, input, out]);
  return { node, input, get: () => +input.value };
}

function select(label, options, value, onChange) {
  const s = el('select');
  options.forEach(([v, t]) => s.append(el('option', { value: v, text: t })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return { node: el('label', { class: 'ctl' }, [label, s]), sel: s };
}

function rankList(rowH) {
  const box = el('div', { class: 'rank' });
  const map = new Map();
  function update(items) {
    box.style.height = items.length * rowH + 'px';
    const seen = new Set();
    items.forEach((it, i) => {
      seen.add(it.id);
      let d = map.get(it.id);
      if (!d) { d = el('div', { class: 'it' }); d.style.height = rowH - 4 + 'px'; box.append(d); map.set(it.id, d); }
      d.className = 'it ' + (it.cls || '');
      d.innerHTML = it.html;
      d.style.transform = `translateY(${i * rowH}px)`;
    });
    for (const [id, d] of map) if (!seen.has(id)) d.className = 'it hide';
  }
  return { node: box, update };
}

function fmtNum(n) {
  if (n >= 1e6) return n / 1e6 + 'M';
  if (n >= 1e3) return n / 1e3 + 'k';
  return String(n);
}

  const P = [
    { id: 'claude', name: 'Claude', kind: 'explicit', mech: 'Explicit: đặt <code>cache_control</code> trên block (tối đa 4 breakpoint), hoặc <code>cache_control</code> ở top-level để API tự đặt breakpoint ở block cuối và dịch theo lịch sử.', min: '512–4096 tuỳ model. Opus 5.5, Opus 5, Sonnet 5.5, Haiku 5.5, Fable 5 / 5.1: 512. Opus 4.8, Sonnet 5, Sonnet 4.6, Sonnet 4.5: 1024. Opus 4.7: 2048. Opus 4.6, Opus 4.5, Haiku 4.5: 4096.', ttl: '5 phút (mặc định) hoặc 1 giờ (<code>"ttl": "1h"</code>). Mỗi lần đọc làm mới TTL miễn phí. TTL tính từ lúc <b>bắt đầu</b> request.', price: 'Đọc 0.1× (Opus 5.5: 0.05×, Fable 5.1: 0.025×). Ghi 1.25× (5 phút) / 2× (1 giờ).', ratio: 0.1, ratioTxt: '0.1× (0.025–0.1×)', usage: '<code>usage.cache_read_input_tokens</code>, <code>usage.cache_creation_input_tokens</code>, <code>usage.input_tokens</code> (chỉ phần không cache). Tổng input = cộng cả ba.', routing: 'Không cần. Cache cô lập theo workspace (Claude API) hoặc organization (Bedrock, Vertex).', breaks: ['Thêm / bớt / đổi thứ tự tools, đổi model: mất toàn bộ cache.', 'Sửa system prompt, đổi <code>speed</code>, bật/tắt web search, citations: mất cache system và messages.', 'Đổi <code>tool_choice</code>, ảnh: mất cache messages.', 'Đổi <code>thinking</code> hoặc <code>effort</code>: mất cache messages, phần đầu tuỳ model.', 'Sửa nội dung message: mất từ vị trí đó trở đi.', 'Một lượt thêm hơn 20 vị trí nội dung: breakpoint chỉ dò ngược 20 vị trí, không tìm thấy entry cũ.', 'N request song song cùng prefix: cache chỉ dùng được sau khi response đầu tiên bắt đầu, cả N trả giá đầy đủ.'], reasoning: 'Gửi lại thinking blocks y nguyên. API tự bỏ block model hiện tại không đọc được. Sửa lịch sử phía trước làm block mất hiệu lực.' },
    { id: 'openai', name: 'OpenAI', kind: 'implicit', mech: 'Tự động cho mọi model được hỗ trợ, không cần marker. Toàn bộ prefix đã render phải khớp; lookup đi từ prefix khớp dài nhất về ngắn dần.', min: '1024 token với GPT-5.6+. Model cũ hơn: ngưỡng thay đổi theo cấu hình request. Số token cache làm tròn xuống bội số của 128 (trừ GPT-5.6+).', ttl: 'Trước GPT-5.6: <code>in_memory</code> khoảng 5–10 phút không hoạt động (tối đa 1 giờ), <code>24h</code> thường khoảng 30 phút (tối đa 24 giờ). GPT-5.6+: <code>"30m"</code> (mặc định) hoặc <code>"12h"</code>.', price: 'Đọc 0.1× (GPT-5.x), 0.25× (gpt-4.1, o3), 0.5× (gpt-4o). Ghi: 1× trước GPT-5.6; từ GPT-5.6 là 1.25× (30m) và 2.5× (12h).', ratio: 0.1, ratioTxt: '0.1× (0.1–0.5×)', usage: 'Chat Completions: <code>usage.prompt_tokens_details.cached_tokens</code>. Responses API: <code>usage.input_tokens_details.cached_tokens</code>, <code>cache_write_tokens</code> (GPT-5.6+).', routing: '<code>prompt_cache_key</code>: chỉ là gợi ý routing, không đảm bảo hit. Trên khoảng 15 request/phút cho cùng prefix + key, traffic có thể tràn sang máy khác.', breaks: ['Đổi <code>model</code>.', 'Đổi <code>tools</code>: tên, mô tả, schema hoặc thứ tự.', 'Đổi <code>parallel_tool_calls</code>, <code>text.format</code>, <code>reasoning.effort</code>, <code>text.verbosity</code>.', 'Compaction, summarization hoặc truncation lịch sử.', 'Sửa message cũ thay vì nối thêm.', 'Timestamp hoặc nội dung riêng theo user đặt trước phần ổn định.'], reasoning: 'Responses API: gửi lại toàn bộ item trong <code>output</code> (reasoning items, <code>encrypted_content</code> khi <code>store: false</code>), giữ field <code>phase</code>.' },
    { id: 'deepseek', name: 'DeepSeek', kind: 'implicit', mech: 'Tự động, bật mặc định, cache theo prefix và <b>lưu trên disk</b>. Best effort. Endpoint Anthropic nhận <code>cache_control</code> nhưng <b>bỏ qua</b>.', min: 'Không công bố.', ttl: 'Không cố định. Entry thường bị xoá sau "vài giờ đến vài ngày" không dùng.', price: 'Đọc ~0.02–0.03×. Không phí ghi, không phí lưu trữ. Ví dụ deepseek-v4-pro off-peak: miss $0,66, hit $0,022.', ratio: 0.03, ratioTxt: '~0.02–0.03×', usage: '<code>usage.prompt_cache_hit_tokens</code>, <code>usage.prompt_cache_miss_tokens</code>.', routing: 'Không.', breaks: ['Mọi thay đổi ở prefix (cache khớp theo prefix).', 'Request có <code>tools</code> trong thinking mode mà thiếu <code>reasoning_content</code> của bất kỳ lượt trước nào: lỗi 400.'], reasoning: 'Request có <code>tools</code>: bắt buộc gửi lại <code>reasoning_content</code> của mọi lượt (thiếu là 400). Không có <code>tools</code>: bị bỏ qua.' },
    { id: 'qwen', name: 'Qwen (Alibaba)', kind: 'both', mech: 'Implicit (tự động, không tắt được) + explicit khi request có <code>cache_control</code>. Mỗi request chỉ dùng một chế độ. Explicit tối đa 4 marker, marker trên <code>tools</code> bị bỏ qua.', min: '1024 token (cả hai chế độ).', ttl: 'Explicit 5 phút, làm mới khi hit. Implicit không xác định.', price: 'Explicit: đọc 0.1×, ghi 1.25×. Implicit: đọc 0.2×, ghi 1×.', ratio: 0.1, ratioTxt: '0.1× explicit / 0.2× implicit', usage: '<code>usage.prompt_tokens_details.cached_tokens</code> (+ <code>cache_creation_input_tokens</code> với explicit). Anthropic-compatible: <code>cache_read_input_tokens</code>.', routing: 'Không.', breaks: ['Mọi thay đổi ở prefix.', 'Đặt marker trên <code>tools</code>: bị bỏ qua, không cache theo marker đó.'], reasoning: 'Quy tắc reasoning multi-turn của Qwen API chưa được README xác minh.' },
    { id: 'kimi', name: 'Kimi (Moonshot)', kind: 'implicit', mech: 'Tự động với prefix lặp lại.', min: 'Chưa xác minh.', ttl: '5 phút mặc định.', price: '~0.1× (chưa xác minh). Phí ghi chưa rõ: trang giá vừa ghi K3 tính cache write riêng theo TTL, vừa ghi hit không có phí ghi thêm.', ratio: 0.1, ratioTxt: '~0.1× (chưa xác minh)', usage: '<code>cached_tokens</code> (nguồn thứ ba).', routing: 'Không.', breaks: ['Mọi thay đổi ở prefix.', 'K3 / K3.1: không gửi lại assistant message kèm <code>reasoning_content</code> (FAQ ghi là bắt buộc).'], reasoning: 'K3 / K3.1: bắt buộc gửi lại toàn bộ assistant message kèm <code>reasoning_content</code>. K2.6: <code>thinking.keep</code>.' },
    { id: 'glm', name: 'GLM (Z.ai)', kind: 'implicit', mech: 'Chỉ implicit, tự nhận diện nội dung lặp lại.', min: 'Không công bố.', ttl: 'Không công bố.', price: '~0.18–0.2× theo bảng giá (trang hướng dẫn ghi 50%, README chọn bảng giá). Phí lưu trữ đang miễn phí có thời hạn.', ratio: 0.19, ratioTxt: '~0.18–0.2×', usage: '<code>usage.prompt_tokens_details.cached_tokens</code>.', routing: 'Không.', breaks: ['Mọi thay đổi ở prefix.', 'Preserved thinking bật (<code>clear_thinking: false</code>) mà gửi lại <code>reasoning_content</code> đã sửa hoặc sai thứ tự.'], reasoning: 'Interleaved thinking: trả thinking cùng tool results. Preserved thinking: gửi lại nguyên văn, đúng thứ tự.' },
    { id: 'minimax', name: 'MiniMax', kind: 'implicit', mech: 'Tự động theo prefix.', min: '512 token.', ttl: 'Không công bố.', price: '0.1× (M3.1-Flash: input $0,15, cache read $0,015).', ratio: 0.1, ratioTxt: '0.1×', usage: '<code>cache_read_input_tokens</code> (Anthropic-compatible), <code>prompt_tokens_details.cached_tokens</code> (OpenAI-compatible; bên thứ ba báo field này đôi khi thiếu).', routing: 'Không.', breaks: ['Mọi thay đổi ở prefix.', 'Bỏ <code>reasoning_content</code> khỏi response message khi lưu lịch sử.'], reasoning: 'Giữ nguyên cả assistant message kèm <code>reasoning_content</code>.' },
    { id: 'doubao', name: 'Doubao (Volcengine)', kind: 'both', mech: 'Implicit tự động (không tắt được, không phí lưu trữ) + explicit chỉ trên Responses API với <code>caching.type = "enabled"</code>: chế độ session (<code>previous_response_id</code>) hoặc prefix.', min: '1024 mặc định (tuỳ model 128–8.960). Prefix explicit: 256.', ttl: 'Explicit: <code>expire_at</code>, mặc định 3 ngày, tối đa 7. Hit <b>không</b> gia hạn TTL.', price: '0.2×. Explicit tính thêm phí lưu trữ theo giờ tròn (ví dụ 0,017 CNY / 1M token / giờ).', ratio: 0.2, ratioTxt: '0.2× (+ phí lưu explicit)', usage: '<code>prompt_tokens_details.cached_tokens</code> (Chat), <code>input_tokens_details.cached_tokens</code> (Responses), <code>cache_read_input_tokens</code> (Messages). Batch: <code>cached_tokens</code> luôn là 0.', routing: '<code>previous_response_id</code> (explicit session cache).', breaks: ['Explicit: dùng chung với <code>instructions</code>.', 'Explicit: <code>thinking</code> không nhất quán qua các lượt.', 'Explicit: <code>tools</code> đặt lại ở lượt sau (chỉ nên đặt ở lượt đầu).', 'Implicit và explicit không cùng áp dụng cho một response.'], reasoning: 'README không nêu quy tắc riêng; explicit yêu cầu <code>thinking</code> nhất quán qua các lượt.' },
    { id: 'grok', name: 'xAI Grok', kind: 'implicit', mech: 'Tự động, cache prefix tính từ đầu mảng <code>messages</code>. Cache entry nằm theo từng server.', min: 'Không công bố.', ttl: 'Không công bố. Entry có thể bị evict bất kỳ lúc nào.', price: '0.15–0.25× (grok-4.7: $2 / cached $0,50). Prompt trên 200K: mọi token tính giá long-context.', ratio: 0.25, ratioTxt: '0.15–0.25×', usage: '<code>prompt_tokens_details.cached_tokens</code> (Chat), <code>input_tokens_details.cached_tokens</code> (Responses), <code>cached_prompt_text_tokens</code> (gRPC SDK).', routing: 'Header <code>x-grok-conv-id</code> (Chat Completions) hoặc <code>prompt_cache_key</code> (Responses). Dùng một UUID ổn định cho cả phiên; đổi ID là cố ý bỏ cache.', breaks: ['Sửa bất kỳ message cũ nào.', 'Bỏ <code>reasoning.encrypted_content</code> khi gửi lại: docs ghi là nguyên nhân cache miss hàng đầu.', 'Đổi conversation ID giữa phiên.'], reasoning: 'Gửi lại <code>reasoning.encrypted_content</code> y nguyên.' },
    { id: 'gemini', name: 'Gemini (Google)', kind: 'both', mech: 'Implicit bật mặc định từ Gemini 2.5. Explicit <code>cachedContents</code> chỉ trên generateContent, <b>không</b> hỗ trợ Gemini 4 Argon trở đi.', min: '2048 (Gemini 2.5) / 4096 (Gemini 3.x, 4).', ttl: 'Implicit không công bố. Explicit đặt qua <code>ttl</code>, gia hạn bằng <code>PATCH</code>.', price: 'Đọc 0.1× (3.x), 0.05× (Gemini 4 Argon). Explicit tính thêm phí lưu theo giờ.', ratio: 0.1, ratioTxt: '0.05–0.1×', usage: 'generateContent: <code>usageMetadata.cachedContentTokenCount</code>. Interactions API: <code>usage.total_cached_tokens</code>.', routing: '<code>previous_interaction_id</code> (Interactions API): docs ghi chế độ stateful giúp server tối ưu caching.', breaks: ['Gemini 4: lượt mới thêm ít hơn 2.050 token thì 2.050 token cuối của request trước bị xử lý lại giá chuẩn.', 'Prefix dưới 4.096 token trên Gemini 3.x / 4: chưa có cache.', 'generateContent Gemini 3: thiếu <code>thoughtSignature</code> ở function call trong lượt hiện tại là lỗi 400.'], reasoning: 'generateContent: gửi lại mọi part với <code>thoughtSignature</code> y nguyên. Interactions API stateless: gửi lại mọi <code>thought</code> step.' },
    { id: 'self', name: 'Self-hosted (vLLM, SGLang)', kind: 'self', mech: 'Prefix caching của inference engine bạn tự chạy. Giữa JSON request và model còn <b>chat template</b> (Jinja trong <code>tokenizer_config.json</code>) quyết định chuỗi token thực sự.', min: 'README không nêu; phụ thuộc engine.', ttl: 'README không nêu; phụ thuộc engine.', price: 'Không có bảng giá: bạn trả bằng GPU của mình.', ratio: null, ratioTxt: 'không áp dụng', usage: 'README không nêu field chung; kiểm tra bằng cách render hai request liên tiếp ra chuỗi token rồi so.', routing: 'Bạn tự quyết.', breaks: ['Template chỉ render reasoning của assistant turn sau user message cuối: khối <code>&lt;think&gt;</code> của lượt trước biến mất khi có user message mới (Qwen3 và tương tự).', 'vLLM 0.31 đổi tên <code>reasoning_content</code> thành <code>reasoning</code> trước khi render, một số template Qwen mất reasoning cũ.', 'Template kỳ vọng <code>arguments</code> là object nhưng nhận chuỗi JSON kiểu OpenAI.'], reasoning: 'Phụ thuộc chat template. Kiểm tra bằng cách render và so chuỗi token.' }
  ];

  const SAMPLES = [
    { p: 'anthropic', label: 'Claude, lượt 12', ctx: 'Trợ lý ShopViet trên Claude Opus 5.5, breakpoint ở block cuối.', json: { usage: { input_tokens: 0, cache_creation_input_tokens: 1000, cache_read_input_tokens: 18300, output_tokens: 690 } }, ans: 'hit', why: 'Đọc 18.300 token từ cache, chỉ ghi 1.000 token mới. <code>input_tokens</code> = 0 trông như "không gửi gì", nhưng tổng input là cộng cả ba field = 19.300.' },
    { p: 'anthropic', label: 'Claude, lượt 12 sau deploy mới', ctx: 'Cùng hội thoại, bản deploy mới thêm giờ hiện tại vào đầu system prompt.', json: { usage: { input_tokens: 0, cache_creation_input_tokens: 19300, cache_read_input_tokens: 0, output_tokens: 702 } }, ans: 'miss', why: 'Không đọc gì, ghi lại toàn bộ 19.300 token với giá 1.25×. Đây là dấu hiệu "written gần bằng total" trong README §3.11: prefix đổi ở mỗi request.' },
    { p: 'anthropic', label: 'Claude Opus 4.6, prompt ngắn', ctx: 'Đã đặt <code>cache_control</code> trên system prompt 3.200 token.', json: { usage: { input_tokens: 3200, cache_creation_input_tokens: 0, cache_read_input_tokens: 0, output_tokens: 410 } }, ans: 'miss', why: 'Cả ghi lẫn đọc đều bằng 0: prefix chưa đạt ngưỡng 4.096 token của Opus 4.6. Request vẫn chạy, marker không sai, chỉ là không có gì được cache.' },
    { p: 'chat', label: 'OpenAI Chat Completions, gpt-5.4', ctx: 'Cùng hội thoại ShopViet, lượt 12, input 19.300 token.', json: { usage: { prompt_tokens: 19300, completion_tokens: 512, prompt_tokens_details: { cached_tokens: 18304 } } }, ans: 'hit', why: '18.304 token đọc từ cache. Con số không phải 18.300 vì model trước GPT-5.6 làm tròn xuống bội số của 128 (18.304 = 143 × 128).' },
    { p: 'responses', label: 'OpenAI Responses, gpt-5.6-sol', ctx: 'Khách quay lại sau 45 phút, TTL mặc định <code>"30m"</code>.', json: { usage: { input_tokens: 19300, input_tokens_details: { cached_tokens: 0, cache_write_tokens: 19300 }, output_tokens: 655 } }, ans: 'miss', why: 'Không đọc gì, ghi lại toàn bộ. Với GPT-5.6+ phần ghi tính 1.25×, nên lượt này đắt hơn không cache. Khoảng nghỉ 45 phút vượt TTL 30 phút.' },
    { p: 'deepseek', label: 'DeepSeek', ctx: 'Cùng hội thoại, lượt 12.', json: { usage: { prompt_tokens: 19300, prompt_cache_hit_tokens: 18300, prompt_cache_miss_tokens: 1000, completion_tokens: 700 } }, ans: 'hit', why: 'Tổng = hit + miss = 19.300, hit 18.300. DeepSeek không thu phí ghi, phần miss tính như input thường.' },
    { p: 'gemini', label: 'Gemini 4 Argon, generateContent', ctx: 'Agent loop: request trước 80.000 token, request này chỉ thêm 300 token tool result.', json: { usageMetadata: { promptTokenCount: 80300, cachedContentTokenCount: 77950, candidatesTokenCount: 120 } }, ans: 'hit', why: 'Hit 77.950 / 80.300. Prefix không đổi nhưng 2.050 token cuối của request trước + 300 token mới bị tính giá chuẩn, vì lượt mới thêm ít hơn 2.050 token (quy tắc Gemini 4). Không phải cache vỡ.' },
    { p: 'chat', label: 'xAI Grok, Chat Completions', ctx: 'Lượt 6, mỗi request sinh UUID mới cho header <code>x-grok-conv-id</code>.', json: { usage: { prompt_tokens: 13300, completion_tokens: 640, prompt_tokens_details: { cached_tokens: 0 } } }, ans: 'miss', why: 'Không có token nào từ cache. Cache entry của Grok nằm theo từng server; đổi conversation ID mỗi request là "cố ý bỏ cache". Nếu ID đã ổn định mà vẫn miss, kiểm tra tiếp việc gửi lại <code>reasoning.encrypted_content</code>.' },
    { p: 'chat', label: 'MiniMax, endpoint OpenAI-compatible', ctx: 'Lượt 12.', json: { usage: { prompt_tokens: 19300, completion_tokens: 700 } }, ans: 'unknown', why: 'Không có <code>prompt_tokens_details</code>. Bên thứ ba báo field này đôi khi thiếu trên MiniMax. "Thiếu field" khác "bằng 0": không kết luận được. Dùng endpoint Anthropic-compatible (<code>cache_read_input_tokens</code>) nếu cần đo.' },
    { p: 'chat', label: 'Doubao, chạy qua Batch', ctx: 'Cùng prompt, chạy hàng loạt qua Batch.', json: { usage: { prompt_tokens: 19300, completion_tokens: 700, prompt_tokens_details: { cached_tokens: 0 } } }, ans: 'unknown', why: 'README ghi: với Batch của Doubao, <code>cached_tokens</code> luôn là 0. Con số 0 ở đây không nói gì về hit hay miss.' }
  ];

  function normalize(kind, j) {
    const u = j.usage || {};
    if (kind === 'anthropic') { const c = u.cache_read_input_tokens || 0, w = u.cache_creation_input_tokens || 0; return { cached: c, written: w, total: (u.input_tokens || 0) + c + w, rule: 'input_tokens + cache_creation_input_tokens + cache_read_input_tokens' }; }
    if (kind === 'deepseek') return { cached: u.prompt_cache_hit_tokens, written: 0, total: u.prompt_cache_hit_tokens + u.prompt_cache_miss_tokens, rule: 'prompt_cache_hit_tokens + prompt_cache_miss_tokens' };
    if (kind === 'gemini') { const m = j.usageMetadata; return { cached: m.cachedContentTokenCount || 0, written: 0, total: m.promptTokenCount, rule: 'promptTokenCount (đã gồm phần cached)' }; }
    if (kind === 'responses') { const d = u.input_tokens_details || {}; return { cached: d.cached_tokens, written: d.cache_write_tokens || 0, total: u.input_tokens, rule: 'input_tokens' }; }
    const d = u.prompt_tokens_details;
    return { cached: d ? d.cached_tokens || 0 : 0, missing: !d, written: u.cache_creation_input_tokens || 0, total: u.prompt_tokens, rule: 'prompt_tokens' };
  }
  const tok = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const usd = (v) => '$' + v.toFixed(v >= 0.1 ? 2 : 4).replace('.', ',');

  return {

      ['Explicit caching', 'Bạn đánh dấu chỗ cần cache bằng marker, ví dụ "cache_control": {"type": "ephemeral"} trên block system của Claude. Có TTL rõ ràng, thường có phí ghi.'],
      ['Routing', 'Việc chọn máy chủ nào xử lý request. Cache nằm trên một máy cụ thể, request đến máy khác thì miss dù prefix giống hệt.'],
      ['prompt_cache_key', 'Một chuỗi bạn gửi kèm request OpenAI, ví dụ ID cuộc chat "chat-SV-4821", để gợi ý đưa các request cùng key về cùng máy. Chỉ là gợi ý.'],

<p>README tính ví dụ: tài liệu 100K token trên Gemini 3.8 Flash. Lưu trữ 100K × $0,50/MTok/giờ = $0,05 mỗi giờ. Mỗi request đọc cache tiết kiệm 100K × ($0,75 − $0,075)/MTok ≈ $0,068. Khoảng một request mỗi giờ là đủ bù phí lưu. Ít hơn thì implicit (không phí lưu) có lợi hơn.</p>

      {
        q: 'Tự host model bằng vLLM, gửi lại đúng JSON y nguyên mà vẫn miss. Sao lại thế?',
        a: `<p>Vì inference engine không nhìn JSON, nó nhìn <b>chuỗi token</b> mà chat template render ra. README §2.7: template của Qwen3 và các model tương tự chỉ render reasoning của assistant turn <b>sau</b> user message cuối. Khi có user message mới, khối <code>&lt;think&gt;</code> của lượt trước biến mất khỏi chuỗi render.</p>

        take: 'Khi tự host, kiểm tra cache bằng cách render hai request liên tiếp ra chuỗi token và so, không tin vào JSON message.'
      },
      {
        q: 'Claude báo input_tokens chỉ vài trăm mà agent đã chạy hàng giờ. Context thật sự là bao nhiêu?',

<p>Các provider khác làm ngược lại: <code>prompt_tokens</code> của OpenAI Chat Completions hay <code>promptTokenCount</code> của Gemini đã <b>gồm</b> phần cached. Cộng thêm <code>cached_tokens</code> vào là đếm hai lần.</p>
<p>README §3.11 có hàm <code>normalize_usage</code> chuyển mọi provider về (cached, written, total). Bài tập ở phần chính dùng đúng hàm đó.</p>`,

    mount(stage) {

      function drawCard() {

        pills.replaceChildren(...P.map((x) => el('button', { class: x.id === cur ? 'on' : '', text: x.name, onclick: () => { cur = x.id; drawCard(); } })));

<tr><td>Cơ chế</td><td>${p.mech}</td></tr><tr><td>Min tokens</td><td>${p.min}</td></tr><tr><td>TTL</td><td>${p.ttl}</td></tr>

            (flag ? `<b class="bad">${flag}</b><br>` : '') + s.why }));
        } else result.replaceChildren(el('div', { class: 'hint', text: 'Chọn một đáp án để xem trình duyệt chuẩn hoá usage theo hàm normalize_usage của README §3.11.' }));
        const k = Object.keys(done).length, ok = Object.values(done).filter(Boolean).length;
        score.textContent = k ? `Đã làm ${k} / ${SAMPLES.length}, đúng ${ok}.` : '';
      }

})());
function terms(list) {
  return el('details', { class: 'terms', open: '' }, [el('summary', { text: 'Thuật ngữ cần biết (' + list.length + ')' }),
    el('dl', {}, list.flatMap(([t, d]) => [el('dt', { text: t }), el('dd', { text: d })]))]);
}

function problem(p) {
  const row = (t, html, cls) => el('div', { class: 'pr ' + (cls || '') }, [el('b', { text: t }), el('div', { html })]);
  return el('div', { class: 'prob' }, [
    ...(p.example ? [row('Ví dụ thực tế', p.example, 'ex')] : []), row('Bài toán', p.scenario), row('Câu hỏi', p.ask, 'ask'), row('Giải pháp trong lab này', p.solves, 'sol'),
    row('Cách đọc hình', '<ol>' + p.read.map((r) => '<li>' + r + '</li>').join('') + '</ol>')
  ]);
}

function randn(rnd) {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function unitVec(d, rnd) {
  const v = Array.from({ length: d }, () => randn(rnd));
  const n = Math.hypot(...v);
  return v.map((x) => x / n);
}
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

function hbars(rows, opt = {}) {
  const max = opt.max ?? Math.max(...rows.map((r) => r[1]));
  const fmt = opt.fmt || ((v) => v);
  return el('div', {}, rows.map(([label, v, cur]) => el('div', { class: 'mem' + (cur ? ' cur' : '') }, [
    el('span', { text: label }), el('div', { class: 'track' }, [el('div', { class: 'fill', style: `width:${Math.max(0, (v / max) * 100)}%` })]), el('span', { class: 'v', text: fmt(v) })])));
}

function deepDive(list) {
  if (!list || !list.length) return null;
  return el('div', { class: 'deep' }, [
    el('h3', { text: '10 vạn câu hỏi vì sao' }),
    el('p', { class: 'hint', style: 'margin:0 0 8px', text: 'Mỗi câu trả lời dẫn tới câu hỏi tiếp theo. Đọc theo thứ tự, bấm vào câu hỏi để mở.' }),
    ...list.map((d, i) => {
      const box = el('details', Object.assign({ class: 'qa' }, i === 0 ? { open: '' } : {}), [
        el('summary', {}, [el('span', { class: 'qn', text: String(i + 1) }), el('span', { text: d.q })]),
        el('div', { class: 'qa-a', html: d.a })]);
      if (d.viz) {
        const v = el('div', { class: 'qa-viz' });
        box.append(v);
        try { d.viz(v); } catch (e) { v.append(el('p', { class: 'bad', text: 'Lỗi minh hoạ: ' + e.message })); }
      }
      if (d.take) box.append(el('div', { class: 'qa-take', html: '<b>Rút ra:</b> ' + d.take }));
      return box;
    })]);
}

(function build() {
